name: CI

# What `cargo xtask ci` runs, split into jobs that run in parallel (ADR 0077):
# lint, host tests, the boot tests in shards, the coverage checks and the
# agent pipeline's checks in slices and the aarch64 boot stub (ADR 0154),
# each `cargo xtask ci <part>` or
# `cargo xtask boot-tests --shard <shards>`. The last job, `ci`, passes only if
# every other job passed: it is the required status check, so keep its name.
#
# The kernel, the native programs, xtask, the pipeline tool and the Windows
# test programs are built once, by the two `build` jobs (ADR 0156), and the
# boot, pipeline and chrome jobs only unpack them (`POLY_PREBUILT=1`) and
# boot: only the pipeline's `win-*` slices install Rust (they build their
# Windows test programs). Every job takes about the same time (ADR 0150): the
# boot tests, the pipeline's polycheck and win polycheck are cut into shards
# and slices. `cargo xtask ci lint` checks that the matrices run every shard
# and slice; `cargo xtask boot-tests --list` shows the groups of each shard,
# and the job summaries show how long each group took.
#
# QEMU runs on KVM (xtask uses /dev/kvm when it can open it, after the
# "Let QEMU use KVM" step); one boot job runs the self-test boots on QEMU's
# emulator (TCG) as well.

# `workflow_dispatch` runs the whole CI on any branch without a pull request:
# `gh workflow run ci.yml --ref <branch>` (ADR 0213).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run of the older one. A manual
# run has the group of its branch (`ci-refs/heads/<branch>`): it cancels
# nothing of another branch, a pull request or main (their groups differ),
# and is not cancelled by them; a second manual run of the same branch waits
# for the first.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # What a pull request can skip (ADR 0156, addendum). Any other event, a
  # push to main or a manual run (`workflow_dispatch`), runs everything. The
  # scopes only ever leave out jobs that cannot see the change; a path not
  # named below runs everything:
  #
  # - `host`: anything but prose (ADRs, Markdown files, the generated
  #   progress charts) runs the host tests. Lint and coverage always run (the
  #   coverage step checks that a pull request leaves the generated progress
  #   files alone, ADR 0213).
  # - `heavy`: anything but prose and the coverage tool (`tools/coverage/`,
  #   which only lint and the host tests run) builds and runs the boot and
  #   chrome jobs.
  # - `pipeline`: anything but those and the desktop's package and file
  #   crates and apps (`crates/poly-pkg`, `crates/poly-files`,
  #   `userland/poly-files-app`, `userland/poly-installer-app`: neither the
  #   kernel nor the pipeline tool nor its test programs use them) runs the
  #   pipeline's polycheck and win polycheck.
  # - `aarch64`: the stub's inputs (the kernel tree, the crates, xtask, the
  #   toolchain, Cargo's files, the workflows) run the aarch64 job.
  #
  # A renamed file counts with its old path too; a pull request the files API
  # cannot list in full (3000 files) runs everything.
  changes:
    name: changes (what a pull request runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host: ${{ steps.diff.outputs.host }}
      heavy: ${{ steps.diff.outputs.heavy }}
      pipeline: ${{ steps.diff.outputs.pipeline }}
      aarch64: ${{ steps.diff.outputs.aarch64 }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          scope() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          everything() { for s in host heavy pipeline aarch64; do scope "$s" true; done; }
          if [ "$EVENT" != pull_request ]; then
            everything
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          echo "$files"
          if [ -z "$files" ] || [ "$(echo "$files" | wc -l)" -ge 3000 ]; then
            echo "::notice::the changed files could not be listed in full: everything runs"
            everything
            exit 0
          fi
          prose='^(docs/adr/|docs/progress/|docs/windows/|docs/[^/]+\.md$|[A-Za-z_]+\.md$)'
          host_only="$prose|^tools/coverage/"
          apps="$host_only|^(crates/poly-pkg|crates/poly-files|userland/poly-files-app|userland/poly-installer-app)/"
          aarch64='^(kernel/|crates/|tools/xtask/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|\.github/)'
          # A scope runs when a file is outside what may skip it.
          outside() { if echo "$files" | grep -qvE "$1"; then echo true; else echo false; fi; }
          scope host "$(outside "$prose")"
          scope heavy "$(outside "$host_only")"
          scope pipeline "$(outside "$apps")"
          scope aarch64 "$(if echo "$files" | grep -qE "$aarch64"; then echo true; else echo false; fi)"

  lint:
    name: lint (fmt, clippy, source checks, coverage map)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it
          # was merged into: the coverage step compares the generated files
          # with it.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            kernel
            kernel/src/arch/aarch64
      # The kernel embeds our ntdll.dll; xtask caches it in target/ntdll-cache
      # under a hash of its inputs. This job saves it, the others restore it.
      - name: ntdll.dll's and the Win32 modules' cache keys
        id: keys
        run: |
          echo "ntdll=$(cargo xtask ntdll --cache-key)" >> "$GITHUB_OUTPUT"
          echo "win32=$(cargo xtask win32 --cache-key)" >> "$GITHUB_OUTPUT"
          echo "wow64=$(cargo xtask wow64 --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/ntdll-cache
          key: ${{ steps.keys.outputs.ntdll }}
      # clippy (kernel) embeds the Win32 modules too: 30 s to build them.
      - uses: actions/cache@v4
        with:
          path: target/win32-cache
          key: ${{ steps.keys.outputs.win32 }}
      # The 32-bit modules (ADR 0186).
      - uses: actions/cache@v4
        with:
          path: target/wow64-cache
          key: ${{ steps.keys.outputs.wow64 }}
      - run: cargo xtask ci lint
      # The coverage map's checks are a minute: with lint, which ends sooner
      # than the boots. In a pull request they also fail if the change
      # rewrites what main generates (the README's progress section, the
      # graphics, the ADR index), compared with the merge commit's first
      # parent. Those files are not checked for being out of date: main
      # regenerates them after every merge (progress.yml, ADR 0213).
      - run: cargo xtask ci coverage
        env:
          POLY_PR_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  host-tests:
    name: host tests
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The bundled DejaVu fonts for poly-font's tests on real fonts (ADR
      # 0105): downloaded and checked against their pinned SHA-256 by
      # xtask, kept in a cache by version. Without them those tests skip.
      - name: The fonts' cache
        uses: actions/cache@v4
        with:
          path: target/fonts
          key: fonts-dejavu-2.37
      - name: Fetch the fonts (poly-font's tests on real fonts)
        run: cargo xtask fonts fetch || echo "::warning::could not fetch the fonts; poly-font's tests on them are skipped"
      - run: cargo xtask ci host-tests

  # Builds, once, what the boot, pipeline and chrome jobs boot (ADR 0156):
  # `kernel` the kernel with our ntdll.dll and Win32 modules and those
  # modules' caches, `tools` xtask, the pipeline tool, the native programs and
  # the Windows test programs (Chrome's launcher and probe among them). Each
  # packs its files (the list `cargo xtask prebuild` writes) into an artifact
  # that the other jobs unpack with the `prebuilt` action.
  build:
    name: build (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A fresh checkout gives every source file a new modification time, so
      # cargo rebuilt the 50 unchanged crates the cache holds (40 s). Compare
      # the files' checksums instead.
      RUSTC_BOOTSTRAP: 1
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: true
    strategy:
      fail-fast: false
      matrix:
        part: [kernel, tools]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            kernel
      # The kernel embeds our ntdll.dll and Win32 modules; xtask caches them in
      # target/ntdll-cache and target/win32-cache under a hash of their
      # inputs.
      - name: ntdll.dll's and the Win32 modules' cache keys
        id: keys
        if: matrix.part == 'kernel'
        run: |
          echo "ntdll=$(cargo xtask ntdll --cache-key)" >> "$GITHUB_OUTPUT"
          echo "win32=$(cargo xtask win32 --cache-key)" >> "$GITHUB_OUTPUT"
          echo "wow64=$(cargo xtask wow64 --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.part == 'kernel'
        with:
          path: target/ntdll-cache
          key: ${{ steps.keys.outputs.ntdll }}
      - uses: actions/cache@v4
        if: matrix.part == 'kernel'
        with:
          path: target/win32-cache
          key: ${{ steps.keys.outputs.win32 }}
      - uses: actions/cache@v4
        if: matrix.part == 'kernel'
        with:
          path: target/wow64-cache
          key: ${{ steps.keys.outputs.wow64 }}
      # 7-Zip's 7za.exe for the traced scenario's kit and the 7-Zip
      # scenario's driver (ADR 0087, 0091), kept in a cache by version.
      - name: 7-Zip's cache
        if: matrix.part == 'tools'
        uses: actions/cache@v4
        with:
          path: target/7zip
          key: 7zip-26.05-7zz
      - name: Fetch 7-Zip
        if: matrix.part == 'tools'
        run: cargo xtask win fetch-7zip
      - name: Build
        run: cargo xtask prebuild ${{ matrix.part }} --list target/prebuilt-${{ matrix.part }}.list
      - name: Pack
        run: tar --zstd -cf prebuilt-${{ matrix.part }}.tar.zst -T target/prebuilt-${{ matrix.part }}.list
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.part }}
          path: prebuilt-${{ matrix.part }}.tar.zst
          # Already compressed.
          compression-level: 0
          retention-days: 1

  boot:
    name: boot (${{ matrix.boot }}, ${{ matrix.accel }})
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each entry runs the shards of xtask's CI_BOOT_SHARDS it lists
        # (`cargo xtask boot-tests --list` shows the groups of each); `ci
        # lint` checks that every shard is in exactly one entry. The entries
        # take about the same time (their groups' boots on KVM: 2 to 6
        # minutes). `x11` is true where the root disk wants Xwayland and
        # Mesa; `sevenzip` where 7-Zip is fetched.
        include:
          - boot: x11
            shards: x11,desktop-shell
            accel: auto
            x11: true
          - boot: apps
            shards: desktop-apps
            accel: auto
            x11: true
          - boot: desktop
            shards: desktop
            accel: auto
            x11: true
          - boot: userland
            shards: userland,wintrace
            accel: auto
            x11: true
            sevenzip: true
          - boot: sevenzip
            shards: sevenzip,faults
            accel: auto
            sevenzip: true
          - boot: sevenzip-b
            shards: sevenzip-b
            accel: auto
            sevenzip: true
            mingit: true
          # Every macOS system call test, a boot each: an architecture a job.
          - boot: macho-specs
            shards: macho-specs
            accel: auto
          - boot: macho-specs-a64
            shards: macho-specs-a64
            accel: auto
          - boot: devices
            shards: devices,selftest
            accel: auto
          # The self-test boots on TCG too, so paths only the emulator takes
          # (and its quirks) stay tested.
          - boot: selftest
            shards: selftest
            accel: tcg
    env:
      POLY_QEMU_ACCEL: ${{ matrix.accel }}
      POLY_PREBUILT: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and a static BusyBox (the BusyBox and root disk boots)
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 busybox-static
      # Xwayland and X11 test programs for the root disk (the xwayland boot
      # test, ADR 0118), and Mesa's software drivers, libdrm's modetest and
      # kmscube (the mesa boot test, ADR 0115); without them those tests
      # skip.
      - name: Install Xwayland, X11 test programs, Mesa, modetest and kmscube
        if: matrix.x11
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            xwayland x11-apps x11-utils xterm x11-xkb-utils xkb-data libx11-data xfonts-base
            libgl1-mesa-dri libgbm1 libegl-mesa0 libegl1 libgles2 libdrm-tests kmscube
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner: QEMU runs on TCG (several times slower)"
          fi
      # Everything the boot tests build, the build jobs built: no Rust here.
      - uses: ./.github/actions/prebuilt
      # 7-Zip's 7za.exe and Linux 7zz for the `7zip` and `wintrace` boot tests
      # (ADR 0087, 0091): downloaded and checked against its pinned SHA-256
      # by xtask, kept in a cache by version. If the download fails the boot
      # tests skip, with a warning.
      - name: 7-Zip's cache
        if: matrix.sevenzip
        uses: actions/cache@v4
        with:
          path: target/7zip
          key: 7zip-26.05-7zz
      - name: Fetch 7-Zip (the 7zip and wintrace boot tests)
        if: matrix.sevenzip
        run: target/debug/xtask win fetch-7zip || echo "::warning::could not fetch 7-Zip; the 7zip boot test is skipped"
      # MinGit (Git for Windows) for the `git-win` boot test (ADR 0194): the
      # pinned zip, checked and unpacked by xtask, kept in a cache by version.
      - name: MinGit's cache
        if: matrix.mingit
        uses: actions/cache@v4
        with:
          path: target/mingit
          key: mingit-2.56.1
      - name: Fetch MinGit (the git-win boot test)
        if: matrix.mingit
        run: target/debug/xtask win fetch-git || echo "::warning::could not fetch MinGit; the git-win boot test is skipped"
      - run: target/debug/xtask boot-tests --shard ${{ matrix.shards }}
      - name: Keep the boot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs-${{ matrix.boot }}-${{ matrix.accel }}
          path: |
            target/*.log
            target/*.ppm
          if-no-files-found: ignore
          retention-days: 7

  pipeline:
    name: "pipeline (${{ matrix.slice }})"
    needs: [changes, build]
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      POLY_PREBUILT: 1
      # The `win-*` slices build their Windows test programs with cargo into
      # a cached target directory: compare the files' checksums, not their
      # modification times (a fresh checkout makes every source new).
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: true
    strategy:
      fail-fast: false
      matrix:
        # Exactly xtask's PIPELINE_SHARDS and WIN_PIPELINE_SHARDS (`ci lint`
        # checks): `polycheck`, a QEMU boot per test, runs a quarter of the
        # corpus in each `I/N` (and selfcheck in the first); `win polycheck`
        # a quarter of the green Windows entries' tests in each `win-I/N`
        # (by a hash of the test's name, so each slice's build cache stays
        # warm).
        slice: [1/4, 2/4, 3/4, 4/4, win-1/4, win-2/4, win-3/4, win-4/4]
    steps:
      - uses: actions/checkout@v4
      # Rust installs while the packages and the artifacts come in (only
      # where something is built: the `win-*` slices build Windows test
      # programs).
      - name: Start installing Rust
        if: startsWith(matrix.slice, 'win-')
        run: .github/scripts/rust-start.sh
      # clang++, lld-link and llvm-dlltool build the C++ Windows tests of
      # green Windows entries for `win polycheck` (ADR 0098, 0099).
      - name: Install QEMU and a static BusyBox (and the C++ Windows test tools)
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ startsWith(matrix.slice, 'win-') && 'qemu-system-x86 busybox-static clang lld llvm' || 'qemu-system-x86 busybox-static' }}
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner: QEMU runs on TCG (several times slower)"
          fi
      # `win polycheck` builds Windows test programs with cargo.
      - name: Wait for Rust
        if: startsWith(matrix.slice, 'win-')
        run: .github/scripts/rust-wait.sh
      - uses: ./.github/actions/prebuilt
      # `main` keeps each `win-*` slice's cargo target directory; a pull
      # request restores main's and rebuilds only the programs it changed.
      - name: The Windows test programs' build cache
        id: wincache
        if: startsWith(matrix.slice, 'win-')
        uses: actions/cache/restore@v4
        with:
          path: |
            target/pipeline/windows/cargo
            target/pipeline/windows/cargo32
          key: wintests-${{ strategy.job-index }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: wintests-${{ strategy.job-index }}-${{ hashFiles('rust-toolchain.toml') }}-
      # `win polycheck` runs the DirectWrite entries' tests, which need the
      # system fonts (ADR 0170): the same pinned DejaVu fonts as host tests.
      - name: The fonts' cache
        if: startsWith(matrix.slice, 'win-')
        uses: actions/cache@v4
        with:
          path: target/fonts
          key: fonts-dejavu-2.37
      - name: Fetch the fonts (DirectWrite's tests on Poly)
        if: startsWith(matrix.slice, 'win-')
        run: target/debug/xtask fonts fetch
      - run: target/debug/xtask ci pipeline --shard ${{ matrix.slice }}
      - name: Keep the Windows test programs' build
        if: startsWith(matrix.slice, 'win-') && github.ref == 'refs/heads/main' && steps.wincache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/pipeline/windows/cargo
            target/pipeline/windows/cargo32
          key: wintests-${{ strategy.job-index }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
      - name: Keep the polycheck report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polycheck-run-${{ strategy.job-index }}
          path: |
            target/pipeline/polycheck/run
            target/pipeline/windows/polycheck/run
          if-no-files-found: ignore
          retention-days: 7

  # Chrome for Windows on Poly (ADR 0155, ADR 0214), one job per stage so each
  # shows on its own which stage broke: `s1-headless` (headless --dump-dom,
  # required), `s2-sandbox` (the same with Chrome's sandbox on, required,
  # ADR 0217), `s3-window` (Chrome's window on the desktop: the page painted,
  # a typed URL; QMP clicks), `s3-try` and `s3-try-max` (Chrome started from
  # the desktop's menu, and maximized; ADR 0234) and `s5-gpu` (the default
  # GPU flags, ADR 0211). Chrome for Testing is downloaded here, from
  # Google's public bucket, by `xtask chrome-win fetch` (pinned version, size
  # and SHA-256 checked), and kept only in this repository's Actions cache,
  # keyed by version: never committed, never an artifact. The stages load
  # `data:` pages, so they use no network. `POLY_CHROME_REQUIRED=1` makes a
  # missing package a failure, not a skip. Only the serial logs are kept when a
  # stage fails, never screenshots (a page's pixels).
  chrome:
    name: chrome (${{ matrix.chrome }})
    needs: [changes, build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `shards:` are xtask's CI_BOOT_SHARDS (`ci lint` checks that every
        # shard of the boot job and of this one is run exactly once).
        include:
          - chrome: s1-headless
            shards: chrome-win
          - chrome: s2-sandbox
            shards: chrome-win-sandbox
          - chrome: s3-window
            shards: chrome-win-window
          - chrome: s3-try
            shards: chrome-try
          - chrome: s3-try-max
            shards: chrome-try-max
          - chrome: s5-gpu
            shards: chrome-win-gpu
    env:
      POLY_QEMU_ACCEL: auto
      POLY_PREBUILT: 1
      POLY_CHROME_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      # No Rust here: the launcher and the probe come from `build (tools)`,
      # the Win32 modules whose exports `polystub.dll` covers from
      # `build (kernel)`.
      - name: Install QEMU
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner: QEMU runs on TCG (Chrome is several times slower)"
          fi
      - uses: ./.github/actions/prebuilt
      # The fonts of the disk (ADR 0181): the same pinned DejaVu as host tests.
      - name: The fonts' cache
        uses: actions/cache@v4
        with:
          path: target/fonts
          key: fonts-dejavu-2.37
      - name: Fetch the fonts
        run: target/debug/xtask fonts fetch
      - name: Fetch the cursor theme (ADR 0252)
        run: target/debug/xtask cursors fetch || echo "::warning::could not fetch the cursor theme; the desktop draws Poly's own pointer"
      # Only the archive is cached (210 MB): xtask checks it against the pinned
      # SHA-256 on every run and unpacks it, so a bad cache entry is not used.
      # `main` saves it; a pull request restores main's, or downloads it once.
      - name: Chrome for Testing's cache
        uses: actions/cache@v4
        with:
          path: target/chrome-win/157.0.8103.38/chrome-win64.zip
          key: chrome-win-157.0.8103.38
      - name: Fetch Chrome for Testing 157.0.8103.38 (checked against its pinned SHA-256)
        run: target/debug/xtask chrome-win fetch
      - name: Chrome stage ${{ matrix.chrome }}
        run: target/debug/xtask boot-tests --shard ${{ matrix.shards }}
      - name: Keep the serial logs
        id: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-logs-${{ matrix.chrome }}
          path: |
            target/chrome-win/*.log
            target/win-app/*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Say which stage failed, and where its log is
        if: failure()
        env:
          STAGE: ${{ matrix.chrome }}
          LOGS: ${{ steps.logs.outputs.artifact-url }}
        run: |
          {
            echo "### Chrome for Windows: stage \`$STAGE\` failed"
            echo
            echo "The step \"Chrome stage $STAGE\" has the stage's report; the serial logs are kept as an artifact: ${LOGS:-none found}"
          } >> "$GITHUB_STEP_SUMMARY"

  aarch64:
    name: aarch64 stub (unit tests, QEMU virt on TCG)
    needs: changes
    if: needs.changes.outputs.aarch64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The aarch64 machine of QEMU; the stub runs on its emulator (TCG)
      # on every runner, whatever the host CPU.
      - name: Install QEMU (aarch64)
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-arm
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            kernel/src/arch/aarch64
      - run: cargo xtask ci aarch64

  # The required status check. `always()`: it runs, and fails, when a job it
  # needs failed or was cancelled (a skipped required check would count as
  # passing). A job may be skipped, and count as passed, only when `changes`
  # succeeded and its scope says this pull request does not reach the job;
  # any other result but success fails.
  ci:
    if: always()
    needs: [changes, lint, host-tests, build, boot, pipeline, chrome, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          HOST: ${{ needs.changes.outputs.host }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          PIPELINE: ${{ needs.changes.outputs.pipeline }}
          AARCH64: ${{ needs.changes.outputs.aarch64 }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "scopes: host=$HOST heavy=$HEAVY pipeline=$PIPELINE aarch64=$AARCH64"
          echo "$NEEDS" | jq -e --arg host "$HOST" --arg heavy "$HEAVY" --arg pipeline "$PIPELINE" --arg aarch64 "$AARCH64" '
            def may_skip($job):
              ($job == "host-tests" and $host == "false")
              or (($job | IN("build", "boot", "chrome")) and $heavy == "false")
              or ($job == "pipeline" and $pipeline == "false")
              or ($job == "aarch64" and $aarch64 == "false");
            .changes.result == "success"
            and (to_entries | all(.value.result == "success" or (.value.result == "skipped" and may_skip(.key))))' > /dev/null
