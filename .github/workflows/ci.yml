name: CI

# What `cargo xtask ci` runs, split into jobs that run in parallel (ADR 0077):
# lint, host tests, the boot tests in shards, the coverage checks and the
# agent pipeline's checks in slices, each `cargo xtask ci <part>` or
# `cargo xtask boot-tests --shard <shards>`. The last job, `ci`, passes only if
# every other job passed: it is the required status check, so keep its name.
#
# The kernel, the native programs, xtask, the pipeline tool and the Windows
# test programs are built once, by the two `build` jobs (ADR 0151), and the
# boot and pipeline jobs only unpack them (`POLY_PREBUILT=1`) and boot. Every
# job takes about the same time (ADR 0150): the boot tests and the pipeline's
# polycheck are cut into shards and slices. `cargo xtask ci lint` checks
# that the matrices run every shard and slice; `cargo xtask boot-tests
# --list` shows the groups of each shard, and the job summaries show how long
# each group took.
#
# QEMU runs on KVM (xtask uses /dev/kvm when it can open it, after the
# "Let QEMU use KVM" step); one boot job runs the self-test boots on QEMU's
# emulator (TCG) as well.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run of the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only changes prose (ADRs, Markdown files, the
  # generated progress charts) skips the jobs that run programs: host tests,
  # the boot tests and the pipeline. Lint and coverage always run (the
  # coverage job checks README.md and docs/ROADMAP.md against coverage/).
  changes:
    name: changes (code or prose)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(docs/adr/|docs/progress/|docs/windows/|docs/[^/]+\.md$|[A-Za-z_]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::only prose changed: host tests, boot tests and pipeline are skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (fmt, clippy, source checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            kernel
      # The kernel embeds our ntdll.dll; xtask caches it in target/ntdll-cache
      # under a hash of its inputs. This job saves it, the others restore it.
      - name: ntdll.dll's cache key
        id: ntdll
        run: echo "key=$(cargo xtask ntdll --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/ntdll-cache
          key: ${{ steps.ntdll.outputs.key }}
      - run: cargo xtask ci lint

  host-tests:
    name: host tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The bundled DejaVu fonts for poly-font's tests on real fonts (ADR
      # 0105): downloaded and checked against their pinned SHA-256 by
      # xtask, kept in a cache by version. Without them those tests skip.
      - name: The fonts' cache
        uses: actions/cache@v4
        with:
          path: target/fonts
          key: fonts-dejavu-2.37
      - name: Fetch the fonts (poly-font's tests on real fonts)
        run: cargo xtask fonts fetch || echo "::warning::could not fetch the fonts; poly-font's tests on them are skipped"
      - run: cargo xtask ci host-tests

  # Builds, once, what the boot and pipeline jobs boot (ADR 0151): `kernel`
  # the kernel with our ntdll.dll and Win32 modules and the native programs,
  # `tools` xtask, the pipeline tool and the Windows test programs. Each
  # packs its files (the list `cargo xtask prebuild` writes) into an artifact
  # that the other jobs unpack with the `prebuilt` action.
  build:
    name: build (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [kernel, tools]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            kernel
      # The kernel embeds our ntdll.dll and Win32 modules; xtask caches them in
      # target/ntdll-cache and target/win32-cache under a hash of their
      # inputs.
      - name: ntdll.dll's and the Win32 modules' cache keys
        id: keys
        if: matrix.part == 'kernel'
        run: |
          echo "ntdll=$(cargo xtask ntdll --cache-key)" >> "$GITHUB_OUTPUT"
          echo "win32=$(cargo xtask win32 --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.part == 'kernel'
        with:
          path: target/ntdll-cache
          key: ${{ steps.keys.outputs.ntdll }}
      - uses: actions/cache@v4
        if: matrix.part == 'kernel'
        with:
          path: target/win32-cache
          key: ${{ steps.keys.outputs.win32 }}
      # 7-Zip's 7za.exe for the traced scenario's kit and the 7-Zip
      # scenario's driver (ADR 0087, 0091), kept in a cache by version.
      - name: 7-Zip's cache
        if: matrix.part == 'tools'
        uses: actions/cache@v4
        with:
          path: target/7zip
          key: 7zip-26.05-7zz
      - name: Fetch 7-Zip
        if: matrix.part == 'tools'
        run: cargo xtask win fetch-7zip
      - name: Build
        run: cargo xtask prebuild ${{ matrix.part }} --list target/prebuilt-${{ matrix.part }}.list
      - name: Pack
        run: tar --zstd -cf prebuilt-${{ matrix.part }}.tar.zst -T target/prebuilt-${{ matrix.part }}.list
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.part }}
          path: prebuilt-${{ matrix.part }}.tar.zst
          # Already compressed.
          compression-level: 0
          retention-days: 1

  boot:
    name: boot (${{ matrix.boot }}, ${{ matrix.accel }})
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each entry runs the shards of xtask's CI_BOOT_SHARDS it lists
        # (`cargo xtask boot-tests --list` shows the groups of each); `ci
        # lint` checks that every shard is in exactly one entry. The entries
        # take about the same time (their groups' boots, in seconds on KVM:
        # core 125, userland 140, sevenzip 130, desktop-shell 140, x11 90,
        # wintrace 215). `x11` is true where the root disk wants Xwayland and
        # Mesa; `sevenzip` where 7-Zip is fetched.
        include:
          - boot: core
            shards: selftest,devices,faults
            accel: auto
          - boot: userland
            shards: userland,desktop
            accel: auto
            x11: true
          - boot: sevenzip
            shards: sevenzip
            accel: auto
            sevenzip: true
          - boot: desktop
            shards: desktop-shell
            accel: auto
            x11: true
          - boot: x11
            shards: x11
            accel: auto
            x11: true
          - boot: wintrace
            shards: wintrace
            accel: auto
            sevenzip: true
          # The self-test boots on TCG too, so paths only the emulator takes
          # (and its quirks) stay tested.
          - boot: selftest
            shards: selftest
            accel: tcg
    env:
      POLY_QEMU_ACCEL: ${{ matrix.accel }}
      POLY_PREBUILT: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and a static BusyBox (the BusyBox and root disk boots)
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 busybox-static
      # Xwayland and X11 test programs for the root disk (the xwayland boot
      # test, ADR 0118), and Mesa's software drivers, libdrm's modetest and
      # kmscube (the mesa boot test, ADR 0115); without them those tests
      # skip.
      - name: Install Xwayland, X11 test programs, Mesa, modetest and kmscube
        if: matrix.x11
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            xwayland x11-apps x11-utils xterm x11-xkb-utils xkb-data libx11-data xfonts-base
            libgl1-mesa-dri libgbm1 libegl-mesa0 libegl1 libgles2 libdrm-tests kmscube
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner: QEMU runs on TCG (several times slower)"
          fi
      # The boot tests build a few small programs with rustc (the Linux
      # hello worlds); everything big comes from the build jobs.
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/prebuilt
      # 7-Zip's 7za.exe and Linux 7zz for the `7zip` and `wintrace` boot tests
      # (ADR 0087, 0091): downloaded and checked against its pinned SHA-256
      # by xtask, kept in a cache by version. If the download fails the boot
      # tests skip, with a warning.
      - name: 7-Zip's cache
        if: matrix.sevenzip
        uses: actions/cache@v4
        with:
          path: target/7zip
          key: 7zip-26.05-7zz
      - name: Fetch 7-Zip (the 7zip and wintrace boot tests)
        if: matrix.sevenzip
        run: target/debug/xtask win fetch-7zip || echo "::warning::could not fetch 7-Zip; the 7zip boot test is skipped"
      - run: target/debug/xtask boot-tests --shard ${{ matrix.shards }}
      - name: Keep the boot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs-${{ matrix.boot }}-${{ matrix.accel }}
          path: |
            target/*.log
            target/*.ppm
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage (map, README)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci coverage

  pipeline:
    name: "pipeline (${{ matrix.slice }}, selfcheck, polycheck, win polycheck)"
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      POLY_PREBUILT: 1
    strategy:
      fail-fast: false
      matrix:
        # Exactly xtask's PIPELINE_SHARDS (`ci lint` checks): `polycheck`, a
        # QEMU boot per test, runs a third of the corpus in each; the first
        # slice also runs selfcheck and win polycheck.
        slice: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      # clang++, lld-link and llvm-dlltool build the C++ Windows tests of
      # green Windows entries for `win polycheck` (ADR 0098, 0099).
      - name: Install QEMU, a static BusyBox and the C++ Windows test tools
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 busybox-static clang lld llvm
      - name: Let QEMU use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner: QEMU runs on TCG (several times slower)"
          fi
      # `win polycheck` builds Windows test programs with cargo.
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/prebuilt
      - run: target/debug/xtask ci pipeline --shard ${{ matrix.slice }}
      - name: Keep the polycheck report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polycheck-run-${{ strategy.job-index }}
          path: |
            target/pipeline/polycheck/run
            target/pipeline/windows/polycheck/run
          if-no-files-found: ignore
          retention-days: 7

  # The required status check. `always()`: it runs, and fails, when a job it
  # needs failed or was cancelled (a skipped required check would count as
  # passing). The jobs that run programs are skipped, and count as passed,
  # only when the change is prose alone (`changes`).
  ci:
    if: always()
    needs: [changes, lint, host-tests, build, boot, coverage, pipeline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg code "$CODE" '
            to_entries | all(
              .value.result == "success"
              or (.value.result == "skipped" and $code == "false"
                  and (.key | IN("host-tests", "build", "boot", "pipeline"))))' > /dev/null
