# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/mach/_kernelrpc_mach_vm_allocate_trap.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# _kernelrpc_mach_vm_allocate_trap.tests/macos.json.
id: macos/syscall/mach/_kernelrpc_mach_vm_allocate_trap
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-17
summary: >
  Mach trap, no libSystem: x86_64 `syscall` with rax = 0x1000000 | 10;
  arm64 `svc #0x80` with x16 = -10. The result is the kern_return_t in rax
  / x0; there is no carry-flag convention. A task port that is not valid
  makes the trap return MACH_SEND_INVALID_DEST (0x10000003).
  vm_allocate(task, address pointer, size, flags) with VM_FLAGS_ANYWHERE
  (1) allocates zero-filled readable and writable memory at an address it
  picks (non-zero, page aligned: 16384 on arm64) and stores it; the size
  is rounded up to whole pages (1 gives a page, its last byte usable). The
  memory is an ordinary mapping: mprotect and munmap work on it (then
  mprotect is ENOMEM), mincore shows touched pages in core, fork copies
  it. Errors: a size that cannot fit (1 << 60) is KERN_NO_SPACE (3); flags
  with unknown bits (0x7fffffff) KERN_INVALID_ARGUMENT (4); an address
  pointer at address 8 KERN_MEMORY_ERROR (10); an invalid task
  MACH_SEND_INVALID_DEST. A size of 0 succeeds and writes address 0
  (values). Not tested: VM_FLAGS_FIXED at 0x300000000 gave KERN_NO_SPACE
  on the oracle.
returns:
  success: "KERN_SUCCESS (0), *address = the memory"
errors:
  no_space: "KERN_NO_SPACE (3)"
  bad_flags: "KERN_INVALID_ARGUMENT (4)"
  bad_pointer: "KERN_MEMORY_ERROR (10)"
  invalid_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "memory is mapped"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
