# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/mach/semaphore_signal_thread_trap.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# semaphore_signal_thread_trap.tests/macos.json.
id: macos/syscall/mach/semaphore_signal_thread_trap
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-17
summary: >
  Mach trap, no libSystem: x86_64 `syscall` with rax = 0x1000000 | 35;
  arm64 `svc #0x80` with x16 = -35. The result is the kern_return_t in rax
  / x0; there is no carry-flag convention. A task port that is not valid
  makes the trap return MACH_SEND_INVALID_DEST (0x10000003).
  semaphore_signal_thread_trap(name, thread name) wakes one specific
  waiting thread of a semaphore, or any waiter when the thread name is 0.
  A name that is not in the task (0, MACH_PORT_DEAD, an unknown name) is
  KERN_INVALID_NAME (15); the task's and thread's own ports are
  KERN_INVALID_CAPABILITY (20); a receive right (a reply port) is
  KERN_INVALID_RIGHT (17); each call returns at once, also in a forked
  child, and leaves the rights as they were. The thread name is checked as
  well: a name that is neither 0 nor a thread port (unknown, the task's
  port, a receive right) is KERN_INVALID_ARGUMENT (4) whatever the
  semaphore name is; with a thread port or 0 the semaphore name's own
  error follows. No semaphore name could be obtained: a semaphore port is
  made by sending a message to the task port, and sending with
  mach_msg_trap is fatal on this platform (see mach_msg_trap), so only the
  refusals are observed; the success paths (signal, wake, wait, timeout)
  are not specified.
returns:
  success: "KERN_SUCCESS (0): not observed"
errors:
  invalid_name: "KERN_INVALID_NAME (15): the semaphore name is MACH_PORT_NULL, MACH_PORT_DEAD or not in the task"
  wrong_object: "KERN_INVALID_CAPABILITY (20) / KERN_INVALID_RIGHT (17): the semaphore name is a task, thread or receive right"
  invalid_thread: "KERN_INVALID_ARGUMENT (4): the thread name is not 0 and not a thread port"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
