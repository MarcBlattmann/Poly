# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/mach/_kernelrpc_mach_port_type_trap.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# _kernelrpc_mach_port_type_trap.tests/macos.json.
id: macos/syscall/mach/_kernelrpc_mach_port_type_trap
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-17
summary: >
  Mach trap, no libSystem: x86_64 `syscall` with rax = 0x1000000 | 76;
  arm64 `svc #0x80` with x16 = -76. The result is the kern_return_t in rax
  / x0; there is no carry-flag convention. A task port that is not valid
  makes the trap return MACH_SEND_INVALID_DEST (0x10000003).
  port_type(task, name, type pointer) stores the rights a name holds as a
  bit set (<mach/port.h>): SEND 0x10000, RECEIVE 0x20000, SEND_ONCE
  0x40000, PORT_SET 0x80000, DEAD_NAME 0x100000. A new receive right is
  0x20000, with a send right 0x30000; the task's, thread's and host's own
  names are 0x10000; a port set 0x80000. When the receive right of a port
  with a send right is destroyed, the send right's name becomes a dead
  name (0x100000), which deallocate removes (then KERN_INVALID_NAME 15).
  An unknown name and MACH_PORT_NULL are KERN_INVALID_NAME and write
  nothing; MACH_PORT_DEAD (0xffffffff) is a dead name (KERN_SUCCESS,
  0x100000); an invalid task is MACH_SEND_INVALID_DEST; a type pointer at
  address 8 is KERN_MEMORY_ERROR (10, a value).
returns:
  success: "KERN_SUCCESS (0), *type = the bit set"
errors:
  no_such_name: "KERN_INVALID_NAME (15): unknown name, MACH_PORT_NULL"
  invalid_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
