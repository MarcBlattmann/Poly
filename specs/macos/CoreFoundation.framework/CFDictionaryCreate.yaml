# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFDictionaryCreate.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFDictionaryCreate.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFDictionaryCreate
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFDictionaryCreate(alloc, keys, values, numValues, keyCallBacks, valueCallBacks) makes an immutable
  dictionary from numValues key/value pairs copied from the two lists. Keys are told apart with the
  key callbacks' hash and equal functions (CFHash and CFEqual for kCFTypeDictionaryKeyCallBacks: a
  string made apart finds the entry of a constant string; a number 1 of any type finds the same key;
  the string '1' and the number 1 are different keys). When equal keys are given twice the first pair
  is kept (count 1, value 'first'). Count 0 is allowed, also with NULL lists. The key retain callback
  is called once per key and the value retain once per value when stored, release once each when
  freed; NULL keyCallBacks compares keys by pointer and stores them raw, NULL valueCallBacks stores
  values raw (NULL values allowed then). CFDictionaryCreateCopy gives an equal dictionary.
  CFDictionaryCreateMutable(alloc, capacity, keyCB, valueCB) starts empty whatever capacity and grows
  (200 pairs tried); CreateMutableCopy copies and leaves the original. Lookups: GetCount, ContainsKey,
  ContainsValue (value equal callback; case sensitive), GetCountOfKey (1 or 0), GetValue.
  CFDictionarySetValue on an immutable dictionary raises an exception.
returns:
  success: "a new dictionary"
errors:
  null_lists_with_count: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
  set_on_immutable: "raises an exception"
side_effects: "allocates; calls retain callbacks per key and value"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: 
  - "retain callbacks run during creation; release callbacks while freed"
timing:
  typical: "microseconds; linear in numValues"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
