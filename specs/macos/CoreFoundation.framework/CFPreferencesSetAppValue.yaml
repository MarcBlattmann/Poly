# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFPreferencesSetAppValue.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFPreferencesSetAppValue.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFPreferencesSetAppValue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFPreferencesSetAppValue(key, value, applicationID) stores a copy of a property list value for the
  key in the domain for the current user, visible to CFPreferencesCopyAppValue and
  CFPreferencesGetAppBooleanValue / GetAppIntegerValue (true for a Boolean true, 42 for an integer 42
  with the optional Boolean set to true; false/0 and the flag cleared for a missing key) at once in
  the same process; it replaces an earlier value (also of another type) and a NULL value removes the
  key (removing a key that is not there does nothing). The preferences keep their own copy: later
  changes to a mutable value do not show. Keys are case sensitive and may be empty or non-ASCII
  ('café'); CFPreferencesCopyKeyList(applicationID, kCFPreferencesCurrentUser, kCFPreferencesAnyHost)
  lists the keys set (a new array of strings, in no fixed order) and is NULL when there are none.
  CFPreferencesCopyValue(key, app, user, host) with kCFPreferencesCurrentUser/kCFPreferencesAnyHost
  sees the same value; with kCFPreferencesAnyUser or kCFPreferencesCurrentHost it sees nothing for
  these keys. The value is written to disk later by the system, not by this call; the call does not
  change the caller's retain count of the value.
returns:
  success: "nothing"
errors:
  null_application_id: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
  unsupported_value_type: "not a property list type: undefined"
side_effects: "changes the process's view of the domain at once; the system writes ~/Library/Preferences/<domain>.plist later"
threading: "thread safe"
ordering: 
  - "the change is visible to later reads in the same process before it reaches the file"
timing:
  typical: "microseconds in the process; the file follows a few seconds later"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
