# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFHash.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFHash.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFHash
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFHash(cf) returns an unsigned hash: equal objects (CFEqual) have the same hash, including numbers
  of different types with the same value and a number 1 and kCFBooleanTrue. What the tests pin down:
  an integer number hashes to its absolute value times 2654435761 as a 64-bit unsigned product (0 for
  0, 2654435761 for 1 and -1, 13272178805 for 5 and -5, 32769009469545 for 12345), a double that is a
  whole number hashes like the integer (1.0 like 1); kCFBooleanTrue hashes like 1 (2654435761) and
  kCFBooleanFalse like 0; an array, dictionary or set hashes to its element count (0 when empty); the
  empty string and empty data hash to 0; a string hashes the same every time and differently for these
  different strings. Other values seen, informative only and not tested: kCFNull 1984, "a" 1062, "abc"
  516202353, data 1,2,3 hashes to 18, double 2.5 hashes to a large negative number as a signed 64-bit
  value. Any hash that respects equality is sufficient for the dictionary and set behaviour; the
  integer rule matters where a program inspects hashes.
returns:
  success: "a CFHashCode (unsigned long, 64 bits)"
errors:
  null: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "microseconds; linear in the length of a string or data"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
