# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFPreferencesCopyAppValue.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFPreferencesCopyAppValue.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFPreferencesCopyAppValue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFPreferencesCopyAppValue(key, applicationID) returns a new reference to the value stored for the
  key in the current user's preferences of the domain, as a property list type: strings, numbers,
  Booleans (the constants), data, arrays, dictionaries and dates come back as the same type and
  content; a key never set gives NULL; keys are case sensitive. The caller gets a snapshot: a mutable
  string, array or dictionary changed after it was set does not change what is read. In the same
  process a set is visible at once, with no synchronise in between. Besides the domain's own keys a
  read also sees the user's global values: a key every user has, AppleLanguages (an array of at least
  one string), is returned for any applicationID and equals the value read with
  kCFPreferencesAnyApplication; keys of the test domain are not in the global domain.
  kCFPreferencesCurrentApplication means the main bundle's identifier (a test run from inside an app
  with CFBundleIdentifier 'test.poly.cfspec.currentapp' reads and writes that domain through either
  name). The numeric width of a stored integer is not specified: it was SInt32 straight after a set in
  the same process and SInt64 in one run that read a value stored by an earlier process (tests compare
  values, not widths). Tests use only domains named 'test.poly.cfspec.<name>' and remove every key
  they set (a domain with no keys is left as an empty plist file by the system, which the spec agent
  deletes; the system writes these files asynchronously, a few seconds after a change, so file
  contents are not part of the behaviour).
returns:
  found: "a new reference to a copy of the value"
  absent: "NULL"
errors:
  null_application_id: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
  null_key: "NULL result"
side_effects: "may start talking to the preferences daemon on first use"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "first call milliseconds (daemon connection); later microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
