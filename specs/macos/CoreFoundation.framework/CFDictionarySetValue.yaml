# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFDictionarySetValue.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFDictionarySetValue.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFDictionarySetValue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFDictionarySetValue(dict, key, value) on a mutable dictionary adds the pair or, when an equal key
  is present, replaces its value (count unchanged); AddValue only adds when the key is new (an
  existing key keeps its value), ReplaceValue only replaces when the key exists (a missing key is not
  added), RemoveValue removes a pair and ignores a missing key, RemoveAllValues empties it. With the
  standard callbacks a new pair retains the key and the value; replacing a value retains the new one
  and releases the old one while the stored key stays the one stored first (its count does not
  change); removing releases both; so retain counts balance. Keys: case sensitive, an empty string
  allowed. Setting on an immutable dictionary raises an Objective-C exception; NULL keys or values
  with the standard callbacks are not supported.
returns:
  success: "nothing"
errors:
  not_mutable: "raises an exception"
  null_with_type_callbacks: "not supported"
side_effects: "retains new key and value, releases a replaced value"
threading: "not thread safe for writers"
ordering: []
timing:
  typical: "amortised constant time"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
