# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFDictionaryGetValue.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFDictionaryGetValue.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFDictionaryGetValue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFDictionaryGetValue(dict, key) returns the stored value pointer (the very object, not retained for
  the caller) for the entry whose key is equal to key, or NULL when there is none. Equality is the key
  callbacks': for the standard table by CFEqual and CFHash (numbers of different types with the same
  value find each other; strings case sensitive). CFDictionaryGetValueIfPresent(dict, key, &value)
  returns true and stores the value, or false and leaves *value alone; a NULL stored value (possible
  with NULL value callbacks) is found as present with value NULL, which GetValue cannot tell from
  absence; the output pointer may be NULL (then only presence is reported). CFDictionaryGetCountOfKey
  gives 1 or 0. A NULL dictionary is not supported.
returns:
  found: "the value (GetValue) / true and *value set (IfPresent)"
  absent: "NULL / false, *value untouched"
errors:
  null: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "constant time on average"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
