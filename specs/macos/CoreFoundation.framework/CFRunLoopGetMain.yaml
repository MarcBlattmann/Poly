# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFRunLoopGetMain.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFRunLoopGetMain.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFRunLoopGetMain
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFRunLoopGetMain() returns the main thread's run loop, one object for the life of the process and
  equal to CFRunLoopGetCurrent() on the main thread; from any thread it is the same object (probe).
  Its mode list (CFRunLoopCopyAllModes, a new array of CFStrings) contains kCFRunLoopDefaultMode at
  start (the main loop has its own sources there, which is why a run of the default mode on the main
  thread is not 'empty'); adding a source or timer to a loop in a new mode name makes that mode appear
  (count +1), CFArrayContainsValue finds it by an equal string, CFRunLoopContainsSource/Timer is true
  for that mode name and false for another or differently cased one. The loop object is not counted in
  the way other objects are (CFRunLoopGetMain stays the same through retains and releases).
returns:
  success: "the main run loop (never NULL)"
errors: {}
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
