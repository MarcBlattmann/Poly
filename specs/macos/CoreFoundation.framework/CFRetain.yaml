# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFRetain.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFRetain.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFRetain
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFRetain(cf) adds one to the object's retain count and returns the same object (the argument itself,
  as a CFTypeRef). A new object starts at 1, so after one retain CFGetRetainCount says 2, and each
  CFRelease takes one off. The standard collection callbacks (kCFType...CallBacks) retain what is put
  in, so an element's count is one higher for as long as a collection holds it; retaining the
  collection itself does not change its elements' counts. Constant objects are not counted: kCFNull,
  kCFBooleanTrue/False, CFSTR strings, small strings and numbers stored without an object of their
  own, and some shared empty collections; retaining them changes nothing, returns the same pointer,
  and CFGetRetainCount reports a huge number for them (0x0FFFFFFFFFFFFFFF for CFSTR, INT64_MAX for the
  small stored values; the tests only require 'above 1000'). Retaining NULL is a programming error
  that kills the process.
returns:
  success: "the same pointer that was passed"
  count: "retain count + 1 (for counted objects), or unchanged for constants"
errors:
  null: "NULL kills the process (SIGTRAP on arm64, SIGILL on x86_64)"
  garbage: "a pointer that is not a CF object is undefined behaviour"
side_effects: "the object's retain count rises by one; nothing else"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
