# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFStringCompareWithOptions.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFStringCompareWithOptions.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFStringCompareWithOptions
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFStringCompareWithOptions(a, b, rangeToCompare, options) compares only the characters of a inside
  rangeToCompare (location, length in units) with the whole of b, with the options of CFStringCompare,
  and returns -1, 0 or 1. CFStringCompare(a, b, o) is the same as the range of the whole first string.
  Results seen: range (2,3) of 'xxabcxx' against 'abc' equal; range (0,2) of 'abcdef' against 'abc'
  less (the shorter piece is smaller), range (0,4) greater; (0,2) of 'abc' against 'abd' less; an
  empty range against a non-empty string is less (-1) and against an empty string equal;
  CaseInsensitive and Numerically act inside the range ('x50' range (1,2) against '9' numerically:
  greater); a CaseInsensitive compare of 'Mixed' (range (0,5) of 'Mixed Case') against 'mixed case' is
  less because b is longer. A range outside the string raises an exception (not tested).
returns:
  less: "-1"
  equal: "0"
  greater: "1"
errors:
  range_out_of_bounds: "raises an Objective-C exception (not supported)"
  null: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "microseconds; linear in the range"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
