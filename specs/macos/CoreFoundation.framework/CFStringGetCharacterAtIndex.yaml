# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFStringGetCharacterAtIndex.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFStringGetCharacterAtIndex.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFStringGetCharacterAtIndex
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFStringGetCharacterAtIndex(str, idx) returns the UTF-16 code unit at the zero-based index: the
  first and last units, é (0x00E9), the two halves of a pair for a character above U+FFFF (high
  0xD83D, low 0xDE00 for U+1F600), the euro sign 0x20AC. It reads the same for constants, copies,
  mutable strings (after edits), substrings and strings made from other encodings. An index outside
  0..length-1 is not checked for every string kind (a constant string read past its end gave a stray
  unit, 10) and is not to be relied on.
returns:
  success: "the code unit as UniChar (unsigned 16-bit)"
errors:
  out_of_range: "undefined for constants and some strings, may raise or give a stray value"
  null: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
