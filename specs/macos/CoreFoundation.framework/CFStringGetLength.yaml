# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFStringGetLength.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFStringGetLength.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFStringGetLength
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFStringGetLength(str) is the number of UTF-16 code units: 0 for the empty string, ASCII one each, é
  one, a character above U+FFFF two, a combining mark one, U+0000 and the byte order mark U+FEFF one
  each. For constant strings made with CFSTR the same count ("Aé€" is 3). A mutable string's length
  follows its edits (append, delete range) and a copy or substring has its own length (a copy keeps
  the length it was made with while the original grows).
returns:
  success: "the length in code units, as CFIndex"
errors:
  null: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
