# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFBundleGetValueForInfoDictionaryKey.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFBundleGetValueForInfoDictionaryKey.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFBundleGetValueForInfoDictionaryKey
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFBundleGetValueForInfoDictionaryKey(bundle, key) returns the value of the key in the bundle's
  Info.plist, as the property list type the plist gives: <string> a CFString, <integer> a CFNumber of
  type SInt64, <true/> kCFBooleanTrue, <array> a CFArray; borrowed from the bundle (the same object
  every time; for the string keys the same object as the identifier); NULL for a key that is not
  there, with a different case or empty; kCFBundleNameKey, kCFBundleVersionKey, kCFBundleIdentifierKey
  are the keys 'CFBundleName', 'CFBundleVersion', 'CFBundleIdentifier'. CFBundleGetInfoDictionary
  returns the whole CFDictionary: the plist's keys plus 'CFBundleNumericVersion' added by
  CoreFoundation (the CFBundleVersion or short version string packed as a number: 1.2.3 with version
  '42' in the test gives 1107329024, which is also CFBundleGetVersionNumber; 0 without version), so a
  plist of nine keys gives ten. For a program outside a bundle every key gives NULL and the dictionary
  is empty.
returns:
  found: "the borrowed value object"
  absent: "NULL"
errors:
  null_bundle: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
