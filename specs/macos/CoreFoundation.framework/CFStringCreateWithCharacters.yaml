# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFStringCreateWithCharacters.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFStringCreateWithCharacters.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFStringCreateWithCharacters
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFStringCreateWithCharacters(alloc, chars, numChars) copies numChars UTF-16 units into a new string.
  Nothing is checked or changed: lone and reversed surrogates, U+0000, U+FEFF, U+FFFF and combining
  marks are all kept, no normalisation. CFStringGetLength is numChars and the units read back at the
  same indexes. numChars 0 gives the empty string, also with chars NULL, and it equals CFSTR(""). The
  buffer is copied: changing it afterwards does not change the string. Long strings (300 units tried)
  work the same.
returns:
  success: "a new string, never NULL for valid arguments"
errors:
  chars_null_with_count: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "allocates the string"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "microseconds; linear in numChars"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
