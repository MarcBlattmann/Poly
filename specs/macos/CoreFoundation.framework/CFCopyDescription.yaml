# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFCopyDescription.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFCopyDescription.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFCopyDescription
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFCopyDescription(cf) returns a new string describing the object, for logging. The formats seen
  (only the structure is reliable; the pointers in them differ per run, and the tests mask each
  hexadecimal address, written 0x... after '<Class ' or inside '[ ]', as 0xADDR): constant (CFSTR)
  strings and long heap strings: `<CFString 0xADDR [0xADDR]>{contents = "hello"}` (the text is not
  escaped; small strings stored without an object of their own are described by their bare text, so
  tests use CFSTR strings and long ones); kCFNull: `<CFNull 0xADDR [0xADDR]>`; Booleans: `<CFBoolean
  0xADDR [0xADDR]>{value = true}` (false likewise); numbers: `<CFNumber 0xADDR [0xADDR]>{value = +1,
  type = kCFNumberSInt32Type}` (sign always shown; 64-bit integers `+9223372036854775807, type =
  kCFNumberSInt64Type`; a double `+2.50000000000000000000, type = kCFNumberFloat64Type`; a float 10
  digits `+1.0000000000, type = kCFNumberFloat32Type`); data: `<CFData 0xADDR [0xADDR]>{length = 3,
  capacity = 3, bytes = 0x000102}`, up to 24 bytes shown in full as lower-case hex, from 25 bytes the
  first 16 and last 8 bytes with ' ... ' between (`0x000102030405060708090a0b0c0d0e0f ...
  1112131415161718`); an array: `(` newline, each element's description indented by four spaces and
  followed by `,` except the last, newline `)`; a dictionary: `{` newline, `    key = value;` per
  pair, newline `}` (empty: `{\n}`); nested collections indent the inner lines by four more spaces. In
  an array or dictionary a string element appears as its bare text. A collection or class not listed
  here (sets, dates, URLs) has a '<CFBasicHash ...>' or similar form that is not specified.
returns:
  success: "a new CFString the caller must release"
errors:
  null: "CFCopyDescription(NULL) is not supported"
side_effects: "allocates the string"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "microseconds to milliseconds depending on the size"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
