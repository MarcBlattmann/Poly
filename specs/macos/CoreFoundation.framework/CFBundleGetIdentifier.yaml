# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreFoundation.framework/CFBundleGetIdentifier.yaml. Observed with C tests linked against CoreFoundation
# (tests/macos/include/poly_mcf.h, ADR 0182); results per architecture in CFBundleGetIdentifier.tests/macos.json.
id: macos/api/CoreFoundation.framework/CFBundleGetIdentifier
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are C programs that link CoreFoundation (the line `poly-mac: corefoundation`, tests/macos/include/poly_mcf.h); results and output go through raw system calls"
  observed_by: spec-macos-cf
  date: 2026-11-20
summary: >
  CFBundleGetIdentifier(bundle) returns the CFBundleIdentifier string of the bundle's Info.plist, the
  same string object that CFBundleGetValueForInfoDictionaryKey(bundle, kCFBundleIdentifierKey)
  returns, owned by the bundle (not retained for the caller); NULL when the bundle has no identifier:
  a program outside any bundle, or a plain directory made a bundle with CFBundleCreate.
  CFBundleCreate(alloc, url) returns the existing bundle for a directory already open (so
  CFBundleCreate on the main bundle's URL is the main bundle itself) and NULL for a path that does not
  exist or is a file; a directory without Info.plist gives a bundle with no identifier and an empty
  Info dictionary.
returns:
  success: "the identifier string, borrowed"
  no_identifier: "NULL"
errors:
  null_bundle: "NULL and other invalid arguments are not checked and kill the process (SIGSEGV, or SIGTRAP on arm64 / SIGILL on x86_64); not to be relied on"
side_effects: "none"
threading: "thread safe: reference counts change atomically; an object may be used from any thread"
ordering: []
timing:
  typical: "a few nanoseconds to microseconds; no system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
