# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/fsetxattr.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# fsetxattr.tests/macos.json.
id: macos/syscall/bsd/fsetxattr
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 237,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 237, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. Extended
  attributes: names are UTF-8 strings of up to 127 bytes (128 bytes is
  ENAMETOOLONG 63, an empty name EINVAL 22, a name that is not valid UTF-8
  EINVAL), case sensitive and normalisation sensitive (the precomposed and
  decomposed forms of one letter are two names); values are byte strings
  of any content including NUL, from 0 bytes up to at least 4 MiB. Options
  (<sys/xattr.h>): XATTR_NOFOLLOW 1 (path forms only: use the link
  itself), XATTR_CREATE 2, XATTR_REPLACE 4; bits nobody defined are
  ignored in the path forms. Missing attribute is ENOATTR (93). The
  descriptor forms act on the file an open descriptor refers to; they work
  through a read-only descriptor and a directory descriptor, and a
  descriptor opened on a symbolic link with O_SYMLINK (0x200000) acts on
  the link itself. Pipes and sockets are EINVAL (22), /dev/null is EPERM
  (1), a descriptor that is not open is EBADF (9). Options other than 0
  are not accepted where the path form takes XATTR_NOFOLLOW: 1 is EINVAL
  (22). fsetxattr(fd, name, value, size, position, options) is setxattr
  for a descriptor: creates or replaces, returns 0; XATTR_CREATE gives
  EEXIST (17) and XATTR_REPLACE ENOATTR (93); CREATE|REPLACE, 8 and 0x10
  are EINVAL, undefined bits such as 0x100 are ignored; a position other
  than 0 is EINVAL; a value of 1 MiB reads back whole; a size-0 value
  stores an empty attribute; the resource fork can be written at a
  position through the descriptor; FinderInfo of 31 bytes is ERANGE (34),
  of 32 works.
returns:
  success: "0"
errors:
  exists: "EEXIST (17)"
  no_attribute: "ENOATTR (93)"
  bad_flags: "EINVAL (22)"
  bad_fd: "EBADF (9)"
  kind: "EINVAL (22) pipe or socket; EPERM (1) /dev/null"
  ranges: "ERANGE (34)"
  bad_pointer: "EFAULT (14)"
side_effects: "an attribute is created, replaced or extended"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
