# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/shared_region_check_np.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# shared_region_check_np.tests/macos.json.
id: macos/syscall/bsd/shared_region_check_np
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 294,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 294, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear.
  shared_region_check_np(address_ptr) stores the address where the shared
  cache of system libraries is mapped in the process and returns 0:
  nonzero, 4096-byte aligned (16 KiB on arm64: 0x181b90000, a value). The
  same on every call, in a forked child and in a re-executed program. An
  unwritable pointer is EFAULT (14) and later calls still work. A NULL
  pointer returns 0 and stores nothing, but afterwards every call in that
  process fails with EINVAL (22) (observed: the next call and the one
  after it).
returns:
  success: "0; *address_ptr = the cache's address"
errors:
  bad_pointer: "EFAULT (14): pointer at address 8"
  after_null: "EINVAL (22): every call after one with a NULL pointer"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
