# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/renameatx_np.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# renameatx_np.tests/macos.json.
id: macos/syscall/bsd/renameatx_np
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 488,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 488, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear.
  renameatx_np(fromfd, from, tofd, to, flags) is renameat with flags and
  returns 0. RENAME_SWAP 2 exchanges two existing names atomically: each
  name then has the other's content and inode (files, directories, or a
  file with a directory), a missing name on either side is ENOENT (2) and
  nothing changes, a name with itself is accepted (0); descriptors follow
  their file through a swap. RENAME_EXCL 4 is EEXIST (17) when the
  destination exists (file, directory, dangling link, or another spelling
  of an existing name) and changes nothing; with a free destination it
  renames, also into a directory descriptor; a missing source is ENOENT.
  Flag 0 is a plain rename that replaces; flag 1 acts as a plain rename
  too. SWAP together with EXCL is EINVAL (22), as are flags 8 and 0x100. A
  descriptor that is not open is EBADF (9).
returns:
  success: "0"
errors:
  exists: "EEXIST (17) with RENAME_EXCL"
  missing: "ENOENT (2)"
  bad_flags: "EINVAL (22)"
  bad_fd: "EBADF (9)"
side_effects: "names change or are exchanged"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
