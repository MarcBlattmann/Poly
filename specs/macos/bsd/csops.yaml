# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/csops.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# csops.tests/macos.json.
id: macos/syscall/bsd/csops
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 169,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64 `svc
  #0x80` with x16 = 169, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. csops(pid, operation,
  buffer, size) queries code-signing state; pid 0 is the caller. Operation 0
  (CS_OPS_STATUS) stores the flags (u32): for a process run from an
  executable that the linker signed ad hoc, 0x22020201 (570556929),
  including CS_VALID (1); the same through the caller's own pid and in a
  forked child. Operation 10 (CS_OPS_BLOB) copies the signature blob: it
  starts with the bytes fa de 0c c0 (the embedded- signature magic, big
  endian), then its length (big endian u32; 279 for the oracle's test
  executables). Operations 4 and 5 (path, code-directory hash) are refused
  with EINVAL for the caller (values). Operation numbers and flags have no
  public header in the SDK; they were found by experiment. Not to be probed:
  operation 1 (CS_OPS_MARKINVALID) invalidates the process's signature and
  the process is killed (SIGKILL) at once.
returns:
  success: "0, buffer filled"
errors:
  no_process: "ESRCH (3): a pid that does not exist"
  bad_operation: "EINVAL (22): operation 9999, also 4 and 5 for the caller"
  bad_pointer: "EFAULT (14): buffer at address 8"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
