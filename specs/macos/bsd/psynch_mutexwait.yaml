# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/psynch_mutexwait.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# psynch_mutexwait.tests/macos.json.
id: macos/syscall/bsd/psynch_mutexwait
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-17
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 301,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 301, arguments in x0..x5 (x0..x7 for calls with
  more; second result in x1). On failure the carry flag is set and the
  result register holds the errno (<sys/errno.h>); on success the carry
  flag is clear. The call takes eight arguments, x0..x7 on arm64 (the
  tests pass them there; x86_64 passes the later ones on the stack and is
  not observed yet). It is the kernel side of libpthread's mutexes and
  condition variables; the arguments are libpthread's words (open-source
  libpthread names them cv, cvlsgen, cvugen, mutex, mugen, flags, sec,
  nsec) and the results carry sequence state in their upper bytes. The
  tests use cvlsgen 0x100 (one waiter registered in user space) and zeroed
  words. psynch_mutexwait(mutex, mgen, ugen, tid, flags) waits for a
  mutex. On a mutex word that is 0 (as if locked, nobody to drop it) it
  does not return: a child that makes the call was still running after 150
  ms, and SIGKILL ends it (wait status 9), SIGTERM too (15). The same for
  a NULL mutex address (the call blocks without reading the word).
returns:
  never: "does not return unless another thread drops the mutex"
errors: {}
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
