# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/getxattr.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# getxattr.tests/macos.json.
id: macos/syscall/bsd/getxattr
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 234,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 234, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. Extended
  attributes: names are UTF-8 strings of up to 127 bytes (128 bytes is
  ENAMETOOLONG 63, an empty name EINVAL 22, a name that is not valid UTF-8
  EINVAL), case sensitive and normalisation sensitive (the precomposed and
  decomposed forms of one letter are two names); values are byte strings
  of any content including NUL, from 0 bytes up to at least 4 MiB. Options
  (<sys/xattr.h>): XATTR_NOFOLLOW 1 (path forms only: use the link
  itself), XATTR_CREATE 2, XATTR_REPLACE 4; bits nobody defined are
  ignored in the path forms. Missing attribute is ENOATTR (93).
  getxattr(path, name, value, size, position, options) returns the length
  of the attribute and copies it to value. A NULL value with size 0 only
  asks for the length; a buffer of size 0 that is not NULL, or one that is
  too small by even one byte, is ERANGE (34); an empty value has length 0.
  position must be 0 (EINVAL 22 otherwise) except for the resource fork,
  where it is the byte offset to read from and the size query still gives
  the whole length. A symbolic link is followed unless XATTR_NOFOLLOW is
  given; then the link's own attributes are read (a loop of links followed
  is ELOOP 62, a dangling link followed ENOENT). A file whose mode denies
  access (mode 0) is EACCES (13); a directory can carry attributes like a
  file. The attribute com.apple.ResourceFork is the resource fork;
  com.apple.FinderInfo holds exactly 32 bytes and an all-zero one reads as
  absent (ENOATTR). Bad pointers are EFAULT (14); a missing file ENOENT, a
  path through a file ENOTDIR, an empty path ENOENT.
returns:
  success: "the attribute length in bytes; value filled up to that length"
errors:
  no_attribute: "ENOATTR (93)"
  too_small: "ERANGE (34)"
  bad_name: "EINVAL (22) empty or not UTF-8; ENAMETOOLONG (63) at 128 bytes"
  bad_position: "EINVAL (22)"
  path: "ENOENT (2), ENOTDIR (20), ELOOP (62), EACCES (13), EFAULT (14)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
