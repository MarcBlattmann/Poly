# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/lstat64.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# lstat64.tests/macos.json.
id: macos/syscall/bsd/lstat64
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 340,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 340, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. lstat64(path, buf)
  is stat64 without following a final symbolic link: it describes the link
  itself: S_IFLNK|0755 (mode 0120755), one link, st_size = the length of
  the target path ("file": 4, "a/much/longer/target": 20, a dangling
  link's target "nowhere": 7). A dangling link and a loop of links can be
  examined. For everything else it gives what stat64 gives (file,
  directory, device). A link in the middle of the path is followed, and a
  trailing slash on a link to a directory follows it too.
returns:
  success: "0, buf filled"
errors:
  missing: "ENOENT (2): a missing file, the empty path"
  not_a_directory: "ENOTDIR (20): a file used as a directory"
  name_too_long: "ENAMETOOLONG (63): a component of 299 bytes"
  bad_pointer: "EFAULT (14): path or buffer at address 8"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
