# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/listxattr.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# listxattr.tests/macos.json.
id: macos/syscall/bsd/listxattr
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 240,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 240, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. Extended
  attributes: names are UTF-8 strings of up to 127 bytes (128 bytes is
  ENAMETOOLONG 63, an empty name EINVAL 22, a name that is not valid UTF-8
  EINVAL), case sensitive and normalisation sensitive (the precomposed and
  decomposed forms of one letter are two names); values are byte strings
  of any content including NUL, from 0 bytes up to at least 4 MiB. Options
  (<sys/xattr.h>): XATTR_NOFOLLOW 1 (path forms only: use the link
  itself), XATTR_CREATE 2, XATTR_REPLACE 4; bits nobody defined are
  ignored in the path forms. Missing attribute is ENOATTR (93).
  listxattr(path, namebuf, size, options) stores the names of all
  attributes, each ended by a NUL, and returns the number of bytes. A NULL
  buffer with size 0 gives the number; a buffer of size 0 that is not
  NULL, or too small by one byte, is ERANGE (34); a buffer of exactly the
  needed size works. Names come in byte order of the names, whatever order
  they were set in (Ab, aa, mm, zz); com.apple.ResourceFork is listed once
  it has bytes and com.apple.FinderInfo once it is not all zero. Files
  created by a process on this Mac can carry a com.apple.provenance
  attribute from the start, so a new file's list is not always empty (the
  tests ignore that name). A symbolic link is followed unless
  XATTR_NOFOLLOW; with it the link's own names are listed (a dangling link
  can then be listed, followed it is ENOENT). A directory can be listed. A
  file with mode 0 is EACCES (13); a missing file ENOENT; a path through a
  file ENOTDIR; unwritable buffer or unreadable path EFAULT.
returns:
  success: "the number of bytes of names; namebuf filled"
errors:
  too_small: "ERANGE (34)"
  path: "ENOENT (2), ENOTDIR (20), EACCES (13), EFAULT (14)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
