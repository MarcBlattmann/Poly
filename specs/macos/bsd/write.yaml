# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/write.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# write.tests/macos.json.
id: macos/syscall/bsd/write
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 4,
  arguments in rdi, rsi, rdx, r10, r8, r9; arm64 `svc #0x80` with x16 = 4,
  arguments in x0..x5. On failure the carry flag is set and the result
  register holds the errno (<sys/errno.h>); on success the carry flag is
  clear. write(fd, buf, count) writes up to count bytes from buf and
  returns the number written. A count of 0 returns 0 and writes nothing. A
  regular file is written at the descriptor's offset, which moves by the
  count; with O_APPEND every write goes to the end of the file, whatever
  the offset. /dev/null accepts every byte (100000 at once) and returns
  the count. The second result register is not part of the result.
returns:
  success: "the number of bytes written (all of them for files and /dev/null)"
  count_zero: "0, nothing written"
errors:
  not_open: "EBADF (9): fd 99, fd -1"
  not_writable: "EBADF (9): a descriptor opened O_RDONLY, also a directory"
  bad_buffer: "EFAULT (14): buffer at address 8 with count 4"
side_effects: "the file grows and the descriptor's offset moves by the bytes written"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
