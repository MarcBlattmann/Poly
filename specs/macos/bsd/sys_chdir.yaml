# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sys_chdir.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sys_chdir.tests/macos.json.
id: macos/syscall/bsd/sys_chdir
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 12,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 12, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. chdir(path) changes
  the working directory: relative paths are resolved from it afterwards,
  ".." goes back, and F_GETPATH of "." shows the new directory. A failed
  call leaves the directory as it was. The next call, fchdir (BSD 13, same
  entry family), changes it to an open directory descriptor: ENOTDIR for a
  file's descriptor, EBADF for one that is not open, and the directory
  descriptor keeps working after the working directory changes elsewhere.
  The map names the entry sys_chdir.
returns:
  success: "0"
errors:
  missing: "ENOENT (2): a missing directory, the empty path"
  not_a_directory: "ENOTDIR (20): a file; a file used as a directory"
  no_search_permission: "EACCES (13): a directory with mode 000"
  bad_path: "EFAULT (14): path at address 8"
side_effects: "the working directory changes"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
