# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/fgetattrlist.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# fgetattrlist.tests/macos.json.
id: macos/syscall/bsd/fgetattrlist
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 228,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 228, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. fgetattrlist(fd,
  attrlist, buffer, size, options) is getattrlist for an open descriptor
  and returns 0. The buffer starts with the total length;
  ATTR_CMN_RETURNED_ATTRS (0x80000000) comes first when asked (5 u32
  words), then ATTR_CMN_NAME (0x1: attrreference {offset, length with
  NUL}, the name as stored in the directory, also when the file was opened
  with another case), ATTR_CMN_OBJTYPE (0x8: VREG 1, VDIR 2),
  ATTR_FILE_DATALENGTH (0x200: the size, following writes through the
  descriptor). A buffer too small for the data still succeeds and stores
  only the length word, which says how many bytes were needed (24 for name
  and object type of a file called file); a buffer that cannot hold the
  length word (3 bytes) is ERANGE (34). ATTR_CMN_FULLPATH (0x08000000)
  gives the absolute path. A descriptor that is not open is EBADF (9), a
  NULL attribute list EFAULT (14), a bitmap count of 6 EINVAL (22), an
  unwritable buffer EFAULT.
returns:
  success: "0; buffer filled"
errors:
  bad_fd: "EBADF (9)"
  small_buffer: "ERANGE (34) below 4 bytes"
  bad_attrs: "EINVAL (22)"
  bad_pointer: "EFAULT (14)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
