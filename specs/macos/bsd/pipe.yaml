# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/pipe.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# pipe.tests/macos.json.
id: macos/syscall/bsd/pipe
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 42,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 42, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. pipe() makes a pipe
  and returns the read end in the result register and the write end in the
  second register (the two lowest free descriptors: 3 and 4 in a new test
  process). Bytes come out in order; a read of fewer bytes than are in the
  pipe leaves the rest; the ends are one-way (reading the write end or
  writing the read end is EBADF). With the write end closed and the pipe
  empty, a read returns 0. fstat shows S_IFIFO|0660 (010660), size 0. With
  O_NONBLOCK an empty read is EAGAIN (35); a write larger than the pipe's
  capacity is short (65533 bytes were taken after 3 bytes were in it: a
  capacity of 65536, a value); a full pipe is EAGAIN. FIONREAD (ioctl)
  counts the bytes waiting. Writing after the read end was closed raises
  SIGPIPE (default action: the writer dies, wait status 13); with SIGPIPE
  ignored the write is EPIPE (32).
returns:
  success: "result = read descriptor, second register = write descriptor"
errors:
  wrong_end: "EBADF (9): reading the write end, writing the read end"
  empty_nonblocking: "EAGAIN (35)"
  no_reader: "EPIPE (32) with SIGPIPE ignored; SIGPIPE otherwise"
side_effects: "two descriptors are opened"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
