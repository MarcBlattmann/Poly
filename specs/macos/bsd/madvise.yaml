# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/madvise.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# madvise.tests/macos.json.
id: macos/syscall/bsd/madvise
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-17
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 75,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 75, arguments in x0..x5 (x0..x7 for calls with
  more; second result in x1). On failure the carry flag is set and the
  result register holds the errno (<sys/errno.h>); on success the carry
  flag is clear. madvise(address, length, advice) accepts the advice
  values of <sys/mman.h>: MADV_NORMAL 0, RANDOM 1, SEQUENTIAL 2, WILLNEED
  3, DONTNEED 4, FREE 5, ZERO_WIRED_PAGES 6, FREE_REUSABLE 7, FREE_REUSE
  8, CAN_REUSE 9, and MADV_ZERO 11; 12 and -1 are EINVAL; MADV_PAGEOUT 10
  is ENOTSUP (45). None of 0 to 9 changes what the memory holds (DONTNEED
  keeps the content of anonymous memory; MADV_FREE kept it too when
  nothing needed the pages, 7 on the oracle, not guaranteed). MADV_ZERO
  zeroes the pages of the range (a length of 1 zeroes the whole page) and
  not their neighbours. Addresses: below the first mapping (0x100000) is
  ENOMEM; a length of 0 succeeds; a range that runs past the end of a
  mapping (5 pages over 2) and the hole where a mapping was unmapped are
  EINVAL (values); an address that is not page aligned is accepted (value
  0).
returns:
  success: "0"
errors:
  bad_advice: "EINVAL (22): advice 12, -1"
  not_supported: "ENOTSUP (45): MADV_PAGEOUT (10)"
  not_mapped: "ENOMEM (12): an address below the first mapping; EINVAL for a hole or a range past the mapping"
side_effects: "MADV_ZERO zeroes the pages"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
