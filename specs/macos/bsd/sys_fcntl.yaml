# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sys_fcntl.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sys_fcntl.tests/macos.json.
id: macos/syscall/bsd/sys_fcntl
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 92,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 92, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. fcntl(fd, command,
  argument) operates on a descriptor. F_DUPFD (0) returns the lowest free
  descriptor that is at least the argument (20, then 21), without close-
  on-exec; F_DUPFD_CLOEXEC (67) the same with close-on-exec set; the
  copies share the offset. F_GETFD (1) / F_SETFD (2) read and set
  FD_CLOEXEC (1), the only descriptor flag. F_GETFL (3) returns the access
  mode (O_RDWR 2 for a file opened that way, 0 for a directory) and status
  flags; F_SETFL (4) sets O_APPEND (8) and O_NONBLOCK (4) and replaces the
  set: flags not given are cleared, and the access mode cannot be changed.
  F_GETPATH (50) writes the path of the open file into a buffer of 1024
  bytes: "/dev/null" for /dev/null, an absolute path ending in the
  directory's name for a directory. A command number the object does not
  know (999 on a file) failed with ENODEV (19) (a value). The map names
  the entry sys_fcntl.
  More behaviour, file-system commands. F_FULLFSYNC (51) returns 0 for a
  regular file and a directory, ENODEV (19) for /dev/null, EBADF (9) for a
  pipe; F_BARRIERFSYNC (85), F_NOCACHE (48, argument 1 or 0),
  F_GLOBAL_NOCACHE (55) and F_RDAHEAD (45) return 0 on a file; F_NOCACHE
  and F_RDAHEAD on a pipe are EBADF. F_GETPATH (50) stores the absolute
  path (a buffer of 1024 bytes) of an open file or directory, the string
  /dev/null for the null device, EBADF for a pipe or a descriptor not
  open, EFAULT for an unwritable or NULL buffer; the path follows a rename
  and an unlinked file still succeeds; F_GETPATH_NOFIRMLINK (102) works
  too. F_PREALLOCATE (42) with a zeroed argument is EINVAL (22).
returns:
  success: "the command's result: a descriptor, flags, or 0"
errors:
  bad_fd: "EBADF (9): a descriptor that is not open, for any command"
  bad_buffer: "EFAULT (14): F_GETPATH into address 8"
  unknown_command: "ENODEV (19) for command 999 on a regular file"
side_effects: "F_DUPFD makes a descriptor; F_SETFD / F_SETFL change flags"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
