# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/getentropy.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# getentropy.tests/macos.json.
id: macos/syscall/bsd/getentropy
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 500,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 500, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. getentropy(buffer,
  length) fills exactly length bytes with random data, for length up to
  256: two calls differ, nearly all bytes are nonzero, bytes past length
  are not touched. Lengths 0, 1, 255 and 256 work; more than 256 and
  negative lengths are EINVAL (22) (libSystem's wrapper reports EIO). With
  length 0 the buffer is not looked at (address 8 is fine). A failed call
  does not stop later ones.
returns:
  success: "0"
errors:
  too_long: "EINVAL (22): length 257, 512, -1"
  bad_buffer: "EFAULT (14): buffer at address 8 or NULL with length 16"
side_effects: "the buffer is written"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
