# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/fclonefileat.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# fclonefileat.tests/macos.json.
id: macos/syscall/bsd/fclonefileat
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 517,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 517, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. fclonefileat(srcfd,
  dstfd, dst, flags) is clonefileat for an open source descriptor and
  returns 0: the copy has the same content, size, mode and extended
  attributes, a new inode, and is independent. The descriptor may be
  read-only, may refer to a file that was unlinked since (the copy still
  works), to a directory (the whole tree is cloned, subdirectory modes
  kept), or to a symbolic link opened with O_SYMLINK (0x200000: the copy
  is a link with the same target; a descriptor opened through the link
  gives a regular copy of the target). The destination must not exist
  (EEXIST 17); a descriptor not open is EBADF (9); a missing destination
  directory ENOENT (2); a file as dstfd ENOTDIR (20); a pipe is ENOTSUP
  (45), /dev/null EINVAL (22). Nothing is created on failure.
returns:
  success: "0"
errors:
  exists: "EEXIST (17)"
  missing: "ENOENT (2)"
  not_dir: "ENOTDIR (20)"
  bad_fd: "EBADF (9)"
  kind: "ENOTSUP (45) pipe, EINVAL (22) device"
side_effects: "a new file or directory tree is created"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
