# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sigpending.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sigpending.tests/macos.json.
id: macos/syscall/bsd/sigpending
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 52,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 52, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. sigpending(set_ptr)
  stores the set of signals that are blocked and waiting as a 32-bit mask
  (bit n-1 for signal n) and returns 0. It is empty at the start; a
  blocked signal sent to the process sets its bit; three of the same
  signal count once; different signals each have a bit; unblocking
  delivers them (the handlers run once each) and clears the set; a signal
  that is ignored is discarded even while blocked and never pending; an
  unwritable pointer is not an error (the call returns 0); a child starts
  with nothing pending (pending signals are not inherited by fork) while
  the parent keeps them. The signal mask survives execve (the re-executed
  program sees the same blocked set) and a signal pending before the exec
  is still pending after it.
returns:
  success: "0; the pending set stored"
errors:
  none: "no errors observed"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
