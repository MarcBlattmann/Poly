# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sys_close.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sys_close.tests/macos.json.
id: macos/syscall/bsd/sys_close
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 6,
  arguments in rdi, rsi, rdx, r10, r8, r9; arm64 `svc #0x80` with x16 = 6,
  arguments in x0..x5. On failure the carry flag is set and the result
  register holds the errno (<sys/errno.h>); on success the carry flag is
  clear. close(fd) releases a descriptor and returns 0. Afterwards the
  descriptor is not open: closing it again or writing to it is EBADF, and
  the next open returns the lowest free number, which may be the one just
  closed (also 0 after closing stdin). The map names the entry sys_close
  (syscalls.master's sys_ prefix); the call is close(2).
returns:
  success: "0"
errors:
  not_open: "EBADF (9): an already closed descriptor, -1, 99, 100000"
side_effects: "the descriptor number becomes free"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
