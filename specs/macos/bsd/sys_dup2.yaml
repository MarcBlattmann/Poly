# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sys_dup2.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sys_dup2.tests/macos.json.
id: macos/syscall/bsd/sys_dup2
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 90,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 90, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. dup2(old, new)
  makes descriptor new refer to the same open file as old (one offset, the
  same file) and returns new; a file open on new is closed first; the copy
  does not have close-on-exec, whatever old had. A descriptor far above
  the used ones (50) is fine. When old and new are the same open
  descriptor, it is returned unchanged and keeps its close-on-exec flag;
  when they are the same and not open, EBADF. A failed call closes
  nothing. The map names the entry sys_dup2.
returns:
  success: "new"
errors:
  bad_old: "EBADF (9): old not open (also -1)"
  bad_new: "EBADF (9): new negative"
  same_closed: "EBADF (9): old and new the same descriptor and not open"
side_effects: "new is closed and then refers to the file of old"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
