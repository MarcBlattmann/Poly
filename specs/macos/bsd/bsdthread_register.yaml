# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/bsdthread_register.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# bsdthread_register.tests/macos.json.
id: macos/syscall/bsd/bsdthread_register
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 366,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 366, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear.
  bsdthread_register(thread_start, workqueue_start, flags, stack_hint,
  ...) registers the entry points for new threads. libSystem does that
  when a program starts, and a second registration is refused with EINVAL
  (22), whatever the arguments (all 0, nonzero entry points, flags 1);
  also in a forked child (inherited) and in a program started by execve
  (registered anew at its start). Registering is therefore not something a
  test can do successfully; a first registration is what Poly's own
  libSystem does.
returns:
  success: "not observed: a process is registered before main"
errors:
  already_registered: "EINVAL (22)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
