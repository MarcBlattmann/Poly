# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/kqueue.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# kqueue.tests/macos.json.
id: macos/syscall/bsd/kqueue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 362,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 362, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. kqueue() makes an
  event queue and returns its descriptor (the lowest free one: 3 in a new
  test process); every call makes a different queue; closing it frees the
  number. The descriptor is not a file: read and write are ENXIO (6),
  lseek is ESPIPE (29), fstat shows mode 010000. A duplicate (dup2) is the
  same queue: an event registered through one is reported through the
  other. The registrations belong to the process: in a forked child the
  descriptor number is not usable (its kevent on the parent's queue failed
  with EBADF, 9), the parent's queue keeps its registrations. Arguments
  are ignored.
returns:
  success: "the queue's descriptor"
errors: {}
side_effects: "a descriptor is opened"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
