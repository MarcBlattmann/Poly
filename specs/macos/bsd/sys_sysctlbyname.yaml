# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sys_sysctlbyname.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sys_sysctlbyname.tests/macos.json.
id: macos/syscall/bsd/sys_sysctlbyname
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 274,
  arguments in rdi, rsi, rdx, r10, r8, r9; arm64 `svc #0x80` with x16 =
  274, arguments in x0..x5. On failure the carry flag is set and the
  result register holds the errno (<sys/errno.h>); on success the carry
  flag is clear. sysctlbyname(name, namelen, oldp, oldlenp, newp, newlen)
  is sysctl by a dotted name; namelen may or may not count the NUL (11 and
  12 both work for "kern.ostype"), but a shorter length names something
  else (5: ENOENT). Values are those of sysctl(2) by number ("kern.ostype"
  is "Darwin", 7 bytes), except that "hw.pagesize" by name is an 8-byte
  integer: 8 bytes into an 8-byte buffer, 4 into a 4-byte one.
  "sysctl.proc_translated" is a 4-byte integer, 0 for a native process (1
  expected under Rosetta, not observed). A NULL oldp reports the size; a
  buffer too small is ENOMEM with *oldlenp set to 0. A node name ("kern")
  is not a value. The map names the entry sys_sysctlbyname.
returns:
  success: "0, *oldlenp = bytes copied"
  size_query: "0 with oldp NULL, *oldlenp = the value's size"
errors:
  unknown: "ENOENT (2): kern.nosuchthing, the empty name, the node kern, a length that cuts the name"
  name_too_long: "ENAMETOOLONG (63): a 1999-byte name"
  small_buffer: "ENOMEM (12): *oldlenp smaller than the value; *oldlenp set to 0"
  bad_pointer: "EFAULT (14): name at address 8"
  read_only: "EPERM (1): setting kern.ostype"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
