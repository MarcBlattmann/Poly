# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/posix_spawn.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# posix_spawn.tests/macos.json.
id: macos/syscall/bsd/posix_spawn
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 244,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 244, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear.
  posix_spawn(pid_ptr, path, descriptor, argv, envp) starts a new process
  running path and returns 0 to the caller; the new pid is stored through
  pid_ptr. With descriptor 0 (NULL) there are no attributes and no file
  actions. The child is the caller's child, gets the argument and
  environment arrays it is given, and inherits what an execve keeps: open
  descriptors unless close-on-exec, ignored signals, the signal mask;
  caught signals are reset to the default action. Failures are returned by
  the call itself as the errno (with the carry flag), and the caller has
  no child to wait for afterwards: a blocking wait4 returns ECHILD at once
  (a WNOHANG one made right after the failure can still see the child
  being torn down and return 0). Observed in a probe, not tested: a NULL
  or unwritable pid_ptr is not an error; the child is started and the pid
  is not stored.
returns:
  success: "0; *pid_ptr = the child's pid (positive)"
errors:
  missing: "ENOENT (2): a missing file"
  not_executable: "EACCES (13): a directory, a file without execute permission"
  not_a_program: "ENOEXEC (8) was returned for an executable text file in a probe (not in the visible tests)"
  not_a_directory: "ENOTDIR (20): a file used as a directory"
side_effects: "a new process"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
