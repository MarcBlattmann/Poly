# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/setattrlist.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# setattrlist.tests/macos.json.
id: macos/syscall/bsd/setattrlist
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-19
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 221,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 221, arguments in x0..x5 (second result in x1).
  On failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. setattrlist(path,
  attrlist, buffer, size, options) sets attributes from a packed buffer in
  bitmap order and returns 0. ATTR_CMN_CRTIME (0x200), MODTIME (0x400) and
  ACCTIME (0x1000) take a timespec (16 bytes: seconds, nanoseconds) each,
  in that order when several are given (creation before modification
  before access); stat shows them (st_birthtimespec, st_mtimespec,
  st_atimespec, nanoseconds kept). ATTR_CMN_ACCESSMASK (0x20000) takes a
  u32 mode (permission bits; the file type is kept), ATTR_CMN_FLAGS
  (0x40000) a u32 of file flags (UF_HIDDEN 0x8000 shows in st_flags; 0
  clears). ATTR_CMN_CHGTIME (0x800) is accepted (0) but the change time
  becomes the time of the call, not the value. The name (0x1) and object
  type (0x8) cannot be set (EINVAL 22); a buffer too small for the
  attributes is EINVAL. A missing file is ENOENT (2), a path through a
  file ENOTDIR (20), an unreadable path EFAULT (14). A symbolic link is
  followed unless options has FSOPT_NOFOLLOW (1): then the link itself
  changes and the target does not (a dangling link followed is ENOENT,
  with FSOPT_NOFOLLOW it works). Directories can be changed too.
returns:
  success: "0"
errors:
  bad_attribute: "EINVAL (22) not settable or buffer too small"
  path: "ENOENT (2), ENOTDIR (20), EFAULT (14)"
side_effects: "times, mode or flags of the file change"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
