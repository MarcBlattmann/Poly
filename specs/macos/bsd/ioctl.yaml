# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/ioctl.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# ioctl.tests/macos.json.
id: macos/syscall/bsd/ioctl
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 54,
  arguments in rdi, rsi, rdx, r10, r8, r9 (second result in rdx); arm64
  `svc #0x80` with x16 = 54, arguments in x0..x5 (second result in x1). On
  failure the carry flag is set and the result register holds the errno
  (<sys/errno.h>); on success the carry flag is clear. ioctl(fd, request,
  argument): TIOCGWINSZ (0x40087468) on something that is not a terminal
  fails with ENOTTY (25) for a regular file, a pipe and a directory, and
  with ENODEV (19) for /dev/null; EBADF for a descriptor that is not open.
  FIONREAD (0x4004667f, int result) is the number of bytes that can be
  read: the bytes waiting in a pipe (0, 4, then 1 after reading 3), the
  rest of a regular file from the offset (10 at offset 0, 6 after reading
  4); an unwritable result pointer is EFAULT (14). FIOCLEX (0x20006601)
  and FIONCLEX (0x20006602) set and clear close-on-exec (seen with fcntl
  F_GETFD); FIONBIO (0x8004667e, int pointer) sets and clears O_NONBLOCK
  (F_GETFL). A request that the object does not know (0x12345678) is
  ENOTTY on a pipe and on a file.
returns:
  success: "0, or the request's result through the pointer"
errors:
  not_a_terminal: "ENOTTY (25): TIOCGWINSZ on a file, pipe or directory; an unknown request"
  not_a_terminal_device: "ENODEV (19): TIOCGWINSZ on /dev/null"
  bad_fd: "EBADF (9)"
  bad_pointer: "EFAULT (14): FIONREAD into address 8"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
