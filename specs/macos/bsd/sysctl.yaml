# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sysctl.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sysctl.tests/macos.json.
id: macos/syscall/bsd/sysctl
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 202,
  arguments in rdi, rsi, rdx, r10, r8, r9; arm64 `svc #0x80` with x16 =
  202, arguments in x0..x5. On failure the carry flag is set and the
  result register holds the errno (<sys/errno.h>); on success the carry
  flag is clear. sysctl(name, namelen, oldp, oldlenp, newp, newlen) reads
  (and with newp writes) the value named by an array of integers
  (<sys/sysctl.h>). {CTL_KERN 1, KERN_OSTYPE 1} is "Darwin" with its NUL
  (7 bytes); {CTL_KERN, KERN_OSRELEASE 2} the Darwin release ("27.0.0" on
  the oracle); {CTL_HW 6, HW_PAGESIZE 7} a 4-byte integer (16384 for
  arm64), 4 bytes even into an 8-byte buffer; {CTL_HW, HW_NCPU 3} a
  positive 4-byte integer. With oldp NULL the call returns 0 and sets
  *oldlenp to the size. A buffer too small is ENOMEM, *oldlenp becomes 0
  and nothing is copied. Observed but not tested: an unwritable oldlenp
  (address 8) made the call never return (the thread spun at full CPU
  until killed); Poly should fail it with EFAULT instead.
returns:
  success: "0, *oldlenp = bytes copied"
  size_query: "0 with oldp NULL, *oldlenp = the value's size"
errors:
  unknown: "ENOENT (2): {CTL_KERN, 99999}, {99, 1}"
  name_length: "EINVAL (22): namelen 0, 1 or 13 (more than CTL_MAXNAME 12)"
  small_buffer: "ENOMEM (12): *oldlenp smaller than the value; *oldlenp set to 0"
  bad_pointer: "EFAULT (14): name or oldp at address 8"
  read_only: "EPERM (1): setting kern.ostype"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
