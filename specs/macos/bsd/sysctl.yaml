# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/bsd/sysctl.yaml. Observed with C tests of raw system calls
# (tests/macos/include/poly_mtest.h, ADR 0182); results per architecture in
# sysctl.tests/macos.json.
id: macos/syscall/bsd/sysctl
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively. x86_64 not observed yet: Rosetta 2 is not installed on the oracle, so the x86_64 builds of the tests were not run"
  observed_by: spec-macos-1
  date: 2026-11-14
summary: >
  Raw call, no libSystem: x86_64 `syscall` with rax = 0x2000000 | 202,
  arguments in rdi, rsi, rdx, r10, r8, r9; arm64 `svc #0x80` with x16 = 202,
  arguments in x0..x5. On failure the carry flag is set and the result
  register holds the errno (<sys/errno.h>); on success the carry flag is
  clear. sysctl(name, namelen, oldp, oldlenp, newp, newlen) reads (and with
  newp writes) the value named by an array of integers (<sys/sysctl.h>).
  {CTL_KERN 1, KERN_OSTYPE 1} is "Darwin" with its NUL (7 bytes); {CTL_KERN,
  KERN_OSRELEASE 2} the Darwin release ("27.0.0" on the oracle); {CTL_HW 6,
  HW_PAGESIZE 7} a 4-byte integer (16384 for arm64), 4 bytes even into an
  8-byte buffer; {CTL_HW, HW_NCPU 3} a positive 4-byte integer. With oldp
  NULL the call returns 0 and sets *oldlenp to the size. A buffer too small
  is ENOMEM, *oldlenp becomes 0 and nothing is copied. Observed but not
  tested: an unwritable oldlenp (address 8) made the call never return (the
  thread spun at full CPU until killed); Poly should fail it with EFAULT
  instead. More names. {CTL_HW, HW_MEMSIZE 24} is an 8-byte integer (more
  than 1 GiB); HW_BYTEORDER 4 is 1234; HW_MACHINE 1 a string ("arm64" on the
  oracle, a value); KERN_OSREV 3 is 199506; KERN_ARGMAX 8 is at least 262144
  (1048576 on the oracle); KERN_MAXPROC 6 and KERN_MAXFILES 7 are positive;
  KERN_VERSION 4 starts "Darwin Kernel Version " and ends with a NUL;
  KERN_HOSTNAME 10 is not empty; KERN_OSVERSION 65 is the build ("26A428", a
  value); KERN_BOOTTIME 21 is a struct timeval of 16 bytes after 2023 (an
  8-byte buffer is ENOMEM). Processes: {CTL_KERN, KERN_PROC 14,
  KERN_PROC_PID 1, pid} fills struct kinfo_proc (<sys/sysctl.h>, 648 bytes:
  p_stat at 36 is 2 for a running process, p_pid at 40, p_comm at 243, the
  uid at 420, e_ppid at 560); a pid that does not exist succeeds with length
  0; a 100-byte buffer is ENOMEM; a size query reports more than one record
  (3888 on the oracle, a value). {CTL_KERN, KERN_PROCARGS2 49, pid} gives an
  int argc and then the executable's path as the program was started; it is
  EINVAL for a pid that does not exist and for another user's process (pid
  1). {CTL_SYSCTL 0, 3} (name to numbers; no public header: found by
  experiment) takes the name as new data: "kern.ostype" gives {1, 1} (8
  bytes), "hw.memsize" {6, 24}, "kern.nosuch" ENOENT.
returns:
  success: "0, *oldlenp = bytes copied"
  size_query: "0 with oldp NULL, *oldlenp = the value's size"
errors:
  unknown: "ENOENT (2): {CTL_KERN, 99999}, {99, 1}"
  name_length: "EINVAL (22): namelen 0, 1 or 13 (more than CTL_MAXNAME 12)"
  small_buffer: "ENOMEM (12): *oldlenp smaller than the value; *oldlenp set to 0"
  bad_pointer: "EFAULT (14): name or oldp at address 8"
  read_only: "EPERM (1): setting kern.ostype"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one system call"
  guarantees: "none"
tests:
  visible: 4  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
