# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontDrawGlyphs.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontDrawGlyphs.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontDrawGlyphs"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontDrawGlyphs(font, glyphs, positions, count, context) draws count glyphs, each at its position
  (the glyph's origin on the baseline, in the context's user space), with the context's fill colour,
  transformation and antialiasing; no text position is used. In the 14 x 12 gray bitmap of the
  CTLineDraw sheet, A at (1,2) and B at (7,2) at size 10 give the two black boxes columns 2..5 rows
  3..9 and columns 8..10 rows 5..9, nothing else; a count of 0 draws nothing; glyph 0 (.notdef, a box
  5..45 units wide) is drawn as its box with half covered columns at both ends (x 0.5..4.5 from its
  origin). With CGContextScaleCTM(2,2) a size 5 A at (0.5, 1) draws the box of a size 10 A at (1,2);
  CGContextTranslateCTM(3,1) moves the box by (3,1) (columns 5..8, rows 2..8); white fill on a black
  background gives 0xff pixels on 0; a fill alpha of 0.5 black on white gives 0x7f or 0x80 inside the
  box. With DejaVu Sans the glyphs at the positions of a line's run (offset by the line's origin) give
  exactly the image CTLineDraw makes of the line. The fonts the tests bring: PolyTest Regular and Bold
  (units per em 1000; the glyphs are boxes: A box 100..500 x 0..700, B 100..400 x 0..500, V a
  triangle, W two V, a, g, e-acute and the accent mark U+0301 composites, .notdef a box, U+1F600 a box
  through a format 12 cmap; hhea 800/-200/line gap 100, OS/2 typo 700/-300/50, win 900/250, capHeight
  700, xHeight 500, a kern pair A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "nothing"
errors:
  null_context: "NULL or invalid arguments not listed here are not supported (the process may crash)"
side_effects: "changes the context's bitmap"
threading: "a context is used by one thread at a time"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
