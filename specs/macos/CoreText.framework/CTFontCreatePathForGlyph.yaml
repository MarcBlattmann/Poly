# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontCreatePathForGlyph.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontCreatePathForGlyph.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontCreatePathForGlyph"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontCreatePathForGlyph(font, glyph, transform) returns a new CGPath of the glyph's outline in the
  glyph's coordinates (y up, scaled to the size, with the optional transform applied after) or NULL
  for a glyph without outline (space) or an id past the glyph count. A contour of straight edges is a
  move to, one line to per further point and a close: A at size 100 is move (10,0), line (10,70), line
  (50,70), line (50,0), close; V move (0,0), line (35,70), line (70,0), close; the ring O has two
  subpaths, the outer (0,0)(0,70)(70,70)(70,0) and the hole (20,20)(50,20)(50,50)(20,50), each closed;
  composites hold the subpaths of their parts shifted (W two triangles, the second moved by 70;
  e-acute the box of a at (5..45) and the accent at (15,52)..(25,62)); .notdef (glyph 0) is its box
  (5,0)..(45,70). A transform (scale (2,1)) changes the points (A becomes x 20..100, still 70 high); a
  font matrix is applied too; at size 10 every coordinate is a tenth. Quadratic curves of a TrueType
  outline (DejaVu) come out as quadratic curve elements. The fonts the tests bring: PolyTest Regular
  and Bold (units per em 1000; the glyphs are boxes: A box 100..500 x 0..700, B 100..400 x 0..500, V a
  triangle, W two V, a, g, e-acute and the accent mark U+0301 composites, .notdef a box, U+1F600 a box
  through a format 12 cmap; hhea 800/-200/line gap 100, OS/2 typo 700/-300/50, win 900/250, capHeight
  700, xHeight 500, a kern pair A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "a new CGPath"
  empty_or_invalid: "NULL"
errors: {}
side_effects: "allocates the path"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
