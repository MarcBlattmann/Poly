# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTLineGetTypographicBounds.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTLineGetTypographicBounds.tests/macos.json.
id: "macos/api/CoreText.framework/CTLineGetTypographicBounds"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTLineGetTypographicBounds(line, &ascent, &descent, &leading) returns the line's width and
  optionally its ascent, descent and leading (each pointer may be NULL). The width is the sum of the
  advances with the font's kerning applied: PolyTest at size 100 'AB' 110, 'A' 60, 'BB' 100, 'A A' 150
  (a space counts 30), 'AV' 120 (A,V -10), 'VA' 122 (V,A -8), 'AVA' 172; the bold font 'AB' 122; the
  empty line 0 with ascent, descent and leading 0 as well; for a non-empty line the ascent, descent
  and leading are those of the font (80, 20, 10 at size 100) or, with several fonts, the largest of
  them (a size 50 and a size 100 run: 80, 20, 10; the width then adds 30 and 50). Sizes scale (size
  10: 'AB' 11, ascent 8, descent 2, leading 1). CTLineGetTrailingWhitespaceWidth is the width of the
  spaces at the line's end ('A A ' at size 100: width 180, trailing 30; 'AB' 0). DejaVu Sans 2.37 at
  size 100: 'Hello, World' 603.61 with ascent 92.82, descent 23.58, leading 0; at size 12 the width is
  12/100 of that (not rounded); 'AV' 130.42 (GPOS kerning). The fonts the tests bring: PolyTest
  Regular and Bold (units per em 1000; the glyphs are boxes: A box 100..500 x 0..700, B 100..400 x
  0..500, V a triangle, W two V, a, g, e-acute and the accent mark U+0301 composites, .notdef a box,
  U+1F600 a box through a format 12 cmap; hhea 800/-200/line gap 100, OS/2 typo 700/-300/50, win
  900/250, capHeight 700, xHeight 500, a kern pair A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "the width as double"
errors:
  null_line: "NULL or invalid arguments not listed here are not supported (the process may crash)"
side_effects: "writes the requested values"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds; no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
