# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTRunGetPositions.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTRunGetPositions.tests/macos.json.
id: "macos/api/CoreText.framework/CTRunGetPositions"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTRunGetPositions(run, range, buffer) copies the glyph positions of the run (range (0,0) means all)
  as CGPoints: the pen position before each glyph relative to the line's origin, the baseline at y 0.
  'AB' at size 100: (0,0) and (60,0); 'AVA' with kerning (0,0), (50,0), (112,0): the kern of a pair
  (A,V -10, V,A -8) is subtracted from the advance of the first glyph of the pair, so CTRunGetAdvances
  gives 50, 62, 60 for A, V, A; glyph ids 2, 4, 2 and string indices 0, 1, 2 (CTRunGetGlyphs,
  CTRunGetStringIndices); a sub-range (1,2) gives the last two positions. Positions scale with the
  size (size 10: B at x 6). A combining mark after 'a' (a font without mark positioning) is placed by
  CoreText itself: the 'a' advance becomes 20, the mark (advance 30) sits at (20, 60) at size 100, so
  the pair is as wide as before (50), and the run's status (CTRunGetStatus) is 16 instead of 0; the
  text matrix of a run (CTRunGetTextMatrix) is the identity. CTRunGetPositionsPtr and
  CTRunGetGlyphsPtr may return NULL (callers must copy); when not NULL they agree with the copying
  calls. DejaVu Sans 'AVA' at size 100: glyph ids 36, 57, 36, the first position 0, the second the
  kerned advance of A (62.01 = 68.41 less the 6.40 kern), the third adds V's advance; the run's width
  is the last position plus the last advance. The fonts the tests bring: PolyTest Regular and Bold
  (units per em 1000; the glyphs are boxes: A box 100..500 x 0..700, B 100..400 x 0..500, V a
  triangle, W two V, a, g, e-acute and the accent mark U+0301 composites, .notdef a box, U+1F600 a box
  through a format 12 cmap; hhea 800/-200/line gap 100, OS/2 typo 700/-300/50, win 900/250, capHeight
  700, xHeight 500, a kern pair A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "nothing; fills the buffer"
errors:
  range_out_of_bounds: "NULL or invalid arguments not listed here are not supported (the process may crash)"
side_effects: "writes the positions"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds; no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
