# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontGetBoundingRectsForGlyphs.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontGetBoundingRectsForGlyphs.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontGetBoundingRectsForGlyphs"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontGetBoundingRectsForGlyphs(font, orientation, glyphs, rects, count) stores for each glyph the
  rectangle of its outline in the glyph's own coordinates (origin at the pen position on the baseline,
  y up) scaled to the size, and returns the union of all of them (also when rects is NULL); for count
  0 the union is the zero rectangle. PolyTest at size 100: A (10,0) 40 x 70, B (10,0) 30 x 50, V (0,0)
  70 x 70, W (0,0) 140 x 70, a (5,0) 40 x 50, g (5,-20) 40 x 60 (reaching below the baseline), the
  composite e-acute (5,0) 40 x 62 (a and the shifted accent), the mark (0,0) 10 x 10, .notdef (5,0) 40
  x 70, O (0,0) 70 x 70, and the empty space the zero rectangle (0,0,0,0); the union of all of these
  starts at (0,-20) and is 140 x 90. At size 10 the A is (1,0) 4 x 7; the bold A is 46 wide at size
  100. DejaVu Sans at size 100: A (0.78,0) 66.80 x 72.90, V the same width, a (6.01,-1.42) 46.19 x
  57.42: the outline's exact bounds, not rounded outward. The fonts the tests bring: PolyTest Regular
  and Bold (units per em 1000; the glyphs are boxes: A box 100..500 x 0..700, B 100..400 x 0..500, V a
  triangle, W two V, a, g, e-acute and the accent mark U+0301 composites, .notdef a box, U+1F600 a box
  through a format 12 cmap; hhea 800/-200/line gap 100, OS/2 typo 700/-300/50, win 900/250, capHeight
  700, xHeight 500, a kern pair A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "the union rectangle"
errors:
  null_glyphs: "NULL or invalid arguments not listed here are not supported (the process may crash)"
side_effects: "writes count rectangles"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
