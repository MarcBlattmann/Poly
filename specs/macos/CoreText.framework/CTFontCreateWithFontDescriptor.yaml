# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontCreateWithFontDescriptor.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontCreateWithFontDescriptor.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontCreateWithFontDescriptor"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontCreateWithFontDescriptor(descriptor, size, matrix) makes a font from a descriptor: one made
  from font data (CTFontManagerCreateFontDescriptorFromData, not registered), from a dictionary naming
  a registered font, or taken from a font (CTFontCopyFontDescriptor, which names the font by its
  PostScript name). The size is the one asked (20), 0 or a negative size give 12 (unless the
  descriptor has a size attribute, see CTFontDescriptorCreateWithAttributes); two fonts of one
  descriptor and size are CFEqual, another size or the bold data are not (two descriptors made
  separately from the same bytes give fonts that are not CFEqual). The matrix, applied to the glyphs,
  scales as written: with scale (2,1) at size 50 the size stays 50 and the ascent 40, a glyph A's
  outline is twice as wide (x 10..50 instead of 5..25) and keeps its height 35, the advances double
  (30 becomes 60), the bounding box doubles in width; the vertical metrics follow the matrix's y scale
  (a matrix of scale (2,3) at size 20 makes the ascent 48); the identity matrix changes nothing. A
  descriptor naming a registered bold font gives a bold font at the new size (its PostScript name
  'PolyTest-Bold' stays). The fonts the tests bring: PolyTest Regular and Bold (units per em 1000; the
  glyphs are boxes: A box 100..500 x 0..700, B 100..400 x 0..500, V a triangle, W two V, a, g, e-acute
  and the accent mark U+0301 composites, .notdef a box, U+1F600 a box through a format 12 cmap; hhea
  800/-200/line gap 100, OS/2 typo 700/-300/50, win 900/250, capHeight 700, xHeight 500, a kern pair
  A,V -100 and V,A -80), and DejaVu Sans 2.37.
returns:
  success: "a new CTFont"
errors: {}
side_effects: "none"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
