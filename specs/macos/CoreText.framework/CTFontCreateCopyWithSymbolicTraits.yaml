# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontCreateCopyWithSymbolicTraits.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontCreateCopyWithSymbolicTraits.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontCreateCopyWithSymbolicTraits"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontCreateCopyWithSymbolicTraits(font, size, matrix, value, mask) returns a font of the same
  family with the traits changed: bits in the mask take their value from value. PolyTest Regular asked
  for bold (value and mask kCTFontTraitBold) gives PolyTest-Bold at the same size (a size argument
  that is not 0 sets the size, 0 keeps the font's), the bold font asked to drop bold (value 0, mask
  bold) gives PolyTest-Regular, value 0 and mask 0 give the same face (a copy at the new size). A
  trait the family has no face for gives NULL (italic for PolyTest); the bold copy of a registered
  regular font is NULL when the bold face is not registered; a font made from data and not registered
  has no family to choose from, so a trait change gives NULL while the no-change copy works. With
  DejaVu Sans registered: bold copy DejaVuSans-Bold, italic copy DejaVuSans-Oblique, both
  DejaVuSans-BoldOblique, dropping bold from the last gives DejaVuSans-Oblique. The family of the copy
  is the same. Faces must be registered with CTFontManagerRegisterFontsForURL to be found. The fonts
  the tests bring: PolyTest Regular and Bold (units per em 1000; the glyphs are boxes: A box 100..500
  x 0..700, B 100..400 x 0..500, V a triangle, W two V, a, g, e-acute and the accent mark U+0301
  composites, .notdef a box, U+1F600 a box through a format 12 cmap; hhea 800/-200/line gap 100, OS/2
  typo 700/-300/50, win 900/250, capHeight 700, xHeight 500, a kern pair A,V -100 and V,A -80), and
  DejaVu Sans 2.37.
returns:
  success: "a new CTFont"
  no_such_face: "NULL"
errors: {}
side_effects: "none"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
