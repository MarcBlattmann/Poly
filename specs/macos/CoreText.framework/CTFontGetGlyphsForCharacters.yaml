# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreText.framework/CTFontGetGlyphsForCharacters.yaml. Observed with C test programs linked against CoreText
# (tests/macos/include/poly_mct.h, ADR 0182); results per architecture in CTFontGetGlyphsForCharacters.tests/macos.json.
id: "macos/api/CoreText.framework/CTFontGetGlyphsForCharacters"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the CoreText, CoreGraphics and CoreFoundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes, and the two architectures gave the same results. Tests are C programs that link CoreText (the line `poly-mac: coretext`, tests/macos/include/poly_mct.h). The results do not depend on Apple's fonts: tests use the PolyTest TrueType fonts embedded in poly_mct.h (made by tests/macos/fonts/mkfont.py) and DejaVu Sans 2.37 files the runner copies into the scratch directory (`poly-mac: fonts`); the few tests about Apple's own fonts are named sys_ and described as SYSTEM-DEPENDENT; results and output go through raw system calls"
  observed_by: spec-macos-coretext
  date: 2026-11-20
summary: >
  CTFontGetGlyphsForCharacters(font, characters, glyphs, count) maps count UTF-16 units through the
  font's cmap and stores glyph ids, returning true only when every unit has a glyph. PolyTest ids:
  space 1, A 2, B 3, V 4, W 5, a 6, g 7, U+00E9 8, the mark U+0301 9, the emoji U+1F600 10, O 11,
  .notdef 0; the same at every size and for the bold font. A character the font lacks ('z') stores
  glyph 0 and makes the result false, the other glyphs are still stored; a count of 0 returns true and
  writes nothing. A character above U+FFFF is given as a surrogate pair: the glyph is stored in the
  slot of the high surrogate, the low surrogate's slot is 0, and the result is true when the font has
  the character (U+1F600 for PolyTest); a pair for a character the font lacks (U+1F601), a lone high
  surrogate or a lone low surrogate gives glyph 0 and false. For DejaVu Sans 2.37: A 36, V 57, a 68,
  space 3, W 58, U+00E9 171, the Arabic alef U+0627 has a glyph, the CJK U+4E2D has none (false). The
  fonts the tests bring: PolyTest Regular and Bold (units per em 1000; the glyphs are boxes: A box
  100..500 x 0..700, B 100..400 x 0..500, V a triangle, W two V, a, g, e-acute and the accent mark
  U+0301 composites, .notdef a box, U+1F600 a box through a format 12 cmap; hhea 800/-200/line gap
  100, OS/2 typo 700/-300/50, win 900/250, capHeight 700, xHeight 500, a kern pair A,V -100 and V,A
  -80), and DejaVu Sans 2.37.
returns:
  all_mapped: "true"
  some_missing: "false (glyph 0 for each missing)"
errors:
  null_buffers: "NULL or invalid arguments not listed here are not supported (the process may crash)"
side_effects: "writes count glyph ids"
threading: "CoreText objects are immutable once made and may be used from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
