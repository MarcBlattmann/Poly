# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/method_exchangeImplementations.yaml. Observed with Objective-C test programs built by
# `pipeline mac build` (directive `poly-mac: libobjc`, tests/macos/include/poly_mobjc.h, ADR 0182); results per
# architecture in method_exchangeImplementations.tests/macos.json.
id: macos/api/libobjc.A.dylib/method_exchangeImplementations
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment, built as Objective-C against libobjc.A.dylib and the root class NSObject only (no Foundation); arm64 observed natively, x86_64 under Rosetta 2, three runs per architecture with identical output; every observation below was the same on both architectures unless a difference is named"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  void method_exchangeImplementations(Method m1, Method m2). Swaps the two methods' implementations.
  Each Method keeps its selector, its type encoding (they are not swapped even when the types differ)
  and its pointer; messages for m1's selector now run m2's old IMP and the other way round;
  class_getMethodImplementation follows. Calling it again with the same pair undoes the swap; a Method
  exchanged with itself is unchanged. It is the usual swizzle: after exchanging "target" with "swz", a
  message "target" runs the replacement, which sends "swz" to reach the original. The Methods may be
  inherited: exchanging the leaf's own method with a method the leaf only inherits changes the
  inherited Method's owner as well (the superclass's selector then answers the leaf's old value),
  because the Method object is the owner's; exchanging the superclass's two Methods leaves a
  subclass's override alone while the subclass's inherited methods follow. The next message sees the
  change, also for warmed-up call sites.
returns:
  none: "void"
errors:
  none: "no error codes"
  null_method: "not observed"
side_effects: "the two Methods' implementations are swapped, for all receivers of the owning classes"
threading: "No thread-specific behaviour was observed: the tests are single-threaded and the call does not depend on the calling thread. Behaviour under concurrent calls from several threads was not observed."
ordering:
  - "effective for the next message after the call returns"
timing:
  typical: "microseconds: an in-process call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
