# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/sel_getName.yaml. Observed with Objective-C test programs built by
# `pipeline mac build` (directive `poly-mac: libobjc`, tests/macos/include/poly_mobjc.h, ADR 0182); results per
# architecture in sel_getName.tests/macos.json.
id: macos/api/libobjc.A.dylib/sel_getName
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment, built as Objective-C against libobjc.A.dylib and the root class NSObject only (no Foundation); arm64 observed natively, x86_64 under Rosetta 2, three runs per architecture with identical output; every observation below was the same on both architectures unless a difference is named"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  const char *sel_getName(SEL sel). The name a selector was registered with, as a NUL-terminated
  string, the same pointer on every call and unaffected by later registrations or by changes to the
  buffer the name was registered from. Gives the exact name for compiler selectors
  ("first:second:third:"), NSObject's selectors, selectors registered at run time, selectors returned
  by method_getName of compiled or run-time methods (also class methods), and the empty string for the
  selector registered with the empty name. The NULL selector gives the text "<null selector>" (not
  NULL). Registering the returned name with sel_registerName gives the same selector back.
returns:
  name: "the selector's name"
  null_selector: "\"<null selector>\" for a NULL selector"
errors:
  none: "no error codes"
side_effects: "none"
threading: "No thread-specific behaviour was observed: the tests are single-threaded and the call does not depend on the calling thread. Behaviour under concurrent calls from several threads was not observed."
ordering: []
timing:
  typical: "microseconds: an in-process call"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
