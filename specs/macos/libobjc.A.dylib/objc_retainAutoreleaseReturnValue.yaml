# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_retainAutoreleaseReturnValue.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_retainAutoreleaseReturnValue.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_retainAutoreleaseReturnValue
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_retainAutoreleaseReturnValue(obj) is what a function calls to return an
  object it does not own (a pass-through of an argument or a field): it returns obj. Unpaired it
  is exactly objc_retainAutorelease: count +1 and one release queued in the pool, the pop returns
  the count to its earlier value. Paired with the caller's objc_retainAutoreleasedReturnValue it
  does the retain once for both and queues nothing: the caller sees count 2 (the owner's and its
  own), the pool is empty (the pop changes nothing), and the owner's release leaves the object
  alive with count 1 for the caller. nil is accepted and returned. Observed identical on x86_64
  and arm64. ARC-compiled (a non-inlined function returning its argument, caller keeping the
  result): two strong owners count 2, nothing is queued in the pool and the object dies at the end
  of the caller's scope.
returns:
  object: "the argument"
  nil: "nil"
errors:
  none: "no error"
side_effects: >
  Unpaired: count +1 and one release in the pool. Paired: count +1, pool unchanged.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "see objc_autoreleaseReturnValue for how the pairing is detected"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
