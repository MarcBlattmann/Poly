# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_retain.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_retain.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_retain
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_retain(obj) adds one reference to obj and returns obj. It is what
  compiled ARC code calls where it needs a +1 reference. For a normal object the count goes up by
  exactly one per call (1000 calls give 1001, and as many releases bring it back). The call is a
  message send of -retain to the object, so a class that overrides -retain sees one call per
  objc_retain, and whatever -retain returns is what objc_retain returns (an override returning nil
  makes objc_retain return nil). nil is accepted and returned. A class object is returned
  unchanged (and retaining and releasing it is harmless). Calling it from inside the object's own
  -dealloc is accepted, returns the object and does not resurrect it: the count read inside
  -dealloc is 0 before and after. Observed identically on x86_64 and arm64.
returns:
  object: "the argument (or what an overriding -retain returned)"
  nil: "nil"
  class_object: "the class object itself"
errors:
  none: "no error is reported; nil is not an error"
side_effects: >
  The object's count grows by one. A class that overrides -retain has it called once per call.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "-retain is sent once per call, before objc_retain returns"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
