# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_initWeak.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_initWeak.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_initWeak
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_initWeak(location, obj) initialises uninitialised storage as a weak
  reference: whatever the location held before (garbage was used) is ignored and not read. It
  returns obj and *location is obj; no count change. With nil it sets the location to nil and
  returns nil. Afterwards the location behaves as one made by objc_storeWeak: it is zeroed when
  the object dies (3 locations from initWeak and storeWeak tested), a class object can be the
  target, and loadWeakRetained works. On an object being deallocated it aborts the process like
  objc_storeWeak (SIGABRT, 6). Identical on x86_64 and arm64.
returns:
  object: "the argument"
  nil: "nil when obj is nil"
errors:
  target_deallocating: "the process aborts (SIGABRT, 6)"
side_effects: >
  The location is registered as a weak reference; no count change.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "no hooks other than those of objc_storeWeak were observed"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
