# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_storeStrong.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_storeStrong.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_storeStrong
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_storeStrong(location, new) makes *location a strong reference to new: new
  is retained (a message send of -retain, once), *location is set to new, then the old value is
  released (-release, once, and after the store, so a -dealloc of the old object that looks at the
  location already sees new). Storing the same object again changes no count and never deallocates
  it, also when the location is the only owner. Storing nil releases the old value and sets the
  location to nil (the old value dies if that was its last reference). nil over nil is a no-op.
  There is no return value. Identical on x86_64 and arm64. ARC-compiled assignments to strong
  globals, instance variables and variables (clang may emit inline retain and release instead of
  this call, with the same counts): each assignment adds one count to the new value and gives one
  back from the old, nil gives back, and the object dies when its last variable is cleared.
returns:
  value: "none (void)"
errors:
  none: "no error; a nil new value or an empty location is not an error"
side_effects: >
  new count +1, old count -1, *location written.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "retain of the new value, then the store, then the release of the old value (the order of retain and store is not observed separately; the store before the release is)"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
