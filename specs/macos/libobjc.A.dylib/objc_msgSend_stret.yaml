# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_msgSend_stret.yaml. Observed with Objective-C test programs (tests/macos/include/poly_mobjc.h,
# ADR 0182); results per architecture in objc_msgSend_stret.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_msgSend_stret
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment, 3 runs per architecture with identical output; arm64 observed natively, x86_64 under Rosetta 2 (no native Intel Mac was available, so a difference between Rosetta and real Intel hardware would not show); the programs are Objective-C compiled with Apple clang, loading /usr/lib/libobjc.A.dylib, with no Foundation except where a sheet says so (poly-mac: libobjc, poly_mobjc.h)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  x86_64 only: the symbol does not exist in the arm64 runtime (looked up with dlsym: absent), where a struct return of any size is made with plain
  objc_msgSend (the caller passes the result address in x8). On x86_64 this is the
  variant of objc_msgSend for methods whose return value is a struct that does not
  fit in the two return registers (more than 16 bytes, or containing a long double):
  the first argument is the address of the result buffer, then the receiver, the
  selector and the method's arguments; the method writes the struct into the buffer.
  Method search, resolver calls and the dispatch rules are those of objc_msgSend
  (class and instance receivers, inheritance, categories, +resolveInstanceMethod:
  and +resolveClassMethod: once per missing selector, cache never stale, tagged
  receivers). A nil receiver, a nil Class, a nil receiver with an unknown selector:
  the call returns at once, the buffer is NOT written (not zeroed), no method and no
  resolver run. Structs observed: 24 bytes (three longs, five more integer
  arguments after them), 32 bytes of doubles, 100 bytes, a struct of two long
  doubles; the bytes next to the buffer are never written.
returns:
  success: "void; the buffer holds the method's struct"
  nil_receiver: "void; the buffer is exactly as the caller left it (checked with a 0x5a fill, also for a nil Class and an unknown selector)"
  arm64: "symbol absent; use objc_msgSend"
errors:
  unrecognized_selector: "as objc_msgSend: stderr line and SIGABRT (not separately observed for stret)"
side_effects: "as objc_msgSend (resolver may add a method to the receiver's class)"
threading: "as objc_msgSend"
ordering:
  - "a resolver added method is called with the stret convention on the first send (observed with a 24-byte struct, for an instance and for a class receiver); the resolver is asked once"
timing:
  typical: "nanoseconds to microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
