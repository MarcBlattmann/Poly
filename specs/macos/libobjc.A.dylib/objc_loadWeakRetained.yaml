# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_loadWeakRetained.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_loadWeakRetained.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_loadWeakRetained
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_loadWeakRetained(location) reads a weak reference and returns the object
  with one added count that the caller owns (to be released), or nil when the location is nil or
  the object has died. It sends the object -retainWeakReference (once per load; override
  observed): an answer of no makes the load return nil, leaves the count unchanged and leaves the
  location untouched (still set while the object lives). The location itself is never written by a
  load. Loads from a location copied or moved from another one work the same, and a class object
  stored weakly loads back as itself. Inside the object's own -dealloc a load already returns nil.
  A loaded reference keeps the object alive after its owners released it; the location reads nil
  only after the loaded reference's release frees it. Identical on x86_64 and arm64.
returns:
  object: "the object, count +1"
  nil: "nil location, dead object, or -retainWeakReference answered no"
errors:
  none: "no error"
side_effects: >
  Count +1 on success.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "-retainWeakReference is sent once per load, before the count changes"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
