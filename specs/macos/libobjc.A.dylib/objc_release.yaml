# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libobjc.A.dylib/objc_release.yaml. Observed with Objective-C test programs built with
# clang for x86_64 and arm64 (tests/macos/include/poly_mobjc.h, ADR 0182); results per architecture in
# objc_release.tests/macos.json.
id: macos/api/libobjc.A.dylib/objc_release
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively and x86_64 under Rosetta 2; every test printed the same bytes on both architectures and on every run. Test programs are built with `poly-mac: libobjc` (linked against libobjc and the root class NSObject only, no Foundation)"
  observed_by: spec-macos-objc
  date: 2026-11-20
summary: >
  A "count" below is what the root class's retainCount method reports: 1 for a new object, one per
  owning reference. objc_release(obj) drops one reference. It is a message send of -release: a
  class that overrides -release sees one call per objc_release, including the one that frees the
  object, and an override that does nothing keeps the object alive however often objc_release is
  called. When the last reference goes, -dealloc runs exactly once, synchronously, before
  objc_release returns. nil is accepted and does nothing. There is no return value. When the owner
  of an object is released, its -dealloc body runs first and the objects it releases inside it die
  during that body (the observed order: the owner's -dealloc starts, an object released there dies
  at once, the owner's own superclass -dealloc finishes last). An object that has an extra
  reference survives its owner. Identical on x86_64 and arm64.
returns:
  value: "none (void)"
errors:
  nil: "accepted, no effect"
  over_release: "not observed (undefined; the process would be damaged)"
side_effects: >
  The count goes down by one; at zero -dealloc is sent once and the object is destroyed. Weak
  references to it are zeroed.
threading: >
  No thread-specific behaviour was observed; every test ran on the main thread of one process.
  Behaviour with several threads is not observed.
ordering:
  - "-dealloc of the object runs before objc_release returns"
  - "an object released inside -dealloc of its owner dies at that point, in the middle of the owner's -dealloc"
timing:
  typical: "microseconds: a few memory operations, no system call in the common case"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
