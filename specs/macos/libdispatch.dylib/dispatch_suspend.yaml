# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_suspend.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_suspend.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_suspend
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_suspend(object) stops a queue (or source) from starting new blocks; blocks already running finish; blocks submitted while suspended wait and run in submission order (50 blocks) after dispatch_resume. Suspensions nest: two suspends need two resumes (after one resume the block still had not run after 150 ms). A running block
  finishes when the queue is suspended, and the next one waits. dispatch_sync from another thread into a suspended queue waits until the resume. A concurrent queue is suspended the same way (ten blocks ran after the resume, none before).
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "suspends the object"
threading: "see the summary"
ordering: ["queued blocks keep their order across a suspend/resume"]
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
