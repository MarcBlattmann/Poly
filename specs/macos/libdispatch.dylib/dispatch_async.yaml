# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_async.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_async.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_async
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_async(queue, block) copies the block and returns at once; the block runs later on a thread of the queue (not the caller's thread, and on a
  serial queue never concurrently with its other blocks). The copy captures values as they were at submission (a local changed after the call is seen
  with its old value; the submitting function can return and its stack be overwritten). 100 blocks on a serial queue ran in order. A block may
  submit more blocks: one submitted to the same serial queue runs after the current block ends. 8 threads submitting 250 blocks each to one serial queue:
  2000 ran, none lost or doubled. A queue released while blocks are pending runs them first. Same on both architectures.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "queues a block"
threading: "safe from any thread"
ordering: ["blocks of one serial queue run in submission order"]
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
