# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_group_wait.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_group_wait.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_group_wait
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_group_wait(group, timeout) returns 0 when the group is empty (or became empty in time) and nonzero when the time ran out: a block that waits gave a nonzero result after at
  least the 100 ms, the same value as a semaphore wait that times out (49); DISPATCH_TIME_NOW on a busy group returns nonzero at once. After the block finished the group returned 0. After a timeout the group
  still tracks its blocks. Several threads can wait on one group: one leave released all four.
returns:
  "empty": "0"
  "timed_out": "nonzero (49)"
errors:
  "none": "no error result"
side_effects: "none"
threading: "blocks the caller until empty or the timeout"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
