# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_once.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_once.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_once
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_once(&predicate, block) runs the block exactly once the first time it is called with that predicate (a dispatch_once_t, zero in static storage), whichever
  thread calls; every other caller waits for the block to finish and returns after it (8 racing threads, a block that slept 30 ms: it ran once and no caller returned
  early). The predicate is nonzero afterwards (its value is not specified and differs: -1 on x86_64, another nonzero number on arm64). Later calls run nothing. A different predicate runs its own block;
  a predicate may be used inside the block of another (nested once calls ran in order outer-start, inner, outer-end); 100000 calls to a function with a static predicate ran the initialiser once.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "none"
threading: "callers wait for the first call's block"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
arch_differences: "the predicate's value after the run differs between architectures (not specified)"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
