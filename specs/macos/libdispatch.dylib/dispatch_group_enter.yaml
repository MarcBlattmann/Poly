# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_group_enter.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_group_enter.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_group_enter
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_group_enter(group) raises the group's count and dispatch_group_leave(group) lowers it; the group is empty again after as many leaves as enters, not before: with two entered, wait with a 50 ms
  timeout times out (nonzero) and after one leave still does, after the second leave wait returns 0. A leave from another thread releases a wait with no timeout. The usual enter / dispatch_async / leave pattern over ten tasks:
  all work finished when wait returned. The count may be raised and lowered from several threads; a notify block ran once, after the last of four leaves (not before). Unbalanced leaves are not tested (they crash).
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "changes the group's count"
threading: "safe from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
