# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_source_merge_data.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_source_merge_data.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_source_merge_data
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_source_merge_data(source, value) merges data into a DATA_ADD (sum) or DATA_OR (bitwise OR) source from any thread and schedules the event handler on the source's queue; dispatch_source_get_data there reads the accumulated value and resets it. One merge of 3 gave 3;
  8 threads x 1000 merges of 1 gave 8000 in all, over fewer handler calls than merges (they coalesce), never a call with data 0. Merging 0 fires nothing (DATA_OR 0 too). Eight flags merged from eight tasks into a DATA_OR source arrived as 0xff; a later merge starts from 0. A handler that merges into its own source runs again (five calls). A cancelled source ignores merges.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "merges data into the source"
threading: "safe from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
