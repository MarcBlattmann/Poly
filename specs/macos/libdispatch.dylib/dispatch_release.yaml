# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdispatch.dylib/dispatch_release.yaml. Observed with C programs that call libdispatch through
# libSystem (tests/macos/include/poly_mlibc.h and poly_mgcd.h, marked `poly-mac: libsystem`, ADR 0182);
# results per architecture in dispatch_release.tests/macos.json. Only what the outputs showed is stated; times
# are given as lower bounds, never as exact values.
id: macos/api/libdispatch.dylib/dispatch_release
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-dispatch
  date: 2026-11-20
summary: >
  dispatch_release(object) drops a reference; at zero the object is freed and its finalizer (dispatch_set_finalizer_f) is called with the object's context, but only when the context is not NULL (a finalizer on an object with a NULL context was not called in 200 ms). The finalizer runs
  asynchronously on the object's target queue: for a queue without explicit target on the default overcommit root queue "com.apple.root.default-qos.overcommit" (a worker thread, not the main thread); for a queue made with a target, on that target queue ("com.poly.finalize-target"). Groups and semaphores are finalized the same way. A pending-block queue is
  freed only after its blocks have run.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "may free the object and run its finalizer"
threading: "see the summary"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
