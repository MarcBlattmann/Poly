# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSBundle+@mainBundle.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSBundle+@mainBundle.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSBundle+@mainBundle"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  +[NSBundle mainBundle] (property) returns the bundle of the running program, the same object every
  time, never nil. From inside an application (T.app/Contents/MacOS/t started by a test): the bundle
  of the .app, bundlePath ending in '/T.app' (absolute, no trailing slash), bundleIdentifier from the
  Info.plist, executablePath '.../T.app/Contents/MacOS/t', resourcePath
  '.../T.app/Contents/Resources', bundleURL a file URL; +bundleWithIdentifier: finds it (nil for an
  unknown identifier), +bundleWithPath: of its path returns the same object, +allBundles contains it.
  A program outside any bundle still has a main bundle: no identifier (nil), an empty (non-nil)
  infoDictionary, nil for every objectForInfoDictionaryKey: and pathForResource, bundlePath the
  directory containing the executable (absolute, no trailing slash, equal to the executable path with
  its last component removed), a resourcePath. NSBundle is not toll-free bridged to CFBundle (they are
  separate objects), but CoreFoundation's main bundle answers the same facts: CFBundleGetMainBundle,
  CFBundleGetIdentifier (the same string object as bundleIdentifier) and CFBundleGetInfoDictionary (an
  equal dictionary); the sheets of CFBundleGetMainBundle apply.
returns:
  success: "the main NSBundle, never nil"
errors: {}
side_effects: "the first call reads the Info.plist"
threading: "objects are immutable or the class says otherwise; immutable values may be read from any thread"
ordering: []
timing:
  typical: "first call milliseconds; later microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
