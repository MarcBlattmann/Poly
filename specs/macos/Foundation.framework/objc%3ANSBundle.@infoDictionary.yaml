# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSBundle.@infoDictionary.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSBundle.@infoDictionary.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSBundle.@infoDictionary"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSBundle infoDictionary] is the bundle's Info.plist as an NSDictionary (a CFDictionary bridge)
  with property list types: strings (CFBundleName 'Probe', CFBundleVersion '42',
  CFBundleShortVersionString '1.2.3'), numbers (an integer is an NSNumber, 7), Booleans (the constant
  kCFBooleanTrue), arrays; and one key CoreFoundation adds, CFBundleNumericVersion (the packed version
  number, 1107329024 for these strings), so a plist of nine keys gives ten.
  objectForInfoDictionaryKey: reads one key (nil for a missing or differently cased key). A program
  outside a bundle has an empty, non-nil dictionary and CFBundleGetInfoDictionary agrees (count 0).
returns:
  success: "an NSDictionary"
errors: {}
side_effects: "none"
threading: "objects are immutable or the class says otherwise; immutable values may be read from any thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
