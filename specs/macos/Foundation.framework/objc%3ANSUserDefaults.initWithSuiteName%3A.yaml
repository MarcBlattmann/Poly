# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSUserDefaults.initWithSuiteName%3A.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSUserDefaults.initWithSuiteName%3A.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSUserDefaults.initWithSuiteName:"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSUserDefaults initWithSuiteName:] makes a defaults object bound to a preferences domain of that
  name (tests use test.poly.nsspec.* only and remove what they set with
  removePersistentDomainForName:). Objects on one suite see each other's values; objects on another
  suite and +standardUserDefaults (its own domain) do not; a new domain is empty (objectForKey: gives
  nil, the typed getters 0, NO, 0.0 and nil for missing keys); the user's global values
  (AppleLanguages) are visible through any suite; a nil suite name gives a usable object. The defaults
  are the preferences of CoreFoundation: CFPreferencesCopyAppValue(key, suite) sees the value set
  through the object, and CFPreferencesSetAppValue is visible through it (see the sheets of
  CFPreferencesCopyAppValue and SetAppValue). The preference file is written by the system's daemon a
  few seconds later; nothing in the behaviour depends on the file.
returns:
  success: "an initialised defaults object"
errors: {}
side_effects: "connects to the preferences daemon on first use"
threading: "safe from any thread"
ordering: []
timing:
  typical: "milliseconds the first time"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
