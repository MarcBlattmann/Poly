# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSAutoreleasePool.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSAutoreleasePool.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSAutoreleasePool"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  NSAutoreleasePool (usable only without ARC: the tests for it are built with -fno-objc-arc; with ARC
  the class is unavailable and @autoreleasepool is the replacement, which behaves the same). An object
  sent -autorelease is released when the innermost pool current at that time is drained (-drain) or
  released (-release), not before: an object autoreleased in a pool is alive until the drain and its
  dealloc runs exactly once in it; 100 autoreleased objects are all released by one drain; nested
  pools release their own objects when they are released, the inner pool's before the outer's; an
  object that was retained again survives the pool and is freed by its own release; @autoreleasepool {
  } blocks are the same pools (objects autoreleased inside are gone at the closing brace; an
  autoreleased result of a function called inside lives until then). Foundation methods that return
  autoreleased objects (stringWithFormat:, UTF8String buffers) tie their lifetime to the current pool.
  NSAutoreleasePool objects themselves are not autoreleased and must not be retained.
returns:
  drain: "the pool's contents are released; the pool is freed"
errors: {}
side_effects: "releases the autoreleased objects of the pool"
threading: "pools are per thread; each thread keeps its own stack of pools"
ordering:
  - "the pooled objects are released inside -drain/-release; an inner pool releases its objects before the outer one releases its own"
timing:
  typical: "microseconds per object"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
