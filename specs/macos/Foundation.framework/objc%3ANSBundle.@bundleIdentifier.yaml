# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSBundle.@bundleIdentifier.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSBundle.@bundleIdentifier.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSBundle.@bundleIdentifier"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSBundle bundleIdentifier] is the CFBundleIdentifier string of the bundle's Info.plist
  ('test.poly.probe' in the tests' application), the same object as CFBundleGetIdentifier gives and as
  objectForInfoDictionaryKey:@"CFBundleIdentifier"; nil for a bundle without an identifier: the main
  bundle of a program outside any bundle, a directory without an Info.plist opened with
  +bundleWithPath: (Contents/Resources of the application, the current directory '.'; the same object
  for the same path), while +bundleWithPath: of a missing directory gives nil.
returns:
  success: "the identifier string, owned by the bundle"
  none: "nil"
errors: {}
side_effects: "none"
threading: "objects are immutable or the class says otherwise; immutable values may be read from any thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
