# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSFileManager+@defaultManager.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSFileManager+@defaultManager.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSFileManager+@defaultManager"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  +[NSFileManager defaultManager] is one NSFileManager for the life of the process, the same from
  every call. currentDirectoryPath is the process's current directory (absolute; the tests start in an
  empty scratch directory, whose listing, contentsOfDirectoryAtPath:error:, is an empty array with no
  error); temporaryDirectory and homeDirectoryForCurrentUser are file URLs with absolute paths. The
  manager does the file work in the tests: createFileAtPath:contents:attributes: (returns YES, the
  file exists, attributesOfItemAtPath: gives NSFileSize and NSFileType 'NSFileTypeRegular'),
  copyItemAtPath:toPath:error: (the bytes are copied; copying a file onto itself fails),
  removeItemAtPath:error: (the file is gone; a second removal fails with NSCocoaErrorDomain code 4, no
  such file), contentsOfDirectoryAtPath:error: listing names without paths.
returns:
  success: "the shared manager"
errors:
  remove_missing: "NSCocoaErrorDomain 4 (NSFileNoSuchFileError)"
side_effects: "none for the accessor"
threading: "the default manager is safe to use from any thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
