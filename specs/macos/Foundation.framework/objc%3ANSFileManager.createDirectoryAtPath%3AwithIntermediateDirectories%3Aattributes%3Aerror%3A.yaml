# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSFileManager.createDirectoryAtPath%3AwithIntermediateDirectories%3Aattributes%3Aerror%3A.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSFileManager.createDirectoryAtPath%3AwithIntermediateDirectories%3Aattributes%3Aerror%3A.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSFileManager.createDirectoryAtPath:withIntermediateDirectories:attributes:error:"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSFileManager createDirectoryAtPath:withIntermediateDirectories:attributes:error:] makes a
  directory. Without intermediates: YES with no error when the directory is new; NO with
  NSCocoaErrorDomain code 516 (NSFileWriteFileExistsError) when it exists (also when a regular file is
  there), NO with code 4 when a parent is missing (and nothing is created). With intermediates the
  whole chain is made ('a/b/c'), and an existing directory is success (YES, error untouched); over a
  regular file it fails with 516. The error pointer may be NULL. Attributes: without them the new
  directory has mode 0755 under the tests' umask 022; NSFilePosixPermissions @0700 gives 0700 and
  @0750 gives 0750 (read back with attributesOfItemAtPath:error: as NSFilePosixPermissions; NSFileType
  is NSFileTypeDirectory). The directory is empty and removeItemAtPath:error: deletes it.
returns:
  success: "YES"
  failure: "NO, *error set"
errors:
  exists: "NSCocoaErrorDomain 516"
  parent_missing: "NSCocoaErrorDomain 4"
side_effects: "creates directories"
threading: "safe from any thread"
ordering: []
timing:
  typical: "microseconds to a millisecond (file system)"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
