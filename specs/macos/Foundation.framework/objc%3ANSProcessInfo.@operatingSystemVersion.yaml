# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSProcessInfo.@operatingSystemVersion.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSProcessInfo.@operatingSystemVersion.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSProcessInfo.@operatingSystemVersion"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSProcessInfo operatingSystemVersion] is an NSOperatingSystemVersion, a struct of three NSIntegers
  major, minor, patch (24 bytes); the oracle answers 27.0.0 (operatingSystemVersionString 'Version
  27.0 (Build 26A428)': the text starts with 'Version ', contains 'major.minor' and 'Build'). Chrome
  for macOS needs 13 or later, so Poly's answer must be at least 13.0.0 and consistent:
  -isOperatingSystemAtLeastVersion: is true for the same version, for older ones (13.0.0, 10.15.7) and
  false for the next major, the next minor and 99.0.0; two reads give the same values. The numbers are
  not printed by the tests (the oracle's differ from Poly's).
returns:
  success: "the version struct"
errors: {}
side_effects: "none"
threading: "objects are immutable or the class says otherwise; immutable values may be read from any thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
