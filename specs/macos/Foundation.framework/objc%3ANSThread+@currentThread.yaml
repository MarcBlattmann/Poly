# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSThread+@currentThread.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSThread+@currentThread.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSThread+@currentThread"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  +[NSThread currentThread] is the NSThread of the calling thread, the same object on every call from
  one thread. On the main thread it is +mainThread (isMainThread true for the class and the instance
  property, executing, not finished, not cancelled, a positive stackSize, a callStackSymbols array
  that is not empty); each thread has its own threadDictionary (the main thread's key 'who' is not
  visible in a worker, the worker's value is not visible in the main thread). On a thread started with
  detachNewThreadWithBlock: it is another object, not the main thread, stable inside the thread. The
  thread's name of the main thread is the empty string.
returns:
  success: "the calling thread's NSThread"
errors: {}
side_effects: "none"
threading: "per thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
