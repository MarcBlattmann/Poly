# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/Foundation.framework/objc%3ANSString.stringByAppendingPathComponent%3A.yaml. Observed with Objective-C test programs linked against Foundation
# (tests/macos/include/poly_mfn.h, ADR 0182); results per architecture in objc%3ANSString.stringByAppendingPathComponent%3A.tests/macos.json.
id: "macos/api/Foundation.framework/objc:NSString.stringByAppendingPathComponent:"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the Foundation of that release, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: foundation`, tests/macos/include/poly_mfn.h; NSAutoreleasePool's without ARC, `poly-mac: no-arc`); results and output go through raw system calls"
  observed_by: spec-macos-foundation
  date: 2026-11-20
summary: >
  -[NSString stringByAppendingPathComponent:] returns a new string with exactly one slash between the
  receiver and the component: '/usr/local' + 'bin', '/usr/local/' + 'bin' and '/usr/local' + '/bin'
  all give '/usr/local/bin'; an empty component gives the receiver without a trailing slash
  ('/usr/local'); an empty receiver gives the component alone ('bin'); '/' + 'x' gives '/x'; '/a//' +
  'b' gives '/a/b'; a component with slashes ('a/b') is added whole, '..' is not resolved
  ('/usr/local/../x'); non-ASCII text, spaces and dots are kept as they are; the receiver is not
  changed (also for an NSMutableString later modified). The result is an ordinary string whose
  lastPathComponent is the last part of what was added.
returns:
  success: "a new autoreleased string"
errors:
  nil_component: "raises an exception, not specified"
side_effects: "allocates"
threading: "objects are immutable or the class says otherwise; immutable values may be read from any thread"
ordering: []
timing:
  typical: "microseconds, no system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
