# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextSetAlpha.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextSetAlpha.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextSetAlpha
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextSetAlpha(context, alpha) multiplies everything drawn afterwards (fills, strokes, images) by alpha, clamped to 0..1 (-1 and 0 draw nothing, 2 behaves as 1); it multiplies the colour's own alpha: alpha 0.5 with a colour at alpha 0.5 stores 40 00 00 40 (0.25 -> 0x40); opaque orange (1, 0.5, 0) with alpha 0.1 -> 1a 0d 00 1a, 0.25 -> 40 20 00 40, 0.5 -> 80 40 00 80, 0.75 -> bf 60 00 bf. It is part of the graphics state (the restore brings full alpha back). With a partially covered edge pixel (a rect with a half-covered left edge at alpha 0.5): alpha 40 on arm64, 3f on x86_64 on the edge pixel, 80 inside.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "changes the graphics state"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
arch_differences: "a partially covered edge pixel at alpha 0.5: arm64 0x40, x86_64 0x3f"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
