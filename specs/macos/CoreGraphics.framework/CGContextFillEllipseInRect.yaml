# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextFillEllipseInRect.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextFillEllipseInRect.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextFillEllipseInRect
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextFillEllipseInRect(context, rect) fills the ellipse inscribed in the rect. Its path is exactly four cubic curves with the control point factor 0.5522847498307935 (a path of four CGContextAddCurveToPoint calls with those control points, and CGPathAddEllipseInRect added to the context, give identical bytes). The coverage rule observed for antialiased edges: the fraction c of a pixel an edge leaves covered (by area) is quantised to A = floor(256c + 0.5) in 0..256; the alpha of an opaque fill is A - 1 for A >= 1 (so 255 for a covered pixel and 0 below A = 1), and 0 for A = 0. For a rect edge this gives alpha 16k - 1 for coverage k/16 (0f 1f 2f ... ef ff for k = 1..16). Diagonal and curved edges follow the same rule within +-1 of the exact area. The exact alpha grids (rows from the top of the bitmap) are in the tests: a circle of diameter 2 at (1,1): rows `c4 c3` / `c4 c3`; diameter 3: 85 f3 85 / f3 ff f3 / 85 f3 85; diameter 4: 49 e3 e3 49 / e3 ff ff e3 ...; diameter 8 at (1,1) top row 26 ae f2 f2 ae 26; a half-pixel origin or sizes with fractions give the other tables. A thin ellipse 8 x 1 at (1,2): 71 c5 ea f9 f9 ea c5 71. A 35 x 33 ellipse hash is recorded. With antialiasing off a 10 x 10 circle paints the pixels it touches (alpha 255): 6 pixels in the top row, 8, 10, 10 ... Width or height 0 draws nothing.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "writes pixels"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
