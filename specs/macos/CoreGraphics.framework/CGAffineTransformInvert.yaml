# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGAffineTransformInvert.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGAffineTransformInvert.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGAffineTransformInvert
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGAffineTransformInvert(t) returns the inverse matrix (exact doubles in the tests: translate(10,20) -> [1 0 0 1 -10 -20]; scale(2,4) -> [0.5 0 0 0.25 0 0]; scale(3,7) shows the rounding of 1/3 and 1/7; rotate(0.5) -> the transposed rotation). A singular matrix (determinant 0, e.g. [1 2 2 4 3 4], or all zeros) is returned unchanged. Inverting twice gives the original for powers of two. Applying a matrix and its inverse to the point (3,4) returns (3,4) exactly for [2 0 0 4 5 6]. CGRectApplyAffineTransform returns the bounding box of the transformed rect (rect (1,2,4,2) rotated by pi/2: x -4, y 1.0000000000000002, w 2, h 4; through [2 0 0 -1 3 0]: (5, -4, 8, 2); CGRectNull stays null).
returns:
  "transform": "the inverse, or the argument itself when singular"
errors:
  "singular": "the matrix is returned unchanged"
side_effects: "none"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "nanoseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
