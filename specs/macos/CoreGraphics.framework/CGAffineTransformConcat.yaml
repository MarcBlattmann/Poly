# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGAffineTransformConcat.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGAffineTransformConcat.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGAffineTransformConcat
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGAffineTransformConcat(t1, t2) is t1 followed by t2 (row vector convention: result = t1 x t2): concat(translate(10,20), scale(2,3)) = [2 0 0 3 20 60]; concat(scale(2,3), translate(10,20)) = [2 0 0 3 10 20]; the identity is neutral; a rotation of 0.5 concatenated with a translation keeps the translation as the last matrix: exact doubles in the tests. CGAffineTransformTranslate/Scale/Rotate(t, ...) equal concat(MakeTranslation/MakeScale/MakeRotation, t): the new operation comes first. CGPointApplyAffineTransform uses [x y 1] x M. CGAffineTransformIsIdentity true for the identity only.
returns:
  "transform": "the product"
errors:
  "none": "no error result"
side_effects: "none"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "nanoseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
