# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextSaveGState.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextSaveGState.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextSaveGState
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextSaveGState pushes the graphics state and CGContextRestoreGState pops it. The state holds the fill and stroke colour, line width, cap, join, miter limit, dash, CTM, clip, global alpha, blend mode, antialiasing flag and interpolation quality: after a save, a green half-alpha multiply fill under a translate and clip with antialiasing off, the restore gives back red fills at full alpha, the original CTM (tx = ty = 0), the old clip, the blend mode normal. Nested saves restore in reverse order (colours blue, green, red, default black at depths 3, 2, 1, 0). A restore without a matching save does nothing (the fill stays the colour set before). The path is not part of the state.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "pushes a copy of the graphics state"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
