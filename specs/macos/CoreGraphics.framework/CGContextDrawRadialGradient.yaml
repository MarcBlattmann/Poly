# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextDrawRadialGradient.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextDrawRadialGradient.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextDrawRadialGradient
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextDrawRadialGradient(context, gradient, startCenter, startRadius, endCenter, endRadius, options) paints circles from the start circle to the end circle; with concentric circles of radius 0 to 5 (white to black) the red channel falls from ff at the centre to 00 at the end circle (the exact grid in the tests); outside the end circle nothing is drawn unless kCGGradientDrawsAfterEndLocation is given (then the end colour fills the rest); with a start radius 2 and end radius 5 and both extensions the whole row is filled (grid in the tests). Off-centre circles (start (4,6) r 0, end (7,6) r 5) give a cone-shaped field (grid in the tests); under Scale(2,1) the circles become ellipses.
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "writes pixels"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
