# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGColorSpaceCreateDeviceRGB.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGColorSpaceCreateDeviceRGB.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGColorSpaceCreateDeviceRGB
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGColorSpaceCreateDeviceRGB() returns the device RGB colour space: 3 components, model kCGColorSpaceModelRGB (1), the same object on every call, name kCGColorSpaceDeviceRGB, supports output, not wide gamut, a CFType (type id CGColorSpaceGetTypeID). It is not the object of the sRGB space (kCGColorSpaceSRGB). A bitmap context made in it stores colours as given: 0.2, 0.4, 0.6 opaque -> 33 66 99 ff; and for levels 0, .1, .25, .5, .75, .9, 1 of gray the bytes are the same as in an sRGB bitmap (00 1a 40 80 bf e6 ff). Its device-space companions: DeviceGray 1 component model monochrome (0), DeviceCMYK 4 components model CMYK (2); model constants 0 mono, 1 RGB, 2 CMYK, 3 lab, 5 indexed, 6 pattern. Retain/release keep the object.
returns:
  "colour space": "the shared device RGB space"
errors:
  "none": "no error result"
side_effects: "none"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
