# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextTranslateCTM.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextTranslateCTM.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextTranslateCTM
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextTranslateCTM(context, tx, ty) moves the origin in user space; the CTM (CGContextGetCTM) of a new bitmap context is the identity (a = d = 1, others 0); after Translate(2,1): tx = 2, ty = 1; translations add up. A fractional translate gives fractional edges (Translate(0.5, 0.25) on an aligned rect 3 x 2 at (1,1): antialiased alpha rows in the tests). CGContextGetUserSpaceToDeviceSpaceTransform is the CTM followed by the flip to the device's top-left origin (CGContextGetCTM itself stays the plain y-up matrix); CGContextConvertPointToDeviceSpace / ToUserSpace, ConvertRectToDeviceSpace and ConvertSizeToDeviceSpace apply it (after Translate(3,2), Scale(2,2) in an 8 pixel high bitmap: the user-to-device transform is [2 0 0 -2 3 6], device y points down; (1,1) -> device (5,4); device (9,4) -> user (3,1); rect (1,1,2,1) -> (5,2,4,2); size (1,1) -> (2,-2)).
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "changes the CTM of the graphics state"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
