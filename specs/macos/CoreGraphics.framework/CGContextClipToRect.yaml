# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGContextClipToRect.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGContextClipToRect.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGContextClipToRect
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGContextClipToRect(context, rect) intersects the clip with the rect: later drawing outside it does nothing. A whole-pixel clip clips exactly; a fractional one has antialiased edges (clip (1.5, 1.25, 4.25, 3.5) with a black fill gives alpha rows 5f bf bf bf 8f / 7f ff ff ff bf / ...); with antialiasing off the clip covers every pixel it touches. Clips intersect (two rects -> their intersection); disjoint clips draw nothing; CGContextGetClipBoundingBox returns the rect clipped (1.5, 1.25, 4.25, 3.5 exactly, doubles), an empty clip gives width 0. The clip belongs to the graphics state (CGContextSaveGState/RestoreGState bring the old one back) and is fixed in device space: a later translate of the CTM does not move it. An empty rect clips everything away. A clip multiplies the alpha of a translucent fill (half-transparent red through a clip edge of 50% coverage: 40 or 3f, as in FillRect).
returns:
  "result": "void"
errors:
  "none": "no error result"
side_effects: "narrows the clip of the graphics state"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
arch_differences: "a translucent fill through a partial-coverage clip edge: arm64 40, x86_64 3f"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
