# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/CoreGraphics.framework/CGBitmapContextCreateImage.yaml. Observed with C programs that draw into a CGBitmapContext
# (tests/macos/include/poly_mcg.h, marked `poly-mac: coregraphics`, ADR 0182); the tests print the bytes
# of chosen pixels (or alpha grids, or hashes of the buffer) so the result is pixel exact; results per
# architecture in CGBitmapContextCreateImage.tests/macos.json. No CoreGraphics, Quartz, Cairo or Skia source was read.
id: macos/api/CoreGraphics.framework/CGBitmapContextCreateImage
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; they gave the same bytes except where the summary says otherwise). Output of the tests is written with raw system calls, never through the code under test"
  observed_by: spec-macos-cg
  date: 2026-11-20
summary: >
  CGBitmapContextCreateImage(context) makes an image of the pixels at that moment: same width, height, bits per component and pixel, bytes per row, alpha info and bitmap info as the context (an RGBA context: 8, 32, kCGImageAlphaPremultipliedLast; a BGRA context made with premultiplied first + 32 little: bitmap info 8194 (0x2002), alpha info 2; an 8 bit gray context: 8 bits per pixel, 4 bytes per row for a 4 pixel width), not a mask. The image is a snapshot: drawing into the context afterwards does not change it (the red image still draws red after the context was filled blue). Drawing the image gives back the pixels.
returns:
  "image": "a new image (a snapshot)"
errors:
  "none": "no error result"
side_effects: "makes an image object"
threading: "a CGContext is not safe to draw into from two threads at once (not tested)"
ordering: []
timing:
  typical: "microseconds to milliseconds"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
