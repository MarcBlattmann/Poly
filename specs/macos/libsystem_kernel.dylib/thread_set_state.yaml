# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_kernel.dylib/thread_set_state.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mexc.h; ADR 0182);
# results per architecture in thread_set_state.tests/macos.json.
id: macos/api/libsystem_kernel.dylib/thread_set_state
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mexc.h, poly_mlibc.h) so that they call libSystem; each makes its own faults in its own threads or child processes and catches them with exception ports of its own, in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); results are equal on both except where the sheet names a difference"
  observed_by: spec-macos-mach-exc
  date: 2026-11-20
summary: >
  thread_set_state(thread, flavor, state, count) replaces a thread's registers. The refusals are those of thread_get_state: a count smaller than the flavor's and a flavor that is none:
  KERN_INVALID_ARGUMENT (4) (not asked on x86_64, where Rosetta 2 ends the program with a message); an invalid thread: MACH_SEND_INVALID_DEST (0x10000003); the task port
  instead of a thread: KERN_INVALID_ARGUMENT. Its use by an exception handler: a handler of EXCEPTION_DEFAULT stops the thread with the message and changes its state with
  thread_set_state before replying KERN_SUCCESS: the thread continues with the new registers (the test register x9 / rax then holds what was written, the full 64 bits; a pc set past the
  faulting instruction continues after it: arm64 + 4 for an undefined instruction or brk, x86_64 + 2 for ud2; the pc of an x86_64 int3 is already behind it). A handler of a
  state behavior returns the new state in its reply instead; a reply of KERN_SUCCESS without changing a faulting thread's pc makes it fault again at the same instruction.
  Observations of both architectures agree unless a difference is named (x86_64 was observed under Rosetta 2: a few answers there are the
  translator's, named below). Exception ports: a task starts with no port for the classic exceptions 1 to 9 (EXC_MASK_CLASSIC, 0x3fe); on arm64 the
  harness's processes also inherited a port for EXC_RESOURCE (mask 0x800, behavior 0xa0000004), which the tests never look at.
returns:
  success: "KERN_SUCCESS (0)"
errors:
  invalid_argument: "KERN_INVALID_ARGUMENT (4)"
  bad_thread: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "the thread's registers change"
threading: "the target thread should be stopped"
ordering: []
timing:
  typical: "microseconds: one Mach call (an exception round trip is some tens of microseconds)"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
