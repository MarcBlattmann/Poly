# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_kernel.dylib/mach_port_peek.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in mach_port_peek.tests/macos.json.
id: macos/api/libsystem_kernel.dylib/mach_port_peek
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  mach_port_peek(task, name, trailer type, &seqno, &size, &id, trailer, &trailer_count) looks at a queued message of a
  receive right without taking it. With seqno 0 on entry it gives the first message in the queue and its sequence number
  (the number of messages received before it); with a seqno it gives the message with that number; a seqno that is not queued, or an
  empty queue, is KERN_FAILURE (5). size is the message's size plus its 8-byte trailer (a header-only message: 32; a 64-byte
  message: 72); id is its msgh_id. Nothing is removed, mps_msgcount and mps_seqno do not change. A member of a port set can be
  peeked (the set itself is KERN_INVALID_RIGHT (17)). Refused: names not in the task KERN_INVALID_NAME (15); a send-only name or a port
  set KERN_INVALID_RIGHT; a trailer count of 0 KERN_INVALID_VALUE (18); an invalid task MACH_SEND_INVALID_DEST. Only the null
  trailer was observed (asking for sequence-number or audit trailer elements was KERN_INVALID_VALUE in the probe).
returns:
  success: "KERN_SUCCESS (0); seqno, size and id of the message"
errors:
  failure: "KERN_FAILURE (5): no such message"
  invalid_value: "KERN_INVALID_VALUE (18): trailer count 0"
  invalid_name: "KERN_INVALID_NAME (15)"
  invalid_right: "KERN_INVALID_RIGHT (17)"
  bad_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: none
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one Mach call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
