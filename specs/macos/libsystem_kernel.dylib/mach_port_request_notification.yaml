# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_kernel.dylib/mach_port_request_notification.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in mach_port_request_notification.tests/macos.json.
id: macos/api/libsystem_kernel.dylib/mach_port_request_notification
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  mach_port_request_notification(task, name, id, sync, notify, MACH_MSG_TYPE_MAKE_SEND_ONCE, &previous) asks that a message be
  sent to `notify` (a name with a receive right here) when something happens to the port at `name`, and stores the previous
  request's send-once right (a new name, type 0x40000) or MACH_PORT_NULL in *previous. A second request replaces the first (its
  notify port hears nothing); asking with notify MACH_PORT_NULL cancels and returns the old right.
  MACH_NOTIFY_NO_SENDERS (70): on a receive right; when the port has no send rights and the make-send count is at least sync
  the message comes at once; with send rights outstanding the request is kept (mps_nsrequest 1) and the message comes when the
  last send right goes, whatever sync is; one message, then the request is gone. The message is 36 bytes: the header with id
  70, an NDR record (bytes 0,0,0,0,1,0,0,0) and the make-send count as a 32-bit number.
  MACH_NOTIFY_DEAD_NAME (72): on a name with a send right (also a receive-only name: then message id 65, MACH_NOTIFY_PORT_DELETED,
  comes when it is destroyed): when the port dies a 36-byte message with id 72 carries the name (now a dead name, two user
  references when the task also had the receive right). On a name that is already dead the call is KERN_INVALID_ARGUMENT
  (4) and the right given is used up: a MACH_NOTIFY_SEND_ONCE message (71, header only) arrives on notify.
  MACH_NOTIFY_PORT_DESTROYED (69): on a receive right, sync must be 0 (else KERN_INVALID_VALUE (18)); when the receive right is
  destroyed the port survives as the receive right inside a complex 40-byte message (one port descriptor) on notify.
  Refused: a name or notify name not in the task KERN_INVALID_NAME (15); an id that is none (999) or MACH_NOTIFY_SEND_ONCE
  KERN_INVALID_VALUE (18); NO_SENDERS on a send-only name KERN_INVALID_RIGHT (17); the right type MAKE_SEND, COPY_SEND or
  MOVE_SEND is -300 (MIG type check failure; MOVE_SEND still takes the send right off the notify name); an invalid task
  MACH_SEND_INVALID_DEST; a NULL previous pointer KERN_MEMORY_ERROR (10).
returns:
  success: "KERN_SUCCESS (0); *previous is the old notify right as a send-once name, or MACH_PORT_NULL"
errors:
  invalid_argument: "KERN_INVALID_ARGUMENT (4): DEAD_NAME on a dead name"
  invalid_value: "KERN_INVALID_VALUE (18)"
  invalid_right: "KERN_INVALID_RIGHT (17)"
  invalid_name: "KERN_INVALID_NAME (15)"
  type_check: "-300: notify right type that is not send-once"
  memory_error: "KERN_MEMORY_ERROR (10)"
  bad_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "a notification request is recorded; messages are queued on the notify port later"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "the notification is queued when the event happens (no delay observed)"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
