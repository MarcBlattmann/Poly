# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_kernel.dylib/mach_port_extract_right.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in mach_port_extract_right.tests/macos.json.
id: macos/api/libsystem_kernel.dylib/mach_port_extract_right
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  mach_port_extract_right(task, name, message type, &right, &acquired_type) makes a right out of the port at `name` as if
  it were sent in a message, and stores the name it now has in *right and the right's type in *acquired. MAKE_SEND of a receive
  right gives the same name (now receive+send, one user reference, the make-send count raised), acquired
  MACH_MSG_TYPE_PORT_SEND (17); COPY_SEND the same name with one more reference (count unchanged) and PORT_SEND; MOVE_SEND
  keeps the same name and the references count; MAKE_SEND_ONCE a new name of type 0x40000, acquired PORT_SEND_ONCE (18),
  one more sorights each; MOVE_SEND_ONCE of such a name gives a right under another name and the old name goes;
  MOVE_RECEIVE of a receive right returns the same name (acquired 16). Of a send-only name (bootstrap_port) COPY_SEND works;
  MAKE_SEND, MAKE_SEND_ONCE and MOVE_RECEIVE are KERN_INVALID_RIGHT. A name that does not exist is KERN_INVALID_NAME (15),
  MACH_PORT_NULL and a port set KERN_INVALID_RIGHT (17), a message type that is none (99) and COPY_RECEIVE KERN_INVALID_VALUE
  (18), an invalid task MACH_SEND_INVALID_DEST.
returns:
  success: "KERN_SUCCESS (0); *right and *acquired set"
errors:
  invalid_name: "KERN_INVALID_NAME (15)"
  invalid_right: "KERN_INVALID_RIGHT (17)"
  invalid_value: "KERN_INVALID_VALUE (18)"
  bad_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "a send or send-once right is added, or one moved"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds: one Mach call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
