# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_kernel.dylib/semaphore_destroy.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mexc.h; ADR 0182);
# results per architecture in semaphore_destroy.tests/macos.json.
id: macos/api/libsystem_kernel.dylib/semaphore_destroy
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mexc.h, poly_mlibc.h) so that they call libSystem; each makes its own faults in its own threads or child processes and catches them with exception ports of its own, in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); results are equal on both except where the sheet names a difference"
  observed_by: spec-macos-mach-exc
  date: 2026-11-20
summary: >
  semaphore_destroy(task, sem) destroys the semaphore and takes the caller's send right away: the name is invalid afterwards (semaphore_wait and semaphore_signal on it are
  KERN_INVALID_NAME (15)); a thread blocked in semaphore_wait when the semaphore is destroyed returns KERN_TERMINATED (37); a second destroy of the name is
  MACH_SEND_INVALID_RIGHT (0x1000000a), as is a name that is nothing; MACH_PORT_NULL, the task port and the host port as the semaphore are KERN_INVALID_ARGUMENT (4); an invalid task is
  MACH_SEND_INVALID_DEST (0x10000003); a refused call leaves the semaphore alone. When the name has a second user reference (mach_port_extract_right COPY_SEND) the destroy
  takes one off and the name stays a send right (type 0x10000) with one reference, and a timed wait on it then returns KERN_TERMINATED (37): the semaphore is destroyed. Giving the
  right back with mach_port_deallocate makes the name invalid.
returns:
  success: "KERN_SUCCESS (0)"
errors:
  invalid_right: "MACH_SEND_INVALID_RIGHT (0x1000000a)"
  invalid_argument: "KERN_INVALID_ARGUMENT (4)"
  bad_task: "MACH_SEND_INVALID_DEST (0x10000003)"
side_effects: "the semaphore is destroyed, waiters are released with KERN_TERMINATED"
threading: "safe from several threads"
ordering: []
timing:
  typical: "microseconds: one Mach call (an exception round trip is some tens of microseconds)"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
