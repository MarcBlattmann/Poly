# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libxpc.dylib/xpc_dictionary_get_string.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in xpc_dictionary_get_string.tests/macos.json.
id: macos/api/libxpc.dylib/xpc_dictionary_get_string
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  xpc_dictionary_get_string(dict, key) gives a pointer to the stored string's bytes (NUL-terminated), NULL for a missing key and
  for a value that is not a string (int64, double, uint64, bool); NULL for the empty dictionary. The pointer belongs to the stored
  string: it stays the same and valid for as long as the string is stored (also across a retain and a release of the
  dictionary and after other keys were added); storing NULL with xpc_dictionary_set_value removes the key. xpc_dictionary_apply
  hands the strings out as string objects; xpc_copy_description of a dictionary is a string that starts "<dictionary:" and shows
  "count = N".
returns:
  value: "a pointer to the text, or NULL"
errors: {}
side_effects: none
threading: "not specified"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
