# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libxpc.dylib/xpc_connection_create_mach_service.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in xpc_connection_create_mach_service.tests/macos.json.
id: macos/api/libxpc.dylib/xpc_connection_create_mach_service
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  xpc_connection_create_mach_service(name, queue, flags) returns a connection object (type XPC_TYPE_CONNECTION, name "connection")
  for any name, also the empty string, as a client (flags 0) or a listener (XPC_CONNECTION_MACH_SERVICE_LISTENER); nothing is
  checked until it is resumed (xpc_connection_set_event_handler first: a connection resumed without a handler traps the
  process with SIGTRAP; not in the tests). Resumed, a client of a name no job declares has its handler called once with the error object
  XPC_ERROR_CONNECTION_INVALID (described "Connection invalid"); a listener for a name no job declares, also one the process
  checked in with bootstrap_check_in, is called with the same error and never receives a connection; a client of a name the
  process only checked in gets no event within two seconds. xpc_connection_cancel before resume makes the resumed connection report
  the error once; a second cancel changes nothing. Handler calls come on the queue given. Declared services (launchd MachServices)
  work as listeners for the job that declares them; not covered by a test.
returns:
  success: "a connection object"
errors:
  invalid: "XPC_ERROR_CONNECTION_INVALID is delivered to the handler, not returned"
side_effects: "a connection object, a queue reference"
threading: "handlers run on the queue given"
ordering: []
timing:
  typical: "events arrive within milliseconds"
  guarantees: "the tests wait up to 5 seconds"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
