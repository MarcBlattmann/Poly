# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libxpc.dylib/xpc_dictionary_set_string.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in xpc_dictionary_set_string.tests/macos.json.
id: macos/api/libxpc.dylib/xpc_dictionary_set_string
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  xpc_dictionary_set_string(dict, key, value) stores a copy of the C string (changing the source afterwards changes nothing) as
  a string object (type XPC_TYPE_STRING, name "string"; xpc_string_get_length and xpc_string_get_string_ptr agree): the empty
  string, UTF-8 bytes and a 1000-character string are kept as given. Setting again replaces the value, also one of another type
  (count unchanged); stored in several dictionaries the copies are independent. An equal string object is made by xpc_string_create
  (xpc_equal), xpc_string_create_with_format formats; the pointer of a stored string is the same on every get.
returns:
  success: "none (void)"
errors: {}
side_effects: "the dictionary holds a copy"
threading: "not specified"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
