# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libxpc.dylib/xpc_retain.yaml. Observed with C tests (libSystem calls, tests/macos/include/poly_mapi.h; ADR 0182);
# results per architecture in xpc_retain.tests/macos.json.
id: macos/api/libxpc.dylib/xpc_retain
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182) in the owner's login session, built with the `poly-mac: libsystem` directive (tests/macos/include/poly_mapi.h) so that they call libSystem, each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively and x86_64 under Rosetta 2 (installed on the oracle on 2026-11-20); both slices gave the same results"
  observed_by: spec-macos-bootstrap
  date: 2026-11-20
summary: >
  xpc_retain(object) returns the same pointer after adding a reference. A retained object survives one release by its creator
  and stays usable until the last release (1000 retains and 1000 releases in a row were fine); the same holds for strings,
  int64s and dictionaries. An object stored in a dictionary is retained by it (the creator may release it); an object fetched with
  xpc_dictionary_get_value is borrowed and must be retained to outlive the dictionary. xpc_copy of a dictionary is another
  object with the same contents (xpc_equal) that can be changed on its own.
returns:
  value: "the object given"
errors: {}
side_effects: "one more reference"
threading: "reference counts are atomic: not specified"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
