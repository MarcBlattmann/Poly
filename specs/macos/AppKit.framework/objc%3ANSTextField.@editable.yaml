# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/AppKit.framework/objc%3ANSTextField.@editable.yaml. Observed with Objective-C test programs linked against AppKit
# (tests/macos/include/poly_mak.h, ADR 0182); results per architecture in objc%3ANSTextField.@editable.tests/macos.json.
id: "macos/api/AppKit.framework/objc:NSTextField.@editable"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the AppKit, Foundation, CoreGraphics and QuartzCore of that release, SIP on, the owner's logged-in graphical session (the window server is needed), the display a 1512 x 982 point built-in one at scale 2, the system appearance set to dark (tests always set the appearance they need); tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: appkit`, tests/macos/include/poly_mak.h): the program is not in an application bundle, so its activation policy is Prohibited, it is never the active application and no window is ever key or main; its windows are invisible (alpha 0, mouse clicks pass through) and are closed or ordered out before the test ends, and a watchdog ends a test after 12 seconds; pixels are drawn into bitmaps the test makes (tagged sRGB) so that colours do not depend on the display; values that depend on this macOS release or this Mac (sizes of system controls, system colours and fonts, the display) are printed with the name prefix sys_ and are described as SYSTEM-DEPENDENT; NSTextAlignment's numbers differ between the two architectures in the SDK (tests compare with the named constants), and the pixels of system controls differ by one step between them (each architecture is recorded on its own); results and output go through raw system calls"
  observed_by: spec-macos-appkit-basics
  date: 2026-11-20
summary: >
  NSTextField flags depend on each other. State written as
  editable/selectable/enabled/accepts-first-responder for a field from initWithFrame: (all YES):
  setEditable:NO makes it not selectable and refusing first responder (NO NO YES NO); setEditable:YES
  restores all; setSelectable:NO also makes it not editable; setSelectable:YES afterwards makes it
  selectable only (NO YES YES NO); setEnabled:NO leaves editable and selectable and refuses first
  responder (YES YES NO NO). A label (NO NO YES NO): setEditable:YES makes it editable, selectable and
  able to take first responder; setEditable:NO makes it plain again; setSelectable:YES gives
  selectable only with no first responder; a disabled selectable label stays selectable. Bezeled,
  bordered and drawsBackground switch independently; tag and continuous read back; the delegate reads
  back. Editing: an editable enabled field accepts first responder, a disabled one, a non-editable one
  and any label do not. In a window (never key: this program is not active) makeFirstResponder: on the
  field answers YES and installs the window's field editor, an NSTextView: the field's currentEditor
  is not nil, is the window's first responder (the field itself is not) and is fieldEditor:forObject:;
  the editor holds the text with all of it selected; makeFirstResponder:nil (or endEditingFor:) ends
  the editing, currentEditor is nil and the window is first responder again. makeFirstResponder: of a
  label answers YES but the window keeps the responder; a button becomes the responder. With a
  delegate: focusing calls nothing; the first change (insertText:) calls
  control:textShouldBeginEditing:, controlTextDidBeginEditing:, controlTextDidChange: (log
  'shouldBegin;begin;change;'), later changes only controlTextDidChange:, stringValue follows the
  editor ('X' replaces the selected 'abc'); ending calls control:textShouldEndEditing: then
  controlTextDidEndEditing: and stringValue is the typed text; focusing and leaving without typing
  calls only controlTextDidEndEditing: (printed).
returns:
  success: "BOOL flags / the editor object"
errors: {}
side_effects: "none beyond what the summary says"
threading: "AppKit objects are used on the main thread only; the tests use them there (a watchdog thread only ends the process)"
ordering:
  - "shouldBegin, didBegin, didChange on the first change"
  - "shouldEnd, didEnd when editing ends"
timing:
  typical: "microseconds to milliseconds; drawing, ordering and notifications settle within a run-loop turn (tests spin the loop for 0.05 to 0.3 s)"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
