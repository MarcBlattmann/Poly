# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/AppKit.framework/objc%3ANSView.@needsDisplay.yaml. Observed with Objective-C test programs linked against AppKit
# (tests/macos/include/poly_mak.h, ADR 0182); results per architecture in objc%3ANSView.@needsDisplay.tests/macos.json.
id: "macos/api/AppKit.framework/objc:NSView.@needsDisplay"
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), macOS 27.0 with the AppKit, Foundation, CoreGraphics and QuartzCore of that release, SIP on, the owner's logged-in graphical session (the window server is needed), the display a 1512 x 982 point built-in one at scale 2, the system appearance set to dark (tests always set the appearance they need); tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment; arm64 observed natively, x86_64 under Rosetta 2 (installed on the oracle); the 3 runs per architecture gave the same bytes. Tests are Objective-C programs in .c files built with ARC (the line `poly-mac: appkit`, tests/macos/include/poly_mak.h): the program is not in an application bundle, so its activation policy is Prohibited, it is never the active application and no window is ever key or main; its windows are invisible (alpha 0, mouse clicks pass through) and are closed or ordered out before the test ends, and a watchdog ends a test after 12 seconds; pixels are drawn into bitmaps the test makes (tagged sRGB) so that colours do not depend on the display; values that depend on this macOS release or this Mac (sizes of system controls, system colours and fonts, the display) are printed with the name prefix sys_ and are described as SYSTEM-DEPENDENT; NSTextAlignment's numbers differ between the two architectures in the SDK (tests compare with the named constants), and the pixels of system controls differ by one step between them (each architecture is recorded on its own); results and output go through raw system calls"
  observed_by: spec-macos-appkit-basics
  date: 2026-11-20
summary: >
  NSView needsDisplay / setNeedsDisplay: marks a view for drawing; nothing is drawn at once: right
  after the call drawRect: has not run, the next run-loop turn draws once with the whole bounds as the
  dirty rectangle (also after several calls before the turn); setNeedsDisplay:NO after YES does not
  cancel the pending draw (observed: it still draws); the getter reads NO right after a draw.
  setNeedsDisplayInRect: marks a rectangle: the dirty rectangle is that rectangle clipped to the
  bounds ((10,10,20,20) is passed as is, (-10,-10,30,30) becomes (0,0,20,20), a rectangle outside the
  bounds gives no draw), two rectangles marked before the turn are drawn as ONE call with their union
  ((10,10,20,20) and (50,30,10,10) give (10,10,50,30)); displayIfNeeded draws a pending rectangle at
  once and a second call draws nothing; getRectsBeingDrawn inside drawRect: returns at least one
  rectangle. In a visible layer-backed window: -display of the root draws the root only with its
  bounds (not the subviews); -display of a subview draws it with its own bounds (0,0,30,30); marking a
  subview draws that subview alone on the next turn with the root's bounds in its coordinates
  ((-20,-20,100,60) for a subview at (20,20)); setNeedsDisplayInRect: on a subview draws just that
  rectangle; on the root over a subview it draws only the root with that rectangle; a hidden subview
  marked is not drawn and is drawn again after it is shown; a window ordered out still draws a marked
  view (printed).
returns:
  success: "void"
errors: {}
side_effects: "none beyond what the summary says"
threading: "AppKit objects are used on the main thread only; the tests use them there (a watchdog thread only ends the process)"
ordering:
  - "marking only schedules; the draw happens in the next run-loop turn unless display or displayIfNeeded is called"
timing:
  typical: "microseconds to milliseconds; drawing, ordering and notifications settle within a run-loop turn (tests spin the loop for 0.05 to 0.3 s)"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
