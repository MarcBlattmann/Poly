# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_pthread.dylib/pthread_threadid_np.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in pthread_threadid_np.tests/macos.json.
id: macos/api/libsystem_pthread.dylib/pthread_threadid_np
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  pthread_threadid_np(thread, &id) stores the 64-bit system-wide id of a thread and returns 0. thread NULL
  means the calling thread; pthread_self() gives the same id; it equals the result of the thread_selfid system
  call (BSD 372). The id is nonzero, differs from the process id (the main thread's id is not the pid), is the same
  for the whole life of a thread, and 32 threads alive together had 32 different ids, none equal to main's. The id
  of another running thread can be read, and equals what that thread reads for itself. A forked child's main thread
  has an id of its own, different from any thread id of the parent. Errors: a NULL output pointer is EINVAL (22), with
  the NULL thread or with pthread_self(); a thread that has been joined is ESRCH (3).
returns:
  "success": "0, *id set"
errors:
  "EINVAL": "22: NULL output"
  "ESRCH": "3: the thread no longer exists"
side_effects: "none"
threading: "reading another thread's id is allowed"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
