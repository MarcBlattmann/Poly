# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_pthread.dylib/pthread_once.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in pthread_once.tests/macos.json.
id: macos/api/libsystem_pthread.dylib/pthread_once
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  pthread_once(&control, routine) runs routine exactly once, the first time it is called with that control
  (initialised with PTHREAD_ONCE_INIT, also in heap memory), and returns 0 every time. When 8 threads race
  into it, one runs the routine (which was slow: 30 ms) and the others return only after it has finished;
  later calls return at once without running it. Two different controls each run their routine. The routine
  may call pthread_once with another control (outer starts, inner runs, outer finishes). sizeof(pthread_once_t)
  is 16. Same on both architectures.
returns:
  "success": "0"
errors:
  "none": "not observed"
side_effects: "none"
threading: "callers block until the first call's routine has returned"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
