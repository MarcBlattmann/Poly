# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_pthread.dylib/pthread_get_stacksize_np.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in pthread_get_stacksize_np.tests/macos.json.
id: macos/api/libsystem_pthread.dylib/pthread_get_stacksize_np
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  pthread_get_stacksize_np(thread) returns the size of the thread's stack in bytes. Main thread: the soft
  RLIMIT_STACK, 8372224 bytes (8 MiB less 16 KiB) on both architectures. Created threads: the size set in the
  attribute (default 524288) plus an amount that differs per architecture: x86_64 reports exactly the requested
  size (524288 for the default, 65536 for 64 KiB, 1048576 for 1 MiB, 4194304 for 4 MiB); arm64 reports 12288 bytes
  more (536576, 77824, 1060864, 4206592, 143360 for 128 KiB). Always a multiple of 4096, at least the request and
  less than request + 64 KiB. Asking about another running thread gives what that thread sees for itself.
returns:
  "value": "size of the stack in bytes"
errors:
  "none": "no error result"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
arch_differences: "created thread: x86_64 reports the requested size; arm64 reports 12288 bytes more"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
