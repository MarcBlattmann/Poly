# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_c.dylib/arc4random_buf.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in arc4random_buf.tests/macos.json.
id: macos/api/libsystem_c.dylib/arc4random_buf
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  arc4random_buf(buf, n) fills exactly n bytes with random data, for any n (a 1 MiB fill was tested; there is
  no 256 byte limit as in getentropy). It never fails and returns void; n 0 writes nothing (NULL is accepted
  with 0); bytes outside [buf, buf+n) are not touched. Quality seen: two calls differ, nearly all of 32 bytes
  are nonzero, every byte value occurs in 1 MiB with counts within 25% of the mean. After fork the child's
  output differs from the parent's and from what was drawn before the fork (the generator is reseeded in the
  child).
returns:
  "result": "void"
errors:
  "none": "never fails"
side_effects: "writes n bytes at buf"
threading: "not tested with several threads"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
