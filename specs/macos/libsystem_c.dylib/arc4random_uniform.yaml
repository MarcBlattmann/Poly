# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libsystem_c.dylib/arc4random_uniform.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in arc4random_uniform.tests/macos.json.
id: macos/api/libsystem_c.dylib/arc4random_uniform
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  arc4random_uniform(upper) returns a uniformly distributed value in [0, upper), without modulo bias:
  upper 0 and 1 both give 0 (no error); upper 2 gives 0 or 1; 0xFFFFFFFF and 0x80000001 stay below the bound
  and large values do occur; every bound 0..299 and the bounds around every power of two up to 2^31 gave
  in-range results. 30000 draws below 3 landed within 9000..11000 each, half of the draws below 100 were below
  50 (within 5%). The plain arc4random() spans the whole 32 bit range and two calls differ.
returns:
  "value": "uint32 in [0, upper), 0 for upper 0 or 1"
errors:
  "none": "never fails"
side_effects: "none"
threading: "not tested with several threads"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
