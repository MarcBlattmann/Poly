# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/macos/libdyld.dylib/_dyld_image_count.yaml. Observed with C programs that call libSystem
# (tests/macos/include/poly_mlibc.h, marked `poly-mac: libsystem`, ADR 0182); results per
# architecture in _dyld_image_count.tests/macos.json.
id: macos/api/libdyld.dylib/_dyld_image_count
oracle:
  os: "macOS 27.0 (build 26A428), Darwin 27.0.0, xnu-13432.1.9~1/RELEASE_ARM64_T6000"
  machine: "MacBook Pro, Apple M1 Pro (arm64), internal APFS volume, SIP on; tests run as the owner's unprivileged user (pipeline mac run, ADR 0182), each in a fresh empty scratch directory with an empty environment and stdin on /dev/null; arm64 observed natively, x86_64 under Rosetta 2 (both architectures observed; differences are listed in the summary). Output of the tests is written with raw system calls, never through the function under test"
  observed_by: spec-macos-5
  date: 2026-11-20
summary: >
  _dyld_image_count() returns the number of images (the program and every dylib) in the process, the same on
  every call. For a program linked only to libSystem it is 81 on arm64 and 45 on x86_64 (the program, libSystem, its sub-libraries one by one and more; only "more than 2" and "less than 1000" are relied on). libSystem.B.dylib, libdyld, libsystem_c,
  libsystem_malloc, libsystem_pthread and libsystem_kernel are each one image. dlopen of an image that is already
  loaded (libSystem, libsystem_c) adds nothing; dlopen of CoreFoundation adds images, at the end of the list, while
  the first 8 images keep their index and name.
  Same behaviour on both architectures apart from the count.
returns:
  "count": "number of images"
errors:
  "none": "no error result"
side_effects: "none"
threading: "not tested with several threads"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
arch_differences: "count at start: 81 on arm64, 45 on x86_64"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
