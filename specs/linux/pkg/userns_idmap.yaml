# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/api/pkg/userns_idmap              # package-format component: no coverage-map entry
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "privileged Docker container (poly-dev, Ubuntu 24.04 userland) on WSL2, x86-64 (AMD Ryzen AI MAX+ PRO 395, 32 CPUs); tests run as root with all capabilities and become uid/gid 65534 or 1000 in children; umask 022; unprivileged user namespaces allowed"
  observed_by: spec-linux-pkg
  date: 2026-11-09
summary: >
  User namespaces and their id mappings, as rootless containers, Flatpak,
  bubblewrap and Chrome use them. unshare(CLONE_NEWUSER) or
  clone(CLONE_NEWUSER) needs no privilege; the process holds every
  capability in the new namespace (capget: effective and permitted all
  32 low bits set, bits above 31 too, inheritable empty; the version request
  0x20080522 is the preferred one and an unknown one is EINVAL with the
  preferred version written back) and none in the namespace it came
  from (a lower nice value is EACCES, sethostname on the inherited UTS
  namespace EPERM). After capset to the empty set it cannot unshare a UTS
  namespace (EPERM) and cannot get capabilities back (capset EPERM).
  Maps: /proc/self/uid_map, gid_map and setgroups. The initial namespace
  maps everything to itself: uid_map reads exactly "         0          0
  4294967295\n" (three numbers, each in a field ten characters wide,
  separated by one blank) and setgroups "allow\n". In a new namespace the
  maps read empty until written, setgroups reads "allow\n", and ids read as
  65534 (the overflow id) until mapped. A write of "0 0 1" (with or without
  the final newline) is accepted and reads back in the ten-wide format; a
  second write is EPERM. A process inside the namespace cannot write
  gid_map before it wrote "deny" to setgroups (EPERM). setgroups takes
  "allow" or "deny" (newline optional, anything else EINVAL); "deny" reads
  back "deny\n"; "allow" after "deny" is EPERM; "deny" is EPERM once gid_map
  was written (by the parent, which needs no "deny"). Several lines can be
  written in one write and read back as several lines.
  Who may write what. An unprivileged user (uid/gid 65534, no capabilities)
  from inside may map exactly its own effective id: a single line with
  outside id equal to its effective id and count 1 (anything else EPERM);
  gid_map needs "deny" written first. A process whose ids changed must
  prctl(PR_SET_DUMPABLE, 1) or its /proc/self files belong to root and cannot
  be written. With the map "0 65534 1" the process is uid 0 inside:
  setresuid to an unmapped id is EINVAL, chown to one is EINVAL, setgroups(0)
  is EPERM after "deny", a file it creates is owned by 0 inside, it may signal
  a process of its own kernel uid outside (kill(.., 0) is 0) but not init
  (EPERM). The root parent (CAP_SETUID and CAP_SETGID in the namespace the
  child came from) writes the child's maps from outside while the child waits:
  before the maps exist the child's ids read 65534 and its uid_map is empty;
  the parent reads the child's maps translated into its own ids. With
  "0 1000 1" the child is uid/gid 0 inside; a file made there is owned by
  1000 outside, a file owned by 1000 outside is owned by 0 inside (the child
  may open it), a root-owned file is owned by 65534 inside and a mode 0600
  one cannot be opened (EACCES) although the child is uid 0; chown to an
  unmapped id is EINVAL; kill(parent, 0) is EPERM; the child may call
  setgroups; /proc/<child>/status shows the child's ids as the parent sees
  them (1000).
  What the parent's write accepts: each line is "inside outside count";
  the numbers are decimal, separated by blanks or tabs; a line with count 0,
  with fewer or more than three numbers, with text, with a negative number
  or with an id of 4294967295 is EINVAL; so are ranges that overlap on
  the inside or on the outside, ranges that reach the id 4294967295 (see
  the next paragraph), and more than 340
  lines; exactly 340 lines and the whole range "0 0 4294967295" are
  accepted. The parent may map to any ids, also ones that are not its own.
  The size rule, exactly: the id 4294967295 (the "no id" value) can never
  be part of a range. For the inside start and for the outside start
  alike, start + count may be at most 4294967295, so the last id of a
  range is at most 4294967294. Accepted: "4294967294 0 1",
  "0 4294967294 1", "5 5 4294967290", "0 0 4294967295", a second line
  "4294967000 100 295". EINVAL: "4294967294 0 2", "0 4294967294 2",
  "5 0 4294967291", "5 6 4294967290", "6 5 4294967290", "1 1 4294967295",
  a second line "4294967000 100 296", and a start of 4294967295 with any
  count. (An earlier version of this sheet said "above 4294967296"; that
  was wrong by one.) A number above 4294967295 is not refused for its
  size: only its low 32 bits are used, so "4294967296 0 1" is accepted
  and reads back as "0 0 1", "0 4294967301 1" reads back with outside 5,
  and a count of 4294967296 is a count of 0 (EINVAL). The numbers are
  decimal only: a leading 0 does not make them octal ("010 0 1" maps id
  ten), "0x10" and a leading "+" are EINVAL. A write that is refused
  leaves the map unwritten: a correct write afterwards is accepted (the
  "second write is EPERM" rule counts accepted writes only). gid_map
  follows every one of these rules.
  chown and chmod by a namespace's root. Its capabilities over files
  (CAP_CHOWN, CAP_FOWNER) reach exactly the files whose owner uid and
  group are both mapped in its namespace. Such a file can be given to
  any uid and gid that the namespace maps, by chown(path, uid, gid) with
  ids of the namespace; -1 leaves that id; the file need not belong to
  the caller (after giving it to inside uid 5 the root can chmod it,
  chown it on, and take it back to 0). The new owner is stored as the
  kernel id the map gives: with "0 3000 1" and "1 300000 400" inside 5
  is kernel 300004 and inside 400 (the last mapped) kernel 300399; that
  is what the initial namespace's stat shows. A target id that is not
  mapped (401, 3000) is EINVAL. A file whose owner is not mapped (it
  shows as 65534:65534, e.g. a file of the initial namespace's root)
  cannot be changed: chown to mapped ids is EPERM, chmod is EPERM, chown
  to the shown ids 65534 is EINVAL (65534 is not mapped), and only
  chown(path, -1, -1), which changes nothing, returns 0; the file stays
  as it was. The same holds in a nested namespace against its own map:
  mapped "0 0 1" and "1 100 50" onto the namespace above, its root gives
  a file to its ids 3 and 4 (the namespace above sees 102 and 103, the
  initial namespace 300101 and 300102), its last mapped id is 50 (51 is
  EINVAL), and a file owned by ids of the outer namespace that the inner
  one does not map shows as 65534 there and is EPERM for chown and
  chmod.
  Nesting: a process with uid 0 in namespace C (mapped "0 1000 1" and
  "1 100000 999" by its root parent) makes namespace B and maps B's ids to ids of
  C ("0 0 1" and "1 500 100"; an id that C does not map, like 2000, is
  EPERM). Ids read translated at each level: C's file stat shows the C
  id (506 for B's 7), the initial namespace the kernel id (100505), and C
  reading B's uid_map sees C's ids.
returns:
  uid_map_initial: "\"         0          0 4294967295\\n\""
  setgroups_read: "\"allow\\n\" or \"deny\\n\""
  unmapped_id: "65534 (overflow uid/gid) for every id with no mapping"
  capabilities_in_new_ns: "all capabilities in effective and permitted"
errors:
  second_write: "EPERM (1): a second write to uid_map or gid_map"
  no_deny: "EPERM (1): gid_map written by the process itself before setgroups was set to deny"
  not_own_id: "EPERM (1): a line whose outside id is not the unprivileged writer's own effective id or whose count is not 1"
  bad_line: "EINVAL (22): count 0, wrong number of fields, text, negative number, a leading + or 0x, id 4294967295, overlapping ranges, a range whose start + count is above 4294967295, more than 340 lines"
  chown_unmapped_owner: "EPERM (1): chown (to mapped ids) or chmod, by the namespace's root, of a file whose owner uid or group is not mapped in the namespace"
  unmapped_chown: "EINVAL (22): chown or setresuid to an id with no mapping"
  access_unmapped_owner: "EACCES (13): opening a root-owned 0600 file as ns-root with root unmapped"
  setgroups_after_deny: "EPERM (1): setgroups call after \"deny\"; writing \"allow\" after \"deny\""
  capget_version: "EINVAL (22): unknown version; the preferred version 0x20080522 is written back"
side_effects: >
  A user namespace is destroyed when its last process, namespace file and
  child namespace are gone.
threading: "the maps are per namespace, not per thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 5  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
# Notes: all tests are needs=root: they start as root (the maps for another
# uid need CAP_SETUID in the parent namespace; user namespaces may be
# disabled on a host) and use several processes (syscalls=off).
