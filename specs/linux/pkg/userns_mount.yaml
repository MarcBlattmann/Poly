# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/api/pkg/userns_mount              # package-format component: no coverage-map entry
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "privileged Docker container (poly-dev, Ubuntu 24.04 userland) on WSL2, x86-64 (AMD Ryzen AI MAX+ PRO 395, 32 CPUs); tests start as root and become uid/gid 65534; umask 022; unprivileged user namespaces allowed; every test mounts below /tmp in a mount namespace of its own"
  observed_by: spec-linux-pkg
  date: 2026-11-09
summary: >
  What the root of a user namespace may mount, and which mounts it inherits
  (the rules rootless sandboxes live by). A process with uid 65534 and no
  capabilities makes unshare(CLONE_NEWUSER | CLONE_NEWNS), maps itself to root
  ("0 65534 1", setgroups denied) and makes its mounts private. Before the
  unshare the same mount of a tmpfs is EPERM. After it: a tmpfs, a ramfs and a
  devpts instance can be mounted (0) on a directory of the old tree; the top
  directory of the tmpfs belongs to the mounter, so stat shows uid 0, gid 0
  and mode 040755 for "mode=0755", and a file made in it is owned by 0;
  file systems that need the initial user namespace are refused with EPERM
  before the source is looked at (ext4, squashfs, devtmpfs, cgroup2, with the
  source /dev/null); a character device node cannot be made (mknod EPERM, also
  on the tmpfs it mounted) while a fifo and a regular file can; sethostname in
  the inherited UTS namespace is EPERM; chroot into the tmpfs works.
  Inherited mounts are locked. For mounts that existed when the user
  namespace and mount namespace were made (one mounted read-only, nosuid and
  nodev; one with no flags): umount2, also with MNT_DETACH, is EINVAL.
  Remounting the first as a bind mount (MS_BIND | MS_REMOUNT) with the same
  flags works (0), also with noexec added (and that bit can be taken away
  again, 0), but clearing read-only, nosuid or nodev is EPERM. The second can
  be remounted read-only and then read-write (neither flag was set at the
  start); a remount that is not a bind remount (it would change the
  superblock) is EPERM. A mount that the namespace's root makes itself is not
  locked: mounting a tmpfs (0), remounting it any way (0) and unmounting it (0)
  all work.
  The locks, rule by rule (they are set once, when the mount namespace is
  copied into the new user namespace, on every mount of the copy):
  (1) In place: no inherited mount can be removed or moved. umount2 with
  flag 0, MNT_FORCE or MNT_DETACH is EINVAL, for a mount directly on the
  old tree and for a mount below another inherited mount alike, and also for
  one that has mounts below it (the lock is judged before whether the mount
  is busy: flag 0 on a mount with an inherited mount below it is EINVAL, not
  EBUSY); mount(MS_MOVE) of one is EINVAL.
  (2) Flags: each of read-only, nosuid, nodev and noexec that the mount
  had is locked on: a bind remount (MS_BIND | MS_REMOUNT) that leaves one
  out is EPERM. A flag the mount did not have may be added and removed
  again (it is not locked by being added later).
  (3) Access-time mode: locked on every inherited mount, whatever it was.
  The mode is the whole combination of noatime, nodiratime and
  relatime/strictatime that the mount has, so nodiratime is part of it: a
  bind remount that names another combination is EPERM (MS_RELATIME on a
  mount that was noatime; MS_NOATIME or MS_STRICTATIME on a mount with
  the default relatime; MS_NODIRATIME added to a mount that did not have
  it, alone or with MS_RELATIME; MS_NOATIME on a mount that is nodiratime
  only; MS_RELATIME alone on a nodiratime mount, which would clear it, or
  MS_NODIRATIME alone on a noatime|nodiratime mount, which would clear
  noatime). Naming exactly the combination the mount has (MS_RELATIME |
  MS_NODIRATIME on a nodiratime mount), or none of the atime flags (the
  whole combination is then kept), works.
  (4) Copies: a bind made inside the namespace is a mount of its root, so
  the top of the copy can be unmounted; but the flag locks travel with
  the copy (a plain bind of a noexec mount: remounting the copy without
  noexec is EPERM, with it 0, umount2 of the copy 0); the access-time lock
  travels as well, nodiratime included (a bind copy of a noatime mount
  refuses MS_RELATIME and MS_STRICTATIME, a copy of a nodiratime mount
  refuses MS_NOATIME and MS_RELATIME alone, a recursive copy of a relatime
  mount refuses MS_NOATIME and MS_NODIRATIME); and in a recursive
  bind (MS_BIND | MS_REC) the copies of the mounts below stay locked onto
  the copy: umount2 of <copy>/sub is EINVAL and its nodev cannot be
  cleared (EPERM); umount2 of the copy's top with flag 0 is EBUSY (a
  mount is below it), with MNT_DETACH 0 and the whole copy is gone.
  (5) A plain MS_BIND (without MS_REC) of an inherited mount that has
  another inherited mount below it is EINVAL (the copy would show what
  that mount covers); with MS_REC it works; a plain bind of a mount with
  nothing mounted below it, also of the lower mount itself, works.
  (6) Mounting on top of an inherited mount is allowed; that mount is the
  root's own (umount2 0) and the inherited mount below it is still
  locked afterwards (umount2 EINVAL).
returns:
  tmpfs_in_userns: "0; top directory owned by ns-root (uid 0, gid 0 inside)"
  locked_remount_same_flags: "0"
  own_mount_lifecycle: "mount 0, bind remounts 0, umount2 0"
errors:
  needs_init_userns: "EPERM (1): mounting ext4, squashfs, devtmpfs or cgroup2 from a user namespace; tmpfs before the unshare"
  mknod_device: "EPERM (1): mknod of a character or block device node"
  hostname: "EPERM (1): sethostname in a UTS namespace owned by an outer user namespace"
  locked_umount: "EINVAL (22): umount2 (with or without MNT_DETACH) of an inherited mount, also one below another inherited mount and the copy of one inside a recursive bind; MS_MOVE of an inherited mount"
  locked_flags: "EPERM (1): clearing a flag (ro, nosuid, nodev, noexec) that the inherited mount had, on it or on a bind copy of it; naming another access-time mode than the inherited mount has; a non-bind remount of an inherited mount"
  locked_bind: "EINVAL (22): MS_BIND without MS_REC of an inherited mount that has an inherited mount below it"
  copy_busy: "EBUSY (16): umount2 with flag 0 of the top of a recursive bind copy while the copies below it are mounted"
side_effects: >
  Mounts in the new mount namespace are private to it.
threading: "mount namespace is shared by threads of the process"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: MS_* values are from linux/mount.h (MS_RDONLY 1, MS_NOSUID 2,
# MS_NODEV 4, MS_NOEXEC 8, MS_REMOUNT 32, MS_NOATIME 1024, MS_BIND 4096,
# MS_MOVE 8192, MS_REC 16384, MS_PRIVATE 1<<18, MS_RELATIME 1<<21,
# MS_STRICTATIME 1<<24). The tests are needs=root (they start as root and
# become uid 65534; user namespaces may be disabled on a host) and use
# several processes (syscalls=off). procfs is deliberately not tested here:
# whether a container's /proc counts as fully visible depends on the host.
