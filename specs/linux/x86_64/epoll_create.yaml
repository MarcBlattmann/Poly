id: linux/syscall/x86_64/epoll_create
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  epoll_create(size) is the old form of epoll_create1(0): size (an int) must
  be positive and is otherwise ignored; the descriptor has no FD_CLOEXEC.
  The instance is inherited across fork and shared with the child: the child
  sees the same registrations and events, and a registration the child adds
  is seen by the parent.
returns:
  success: "a new descriptor"
errors:
  bad_size: "EINVAL (22) for size 0 or negative (the upper 32 bits of the register are ignored)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
