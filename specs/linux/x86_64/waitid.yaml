# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/waitid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  waitid(idtype, id, infop, options, rusage) waits like wait4 but reports a
  siginfo: si_signo SIGCHLD, si_errno 0, si_code CLD_EXITED (1) with
  si_status = exit code, or CLD_KILLED (2) with si_status = signal; si_pid,
  si_uid. idtype P_ALL (0), P_PID (1), P_PGID (2). options must include
  WEXITED (4) (or WSTOPPED/WCONTINUED); WNOWAIT (0x01000000) leaves the
  child waitable; WNOHANG returns 0 with the siginfo zeroed when nothing is
  ready. A NULL infop is allowed. rusage (5th argument) is filled when
  given.
returns:
  success: "0"
errors:
  no_event_option: "EINVAL (options 0 or only WNOHANG)"
  bad_idtype: "EINVAL (e.g. 7)"
  unknown_option: "EINVAL (e.g. 0x100)"
  no_matching_child: "ECHILD"
  bad_infop: "EFAULT (when a child is ready)"
side_effects: "Reaps the child unless WNOWAIT."
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
