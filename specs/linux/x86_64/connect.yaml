id: linux/syscall/x86_64/connect
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  connect(fd, addr, len). Stream sockets: to a listening AF_UNIX name or
  loopback TCP port it succeeds at once (the connection waits in the backlog
  until accepted, data can be written before); getpeername then names the
  listener; a TCP client is autobound to a loopback port. A nonblocking TCP
  connect to loopback returns EINPROGRESS and the socket becomes writable
  when connected (SO_ERROR 0, or ECONNREFUSED for a closed port, read once).
  Datagram sockets: connect sets the default destination (write/send without
  an address go there), for UDP only datagrams from that peer are received,
  connecting again changes it, AF_UNSPEC dissolves it.
returns:
  success: "0"
errors:
  connected: "EISCONN (106) for a second connect of a stream socket"
  refused: "ECONNREFUSED (111): nobody listening (AF_UNIX name bound but not listening, unbound name, closed TCP port)"
  missing_path: "ENOENT (2) for an AF_UNIX path that does not exist"
  unix_wrong_family: "EINVAL (22)"
  inet_wrong_family: "EAFNOSUPPORT (97)"
  length: "EINVAL (22) for a short address"
  in_progress: "EINPROGRESS (115) for a nonblocking TCP connect"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
