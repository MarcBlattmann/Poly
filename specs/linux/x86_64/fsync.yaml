# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fsync
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  fsync(fd) and fdatasync(fd) (75) flush a file's data to storage. They
  succeed on regular files and directories, whatever the access mode (read-
  only included), also after truncation and after the file is unlinked; the
  file, its size and the offset do not change.
returns:
  success: "0"
errors:
  bad_fd_or_o_path: "EBADF"
  not_syncable: "EINVAL for pipes and character devices such as /dev/null"
side_effects: "none visible"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "fast on a RAM-backed file system; may block for storage I/O otherwise"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
