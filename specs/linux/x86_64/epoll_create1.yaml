id: linux/syscall/x86_64/epoll_create1
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  epoll_create1(flags) makes an epoll instance and returns the lowest free
  descriptor; flags 0 or EPOLL_CLOEXEC (= O_CLOEXEC, sets FD_CLOEXEC). The
  descriptor is O_RDWR; read and write on it are EINVAL; lseek returns 0. It
  is readable (POLLIN for poll, and for an epoll watching it) exactly when
  one of its watched descriptors is ready. Duplicates (dup, fork) share one
  instance and interest list; FD_CLOEXEC is per descriptor; the instance
  lives until its last descriptor is closed. epoll_wait on a descriptor that
  is not an epoll instance is EINVAL.
returns:
  success: "a new descriptor"
errors:
  bad_flags: "EINVAL (22) for any flag but EPOLL_CLOEXEC (O_NONBLOCK, 1, -1...)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
