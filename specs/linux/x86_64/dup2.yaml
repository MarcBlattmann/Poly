# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/dup2
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  dup2(oldfd, newfd) makes newfd refer to oldfd's open file, closing what
  newfd referred to first. If newfd == oldfd and it is open, nothing happens
  and newfd is returned (flags kept). The new descriptor has no FD_CLOEXEC.
  Redirecting fd 1 or 2 to a file makes later writes to 1 or 2 go to that
  file until restored.
returns:
  success: "newfd"
  same_fd_open: "newfd, unchanged"
errors:
  bad_oldfd: "EBADF, and newfd is left as it was (open or not)"
  same_fd_closed: "EBADF"
  newfd_out_of_range: "EBADF for negative newfd or newfd >= RLIMIT_NOFILE soft limit"
side_effects: "The file previously open on newfd is closed (released if it was its last descriptor)."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
