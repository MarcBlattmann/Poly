# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/setregid             # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 7.0.0-30-generic (Ubuntu 24.04, x86-64)"
  machine: >
    home server, x86-64, no seccomp. Observed as a normal user (uid 1001,
    one group) in the initial user namespace, and as root with full
    capabilities in a user namespace (rootlesskit) mapping gids 0-65536.
    /proc/sys/fs/suid_dumpable is 2 there.
  observed_by: spec-claude-1
  date: 2026-10-22
summary: >
  setregid(rgid, egid), syscall 114, sets the real and/or effective group id
  of the calling thread. A value of -1 leaves that field alone. Both
  arguments are 32-bit gids: the upper 32 bits of each register are ignored
  (0x1_0000_0005 means 5, 0x1_ffff_ffff means -1). With CAP_SETGID (in
  practice: effective uid 0, whatever the gids are) any values are allowed.
  Without it, a new real gid must equal the current real or effective gid
  (NOT the saved gid), and a new effective gid must equal the current real,
  effective or saved gid; otherwise the whole call fails with EPERM and
  nothing changes, even if the other argument alone would have been
  allowed. On success the saved gid becomes the new effective gid if the
  real gid argument is not -1 (even if it equals the current real gid), or
  if the effective gid argument is not -1 and differs from the real gid
  the process had before the call; otherwise the saved gid is unchanged.
  The filesystem gid (setfsgid) is set to the resulting effective gid on
  every successful call, including setregid(-1, -1). Uids and
  supplementary groups are not touched.
returns:
  success: "0"
  both_minus_one: "0, gids unchanged (filesystem gid reset to the effective gid)"
  values_already_held: "0 for any caller (e.g. setregid(getgid(), getegid()))"
  examples_with_cap: >
    from (r,e,s)=(any): setregid(10,20) -> (10,20,20); from (0,0,0)
    setregid(4242,-1) -> (4242,0,0); then setregid(-1,4242) -> (4242,4242,0)
    because the new egid equals the old real gid.
  examples_without_cap: >
    from (1,2,3): setregid(3,-1) EPERM; setregid(2,-1) -> (2,2,2);
    setregid(-1,3) -> (1,3,3); setregid(-1,1) -> (1,1,3); setregid(2,1) ->
    (2,1,1); setregid(1,2) -> (1,2,2); setregid(-1,2) -> (1,2,2);
    setregid(-1,-1) -> (1,2,3).
errors:
  permission: >
    EPERM (1) without CAP_SETGID when rgid is not the current real or
    effective gid, or egid is not the current real, effective or saved gid.
    No field (real, effective, saved, filesystem gid) changes.
  unmapped_gid: >
    EINVAL (22) when a gid other than -1 has no mapping in the caller's user
    namespace (observed in a user namespace mapping only 0-65536: 100000 and
    0xfffffffe give EINVAL). This is checked before permission: an
    unprivileged caller gets EINVAL, not EPERM, for an unmapped gid. In the
    initial user namespace every 32-bit value except 0xffffffff is mapped,
    so this error does not occur there.
  no_other_errors: "no EFAULT/EAGAIN cases; the call takes no pointers"
side_effects: >
  The filesystem gid becomes the effective gid on every successful call.
  When the call changes the effective gid or the filesystem gid, the
  process's dumpable attribute (prctl PR_GET_DUMPABLE) is set to the
  system's suid_dumpable value (0 by default, 2 on the oracle; never 1 in
  the tests); a call that changes only the real and/or saved gid, or
  nothing, leaves it as it was. A failed call has no side effects.
threading: >
  The raw system call changes the credentials of the calling thread only;
  other threads of the same process keep their gids (C libraries make it
  process-wide by running the call on every thread). A child made by fork
  or clone inherits the caller's gids at that moment; later changes in the
  child do not affect the parent and vice versa.
ordering: []                                  # observable ordering of events/callbacks, if any
timing:                                       # envelopes, never exact values
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 9  # count in <symbol>.tests/
  held_out: 4  # count kept by the diff runner
