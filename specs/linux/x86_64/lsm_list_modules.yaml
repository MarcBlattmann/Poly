# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/lsm_list_modules     # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "Docker privileged container on WSL2, x86-64; tests run as root and as uid/gid 65534"
  observed_by: spec-linux-f
  date: 2026-11-02
summary: >
  lsm_list_modules(ids, size, flags) (syscall 461) reports the active Linux
  security modules: it writes their ids (u64 each, LSM_ID_* from
  linux/lsm.h: capability 100, selinux 101, smack 102, tomoyo 103,
  apparmor 104, yama 105, loadpin 106, safesetid 107, lockdown 108, bpf
  109, landlock 110, ima 111, evm 112, ipe 113) to ids, sets *size (u32)
  to the bytes written (count * 8) and returns the count. capability is
  always active and always first; each id appears once; the list is the
  same on every call. flags must be 0 (checked before anything else).
  When *size is smaller than count * 8 the call fails with E2BIG, writes
  nothing to ids and sets *size to count * 8 (so ids may be NULL to ask
  for the size). A larger *size, also one that is not a multiple of 8,
  works. The oracle lists 7 modules: 100 110 105 107 101 109 111
  (capability, landlock, yama, safesetid, selinux, bpf, ima).
  Poly should list what it enforces: capability first, then landlock
  (Poly implements Landlock); it has no SELinux.
returns:
  success: "number of modules; *size = number * 8"
errors:
  flags: "EINVAL (22): flags != 0 (before size is read; *size untouched)"
  size_fault: "EFAULT (14): size NULL or unreadable/unwritable"
  too_small: "E2BIG (7): *size < number * 8; *size set to number * 8, ids untouched"
  ids_fault: "EFAULT (14): ids unwritable (also NULL) with a large enough size; *size has already been set to number * 8"
side_effects: none
threading: "none specific"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: the tests check only rules that hold for any set of active
# modules (count, size, capability first, ids known and unique), so their
# output is the same on the oracle and on Poly although the lists differ.
