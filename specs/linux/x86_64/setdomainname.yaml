# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/setdomainname        # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "privileged Docker container (poly-dev, Ubuntu 24.04 userland) on WSL2, x86-64 (AMD Ryzen AI MAX+ PRO 395, 32 CPUs); tests run as root with all capabilities and as uid/gid 65534 without capabilities; umask 022; the container has its own UTS namespace (domain name \"localdomain\"); unprivileged user namespaces allowed (max_user_namespaces 192190)"
  observed_by: spec-linux-d
  date: 2026-11-01
summary: >
  setdomainname(name, len) (syscall 171) sets the NIS domain name of the
  caller's UTS namespace: uname(2)'s domainname field and
  /proc/sys/kernel/domainname. It behaves exactly like sethostname but on
  the other field. len is a 32-bit int (upper register half ignored),
  0..64 is valid. Exactly len bytes are copied (no terminator needed) and
  the rest of the 65-byte field is cleared; bytes after an embedded NUL
  are stored but uname shows the name up to it; len 0 (also with a NULL
  name) makes it empty. The caller needs CAP_SYS_ADMIN in the user
  namespace that owns its UTS namespace. Each UTS namespace has its own
  domain name, copied from the creator's when the namespace is made. The
  node name is not touched.
returns:
  success: "0; uname().domainname is the len bytes given, followed by NULs up to 65 bytes"
  len0: "0; the domain name becomes empty (NULL name allowed with len 0)"
  len64: "0; a 64-byte name fills the field"
  embedded_nul: "0; \"ab\\0cd\" with len 5 is stored as given, uname shows \"ab\""
  len_width: "only the low 32 bits of len count: (1<<32)|3 is length 3; 0xffffffff is -1 (EINVAL)"
  proc: "/proc/sys/kernel/domainname reads the name and a newline (\"\\n\" alone when empty); writing \"name\\n\" sets it (the newline is dropped)"
  inheritance: "children created afterwards are in the same UTS namespace and see the name; the namespace a process left keeps its own name"
errors:
  permission: "EPERM (1): no CAP_SYS_ADMIN over the UTS namespace. Checked first: a normal user gets EPERM for len 65, len -1 and NULL too"
  bad_length: "EINVAL (22): len < 0 or > 64 (as a 32-bit int); checked before name is read (NULL with len 65 is EINVAL)"
  bad_name: "EFAULT (14): the len bytes at name are not all readable (NULL or a low address with len > 0, a name running into an unmapped page)"
  unchanged_on_error: "a failed call leaves the domain name as it was"
  order: "EPERM (privilege), then EINVAL (length), then EFAULT (copy)"
side_effects: >
  Changes the domain name of the caller's UTS namespace for every process
  in it (uname, /proc/sys/kernel/domainname). Nothing else.
threading: >
  The name belongs to the UTS namespace, shared by all its threads and
  processes.
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: __NEW_UTS_LEN 64 and struct new_utsname from linux/utsname.h;
# CLONE_NEWUTS 0x04000000 from linux/sched.h. Tests that change the name
# do so in a new UTS namespace (needs root); the permission test runs as
# uid 65534 (root drops to it in a child) so its output is the same for
# every caller. The machine's own names are never printed.
