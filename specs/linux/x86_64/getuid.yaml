id: linux/syscall/x86_64/getuid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  getuid() returns the real user id; as root, 0, on every call. Arguments
  are ignored. Children and threads have the same value; it is unchanged by
  execve; new files and directories are owned by the caller's (effective)
  uid.
returns:
  always: "the real uid; never fails"
errors:
  none: "cannot fail"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
