id: linux/syscall/x86_64/setresgid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setresgid(rgid, egid, sgid): like setresuid for groups: -1 keeps a field;
  with CAP_SETGID (effective uid 0) any values; without it each field may
  only take one of the current real, effective or saved gids. The values are
  32-bit (the upper half of the register is ignored). The filesystem gid
  follows the effective gid; setting only the saved gid changes neither.
returns:
  success: "0"
errors:
  permission: "EPERM (1) without CAP_SETGID for a new gid; nothing changes"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
