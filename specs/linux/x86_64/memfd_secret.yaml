# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/memfd_secret         # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "Docker privileged container on WSL2, x86-64; secretmem enabled; tests run as root with all capabilities and as uid/gid 65534 (RLIMIT_MEMLOCK unlimited in the container); umask 022"
  observed_by: spec-linux-e
  date: 2026-11-01
summary: >
  memfd_secret(flags) (syscall 447) creates an anonymous "secret memory"
  file and returns its descriptor (lowest free; F_GETFL O_RDWR|O_LARGEFILE;
  FD_CLOEXEC only with O_CLOEXEC, the only flag accepted). fstat shows a
  regular file, mode 0600, size 0. Its size is set once with ftruncate;
  the memory is used only through mmap(MAP_SHARED) of the descriptor: it
  reads as zeros at first, all shared mappings (also in forked children)
  see the same memory, and mappings stay valid after the descriptor is
  closed. The pages are taken out of the kernel's direct map and locked
  (counted against RLIMIT_MEMLOCK). Each call makes an independent file.
  The file cannot be read or written with system calls.
returns:
  success: "a new fd"
  memory: "zero-filled, shared by all MAP_SHARED mappings and across fork"
errors:
  flags: "EINVAL (22): flags other than O_CLOEXEC (1, O_NONBLOCK)"
  rw: "EINVAL (22): read and write on the descriptor; sendfile from it"
  seek: "ESPIPE (29): pread and lseek"
  private: "EINVAL (22): mmap with MAP_PRIVATE"
  resize: "EINVAL (22): ftruncate once the size is set (grow or shrink)"
  fallocate: "EOPNOTSUPP (95): fallocate"
  disabled: "ENOSYS (38) when secretmem is disabled (secretmem.enable=0); not the case here"
  memlock: "EAGAIN (11) from mmap/fault when RLIMIT_MEMLOCK would be exceeded; not tested"
side_effects: "uses one fd; memory locked while mapped"
threading: "none specific"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
