# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/mlock
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  mlock(addr, length) locks the pages of a range in memory: they become
  resident (mincore reports them) and stay so. addr is rounded down and the
  end up to page boundaries (unaligned is fine); length 0 succeeds. For root
  no RLIMIT_MEMLOCK limit applies. Locking again, and locking file mappings,
  static data and the stack, all succeed without changing the data. Locks
  are not inherited by a forked child.
returns:
  success: "0"
errors:
  range_with_unmapped_pages: "ENOMEM (also kernel addresses)"
  prot_none_pages: "ENOMEM"
  length_wraps_around: "EINVAL"
side_effects: "Pages are populated (faulted in) by the call."
threading: "the address space is shared by all threads of a process; changes are visible to every thread at once"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
