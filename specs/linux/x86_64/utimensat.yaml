# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/utimensat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  utimensat(dirfd, path, times, flags) sets atime (times[0]) and mtime
  (times[1]) as {tv_sec, tv_nsec}, stored to the nanosecond, any second
  value including 0 and negatives. tv_nsec UTIME_NOW ((1<<30)-1) sets the
  current time (tv_sec ignored); UTIME_OMIT ((1<<30)-2) leaves that time
  unchanged. A NULL times sets both to the same current time. A NULL path
  acts on the file of dirfd. AT_SYMLINK_NOFOLLOW (0x100) sets a link's own
  times. ctime always becomes the current time. utimes (235) takes two {sec,
  usec} timevals by path.
returns:
  success: "0"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  bad_nsec: "EINVAL for tv_nsec outside [0, 1e9) other than UTIME_NOW/UTIME_OMIT (utimes: usec outside [0, 1e6))"
  null_path_with_at_fdcwd: "EFAULT"
  null_path_bad_fd: "EBADF"
  bad_times_pointer: "EFAULT"
  unknown_flag: "EINVAL (e.g. 0x1)"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
side_effects: "ctime set to the current wall-clock time."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "the current time used is between CLOCK_REALTIME readings taken before and after the call (to the second)"
tests:
  visible: 2
  held_out: 1
