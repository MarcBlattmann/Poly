# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/pread64
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  pread64(fd, buf, count, offset) reads like read but at the given offset,
  and never changes the file offset. O_APPEND does not affect it. Short at
  end of file, 0 at or past it (any offset up to 2^63-1 is allowed).
returns:
  success: "bytes read; the descriptor's offset is unchanged"
  past_end: "0 (also far past the end, also with an invalid buffer)"
  count_0: "0"
  hole: "zero bytes"
errors:
  negative_offset: "EINVAL, checked before the descriptor (a closed fd with offset -1 gives EINVAL)"
  unseekable: "ESPIPE for pipes"
  directory: "EISDIR"
  not_readable: "EBADF (O_WRONLY, O_PATH, closed)"
  bad_buffer: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
