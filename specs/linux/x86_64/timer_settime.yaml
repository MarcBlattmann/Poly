# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/timer_settime
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  timer_settime(id, flags, new, old) arms or disarms a timer. struct
  itimerspec {it_interval, it_value}: it_value is the first expiry
  (relative, or an absolute time on the timer's clock with TIMER_ABSTIME; an
  absolute time in the past expires at once); it_interval > 0 makes it
  periodic; it_value 0 disarms (a disarmed timer never fires). old, if
  given, gets the previous setting (remaining time, not the original). A
  signal of the timer still pending when it is re-armed or disarmed is not
  delivered anymore. Periodic timers stay armed with their interval.
returns:
  success: "0"
errors:
  unknown_or_deleted_timer: "EINVAL"
  bad_time: "EINVAL (nsec outside [0, 1e9) in value or interval, negative seconds)"
  null_new: "EINVAL"
  bad_pointers: "EFAULT for new or old"
side_effects: "none beyond the timer"
threading: "signals a timer raises are delivered like any other; the tests keep them blocked and take them with rt_sigtimedwait"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
