# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fork
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  fork() creates a child process with a copy of the caller's memory (writes
  on either side are private), a copy of the descriptor table (same open
  files, so offsets are shared, FD_CLOEXEC flags copied), the same working
  directory, umask, resource limits, signal mask and dispositions;
  MAP_SHARED mappings stay shared. The child's parent is the caller and its
  pid is fork's result. Memory locks (mlock) and pending alarms are not
  inherited; MADV_WIPEONFORK ranges read as zero in the child.
returns:
  parent: "the child's pid"
  child: "0"
  pids: "pids, tids, pgids and sids are positive integers; their values are not specified, only their relations"
errors:
  resources: "EAGAIN/ENOMEM when no process can be created (not tested)"
side_effects: "The child's changes to its cwd, umask, limits, descriptors and private memory never affect the parent."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
