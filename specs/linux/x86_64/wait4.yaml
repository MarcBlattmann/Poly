# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/wait4
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  wait4(pid, status, options, rusage) waits for a child to end and reaps it.
  pid > 0: that child; -1: any child; 0: any child in the caller's process
  group; < -1: any child in group -pid. The status word is code << 8 for an
  exit, the signal number for a death by signal. WNOHANG (1) returns 0 while
  matching children are alive. Children with an exit signal other than
  SIGCHLD are matched only with __WCLONE (0x80000000) or __WALL
  (0x40000000). rusage, when given, gets the child's resource usage. A NULL
  status pointer is allowed. Threads are never waited for.
returns:
  reaped: "the child's pid"
  wnohang_none_ready: "0"
errors:
  no_matching_child: "ECHILD (no children, reaped already, not a child, the caller itself, a thread, or none in the selected group)"
  bad_options: "EINVAL (e.g. 0x100)"
side_effects: "A reaped child is gone (later waits for it: ECHILD); its CPU time is added to RUSAGE_CHILDREN and times()'s child fields."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
