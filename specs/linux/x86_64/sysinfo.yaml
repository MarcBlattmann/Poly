# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/sysinfo
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  sysinfo(info) fills struct sysinfo (112 bytes on x86-64): uptime (seconds,
  agrees with CLOCK_BOOTTIME), loads[3], totalram, freeram, sharedram,
  bufferram, totalswap, freeswap (in mem_unit bytes), procs (u16), then
  totalhigh, freehigh, mem_unit (u32 >= 1). totalram > 0 (at least 16 MiB),
  freeram <= totalram, freeswap <= totalswap, procs >= 1 and counts live
  processes (children included). Totals are stable between calls.
returns:
  success: "0"
errors:
  bad_pointer: "EFAULT (also NULL)"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
