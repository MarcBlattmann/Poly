id: linux/syscall/x86_64/pipe
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  pipe(fds) is pipe2 with flags 0: the two lowest free descriptors (gaps in
  the table are filled first), read end O_RDONLY then write end O_WRONLY, no
  FD_CLOEXEC, blocking, capacity 65536. A named pipe made with
  mknodat(S_IFIFO) behaves the same: opening the read end with O_NONBLOCK
  works without a writer (reads return 0 until a writer has opened), opening
  the write end with O_NONBLOCK and no reader is ENXIO, O_RDWR opens both
  ends at once, lseek is ESPIPE, EOF follows when the last writer closes.
returns:
  success: "0"
errors:
  bad_pointer: "EFAULT (14) for NULL, an unmapped or a read-only buffer; no descriptors are left open"
  fifo_no_reader: "ENXIO (6) opening a FIFO for writing with O_NONBLOCK and no reader"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
