# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/ftruncate
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  ftruncate(fd, length) sets a regular file's size: shrinking discards data,
  growing adds zero bytes (also visible through shared memory maps). The
  file offset does not move. Works on descriptors opened for writing
  (O_APPEND included). mtime and ctime change even when the size stays the
  same. truncate (76) does the same by path.
returns:
  success: "0"
errors:
  negative_length: "EINVAL; the size is unchanged"
  not_open_for_writing: "EINVAL for O_RDONLY"
  not_a_regular_file: "EINVAL for directories and pipes"
  o_path_or_bad_fd: "EBADF"
  truncate_directory: "EISDIR"
  truncate_path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP; negative length: EINVAL"
  truncate_path_order: "truncate: when a path has more than one problem, the first in this order decides: (1) the path string as a whole: an unreadable pointer EFAULT, 4096 bytes or more with its NUL ENAMETOOLONG, empty ENOENT (where an empty path is an error), whatever its components are; (2) the components from left to right as the walk reaches them, symbolic links followed on the way: the first that fails decides, a missing name or a dangling link ENOENT (a later \"..\" does not undo it), a non-directory (or a link to one) followed by more components ENOTDIR, a name over 255 bytes ENAMETOOLONG. So D/nope/<256 bytes>/x, D/nope/<256 bytes> and D/nope/../<256 bytes> are ENOENT, D/file/<256 bytes> is ENOTDIR, D/<256 bytes>/nope/x is ENAMETOOLONG: a name over 255 bytes is reported only when every directory before it exists. Errors about the last name itself (EEXIST and the like) come after all of these. The same on ext4 and tmpfs."
side_effects: "Other descriptors see the new size immediately."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
