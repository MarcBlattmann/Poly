id: linux/syscall/x86_64/setsid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setsid() makes a process that is not a process group leader the leader of
  a new session and process group, both numbered with its pid, without a
  controlling terminal (/dev/tty then fails with ENXIO). getsid(0),
  getpgid(0), getpgrp report the new ids; getsid(pid) shows them to the
  parent; children forked later are in the new session and group; kill(-sid)
  reaches the new group. The parent's session is unchanged.
returns:
  success: "the new session id (the caller's pid)"
errors:
  group_leader: "EPERM (1) when the caller leads a process group (also after setsid)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
