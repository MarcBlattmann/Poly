# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/setsid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  setsid() makes the caller (if it is not a process group leader) the leader
  of a new session and of a new process group, both with id = its pid,
  without a controlling terminal. Children created afterwards are in the new
  session and group, and may start their own session. The parent's session
  and group do not change.
returns:
  success: "the new session id (the caller's pid)"
errors:
  group_leader: "EPERM (also a second setsid by the same process)"
side_effects: "getsid and getpgrp of the caller change."
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
