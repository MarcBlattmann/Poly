# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/statfs
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  statfs(path, buf) fills the 120-byte struct statfs (asm-generic/statfs.h
  with long words): f_type, f_bsize, f_blocks, f_bfree, f_bavail, f_files,
  f_ffree, f_fsid (two i32), f_namelen, f_frsize, f_flags, f_spare[4]
  (zero). Symbolic links are followed. For a real file system: f_type
  nonzero, f_bsize and f_frsize positive, f_bfree <= f_blocks, f_bavail <=
  f_bfree, f_ffree <= f_files, f_namelen 255; every file on one file system
  reports the same f_type, f_bsize and f_fsid. f_blocks stays fixed while
  files are written; free counts do not rise while data is written and do
  not fall when it is removed.
returns:
  success: "0"
errors:
  dangling_link: "ENOENT"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  bad_buffer: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
