# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/statfs
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4, /dev/shm on tmpfs; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-21
summary: >
  statfs(path, buf) fills the 120-byte struct statfs (asm-generic/statfs.h
  with long words): f_type, f_bsize, f_blocks, f_bfree, f_bavail, f_files,
  f_ffree, f_fsid (two i32), f_namelen, f_frsize, f_flags, f_spare[4]
  (zero). Symbolic links are followed. For a real file system: f_type
  nonzero, f_bsize and f_frsize positive, f_bfree <= f_blocks, f_bavail <=
  f_bfree, f_ffree <= f_files, f_namelen 255; every file on one file system
  reports the same f_type, f_bsize and f_fsid. f_blocks stays fixed while
  files are written; free counts (f_bfree and f_bavail) do not rise while
  data is written and do not fall when it is removed. The counts are those
  of the whole file system, so other processes writing to it move them
  too: tests measure on the tmpfs at /dev/shm, which the test has to
  itself, and repeat a measurement that an outside change could have
  spoiled. (Observed: on ext4 and tmpfs 1 MiB of data takes exactly 256
  blocks of 4096 bytes from both counts and gives them back on unlink; the
  tests check only the direction.) /dev/shm is a tmpfs (f_type
  0x01021994).
returns:
  success: "0"
errors:
  dangling_link: "ENOENT"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  path_order: "when a path has more than one problem, the first in this order decides: (1) the path string as a whole: an unreadable pointer EFAULT, 4096 bytes or more with its NUL ENAMETOOLONG, empty ENOENT (where an empty path is an error), whatever its components are; (2) the components from left to right as the walk reaches them, symbolic links followed on the way: the first that fails decides, a missing name or a dangling link ENOENT (a later \"..\" does not undo it), a non-directory (or a link to one) followed by more components ENOTDIR, a name over 255 bytes ENAMETOOLONG. So D/nope/<256 bytes>/x, D/nope/<256 bytes> and D/nope/../<256 bytes> are ENOENT, D/file/<256 bytes> is ENOTDIR, D/<256 bytes>/nope/x is ENAMETOOLONG: a name over 255 bytes is reported only when every directory before it exists. Errors about the last name itself (EEXIST and the like) come after all of these. The same on ext4 and tmpfs."
  bad_buffer: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
