# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/statx
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  statx(dirfd, path, flags, mask, buf) fills the 256-byte struct statx
  (linux/stat.h). Path, dirfd, AT_SYMLINK_NOFOLLOW and AT_EMPTY_PATH work as
  for newfstatat. The returned stx_mask includes all of STATX_BASIC_STATS
  (0x7ff) on this file system whatever was requested, even mask 0; the
  fields agree with newfstatat (mode, nlink, uid, gid, ino, size, blocks,
  blksize, atime, mtime, ctime); stx_rdev_major/minor split st_rdev
  (/dev/null: 1, 3); stx_dev_major/minor split st_dev; spare fields are
  zero. Unknown mask bits are ignored. AT_STATX_FORCE_SYNC (0x2000) or
  AT_STATX_DONT_SYNC (0x4000) alone are accepted.
returns:
  success: "0"
  timestamps: "tv_sec (i64), tv_nsec (u32); exactly as set by utimensat"
errors:
  reserved_mask_bit: "EINVAL for STATX__RESERVED (0x80000000)"
  unknown_flag: "EINVAL (e.g. 0x1)"
  both_sync_flags: "EINVAL"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  bad_dirfd: "EBADF (also a closed fd with AT_EMPTY_PATH)"
  bad_buffer: "EFAULT (also NULL)"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
