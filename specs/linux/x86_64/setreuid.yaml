id: linux/syscall/x86_64/setreuid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setreuid(ruid, euid): -1 keeps a field. With CAP_SETUID any values.
  Without it the real uid may be set to the real or effective uid, the
  effective uid to the real, effective or saved uid. The saved uid becomes
  the new effective uid when the real uid is set, or when the effective uid
  is set to a value other than the real uid; setting the effective uid to
  the real uid leaves the saved uid alone.
returns:
  success: "0"
errors:
  permission: "EPERM (1) for a value the rules above do not allow (e.g. ruid to the saved uid)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
