# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/readv
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  readv(fd, iov, iovcnt) reads into the buffers of an array of {base, len}
  pairs (16 bytes each) in order, filling each completely before the next,
  as one read of the total length. Entries of length 0 are skipped (their
  base is not used). iovcnt may be 0 to 1024 (UIO_MAXIOV).
returns:
  success: "total bytes read; short at end of file, 0 at end of file"
  zero_count_or_all_empty: "0, offset unchanged"
  bad_later_buffer: "bytes stored before the unwritable buffer (a short read)"
errors:
  iovcnt_out_of_range: "EINVAL for iovcnt > 1024 or negative"
  negative_length: "EINVAL when any iov_len has the top bit set (as a signed size it is negative); nothing is read"
  bad_iov_array: "EFAULT"
  bad_first_buffer: "EFAULT"
  not_readable: "EBADF"
side_effects: "Advances the offset by the total returned."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
