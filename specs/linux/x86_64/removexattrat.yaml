# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/removexattrat        # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "Docker privileged container on WSL2, x86-64; tests run as root with all capabilities and as uid/gid 65534 (children dropping to uid/gid 1000); umask 022; /tmp on overlayfs (ext4 upper), /dev/shm tmpfs"
  observed_by: spec-linux-e
  date: 2026-11-01
summary: >
  removexattrat(dfd, path, at_flags, name) (syscall 466) is removexattr
  with a directory fd and flags (AT_SYMLINK_NOFOLLOW, AT_EMPTY_PATH;
  others EINVAL). It removes the named attribute; afterwards reads give
  ENODATA and the name is no longer listed. A missing attribute is
  ENODATA. user.* on a symlink itself (AT_SYMLINK_NOFOLLOW) is EPERM and
  the target is untouched. Permission as removexattr: user.* needs write
  permission (EACCES), trusted.* CAP_SYS_ADMIN (EPERM).
returns:
  success: "0"
errors:
  at_flags: "EINVAL (22): at_flags other than AT_SYMLINK_NOFOLLOW|AT_EMPTY_PATH"
  absent: "ENODATA (61): no such attribute"
  namespace: "EOPNOTSUPP (95): name without a known namespace prefix"
  name: "ERANGE (34): name empty or longer than 255 bytes; EFAULT (14): name unreadable"
  path: "ENOENT (2): missing file or \"\" without AT_EMPTY_PATH; EBADF (9): closed dirfd"
  perm: "EACCES (13): user.* without write permission; EPERM (1): trusted.* without CAP_SYS_ADMIN, user.* on a symlink itself"
side_effects: "removes the attribute; changes ctime"
threading: "none specific"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
