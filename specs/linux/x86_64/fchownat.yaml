# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fchownat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  fchownat(dirfd, path, uid, gid, flags) sets the owner and group; -1 (as a
  32-bit value) leaves that id unchanged. Root may set any ids up to 2^32-2.
  Symbolic links are followed unless AT_SYMLINK_NOFOLLOW (0x100);
  AT_EMPTY_PATH (0x1000) acts on dirfd's file. On a regular file every
  successful call, even with -1 for both ids, clears the set-user-ID bit and
  clears the set-group-ID bit if group execute is set (a set-group-ID bit
  without group execute stays); the sticky bit stays. Directories keep all
  their mode bits. fchown (93) acts on a descriptor, chown (92) by path.
returns:
  success: "0"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  dangling_link_followed: "ENOENT (with AT_SYMLINK_NOFOLLOW: 0, the link's owner changes)"
  empty_path_without_flag: "ENOENT"
  unknown_flag: "EINVAL (e.g. 0x1)"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  fchown_bad_fd: "EBADF"
side_effects: "ctime changes."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
