# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/nanosleep
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  nanosleep(req, rem) suspends the calling thread for at least req (struct
  timespec {tv_sec, tv_nsec}) measured on CLOCK_MONOTONIC, then returns 0. A
  zero time returns at once. Other threads keep running meanwhile. rem is
  written only when the sleep is interrupted by a signal handler.
returns:
  success: "0"
errors:
  bad_time: "EINVAL for tv_nsec outside [0, 1e9) or negative tv_sec"
  bad_req: "EFAULT (also NULL)"
  interrupted: "EINTR with the remaining time in rem (not tested)"
side_effects: "none"
threading: "only the calling thread sleeps"
ordering: []
timing:
  typical: "returns within a few milliseconds after the requested time on an idle system"
  guarantees: "never returns early"
tests:
  visible: 2
  held_out: 1
