# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/uprobe               # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "Docker privileged container on WSL2, x86-64; tests run as root with all capabilities and as uid/gid 65534; umask 022; CONFIG_UPROBES=y"
  observed_by: spec-linux-f
  date: 2026-11-02
summary: >
  uprobe() (syscall 336) is only meant to be executed by the kernel's own
  uprobe trampoline page, which the kernel maps into a process when an
  optimized uprobe is installed (by perf/BPF tooling). Ordinary programs
  never call it. Called from anywhere else (the program's own code, a page
  the program mapped executable itself, a forked child, a thread), it fails
  with ENXIO whatever its arguments, as root and as any user, every time.
  It raises no signal (SIGTRAP and SIGILL handlers do not run) and, like
  any system call, preserves all registers except rax, rcx and r11.
  For Poly, which installs no uprobes, "always ENXIO" is the complete
  behaviour.
returns:
  success: "never, outside the kernel's trampoline"
errors:
  not_trampoline: "ENXIO (6): any call not made from the kernel's uprobe trampoline"
side_effects: none
threading: "none specific"
ordering: []
timing:
  typical: "a plain failing system call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: syscall number from asm/unistd_64.h (336, next to uretprobe 335).
