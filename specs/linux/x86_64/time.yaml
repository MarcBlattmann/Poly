# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/time
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  time(tloc) returns the seconds of CLOCK_REALTIME (between clock_gettime
  seconds read before and after; after 2020) and, if tloc is not NULL,
  stores the same value there. It advances by about one per second.
returns:
  success: "seconds since the epoch"
errors:
  bad_pointer: "EFAULT (also a read-only page; nothing is stored)"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
