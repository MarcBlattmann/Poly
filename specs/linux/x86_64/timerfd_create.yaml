id: linux/syscall/x86_64/timerfd_create
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  timerfd_create(clockid, flags) makes a disarmed timer descriptor (O_RDWR;
  TFD_CLOEXEC, TFD_NONBLOCK) for CLOCK_REALTIME, CLOCK_MONOTONIC or
  CLOCK_BOOTTIME. Disarmed: gettime reads zeros, a nonblocking read is
  EAGAIN, poll shows nothing. Reads return the 8-byte number of expirations
  since the last read (blocking until at least one); writes are EINVAL. An
  expired timer is readable (POLLIN, EPOLLIN) and never writable; reading
  clears the readiness. Each clock's timers expire (CLOCK_REALTIME with an
  absolute deadline taken from clock_gettime).
returns:
  success: "a new descriptor"
errors:
  bad_clock: "EINVAL (22) for CPU-time clocks (2, 3), unknown or negative ids"
  bad_flags: "EINVAL (22) for other flags, including TFD_TIMER_ABSTIME"
  small_read: "EINVAL (22) for a read under 8 bytes"
  write: "EINVAL (22)"
  disarmed_read: "EAGAIN (11) when nonblocking"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
