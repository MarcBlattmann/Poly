# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/accept4
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  accept4(fd, addr, len, flags) takes the oldest waiting connection and
  returns a new connected socket (lowest free fd). The peer address is
  written with in/out len: a short buffer gets the start and len the full
  size; addr NULL is fine. SOCK_NONBLOCK and SOCK_CLOEXEC apply to the new
  socket; nothing is inherited from the listener's flags. A connection whose
  client already closed is still accepted (reads give its data, then 0).
  AF_UNIX seqpacket listeners give seqpacket connections. After the listener
  closes, connects are ECONNREFUSED. A listener shut down with SHUT_RD no
  longer accepts (EINVAL).
returns:
  success: "the new descriptor"
errors:
  nothing_waiting: "EAGAIN (11) on a nonblocking listener; reported before a bad length"
  bad_flags: "EINVAL (22)"
  bad_length: "EINVAL (22) for a negative len (with a connection waiting)"
  not_listening: "EINVAL (22)"
  dgram: "EOPNOTSUPP (95)"
  not_socket: "ENOTSOCK (88)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering:
  - "connections are accepted in the order they were made"
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
