# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/alarm
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  alarm(seconds) arranges SIGALRM after the given seconds (0 cancels) and
  returns the seconds that were left on the previous alarm, rounded to the
  nearest second but at least 1 while one is pending (0 if none). It uses
  the ITIMER_REAL timer. A pending alarm is not inherited by a fork child
  but survives execve.
returns:
  always: "seconds left on the previous alarm; never fails"
errors:
  none: "cannot fail"
side_effects: "Replaces any ITIMER_REAL setting."
threading: "signals a timer raises are delivered like any other; the tests keep them blocked and take them with rt_sigtimedwait"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "SIGALRM no earlier than the given seconds"
tests:
  visible: 2
  held_out: 1
