# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/setpgid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  setpgid(pid, pgid) moves process pid (0: the caller) into process group
  pgid (0: a new group with id pid). The target must be the caller or a
  child of it that has not called execve, in the same session; the group
  must exist in that session or be the target's own pid. Moving into one's
  own group again, and back into the parent's group, succeed.
returns:
  success: "0"
errors:
  no_such_process: "ESRCH (also not the caller or one of its children)"
  negative_pgid: "EINVAL"
  group_not_in_session: "EPERM (a group that does not exist, or one in another session)"
  session_leader: "EPERM (a session leader cannot change its group)"
  child_after_execve: "EACCES (observed; not in the tests, which cannot order the two processes then)"
side_effects: "getpgid/getpgrp of the target change; wait4(0)/wait4(-pgid) matching follows."
threading: "applies to the whole process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
