# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/setpgid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setpgid(pid, pgid): pid 0 is the caller, pgid 0 means pgid = pid. A
  process can make itself or its child (before the child execs) the leader
  of a new group, or move it into an existing group of the same session (a
  sibling's group). getpgid(pid) reads another process's group, getpgid(0)
  and getpgrp the caller's. Children start in their parent's group.
returns:
  success: "0"
errors:
  negative_pgid: "EINVAL (22)"
  not_child: "ESRCH (3) for a pid that is neither the caller nor its child"
  no_group: "EPERM (1) for a pgid with no group in the caller's session"
  session_leader: "EPERM (1) for moving a session leader, or into a group of another session"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
