id: linux/syscall/x86_64/listen
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  listen(fd, backlog) makes a bound stream socket accept connections
  (AF_INET: an unbound one is autobound to a port); SO_ACCEPTCONN becomes 1.
  Calling it again is allowed and changes the backlog; a negative backlog is
  accepted. For AF_UNIX the queue holds backlog+1 pending connections
  (backlog 0 holds 1): a nonblocking connect beyond that is EAGAIN;
  accepting one makes room for one. A listening socket is readable (POLLIN)
  only while a connection is waiting; read on it is EINVAL.
returns:
  success: "0"
errors:
  unbound_unix: "EINVAL (22)"
  dgram: "EOPNOTSUPP (95)"
  connected: "EINVAL (22)"
  not_socket: "ENOTSOCK (88)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
