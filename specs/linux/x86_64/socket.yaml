# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/socket
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  socket(family, type, protocol) makes an unconnected socket descriptor
  (O_RDWR, lowest free fd; lseek is ESPIPE). AF_UNIX (1) takes SOCK_STREAM,
  SOCK_DGRAM and SOCK_SEQPACKET with protocol 0 or 1; AF_INET (2)
  SOCK_STREAM (protocol 0 or IPPROTO_TCP) and SOCK_DGRAM (0 or IPPROTO_UDP).
  SOCK_NONBLOCK and SOCK_CLOEXEC in the type set O_NONBLOCK and FD_CLOEXEC;
  they do not show in SO_TYPE. SO_TYPE, SO_DOMAIN and SO_PROTOCOL read back
  what was made (AF_INET protocol 0 reads as 6 or 17). AF_UNIX datagram
  sockets: bind with only the family autobinds an abstract name of 5 hex
  digits (length 8); each sendto is one message with its boundary kept,
  recvfrom names the sender, a longer message is cut (MSG_TRUNC returns the
  full length), empty datagrams exist, sending to an unbound abstract name
  is ECONNREFUSED, sending to oneself works.
returns:
  success: "a new descriptor"
errors:
  family: "EAFNOSUPPORT (97) for an unknown or negative family"
  unix_type: "ESOCKTNOSUPPORT (94) for an AF_UNIX type it does not have (e.g. 9)"
  protocol: "EPROTONOSUPPORT (93) for a protocol that does not fit (AF_UNIX 5, TCP type with UDP...)"
  type_flags: "EINVAL (22) for flag bits other than SOCK_NONBLOCK/SOCK_CLOEXEC in the type"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
