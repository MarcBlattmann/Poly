# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/faccessat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  faccessat(dirfd, path, mode) checks whether the caller could access path
  with mode = F_OK (0) or an OR of R_OK 4, W_OK 2, X_OK 1, using the real
  uid. The raw system call has three arguments and no flags; symbolic links
  are always followed. For uid 0, R_OK and W_OK always succeed; X_OK
  succeeds on a directory always and on another file if any execute bit
  (owner, group or other) is set. The old access (21) call is faccessat with
  AT_FDCWD.
returns:
  success: "0"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  denied: "EACCES (root: X_OK on a file with no execute bit, e.g. mode 0644, 0000, or /dev/null)"
  bad_mode: "EINVAL for bits above 7"
  dangling_link: "ENOENT"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
