# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/chdir
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  chdir(path) sets the working directory of the process, used for relative
  paths and AT_FDCWD. Symbolic links are followed; "..", "." and repeated
  slashes resolve; ".." of "/" is "/". Root may enter a directory of mode 0.
  A failed chdir leaves the working directory unchanged. A child process
  created without CLONE_FS starts in its parent's working directory and its
  own chdir does not affect the parent. Descriptors opened earlier keep
  their own directory.
returns:
  success: "0"
errors:
  not_a_directory: "ENOTDIR"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
side_effects: "Changes the working directory for every thread sharing it."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
