# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/sendmsg
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  sendmsg(fd, msghdr, flags): the iovec entries are sent as one message (one
  datagram, or contiguous stream bytes; zero-length entries skipped; no
  entries sends an empty datagram) and the total is returned; msg_name gives
  a datagram's destination. Control messages at SOL_SOCKET: SCM_RIGHTS (1)
  passes descriptors over AF_UNIX (on UDP it is accepted and the datagram
  sent); SCM_CREDENTIALS (2) with the sender's own pid, uid and gid is
  accepted, as root another existing pid too, and arrives as sent at a
  receiver with SO_PASSCRED.
returns:
  success: "the number of bytes sent"
errors:
  bad_iovec: "EFAULT (14) for an unreadable iovec or msghdr"
  too_many: "EMSGSIZE (90) for more than 1024 iovec entries"
  bad_cmsg: "EINVAL (22) for an unknown control type at SOL_SOCKET or a cmsg_len too short"
  closed_fd_in_rights: "EBADF (9)"
  no_such_pid: "ESRCH (3) in SCM_CREDENTIALS"
  unix_unconnected: "ENOTCONN (107) without msg_name on an unconnected AF_UNIX datagram socket"
  udp_unconnected: "EDESTADDRREQ (89)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
