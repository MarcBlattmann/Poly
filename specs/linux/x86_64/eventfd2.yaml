id: linux/syscall/x86_64/eventfd2
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  eventfd2(initval, flags) makes a counter descriptor (O_RDWR; flags
  EFD_CLOEXEC, EFD_NONBLOCK, EFD_SEMAPHORE). write adds an 8-byte value;
  read returns the counter (8 bytes) and resets it to 0, or with
  EFD_SEMAPHORE returns 1 and decrements. A zero counter: read blocks, or
  EAGAIN when nonblocking. The counter holds at most 0xfffffffffffffffe: a
  write that would pass it blocks (EAGAIN nonblocking); writing 0 is always
  fine. Readable (POLLIN) while above 0, writable (POLLOUT) while at least 1
  can be added (epoll the same). A blocking read is woken by a write from
  another process; a blocking write on a full counter by a read. Buffers
  larger than 8 transfer 8. A read into a bad buffer is EFAULT and the value
  is lost (the counter was reset). lseek returns 0. The counter is shared by
  dup and fork.
returns:
  read: "8, the counter value"
  write: "8"
errors:
  small_buffer: "EINVAL (22) for read or write of fewer than 8 bytes"
  max_value: "EINVAL (22) for writing 0xffffffffffffffff"
  would_block: "EAGAIN (11) when nonblocking: empty read, overflowing write"
  bad_flags: "EINVAL (22) for other flags (e.g. O_RDWR, 0x10)"
  bad_buffer: "EFAULT (14)"
  fionread: "ENOTTY (25) for FIONREAD"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
