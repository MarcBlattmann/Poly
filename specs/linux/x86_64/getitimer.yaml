id: linux/syscall/x86_64/getitimer
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  getitimer(which, cur) stores the remaining time and interval of an
  interval timer; all three are disarmed (zeros) in a new process.
  ITIMER_REAL shows a timer set with alarm (interval 0). A periodic
  ITIMER_REAL whose SIGALRM waits blocked shows 0 remaining until the signal
  is taken; then it shows the reloaded time (at most the interval).
returns:
  success: "0"
errors:
  unknown_timer: "EINVAL"
  bad_pointer: "EFAULT (also NULL)"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
