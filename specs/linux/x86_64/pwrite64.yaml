# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/pwrite64
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  pwrite64(fd, buf, count, offset) writes at the given offset without
  changing the file offset; the file grows as needed with a zero-filled
  hole. On a descriptor with O_APPEND, Linux ignores the offset and appends
  (unlike POSIX); after O_APPEND is cleared with F_SETFL the offset is
  honoured again.
returns:
  success: "count; the descriptor's offset is unchanged"
  count_0: "0; the file does not grow even with an offset past the end"
  o_append: "data appended at end of file, no hole created"
errors:
  negative_offset: "EINVAL"
  unseekable: "ESPIPE for pipes"
  not_writable: "EBADF (O_RDONLY, directory, closed)"
  bad_buffer: "EFAULT; nothing is written"
side_effects: "Updates size, mtime and ctime."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
