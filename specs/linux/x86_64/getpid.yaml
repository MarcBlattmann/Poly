# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/getpid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  getpid() returns the process id: positive, constant for the life of the
  process (also across execve), equal to the main thread's gettid and to
  set_tid_address's result in the main thread. Every thread of a process
  gets the same value; each child process (fork, vfork, clone without
  CLONE_THREAD) gets its own, the one its creator was given, and live
  processes have distinct ids.
returns:
  always: "the pid; never fails"
  pids: "pids, tids, pgids and sids are positive integers; their values are not specified, only their relations"
errors:
  none: "cannot fail"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
