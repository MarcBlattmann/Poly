id: linux/syscall/x86_64/setsockopt
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setsockopt(fd, level, name, value, len). Boolean options (SO_REUSEADDR,
  SO_KEEPALIVE, SO_BROADCAST) read back 1 for any nonzero value and 0 for
  zero; SO_RCVLOWAT takes the value (0 reads back as 1); SO_RCVBUF and
  SO_SNDBUF are doubled when read back, and raised to a minimum when tiny;
  SO_RCVTIMEO and SO_SNDTIMEO take a timeval: a blocking read or a write to
  a full socket fails with EAGAIN after it, it reads back as set (rounded up
  to the clock tick); SO_LINGER takes 8 bytes {onoff, seconds} and reads
  back onoff as 1; SO_PASSCRED on AF_UNIX adds credentials to received
  messages; TCP_NODELAY on TCP.
returns:
  success: "0"
errors:
  read_only: "ENOPROTOOPT (92) for SO_TYPE, SO_ERROR, SO_PROTOCOL"
  unknown: "ENOPROTOOPT (92)"
  short: "EINVAL (22) for len below 4 (8 for SO_LINGER)"
  timeout_range: "EDOM (33) for a timeval with tv_usec of a million or more"
  bad_pointer: "EFAULT (14)"
  not_socket: "ENOTSOCK (88)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
