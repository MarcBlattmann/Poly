# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/writev
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  writev(fd, iov, iovcnt) writes the buffers in order as one write of the
  total length; with O_APPEND the whole vector goes to the end of file.
  iovcnt 0..1024.
returns:
  success: "total bytes written"
  zero_count_or_all_empty: "0, nothing written"
  bad_later_buffer: "bytes written before the unreadable buffer"
  standard_output: "a vector to fd 1 or 2 is written as the concatenated bytes"
errors:
  iovcnt_out_of_range: "EINVAL for iovcnt > 1024 or negative"
  negative_length: "EINVAL; nothing written"
  bad_iov_array: "EFAULT"
  bad_first_buffer: "EFAULT; nothing written"
  not_writable: "EBADF"
side_effects: "Updates size, mtime, ctime and the offset."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
