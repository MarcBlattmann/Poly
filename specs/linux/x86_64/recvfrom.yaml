id: linux/syscall/x86_64/recvfrom
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  recvfrom(fd, buf, len, flags, addr, addrlen). Datagrams: one per call with
  the sender's address (addrlen in/out; a short buffer gets the start,
  addrlen the full size; NULL is fine); MSG_PEEK leaves it queued; a longer
  datagram is cut and the rest dropped (MSG_TRUNC returns the real length).
  Streams (AF_UNIX and TCP): bytes without boundaries; the address is not
  written and addrlen is set to 0; MSG_WAITALL waits for the full count;
  after the peer closes the rest and then 0. MSG_DONTWAIT on an empty queue
  is EAGAIN.
returns:
  success: "bytes received (0 for an empty datagram or end of stream)"
errors:
  empty: "EAGAIN (11) with MSG_DONTWAIT (reported before a bad buffer)"
  bad_buffer: "EFAULT (14)"
  not_socket: "ENOTSOCK (88)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
