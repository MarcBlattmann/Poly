# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/newfstatat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  newfstatat(dirfd, path, statbuf, flags) is fstat by path (same struct).
  Symbolic links are followed unless flags has AT_SYMLINK_NOFOLLOW (0x100);
  a link itself reports S_IFLNK, mode 0777, size = length of its target
  text, its own inode. AT_EMPTY_PATH (0x1000) with an empty path stats dirfd
  itself (AT_FDCWD: the working directory); AT_NO_AUTOMOUNT (0x800) is
  accepted. The old stat (4) and lstat (6) calls behave like
  newfstatat(AT_FDCWD, path, buf, 0 or AT_SYMLINK_NOFOLLOW).
returns:
  success: "0"
  trailing_slash_on_directory: "allowed"
  hard_links: "share st_ino/st_dev; st_nlink counts names; a directory has 2 + number of subdirectories"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  dangling_link_followed: "ENOENT (without following: 0)"
  empty_path_without_at_empty_path: "ENOENT"
  unknown_flags: "EINVAL (bit 0x1, AT_REMOVEDIR 0x200, AT_SYMLINK_FOLLOW 0x400)"
  bad_buffer: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
