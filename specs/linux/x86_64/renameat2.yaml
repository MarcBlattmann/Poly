# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/renameat2
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  renameat2(olddirfd, oldpath, newdirfd, newpath, flags) moves a name. With
  flags 0 an existing target is replaced atomically (a file by a file, a
  directory by an empty directory); the inode and open descriptors are kept;
  renaming a name to itself or onto another hard link of the same file
  succeeds and changes nothing. RENAME_NOREPLACE (1) fails if the target
  exists. RENAME_EXCHANGE (2) swaps two existing names of any types. The old
  rename (82) and renameat (264) calls are flags 0.
returns:
  success: "0"
  directory_moved: "its contents move with it; the old and new parents' link counts adjust"
  trailing_slashes: "allowed when the source is a directory"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  file_over_directory: "EISDIR"
  directory_over_file: "ENOTDIR"
  directory_over_non_empty_directory: "ENOTEMPTY"
  into_own_subtree: "EINVAL"
  dot_or_dotdot_component: "EBUSY when the last component of either path is \".\" or \"..\""
  trailing_slash_on_file: "ENOTDIR (source or target)"
  noreplace_exists: "EEXIST (also renaming a name onto itself)"
  exchange_missing: "ENOENT if either name is missing"
  noreplace_with_exchange_or_unknown_flag: "EINVAL; nothing changes"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
side_effects: "ctime of the moved inode and mtime/ctime of both parents change."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
