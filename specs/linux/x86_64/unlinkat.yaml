# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/unlinkat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  unlinkat(dirfd, path, flags) removes a name. With flags 0 it removes a
  non-directory name (a symbolic link is removed itself, never its target);
  the file lives on while other names or open descriptors remain, with
  st_nlink counting the names. With AT_REMOVEDIR (0x200) it removes an empty
  directory, like rmdir; an open descriptor on it stays valid (fstat shows
  nlink 0) but nothing can be created in it (ENOENT). The old unlink (87)
  and rmdir (84) calls behave the same.
returns:
  success: "0"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  directory_without_at_removedir: "EISDIR"
  at_removedir_on_non_directory: "ENOTDIR (also on a symbolic link to a directory)"
  not_empty: "ENOTEMPTY (also for \"dir/..\")"
  dot: "EINVAL for a last component \".\""
  unknown_flags: "EINVAL (e.g. 0x1); nothing removed"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  path_order: "when a path has more than one problem, the first in this order decides: (1) the path string as a whole: an unreadable pointer EFAULT, 4096 bytes or more with its NUL ENAMETOOLONG, empty ENOENT (where an empty path is an error), whatever its components are; (2) for a relative path, dirfd: not open EBADF, open on a non-directory ENOTDIR, even when a component is missing or over 255 bytes; (3) the components from left to right as the walk reaches them, symbolic links followed on the way: the first that fails decides, a missing name or a dangling link ENOENT (a later \"..\" does not undo it), a non-directory (or a link to one) followed by more components ENOTDIR, a name over 255 bytes ENAMETOOLONG. So D/nope/<256 bytes>/x, D/nope/<256 bytes> and D/nope/../<256 bytes> are ENOENT, D/file/<256 bytes> is ENOTDIR, D/<256 bytes>/nope/x is ENAMETOOLONG: a name over 255 bytes is reported only when every directory before it exists. Errors about the last name itself (EEXIST and the like) come after all of these. The same on ext4 and tmpfs."
side_effects: "Parent directory's link count drops when a subdirectory is removed."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
