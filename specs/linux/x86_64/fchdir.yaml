# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fchdir
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  fchdir(fd) makes the directory an open descriptor refers to the working
  directory; O_RDONLY and O_PATH directory descriptors work, and the
  directory can have been renamed or even removed since it was opened. After
  entering a removed directory, getcwd fails with ENOENT and creating names
  relative to it fails with ENOENT; absolute paths keep working.
returns:
  success: "0"
errors:
  not_a_directory: "ENOTDIR (regular files, pipes)"
  bad_fd: "EBADF (closed, negative)"
side_effects: "As chdir; a failed fchdir leaves the working directory unchanged."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
