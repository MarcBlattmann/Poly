id: linux/syscall/x86_64/signalfd
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  signalfd(fd, mask, sigsetsize) is signalfd4 with flags 0: blocking, no
  FD_CLOEXEC. fd -1 creates; an existing signalfd gets the new mask. A
  signal that is not blocked is delivered to its handler and never shows up
  in the descriptor. The descriptor follows the reading process: across fork
  the child reads its own pending signals, not the parent's.
returns:
  success: "the descriptor"
errors:
  sigsetsize: "EINVAL (22) when not 8"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 0                                  # count in <symbol>.tests/
  held_out: 0                                 # count kept by the diff runner
