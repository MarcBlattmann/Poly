# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/capget
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  capget(header, data): header {version, pid}; version 3 (0x20080522) uses
  two data records {effective, permitted, inheritable} (capabilities 0-31,
  then 32-63), version 1 (0x19980330) one record. pid 0 or the caller's pid
  reads the caller, another pid that process. Root has effective = permitted
  (CAP_KILL 5, CAP_SETGID 6, CAP_SETUID 7, CAP_SYS_ADMIN 21 ...), nothing
  inheritable, nothing above the last capability. A process whose effective
  uid is nonzero (others 0) has an empty effective set and its permitted
  set; one with all uids nonzero has both empty. An unknown version writes
  the preferred version (0x20080522) into the header; with a NULL data
  pointer that probe returns 0.
returns:
  success: "0"
errors:
  bad_version: "EINVAL (22), version written back (unless data is NULL: 0)"
  no_such_pid: "ESRCH (3)"
  bad_header: "EFAULT (14)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
