# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/getdents             # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 x86_64"
  machine: "WSL2 container; tests run as root with all capabilities and again as uid/gid 1000 with no groups and no capabilities; /tmp a fresh tmpfs, repeated on overlayfs (same results); static freestanding test programs, raw syscalls"
  observed_by: spec-linux-b
  date: 2026-10-31
summary: >
  getdents(fd, dirp, count) is system call 78, the older form of getdents64
  (217). It reads entries of the directory open on fd from the descriptor's
  current position into dirp (at most count bytes, whole records only) and
  returns the number of bytes filled, 0 at the end. The records are struct
  linux_dirent, whose layout differs from linux_dirent64: d_ino (unsigned
  long, 8 bytes, offset 0), d_off (unsigned long, 8, offset 8), d_reclen
  (unsigned short, 2, offset 16), d_name (NUL-terminated, offset 18), zero or
  more padding bytes, and the file type (DT_* value) in the LAST byte of the
  record (offset d_reclen - 1).
returns:
  success: "number of bytes written: a sum of whole records; 0 once every entry has been returned (also on further calls)"
  record_length: "d_reclen = (18 + strlen(name) + 2) rounded up to a multiple of 8: \".\" and \"..\" 24 bytes, a 1-3 byte name 24, \"entry_00\" (8 bytes) 32, a 34-byte name 56"
  entries: "every entry once, \".\" and \"..\" included (an empty directory gives exactly 48 bytes: two 24-byte records); d_ino equals st_ino from lstat of the entry; the type byte is DT_DIR 4, DT_REG 8, DT_LNK 10, DT_FIFO 1 (and DT_CHR 2, DT_BLK 6, DT_SOCK 12); the order is the file system's (do not rely on it)"
  same_as_getdents64: "getdents and getdents64 on the same directory list the same entries in the same order with the same d_ino, d_off and type"
  d_off: "each record's d_off is a position: lseek(fd, d_off, SEEK_SET) makes the next call continue with the following record (the bytes returned equal the rest of a full listing); after the whole directory is read, lseek(fd, 0, SEEK_CUR) equals the last record's d_off; lseek(fd, 0, SEEK_SET) starts over (the same bytes again)"
  small_buffers: "records are never split: with room for 2.5 records, 2 are returned; one record per call when count fits exactly one"
  descriptor: "a directory opened with O_RDONLY alone (no O_DIRECTORY) works"
errors:
  too_small: "EINVAL (22): count smaller than the next record (0, 1, 23 for \".\"; 31 for a 32-byte record), also with a NULL buffer; the position does not move, so a following call with a larger buffer returns that record"
  bad_fd: "EBADF (9): not open (-1, 900), or an O_PATH descriptor"
  not_a_directory: "ENOTDIR (20): a regular file, a pipe, /dev/null"
  bad_buffer: "EFAULT (14): NULL or a read-only buffer with a sufficient count; the position is not lost (a later call returns the entries)"
  removed_directory: "ENOENT (2): the directory was removed (rmdir) after it was opened"
  order: "a count too small for the next record is EINVAL even when the buffer is NULL (the buffer is only faulted on when a record is written to it); EFAULT otherwise for an unwritable buffer"
side_effects: "advances the descriptor's position; may update the directory's atime"
threading: "the position is the open file description's, shared by descriptors dup'ed from it"
ordering: []
timing:
  typical: "microseconds; does not block"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
