# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fsetxattr
oracle:
  os: "Linux 7.0.0-30-generic x86_64"
  machine: "host, uid 1001 (not root), /tmp on ext4 (4 KiB blocks) and every test rerun on tmpfs (/dev/shm) with identical results; static freestanding test programs, raw syscalls. Root-only behaviour (trusted.* with CAP_SYS_ADMIN, DAC override) from xattr(7) and setxattr(2), not observed."
  observed_by: spec-claude-1
  date: 2026-10-23
summary: >
  fsetxattr(fd, name, value, size, flags) (190) sets the extended attribute
  `name` of the file open on descriptor `fd` to the `size` bytes at `value`.
  It behaves like setxattr (188) on the inode behind the descriptor: same
  name, value, size and flags rules, same namespaces and permission checks.
  The descriptor's access mode does not matter (O_RDONLY works); permission
  comes from the file's current mode bits. O_PATH descriptors are EBADF.
  fd is an int (only the low 32 bits count), and on this kernel the value
  AT_FDCWD (-100) acts on the current working directory. The value is stored
  byte for byte (NUL bytes included); a zero-length value is allowed and
  `value` may then be NULL or any pointer. With flags 0 the attribute is
  created or replaced. Attributes belong to the inode: unlinked open files,
  O_TMPFILE files and removed open directories still take them, and every
  descriptor and hard link of the inode sees them. fgetxattr (193) and
  getxattr (191) read them back.
returns:
  success: "0"
  descriptor: "any open descriptor of a regular file or directory, whatever its access mode (O_RDONLY, O_WRONLY, O_RDWR, O_RDONLY|O_DIRECTORY), including one opened through a symbolic link (acts on the target), a dup'd or inherited (fork) descriptor, a file unlinked while open, an O_TMPFILE file, a directory removed while open, and a memfd (a regular file: user.* works). Only the low 32 bits of fd count: fd + 2^32 is the same descriptor, 0xffffff9c is AT_FDCWD."
  at_fdcwd: "fd AT_FDCWD (-100) acts on the calling process's current working directory, like a descriptor of it: the attribute lands on that directory (not its parent), XATTR_CREATE then gives EEXIST, a 0555 working directory is EACCES for user.* (without CAP_DAC_OVERRIDE), trusted.* without CAP_SYS_ADMIN EPERM, and a working directory that has been removed still takes attributes. Other negative values (-1, -99, -101) are EBADF."
  flags: "only the low 32 bits count (flags is an int; 0x100000000 acts as 0, 0x100000001 as XATTR_CREATE, 0x100000002 as XATTR_REPLACE). 0: create or replace. XATTR_CREATE (1): EEXIST if the name exists. XATTR_REPLACE (2): ENODATA if it does not. Both (3): EEXIST if it exists, ENODATA if not (never succeeds). Any other bit (4, 5, 8, 0x80000000, -1): EINVAL. For system.posix_acl_access the flags have no effect (XATTR_CREATE twice and XATTR_REPLACE with nothing stored both succeed)."
  names: "1 to 255 bytes including the prefix; any bytes after the prefix are allowed (\"user..\", \"user.a/b \\x01\\xff\"). Names are case-sensitive and independent (\"user.a\", \"user.A\", \"user.a0\" are three attributes). Known prefixes: user., trusted., security., system. (lower case, at the very start). Empty name: ERANGE; 256 bytes or more: ERANGE; unreadable name (NULL, address 1): EFAULT. Unknown or missing prefix (\"plain\", \"user\", \"USER.a\", \".user.a\", \"foo.bar\"): EOPNOTSUPP. \"user.\" alone: EINVAL (\"trusted.\" alone too, for a caller allowed trusted.*). Unknown system.* names (\"system.x\", \"system.\"): EOPNOTSUPP."
  value: "size 0 to 65536 is accepted by the call; more than 65536 (65537, 2^32 + 1, SIZE_MAX: size_t compared in full) is E2BIG. With size > 0 a value that cannot be read in full (NULL, an unmapped address, a buffer running into an unmapped page) is EFAULT; a buffer ending exactly at an unmapped page works. With size 0 the pointer is not read. How much a file system stores differs (tmpfs keeps 65536-byte values, ext4 with 4 KiB blocks about 4 KiB of attributes per inode, ENOSPC beyond); values of a few hundred bytes fit everywhere."
  user_namespace: "user.* attributes exist only on regular files and directories: pipe ends, UNIX sockets, an opened FIFO, a character device (/dev/null), eventfd and epoll descriptors give EPERM (\"user.\" too), also for root. They need write permission on the file by its current mode bits, checked at call time, not at open time: a 0444 file opened O_RDONLY is EACCES, a file opened O_RDWR and then fchmod'ed to 0444 is EACCES, a 0200 file (or one fchmod'ed to 0200) works. Root passes through CAP_DAC_OVERRIDE; a caller without capabilities does not. The owner may set them on its own sticky directory; on another user's sticky directory (/tmp as non-root) EPERM."
  trusted_namespace: "trusted.* needs CAP_SYS_ADMIN, else EPERM, before any write-permission check (a 0444 file: EPERM; also on pipes, sockets, /dev/null, eventfd). With CAP_SYS_ADMIN it works through any descriptor of a regular file or directory (O_RDONLY, AT_FDCWD), XATTR_CREATE / XATTR_REPLACE as for user.* (xattr(7), not observed)."
  security_namespace: "security.* without CAP_SYS_ADMIN: EPERM (\"security.\" alone too), before the write-permission check (a 0444 file: EPERM). Not observed with privilege."
  unknown_namespace: "names without a known prefix need write permission first: a non-writable regular file EACCES; a writable file, pipe, socket, opened FIFO, /dev/null or memfd EOPNOTSUPP."
  system_namespace: "system.posix_acl_access / system.posix_acl_default: a value whose length is not 4 + 8 * n bytes is EINVAL, a version field other than 2 is EOPNOTSUPP, also on a read-only file; a default ACL on a regular file is EACCES. Setting an access ACL needs ownership, not write permission: the owner sets it on its own 0444 file opened O_RDONLY. An access ACL of only the three base entries (USER_OBJ, GROUP_OBJ, OTHER) replaces the mode's permission bits (perms 7/5/0 turn 0444 into 0750) and is not kept as an attribute (fgetxattr then gives ENODATA, flistxattr lists nothing). An empty (size 0) or header-only (4 bytes, version 2) access ACL succeeds and leaves the mode alone. A default ACL on an owned directory is kept and reads back with the same bytes (28 for three base entries), mode unchanged. On a pipe: a header-only ACL EOPNOTSUPP, a bad-length one EINVAL. Layout (linux/posix_acl_xattr.h): u32 version 2, then entries of u16 tag, u16 perm, u32 id; tags USER_OBJ 1, GROUP_OBJ 4, OTHER 0x20 (linux/posix_acl.h). Unknown system.* names: EOPNOTSUPP, also on a read-only file."
errors:
  flags: "EINVAL"
  name: "EFAULT (unreadable), ERANGE (empty or 256+ bytes), EOPNOTSUPP (unknown prefix, unknown system.*), EINVAL (\"user.\" on a file or directory)"
  size: "E2BIG (> 65536)"
  value: "EFAULT; ACL values: EINVAL (bad length), EOPNOTSUPP (bad version)"
  descriptor: "EBADF: negative other than AT_FDCWD (-1, -99, -101), not open (closed, never opened, 0x7fffffff), or an O_PATH descriptor (of a file, a directory, or a symbolic link opened O_PATH|O_NOFOLLOW), also with trusted.* or as root"
  exists: "EEXIST (XATTR_CREATE), ENODATA (XATTR_REPLACE)"
  permission: "EPERM (user.* on a non-regular non-directory: pipe, socket, FIFO, device, eventfd, epoll; user.* on another user's sticky directory; trusted.*/security.* without CAP_SYS_ADMIN; immutable or append-only files per setxattr(2)); EACCES (no write permission by mode for user.* and unknown prefixes, default ACL on a non-directory)"
  not_supported: "EOPNOTSUPP (unknown prefix on a writable object or a non-regular file, unknown system.* name, ACL version not 2, header-only ACL on a pipe)"
  space: "ENOSPC / EDQUOT when the file system has no room (ext4: about 4 KiB per inode)"
  order: "when several problems exist, the first in this list decides: (1) flags EINVAL; (2) the name: EFAULT, then empty or too long ERANGE; (3) size E2BIG; (4) the value EFAULT; (5) the descriptor EBADF (bad number or O_PATH); (6) system.* names: unknown EOPNOTSUPP, ACL value EINVAL / EOPNOTSUPP, default ACL on a file EACCES; (7) trusted.* and security.* without CAP_SYS_ADMIN EPERM, user.* on a non-regular non-directory EPERM, user.* on another user's sticky directory EPERM; (8) write permission EACCES (user.* and unknown prefixes); (9) unknown prefix EOPNOTSUPP, empty suffix (\"user.\") EINVAL; (10) EEXIST / ENODATA from the flags. Examples: fd -1 with bad flags EINVAL, with an empty name ERANGE, with size 65537 E2BIG, with a NULL value EFAULT, but with \"foo.a\", \"user.\", \"trusted.a\", a bad ACL value or XATTR_REPLACE EBADF; an O_PATH descriptor with bad flags EINVAL, with an empty name ERANGE; on a 0444 file a bad ACL value EINVAL, \"system.x\" EOPNOTSUPP, \"trusted.a\" and \"security.a\" EPERM, \"user.a\", \"user.\", \"foo.a\" and XATTR_REPLACE of a missing name EACCES; on a writable file \"foo.a\" with XATTR_CREATE EOPNOTSUPP, \"user.\" with XATTR_REPLACE EINVAL, \"trusted.m\" with XATTR_REPLACE EPERM."
side_effects: "a successful set (new or replaced attribute) moves the change time (ctime) of the inode forward; mode, size, contents and mtime do not change (except that a base-entries-only access ACL rewrites the permission bits). A failed call changes nothing: no attribute is created (EINVAL, E2BIG, EFAULT, EBADF, EOPNOTSUPP included), the value, ctime and mtime stay as they were."
threading: "no thread-specific behaviour; attributes are per inode and shared by all links, descriptors and processes (a forked child setting through an inherited descriptor is seen by the parent)"
ordering: []
timing:
  typical: "microseconds; does not block"
  guarantees: "none"
tests:
  visible: 9
  held_out: 4
