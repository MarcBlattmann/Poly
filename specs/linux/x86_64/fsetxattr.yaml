# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/fsetxattr            # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "Docker container (privileged) on WSL2, x86-64; observed as root with every capability and as uid/gid 65534 without capabilities (tests also drop to uid 1000), umask 022; no LSM active; file systems: tmpfs (/dev/shm and a fresh mount), overlayfs over ext4 (/tmp) and a fresh ext4; the tests pass with /tmp on each"
  observed_by: spec-linux-c
  date: 2026-10-31
summary: >
  fsetxattr(fd, name, value, size, flags) (syscall 190) is setxattr
  (setxattr.yaml) on the file an open descriptor refers to. Flags,
  name rules, size limit, value reading, namespaces, permission rules,
  EROFS, ctime update and EEXIST/ENODATA are the same; the path lookup
  is replaced by the descriptor lookup (EBADF). The descriptor's access
  mode is irrelevant: permission is checked on the file's current mode
  for the caller's current credentials at the time of the call.
returns:
  any_mode: "O_RDONLY, O_WRONLY and O_RDWR descriptors all work, as does a directory opened O_RDONLY|O_DIRECTORY"
  unlinked: "a file unlinked but still open keeps taking (and giving, removing, listing) attributes"
  dup: "a dup'ed descriptor reaches the same file"
  fd_width: "fd is a 32-bit int: bits 32..63 of the register are ignored (fd | 1<<32 is fd)"
  special_files: "pipes (either end), FIFOs opened O_RDWR, Unix sockets and eventfds cannot take user.* names (EPERM); an unknown prefix there is EOPNOTSUPP; a socket's system.sockprotoname is EOPNOTSUPP to set"
errors:
  bad_fd: "EBADF (9): fd -1, never opened, closed, 0x7fffffff, or an O_PATH descriptor (of a file, or of a symbolic link opened O_PATH|O_NOFOLLOW)"
  order: "EINVAL (flags), EFAULT/ERANGE (name), E2BIG (size), EFAULT (value) all come before EBADF; EBADF comes before the namespace (unknown prefix or 'user.' alone with a bad fd: EBADF), then EROFS, EPERM/EACCES, EOPNOTSUPP, EINVAL, EEXIST/ENODATA as setxattr"
  user_kind: "EPERM (1): user.* on a pipe, FIFO, socket or eventfd descriptor (also 'user.' alone and with XATTR_REPLACE)"
  access_at_call: "EACCES (13): user.* needs write permission on the file now: a descriptor opened O_RDWR by its owner while the mode was 0600 gives EACCES after chmod 0400 and works again after chmod 0600; a descriptor of root's 0644 file opened by root and used after switching to uid 1000 gives EACCES; uid 1000 with an O_RDONLY descriptor of a 0666 file succeeds"
  read_only: "EROFS (30): the descriptor's file is on a read-only mount (also when it was opened before the remount)"
  rest: "every other error exactly as setxattr.yaml"
side_effects: "as setxattr: the ctime changes on success"
threading: "as setxattr"
ordering: []
timing:
  typical: "microseconds per call on tmpfs"
  guarantees: "none"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: the EROFS case is in c_setxattr_readonly_mount (setxattr's
# tests). Constants as in setxattr.yaml; socketpair/eventfd2/pipe2 from
# asm/unistd_64.h.
