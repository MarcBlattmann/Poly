id: linux/syscall/x86_64/getsid
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  getsid(pid) returns the session id of pid (0: the caller); a thread id
  gives its process's session; a zombie still answers. A child is in its
  parent's session until it calls setsid; its own children follow it.
returns:
  success: "the session id"
errors:
  no_such_process: "ESRCH (unknown, negative, reaped)"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
