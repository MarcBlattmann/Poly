# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/clock_nanosleep
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  clock_nanosleep(clock, flags, req, rem) sleeps on the given clock:
  relative when flags is 0, until the clock reaches req with TIMER_ABSTIME
  (1); an absolute time already past returns at once. Clocks:
  CLOCK_REALTIME, CLOCK_MONOTONIC, CLOCK_BOOTTIME, CLOCK_TAI,
  CLOCK_PROCESS_CPUTIME_ID (and *_ALARM). Unknown flag bits are ignored. The
  raw system call returns -errno like other calls (the C library turns it
  into a positive result).
returns:
  success: "0"
errors:
  unknown_clock: "EINVAL (100, -1)"
  unsupported_clock: "EOPNOTSUPP for CLOCK_THREAD_CPUTIME_ID and CLOCK_MONOTONIC_RAW"
  bad_time: "EINVAL"
  bad_req: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "never returns before the requested time on the given clock"
tests:
  visible: 2
  held_out: 1
