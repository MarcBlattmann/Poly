# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/dup
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  dup(oldfd) returns the lowest free descriptor number, referring to the
  same open file: the offset and status flags (F_GETFL/F_SETFL) are shared,
  the descriptor flags (FD_CLOEXEC) are not and the new one starts without
  FD_CLOEXEC. Works on any descriptor, including directories and O_PATH
  ones.
returns:
  success: "the lowest free number"
  o_path_source: "the copy is also O_PATH (F_GETFL O_PATH)"
  after_unlink: "the copy keeps reading the unlinked file"
errors:
  bad_oldfd: "EBADF"
  limit: "EMFILE when every number below RLIMIT_NOFILE (soft) is in use"
side_effects: "Writes through a copy of fd 1 go wherever fd 1's file goes (for example the terminal or the captured standard output)."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
