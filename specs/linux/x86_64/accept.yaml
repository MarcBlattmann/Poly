id: linux/syscall/x86_64/accept
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  accept(fd, addr, len) is accept4 with flags 0. A blocking accept waits
  until a client connects; a handled signal without SA_RESTART ends the wait
  with EINTR, with SA_RESTART the call is restarted and completes when the
  client comes. For AF_UNIX the peer of a client that never bound is unnamed
  (len 2), a bound client is reported by its name; the accepted socket's own
  name is the listener's; SO_PEERCRED on both ends names the other process.
returns:
  success: "the new descriptor"
errors:
  interrupted: "EINTR (4) without SA_RESTART"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
