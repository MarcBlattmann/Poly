# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/symlinkat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-21
summary: >
  symlinkat(target, newdirfd, linkpath) creates a symbolic link whose text
  is target, stored byte for byte (relative, absolute, dangling, with
  repeated slashes or dots). The link has mode 0777 regardless of umask,
  nlink 1, size = text length. Relative text is resolved when the link is
  followed, relative to the directory containing the link. Following a link
  to a directory works in the middle of a path; a trailing slash after a
  link name follows it. Chains are followed; loops give ELOOP. O_CREAT
  through a dangling link creates its target (O_EXCL then gives EEXIST). The
  old symlink (88) call is symlinkat with AT_FDCWD.
returns:
  success: "0"
  dirfd: "linkpath is relative to newdirfd; relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  name_exists: "EEXIST (a file or a link)"
  empty_target: "ENOENT"
  target_too_long: "lengths are in characters, not counting the terminating NUL: a target of up to 4095 characters is stored whole (readlink returns all 4095); 4096 characters or more is ENAMETOOLONG. The length of a component of the target does not matter (the text is not resolved; a 300-character component is fine). The old symlink (88) call has the same limit. Observed on /tmp (ext4, 4096-byte blocks)"
  bad_pointer: "EFAULT for target or linkpath"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; lengths in characters, not counting the terminating NUL: a linkpath of up to 4095 characters works and one of 4096 characters or more is ENAMETOOLONG (counted on the string as given, so \"./\" and repeated slashes count); any component of linkpath of 256 characters or more is ENAMETOOLONG (255 works), also a middle component that does not exist (ENAMETOOLONG, not ENOENT); an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
side_effects: "Adds a directory entry."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
