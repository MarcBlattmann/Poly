id: linux/syscall/x86_64/timer_delete
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  timer_delete(id) deletes a timer: an armed timer stops (its signal never
  comes), and a signal of it that is already pending is not delivered
  anymore (taking it finds nothing; rt_sigpending may or may not still show
  it before that). Other timers are unaffected. Every later call with the id
  gives EINVAL.
returns:
  success: "0"
errors:
  unknown_or_deleted_timer: "EINVAL"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
