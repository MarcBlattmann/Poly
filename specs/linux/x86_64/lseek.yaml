# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/lseek
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  lseek(fd, offset, whence) sets the file offset: SEEK_SET (0) to offset,
  SEEK_CUR (1) to current + offset, SEEK_END (2) to size + offset. Positions
  past the end are allowed. SEEK_DATA (3) gives the next offset >= offset
  that holds data, SEEK_HOLE (4) the next hole; a file with no holes has one
  implicit hole at its end. The offset is shared by descriptors from dup;
  separate opens have their own. On a directory, seeking to 0 rewinds
  getdents64.
returns:
  success: "the new offset"
  seek_data_no_holes: "offset itself when offset < size"
  seek_hole_no_holes: "size (and the offset moves there)"
errors:
  negative_result: "EINVAL (SEEK_SET -1, SEEK_CUR or SEEK_END below 0); the offset is unchanged"
  bad_whence: "EINVAL (5, -1, ...)"
  data_or_hole_at_or_past_end: "ENXIO, also for a negative offset and for any offset in an empty file"
  unseekable: "ESPIPE for both ends of a pipe"
  not_open_or_o_path: "EBADF"
side_effects: "Only the offset changes; the file does not grow until written."
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
