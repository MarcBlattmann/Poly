# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/close
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  close(fd) frees the descriptor number. The open file stays alive while
  other descriptors (from dup, dup2, dup3, F_DUPFD, or fork) refer to it; an
  unlinked file's data stays readable through remaining descriptors until
  the last one is closed. The fd argument is an unsigned 32-bit value: the
  upper half of the register is ignored.
returns:
  success: "0; the number becomes the lowest free candidate for the next open/dup"
  shared_open_file: "other descriptors for the same open file keep working and keep the shared offset"
errors:
  not_open: "EBADF (closing twice, never opened, -1, 0x7fffffff, numbers above the limit)"
side_effects: "The number is released immediately; after close, every call using it fails with EBADF until it is reused."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
