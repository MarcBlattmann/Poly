# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/linkat
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  linkat(olddirfd, oldpath, newdirfd, newpath, flags) gives a file a new
  name: same inode, shared contents, st_nlink incremented. A symbolic link
  source is linked itself unless flags has AT_SYMLINK_FOLLOW (0x400), which
  links its target. AT_EMPTY_PATH (0x1000) with an empty oldpath links the
  file olddirfd refers to (allowed for root), including an O_TMPFILE file,
  which gets its first name (nlink 1). The old link (86) call is linkat with
  flags 0.
returns:
  success: "0"
  dirfd: "relative paths start at dirfd (AT_FDCWD = -100 means the working directory); absolute paths ignore dirfd entirely, even an invalid one; a dirfd that is not open: EBADF; a dirfd open on a non-directory with a relative path: ENOTDIR; an O_PATH directory descriptor works as dirfd"
errors:
  target_exists: "EEXIST"
  source_missing: "ENOENT (also a dangling link with AT_SYMLINK_FOLLOW)"
  directory_source: "EPERM (also a link to a directory with AT_SYMLINK_FOLLOW)"
  trailing_slash_on_new_name: "ENOENT"
  trailing_slash_on_file_source: "ENOTDIR"
  empty_path_without_flag: "ENOENT"
  unknown_flag: "EINVAL (e.g. 0x1)"
  path: "missing component or empty path: ENOENT; a non-directory used as a directory (including a trailing slash after a file): ENOTDIR; a component over 255 bytes or a path of 4096 bytes or more with its NUL: ENAMETOOLONG; an unreadable path pointer: EFAULT; too many symbolic links: ELOOP"
  path_order: "when a path has more than one problem, the first in this order decides: (1) the path string as a whole: an unreadable pointer EFAULT, 4096 bytes or more with its NUL ENAMETOOLONG, empty ENOENT (where an empty path is an error), whatever its components are; (2) for a relative path, dirfd: not open EBADF, open on a non-directory ENOTDIR, even when a component is missing or over 255 bytes; (3) the components from left to right as the walk reaches them, symbolic links followed on the way: the first that fails decides, a missing name or a dangling link ENOENT (a later \"..\" does not undo it), a non-directory (or a link to one) followed by more components ENOTDIR, a name over 255 bytes ENAMETOOLONG. So D/nope/<256 bytes>/x, D/nope/<256 bytes> and D/nope/../<256 bytes> are ENOENT, D/file/<256 bytes> is ENOTDIR, D/<256 bytes>/nope/x is ENAMETOOLONG: a name over 255 bytes is reported only when every directory before it exists. Errors about the last name itself (EEXIST and the like) come after all of these. The same on ext4 and tmpfs. Applies to oldpath and newpath each."
  path_order_two_paths: "oldpath is resolved completely first (its string, olddirfd and every component including the last, in the order of path_order), so any error of oldpath wins over every error of newpath, even a newpath of 4096 bytes or more (a missing oldpath with a too-long newpath string is ENOENT; a too-long last name of oldpath with a bad newdirfd is ENAMETOOLONG); then newpath (string, newdirfd, components); then EEXIST"
side_effects: "st_nlink and ctime of the inode change."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
