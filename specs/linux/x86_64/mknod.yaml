# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/mknod                # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "privileged Docker container (poly-dev, Ubuntu 24.04 userland) on WSL2, x86-64 (AMD Ryzen AI MAX+ PRO 395, 32 CPUs); tests run as root with all capabilities and as uid/gid 65534 without capabilities; umask 022; /tmp on overlayfs, /dev/shm tmpfs"
  observed_by: spec-linux-d
  date: 2026-11-01
summary: >
  mknod(pathname, mode, dev) (syscall 133) creates a file system node of
  the type in mode & S_IFMT: S_IFIFO (a named pipe), S_IFREG or type 0
  (an empty regular file), S_IFSOCK (a socket node), S_IFCHR or S_IFBLK
  (a device node, which needs CAP_MKNOD). mode and dev are 32-bit values
  (bits 32..63 ignored). The new node gets permission bits mode & 07777 &
  ~umask (setuid, setgid and sticky bits kept), one link, size 0, owner
  euid and group egid (or the directory's group in a setgid directory),
  and st_rdev = dev for device nodes (0 for every other type, dev
  ignored). The last component must not exist and is not followed (an
  existing name, also a dangling symlink, is EEXIST). S_IFDIR is EPERM
  and S_IFLNK or an unused type EINVAL, both decided before the path is
  even read. Returns 0.
returns:
  success: "0"
  fifo: "S_IFIFO: a FIFO, st_rdev 0 whatever dev; opens like any FIFO (O_RDONLY|O_NONBLOCK then O_WRONLY|O_NONBLOCK both succeed and pass data)"
  regular: "S_IFREG or type 0: an empty regular file (mode 0 gives S_IFREG with no permission bits)"
  socket: "S_IFSOCK: a socket node (st_mode S_IFSOCK|perm); open() of it ENXIO"
  device: "S_IFCHR/S_IFBLK with CAP_MKNOD: device node; dev in the kernel's new encoding: major = (dev >> 8) & 0xfff, minor = (dev & 0xff) | ((dev >> 12) & 0xfff00); stat st_rdev shows the same 32-bit number for majors and minors in range (0x103 -> 1:3, 0xfff00 -> 4095:0, 0xfff000ff -> 0:1048575)"
  whiteout: "S_IFCHR with dev 0 (0:0) is an overlay 'whiteout': allowed without CAP_MKNOD on file systems that support whiteouts (tmpfs: created, mode S_IFCHR, rdev 0, also for uid 65534), EPERM on overlayfs here even for root; file-system dependent, not tested"
  mode: "permission bits mode & 07777 & ~umask; bits 32..63 ignored; umask 0 keeps all bits"
  owner: "st_uid = euid, st_gid = egid; in a setgid directory of the caller's own group S_ISGID given in mode is kept (other setgid-directory cases not tested)"
errors:
  dir_type: "EPERM (1): S_IFDIR in mode; checked first (NULL pathname, missing directory, existing name, over-long path all still EPERM)"
  bad_type: "EINVAL (22): S_IFLNK or a type value that is not a file type (observed: 0030000, 0070000, 0170000); checked first, like S_IFDIR"
  bad_path: "EFAULT (14): pathname NULL or unreadable"
  name_too_long: "ENAMETOOLONG (36): a component over 255 bytes (255 works), or a path of 4096 bytes or more"
  not_found: "ENOENT (2): a directory in the path missing; empty pathname; a trailing slash on a name that does not exist ('new/')"
  not_dir: "ENOTDIR (20): a non-directory used as a directory in the path"
  loop: "ELOOP (40): symlink loop in the directory part"
  exists: "EEXIST (17): the name exists (any type, also '.', '..', a directory, a dangling symlink or a symlink loop as the last component, an existing name with a trailing slash)"
  no_write: "EACCES (13): no write or search permission on the directory (not for root); checked after the lookup (an existing name is EEXIST first) and before the device check"
  no_mknod: "EPERM (1): S_IFCHR/S_IFBLK without CAP_MKNOD (other than a whiteout where supported); checked last (missing directory ENOENT, existing name EEXIST, unwritable directory EACCES come first)"
  other: "EROFS (30), ENOSPC (28), EDQUOT (122), ENOMEM (12): not tested"
  order: "file type (EPERM for S_IFDIR, EINVAL for S_IFLNK/unused) > pathname read (EFAULT, ENAMETOOLONG) > lookup (ENOENT, ENOTDIR, ELOOP, EEXIST) > directory permission (EACCES) > CAP_MKNOD (EPERM)"
side_effects: "A new directory entry and inode; the parent directory's mtime and ctime change. Nothing on error."
threading: "No thread-specific behaviour; not tested with threads."
ordering: []
timing:
  typical: "microseconds per call"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: S_IF* from linux/stat.h; dev encoding as documented for
# makedev/mknod(2) and linux/kdev_t.h (new_encode_dev); errno values from
# asm-generic/errno-base.h; syscall number 133 from asm/unistd_64.h. The
# device test (needs=root) creates nodes in /tmp and drops to uid/gid
# 65534 in a child for the EPERM/EACCES order; no test uses dev 0:0. The
# other tests pass as root and as an unprivileged user.
