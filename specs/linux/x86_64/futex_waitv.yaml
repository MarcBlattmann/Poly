# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/futex_waitv          # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 6.18.54.1-microsoft-standard-WSL2 (WSL2 kernel, x86-64)"
  machine: "privileged Docker container (poly-dev, Ubuntu 24.04 userland) on WSL2, x86-64 (AMD Ryzen AI MAX+ PRO 395, 32 CPUs, one NUMA node); tests run as root with all capabilities and as uid/gid 65534 without capabilities; umask 022"
  observed_by: spec-linux-d
  date: 2026-11-01
summary: >
  futex_waitv(waiters, nr_futexes, flags, timeout, clockid) (syscall 449)
  sleeps on several futexes at once. waiters points to nr_futexes (1..128,
  FUTEX_WAITV_MAX) struct futex_waitv of 24 bytes: u64 val, u64 uaddr,
  u32 flags (per entry: FUTEX2_SIZE_U32 required, FUTEX2_PRIVATE,
  FUTEX2_NUMA, FUTEX2_MPOL allowed), u32 __reserved (must be 0). flags
  (the call's) must be 0. nr_futexes and flags are 32-bit (upper register
  bits ignored). timeout is NULL (no limit; clockid ignored) or an
  absolute struct timespec on CLOCK_MONOTONIC or CLOCK_REALTIME, never
  written. Every entry's word is compared with its val (32 bits); if any
  differs the call returns EAGAIN at once, else the task sleeps on all of
  them until one is woken, and returns the index of the entry that was
  woken. Wakes work as for futex_wait: futex_wake, classic FUTEX_WAKE /
  FUTEX_WAKE_BITSET of the same kind (private or shared) and word wake
  the task (each entry counts as mask all ones); once woken the task is
  removed from every futex. The same address may appear in several
  entries. An entry moved to another futex by futex_requeue keeps its
  index: a wake of the new futex makes the call return that index.
returns:
  woken: "index (0-based) of the entry whose futex was woken; a wake of the wrong kind (private wake for a shared entry) does not count"
  timed_out: "ETIMEDOUT (110) at or after the absolute deadline; at once for a past deadline"
  value_differs: "EAGAIN (11) when any entry's word differs from its val, checked before the deadline"
  signal: "EINTR (4) after a handler without SA_RESTART ran; with SA_RESTART the call is restarted after the handler and sleeps again on all futexes"
  requeued_entry: "futex_requeue (or classic FUTEX_CMP_REQUEUE) can move one entry to another futex while the others stay; waking the new futex returns that entry's index"
  max: "128 entries, also all on the same word, are accepted"
  numa: "an FUTEX2_NUMA entry's futex is followed by a 32-bit node word (8-byte aligned pair); -1 is replaced by the caller's node, a nonexistent node is EINVAL"
errors:
  bad_call: "EINVAL (22): flags != 0, nr_futexes 0 or above 128, waiters NULL"
  bad_clock: "EINVAL (22): timeout given and clockid not CLOCK_MONOTONIC/CLOCK_REALTIME"
  timeout_fault: "EFAULT (14): timeout unreadable"
  timeout_value: "EINVAL (22): negative tv_sec, tv_nsec outside 0..999999999"
  array_fault: "EFAULT (14): the array unreadable (0x1000), with or without timeout"
  bad_entry: "EINVAL (22): an entry with a size other than U32, an unknown flag, __reserved != 0, val above 32 bits, an unaligned uaddr, or a bad NUMA node"
  entry_fault: "EFAULT (14): an entry's uaddr unmapped (NULL, 0x1000)"
  value: "EAGAIN (11)"
  timeout: "ETIMEDOUT (110)"
  order: "call flags / nr / NULL array (EINVAL) > clockid (EINVAL) > timeout (EFAULT, EINVAL) > array read (EFAULT) > every entry's fields (EINVAL; a bad entry anywhere beats a fault in an earlier one) > every entry's address (EFAULT; a fault in a later entry beats a value mismatch in an earlier one) > values (EAGAIN) > deadline (ETIMEDOUT)"
side_effects: "none besides sleeping; the timespec and the array are not written (NUMA node -1 words are filled in)"
threading: "any task that can name one of the futexes may wake the sleeper; once woken it sleeps on none of them"
ordering:
  - "values are compared only after all entries were validated and all addresses resolved"
timing:
  typical: "microseconds when not sleeping; timed sleeps end shortly after the deadline"
  guarantees: "never ETIMEDOUT before the deadline"
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
# Notes: struct futex_waitv and FUTEX_WAITV_MAX from linux/futex.h,
# FUTEX2_* flags likewise; clock ids from linux/time.h. Multi-task tests
# count sleepers with a classic FUTEX_CMP_REQUEUE of a word onto itself
# and use syscalls=off. Every test passes as root and as an unprivileged
# user.
