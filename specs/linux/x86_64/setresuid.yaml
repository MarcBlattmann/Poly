id: linux/syscall/x86_64/setresuid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setresuid(ruid, euid, suid) sets the three uids; -1 (0xffffffff) keeps a
  field; all -1 is a successful no-op. With CAP_SETUID (root) any values;
  without it each field may only take one of the current real, effective or
  saved uids (permutations are fine). The filesystem uid follows the
  effective uid. Capabilities follow the uids: when the effective uid goes
  from 0 to nonzero the effective capabilities are cleared, and restored
  from the permitted set when it becomes 0 again; when real, effective and
  saved are all nonzero the permitted set is cleared too, for good. So with
  the saved uid 0 a process can lower and raise its effective uid; once all
  three are nonzero it cannot get back to 0.
returns:
  success: "0"
errors:
  permission: "EPERM (1) without CAP_SETUID for a value that is none of the current three; nothing changes"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
