# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/dup3
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  dup3(oldfd, newfd, flags) is dup2 with a flags argument whose only valid
  bit is O_CLOEXEC (02000000), which sets FD_CLOEXEC on newfd; without it,
  newfd ends without FD_CLOEXEC even if the replaced descriptor had it.
  Unlike dup2, oldfd == newfd is EINVAL.
returns:
  success: "newfd"
errors:
  same_fd: "EINVAL (even when that number is closed, and with O_CLOEXEC)"
  other_flag_bits: "EINVAL (O_NONBLOCK, 1, ...); newfd untouched"
  bad_oldfd: "EBADF"
  newfd_out_of_range: "EBADF for negative or >= RLIMIT_NOFILE soft limit"
side_effects: "Closes the file previously open on newfd. Lowering RLIMIT_NOFILE does not close descriptors already above the new limit; they stay usable as oldfd."
threading: "no thread-specific behaviour; the descriptor table, offsets and file system state are shared by the threads of a process"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
