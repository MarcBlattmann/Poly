# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/timer_getoverrun
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-21
summary: >
  timer_getoverrun(id) returns how many extra expiries happened between the
  timer's signal being queued and being delivered (taken): while a periodic
  timer's signal stays pending, later expiries are not queued again but
  counted. It is fixed when the signal is taken and equals the siginfo's
  si_overrun. 0 for a timer that never fired, for SIGEV_NONE timers, and
  when each signal is taken in time. The details are under behaviour.
behaviour:
  count: >
    At most one signal per timer is queued (timer_getoverrun(2)). The
    expiries of a timer armed at time A with value V and interval I are at
    A + V, A + V + I, A + V + 2I, ...: when they were due, not when the
    process ran or when a timer interrupt got round to them. When the
    signal is taken at time T (rt_sigtimedwait, sigwaitinfo, or delivery to
    a handler), the count becomes the number of expiries due from the one
    that queued the signal up to T, less that one: every expiry due at or
    before T on the timer's clock counts, also one whose due time passed
    only just before the signal was taken. A and T are the timer's clock
    (CLOCK_MONOTONIC in the tests) as clock_gettime reads it.
    Armed with V = I = 10 ms and taken 205 ms later, that is 19, or 20 or 21
    if the process gets the CPU later: the tests measure the time around
    arming and around taking and accept exactly the counts those times
    allow, never a fixed number.
  until_taken: >
    Until the signal is taken, timer_getoverrun returns the count fixed when
    the previous signal of the timer was taken (0 if none was). The count
    then stays the same while the timer's next signal is pending, until
    that one is taken. After a signal is taken a periodic timer goes on
    from where it was; its next signal is queued at its first expiry after
    T, and the count taken with that signal counts the expiries after T
    in the same way.
  reset: "Arming, re-arming or disarming the timer with timer_settime sets the count to 0."
  cap: >
    The count stops at DELAYTIMER_MAX, which is INT_MAX (2147483647) on
    Linux (limits.h); timer_getoverrun(2), BUGS: since Linux 4.19, the call
    returns DELAYTIMER_MAX when the count would be higher. si_overrun holds
    the same value. An interval of 1 ns is honoured (the clocks' resolution
    is 1 ns, see clock_getres): a 1 ns periodic timer whose signal stays
    pending for 2.5 s reaches the cap. The expiries while the signal is
    pending have no other effect: on the oracle such a timer uses no
    noticeable CPU time, and the 2.5 s pass as for any sleep.
returns:
  success: "the overrun count"
errors:
  unknown_or_deleted_timer: "EINVAL"
side_effects: "none"
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none for the call; the count follows the timer's due times, see behaviour"
tests:
  visible: 3
  held_out: 1
