# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/getcwd
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  getcwd(buf, size) stores the absolute, canonical path of the working
  directory (no "." or ".." components, no symbolic links, no repeated or
  trailing slashes; "/" for the root) with its NUL and returns the length
  including the NUL. The path follows renames of the directory and its
  parents. Paths longer than 1000 bytes are returned whole.
returns:
  success: "strlen(path) + 1 (2 for \"/\")"
errors:
  buffer_too_small: "ERANGE (size 0, 1, or one byte short)"
  working_directory_removed: "ENOENT"
  bad_buffer: "EFAULT"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
