# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/madvise
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  madvise(addr, length, advice) gives the kernel advice about a range; addr
  must be page aligned and length is rounded up to whole pages; length 0 is
  a successful no-op. MADV_NORMAL (0), RANDOM (1), SEQUENTIAL (2), WILLNEED
  (3), DONTFORK (10), DOFORK (11), HUGEPAGE (14), NOHUGEPAGE (15), DONTDUMP
  (16), DODUMP (17), COLD (20) succeed and change no data. MADV_DONTNEED (4)
  discards pages: private anonymous memory then reads as zero, a private
  file mapping reads the file's contents again, shared anonymous memory
  keeps its data. MADV_FREE (8) on private anonymous memory succeeds
  (contents may or may not be kept). MADV_WIPEONFORK (18) makes a forked
  child see zeros in the range (the parent keeps its data); MADV_KEEPONFORK
  (19) undoes it.
returns:
  success: "0"
errors:
  unaligned_addr: "EINVAL"
  unknown_advice: "EINVAL (9999, -1)"
  range_with_unmapped_pages: "ENOMEM; the advice is still applied to the mapped parts (MADV_DONTNEED zeroes them)"
  wipeonfork_on_shared_mapping: "EINVAL"
side_effects: "MADV_DONTNEED and MADV_WIPEONFORK change what later reads see, as described."
threading: "the address space is shared by all threads of a process; changes are visible to every thread at once"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
