# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/rt_sigqueueinfo
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  rt_sigqueueinfo(tgid, sig, info) sends sig with the caller's siginfo
  (rt_tgsigqueueinfo(tgid, tid, sig, info) to one thread). si_signo is
  replaced by the sig argument; si_errno, si_code (negative codes such as
  SI_QUEUE -1 or -42), pid, uid, value and the other bytes of the first 48
  bytes of the siginfo arrive as given, through a handler or
  rt_sigtimedwait; bytes 48 to 127 must be zero. Real-time signals queue one
  entry per call, each with its own value, delivered in the order sent; a
  standard signal already pending is not queued again (the first siginfo is
  kept). To another process only a negative si_code other than SI_TKILL is
  allowed (even for root); to itself any si_code is accepted. Signal 0 only
  checks the target.
returns:
  success: "0"
errors:
  bad_signal: "EINVAL (22) for a signal above 64"
  no_process: "ESRCH (3) when tgid (or tid for rt_tgsigqueueinfo) does not exist"
  bad_pointer: "EFAULT (14) for an unreadable info"
  nonzero_tail: "E2BIG (7) when any of bytes 48..127 of info is nonzero; nothing is sent"
  code_to_other_process: "EPERM (1) for si_code >= 0 or SI_TKILL (-6) sent to another process"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering:
  - "queued real-time signals are delivered first-in first-out"
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
