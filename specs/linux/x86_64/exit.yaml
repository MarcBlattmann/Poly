# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/exit
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  exit(code) (60) ends the calling thread. In a single-threaded process this
  ends the process, and the parent sees code & 0xff (256 -> 0, -1 -> 255,
  0x1234 -> 0x34) as the exit status. In a multi-threaded process only the
  caller ends; the process ends when its last thread exits, and wait4 then
  reports the last thread's code. The thread's clear_child_tid word is set
  to 0 (if memory is still shared). Descriptors are closed when the process
  ends (a pipe's reader then sees end of file).
returns:
  never: "does not return"
errors:
  none: "cannot fail"
side_effects: "SIGCHLD (or the clone exit signal) to the parent when the process ends."
threading: "no thread-specific behaviour unless stated"
ordering: []
timing:
  typical: "microseconds; does not block unless stated"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
