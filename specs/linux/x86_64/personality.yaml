# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/personality          # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Linux 7.0.0-30-generic (Ubuntu 24.04 HWE kernel, x86-64)"
  machine: "home server, x86-64; tests run as a normal user (uid 1001, no capabilities), umask 022, under the pipeline's ptrace tracer (which starts them with persona 0x0040000) and directly (persona 0)"
  observed_by: spec-claude-1
  date: 2026-10-22
summary: >
  personality(persona) (syscall 135) reads and sets the calling thread's
  execution domain ("persona"), a 32-bit value: the low byte is the
  execution domain (PER_LINUX 0, PER_BSD 6, PER_LINUX32 8, ...; any of
  the 256 values is accepted), the upper three bytes are flags (UNAME26
  0x0020000, ADDR_NO_RANDOMIZE 0x0040000, FDPIC_FUNCPTRS 0x0080000,
  MMAP_PAGE_ZERO 0x0100000, ADDR_COMPAT_LAYOUT 0x0200000,
  READ_IMPLIES_EXEC 0x0400000, ADDR_LIMIT_32BIT 0x0800000, SHORT_INODE
  0x1000000, WHOLE_SECONDS 0x2000000, STICKY_TIMEOUTS 0x4000000,
  ADDR_LIMIT_3GB 0x8000000; unnamed bits are stored too). Only the low
  32 bits of the argument count. If they are 0xffffffff the call only
  returns the current persona; otherwise the persona becomes exactly
  those 32 bits. Either way the result is the persona as it was before
  the call, as an unsigned 32-bit number (zero-extended in rax: a
  persona with bit 31 set is a large positive result, never an error).
  On x86-64 the call never fails. The persona is per thread, inherited
  by threads and processes made by clone/fork, kept over execve except
  READ_IMPLIES_EXEC, and changes the results of some other calls
  (uname, select/pselect6/ppoll, executability of readable memory, the
  layout of later execve'd programs).
returns:
  query: "argument with low 32 bits 0xffffffff (0xffffffff, ~0, 0x1ffffffff): the current persona; nothing changes"
  set: "any other argument: the previous persona; the persona becomes the argument's low 32 bits (0x100000006 sets 6, 0xffffffff00000000 sets 0, 0x5a00000000000000 sets 0)"
  any_value: "every low 32-bit value except 0xffffffff is accepted and read back unchanged: all 256 low-byte domains, each of the 32 single bits, 0x80000000, 0xfffffffe, 0x7fffffff, 0xabcdef12"
  width: "result is zero-extended: after setting 0x80000000 a query returns 2147483648 (0x0000000080000000), after 0xfffffffe it returns 4294967294"
  same_value: "setting the current value again returns that value"
  initial: "a new process has its parent's persona. A shell-started program normally has 0; the pipeline's reference runner starts every test with 0x0040000 (ADDR_NO_RANDOMIZE). Tests accept either: they check the initial persona is 0 apart from ADDR_NO_RANDOMIZE and otherwise use values relative to it"
errors:
  none: "no error was seen for any argument (fuzzed: 256 low bytes, 32 single bits, 200000 pseudo-random 64-bit values). The man page's EINVAL (\"unable to change the personality\") does not occur on x86-64"
side_effects: >
  The persona changes the observable results of other calls of the same
  thread:
  uname (63): while the low byte is exactly 8 (PER_LINUX32), machine is
  "i686" instead of "x86_64", whatever the flag bits (0x8, 0x108,
  0x10008, 0x800008, 0x8000008 all give i686; low bytes 0x18, 0x88, 7,
  9 give x86_64); the other fields are unchanged. While UNAME26 is set,
  release has its leading "major.minor.patch" replaced by "2.6.N" (N a
  decimal number >= 40; 60 on this 7.0 kernel: "7.0.0-30-generic"
  becomes "2.6.60-30-generic"); the rest of the string after the
  version is kept and the other fields are unchanged; both effects
  combine (0x20008: "2.6.60-30-generic", "i686"). Clearing the bits
  restores the real values at once.
  select (23), pselect6 (270), ppoll (271): while STICKY_TIMEOUTS is set
  (alone or as part of a domain value such as PER_SVR4 0x04100001) they
  do not write the remaining time back into the caller's timeout
  (a 20 ms timeout that expires stays {0, 20000} us / {0, 20000000} ns;
  without the flag it becomes 0).
  READ_IMPLIES_EXEC: while set, memory made readable by mmap (anonymous
  read-write, or a PROT_READ file mapping) or by mprotect(PROT_READ) is
  also executable (shown as r-xp / rwxp in /proc/self/maps; jumping into
  it runs the code); without it, executing PROT_READ or
  PROT_READ|PROT_WRITE memory kills the process with SIGSEGV. Other flags
  (all bits but READ_IMPLIES_EXEC) do not make such memory executable.
  ADDR_NO_RANDOMIZE: programs started by execve while it is set get the
  same layout every run (same initial stack pointer, AT_RANDOM address
  and initial brk for the same program, arguments and environment); it
  does not move anything in the calling image.
  execve: the new image keeps the persona, except that READ_IMPLIES_EXEC
  is cleared (0x400000 -> 0, 0x410008 -> 0x10008, 0xfffffffe ->
  0xffbffffe) when an ordinary static 64-bit ELF (PT_GNU_STACK RW) is
  started; every other bit and domain survives (PER_LINUX32, UNAME26,
  ADDR_NO_RANDOMIZE, MMAP_PAGE_ZERO, ADDR_COMPAT_LAYOUT,
  ADDR_LIMIT_32BIT, STICKY_TIMEOUTS, ADDR_LIMIT_3GB, bit 31, odd low
  bytes like 0x42).
  No observed effect for a 64-bit process (not tested): ADDR_LIMIT_32BIT
  and ADDR_LIMIT_3GB do not move mmap results below 4 GiB; MMAP_PAGE_ZERO
  set before execve gave no mapping at address 0 for a non-root caller;
  SHORT_INODE, WHOLE_SECONDS, FDPIC_FUNCPTRS, domain values other than 8.
  /proc/self/personality (and /proc/<pid>/personality of an own child):
  a regular file of mode 0400 whose content is the persona as exactly 8
  lower-case hex digits and a newline ("00000008\n", "04100001\n",
  "fffffffe\n", "abcdef12\n"); it reflects a change immediately. For a
  process the caller may not ptrace (e.g. pid 1 as a normal user) open
  fails with EACCES (not tested).
threading: >
  The persona belongs to each thread. A thread made with CLONE_THREAD
  starts with its creator's persona; afterwards a change by either
  thread is not seen by the other (thread sets 6 while main has 8: main
  still reads 8; main then sets 0x40000: the thread still reads 6).
  A forked
  child starts with the parent's value at fork time; later changes on
  either side do not reach the other.
ordering: []
timing:
  typical: "well under a microsecond per call; no blocking"
  guarantees: "none"
tests:
  visible: 8  # count in <symbol>.tests/
  held_out: 4  # count kept by the diff runner
# Notes: constants from linux/personality.h (UAPI). The tests also use
# uname (63), select (23), pselect6 (270), ppoll (271), mmap/mprotect,
# fork/clone/execve/wait4, pipe2, dup2, brk and /proc/<pid>/personality
# to observe the effects. The syscall trace includes the first call's
# return value, which on the reference is the runner's initial persona
# 0x0040000: for the traces to match, a test program on Poly must start
# with the same persona as on the reference runner (Poly does not
# randomise layouts, so ADDR_NO_RANDOMIZE describes it truthfully).
# Tests with more than one task compare output only (syscalls=off).
