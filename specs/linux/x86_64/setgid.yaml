id: linux/syscall/x86_64/setgid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  setgid(gid): with CAP_SETGID it sets real, effective and saved gid (it can
  be repeated while the uids are 0, e.g. back to 0); without it only the
  effective gid, to the real or saved gid. setregid follows setreuid's rules
  (the saved gid follows a new effective gid when the real gid is set or the
  effective gid differs from the real one). New files get the effective
  (filesystem) gid as their group.
returns:
  success: "0"
errors:
  minus_one: "EINVAL (22) for gid 0xffffffff"
  permission: "EPERM (1) without CAP_SETGID for another gid"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
