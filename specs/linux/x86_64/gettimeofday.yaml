# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/gettimeofday
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  gettimeofday(tv, tz) stores CLOCK_REALTIME as {tv_sec, tv_usec} (usec in
  [0, 1e6)), between clock_gettime readings taken before and after, after
  2020; tz, if given, gets {minuteswest, dsttime} = {0, 0}. Either pointer
  may be NULL. Readings never go backwards while nobody sets the clock, and
  advance by the time slept. Threads see the same clock.
returns:
  success: "0"
errors:
  bad_pointer: "EFAULT for tv or tz"
side_effects: "none"
threading: "no thread-specific behaviour; the descriptor table and file system state are shared by threads of a process"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
