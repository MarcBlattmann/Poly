# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/timer_create
oracle:
  os: "Linux 6.18.44 x86_64"
  machine: "Firecracker VM, uid 0, /tmp on ext4; static freestanding test programs, raw syscalls"
  observed_by: spec-a
  date: 2026-10-20
summary: >
  timer_create(clock, sevp, timerid) creates a disarmed POSIX timer and
  stores its id (int). Ids start at 0 in a new process and are handed out in
  increasing order; a deleted id is not given out again at once. Clocks:
  CLOCK_REALTIME, MONOTONIC, BOOTTIME, PROCESS_CPUTIME_ID, THREAD_CPUTIME_ID
  (and TAI, *_ALARM). struct sigevent (64 bytes): sigev_value (8),
  sigev_signo, sigev_notify, then the thread id for SIGEV_THREAD_ID (4).
  SIGEV_NONE (1): no notification; SIGEV_SIGNAL (0): at expiry the signal is
  queued with si_code SI_TIMER (-2), the timer id, the overrun count and
  sigev_value in the siginfo (si_timerid, si_overrun, si_value at offsets
  16, 20, 24). SIGEV_THREAD_ID (4) | SIGEV_SIGNAL targets a thread of the
  caller. A NULL sevp means SIGEV_SIGNAL with SIGALRM and the timer id as
  value.
returns:
  success: "0"
errors:
  unknown_clock: "EINVAL"
  monotonic_raw: "EOPNOTSUPP"
  unknown_notify: "EINVAL"
  bad_signal: "EINVAL (0, 65)"
  thread_not_in_caller: "EINVAL"
  bad_pointers: "EFAULT"
side_effects: "Timers belong to the process; they are deleted by execve and exit."
threading: "signals a timer raises are delivered like any other; the tests keep them blocked and take them with rt_sigtimedwait"
ordering: []
timing:
  typical: "microseconds; no blocking on regular files"
  guarantees: "none"
tests:
  visible: 2
  held_out: 1
