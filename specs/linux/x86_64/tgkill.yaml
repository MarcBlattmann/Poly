# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/tgkill
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  tgkill(tgid, tid, sig) sends a signal to one thread, which must belong to
  thread group tgid; tkill(tid, sig) does the same without the group check.
  The handler runs on that thread; if the thread blocks the signal it is
  pending for that thread only (rt_sigpending of other threads does not show
  it) and is handled when that thread unblocks it. Signal 0 only checks the
  thread exists. The receiver's siginfo has si_code SI_TKILL (-6) and the
  sender's pid. The main thread's tid equals the pid. Threads share signal
  actions (CLONE_SIGHAND).
returns:
  success: "0"
errors:
  bad_ids: "EINVAL (22) for tgid or tid of 0 or below"
  bad_signal: "EINVAL (22) for a signal above 64 or negative"
  no_thread: "ESRCH (3) for a tid that does not exist, or one not in tgid (also with signal 0)"
side_effects: "none"
threading: "thread-directed: only the named thread can take the signal"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
