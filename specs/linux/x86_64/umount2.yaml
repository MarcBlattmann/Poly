id: linux/syscall/x86_64/umount2
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  umount2(target, flags) unmounts the top mount at target. A mount in use
  (an open file in it, a current directory inside, a mount below it) is
  EBUSY and stays mounted; MNT_DETACH (2) detaches it anyway (the path at
  once shows what is below, open files keep working, mounts below go with
  it). The mount below a stacked one becomes visible again. With
  UMOUNT_NOFOLLOW (8) a symlink to a mount point is not followed (EINVAL).
  Needs CAP_SYS_ADMIN.
returns:
  success: "0"
errors:
  busy: "EBUSY (16)"
  not_mounted: "EINVAL (22) for a path that is not a mount point"
  missing: "ENOENT (2)"
  bad_flags: "EINVAL (22) for unknown flags or MNT_EXPIRE with MNT_DETACH"
  bad_pointer: "EFAULT (14)"
  permission: "EPERM (1) without CAP_SYS_ADMIN"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "microseconds; no measurable cost beyond a syscall"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
