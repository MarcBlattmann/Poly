id: linux/syscall/x86_64/getresuid
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  getresuid(ruid, euid, suid) writes the real, effective and saved uid (in
  that order, 4 bytes each); getresgid the same for gids. getuid, geteuid,
  getgid and getegid return single values (no errors). Credentials are per
  process, inherited by fork; a child's changes do not reach the parent.
returns:
  success: "0"
errors:
  bad_pointer: "EFAULT (14) for any unwritable pointer"
