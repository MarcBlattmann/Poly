# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: linux/syscall/x86_64/select
oracle:
  os: "Linux 6.18.44 (x86-64)"
  machine: "cloud VM (KVM), x86-64; tests run as root in the initial user namespace, no seccomp"
  observed_by: spec-b
  date: 2026-10-20
summary: >
  select(nfds, readfds, writefds, exceptfds, timeout) looks at descriptors
  0..nfds-1 whose bits are set, rewrites each set to the ready ones and
  returns the total number of set bits (a descriptor ready in two sets
  counts twice; a pipe write end is never readable). End of file counts as
  readable; a write end whose readers are gone counts as writable. Pipes
  report no exceptions. Bits at or above nfds are ignored and come back
  cleared. NULL sets are allowed; with no sets it is a sleep. The timeval is
  written back with the time left (zero after a timeout); tv_usec of a
  million or more is accepted (normalised); NULL waits forever. A handled
  signal ends the wait with EINTR.
returns:
  success: "the number of set bits in the rewritten sets (0 on timeout, sets cleared)"
errors:
  closed_fd: "EBADF (9) for a set bit of a descriptor that is not open"
  negative_nfds: "EINVAL (22)"
  bad_timeout: "EINVAL (22) for a negative tv_usec or tv_sec"
  bad_set: "EFAULT (14) for an unreadable set"
  interrupted: "EINTR (4)"
side_effects: "none"
threading: "no thread-specific behaviour observed"
ordering: []
timing:
  typical: "a timeout of T returns after T plus scheduling delay"
  guarantees: "none"
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
