# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/linux/apps/echo.yaml. An app test entry: the program, not an API
# symbol, so it has no coverage-map entry.
id: linux/api/apps/echo
oracle:
  os: "Linux 6.18.44-fc-v140"
  machine: "x86-64 VM, 4 CPUs, Ubuntu 24.04: GNU coreutils 9.4, grep 3.11, sed 4.9, glibc 2.39, libselinux 3.5; test tree on tmpfs, program chrooted into it"
  observed_by: spec-c
  date: 2026-10-20
summary: >
  echo(1) writes its operands separated by single spaces, then a newline, to
  stdout, in one write.
environment: >
  Each case is an app test (docs/AGENT_PIPELINE.md, "App tests"): the
  host's unchanged, dynamically linked program runs as /bin/echo in a
  file tree that is the same on Linux and on Poly (Poly gets it as its
  initramfs): the program interpreter /lib64/ld-linux-x86-64.so.2 and the
  shared libraries the program needs at their host paths
  (/lib/x86_64-linux-gnu), no /etc/ld.so.cache, /etc/passwd and /etc/group
  with only root (uid 0, gid 0), the case's files under /work, everything
  owned by root, files 0644 and directories 0755 unless the case says
  otherwise, every timestamp 2023-11-14 22:13:20 UTC. The program runs as
  root with umask 022 in /work, with stdin from a regular file (the
  case's stdin, else empty) and stdout and stderr redirected into regular
  files, and the environment PATH=/bin, HOME=/work, LANG=C, TZ=UTC,
  GLIBC_TUNABLES=glibc.cpu.hwcaps=-SSE4_2 (no zoneinfo file exists, so
  times are UTC). /dev and /proc are the system's own; /sys is empty on
  the reference, and /proc/filesystems lists no selinuxfs (Poly is a Linux
  without SELinux). A case with several steps runs each step as a child
  that is waited for, and the last step in place; its exit status is the
  case's.
comparison: >
  Exit status, stdout and stderr byte for byte; the system calls in app
  mode (per process: names and result classes, `ok`, `-1 ERRNO` or the
  descriptor for calls that return one, consecutive repeats collapsed,
  rseq and SIGCHLD left out). Run with `cargo xtask pipeline diff --target
  poly --tests-dir specs/linux/apps/echo.tests`.
returns:
  operands: "each operand as given (inner spaces kept), one space between operands, newline at the end"
  no_operands: "a single newline"
  dash_dash: "-- is printed as an operand (\"-- x\")"
  n: "-n leaves out the trailing newline"
  e: "-e interprets \\\\t, \\\\n and \\\\\\\\ escapes; -E (the default) prints backslashes as they are"
errors:
  none: "echo exits 0 in every case"
system_calls:                                 # observed on the reference, in order
  - >
    C library start-up, the same for every program: brk, mmap,
    access(/etc/ld.so.preload) ENOENT, openat(/etc/ld.so.cache) ENOENT, then
    for each library openat (the descriptor, 3), read of the ELF header,
    pread64, fstat, mmap of its segments, close; arch_prctl(ARCH_SET_FS),
    set_tid_address, set_robust_list, rseq (left out of the comparison),
    mprotect of the RELRO ranges, prlimit64(RLIMIT_STACK) 0, and getrandom(8
    bytes, GRND_NONBLOCK) 8 before the first allocation from the heap.
  - >
    Then fstat(1) (a regular file, so the output is fully buffered), one
    write(1, text, length) = length, close(1), close(2), exit_group(0).
side_effects: "none"
threading: single-threaded; one process per step
ordering: []
timing:                                       # envelopes, never exact values
  typical: "a few ms per case on the host; about a second per case on Poly under QEMU (TCG)"
  guarantees: none
tests:
  visible: 5                                  # count in echo.tests/
  held_out: 2                                 # count kept by the diff runner
