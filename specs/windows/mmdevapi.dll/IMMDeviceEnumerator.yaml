# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/mmdevapi.dll/IMMDeviceEnumerator.yaml
id: windows/api/mmdevapi.dll/IMMDeviceEnumerator
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer) with one real sound card, tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; the audio service runs and winmm reaches the card from there), only silence is played; the audio service runs and Core Audio reaches the card from there; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-wasapi
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, which has one real sound card (played with buffers of silence only), and of Chrome for Testing 157.0.8103.38 playing a Web Audio page on it through a logging COM wrapper (docs/windows/wasapi-trace.md, specs/windows/apps/chrome/traces/s6-audio.trace.json). Microsoft Learn: "Core Audio APIs", "IMMDeviceEnumerator", "IMMDeviceCollection", "IMMDevice", "IMMNotificationClient", "IAudioClient", "IAudioClient2", "IAudioClient3", "IAudioRenderClient", "IAudioClock", "IAudioSessionControl", "IAudioSessionEvents", "WAVEFORMATEXTENSIBLE", "Rendering a Stream", "Audio Client Return Codes"; constants and layouts from mmdeviceapi.h, audioclient.h, audiopolicy.h, audiosessiontypes.h, mmreg.h, ksmedia.h, winerror.h. No Wine, ReactOS or Chromium source was read and no Microsoft or Google binary was disassembled or debugged.
summary: >
  Lists and finds the audio endpoints: EnumAudioEndpoints, GetDefaultAudioEndpoint, GetDevice and the notification registration (see IMMNotificationClient).
interface:
  signature: "interface IMMDeviceEnumerator : IUnknown (slots: 3 EnumAudioEndpoints, 4 GetDefaultAudioEndpoint, 5 GetDevice, 6 RegisterEndpointNotificationCallback, 7 UnregisterEndpointNotificationCallback)"
chrome: "Chrome for Windows' audio service makes these calls (the COM-level oracle trace): it creates the enumerator, opens a client on the default render device in shared mode with an event callback, and renders silence-or-tone in a loop of one 480-frame write per event."
rules:
  enum_audio_endpoints: "EnumAudioEndpoints(eRender, DEVICE_STATE_ACTIVE) returns a collection with one endpoint (the sound card). The data flow is eRender 0, eCapture 1, eAll 2: eAll with the active mask also succeeds and contains at least the render endpoint; the state mask must be a non-empty subset of DEVICE_STATEMASK_ALL (0xF): mask 0 and 0x10 are E_INVALIDARG; flow 3 is E_INVALIDARG; a NULL output pointer is E_POINTER; on an error no collection is returned. (The count of non-active endpoints, and of capture endpoints, depends on the machine.)"
  get_default_audio_endpoint: "for eRender and each of eConsole 0, eMultimedia 1 and eCommunications 2 it returns the sound card, S_OK, state DEVICE_STATE_ACTIVE (1), the same id for all three roles; the flow eAll, a flow of 3 and a role of 3 are E_INVALIDARG; a NULL output is E_POINTER; no device is returned on an error"
  get_device: "GetDevice(id string of GetId) returns S_OK and a device with the same id and state active (a different object than the first, whose id compares equal); a made-up id (\"xy\") and an empty string are E_INVALIDARG; a well-formed id of an endpoint that does not exist fails (the code is not specified); a NULL id or output is E_POINTER; no device is returned on an error"
  chrome_pattern: "Chrome calls, in this order, once at start-up and again for every stream it queries: EnumAudioEndpoints(eRender, ACTIVE) then GetCount; GetDefaultAudioEndpoint(eRender, eConsole) (and eCommunications), GetState, GetId, then GetDevice(that id) on the result, then Activate(IAudioClient)"
errors:
  invalid_argument: "E_INVALIDARG (0x80070057)"
  null_pointer: "E_POINTER (0x80004003)"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "0.1 to 2 ms per call"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, importing ole32.dll and kernel32.dll by name and calling the COM interfaces through their vtables (slot numbers from the interface headers). Every test but the two that exercise COM before it is initialised needs a sound device and COM initialised; audio data is silence only (the SILENT buffer flag, or zero bytes). Observations are result codes, counts, sizes in frames, flags and relations ("the position equals the bytes written", "about fifty events in 500 ms"), never pointers, handles, thread ids or times. The values that belong to the oracle's device are the mix format (48000 Hz, two channels, 32-bit float), the engine period (480 frames = 10 ms) and what follows from them; a device with another mix format would give other numbers by the same formulas. Waits are bounded (a second or less per condition).
not_covered: >
  Exclusive mode (the oracle's endpoint refuses it with AUDCLNT_E_UNSUPPORTED_FORMAT); capture endpoints and the capture client; other devices than the default render endpoint; a sandboxed audio process; device removal while a stream runs; ISimpleAudioVolume, IAudioStreamVolume and IAudioEndpointVolume; IAudioClient2's offload methods; ActivateAudioInterfaceAsync (mmdevapi ordinal 17, which chrome.dll delay-loads; Chrome activated through IMMDevice::Activate in every run).
