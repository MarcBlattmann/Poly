# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/mmdevapi.dll/IAudioClient.Stream.yaml
id: windows/api/mmdevapi.dll/IAudioClient.Stream
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer) with one real sound card, tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; the audio service runs and winmm reaches the card from there), only silence is played; the audio service runs and Core Audio reaches the card from there; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-wasapi
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, which has one real sound card (played with buffers of silence only), and of Chrome for Testing 157.0.8103.38 playing a Web Audio page on it through a logging COM wrapper (docs/windows/wasapi-trace.md, specs/windows/apps/chrome/traces/s6-audio.trace.json). Microsoft Learn: "Core Audio APIs", "IMMDeviceEnumerator", "IMMDeviceCollection", "IMMDevice", "IMMNotificationClient", "IAudioClient", "IAudioClient2", "IAudioClient3", "IAudioRenderClient", "IAudioClock", "IAudioSessionControl", "IAudioSessionEvents", "WAVEFORMATEXTENSIBLE", "Rendering a Stream", "Audio Client Return Codes"; constants and layouts from mmdeviceapi.h, audioclient.h, audiopolicy.h, audiosessiontypes.h, mmreg.h, ksmedia.h, winerror.h. No Wine, ReactOS or Chromium source was read and no Microsoft or Google binary was disassembled or debugged.
summary: >
  The life cycle of an initialised client: GetBufferSize, GetStreamLatency, GetCurrentPadding, SetEventHandle, GetService, Start, Stop, Reset, and what an uninitialised client says.
interface:
  signature: "IAudioClient slots: 4 GetBufferSize, 5 GetStreamLatency, 6 GetCurrentPadding, 10 Start, 11 Stop, 12 Reset, 13 SetEventHandle, 14 GetService(REFIID, void**)"
chrome: "Chrome for Windows' audio service makes these calls (the COM-level oracle trace): it creates the enumerator, opens a client on the default render device in shared mode with an event callback, and renders silence-or-tone in a loop of one 480-frame write per event."
rules:
  uninitialised: "before Initialize GetBufferSize, GetStreamLatency, GetCurrentPadding, Start, Stop, Reset, SetEventHandle and GetService for IAudioRenderClient, IAudioClock and IAudioSessionControl are AUDCLNT_E_NOT_INITIALIZED (0x88890001), outputs untouched; GetService for a made-up interface is E_NOINTERFACE; GetMixFormat, GetDevicePeriod and IsFormatSupported work"
  services: "on an initialised render client GetService gives IAudioRenderClient, IAudioClock, IAudioSessionControl and ISimpleAudioVolume (S_OK, the same object on every call); IAudioCaptureClient is AUDCLNT_E_WRONG_ENDPOINT_TYPE (0x88890003); a made-up interface is E_NOINTERFACE; NULL output is E_POINTER"
  start_stop_reset: "Start is S_OK; Start while running is AUDCLNT_E_NOT_STOPPED (0x88890005); Reset while running is AUDCLNT_E_NOT_STOPPED; Stop is S_OK, Stop when not running (also before the first Start) is S_FALSE; Reset when stopped is S_OK, also twice, and empties the buffer (padding 0); the stream can be started again after Stop and after Reset (after a Reset the application writes the buffer again first)"
  clients: "two clients on one device have their own buffers, events, clocks and sessions: writing to one leaves the other's padding alone; both run and get events; stopping one does not stop the other; a running client can be released"
  event_handle_scope: "see IAudioClient.Events for the event rules"
errors:
  not_initialized: "AUDCLNT_E_NOT_INITIALIZED (0x88890001)"
  not_stopped: "AUDCLNT_E_NOT_STOPPED (0x88890005)"
  wrong_endpoint_type: "AUDCLNT_E_WRONG_ENDPOINT_TYPE (0x88890003)"
  no_interface: "E_NOINTERFACE (0x80004002)"
observed_once:
  device_invalidated: "(observed once, not a test) after the Windows Audio service was stopped and started again under a running stream the old client's calls returned AUDCLNT_E_DEVICE_INVALIDATED (0x88890004) for GetCurrentPadding, GetBufferSize, GetBuffer, GetStreamLatency, the clock's GetPosition, Start, GetService, SetEventHandle, Initialize, GetMixFormat and GetDevicePeriod; Stop was S_FALSE and Reset S_OK; while the service was down GetStreamLatency gave AUDCLNT_E_SERVICE_NOT_RUNNING (0x88890010) and the session's GetState gave 0x800706B5; the session events client got OnSessionDisconnected(server shutdown); the IMMDevice object still worked and activated a new client"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "Start 8 to 10 ms, Stop under 2 ms, the rest well under a millisecond"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, importing ole32.dll and kernel32.dll by name and calling the COM interfaces through their vtables (slot numbers from the interface headers). Every test but the two that exercise COM before it is initialised needs a sound device and COM initialised; audio data is silence only (the SILENT buffer flag, or zero bytes). Observations are result codes, counts, sizes in frames, flags and relations ("the position equals the bytes written", "about fifty events in 500 ms"), never pointers, handles, thread ids or times. The values that belong to the oracle's device are the mix format (48000 Hz, two channels, 32-bit float), the engine period (480 frames = 10 ms) and what follows from them; a device with another mix format would give other numbers by the same formulas. Waits are bounded (a second or less per condition).
not_covered: >
  Exclusive mode (the oracle's endpoint refuses it with AUDCLNT_E_UNSUPPORTED_FORMAT); capture endpoints and the capture client; other devices than the default render endpoint; a sandboxed audio process; device removal while a stream runs; ISimpleAudioVolume, IAudioStreamVolume and IAudioEndpointVolume; IAudioClient2's offload methods; ActivateAudioInterfaceAsync (mmdevapi ordinal 17, which chrome.dll delay-loads; Chrome activated through IMMDevice::Activate in every run).
