  observed_by: "spec-vcrt-2"
  date: "2026-11-16"
sources: |
  Observations of our own test programs on the machine above (the tests of this entry); class layouts, sizes, offsets,
  vtable orders and constants read from Microsoft's STL headers that ship with the Build Tools (Apache-2.0 with LLVM
  exception; owner decision 2026-11-15, CLEAN_ROOM.md: spec agents may read them for layouts, sizes, offsets, vtable
  order and member meaning; nothing of them is copied here, the facts below are in our own words and were checked by
  probe programs: sizeof and offset values printed by the tests); the compiler's own output for our own probe programs
  (cl /FAs listings: the arguments of the calls the compiler writes, the hidden constructor argument). No Microsoft
  binary was disassembled or debugged, no vcruntime, CRT or STL source (stl/src) was read.
summary: |
  The process-wide default memory resource of std::pmr (the pointer `std::pmr::get_default_resource()` and
  `set_default_resource()` use, and the resource every default-constructed polymorphic_allocator takes). Four exports
  share one stored pointer: _Aligned_get_default_resource() and _Aligned_set_default_resource(r) (what programs built
  with aligned new, the default of /std:c++17, call) and _Unaligned_get_default_resource() /
  _Unaligned_set_default_resource(r) (programs built with /Zc:alignedNew-). All four are `extern "C"` functions with
  undecorated names, __cdecl, noexcept. Qt6Gui's start-up calls the get function and uses the returned pointer: it must
  never be null.
interface:
  signatures: |
    memory_resource* _Aligned_get_default_resource(void); memory_resource* _Aligned_set_default_resource(memory_resource*
    r); memory_resource* _Unaligned_get_default_resource(void); memory_resource*
    _Unaligned_set_default_resource(memory_resource* r)
  memory_resource: |
    std::pmr::memory_resource (the base class every resource derives from) is an abstract class with a virtual destructor
    and three private virtual functions, and no data: an object is one pointer (its virtual-function table), 8 bytes,
    alignment 8. The table has four slots in this order: slot 0 the destructor (the 'scalar deleting destructor': takes a
    flags argument, bit 0 asks it to free the object), slot 1 do_allocate(size_t bytes, size_t alignment) returning void*,
    slot 2 do_deallocate(void* p, size_t bytes, size_t alignment), slot 3 do_is_equal(const memory_resource& other) const
    returning bool. All use the x64 calling convention with `this` first. The inline public wrappers of the header
    (allocate, deallocate, is_equal, operator==) call these slots; a program that derives its own resource puts its own
    functions in the same slots, and the library's code calls them through the table (set_default_resource accepts such an
    object).
rules:
  one_state: |
    There is ONE stored pointer, shared by the aligned and the unaligned functions, initially 'not set' (null). The
    aligned and unaligned functions differ only in what they return for 'not set': get_default_resource of the aligned
    kind returns the aligned new/delete resource, that of the unaligned kind the unaligned new/delete resource (two
    different objects, see _Aligned_new_delete_resource). Initially _Aligned_get_default_resource() ==
    _Aligned_new_delete_resource() and _Unaligned_get_default_resource() == _Unaligned_new_delete_resource(); repeated
    calls return the same object.
  set: |
    set(r) with r non-null stores r and returns the previous value: the stored pointer, or, if nothing was set, the
    new/delete resource of the kind of the set function that was called (_Aligned_set_default_resource returns the aligned
    one, _Unaligned_set_default_resource the unaligned one). set(null) clears the stored pointer ('not set') and returns
    the previous value the same way. Setting the same resource twice returns it the second time. After set(r) both get
    functions return r (shared state); after set(null) they return their own kinds' new/delete resources again.
  null_resource_as_default: |
    The null_memory_resource can be set as the default; allocation through a polymorphic_allocator made afterwards throws
    std::bad_alloc.
  identity: |
    The returned pointers are compared by address (resource identity): the objects are static, they live as long as the
    DLL is loaded.
  alignment: "The pointers are 8-byte aligned."
errors:
  none: "none of the four functions fails or throws."
side_effects: "none beyond the results above"
threading: "the tests are single-threaded"
