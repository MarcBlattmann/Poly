# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/CreateProcessWithTokenW.yaml
id: windows/api/advapi32.dll/CreateProcessWithTokenW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). cpwt_adm_shell and cpwt_adm_errors were recorded with -Token elevated (a one-time task in the account's interactive session 1: the full token, high integrity, 24 privileges, TokenElevationType 2, the shell Explorer is running there with the filtered token); cpwt_std_denied with -Token standard (the same account's filtered token: medium integrity, Administrators deny-only, 5 privileges, TokenElevationType 3); cpwt_ssh_session0 in the default mode (the SSH logon: session 0, elevated, no shell window). Each test starts its own executable as the child (`--child facts`): the child writes what it sees to a file beside the executable and the parent prints the relations. Every test ran twice with identical output."
  observed_by: "spec-win-chrome-setup"
  date: "2026-11-17"
sources: "Observations of our own test programs on the oracle machine. Microsoft Learn: CreateProcessWithTokenW (winbase.h; needs SeImpersonatePrivilege, the token needs TOKEN_QUERY|TOKEN_DUPLICATE|TOKEN_ASSIGN_PRIMARY, dwLogonFlags LOGON_WITH_PROFILE 1 / LOGON_NETCREDENTIALS_ONLY 2), STARTUPINFOW, PROCESS_INFORMATION, \"Process Creation Flags\", \"Access Tokens\", winerror.h. The shell-token sequence is what Chrome's setup.exe does (GetShellWindow, GetWindowThreadProcessId, OpenProcess, OpenProcessToken, DuplicateTokenEx, CreateProcessWithTokenW) to run `setup.exe --create-shortcuts=0 ...` as the logged-on user from its elevated process (survey-chrome-installer's install log). Nothing of Windows or Google's programs was read or disassembled."
summary: "Starts a process whose primary token is a duplicate of the given token, and returns its handles and ids. It needs the caller to hold SeImpersonatePrivilege (the elevated administrator has it, the administrator's filtered token does not: 1314). The child gets the token exactly (a duplicate of the shell's filtered token gives a medium-integrity, 5-privilege, deny-only-Administrators child; the caller's own duplicate gives the elevated token again), runs in the token's session, and its parent process is the caller. What the child does NOT inherit from the caller: the environment variables (without lpEnvironment it gets the token user's default environment), the current directory (without lpCurrentDirectory it starts in C:\\Windows\\System32), and handles (even inheritable ones). Chrome's setup.exe relies on this call to drop from an elevated installer to the user's own rights."
interface:
  signature: "BOOL CreateProcessWithTokenW(HANDLE token, DWORD logon_flags, LPCWSTR application, LPWSTR command_line, DWORD creation_flags, LPVOID environment, LPCWSTR current_directory, LPSTARTUPINFOW startup_info, LPPROCESS_INFORMATION process_information)  (advapi32)"
  child_report: "the test executable run as `\"<image>\" --child facts <file> <inheritable handle> <plain handle> <caller pid>` writes: its token facts, whether its parent is the caller, whether the two handle values are valid in it, whether its current directory is the image's directory / C:\\Windows / ends in \\system32, which environment variables exist, its startup info and session"
rules:
  privilege: "the caller needs SeImpersonatePrivilege: the elevated token (24 privileges) works; the filtered token (5 privileges, no SeImpersonate/SeAssignPrimaryToken/SeIncreaseQuota) fails with ERROR_PRIVILEGE_NOT_HELD (1314) for every token it passes, including the duplicate of Explorer's token and the caller's own duplicate, and also when the token handle is invalid (0x1234) or lacks TOKEN_ASSIGN_PRIMARY etc.; checks that come BEFORE the privilege check: neither application nor command line (87), NULL token (1326), bad logon flags (87); checked AFTER: a missing program (the filtered caller gets 1314, the elevated 2)"
  shell_token: "in the interactive session, GetShellWindow returns a window, its process can be opened with PROCESS_QUERY_INFORMATION, its token with TOKEN_DUPLICATE, and a primary duplicate (DuplicateTokenEx, SecurityImpersonation) is a valid token for the call; in the SSH logon (session 0) GetShellWindow returns NULL and none of this is possible"
  child_token: "the child's token equals the token passed: user (SID) the same, type primary, elevation type, integrity level, privilege count and restriction flag the same (shell token: type 1, elevation type 3, integrity 0x2000, 5 privileges, restricted 1; elevated duplicate: elevation type 2, integrity 0x3000, 24 privileges, restricted 0); the child's session is the token's session"
  parent: "the child's parent process (InheritedFromUniqueProcessId) is the calling process"
  logon_flags: "0, LOGON_WITH_PROFILE (1), LOGON_NETCREDENTIALS_ONLY (2) and 3 all work with a token of the caller's own user and give the same child; 4, 0x80 and 0xFFFFFFFF fail with 87"
  environment: "lpEnvironment NULL: the child gets the default environment of the token's user (the caller's variables are not passed: POLYSPECB4MARK is absent; USERNAME, USERPROFILE, APPDATA, LOCALAPPDATA, TEMP, SystemRoot, Path present); with CREATE_UNICODE_ENVIRONMENT and a block (from CreateEnvironmentBlock or hand-made) the child gets exactly that block (the two-variable block gives only those two plus none of USERNAME etc.); a UTF-16 block WITHOUT CREATE_UNICODE_ENVIRONMENT fails with 87"
  current_directory: "lpCurrentDirectory NULL: C:\\Windows\\System32 (not the caller's directory); a given directory (C:\\Windows) is the child's directory"
  startup_info: "lpTitle and lpDesktop are passed through (a NULL title gives an empty title; the child's desktop is WinSta0\\Default in session 1, a non-default window station name in session 0 where the title test also holds), dwFlags and wShowWindow are passed through (STARTF_USESHOWWINDOW 1 with SW_SHOWMINNOACTIVE 7 appear in the child's GetStartupInfoW as flags 0x1, show 7; 0x100 USESTDHANDLES appears as flags 0x100); the handles in hStdInput/Output/Error are NOT inherited by the child (no handle is); a NULL STARTUPINFO or one with cb 0 is accepted (the call succeeds)"
  handles: "no handle is inherited, not even an inheritable one (the function has no inherit-handles parameter): a handle value that is valid in the caller is invalid in the child"
  creation_flags: "CREATE_SUSPENDED (4): the child does not run until ResumeThread (previous suspend count 1; its report file does not exist 1.5 s after the call); CREATE_NEW_CONSOLE (0x10) and CREATE_NEW_PROCESS_GROUP (0x200) work; DETACHED_PROCESS (8) fails with 87"
  process_information: "hProcess and hThread are valid handles, dwProcessId and dwThreadId are non-zero; the child's exit code is read with GetExitCodeProcess (23 from the facts child, 7 from the exit child)"
  program: "the program comes from lpApplicationName or the first token of lpCommandLine; a missing application path gives 3 (path not found), a missing program in the command line 2, a text file 193 (ERROR_BAD_EXE_FORMAT), a directory 5; neither application nor command line, or an empty command line: 87"
  token_checks: "NULL token: 1326 (ERROR_LOGON_FAILURE); a value that is not a handle: 6; the process's pseudo handle: 6; a primary duplicate made with only TOKEN_QUERY, with QUERY|DUPLICATE, or with QUERY|DUPLICATE|ASSIGN_PRIMARY: 5 (the function wants TOKEN_ALL_ACCESS-like rights: only a duplicate with all rights works); an impersonation token at SecurityImpersonation level works (the child gets a primary token); at SecurityIdentification: 1346 (ERROR_BAD_IMPERSONATION_LEVEL); the process's own token handle opened with TOKEN_ALL_ACCESS (not a duplicate): fails with 1375"
results_cpwt_adm_errors:
  - "baseline: own duplicate, application and command line: result 1, error -2"
  - "own duplicate, command line only: result 1, error -2"
  - "no application and no command line: result 0, error 87"
  - "empty command line: result 0, error 87"
  - "missing program in the command line: result 0, error 2"
  - "missing application path: result 0, error 3"
  - "application is a text file: result 0, error 193"
  - "application is a directory: result 0, error 5"
  - "logon flags 4: result 0, error 87"
  - "logon flags 3: result 1, error -2"
  - "logon flags 0x80: result 0, error 87"
  - "logon flags 0xFFFFFFFF: result 0, error 87"
  - "NULL token: result 0, error 1326"
  - "invalid token handle value: result 0, error 6"
  - "handle that is not a token (the process): result 0, error 6"
  - "primary duplicate with only TOKEN_QUERY: result 0, error 5"
  - "primary duplicate with TOKEN_QUERY|TOKEN_DUPLICATE: result 0, error 5"
  - "primary duplicate with QUERY|DUPLICATE|ASSIGN_PRIMARY: result 0, error 5"
  - "impersonation token (impersonation level): result 1, error -2"
  - "impersonation token (identification level): result 0, error 1346"
  - "the process token itself (TOKEN_ALL_ACCESS): result 0, error 1375"
  - "CREATE_NEW_PROCESS_GROUP: result 1, error -2"
  - "DETACHED_PROCESS: result 0, error 87"
  - "NULL STARTUPINFO: result 1, error -2"
  - "STARTUPINFO with cb 0: result 1, error -2"
results_cpwt_std_denied:
  - "caller has SeImpersonatePrivilege: false; SeAssignPrimaryTokenPrivilege: false; SeIncreaseQuotaPrivilege: false"
  - "shell token duplicate: result 0, error 1314"
  - "own duplicate: result 0, error 1314"
  - "own duplicate, LOGON_WITH_PROFILE: result 0, error 1314"
  - "no application and no command line: result 0, error 87"
  - "missing program: result 0, error 1314"
  - "NULL token: result 0, error 1326"
  - "invalid token handle value: result 0, error 1314"
  - "logon flags 0x80: result 0, error 87"
  - "token with only TOKEN_QUERY: result 0, error 1314"
  - "CreateEnvironmentBlock for the shell token: result 1, block returned"
errors:
  privilege_not_held: "1314"
  invalid_parameter: "87"
  logon_failure: "1326 (NULL token)"
  bad_impersonation_level: "1346"
  invalid_handle: "6"
  access_denied: "5"
  file_not_found_path_not_found: "2 / 3"
  bad_exe_format: "193"
  null_process_information: "a NULL PROCESS_INFORMATION pointer crashes the caller (access violation 0xC0000005); not tested"
side_effects: "starts a process; the child of the tests ends itself"
threading: "may be called from any thread; it works through the Secondary Logon service, which is why the parent process is nevertheless the caller"
ordering:
  - "a suspended child does not run before ResumeThread"
timing:
  typical: "about 100 ms to start the child"
  guarantees: "none"
building_tests: "Rust tests (ADR 0075) that start themselves with `--child facts ...`. cpwt_adm_shell (token elevated): the shell token, the caller's duplicate, logon flags, current directory, environment blocks, suspended start, title/desktop/show/std handles, CREATE_NEW_CONSOLE; cpwt_adm_errors (elevated): the error table; cpwt_std_denied (standard): 1314 and the order of checks; cpwt_ssh_session0 (default): session 0 behaviour. Tests print only booleans and counts, never ids or paths. A child that does not end within 10 s is ended by the test."
not_covered: "tokens of other users or LogonUser tokens (never tested with credentials), LOGON_NETCREDENTIALS_ONLY with a token of another user, services running as SYSTEM, Poly's own interactive prompts, 32-bit callers or 32-bit children, job objects, the integrity level of a child started with a low-integrity token, handle inheritance through STARTF_USESTDHANDLES with real console handles, ShellExecute-based de-elevation (IShellDispatch2), the 60-second Secondary Logon service timeouts."
tests:
  visible: 3
  held_out: 1
