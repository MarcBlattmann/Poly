# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/GetSecurityInfo.RegistryKey.yaml
id: windows/api/advapi32.dll/GetSecurityInfo.RegistryKey
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\" (an administrator, full token); each test is a 64-bit and a 32-bit program, and every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-regkey-security
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, as an administrator (the SSH logon, full token) in a 64-bit and a 32-bit build, on keys the programs make themselves below HKLM\SOFTWARE and HKCU\Software (the key PolyKeySec_B7 and its children; each program removes them at the start and the end, after giving them a NULL DACL so that a test that locked a key cannot leave it behind). A first look was also taken as LocalSystem (a one-shot scheduled task, removed again): what differs is listed under observed_once. Microsoft Learn: "GetSecurityInfo function (aclapi.h)", "SetSecurityInfo function (aclapi.h)", "GetNamedSecurityInfoW", "SetNamedSecurityInfoW", "SE_OBJECT_TYPE enumeration", "RegGetKeySecurity function", "RegSetKeySecurity function", "Registry Key Security and Access Rights", "Access-Control Entries", "ACE_HEADER", "SECURITY_INFORMATION", "Automatic Propagation of Inheritable ACEs"; aclapi.h, accctrl.h, winnt.h, winreg.h, winerror.h for constants and layouts. The finding behind this job (the Google updater service calls GetSecurityInfo and SetSecurityInfo with SE_REGISTRY_KEY on a key handle and Poly answered ERROR_INVALID_HANDLE) is the coordinator's (B7). The existing sheets of GetSecurityInfo and SetSecurityInfo observed the types on an event handle only. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  GetSecurityInfo with SE_REGISTRY_KEY (4) on a registry key handle works: it returns 0 and the key's owner, group and DACL, whatever access the handle was opened with. The rule of the GetSecurityInfo sheet that types 2, 3 and 4 return ERROR_INVALID_HANDLE (6) holds for an event handle (and the other non-key handles), not for a key handle. The Google updater's service calls it on the handle of the key it has just made.
interface:
  signature: "DWORD GetSecurityInfo(HANDLE handle, SE_OBJECT_TYPE ObjectType, SECURITY_INFORMATION SecurityInfo, PSID* ppsidOwner, PSID* ppsidGroup, PACL* ppDacl, PACL* ppSacl, PSECURITY_DESCRIPTOR* ppSecurityDescriptor)"
  handles: "the handle comes from RegCreateKeyExW or RegOpenKeyExW, or is one of the predefined keys (HKEY_LOCAL_MACHINE and the others, as winreg.h defines them)"
rules:
  key_handle: "SE_REGISTRY_KEY on a key handle: 0, the descriptor is a LocalAlloc'ed self-relative copy as for other objects, the owner, group and DACL pointers point into it"
  parts: "owner alone: control 0x8000 and the owner; group alone: 0x8000 and the group; DACL alone or with PROTECTED_/UNPROTECTED_DACL_SECURITY_INFORMATION added (the added flag changes nothing on a read): control 0x8404 (self-relative, DACL present, DACL auto-inherited) and the DACL; all three: 0x8404 and the three parts; information 0: 0 and control 0x8000 with no part; SACL_SECURITY_INFORMATION alone and LABEL_SECURITY_INFORMATION alone with an administrator token: 0 and a descriptor with no SACL (control 0x8000 in a 64-bit process, 0x8800 in a 32-bit one)"
  types: "on a key handle: type 4 (SE_REGISTRY_KEY), 1 (SE_FILE_OBJECT), 6 (SE_KERNEL_OBJECT), 7 and 11: 0; types 2 (SE_SERVICE) and 3 (SE_PRINTER): ERROR_INVALID_HANDLE (6); types 0, 8, 9, 10, 12 to 15 and 99: ERROR_INVALID_PARAMETER (87). Type 5 (SE_LMSHARE) is not tried (it raised an access violation in an earlier probe of the event case)"
  not_a_key: "on an event handle SE_REGISTRY_KEY stays ERROR_INVALID_HANDLE (6) while SE_KERNEL_OBJECT and SE_FILE_OBJECT give 0 (as the GetSecurityInfo sheet says); NULL, 0x1234, -1 and a closed key handle: 6 for SE_REGISTRY_KEY"
  rights: "a key handle opened with READ_CONTROL, KEY_READ, KEY_WRITE, KEY_ALL_ACCESS, KEY_SET_VALUE, KEY_QUERY_VALUE, KEY_CREATE_SUB_KEY, WRITE_DAC, WRITE_OWNER or DELETE (opened by an administrator; the key's DACL grants it): GetSecurityInfo for the DACL, for owner+group and for information 0 returns 0 each time, also for the handles that have no READ_CONTROL; the handle's granted access is not what limits it. RegGetKeySecurity on the same handles needs READ_CONTROL (5 without it)"
  new_key: "a key made by an administrator below HKLM\\SOFTWARE: owner BA (S-1-5-32-544), group S-1-5-21-<machine>-513 (None), control 0x8404 and a DACL of revision 2 whose ACEs are the parent's inheritable ACEs, each marked inherited: BU (S-1-5-32-545, Users) mask 0x20019 flags 0x12, BA (S-1-5-32-544) mask 0xf003f flags 0x12, SY (S-1-5-18) mask 0xf003f flags 0x12, CO (S-1-3-0, CREATOR OWNER) mask 0xf003f flags 0x1a, AC (S-1-15-2-1, ALL APPLICATION PACKAGES) mask 0x20019 flags 0x12 and the capability SID S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681 mask 0x20019 flags 0x12. A subkey of it has the same owner, group, control and DACL"
  parent_relation: "the new key has as many ACEs as its parent (HKLM\\SOFTWARE) has inheritable ACEs (those with CONTAINER_INHERIT_ACE or OBJECT_INHERIT_ACE), and every ACE of the new key carries INHERITED_ACE (0x10)"
  predefined: "HKEY_LOCAL_MACHINE, HKEY_USERS and HKEY_CURRENT_CONFIG: 0, owner SY (S-1-5-18), control 0x8004, 6 ACEs; HKEY_CURRENT_USER: 0, owner BA, control 0x9004 (protected), 6 ACEs; HKEY_CLASSES_ROOT: 0, owner SY, control 0x9404, 12 ACEs. RegGetKeySecurity gives 0 on each. HKLM\\SOFTWARE by name through a 64-bit process: owner BA, control 0x9404 (protected, auto-inherited), 6 ACEs; the same name through a 32-bit process is the 32-bit view of the key (HKLM\\SOFTWARE\\Wow6432Node): owner SY, control 0x8404, 6 ACEs"
  view_bits: "a handle opened with KEY_WOW64_32KEY or KEY_WOW64_64KEY is an ordinary key handle: the key of the process's own view is found by the bit of that view only (the other bit gives ERROR_FILE_NOT_FOUND on the open); GetSecurityInfo on the handle that opened works as above"
errors:
  invalid_handle: "ERROR_INVALID_HANDLE (6) for a handle that is not a key (an event, NULL, 0x1234, -1, a closed handle) with SE_REGISTRY_KEY, and for types 2 and 3 on a key handle"
  invalid_parameter: "ERROR_INVALID_PARAMETER (87) for the object types listed above"
observed_once: "As LocalSystem (a scheduled task), keys it made itself: the owner and the group of a new key are SY (S-1-5-18); the DACL, control bits and the type table are the same; GetSecurityInfo for SACL_SECURITY_INFORMATION returns ERROR_ACCESS_DENIED (5) where the administrator gets 0 (SYSTEM's SeSecurityPrivilege is not enabled)."
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), each as a 64-bit and a 32-bit program (the 32-bit one marked as such, ADR 0259). They make the test keys with RegCreateKeyExW (KEY_ALL_ACCESS, the process's own view), read with GetSecurityInfo, RegGetKeySecurity and GetNamedSecurityInfoW and write with SetSecurityInfo, RegSetKeySecurity and SetNamedSecurityInfoW; the DACLs they write are built with InitializeAcl, AddAce and AddAccessAllowedAceEx from the DACL they read. They need an administrator token for HKLM. Output lines hold return values, control bits, SIDs in text form (a domain/machine SID is printed as S-1-5-21-<machine>-<RID>, an account's own SID as <account>), ACE types, flags and masks: no handle, address, time, count of a whole hive or machine path.
not_covered: >
  A caller that is a standard user (only the administrator and LocalSystem tokens were tried; the non-owner case is an administrator that does not own the key), the SACL and mandatory labels of keys (needs SeSecurityPrivilege; only the answer for an administrator is recorded), keys of other hives than HKLM and HKCU, object-specific ACEs, deny ACEs (only allowed ACEs are written), remote machine names in the named calls, and the SE_REGISTRY_WOW64_32KEY object type, which answered ERROR_DEV_NOT_EXIST (55) in every call tried.
