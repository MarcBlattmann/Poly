# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/advapi32.dll/MakeAbsoluteSD
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled.
summary: >
  Splits a self-relative descriptor into a 40-byte absolute descriptor
  (written to the first buffer) whose slots point at copies of the DACL,
  SACL, owner and primary group that are written to the caller's four other
  buffers. If any buffer is too small it fails with
  ERROR_INSUFFICIENT_BUFFER and sets all five size variables.
interface:
  signature: "BOOL MakeAbsoluteSD(PSECURITY_DESCRIPTOR pSelfRelativeSecurityDescriptor, PSECURITY_DESCRIPTOR pAbsoluteSecurityDescriptor, LPDWORD lpdwAbsoluteSecurityDescriptorSize, PACL pDacl, LPDWORD lpdwDaclSize, PACL pSacl, LPDWORD lpdwSaclSize, PSID pOwner, LPDWORD lpdwOwnerSize, PSID pPrimaryGroup, LPDWORD lpdwPrimaryGroupSize)"
  layout: "SECURITY_DESCRIPTOR, absolute form (winnt.h, x64, 40 bytes): byte 0 Revision (1), byte 1 Sbz1, bytes 2..3 Control (little-endian 16-bit), bytes 4..7 padding, then four 8-byte pointers: Owner at 8, Group at 16, Sacl at 24, Dacl at 32. Self-relative form: the same first 4 bytes, with SE_SELF_RELATIVE (0x8000) in Control, then four 32-bit offsets from the start of the descriptor: Owner at 4, Group at 8, Sacl at 12, Dacl at 16 (header 20 bytes); an offset of 0 means the part is absent (or, for the ACLs, a NULL ACL when the PRESENT bit is set)."
rules:
  size_protocol: "for \"O:BAG:SYD:(A;;GA;;;WD)S:(AU;SAFA;GA;;;WD)\": with no buffers and all lengths 0 (or 0xAAAA), with all buffers and lengths 0, with the descriptor / DACL / SACL / owner / group buffer NULL and length 0, or with any single length one short: FALSE, ERROR_INSUFFICIENT_BUFFER (122), and ALL five variables are set to the needs: absolute 40, DACL 28, SACL 28, owner 16, group 12. With lengths equal to or larger than the needs (40, 28, 28, 16, 12 or 64, 512, 512, 68, 68) it succeeds and leaves the length variables as they were"
  result: "the absolute header has revision 1, control = the source control without SE_SELF_RELATIVE (0x0014 for DACL and SACL, 0x1c14 with AI/P flags), and the four slots point exactly at the caller's buffers (owner, group, DACL and SACL buffer pointers are returned by the Get functions); parts the source lacks stay NULL and their buffers are untouched; a NULL DACL (source \"D:NO_ACCESS_CONTROL\") gives control 0x0004 with a NULL slot and an untouched DACL buffer"
  copies: "the DACL buffer holds the 28 ACL bytes 02 00 1c 00 01 00 00 00 00 00 14 00 00 00 00 10 01 01 00 00 00 00 00 01 00 00 00 00, the rest of the buffer is not written; the owner buffer holds the 16 bytes of S-1-5-32-544 and the next byte is untouched; the empty ACL of \"D:\" is 8 bytes"
  padding: "bytes 4..7 of the absolute descriptor are not cleared: they hold the source's owner offset (0x4c = 76 for the descriptor above, 0x14 for \"O:BA\", 0 where the source has no owner)"
  roundtrip: "IsValidSecurityDescriptor is TRUE on the result and its SDDL text is the source's (\"O:BAG:SYD:(A;;GA;;;WD)S:(AU;SAFA;GA;;;WD)\", \"D:\", \"S:\", \"\", \"O:BAG:SYD:PAI(A;;GA;;;WD)S:AI(AU;SAFA;GA;;;WD)\")"
  not_validated: "a revision byte of 0, 2 or 255 in the source, and revision 0 with only SE_SELF_RELATIVE set, are converted with TRUE"
errors:
  absolute_input: "a descriptor that is already absolute: FALSE, ERROR_BAD_DESCRIPTOR_FORMAT (1361), the length variables are left alone"
  buffers: "ERROR_INSUFFICIENT_BUFFER (122) as above"
side_effects: "writes the five output buffers on success"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  a NULL output buffer together with a sufficient length raised an access
  violation in a probe (not part of the tests); buffers must be supplied
  whenever the lengths allow writing Domain accounts and domain-relative
  well-known SIDs of a real domain, AppContainer and capability SIDs beyond
  their string forms, auditing (SACL entries are only stored, never
  evaluated), remote systems (the system-name arguments), Kerberos or NTLM
  logon tokens, tokens of other users.
