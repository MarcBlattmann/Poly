# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/advapi32.dll/GetKernelObjectSecurity
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled.
summary: >
  Copies the requested parts of a kernel object's security descriptor into
  the caller's buffer as a self-relative descriptor. Needs READ_CONTROL for
  owner, group, DACL and label, ACCESS_SYSTEM_SECURITY for the SACL.
interface:
  signature: "BOOL GetKernelObjectSecurity(HANDLE Handle, SECURITY_INFORMATION RequestedInformation, PSECURITY_DESCRIPTOR pSecurityDescriptor, DWORD nLength, LPDWORD lpnLengthNeeded)"
  layout: "SECURITY_DESCRIPTOR, absolute form (winnt.h, x64, 40 bytes): byte 0 Revision (1), byte 1 Sbz1, bytes 2..3 Control (little-endian 16-bit), bytes 4..7 padding, then four 8-byte pointers: Owner at 8, Group at 16, Sacl at 24, Dacl at 32. Self-relative form: the same first 4 bytes, with SE_SELF_RELATIVE (0x8000) in Control, then four 32-bit offsets from the start of the descriptor: Owner at 4, Group at 8, Sacl at 12, Dacl at 16 (header 20 bytes); an offset of 0 means the part is absent (or, for the ACLs, a NULL ACL when the PRESENT bit is set)."
  objects: "Objects used: named events, mutexes and job objects (unique names \"PolySecSd<pid>_<n>\", closed after use), unnamed ones, a duplicate of the process token, and the process / thread pseudo handles. Tests that depend on the oracle token say so: the SSH session runs as a local administrator with the elevated token (High integrity, Administrators group enabled, privileges present); the AccessCheck tests use an impersonation copy of it with every privilege disabled unless a test enables one on purpose."
rules:
  default_security: "a named event, mutex or job object created without attributes gets the caller's default descriptor: owner Administrators (S-1-5-32-544, the token owner), group = the primary group (S-1-5-21-<machine>-513), a DACL of three allow ACEs for BA, SY and the logon-session SID (S-1-5-5-x-y), control 0x8004 (DACL present, self-relative), size 144 bytes: dacl offset 64, owner 20, group 36; the masks are the token default DACL mapped for the type: event 0x1f0003 / 0x1f0003 / 0x120001, mutex 0x1f0001 / 0x1f0001 / 0x120001, job 0x1f003f / 0x1f003f / 0x120004; an unnamed job object also gets such a descriptor, an unnamed event created without attributes has no descriptor: the call succeeds with the empty 20-byte self-relative one (control 0x8000, all offsets 0)"
  explicit: "an unnamed event created with security attributes holding \"O:BAG:SYD:(A;;0x1f0003;;;SY)\" returns exactly that (76 bytes, control 0x8004, owner 20, group 36, dacl 48)"
  token: "a duplicate of the process token: owner BA, group <machine>-513, DACL BA and SY with 0xf01ff and the logon SID with 0x2001f (control 0x8004, 144 bytes)"
  size_protocol: "a too small buffer or NULL with length 0: FALSE with ERROR_INSUFFICIENT_BUFFER (122) and *needed = the size: for the named event with the default descriptor 36 for information 1, 48 for 2, 100 for 4, 64 for 3, 116 for 5, 128 for 6, 144 for 7, 20 for 0x10 (an empty result) and 100 for 0x14; lengths 1, 19, 20 and 143 fail with *needed = 144 and write nothing; 144, 145 and 2048 succeed writing 144 bytes, *needed = 144; information 8 (SACL) with length 0 fails with ERROR_ACCESS_DENIED (5) and leaves *needed alone"
  access: "a handle with only READ_CONTROL (0x20000) reads owner (36), group (48), DACL (100), label (20) and all three together (144); handles with only SYNCHRONIZE, WRITE_DAC or EVENT_MODIFY_STATE fail with ERROR_ACCESS_DENIED (5) for every information value; the SACL (information 8, also combined with others) fails with ERROR_ACCESS_DENIED even for a full-access handle; a handle duplicated with ACCESS_SYSTEM_SECURITY|READ_CONTROL (granted access 0x1020000) reads the SACL (20 bytes, SDDL text empty) and keeps doing so after SeSecurityPrivilege is disabled again"
  information_values: "information 0, 0x20, 0x40, 0x80, 0x100, 0x80000000 and 0x40000000 succeed with the empty 20-byte result; DACL|0x80000000 returns the DACL (100); 0x10000 and 0xFFFFFFFF fail with ERROR_ACCESS_DENIED (5); the pseudo handle -1 (current process) works (144 bytes for information 7)"
errors:
  handle: "NULL and 0x1234: ERROR_INVALID_HANDLE (6)"
  buffer: "ERROR_INSUFFICIENT_BUFFER (122) as above"
  rights: "ERROR_ACCESS_DENIED (5) as above"
side_effects: "none beyond the rules above"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
