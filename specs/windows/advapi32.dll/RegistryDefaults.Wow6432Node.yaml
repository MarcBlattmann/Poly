# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/RegistryDefaults.Wow6432Node.yaml
id: windows/api/advapi32.dll/RegistryDefaults.Wow6432Node
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\" (an administrator, full token); each test is a 64-bit and a 32-bit program, and every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-wow64-defaults
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above: 64-bit programs that ask for each view in turn (the access bits KEY_WOW64_64KEY and KEY_WOW64_32KEY) and 32-bit programs (built for i686, run under WOW64) that ask for their own default view and for each explicit one; the marker keys the tests make are removed again (the programs end by checking that none is left). Every program reads names and values only. Microsoft Learn: "Registry Redirector", "Registry Keys Affected by WOW64", "Accessing an Alternate Registry View", "Registry Key Security and Access Rights", "Interface Key", "CLSID Key", "InprocServer32", "ProxyStubClsid32", "TypeLib Key", "Type Library Registration", "Windows NT CurrentVersion" (no page: names as found); oaidl.h, objidl.h, unknwn.h, oleauto.h for the interface names. The coordinator's finding for B7: the 32-bit updater creates and opens keys below Software\Classes and needs the standard COM registrations in the 32-bit view too. The oracle is a normal installed machine (it also has Google, Intel, Python, Git and other vendors' keys): only what Windows itself makes is listed as default, vendor keys are left out. The earlier sheets of this area (RegCreateKeyExW and its relatives, observed under the name spec-win-wow64-registry) say how a key made through a handle or a path lands in a view; these sheets say what is there before any program has made anything. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  The Wow6432Node keys a Windows machine has before any program has made anything: HKLM\SOFTWARE\Wow6432Node (the 32-bit software hive), HKLM\SOFTWARE\Classes\Wow6432Node (the 32-bit classes), and which names are one key. The 64-bit view shows them as keys; the 32-bit view shows the same data as SOFTWARE and Classes. A machine that lacks them makes every 32-bit installer fail on its first create or lookup below Software\Classes.
interface:
  signature: "behaviour of RegOpenKeyExW, RegEnumKeyExW and RegCreateKeyExW (also the Nt calls) on HKLM\\SOFTWARE in the two views"
rules:
  software_64: "in the 64-bit view HKLM\\SOFTWARE has the children Classes, Clients, Microsoft, Policies, RegisteredApplications and Wow6432Node (stored as WOW6432Node); HKLM\\SOFTWARE\\Wow6432Node has the children Classes, Clients, Microsoft, Policies and RegisteredApplications and no Wow6432Node child. Vendors add more (Google, Intel, ODBC and Python on the oracle): only the five names are the default"
  software_32: "in the 32-bit view HKLM\\SOFTWARE is the key HKLM\\SOFTWARE\\Wow6432Node: it has the same five children and no Wow6432Node child, and SOFTWARE\\Wow6432Node (naming it) is the same key; SOFTWARE\\Wow6432Node\\Wow6432Node does not exist in either view"
  microsoft: "HKLM\\SOFTWARE\\Wow6432Node\\Microsoft exists and has the keys installers read: Windows\\CurrentVersion (with Uninstall, App Paths, Run and RunOnce), Windows NT\\CurrentVersion, Ole, COM3 and Rpc; the 32-bit view shows them as SOFTWARE\\Microsoft\\... (the 64-bit key of the same name is another key)"
  classes_wow: "HKLM\\SOFTWARE\\Classes\\Wow6432Node exists with the children CLSID, Interface, TypeLib, AppID, DirectShow, Media Type and MediaFoundation (other children, such as PROTOCOLS, depend on what is installed); CLSID, Interface, TypeLib and AppID exist below it and below HKLM\\SOFTWARE\\Classes. HKLM\\SOFTWARE\\Wow6432Node\\Classes exists too, with the same seven children"
  one_key_64: "in the 64-bit view (the physical registry) SOFTWARE\\Wow6432Node\\Classes\\X and SOFTWARE\\Classes\\Wow6432Node\\X are one key, for every X. A key made at one of them is found at the other and at HKEY_CLASSES_ROOT\\Wow6432Node\\X, and is not found at SOFTWARE\\Classes\\X (for X = CLSID\\id and Interface\\id, and for plain names). TypeLib and AppID are the exception: SOFTWARE\\Classes\\Wow6432Node\\TypeLib is the key SOFTWARE\\Classes\\TypeLib (same for AppID), so a key made at any of the three TypeLib paths (or AppID paths) is found at all three, and at HKEY_CLASSES_ROOT\\TypeLib, in both views"
  view_32: "in the 32-bit view the Wow6432Node name below Classes names Classes itself for plain names: a key made at SOFTWARE\\Classes\\X (64-bit view) is found in the 32-bit view at SOFTWARE\\Classes\\X, SOFTWARE\\Classes\\Wow6432Node\\X and SOFTWARE\\Wow6432Node\\Classes\\X (and HKEY_CLASSES_ROOT\\X and HKEY_CLASSES_ROOT\\Wow6432Node\\X), while a key made at SOFTWARE\\Classes\\Wow6432Node\\X (64-bit view) is not found at any of them. CLSID and Interface are redirected: SOFTWARE\\Classes\\CLSID\\id of the 32-bit view is the physical SOFTWARE\\Classes\\Wow6432Node\\CLSID\\id, found in the 32-bit view at SOFTWARE\\Classes\\CLSID, SOFTWARE\\Classes\\Wow6432Node\\CLSID and SOFTWARE\\Wow6432Node\\Classes\\CLSID (the same for Interface), and a 64-bit SOFTWARE\\Classes\\CLSID\\id (or Interface\\id) is not found in the 32-bit view at all"
  software_keys: "below SOFTWARE itself a key made in the 64-bit view as SOFTWARE\\X is found at SOFTWARE\\X of the 64-bit view only; one made as SOFTWARE\\Wow6432Node\\X is found at SOFTWARE\\Wow6432Node\\X of both views and at SOFTWARE\\X of the 32-bit view"
  own_view: "a key made with no view bit goes to the process's own view: a 64-bit process makes SOFTWARE\\Classes\\CLSID\\id, SOFTWARE\\Classes\\Interface\\id and SOFTWARE\\X as such; a 32-bit process makes them at the physical SOFTWARE\\Classes\\Wow6432Node\\CLSID\\id, SOFTWARE\\Classes\\Wow6432Node\\Interface\\id and SOFTWARE\\Wow6432Node\\X (TypeLib keys are the one key either way)"
errors:
  missing_key: "ERROR_FILE_NOT_FOUND (2) for a key that does not exist in the asked view"
side_effects: "the programs make and remove marker keys below HKLM\\SOFTWARE; none is left"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, in two builds of the same program: a 64-bit program (which asks for KEY_WOW64_64KEY and for KEY_WOW64_32KEY) and a 32-bit program (marked as such, ADR 0259; it asks for its own default view and for each explicit one). Programs read with RegOpenKeyExW, RegEnumKeyExW, RegEnumValueW, RegQueryInfoKeyW and RegQueryValueExW; the ones that make marker keys use RegCreateKeyExW and RegDeleteKeyExW and need an administrator token (the default token kind of the runner) for HKLM. Names of the markers are fixed and unique; each program removes its markers at the start and at the end. Output lines hold names, yes/no answers and text values only: no counts of a whole hive, no handle, no time, no path of the test.
not_covered: >
  Other hives (HKU, HKCC), keys below HKLM\SYSTEM, the registry on a machine that has ARM64 emulation, the values of keys that vendors' installers make, and the data (names and permissions) of the security descriptors of the keys. Counts of the children of the big keys (Interface has about twenty-four thousand children on the oracle) differ from machine to machine and are not part of the behaviour.
