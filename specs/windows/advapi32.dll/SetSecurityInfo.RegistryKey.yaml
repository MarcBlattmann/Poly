# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/SetSecurityInfo.RegistryKey.yaml
id: windows/api/advapi32.dll/SetSecurityInfo.RegistryKey
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\" (an administrator, full token); each test is a 64-bit and a 32-bit program, and every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-regkey-security
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, as an administrator (the SSH logon, full token) in a 64-bit and a 32-bit build, on keys the programs make themselves below HKLM\SOFTWARE and HKCU\Software (the key PolyKeySec_B7 and its children; each program removes them at the start and the end, after giving them a NULL DACL so that a test that locked a key cannot leave it behind). A first look was also taken as LocalSystem (a one-shot scheduled task, removed again): what differs is listed under observed_once. Microsoft Learn: "GetSecurityInfo function (aclapi.h)", "SetSecurityInfo function (aclapi.h)", "GetNamedSecurityInfoW", "SetNamedSecurityInfoW", "SE_OBJECT_TYPE enumeration", "RegGetKeySecurity function", "RegSetKeySecurity function", "Registry Key Security and Access Rights", "Access-Control Entries", "ACE_HEADER", "SECURITY_INFORMATION", "Automatic Propagation of Inheritable ACEs"; aclapi.h, accctrl.h, winnt.h, winreg.h, winerror.h for constants and layouts. The finding behind this job (the Google updater service calls GetSecurityInfo and SetSecurityInfo with SE_REGISTRY_KEY on a key handle and Poly answered ERROR_INVALID_HANDLE) is the coordinator's (B7). The existing sheets of GetSecurityInfo and SetSecurityInfo observed the types on an event handle only. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  SetSecurityInfo with SE_REGISTRY_KEY (4) on a registry key handle works: it replaces the DACL (or owner, group) of the key, with the protection flags and the automatic propagation of inheritable ACEs to subkeys of SetNamedSecurityInfoW, and it does not require WRITE_DAC on the handle when the caller may change the key's DACL. The Google updater's service calls it with a handle opened for KEY_WRITE.
interface:
  signature: "DWORD SetSecurityInfo(HANDLE handle, SE_OBJECT_TYPE ObjectType, SECURITY_INFORMATION SecurityInfo, PSID psidOwner, PSID psidGroup, PACL pDacl, PACL pSacl)"
rules:
  stored: "SetSecurityInfo(key, SE_REGISTRY_KEY, DACL_SECURITY_INFORMATION, ..., dacl) with the key's own DACL read back plus one allowed ACE at the end (CONTAINER_INHERIT_ACE, Authenticated Users S-1-5-11, mask 0x20019): 0. Read back, the DACL has 7 ACEs, control 0x8404, the new ACE FIRST with flags 0x02 (explicit ACEs come before inherited ones: the list is put in canonical order), then the six inherited ACEs unchanged. The same bytes come back through GetSecurityInfo and RegGetKeySecurity"
  propagation: "the inheritable ACE reaches the subkeys at once, as inherited ACEs: the child and the grandchild now have 7 ACEs, control 0x8404, the new one first with flags 0x12 (CONTAINER_INHERIT_ACE | INHERITED_ACE), the sibling subkey too. (RegSetKeySecurity does not do this: see its sheet)"
  protected: "with PROTECTED_DACL_SECURITY_INFORMATION added to DACL_SECURITY_INFORMATION: the key's control becomes 0x9404 (SE_DACL_PROTECTED), the inherited ACEs it had are kept as explicit ACEs (flags without 0x10: 0x02, and 0x0a for the CREATOR OWNER one) and it gets the new ACE; its subkeys receive the new ACE inherited (7 ACEs each: the 6 they had and the new one, all inherited)"
  unprotected: "with UNPROTECTED_DACL_SECURITY_INFORMATION on a key that was protected: control 0x8404 again; the explicit ACEs the key had are kept and the parent's inheritable ACEs are inherited again, so the key then holds both (the 7 ACEs of the protected key, the new one and the 6 inherited again: 14 ACEs, 8 explicit and 6 inherited); the subkeys keep their 7 inherited ACEs (the duplicate is not inherited twice)"
  protected_child: "a subkey given a DACL with PROTECTED_DACL_SECURITY_INFORMATION keeps exactly its ACEs (control 0x9404, no inherited ACE) when the parent changes later: it does not receive the parent's new ACE, its own unprotected subkey does receive the changes of the protected subkey (inherited from it)"
  handle_rights: "the call succeeds (0) for a key handle opened with READ_CONTROL, KEY_WRITE, KEY_READ, KEY_SET_VALUE, WRITE_OWNER, WRITE_DAC, WRITE_DAC|READ_CONTROL or KEY_ALL_ACCESS when the caller is an administrator that may write the key's DACL, and the ACE is stored each time (the count of ACEs for the added SID grows by one per call); the access rights that the handle was opened with are not checked. RegSetKeySecurity on the same handles needs WRITE_DAC: READ_CONTROL, KEY_WRITE and WRITE_OWNER handles give ERROR_ACCESS_DENIED (5) and store nothing; WRITE_DAC and KEY_ALL_ACCESS give 0"
  owner_same_handle: "the updater's sequence, as the key's owner (an administrator whose token owner is Administrators, a key it made with RegCreateKeyExW): the key made with KEY_WRITE (the handle's access, from NtQueryObject, 0x20006: KEY_WRITE includes READ_CONTROL but not WRITE_DAC), with KEY_SET_VALUE|KEY_CREATE_SUB_KEY (0x6: neither READ_CONTROL nor WRITE_DAC), with KEY_READ (0x20019) or with KEY_QUERY_VALUE (0x1): GetSecurityInfo(SE_REGISTRY_KEY, DACL) on that handle: 0; a DACL rebuilt from its ACEs plus one: SetSecurityInfo(SE_REGISTRY_KEY, DACL, ...) on the same handle: 0, and the key then has one more ACE; the handle's access mask is the same afterwards (SetSecurityInfo does not widen it)"
  owner_implied: "the same when the key's DACL gives the owner nothing (a protected DACL with one ACE for SYSTEM only): a new open with KEY_WRITE or KEY_READ: ERROR_ACCESS_DENIED (5); with READ_CONTROL, WRITE_DAC, READ_CONTROL|WRITE_DAC: 0 (the owner's implied rights), with WRITE_OWNER: 0 (an administrator holds the take-ownership privilege). A KEY_WRITE handle opened BEFORE the DACL was replaced: GetSecurityInfo(DACL) on it: 0 (the one ACE), then the rebuilt DACL through SetSecurityInfo on the same handle: 0 and stored (2 ACEs). So the call does not depend on the access the handle was granted (0x20006, no WRITE_DAC): it succeeds when the caller could change the DACL of the key now, by the owner's implied WRITE_DAC"
  non_owner: "a caller that is not the owner: the key is owned by SYSTEM (the owner set through SetSecurityInfo(OWNER) by an administrator with SeRestorePrivilege enabled, then disabled again: 0) and its DACL is SYSTEM all access plus Administrators 0x3001f (DELETE | KEY_WRITE | KEY_READ), protected; the administrator (a member of Administrators, not the owner, no privilege enabled): open with KEY_WRITE, KEY_READ or KEY_SET_VALUE|KEY_CREATE_SUB_KEY: 0; GetSecurityInfo(DACL) on that handle: 0 (2 ACEs); SetSecurityInfo(DACL, one more ACE) on the same handle: ERROR_ACCESS_DENIED (5) and nothing stored; an open with WRITE_DAC: 5"
  types: "on a key handle: types 6, 1, 7, 11 and 4: 0; types 2 and 3: ERROR_INVALID_HANDLE (6); types 0, 8, 9 and 99: ERROR_INVALID_PARAMETER (87)"
  null_and_empty: "a NULL pDacl with DACL_SECURITY_INFORMATION: 0, and the key then has a NULL DACL (present, no ACL: everyone has full access; control 0x9404); an empty ACL (revision 2, no ACE): 0, the key has a DACL of 0 ACEs (control 0x9404); the owner can still read and change it. Information 0: 0"
  owner_group: "OWNER_SECURITY_INFORMATION with the Administrators SID through a handle with WRITE_OWNER (an administrator): 0; GROUP_SECURITY_INFORMATION with SY: 0; read back: owner BA, group SY, control 0x8000. An owner request with a NULL owner pointer: ERROR_INVALID_PARAMETER (87)"
  not_a_key: "SE_REGISTRY_KEY on NULL, 0x1234 and an event handle: ERROR_INVALID_HANDLE (6)"
errors:
  invalid_handle: "ERROR_INVALID_HANDLE (6)"
  invalid_parameter: "ERROR_INVALID_PARAMETER (87)"
  access_denied: "ERROR_ACCESS_DENIED (5) only for the caller that may not change the key (not recorded here)"
observed_once: "As LocalSystem (a scheduled task) on keys it made: the sequence above gave 0 each time, also in the non-owner case (the key owned by Administrators with SYSTEM given 0x3001f only: SetSecurityInfo through a KEY_WRITE, KEY_READ, KEY_SET_VALUE|KEY_CREATE_SUB_KEY and WRITE_DAC handle: 0 each), and a new open of a key whose DACL names only Administrators still succeeded: SYSTEM's privileges (restore, take ownership) are on in its token. The owner and group requests of the test, made through a handle that was opened with READ_CONTROL|WRITE_OWNER on a key whose DACL the test had just emptied, returned ERROR_INVALID_HANDLE (6) in that run (not examined further)."
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 7
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), each as a 64-bit and a 32-bit program (the 32-bit one marked as such, ADR 0259). They make the test keys with RegCreateKeyExW (KEY_ALL_ACCESS, the process's own view), read with GetSecurityInfo, RegGetKeySecurity and GetNamedSecurityInfoW and write with SetSecurityInfo, RegSetKeySecurity and SetNamedSecurityInfoW; the DACLs they write are built with InitializeAcl, AddAce and AddAccessAllowedAceEx from the DACL they read. They need an administrator token for HKLM. Output lines hold return values, control bits, SIDs in text form (a domain/machine SID is printed as S-1-5-21-<machine>-<RID>, an account's own SID as <account>), ACE types, flags and masks: no handle, address, time, count of a whole hive or machine path.
not_covered: >
  A caller that is a standard user (only the administrator and LocalSystem tokens were tried; the non-owner case is an administrator that does not own the key), the SACL and mandatory labels of keys (needs SeSecurityPrivilege; only the answer for an administrator is recorded), keys of other hives than HKLM and HKCU, object-specific ACEs, deny ACEs (only allowed ACEs are written), remote machine names in the named calls, and the SE_REGISTRY_WOW64_32KEY object type, which answered ERROR_DEV_NOT_EXIST (55) in every call tried.
