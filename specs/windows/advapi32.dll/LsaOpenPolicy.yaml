# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/LsaOpenPolicy.yaml
id: windows/api/advapi32.dll/LsaOpenPolicy
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (and, for the MSYS2 calls, the API trace of PortableGit 2.56.1's sh.exe and msys-2.0.dll made with the repository's trace kit: only the calls the runtime makes into kernel32 and ntdll, with their arguments and results; no Microsoft or MSYS2 code was read). Microsoft Learn for the documented calls named in each sheet; constants and layouts from winnt.h, winbase.h, winternl.h, ntstatus.h, winerror.h, ntsecapi.h, stdio.h.
summary: >
  Opens the local security policy (the MSYS2 runtime opens it with a NULL system name for the domain information; Poly's stub fails, the runtime then prints 'lsa_open_policy(NULL) failed' and goes on). The status codes of the open call with different masks, of LsaQueryInformationPolicy on a view-only handle, LsaFreeMemory and LsaClose.
interface:
  signature: "NTSTATUS LsaOpenPolicy(PLSA_UNICODE_STRING system, PLSA_OBJECT_ATTRIBUTES, ACCESS_MASK, PLSA_HANDLE); NTSTATUS LsaQueryInformationPolicy(LSA_HANDLE, POLICY_INFORMATION_CLASS, PVOID *buffer); NTSTATUS LsaFreeMemory(PVOID); NTSTATUS LsaClose(LSA_HANDLE); ULONG LsaNtStatusToWinError(NTSTATUS)"
rules:
  open: "NULL system name, object attributes of 48 bytes (all zero but the length): STATUS_SUCCESS with a handle for POLICY_VIEW_LOCAL_INFORMATION (1), POLICY_LOOKUP_NAMES (0x800), both, MAXIMUM_ALLOWED and the mask 0 (handle given); the oracle's token is an elevated administrator (a non-elevated caller may see STATUS_ACCESS_DENIED for masks beyond view). Object attributes NULL: 0xC000000D. A system name of the empty string: success."
  close: "LsaClose of an open handle: 0; LsaClose(NULL): 0xC0000008 (STATUS_INVALID_HANDLE). A second close of the same handle is not safe (it corrupted the heap in the run that tried it, exit 0xC0000374) and is not tested."
  query_view_handle: "on a handle opened with POLICY_VIEW_LOCAL_INFORMATION: PolicyDnsDomainInformation (12), PolicyAccountDomainInformation (5), PolicyPrimaryDomainInformation (3), PolicyLsaServerRoleInformation (6), PolicyReplicaSourceInformation (7), PolicyDefaultQuotaInformation (8), PolicyLocalAccountDomainInformation (14) and class 15: STATUS_SUCCESS with a buffer (free it with LsaFreeMemory); classes 1, 2 and 4: 0xC0000022; classes 0, 9, 10, 11, 13 and 99: 0xC000000D. A NULL handle: 0xC0000008."
  account_domain: "the PolicyAccountDomainInformation buffer is a LSA_UNICODE_STRING (16 bytes) followed by a pointer to a SID (at offset 16): non-NULL, revision 1, at least one sub-authority; the PolicyDnsDomainInformation name length is even."
  status_mapping: "LsaNtStatusToWinError: STATUS_SUCCESS 0, STATUS_ACCESS_DENIED 5, STATUS_INVALID_PARAMETER 87, STATUS_INVALID_HANDLE 6."
errors:
  denied: "0xC0000022 STATUS_ACCESS_DENIED"
  bad_param: "0xC000000D"
  bad_handle: "0xC0000008"
side_effects: "LsaOpenPolicy creates a handle"
threading: "any thread"
ordering: []
timing:
  typical: "milliseconds (an RPC to the local security authority)"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing the DLLs named by the sheet by name. Observations are statuses, error codes, counts and offsets; never addresses, handles, process or thread ids, file names or times. Tests that need a process to survive a fault run the case in a child process of the same image (--child <case>) whose exit code is the answer (0x6000_0000 | status: the call returned; otherwise the exception code). Each test is kept in three files that make the same calls and write every third observation line, so one test serves as visible and held-out tests.
not_covered: >
  Remote system names, write access, the content of the SIDs (machine specific).
