# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/advapi32.dll/DuplicateTokenEx
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled.
summary: >
  Makes an independent copy of a token as a primary (type 1) or
  impersonation (type 2) token with a given impersonation level (0 anonymous
  .. 3 delegation) and access rights on the new handle. The source handle
  needs TOKEN_DUPLICATE.
interface:
  signature: "BOOL DuplicateTokenEx(HANDLE token, DWORD desired_access, LPSECURITY_ATTRIBUTES attributes, SECURITY_IMPERSONATION_LEVEL level, TOKEN_TYPE type, PHANDLE new_token)"
  token_rights: "TOKEN_ASSIGN_PRIMARY 0x1, TOKEN_DUPLICATE 0x2, TOKEN_IMPERSONATE 0x4, TOKEN_QUERY 0x8, TOKEN_QUERY_SOURCE 0x10, TOKEN_ADJUST_PRIVILEGES 0x20, TOKEN_ADJUST_GROUPS 0x40, TOKEN_ADJUST_DEFAULT 0x80, TOKEN_ADJUST_SESSIONID 0x100; TOKEN_ALL_ACCESS 0xF01FF (winnt.h)"
rules:
  matrix: "from a primary token: to type 1 (primary): levels 0-3 succeed (the result has no level), level 4 fails (1346); to type 2: levels 0-3 succeed with that level, 4 fails (1346); types 0 and 3 fail with ERROR_INVALID_PARAMETER (87) for every level. From an impersonation token of level L: to type 2 the level asked for may not exceed L (anonymous: only 0; identification: 0, 1; impersonation: 0-2; delegation: 0-3; a higher level fails with ERROR_BAD_IMPERSONATION_LEVEL 1346); to type 1 (primary) a source of level anonymous or identification fails for every level (1346), impersonation and delegation sources succeed (levels 0-3)"
  access: "desired access 0 means the source handle's access (0xF01FF from TOKEN_ALL_ACCESS, 0x2 from a TOKEN_DUPLICATE-only handle); the new handle gets exactly what was asked, with generic mapping: QUERY 0x8, TOKEN_READ 0x20008, TOKEN_WRITE 0x200E0, QUERY|DUPLICATE 0xA, GENERIC_ALL, MAXIMUM_ALLOWED and TOKEN_ALL_ACCESS 0xF01FF, ASSIGN_PRIMARY|DUPLICATE|QUERY 0xB"
  source_access: "the source handle needs TOKEN_DUPLICATE: a handle with only TOKEN_QUERY, only TOKEN_IMPERSONATE or only TOKEN_ASSIGN_PRIMARY fails with ERROR_ACCESS_DENIED (5); a TOKEN_DUPLICATE-only handle works"
  copy: "the copy has the same user, groups, privileges, integrity level, session and authentication id as the original and a different token id; changing the copy (disabling SeShutdownPrivilege) does not change the original"
  handle_attributes: "a NULL attributes pointer or bInheritHandle FALSE gives a non-inheritable handle; TRUE an inheritable one; an attributes block with a security descriptor (empty DACL) is accepted and the new handle still works (granted 0xA when the source had QUERY|DUPLICATE and the desired access was 0)"
errors:
  type: "type 0 or 3: ERROR_INVALID_PARAMETER (87)"
  level: "level 4 and up, or a level above the source's: ERROR_BAD_IMPERSONATION_LEVEL (1346)"
  access: "source without TOKEN_DUPLICATE: ERROR_ACCESS_DENIED (5)"
side_effects: "creates a token object and a handle"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
