# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/QueryServiceObjectSecurity.yaml
id: windows/api/advapi32.dll/QueryServiceObjectSecurity
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran twice with identical output, each run in a fresh scratch directory; the tests create throwaway services named PolySpecSvc* with the test program's own image as the service process, and delete them again; the non-elevated observations were also made through the runner's -Interactive mode (a UAC-filtered token)"
  observed_by: spec-win-services
  date: 2026-11-17
sources: "Observations of our own test programs on the machine above and one-off probes (a PowerShell script that calls the same functions, a 30 second timing probe, a run through the runner's interactive session for the non-elevated caller). Microsoft Learn: \"Service Control Manager\", \"Service Security and Access Rights\", \"Service Functions\", the page of each function; winsvc.h, winnt.h, winerror.h for constants and layouts. The imports of the installers, the updater, setup.exe and elevation_service.exe of Google Chrome (names only, survey-chrome-installer) say which calls matter. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed. The facts the entries share are in specs/windows/advapi32.dll/SERVICES.md."
summary: "Reads the security descriptor of a service or of the manager as a self-relative descriptor in the caller's buffer (owner, group, DACL, SACL by the information class). The default descriptors are in SERVICES.md section 2; converted with ConvertSecurityDescriptorToStringSecurityDescriptorW they are the SDDL strings listed there."
shared_facts: "Sections 2 of specs/windows/advapi32.dll/SERVICES.md, copied here so that this sheet stands alone:\n\n## 2. Handles, rights and the default security descriptors\n\n- **Manager handle** (`OpenSCManagerW`): rights SC_MANAGER_CONNECT 0x1, CREATE_SERVICE 0x2, ENUMERATE_SERVICE 0x4,\n  LOCK 0x8, QUERY_LOCK_STATUS 0x10, MODIFY_BOOT_CONFIG 0x20, ALL_ACCESS 0xF003F. `CreateServiceW` needs CREATE_SERVICE,\n  `EnumServicesStatusExW` ENUMERATE_SERVICE; `OpenServiceW` needs no particular right.\n- **Service handle**: SERVICE_QUERY_CONFIG 0x1, CHANGE_CONFIG 0x2, QUERY_STATUS 0x4, ENUMERATE_DEPENDENTS 0x8, START\n  0x10, STOP 0x20, PAUSE_CONTINUE 0x40, INTERROGATE 0x80, USER_DEFINED_CONTROL 0x100, ALL_ACCESS 0xF01FF, plus DELETE,\n  READ_CONTROL, WRITE_DAC, WRITE_OWNER. Each call checks its right on the handle and fails with ERROR_ACCESS_DENIED (5)\n  without it.\n- **Default descriptor of a new service** (owner and group `SY`; as SDDL):\n  `D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU)`\n  and the SACL `S:(AU;FA;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;WD)` (readable only with ACCESS_SYSTEM_SECURITY). So SYSTEM may\n  query the configuration and status, list dependents, start, stop, pause, interrogate and read the descriptor but\n  not change or delete the service; Administrators have every right; interactive and service logon users may query\n  the configuration and status, list dependents, interrogate, send user-defined controls and read the descriptor;\n  nobody else gets any right.\n- **Default descriptor of the manager**: `D:(A;;CC;;;AU)(A;;CCLCRPRC;;;IU)(A;;CCLCRPRC;;;SU)(A;;CCLCRPWPRC;;;SY)(A;;KA;;;BA)(A;;CC;;;AC)(A;;CC;;;S-1-15-3-1024-528118966-3876874398-709513571-1907873084-3598227634-3698730060-278077788-3990600205)`\n  `S:(AU;FA;KA;;;WD)(AU;OIIOFA;GA;;;WD)`. Everybody authenticated may connect; only Administrators may create\n  services, lock the database or change its boot configuration.\n- Closing the last handle of a service that was marked for deletion removes it (and its key) a few milliseconds\n  later: a program that deletes a service and creates one of the same name at once can still get\n  ERROR_SERVICE_MARKED_FOR_DELETE (1072) for a moment.\n\n**What a caller that is not elevated gets.** On Windows a process that is not elevated has Administrators only as a\ndeny-only group, and the descriptors above then give it no creating, starting, stopping, changing, deleting or\ndescriptor-writing right. Observed with a really non-elevated token (the oracle's interactive session, UAC filtered):\n`OpenSCManagerW(SC_MANAGER_ALL_ACCESS)` fails with 5 on the first call; CONNECT, ENUMERATE_SERVICE, QUERY_LOCK_STATUS,\nGENERIC_READ and MAXIMUM_ALLOWED work; CREATE_SERVICE, LOCK, MODIFY_BOOT_CONFIG fail with 5; on an existing system\nservice QUERY_CONFIG, QUERY_STATUS, INTERROGATE, READ_CONTROL work and START, STOP, PAUSE_CONTINUE, CHANGE_CONFIG,\nDELETE, WRITE_DAC, USER_DEFINED_CONTROL fail with 5; the enumeration works. The test programs make their non-elevated\ncaller with a restricted copy of their own token (Administrators deny-only, privileges removed), which gives the same\nrefusals for the rights above. **Poly's design (ADR 0171, the owner's elevation decision) decides whether Poly's\nprograms are elevated** (the survey recommends: every process is, and the Install click is the consent); the sheets\nstate what a caller without Administrators gets, whichever way it comes to be one.\n"
interface:
  signature: "BOOL QueryServiceObjectSecurity(SC_HANDLE h, SECURITY_INFORMATION info, PSECURITY_DESCRIPTOR sd, DWORD size, LPDWORD needed)"
  result: "TRUE, or FALSE with the last error set"
rules:
  "default of a new service": "owner and group SY; DACL D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU); with ACCESS_SYSTEM_SECURITY the SACL S:(AU;FA;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;WD)"
  "default of the manager": "D:(A;;CC;;;AU)(A;;CCLCRPRC;;;IU)(A;;CCLCRPRC;;;SU)(A;;CCLCRPWPRC;;;SY)(A;;KA;;;BA)(A;;CC;;;AC)(A;;CC;;;S-1-15-3-1024-528118966-3876874398-709513571-1907873084-3598227634-3698730060-278077788-3990600205) and the SACL S:(AU;FA;KA;;;WD)(AU;OIIOFA;GA;;;WD)"
  classes: "OWNER alone gives O:SY, GROUP alone G:SY, DACL alone the DACL; no class (0) is 87; the SACL through a handle without ACCESS_SYSTEM_SECURITY is 5; with it (an administrator with the security privilege) it works, alone and together with the DACL"
  "size protocol": "a call without buffer fails with 122 and reports the size; the second call with it succeeds; a buffer of 16 bytes for the manager's descriptor: 122 with a larger size"
  rights: "READ_CONTROL on the handle (5 without; a connect-only manager handle: 5)"
errors:
  insufficient_buffer: "122"
  invalid_parameter: "87"
  access_denied: "5"
side_effects: "none"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond"
  guarantees: "none"
tests:
  visible: 1
  held_out: 1
building_tests: "Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). The program is also its own service: started by the service control manager with `--child <mode>` on its command line (the service's ImagePath) it calls StartServiceCtrlDispatcherW, registers a handler, reports its status as the mode says (run, slow, pend, ckpt, crash, exitcode, failexit, noaccept, pause, who, stopslow, runex, exret, badname, nullname, badstate, exit_early, no_dispatch) and appends what it sees to `<image>.rep`, which the test prints after the service has stopped. Observations are error codes, states, counts and booleans, never process ids, handles, times or the path of the image (printed as <image>). Every wait is bounded; a test ends its service even when a step fails. The tests run in the SSH logon session of the oracle (session 0) as an elevated administrator; the non-elevated caller is a restricted copy of the test's token made with CreateRestrictedToken (Administrators deny-only, privileges removed) used as the thread's impersonation token."
not_covered: "the layout of the self-relative bytes (the tests compare the SDDL text), descriptors set by other programs; the A variants, the services of other processes (share-process services started by name), drivers, boot and system start, delayed auto start at boot, services of other accounts than LocalSystem (LocalService and NetworkService cannot read the test program's directory under the runner's scratch path: their identities are in SERVICES.md from a run elsewhere), 32-bit callers (the WOW64 value), the Windows event log entries the manager writes, group and tag ordering."
