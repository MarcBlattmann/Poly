id: windows/api/advapi32.dll/CreateServiceW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran twice with identical output, each run in a fresh scratch directory; the tests create throwaway services named PolySpecSvc* with the test program's own image as the service process, and delete them again; the non-elevated observations were also made through the runner's -Interactive mode (a UAC-filtered token)"
  observed_by: spec-win-services
  date: 2026-11-17
sources: "Observations of our own test programs on the machine above and one-off probes (a PowerShell script that calls the same functions, a 30 second timing probe, a run through the runner's interactive session for the non-elevated caller). Microsoft Learn: \"Service Control Manager\", \"Service Security and Access Rights\", \"Service Functions\", the page of each function; winsvc.h, winnt.h, winerror.h for constants and layouts. The imports of the installers, the updater, setup.exe and elevation_service.exe of Google Chrome (names only, survey-chrome-installer) say which calls matter. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed. The facts the entries share are in specs/windows/advapi32.dll/SERVICES.md."
summary: "Creates a service: a key under HKLM\\SYSTEM\\CurrentControlSet\\Services with Type, Start, ErrorControl, ImagePath, ObjectName and, when given, DisplayName and DependOnService (SERVICES.md section 1), and returns a handle with the access asked for. Google's updater creates its two services this way (own process, auto start, error control normal, LocalSystem, dependency RPCSS) and Chrome's setup creates the elevation service (demand start). Only the manager handle's CREATE_SERVICE right and Administrators allow it."
shared_facts: "Sections 1, 2 of specs/windows/advapi32.dll/SERVICES.md, copied here so that this sheet stands alone:\n\n## 1. The service database and the registry\n\nA service is a key `HKLM\\SYSTEM\\CurrentControlSet\\Services\\<name>`; the names are case-insensitive, 1 to 256 UTF-16\nunits, no `\\` or `/` (ERROR_INVALID_NAME 123), unique among services. `CreateServiceW` writes exactly these values\n(and no subkeys); a program can read them with the registry calls:\n\n| Value | Kind | Written | Content |\n|---|---|---|---|\n| `Type` | DWORD | always | 0x10 own process, 0x20 share process, 0x110 own process interactive, 0x1 kernel driver |\n| `Start` | DWORD | always | 2 auto, 3 demand, 4 disabled (0 boot and 1 system are valid for drivers only) |\n| `ErrorControl` | DWORD | always | 0 ignore, 1 normal, 2 severe, 3 critical |\n| `ImagePath` | REG_EXPAND_SZ | always | the text as given (quotes, arguments, `%VAR%` kept); QueryServiceConfigW returns it with variables expanded |\n| `DisplayName` | REG_SZ | only when a display name was given | a service created without one has no such value, and its display name is its name |\n| `ObjectName` | REG_SZ | always | `LocalSystem` for a NULL account and for `LocalSystem`; otherwise the account as given (`NT AUTHORITY\\LocalService`) |\n| `DependOnService` | REG_MULTI_SZ | only for a non-empty list | the names, in order; an empty list removes the value |\n| `Description` | REG_SZ | `ChangeServiceConfig2W` level 1 with text | removed for an empty text and for a NULL pointer |\n| `FailureActions` | REG_BINARY | level 2 | see the sheet of `ChangeServiceConfig2W` (reset period, offsets 0, count, offset 0x14, then type and delay pairs) |\n| `FailureActionsOnNonCrashFailures` | DWORD | level 4 | the flag |\n| `DelayedAutostart` | DWORD | level 3 | 1 or 0 (written for both) |\n| `ServiceSidType` | DWORD | level 5 | 0 none, 1 unrestricted, 3 restricted |\n| `PreshutdownTimeout` | DWORD | level 7 | milliseconds (the default, 10000, is not stored) |\n| `DeleteFlag` | DWORD 1 | `DeleteService` | the service is marked for deletion; the key goes when the last handle closes |\n| `WOW64` | DWORD 0x14c | when a **32-bit** program created the service | seen on the services Google's 32-bit updater creates (survey, 2026-11-17); the test programs here are 64-bit |\n\nWhat Google's programs leave in the database (survey `docs/windows/chrome-installer-plan.md`): the two updater\nservices per version `GoogleUpdaterService<ver>` and `GoogleUpdaterInternalService<ver>` (own process, `Start` 2,\n`ErrorControl` 1, account LocalSystem, `DependOnService` `RPCSS`, a `Description`, `WOW64` 0x14c, `ImagePath` =\n`\"…\\updater.exe\" --system --windows-service --service=update` or `update-internal`), and Chrome's\n`GoogleChromeElevationService` (own process, `Start` 3, `ErrorControl` 1, LocalSystem, depends on `RPCSS`). No\n`FailureActions`, no `DelayedAutostart`, no `ServiceSidType` value: of `ChangeServiceConfig2W` only the description is\nused. The updater **deletes and creates its services again** when it updates itself and when it uninstalls.\n\n## 2. Handles, rights and the default security descriptors\n\n- **Manager handle** (`OpenSCManagerW`): rights SC_MANAGER_CONNECT 0x1, CREATE_SERVICE 0x2, ENUMERATE_SERVICE 0x4,\n  LOCK 0x8, QUERY_LOCK_STATUS 0x10, MODIFY_BOOT_CONFIG 0x20, ALL_ACCESS 0xF003F. `CreateServiceW` needs CREATE_SERVICE,\n  `EnumServicesStatusExW` ENUMERATE_SERVICE; `OpenServiceW` needs no particular right.\n- **Service handle**: SERVICE_QUERY_CONFIG 0x1, CHANGE_CONFIG 0x2, QUERY_STATUS 0x4, ENUMERATE_DEPENDENTS 0x8, START\n  0x10, STOP 0x20, PAUSE_CONTINUE 0x40, INTERROGATE 0x80, USER_DEFINED_CONTROL 0x100, ALL_ACCESS 0xF01FF, plus DELETE,\n  READ_CONTROL, WRITE_DAC, WRITE_OWNER. Each call checks its right on the handle and fails with ERROR_ACCESS_DENIED (5)\n  without it.\n- **Default descriptor of a new service** (owner and group `SY`; as SDDL):\n  `D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU)`\n  and the SACL `S:(AU;FA;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;WD)` (readable only with ACCESS_SYSTEM_SECURITY). So SYSTEM may\n  query the configuration and status, list dependents, start, stop, pause, interrogate and read the descriptor but\n  not change or delete the service; Administrators have every right; interactive and service logon users may query\n  the configuration and status, list dependents, interrogate, send user-defined controls and read the descriptor;\n  nobody else gets any right.\n- **Default descriptor of the manager**: `D:(A;;CC;;;AU)(A;;CCLCRPRC;;;IU)(A;;CCLCRPRC;;;SU)(A;;CCLCRPWPRC;;;SY)(A;;KA;;;BA)(A;;CC;;;AC)(A;;CC;;;S-1-15-3-1024-528118966-3876874398-709513571-1907873084-3598227634-3698730060-278077788-3990600205)`\n  `S:(AU;FA;KA;;;WD)(AU;OIIOFA;GA;;;WD)`. Everybody authenticated may connect; only Administrators may create\n  services, lock the database or change its boot configuration.\n- Closing the last handle of a service that was marked for deletion removes it (and its key) a few milliseconds\n  later: a program that deletes a service and creates one of the same name at once can still get\n  ERROR_SERVICE_MARKED_FOR_DELETE (1072) for a moment.\n\n**What a caller that is not elevated gets.** On Windows a process that is not elevated has Administrators only as a\ndeny-only group, and the descriptors above then give it no creating, starting, stopping, changing, deleting or\ndescriptor-writing right. Observed with a really non-elevated token (the oracle's interactive session, UAC filtered):\n`OpenSCManagerW(SC_MANAGER_ALL_ACCESS)` fails with 5 on the first call; CONNECT, ENUMERATE_SERVICE, QUERY_LOCK_STATUS,\nGENERIC_READ and MAXIMUM_ALLOWED work; CREATE_SERVICE, LOCK, MODIFY_BOOT_CONFIG fail with 5; on an existing system\nservice QUERY_CONFIG, QUERY_STATUS, INTERROGATE, READ_CONTROL work and START, STOP, PAUSE_CONTINUE, CHANGE_CONFIG,\nDELETE, WRITE_DAC, USER_DEFINED_CONTROL fail with 5; the enumeration works. The test programs make their non-elevated\ncaller with a restricted copy of their own token (Administrators deny-only, privileges removed), which gives the same\nrefusals for the rights above. **Poly's design (ADR 0171, the owner's elevation decision) decides whether Poly's\nprograms are elevated** (the survey recommends: every process is, and the Install click is the consent); the sheets\nstate what a caller without Administrators gets, whichever way it comes to be one.\n"
interface:
  signature: "SC_HANDLE CreateServiceW(SC_HANDLE scm, LPCWSTR name, LPCWSTR display, DWORD access, DWORD type, DWORD start, DWORD error, LPCWSTR path, LPCWSTR group, LPDWORD tag, LPCWSTR deps, LPCWSTR account, LPCWSTR password)"
  result: "a service handle, or NULL with the last error set"
rules:
  name: "1 to 256 UTF-16 units (257: 1783), no backslash and no slash, not empty (123), NULL is 487 (ERROR_INVALID_ADDRESS), unique ignoring case (1073 ERROR_SERVICE_EXISTS, also for a name that differs by case)"
  "display name": "NULL means the name (no DisplayName value); at most 256 units (257: 1783); the same display name as another service's is accepted; a display name equal to another service's NAME (also in another case) is refused with 1078 (ERROR_DUPLICATE_SERVICE_NAME)"
  "binary path": "NULL is 487, empty is 87; any other text is accepted (a file that does not exist, text that is not a path), stored as given"
  type: "0x10 and 0x20 accepted, 0x110 (own process interactive) accepted, 0x1 (driver) accepted with demand start and refused (87) with boot start for the path of the test; 0, 0x99, 0x30 (own | share) are 87"
  "start type": "2 auto, 3 demand and 4 disabled accepted for a process service; 0 (boot) and 1 (system) are 87 for a service that is not a driver; 5 and 0xFFFFFFFF are 87"
  "error control": "0, 1, 2 and 3 accepted; 4 is 87"
  dependencies: "a double-NUL-terminated list; a name that does not exist is accepted (it fails at start, 1075); a service that lists itself is 1059 (ERROR_CIRCULAR_DEPENDENCY)"
  account: "NULL and \"LocalSystem\" are LocalSystem (ObjectName LocalSystem); NT AUTHORITY\\LocalService and NT AUTHORITY\\NetworkService accepted, stored as given; an account that does not exist is 1057 (ERROR_INVALID_SERVICE_ACCOUNT)"
  "returned handle": "has the access asked for, nothing more (a handle created with QUERY_STATUS only cannot control, start, delete or read the configuration: 5); SERVICE_ALL_ACCESS gives every service right"
  "defaults read back": "QueryServiceConfigW: group empty, tag 0, no dependencies, LocalSystem, display name = name; the status is STOPPED with exit code 1077 (never started)"
  registry: "see SERVICES.md section 1; no value other than those listed, no subkey"
  rights: "CREATE_SERVICE on the manager handle (a connect-only handle: 5); a caller without Administrators gets 5 already from OpenSCManagerW(ALL_ACCESS) and from a connect handle, and nothing is created"
errors:
  exists: "1073"
  duplicate_display: "1078"
  invalid_name: "123"
  null_pointer: "487"
  invalid_parameter: "87"
  circular: "1059"
  bad_account: "1057"
  too_long: "1783"
  access_denied: "5"
  marked_for_delete: "1072 while a deleted service of that name still has open handles"
side_effects: "a new service in the database and in the registry; the previous service of the same name must be gone (all handles closed, then a few milliseconds)"
threading: "serialised by the manager"
ordering: 
  - "a service that was deleted and whose handles were closed disappears a few milliseconds later: creating the same name at once can still give 1072"
timing:
  typical: "a few milliseconds"
  guarantees: "none"
tests:
  visible: 3
  held_out: 1
building_tests: "Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). The program is also its own service: started by the service control manager with `--child <mode>` on its command line (the service's ImagePath) it calls StartServiceCtrlDispatcherW, registers a handler, reports its status as the mode says (run, slow, pend, ckpt, crash, exitcode, failexit, noaccept, pause, who, stopslow, runex, exret, badname, nullname, badstate, exit_early, no_dispatch) and appends what it sees to `<image>.rep`, which the test prints after the service has stopped. Observations are error codes, states, counts and booleans, never process ids, handles, times or the path of the image (printed as <image>). Every wait is bounded; a test ends its service even when a step fails. The tests run in the SSH logon session of the oracle (session 0) as an elevated administrator; the non-elevated caller is a restricted copy of the test's token made with CreateRestrictedToken (Administrators deny-only, privileges removed) used as the thread's impersonation token."
not_covered: "group and tag arguments, passwords of real accounts, the A variant, a name or path with characters outside the BMP; the A variants, the services of other processes (share-process services started by name), drivers, boot and system start, delayed auto start at boot, services of other accounts than LocalSystem (LocalService and NetworkService cannot read the test program's directory under the runner's scratch path: their identities are in SERVICES.md from a run elsewhere), 32-bit callers (the WOW64 value), the Windows event log entries the manager writes, group and tag ordering."
