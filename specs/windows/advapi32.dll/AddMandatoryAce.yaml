# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/advapi32.dll/AddMandatoryAce
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled.
summary: >
  Appends a SYSTEM_MANDATORY_LABEL_ACE (type 0x11) whose mask is the policy
  (0 to 7: NO_WRITE_UP 1, NO_READ_UP 2, NO_EXECUTE_UP 4) and whose SID must
  have the mandatory-label authority S-1-16 (any number of sub-authorities
  is accepted). The flags may be the inheritance flags 1, 2, 4, 8 and 0x10
  only. An ACL of revision 2 is accepted with revision argument 2 (no bump
  to 3).
interface:
  signature: "BOOL AddMandatoryAce(PACL acl, DWORD acl_revision, DWORD ace_flags, DWORD mandatory_policy, PSID label_sid)"
  layout: "ACL (winnt.h): an 8-byte header {Revision (byte), Sbz1 (byte, 0), AclSize (16 bits), AceCount (16 bits), Sbz2 (16 bits)} followed by the ACEs one after the other, all fields little-endian. Each ACE starts with {AceType (byte), AceFlags (byte), AceSize (16 bits)}; access-allowed (type 0), access-denied (1), system-audit (2) and mandatory-label (0x11) ACEs continue with a 32-bit mask (the policy for a label) and the SID, so their size is 8 + the SID length (20 for the 12-byte S-1-1-0 and S-1-1-0-like SIDs, 24 for S-1-5-32-544, 76 for a 15-sub-authority SID). ACL revisions 2, 3 and 4 are the valid ones. Buffers in the tests are 8-byte aligned unless noted."
  sid: "SIDs are valid when the revision byte is 1 and the sub-authority count at most 15 (see IsValidSid)."
  constants: "SYSTEM_MANDATORY_LABEL_NO_WRITE_UP 1, NO_READ_UP 2, NO_EXECUTE_UP 4 (winnt.h)"
rules:
  sids: "S-1-16-0, 4096, 8192, 8448, 12288, 16384, 20480, 28672, 4097, 65536 and 4294967295 succeed (ACE size 20, type 0x11, flags 0, mask 1 for policy 1, the SID's sub-authority bytes as given); S-1-16-4096-1 (24 bytes) and S-1-16-4096-1-2 (28), and SIDs with authority 16 and 0, 1, 2, 3 sub-authorities (16, 20, 24, 28 byte ACEs) succeed too"
  non_label_sids: "a valid SID with another authority fails: S-1-5-18, S-1-5-4096, S-1-1-0, S-1-0-0, S-1-3-0, S-1-5-32-544, S-1-15-2-1, S-1-5-21-1-2-3-4096 and the authority-5 SIDs with 0, 1, 15 sub-authorities"
  policy: "policies 0 to 7 are stored as the ACE mask (bytes 4..7); 8, 0x10, 0x80, 0x100, 0xFFFF, 0x80000000 and 0xFFFFFFFF fail"
  flags: "flags 0, 1, 2, 3, 4, 8, 0x10 are stored in byte 1; 0x20, 0x40, 0x80, 0xFF, 0x100 and 0xFFFFFFFF fail"
  revision: "after a successful add the revision of the ACL is the larger of its own and the argument: on a revision 2 ACL the arguments 0, 1, 2 give 2, 3 gives 3 and 4 gives 4; on revision 3 the arguments 0..3 give 3 and 4 gives 4; on revision 4 the arguments 0..4 give 4 (0 and 1 are accepted); the arguments 5, 6, 0xFF, 0x100, 0x10002 and 0xFFFFFFFF fail on every ACL and leave it untouched (the whole 32-bit value is compared); two adds in a row with arguments (2, 3), (3, 2), (2, 4), (4, 2), (3, 4), (4, 3) leave the ACL at 3, 3, 4, 4, 4, 4 (after the first add its revision is the first argument); on a revision 2 ACL with argument 2 the ACE is added and the revision stays 2; AddMandatoryAce with argument 3 raises revision 2 to 3"
  position: "the label ACE is appended after the existing ACEs: audit, label, audit, label gives types 2, 0x11, 2, 0x11 at offsets 8, 28, 48, 68; several label ACEs can be added to one ACL (three adds with 4096, 12288, 4096 all succeed)"
  space: "the ACE needs 20 bytes of free room: an ACL with AclSize 28 or more takes the first add (initialised with 28..31, rounded down to 28) and every smaller size tried (8 up to the size below) fails; the second add needs AclSize 48 (initialised with 48, 49 stores 48; the sizes just below fail); all failures are FALSE with ERROR_ALLOTTED_SPACE_EXCEEDED (1344), the ACL stays as it was and bytes beyond AclSize are never written"
  header: "damaged ACL headers: revision byte 0 or 1: FALSE, ERROR_INVALID_ACL (1336); revision byte 5 or 255: FALSE, ERROR_REVISION_MISMATCH (1306); AclSize field 0, 4 or 7: FALSE, ERROR_INVALID_ACL (1336); AclSize 8 (no room): FALSE, ERROR_ALLOTTED_SPACE_EXCEEDED (1344); count 1, 200 or 0xFFFF with no ACE present: FALSE, ERROR_INVALID_ACL (1336); Sbz1 or Sbz2 = 1 and an AclSize of 1000: success"
errors:
  sid_not_label: "a valid SID that is not in the mandatory-label authority: FALSE, ERROR_INVALID_PARAMETER (87)"
  sid_invalid: "an invalid SID (revision 0, 2, 3, 255, count 16 or more): FALSE, ERROR_INVALID_SID (1337)"
  policy_flags: "a policy above 7 or flags other than the inheritance flags: FALSE, ERROR_INVALID_PARAMETER (87)"
  space: "no room: FALSE, ERROR_ALLOTTED_SPACE_EXCEEDED (1344)"
  revision: "revision argument above 4: FALSE, ERROR_REVISION_MISMATCH (1306)"
  acl: "damaged ACL: see header"
side_effects: "appends a label ACE to the ACL, may raise its revision"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Which ACL (SACL) a label belongs in and how labels are enforced. Adding to
  ACLs that are shared with kernel objects or security descriptors (see the
  descriptor functions), auditing semantics (the audit ACEs are only
  stored). Domain accounts and domain-relative well-known SIDs of a real
  domain, AppContainer and capability SIDs beyond their string forms,
  auditing (SACL entries are only stored, never evaluated), remote systems
  (the system-name arguments), Kerberos or NTLM logon tokens, tokens of
  other users.
