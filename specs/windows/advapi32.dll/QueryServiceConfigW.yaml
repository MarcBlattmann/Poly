# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/QueryServiceConfigW.yaml
id: windows/api/advapi32.dll/QueryServiceConfigW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran twice with identical output, each run in a fresh scratch directory; the tests create throwaway services named PolySpecSvc* with the test program's own image as the service process, and delete them again; the non-elevated observations were also made through the runner's -Interactive mode (a UAC-filtered token)"
  observed_by: spec-win-services
  date: 2026-11-17
sources: "Observations of our own test programs on the machine above and one-off probes (a PowerShell script that calls the same functions, a 30 second timing probe, a run through the runner's interactive session for the non-elevated caller). Microsoft Learn: \"Service Control Manager\", \"Service Security and Access Rights\", \"Service Functions\", the page of each function; winsvc.h, winnt.h, winerror.h for constants and layouts. The imports of the installers, the updater, setup.exe and elevation_service.exe of Google Chrome (names only, survey-chrome-installer) say which calls matter. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed. The facts the entries share are in specs/windows/advapi32.dll/SERVICES.md."
summary: "Returns the configuration of a service in a buffer the caller supplies: a QUERY_SERVICE_CONFIGW (type, start type, error control, path, group, tag, dependencies, account, display name) with the strings behind it in the same buffer. The updater uses it to compare the existing configuration with the one it wants."
shared_facts: "Sections 1 of specs/windows/advapi32.dll/SERVICES.md, copied here so that this sheet stands alone:\n\n## 1. The service database and the registry\n\nA service is a key `HKLM\\SYSTEM\\CurrentControlSet\\Services\\<name>`; the names are case-insensitive, 1 to 256 UTF-16\nunits, no `\\` or `/` (ERROR_INVALID_NAME 123), unique among services. `CreateServiceW` writes exactly these values\n(and no subkeys); a program can read them with the registry calls:\n\n| Value | Kind | Written | Content |\n|---|---|---|---|\n| `Type` | DWORD | always | 0x10 own process, 0x20 share process, 0x110 own process interactive, 0x1 kernel driver |\n| `Start` | DWORD | always | 2 auto, 3 demand, 4 disabled (0 boot and 1 system are valid for drivers only) |\n| `ErrorControl` | DWORD | always | 0 ignore, 1 normal, 2 severe, 3 critical |\n| `ImagePath` | REG_EXPAND_SZ | always | the text as given (quotes, arguments, `%VAR%` kept); QueryServiceConfigW returns it with variables expanded |\n| `DisplayName` | REG_SZ | only when a display name was given | a service created without one has no such value, and its display name is its name |\n| `ObjectName` | REG_SZ | always | `LocalSystem` for a NULL account and for `LocalSystem`; otherwise the account as given (`NT AUTHORITY\\LocalService`) |\n| `DependOnService` | REG_MULTI_SZ | only for a non-empty list | the names, in order; an empty list removes the value |\n| `Description` | REG_SZ | `ChangeServiceConfig2W` level 1 with text | removed for an empty text and for a NULL pointer |\n| `FailureActions` | REG_BINARY | level 2 | see the sheet of `ChangeServiceConfig2W` (reset period, offsets 0, count, offset 0x14, then type and delay pairs) |\n| `FailureActionsOnNonCrashFailures` | DWORD | level 4 | the flag |\n| `DelayedAutostart` | DWORD | level 3 | 1 or 0 (written for both) |\n| `ServiceSidType` | DWORD | level 5 | 0 none, 1 unrestricted, 3 restricted |\n| `PreshutdownTimeout` | DWORD | level 7 | milliseconds (the default, 10000, is not stored) |\n| `DeleteFlag` | DWORD 1 | `DeleteService` | the service is marked for deletion; the key goes when the last handle closes |\n| `WOW64` | DWORD 0x14c | when a **32-bit** program created the service | seen on the services Google's 32-bit updater creates (survey, 2026-11-17); the test programs here are 64-bit |\n\nWhat Google's programs leave in the database (survey `docs/windows/chrome-installer-plan.md`): the two updater\nservices per version `GoogleUpdaterService<ver>` and `GoogleUpdaterInternalService<ver>` (own process, `Start` 2,\n`ErrorControl` 1, account LocalSystem, `DependOnService` `RPCSS`, a `Description`, `WOW64` 0x14c, `ImagePath` =\n`\"…\\updater.exe\" --system --windows-service --service=update` or `update-internal`), and Chrome's\n`GoogleChromeElevationService` (own process, `Start` 3, `ErrorControl` 1, LocalSystem, depends on `RPCSS`). No\n`FailureActions`, no `DelayedAutostart`, no `ServiceSidType` value: of `ChangeServiceConfig2W` only the description is\nused. The updater **deletes and creates its services again** when it updates itself and when it uninstalls.\n"
interface:
  signature: "BOOL QueryServiceConfigW(SC_HANDLE service, LPQUERY_SERVICE_CONFIGW config, DWORD size, LPDWORD needed)"
  result: "TRUE, or FALSE with the last error set; `needed` is set when the buffer was too small"
rules:
  "size protocol": "a call without buffer fails with 122 (ERROR_INSUFFICIENT_BUFFER) and reports a size of at least 64 plus the strings (64 bytes of structure on x64); a 40-byte buffer fails with 122 and reports a size above 64; the second call with the size reported succeeds; a NULL size pointer is 487"
  fields: "type (0x10), start (3 default), error control (1 default), the path as stored with variables expanded (a service created with %SystemRoot% reads back with the expanded directory), group \"\" (an empty string), tag 0, the dependencies as a double-NUL-terminated list (\"RPCSS\" then \"EventLog\" for two; an empty list has two NUL units: the size grows by 4 bytes), the account (\"LocalSystem\", or the name as given), the display name (the name when none was given)"
  "after changes": "the data always is the current configuration, also read through a handle opened earlier; a service marked for deletion reads back with start type 4"
  rights: "SERVICE_QUERY_CONFIG (5 without; QUERY_STATUS alone is not enough); a manager handle is 6"
errors:
  insufficient_buffer: "122"
  null_pointer: "487"
  access_denied: "5"
  invalid_handle: "6"
side_effects: "none"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond"
  guarantees: "none"
tests:
  visible: 1
  held_out: 1
building_tests: "Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). The program is also its own service: started by the service control manager with `--child <mode>` on its command line (the service's ImagePath) it calls StartServiceCtrlDispatcherW, registers a handler, reports its status as the mode says (run, slow, pend, ckpt, crash, exitcode, failexit, noaccept, pause, who, stopslow, runex, exret, badname, nullname, badstate, exit_early, no_dispatch) and appends what it sees to `<image>.rep`, which the test prints after the service has stopped. Observations are error codes, states, counts and booleans, never process ids, handles, times or the path of the image (printed as <image>). Every wait is bounded; a test ends its service even when a step fails. The tests run in the SSH logon session of the oracle (session 0) as an elevated administrator; the non-elevated caller is a restricted copy of the test's token made with CreateRestrictedToken (Administrators deny-only, privileges removed) used as the thread's impersonation token."
not_covered: "the group and tag values of services that have them; the A variants, the services of other processes (share-process services started by name), drivers, boot and system start, delayed auto start at boot, services of other accounts than LocalSystem (LocalService and NetworkService cannot read the test program's directory under the runner's scratch path: their identities are in SERVICES.md from a run elsewhere), 32-bit callers (the WOW64 value), the Windows event log entries the manager writes, group and tag ordering."
