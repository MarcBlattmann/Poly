# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/advapi32.dll/ConvertStringSidToSidW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled.
summary: >
  Parses a SID string ("S-1-5-18" or a two-letter alias from sddl.h such as
  "SY") into a SID allocated with LocalAlloc (the caller frees it with
  LocalFree).
interface:
  signature: "BOOL ConvertStringSidToSidW(LPCWSTR string, PSID* sid)"
  layout: "SID (winnt.h): byte 0 Revision (1), byte 1 SubAuthorityCount (0..15 valid), bytes 2..7 IdentifierAuthority (six bytes, big-endian value), then SubAuthority[count] as little-endian 32-bit values; length 8 + 4 * count (at most 68). SECURITY_MAX_SID_SIZE is 68."
rules:
  numeric: "accepted: \"S-1-5-18\", \"s-1-5-18\" (the S is case-insensitive), 0x or 0X prefixed hexadecimal numbers (\"S-1-0x5-18\" is S-1-5-18, \"S-1-5-0x12\" is S-1-5-18), a leading zero stays decimal (\"S-1-5-012\" is S-1-5-12), \"S-1-5-18-0\"; the authority may be up to 281474976710655 (hex form \"S-1-0xFFFFFFFFFFFF-1\"), 4294967296 and above are printed back in hex; a sub-authority above 4294967295 saturates to 4294967295"
  revision: "a revision other than 1 is accepted and stored: \"S-2-5-18\" and \"S-0-5-18\" return TRUE with a 12-byte SID whose revision byte is 2 or 0 (so IsValidSid / ConvertSidToStringSidW then fail)"
  subauthorities: "fifteen sub-authorities give a 68-byte valid SID; sixteen are accepted (72 bytes, count 16, invalid)"
  rejected: "rejected with ERROR_INVALID_SID (1337) and the out pointer unchanged: a trailing or leading space, a trailing \"-\", \"S-1-5\" (no sub-authority), \"S-1\", \"S-1-\", \"S\", \"S-\", the empty string, \"X-1-5-18\", an authority above 281474976710655, \"S-1-5--18\", \"S-1-5-+18\", \"S-1-5-1a\""
  aliases: "case-insensitive two-letter aliases: AN S-1-5-7, AO S-1-5-32-548, AU S-1-5-11, BA S-1-5-32-544, BG -546, BO -551, BU -545, CD -574, CG S-1-3-1, CO S-1-3-0, CY -569, ED S-1-5-9, ER -573, ES -576, HA -578, HI S-1-16-12288, IU S-1-5-4, LS S-1-5-19, LU S-1-5-32-559, LW S-1-16-4096, ME S-1-16-8192, MP S-1-16-8448, MU S-1-5-32-558, NO -556, NS S-1-5-20, NU S-1-5-2, OW S-1-3-4, PO S-1-5-32-550, PS S-1-5-10, PU S-1-5-32-547, RA -575, RC S-1-5-12, RD -555, RE -552, RM -580, RU -554, SI S-1-16-16384, SO S-1-5-32-549, SS S-1-18-2, SU S-1-5-6, SY S-1-5-18, UD S-1-5-84-0-0-0-0-0, WD S-1-1-0, WR S-1-5-33, AC S-1-15-2-1; \"sy\", \"Sy\" and \"wd\" work too"
  machine_aliases: "LA and LG give the computer's own SID with RID 500 and 501 (printed in the tests as \"S-1-5-21-<machine>-500\" and \"-501\")"
  domain_aliases: "on a computer that is not in a domain, CA, DA, DC, DD, DG, DU, EA, PA, RO, RS and SA fail (1337), like the unknown AP, CN, ZZ, S, SYS, A and \"\""
errors:
  invalid: "FALSE with last error ERROR_INVALID_SID (1337), *sid unchanged"
side_effects: "allocates the SID with LocalAlloc"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
