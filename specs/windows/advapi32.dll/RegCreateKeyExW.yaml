# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/advapi32.dll/RegCreateKeyExW.yaml
id: windows/api/advapi32.dll/RegCreateKeyExW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as an administrator with its elevated token (the programs write below HKEY_LOCAL_MACHINE); every test is a 32-bit (i686) program, which runs under WOW64 on the machine, ran twice with identical output, and removed every key it made"
  observed_by: "spec-win-wow64-registry"
  date: "2026-11-20"
sources: "Observations of our own 32-bit test programs on the machine above (keys of a GUID and a vendor name of the programs' own, looked at in both physical places through the 64-bit view, which does no redirection). Microsoft Learn: \"Registry Redirector\", \"Registry Keys Affected by WOW64\", \"Accessing an Alternate Registry View\", \"Registry Key Security and Access Rights\", RegCreateKeyExW, RegCreateKeyExA, RegCreateKeyW, RegOpenKeyExW, RegOpenKeyW, RegDeleteKeyExW, RegDeleteKeyW, NtCreateKey, NtOpenKey, NtQueryKey, \"OBJECT_ATTRIBUTES\"; winreg.h, winnt.h, winerror.h, winternl.h for constants and layouts. Wine's and ReactOS's code and tests were not used, no Microsoft binary was decompiled or disassembled."
summary: "Creates a registry key (and the keys on the way) or opens it when it exists, and returns ERROR_SUCCESS. In a 32-bit process the key is made in the 32-bit view of the registry (redirected below Wow6432Node) unless the access has KEY_WOW64_64KEY, and a call with no view bit follows the view of the open key it is relative to: a handle opened or made with KEY_WOW64_64KEY makes native keys, so a program that makes a key one level at a time below such a handle and then opens the full path with no view bit does not find it."
interface:
  signature: "LSTATUS RegCreateKeyExW(HKEY hKey, LPCWSTR lpSubKey, DWORD Reserved, LPWSTR lpClass, DWORD dwOptions, REGSAM samDesired, const SECURITY_ATTRIBUTES *lpSecurityAttributes, PHKEY phkResult, LPDWORD lpdwDisposition)"
  result: "0 on success, otherwise a Win32 error code (not a last error)"
  disposition: "REG_CREATED_NEW_KEY 1, REG_OPENED_EXISTING_KEY 2, per view: a key of the other view of the same name does not count as existing"
rules:
  views: "A 32-bit process on 64-bit Windows (WOW64) sees the 32-bit view of the registry unless the access of the call has KEY_WOW64_64KEY (0x100), which asks for the native (64-bit) view, whose keys are the physical ones; KEY_WOW64_32KEY (0x200) asks for the 32-bit view explicitly. The physical key of the 32-bit view of a redirected key lives below Wow6432Node (spelled WOW6432Node in the registry as stored). Below HKEY_LOCAL_MACHINE\\Software every key is redirected to Software\\Wow6432Node\\<key> except the shared ones; below Software\\Classes only CLSID, Interface, DirectShow, Media Type and MediaFoundation are redirected, to Software\\Classes\\Wow6432Node\\<key>. Shared (one key for both views): Software\\Classes itself and its other subkeys (TypeLib, AppID), Software\\Microsoft\\Windows\\CurrentVersion\\App Paths and \\Policies, Software\\Policies, Software\\RegisteredApplications. Redirected, observed: Software and the vendor keys below it, Software\\Microsoft, ...\\CurrentVersion, ...\\Run, ...\\Uninstall, Software\\Classes\\CLSID, \\Interface, \\DirectShow, \\Media Type, \\MediaFoundation."
  inheritance: "A key made, opened or deleted below an open key without a view bit in the access is in the view of that open key: a key opened (or made) with KEY_WOW64_64KEY gives native keys below it; one opened with KEY_WOW64_32KEY or with no view bit gives keys of the 32-bit view; the predefined keys HKEY_LOCAL_MACHINE and HKEY_CLASSES_ROOT count as opened with no bit. A view bit in the call wins over the open key's view where the key asked for can lie in that view below the open key (the shared Software\\Classes opened with no bit: CLSID with KEY_WOW64_64KEY is the native CLSID, and with KEY_WOW64_64KEY opened, CLSID with KEY_WOW64_32KEY is the redirected one). The view is part of the open key's physical place: Software opened without KEY_WOW64_64KEY IS Software\\Wow6432Node (NtQueryKey says so), Software\\Classes\\CLSID opened without it is Software\\Classes\\Wow6432Node\\CLSID, so a key made below them lies below Wow6432Node whatever the bit of the call (below Software, a vendor key with KEY_WOW64_64KEY is still the 32-bit-view one); only a handle opened with KEY_WOW64_64KEY gives native keys. A path that names Wow6432Node itself is the physical key and is not redirected again, in every view."
  level_by_level: "creating CLSID\\{GUID} below HKEY_LOCAL_MACHINE\\Software\\Classes one level at a time (CLSID exists: disposition 2, {GUID} is new: 1) with the first call using each view choice and the second none: the Classes handle opened with no bit, with 32 or with 64 and the first create with no bit: 32-bit view, 32-bit view, native; with KEY_WOW64_32KEY on the first create: 32-bit view for every Classes handle; with KEY_WOW64_64KEY: native for every Classes handle; a view bit on the second call only: native only below a CLSID that is itself native (Classes opened with 64 and no bit on the first call, then 64: native; every other combination: 32-bit view, because the CLSID handle is then Classes\\Wow6432Node\\CLSID). Both levels in one call (CLSID\\{GUID}): the view of the Classes handle (none/32: 32-bit view, 64: native)."
  below_clsid: "creating {GUID} below Software\\Classes\\CLSID opened with no bit or 32: the 32-bit view whatever the bit of the call; opened with 64: native with no bit and with 64, the 32-bit view with 32."
  below_software: "creating Classes\\CLSID\\{GUID} below HKEY_LOCAL_MACHINE\\Software opened with no bit or 32: the 32-bit view (disposition 2, 2, 1); opened with 64: native. A vendor key (and its subkey) below Software: opened with no bit or 32: the 32-bit view whatever the bit of the call (a bit of 64 does not leave Wow6432Node); opened with 64: native with no bit and with 64, the 32-bit view with 32; in one call it is the same."
  from_the_root: "creating Software\\Classes\\CLSID\\{GUID} one level at a time from HKEY_LOCAL_MACHINE itself: the 32-bit view with no bit and with 32; native with 64 on the first call (the later levels follow the handle). The same for a vendor key."
  named_node: "creating Wow6432Node\\CLSID\\{GUID} below Software\\Classes (a path that names Wow6432Node) makes the 32-bit-view key in every view, also with a Classes handle opened with 64."
  reopening: "The step that failed in Google's updater setup: the key is made one level at a time with no view bit below a handle that was opened with KEY_WOW64_64KEY; it is then the native key, and a later open of the full path from HKEY_LOCAL_MACHINE with no view bit (the 32-bit view) or with KEY_WOW64_32KEY returns ERROR_FILE_NOT_FOUND (2); only KEY_WOW64_64KEY finds it (and the same from HKEY_CLASSES_ROOT). A key made in the 32-bit view is found with no bit and with KEY_WOW64_32KEY, and not with KEY_WOW64_64KEY."
  shared_keys: "a key made below a shared parent is one key for both views whatever the view (below Software\\Classes itself, TypeLib, AppID, App Paths, Policies, Software\\Policies and RegisteredApplications: found by both views); below the redirected parents (Software, Software\\Microsoft, ...\\CurrentVersion, ...\\Run, ...\\Uninstall, Classes\\CLSID, \\Interface, \\DirectShow, \\Media Type, \\MediaFoundation) the default view and KEY_WOW64_32KEY make a key only the 32-bit view finds, KEY_WOW64_64KEY one only the 64-bit view finds."
  hkcr: "below HKEY_CLASSES_ROOT the key is made in the 32-bit view (below HKEY_LOCAL_MACHINE\\Software\\Classes) whatever the bit of the call, from the root key and from HKEY_CLASSES_ROOT\\CLSID opened with any bit, except that a handle opened with KEY_WOW64_64KEY and a create with KEY_WOW64_64KEY makes the native key; the 32-bit key is then found by HKEY_CLASSES_ROOT\\CLSID\\{GUID} with no bit and with 32, the native one only with 64."
  empty_subkey: "an empty subkey name returns a new handle of the open key itself (disposition 2) in the view of that open key: a child opened below it is the native one for a CLSID handle opened with 64, the 32-bit one otherwise."
  both_bits: "KEY_WOW64_32KEY and KEY_WOW64_64KEY together: ERROR_INVALID_PARAMETER (87), nothing is made, opened or deleted."
  opening: "RegOpenKeyExW (which these programs also use) follows the same view rules as the create: the key found by a relative open below Software\\Classes opened with no bit or 32 is the 32-bit-view key with no bit and with 32, the native key with 64; below a handle opened with 64 it is the native key with no bit and with 64, the 32-bit key with 32; below Software the same (Classes\\CLSID\\{GUID} and the vendor key); below Software\\Classes\\CLSID opened with no bit or 32 the 32-bit-view key whatever the bit (opened with 64: native with no bit and 64, 32-bit with 32); from HKEY_LOCAL_MACHINE itself the full path finds the 32-bit key with no bit and 32, the native key with 64, and a path that names Wow6432Node finds the 32-bit key in every view; from HKEY_CLASSES_ROOT the same, and HKEY_CLASSES_ROOT\\CLSID opened with 64 opens the native key with no bit. An open with both bits: 87."
  x86_only: "everything above is about a 32-bit process; a 64-bit process makes native keys unless the access has KEY_WOW64_32KEY (not covered by these tests)."
errors:
  invalid_parameter: "ERROR_INVALID_PARAMETER (87): both view bits"
  invalid_handle: "ERROR_INVALID_HANDLE (6): a closed key handle or an invented one as hKey, for create and for open"
  success: "0 (ERROR_SUCCESS); disposition 1 or 2"
side_effects: "creates keys below HKEY_LOCAL_MACHINE (the programs remove them again)"
threading: "the registry is shared; the programs make keys under names of their own and nothing else touches them"
ordering: []
timing:
  typical: "well under a millisecond per call"
  guarantees: none
tests:
  visible: 4  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: "32-bit Rust tests (ADR 0075, ADR 0259: the line `// poly-arch: x86` makes the pipeline build them for i686-pc-windows-msvc), importing advapi32.dll and ntdll.dll by name, each carrying its own declarations (Learn prototypes, header constants). Each makes keys below HKEY_LOCAL_MACHINE under a GUID and a vendor name of its own, looks where they are by opening the physical places (Software\\Classes\\CLSID\\<GUID> and Software\\Classes\\Wow6432Node\\CLSID\\<GUID>, Software\\<vendor> and Software\\Wow6432Node\\<vendor>) through the 64-bit view, which does not redirect, prints `native`, `x86`, `both` or `none`, and removes its keys again (at the start and at the end). Observations are statuses, dispositions and those words, never handles or addresses; the programs need an administrator token. Compare the lines, not the order of the keys."
not_covered: "64-bit processes, HKEY_CURRENT_USER, volatile keys and security attributes, key classes and the tests' removal of keys that other programs made; creating a Wow6432Node key below a Software handle (it nests below the physical Software\\Wow6432Node); the symbolic links Windows keeps between Software\\Wow6432Node\\Classes and Software\\Classes\\Wow6432Node and for the shared keys (a program that names them sees the same key; the tests do not rely on them)."
