# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/comctl32.dll/SysTreeView32.yaml
id: windows/api/comctl32.dll/SysTreeView32
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, controls draw into memory bitmaps with WM_PRINT, nothing is shown on a screen, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-5
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. The programs have no manifest, so they get the common controls of version 5.82 from the system directory (classic look, no visual styles); controls are drawn into memory bitmaps with WM_PRINT (PRF_CLIENT | PRF_ERASEBKGND | PRF_CHILDREN) and only system colours are compared, never text or glyph pixels. Microsoft Learn: "Common Controls", the control reference pages and their message and notification lists; commctrl.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  The tree view control: items with children, expanding and collapsing, one selected item. PuTTY's configuration dialog shows its category tree (Session, Terminal, Window, ...) in one and the tree stays blank on Poly (the dialog's left side is empty in the impl-win-apps-3 screenshot).
interface:
  signature: "window class SysTreeView32 (comctl32 version 5.82): CreateWindowExW(\"SysTreeView32\", ...); messages TVM_*, notifications TVN_* and NM_*"
rules:
  creation: "the class is registered by InitCommonControlsEx(ICC_TREEVIEW_CLASSES or ICC_WIN95_CLASSES); TVM_GETCOUNT is 0 and TVGN_ROOT finds nothing; TVM_GETBKCOLOR and TVM_GETTEXTCOLOR return 0xFFFFFFFF (CLR_NONE: the system colours are used)"
  insert: "TVM_INSERTITEMW(TVINSERTSTRUCT) returns the new item's handle (non-zero): under TVI_ROOT or a parent, after TVI_LAST (appends), TVI_FIRST (first), an item handle (right after it) or TVI_SORT (alphabetical without regard to case: 'Aardvark', 'Middle', 'Root A', 'Root B', 'zebra'); a parent handle that does not exist gives 0; TVM_GETCOUNT counts all items (10 after ten inserts)"
  navigation: "TVM_GETNEXTITEM(code, item): TVGN_ROOT gives the first root (also called with an item), TVGN_NEXT and TVGN_PREVIOUS the siblings (NULL at the ends), TVGN_PARENT the parent (NULL for a root), TVGN_CHILD the first child, TVGN_CARET the selected item (NULL when none), TVGN_FIRSTVISIBLE and TVGN_LASTVISIBLE the first and last visible items, TVGN_NEXTVISIBLE skips the children of collapsed items ('Root B' after 'Root A' while Root A is collapsed)"
  items: "TVM_GETITEMW returns TRUE with text, lParam, image 0, selected image 0, state 0 and cChildren: 1 for an item that has children and 0 for one that has none (cChildren is derived from the tree unless set); FALSE for a handle that does not exist; TVM_SETITEMW returns TRUE and stores text, lParam, image 3, selected image 4 and cChildren 1 (read back: cChildren 1 although the item has no children), FALSE for a bad handle"
  metrics: "TVM_SETINDENT(30) returns 0 and TVM_GETINDENT then returns 30; TVM_SETINDENT(2) is raised to 17 (the smallest indent here); TVM_SETITEMHEIGHT(20) returns the old height (> 0) and TVM_GETITEMHEIGHT returns 20; an odd height (21) is rounded down to the even 20 and the old height 20 is returned; TVM_SETITEMHEIGHT(-1) restores the default height (> 0)"
  rectangles: "TVM_GETITEMRECT (the item handle in the first member of the RECT, wParam 0 for the whole row, 1 for the text) returns TRUE for visible items: rows of the item height (20 after TVM_SETITEMHEIGHT(20)) following each other (Root B starts where Root A ends), the text rectangle inside the row, a child's text starts one TVM_GETINDENT to the right of its parent's after the parent is expanded; FALSE for a child of a collapsed item"
  deleting: "TVM_DELETEITEM(item) returns TRUE and sends TVN_DELETEITEMW for the item and for each of its descendants (two for A1 and its child), the count drops by them; FALSE for a handle that is gone or does not exist; TVM_DELETEITEM(TVI_ROOT) deletes everything (TRUE, count 0, one TVN_DELETEITEMW per item with mask TVIF_HANDLE | TVIF_PARAM 0x14 and the item in the old-item member)"
  expand: "TVM_EXPAND(TVE_EXPAND, item) returns TRUE for an item that has children, sets TVIS_EXPANDED and TVIS_EXPANDEDONCE (state 0x60) and sends TVN_ITEMEXPANDINGW then TVN_ITEMEXPANDEDW (action TVE_EXPAND 2, the item in the new-item member with mask 0x3e: text, image, selected image, handle, children, and its state: 0 before, 0x20 after); expanding an item that is expanded returns TRUE with no notifications; TVE_COLLAPSE returns TRUE, leaves TVIS_EXPANDEDONCE (state 0x40) and returns FALSE when it is collapsed already; no collapse notification was seen in the test; TVE_TOGGLE flips and returns TRUE; TVE_COLLAPSE | TVE_COLLAPSERESET returns TRUE, clears the expanded flags (state 0), deletes the children (TVN_DELETEITEMW for each, TVM_GETCOUNT drops) and a later TVE_EXPAND returns FALSE with the notification TVN_ITEMEXPANDINGW (mask 0x7e, the item has no children now); an item without children, a handle that does not exist and the codes 5 and 0 return FALSE with no notification; a parent that returns TRUE from TVN_ITEMEXPANDINGW refuses the expansion: TVM_EXPAND returns FALSE, only the TVN_ITEMEXPANDINGW is sent (no TVN_ITEMEXPANDEDW) and the state stays 0; the same call with a parent that agrees returns TRUE with both notifications and state 0x60"
  ensure_visible: "TVM_ENSUREVISIBLE of a child of a collapsed item returns 0 and expands the parents (state 0x60, with the expand notifications)"
  children_callback: "an item inserted with cChildren I_CHILDRENCALLBACK (-1) reads cChildren 1 through TVM_GETITEMW after the control asked the parent with TVN_GETDISPINFOW (mask TVIF_CHILDREN 0x40; the test's parent answers 1)"
  selection: "TVM_SELECTITEM(TVGN_CARET, item) returns TRUE, sets TVIS_SELECTED (state 0x2) and sends TVN_SELCHANGINGW (action TVC_UNKNOWN 0, old item and new item) then TVN_SELCHANGEDW (the new item has state 0x2); selecting the item that is selected returns TRUE with no notification; selecting another moves the state; TVGN_CARET with NULL clears the selection (TRUE, both notifications with a NULL new item); selecting a hidden item (under collapsed parents) expands its parents first (they read state 0x60 afterwards and the expand notifications precede TVN_SELCHANGEDW); a handle that does not exist returns FALSE; TVGN_DROPHILITE sets the drop highlight (state 0x8) and returns TRUE without notifications, NULL clears it; TVGN_FIRSTVISIBLE scrolls and returns TRUE; a parent that returns TRUE from TVN_SELCHANGINGW refuses the change: TVM_SELECTITEM returns FALSE, the selection stays and no TVN_SELCHANGEDW follows; deleting the selected item selects its next sibling (C after deleting B) with TVN_SELCHANGINGW and TVN_SELCHANGEDW"
  keys: "with the focus, WM_KEYDOWN sent to the control moves the selection (the parent gets TVN_KEYDOWN first, then TVN_SELCHANGINGW and TVN_SELCHANGEDW with action TVC_BYKEYBOARD 2 in the old-item and new-item members): VK_DOWN selects the next visible item (from the collapsed A with children it is the next root), VK_UP the previous visible one, VK_END the last visible item and VK_HOME the first; VK_RIGHT on an expanded item selects its first child (two VK_RIGHT from a collapsed item with children expand it and then select the child), VK_LEFT on a child selects its parent, VK_SUBTRACT collapses an expanded item (state 0x42 afterwards: selected, expanded once) and VK_ADD on an item that is expanded changes nothing"
  hit_test: "TVM_HITTEST returns the item and flags: the middle of a label and its left edge TVHT_ONITEMLABEL (0x4), right of the label inside the row TVHT_ONITEMRIGHT (0x20), the +/- button TVHT_ONITEMBUTTON (0x10) (a point on A's button exists left of its text), below the items TVHT_NOWHERE (0x1) with no item, outside the window above and to the left TVHT_ABOVE | TVHT_TOLEFT (0x900) with no item"
  painting: "drawn into a memory bitmap: the background is COLOR_WINDOW; the selected item's label rectangle is COLOR_HIGHLIGHT while the control has the focus and COLOR_BTNFACE when it has not and TVS_SHOWSELALWAYS is set, and not drawn at all without the focus and without TVS_SHOWSELALWAYS; the rest of the selected row (right of the label) and unselected rows stay COLOR_WINDOW"
errors:
  bad_handle: "TVM_GETITEMW, TVM_SETITEMW, TVM_DELETEITEM, TVM_EXPAND and TVM_SELECTITEM with a handle that does not exist return FALSE; TVM_INSERTITEMW with a bad parent returns 0"
side_effects: "posts WM_NOTIFY to the parent"
threading: "the window's own thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes, counts, booleans and sizes that come from the test's own fonts and from system metrics at 96 dpi; no line holds a handle, a pointer or a machine, user or time. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is not printed (it is not specified).
not_covered: >
  Version 6 controls (what PuTTY and 7-Zip get through their manifests: themed painting, extra messages, LVS_EX styles beyond the basic ones), mouse input (a mouse button message sent to these controls starts a loop that waits for the real mouse and never ends in session 0, so the tests send keys and use hit tests), drag and drop, label editing, tool tips, owner draw and custom draw (NM_CUSTOMDRAW), icon and tile views, groups, sorting, and anything that needs a real font (text pixels, text extents of the system font). Check boxes and state images, TVS_SINGLEEXPAND, TVM_SORTCHILDREN, insert marks and TVN_SETDISPINFO.
