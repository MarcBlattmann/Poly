# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/comctl32.dll/SysListView32.yaml
id: windows/api/comctl32.dll/SysListView32
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, controls draw into memory bitmaps with WM_PRINT, nothing is shown on a screen, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-5
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. The programs have no manifest, so they get the common controls of version 5.82 from the system directory (classic look, no visual styles); controls are drawn into memory bitmaps with WM_PRINT (PRF_CLIENT | PRF_ERASEBKGND | PRF_CHILDREN) and only system colours are compared, never text or glyph pixels. Microsoft Learn: "Common Controls", the control reference pages and their message and notification lists; commctrl.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  The list view control in report view: columns with a header, items with sub item text, selection and focus, text callbacks and virtual lists. 7-Zip's file manager shows its file list in one (a virtual list with LVN_GETDISPINFO callbacks) and its window stays blank on Poly because the control does not exist or does not paint.
interface:
  signature: "window class SysListView32 (comctl32 version 5.82): CreateWindowExW(\"SysListView32\", ...) with LVS_REPORT; messages LVM_*, notifications LVN_*"
  selection: "LVM_SETITEMSTATE(item, LVITEM with state and stateMask) returns TRUE (FALSE for an item that does not exist); selecting sends LVN_ITEMCHANGING then LVN_ITEMCHANGED with new and old state and changed = LVIF_STATE (0x8); setting the state an item already has sends only LVN_ITEMCHANGING (no LVN_ITEMCHANGED) and returns TRUE; LVIS_FOCUSED moves the focus (the old item gets LVN_ITEMCHANGING for it and is changed after); index -1 means all items (select all sends a pair for every item that changes, deselect all too); LVM_GETITEMSTATE, LVM_GETSELECTEDCOUNT, LVM_GETNEXTITEM(from, LVNI_ALL / LVNI_SELECTED / LVNI_FOCUSED / LVNI_BELOW / LVNI_ABOVE and combinations; -1 starts at the top; the result -1 when there is none) work as documented; LVM_SETSELECTIONMARK(index) returns the old mark and LVM_GETSELECTIONMARK reads it (-1 for none, the mark follows the focus given with LVM_SETITEMSTATE and stays when the focus moves on); LVS_SINGLESEL: selecting a second item deselects the first (two notifications pairs) and select all (-1) returns FALSE and changes nothing; LVM_HITTEST on the middle of a label returns the item with flags LVHT_ONITEMLABEL (0x4), below the rows -1 with LVHT_NOWHERE (0x10); with the focus, WM_KEYDOWN sent to the control moves and selects: VK_DOWN with no focused item selects item 0 (and deselects the old selection), the next one item 1, VK_HOME item 0, VK_END the last, and every key first gives the parent an LVN_KEYDOWN"
rules:
  creation: "the class is registered by InitCommonControlsEx(ICC_LISTVIEW_CLASSES or ICC_WIN95_CLASSES); the window is a Unicode window (IsWindowUnicode 1); LVM_GETITEMCOUNT is 0; LVM_GETHEADER returns a child window of class SysHeader32 whose parent is the list view (HDM_GETITEMCOUNT = number of columns)"
  columns: "LVM_INSERTCOLUMNW(index, LVCOLUMN) returns the index of the new column: inserting at 0 pushes the others up, an index past the end appends (9 with 4 columns gives 4); HDM_GETITEMCOUNT follows; LVM_GETCOLUMNW returns TRUE with text, width, the alignment of fmt plus the bit 0x4000 (16384 for left, 16385 right, 16386 centre) and the iSubItem the column was given; LVM_GETCOLUMNWIDTH(i) gives the width (0 for an index that does not exist); LVM_SETCOLUMNWIDTH returns TRUE (FALSE for a bad index); LVM_SETCOLUMNW(LVCF_TEXT) changes the text; LVM_DELETECOLUMN returns TRUE (FALSE for a bad index); the header notifications HDN_ITEMCHANGINGW and HDN_ITEMCHANGEDW (codes -320 and -321, from the header with id 0) reach the list view's parent while columns change"
  items: "LVM_INSERTITEMW returns the index: at 0 pushes the others down, past the end appends (50 with 3 items gives 3), a negative index fails with -1; each insert sends LVN_INSERTITEM (item = the index); LVM_GETITEMW returns TRUE with text, lParam, state 0, image 0 and indent 0 (FALSE and untouched buffer for an index that does not exist); LVM_SETITEMW returns TRUE and sends LVN_ITEMCHANGING and LVN_ITEMCHANGED with changed = LVIF_TEXT | LVIF_PARAM (0x5) (FALSE for a bad index)"
  sub_items: "LVM_SETITEMTEXTW(item, subitem) works for sub items 0 up to the number of columns minus 1 (the iSubItem a column was created with is only a label: with 4 columns sub items 1 and 2 work, 4 and 9 fail with FALSE and no notification); LVM_GETITEMTEXTW returns the length written (5 for 'alpha'), 0 for a sub item that was never set or does not exist; with a buffer of 4 units it writes 'one' and returns 3, with 1 unit it writes the empty string and returns 0, with 0 units and for an item that does not exist it returns 0 and writes nothing; setting the empty text makes the length 0"
  deleting: "LVM_DELETEITEM returns TRUE and sends LVN_ITEMCHANGING (changed 0x8 for the item's state) and LVN_DELETEITEM; FALSE for a bad index; the items after it move up; LVM_DELETEALLITEMS returns TRUE (also for an empty list), sends LVN_DELETEALLITEMS and then LVN_DELETEITEM for each item from the last to the first"
  rectangles: "LVM_GETITEMRECT(LVIR_BOUNDS) returns TRUE with left 0 and right = the sum of the column widths (290 for 90 + 80 + 100 + 20), the next row starts where the one above ends, a row has a height; LVIR_LABEL starts at 2 pixels (inside the first column), LVIR_SELECTBOUNDS and LVIR_ICON are also accepted"
  colours: "LVM_GETBKCOLOR is the system window colour; LVM_GETTEXTBKCOLOR returns 0xFF000000 (CLR_NONE as the control stores it); LVM_SETBKCOLOR changes the painted background (green: 0x00FF00 at a blank pixel)"
  extended_styles: "LVM_SETEXTENDEDLISTVIEWSTYLE(wParam mask, lParam styles) returns the old extended style (0), LVM_GETEXTENDEDLISTVIEWSTYLE gives it back (LVS_EX_FULLROWSELECT | LVS_EX_GRIDLINES = 0x21); with a mask only the bits of the mask change (mask LVS_EX_GRIDLINES with 0 clears the grid lines: 0x20 remains)"
  text_callbacks: "an item or sub item whose text is LPSTR_TEXTCALLBACK (-1) makes LVM_GETITEMTEXTW send LVN_GETDISPINFOW to the parent with mask LVIF_TEXT (0x1), the item and sub item and the buffer size offered (64 units, or 4 for a buffer of 4); the text the parent writes there is returned (11 for 'from parent', truncated to the buffer minus one: 'fro' for 4 units); a parent that writes nothing gives an empty text and 0; LVM_GETITEMW with LVIF_TEXT | LVIF_IMAGE sends one notification with mask 0x3 and the image stays I_IMAGECALLBACK (-1) when the parent does not set it; LVM_SETITEMTEXTW with LPSTR_TEXTCALLBACK for a sub item is accepted (TRUE) and the sub item is then asked for; while the control is drawn (WM_PRINT) it asks for the text of the visible items and sub items the same way"
  virtual_list: "a list made with LVS_OWNERDATA has no items of its own: LVM_SETITEMCOUNT(n, 0) returns TRUE and LVM_GETITEMCOUNT is n (100); LVM_INSERTITEMW fails (the test reads 0 and one LVN_INSERTITEM); LVM_DELETEITEM(3) returns TRUE with LVN_DELETEITEM for item 3; LVM_DELETEALLITEMS returns TRUE, the count becomes 0 and LVN_DELETEITEM is sent once for each of the items there were; LVM_GETITEMTEXTW asks the parent (LVN_GETDISPINFOW for the item and sub item) and an item past the count (70 of 50) gives 0 without asking; LVM_SETITEMSTATE(3, LVIS_SELECTED) returns TRUE, LVM_GETITEMSTATE reads LVIS_SELECTED back, LVM_GETSELECTEDCOUNT is 1 and the parent gets LVN_ITEMCHANGED (no LVN_ITEMCHANGING) and an LVN_GETDISPINFOW with mask LVIF_INDENT (0x10) and a buffer of 0 for the item"
  painting: "drawn into a memory bitmap the list view fills its client area with the window colour (COLOR_WINDOW), the header band (the header window, 19 pixels high at the oracle's 16 pixel system font) with COLOR_BTNFACE, draws nothing for unselected rows, and for selected rows: COLOR_HIGHLIGHT behind the label while the control has the focus, COLOR_BTNFACE when it has not and LVS_SHOWSELALWAYS is set, nothing when it has not and the style is missing; with LVS_EX_FULLROWSELECT the highlight spans the width of the columns (a pixel inside the last column is highlighted, one right of the columns is the window colour) and without it only the label is highlighted (a pixel at x = 20 beside a one letter label is not)"
errors:
  bad_index: "messages with an item or column index that does not exist return FALSE (LVM_GETITEMW, LVM_SETITEMW, LVM_SETITEMTEXTW, LVM_DELETEITEM, LVM_SETCOLUMNWIDTH, LVM_DELETECOLUMN) or 0 (LVM_GETITEMTEXTW, LVM_GETCOLUMNWIDTH)"
side_effects: "posts WM_NOTIFY to the parent as described"
threading: "the window's own thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes, counts, booleans and sizes that come from the test's own fonts and from system metrics at 96 dpi; no line holds a handle, a pointer or a machine, user or time. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is not printed (it is not specified).
not_covered: >
  Version 6 controls (what PuTTY and 7-Zip get through their manifests: themed painting, extra messages, LVS_EX styles beyond the basic ones), mouse input (a mouse button message sent to these controls starts a loop that waits for the real mouse and never ends in session 0, so the tests send keys and use hit tests), drag and drop, label editing, tool tips, owner draw and custom draw (NM_CUSTOMDRAW), icon and tile views, groups, sorting, and anything that needs a real font (text pixels, text extents of the system font).
