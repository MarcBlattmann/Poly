# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/comctl32.dll/DefSubclassProc
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop): windows and messages work there without being visible; every test runs twice with identical output; the programs have no manifest (comctl32 version 5.82 is what they load); the probes that led to the rules below were made with Python ctypes on the same machine"
  observed_by: spec-win-updater-gap
  date: 2026-11-19
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of
  SetWindowSubclass, GetWindowSubclass, RemoveWindowSubclass, DefSubclassProc, SUBCLASSPROC and
  "Subclassing Controls", DefWindowProc, SendMessage, DestroyWindow; commctrl.h, winuser.h and
  winerror.h for constants and layouts. The ordinals 410..413 are the exports the programs bind
  to (Google's updater.exe imports comctl32.dll ordinals 410, 412 and 413; the tests import them
  by ordinal and print nothing that depends on the number). Wine's code and tests were not used,
  no Microsoft binary was decompiled or disassembled.
summary: >
  Ordinal 413. Called from inside a subclass procedure: passes the message to the next older
  subclass of the window, or to the window's own procedure after the oldest, and returns what that
  returns. The message, wParam and lParam passed are the ones it is given, so a subclass may change
  them (or the message number) for the rest of the chain and may call it more than once. Outside of a
  subclass procedure it does nothing and returns 0.
interface:
  signature: "LRESULT DefSubclassProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam)"
  ordinal: "413"
rules:
  next: "inside a subclass procedure it calls the next older subclass, which gets its own uIdSubclass and dwRefData, and the oldest calls the window's procedure: see SetWindowSubclass chain_order."
  changed_arguments: "arguments pass on as given: A turned WM_USER+3 into WM_USER+1 with wParam 5+100 and lParam 6-100: the window procedure saw WM_USER+1, w=105, l=-94 and answered 777; A added 1 to the result (778). A subclass that passes on unchanged sees the same message, wParam and lParam in every level."
  results: "the result is the next one's: B doubling the result of WM_USER+1 (777) gives 1554 through the chain above it."
  called_twice: "a subclass may call it twice: C called the rest of the chain with wParam 5 and then 6 (the window procedure ran twice; each call returned 1776 after B doubled 888) and returned the sum 3552."
  nested: "a message sent to the window from inside a subclass procedure with SendMessage goes through the whole chain from the newest (N2 sent WM_USER+2 and got 888 back, then passed its own WM_USER+1 on)."
  outside: "called outside any subclass procedure it returns 0 and no procedure of the window is called: with no subclass on the window, with one on it, with a NULL window and from another thread, all 0."
  deep_chain: "a chain of 20 subclasses (and the 17 left after removing three of them) is walked in order newest to oldest to the window procedure."
  x86: "the same programs built for 32-bit (i686, run under WOW64 on the same machine) printed the same lines as the 64-bit ones except for the values that are pointer wide: uIdSubclass and dwRefData are 32-bit there (the largest value is 0xFFFFFFFF, and 0xFFFFFFFE and 0xFFFFFFFA were returned unchanged); the chain order, identity, removal, destroy and error rules held line for line (verified outside the recorded tests: the pipeline's test build is 64-bit only). The 32-bit user32 has no SetWindowLongPtrW and GetWindowLongPtrW (they are the 32-bit SetWindowLongW and GetWindowLongW); the window procedure rules held through them."
errors:
  outside: "returns 0 outside a subclass procedure, no error, nothing is called"
side_effects: "none of its own (the procedures it calls do their own)"
threading: "a window's subclass chain belongs to the thread that created the window; SetWindowSubclass from another thread fails, GetWindowSubclass and RemoveWindowSubclass from another thread work on the chain; the subclass procedures run on the window's thread"
ordering: []
timing:
  typical: "well under a millisecond per call"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, kernel32.dll and comctl32.dll, the last by
  ordinal 410, 411, 412 and 413 (raw-dylib), each carrying its own declarations (Learn prototypes,
  header constants). A test registers a window class whose window procedure logs the watched
  messages, makes plain unshown windows, puts subclass procedures on them and sends messages with
  SendMessageW; every procedure appends a line to a log (tag, message, window as w1, w2, ..., never a
  handle, uIdSubclass, dwRefData, wParam, lParam) and the test prints the log after each step.
not_covered: >
  ANSI windows (CreateWindowExA), windows of other processes, real controls (buttons, edit
  controls) and the version 6 comctl32 that a manifest selects, windows created by another thread
  than the one that subclasses them other than the cases listed, hundreds of subclasses on one window.
