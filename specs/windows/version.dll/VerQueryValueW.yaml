# Spec sheet. Describes behaviour only: no code, no internals.
# Path: version.dll/VerQueryValueW.yaml
id: windows/api/version.dll/VerQueryValueW
oracle:
  os: 'Windows 11 Home 25H2 (build 26200.9974), x64'
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account "server" (member of Administrators) in the SSH logon session (session 0) with its elevated administrator token, in which SeBackupPrivilege and SeRestorePrivilege are already enabled; the *_std tests were recorded with -Token standard (the same account''s filtered token in its interactive session). Every test ran at least twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: 'Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). Microsoft Learn''s pages for GetFileVersionInfoSizeW, GetFileVersionInfoW and VerQueryValueW, and Learn''s "VS_VERSIONINFO structure", "VS_FIXEDFILEINFO structure", "StringFileInfo" and "VarFileInfo" pages and "Version Information" (verrsrc.h, winver.h); constants and error codes from winerror.h. Chrome''s own setup.exe imports all three (to read the version of an installed chrome.exe and of the installer itself). The test programs carry their own RT_VERSION resource (a block of 820 bytes with two string tables, 040904B0 and 040704B0, and a Translation list of two pairs), written as data in the test source. Nothing of Windows or Google''s programs was read or disassembled.'
summary: 'Looks a value up in a version block that GetFileVersionInfoW filled, by a path with backslashes: "\" is the VS_FIXEDFILEINFO, "\VarFileInfo\Translation" the list of language/code page pairs, "\StringFileInfo\<lang+codepage as 8 hex digits>\<name>" a string. It returns a pointer into the block and a length (in characters including the NUL for strings, in bytes for the other two).'
interface:
  signature: 'BOOL VerQueryValueW(LPCVOID pBlock, LPCWSTR lpSubBlock, LPVOID *lplpBuffer, PUINT puLen)'
rules:
  root: '"\" (and "" and "\\"): TRUE, length 52, the pointer lies inside the block; the 13 DWORDs are: signature 0xFEEF04BD, struct version 0x10000, file version 0x00010002 / 0x00030004 (1.2.3.4), product version 0x00050006 / 0x00070008 (5.6.7.8), file flags mask 0x3F, flags 0, OS 0x40004, type 1, subtype 0, date 0, 0 (as stored in the test resource).'
  translation: '"\VarFileInfo\Translation": TRUE, length 8 (bytes) for two pairs: 0x0409 with code page 0x04B0, then 0x0407 with 0x04B0, in the order of the resource.'
  strings: '"\StringFileInfo\040904B0\CompanyName" and the seven others: TRUE, the pointer is to a NUL terminated UTF-16 string, the length is its characters plus 1 (CompanyName ''PolySpec Co'': 12; FileDescription ''PolySpec test image'': 20; FileVersion ''1.2.3.4'': 8; InternalName ''polyspec'': 9; LegalCopyright ''(c) none'': 9; OriginalFilename ''polyspec.exe'': 13; ProductName ''PolySpec'': 9; ProductVersion ''5.6.7.8'': 8). Matching ignores case in the key names and in the hex digits (\stringfileinfo\040904b0\fileversion works). The path may omit the leading backslash and may end with one (StringFileInfo\040904B0\FileVersion and ...\FileVersion\ both work). The second string table is found by its own language: \StringFileInfo\040704B0\FileDescription is ''Pruefbild'' (length 10).'
  containers: '"\StringFileInfo\040904B0", "\StringFileInfo" and "\VarFileInfo" succeed with length 0 (a pointer to the container''s block).'
  missing: 'A name that is not in the block (\StringFileInfo\040904B0\NoSuchValue, a language that is not there (0C0904B0), a value that only the other table lacks (040704B0\ProductName), \VarFileInfo\Nothing, \NoSuchBlock): FALSE and ERROR_RESOURCE_TYPE_NOT_FOUND (1813); *lplpBuffer is left NULL and *puLen is 0.'
  garbage: 'A block of zero bytes: FALSE and ERROR_INVALID_DATA (13).'
  system_file: 'For kernel32.dll read with GetFileVersionInfoW: the root query is TRUE with length 52 and signature 0xFEEF04BD, struct version 0x10000, OS 0x40004 and type 2 (VFT_DLL); the Translation list has at least one pair (length a multiple of 4); with the first pair as lang+codepage, ProductName is non-empty and FileVersion starts with ''10.0.'' (numbers are not printed because they differ between Windows builds).'
errors:
  resource_type_not_found: '1813'
  invalid_data: '13'
side_effects: 'none'
threading: 'may be called from any thread'
ordering: []
timing:
  typical: 'well under a millisecond per call on the oracle'
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: 'Rust tests (ADR 0075): the test image carries a version resource built by a script as global_asm data (the RT_VERSION layout of Learn''s "VS_VERSIONINFO structure": FILEVERSION 1.2.3.4, PRODUCTVERSION 5.6.7.8, string table 040904B0 with CompanyName, FileDescription, FileVersion, InternalName, LegalCopyright, OriginalFilename, ProductName, ProductVersion, a second table 040704B0, Translation 0x04B00409 and 0x04B00407); other tests read C:\Windows\System32\kernel32.dll and files they write themselves. Observations are return values, error codes and relations; numbers that differ between Windows builds are never printed.'
not_covered: '16-bit (NE) images, MUI resource redirection (.mui files), the Ex variants with FILE_VER_GET_LOCALISED and FILE_VER_GET_NEUTRAL, files in a WOW64 redirected directory from a 32-bit caller, very large version resources, the A variants, VerQueryValueW with a NULL block (an access violation on Windows), GetFileVersionInfoW with a NULL buffer (an access violation).'
