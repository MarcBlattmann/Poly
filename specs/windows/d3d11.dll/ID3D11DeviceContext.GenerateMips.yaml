# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11DeviceContext.GenerateMips.yaml
id: windows/api/d3d11.dll/ID3D11DeviceContext.GenerateMips
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11DeviceContext::GenerateMips", "D3D11_RESOURCE_MISC_FLAG", "ID3D11Device::CreateShaderResourceView", "ID3D11DeviceContext::CopySubresourceRegion"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Fills the lower mip levels of a texture from level MostDetailedMip of a shader-resource view. Chrome (ANGLE) uses it for glGenerateMipmap. It works only for textures created with MISC_GENERATE_MIPS (which needs both RENDER_TARGET and SHADER_RESOURCE binds); on others the call is ignored without error. The averaging of a top-half-red / bottom-half-blue texture keeps the halves down to 2x2 and gives 0xFF800080 for the 1x1 level (sRGB format: 0xFFBC00BC, a gamma-correct average); the levels written by a view over a part of the chain are MostDetailedMip + 1 up to MipLevels - 1 (MipLevels used as an END index, not a count).
interface:
  signature: "void GenerateMips(ID3D11ShaderResourceView* view)"
chrome:
  calls: "ANGLE calls GenerateMips on the SRV of a texture created with MISC_GENERATE_MIPS for glGenerateMipmap (assumed from its documented design)"
rules:
  create_needs: "CreateTexture2D with MISC_GENERATE_MIPS and bind SHADER_RESOURCE only or RENDER_TARGET only is E_INVALIDARG; with both binds it succeeds (full chain with MipLevels 0)"
  chain: "16x16 B8G8R8A8 (full chain 5 levels), level 0: top 8 rows 0xFFFF0000, bottom 8 rows 0xFF0000FF; after GenerateMips levels 1 (8x8), 2 (4x4) and 3 (2x2) read first pixel 0xFFFF0000 and last pixel 0xFF0000FF; level 4 (1x1) is 0xFF800080; the same for a 3-mip texture (levels 1 and 2) and for R8G8B8A8_UNORM"
  srgb: "B8G8R8A8_UNORM_SRGB: the 1x1 level is 0xFFBC00BC (average computed in linear space); the other levels as above"
  non_power_of_two: "20x12: levels 10x6 and 5x3 keep red first / blue last; the 2x1 level reads 0xFFC00040 in both pixels and the 1x1 level 0xFFC00040 (a weighted average of the red and blue rows)"
  no_flag: "a 3-mip texture without MISC_GENERATE_MIPS (bind RT|SRV): GenerateMips does nothing (levels 1 and 2 stay 0x00000000), no error, the device stays alive; a 1-mip texture with the flag: nothing to do; a 1-mip texture without the flag and an SRV-only bind: no effect, device alive"
  array: "a 2-slice 3-mip array with slice 0 red and slice 1 blue: the view over all slices generates every slice's chain separately (slice 0 level 2 reads 0xFFFF0000, slice 1 level 2 0xFF0000FF; subresource = slice * 3 + level)"
  view_range: "SRV over MostDetailedMip m with MipLevels n of a 5-level texture (level m red, the others a distinct colour): the levels written are m+1 .. n-1: view (0, 5) writes 1 to 4; (0, 2) writes 1; (0, 3) writes 1 and 2; (1, 3) writes 2 only; (1, 2), (1, 1), (2, 3), (2, 2), (3, 2), (4, 1), (0, 1) write nothing; the source level and the levels outside are never changed"
  state: "the SRV's GetDesc is the same before and after GenerateMips (5 mip levels for a full-chain texture); a view bound with PSSetShaderResources(0) stays bound and PSGetShaderResources(0) returns the same view"
  no_removal: "none of the cases removes the device"
errors:
  argument: "E_INVALIDARG (0x80070057) from CreateTexture2D for the flag without both binds; GenerateMips itself reports nothing"
side_effects: "overwrites lower mip levels"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  other formats than the 8-bit ones (the read-back helper handles 32-bit texels), 3D textures and cube maps, the exact filter for sizes with odd steps beyond the 20x12 case.
