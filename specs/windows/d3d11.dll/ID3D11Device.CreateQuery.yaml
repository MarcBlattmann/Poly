# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.CreateQuery.yaml
id: windows/api/d3d11.dll/ID3D11Device.CreateQuery
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::CreateQuery", "ID3D11Device::CreatePredicate", "ID3D11Device::CreateCounter", "ID3D11Device::CheckCounterInfo", "ID3D11Device::CheckCounter", "D3D11_QUERY enumeration", "D3D11_QUERY_DESC", "D3D11_QUERY_MISC_FLAG", "ID3D11DeviceContext::Begin", "ID3D11DeviceContext::End", "ID3D11DeviceContext::GetData", "ID3D11Asynchronous::GetDataSize", "D3D11_QUERY_DATA_TIMESTAMP_DISJOINT", "ID3D11DeviceContext::SetPredication"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Queries are GPU-side counters and fences. Chrome (ANGLE) polls an EVENT query as a GPU fence (End, then GetData until S_OK; used to wait for work and to know when a texture can be reused) and uses TIMESTAMP / TIMESTAMP_DISJOINT for its timing and OCCLUSION[_PREDICATE] for GL occlusion queries. On WARP all types 0 to 15 can be created; with no drawing the occlusion and statistics results are all zero and an EVENT query ends at once. GetData before the query was ended gives DXGI_ERROR_INVALID_CALL (not S_FALSE). The tests poll in a bounded loop (2000 tries 1 ms apart) and print only whether S_OK came and the data: the first GetData after End returned S_OK in the oracle runs, but the number of tries needed is not part of the contract.
interface:
  signature: "HRESULT CreateQuery(const D3D11_QUERY_DESC*, ID3D11Query**); HRESULT CreatePredicate(const D3D11_QUERY_DESC*, ID3D11Predicate**); HRESULT CreateCounter(const D3D11_COUNTER_DESC*, ID3D11Counter**); void Begin(ID3D11Asynchronous*); void End(ID3D11Asynchronous*); HRESULT GetData(ID3D11Asynchronous*, void* data, UINT size, UINT flags); UINT ID3D11Asynchronous::GetDataSize(); void ID3D11Query::GetDesc(D3D11_QUERY_DESC*)"
  layout: "D3D11_QUERY_DESC (8 bytes): Query, MiscFlags. D3D11_COUNTER_DESC: Counter, MiscFlags. D3D11_QUERY_DATA_TIMESTAMP_DISJOINT (16 bytes): UINT64 Frequency, BOOL Disjoint (d3d11.h)"
  constants: "D3D11_QUERY: EVENT 0, OCCLUSION 1, TIMESTAMP 2, TIMESTAMP_DISJOINT 3, PIPELINE_STATISTICS 4, OCCLUSION_PREDICATE 5, SO_STATISTICS 6, SO_OVERFLOW_PREDICATE 7, SO_STATISTICS_STREAM0..3 8/10/12/14, SO_OVERFLOW_PREDICATE_STREAM0..3 9/11/13/15; MiscFlags PREDICATEHINT 1; GetData flag DONOTFLUSH 1"
chrome:
  calls: "ANGLE issues D3D11_QUERY_EVENT queries as fences (End, then GetData with S_FALSE meaning 'not yet') and TIMESTAMP / OCCLUSION queries on behalf of GL extensions (from ANGLE's documented design; not visible to the tracer)"
rules:
  types: "CreateQuery succeeds for the values 0 to 15 with MiscFlags 0 and gives E_INVALIDARG for 16, 17, 100, 0x40000000 and 0xFFFFFFFF; GetDesc returns the same two words; GetDataSize returns: EVENT 4, OCCLUSION 8, TIMESTAMP 8, TIMESTAMP_DISJOINT 16, PIPELINE_STATISTICS 88 (11 x UINT64), OCCLUSION_PREDICATE 4, SO_STATISTICS and the four stream variants 16, SO_OVERFLOW_PREDICATE and its stream variants 4"
  misc_flags: "MiscFlags 1 (PREDICATEHINT) is accepted only for OCCLUSION_PREDICATE (5; GetDesc shows 1); with every other type, and the values 2 and 0x80 with any type, it is E_INVALIDARG"
  interfaces: "a new query has reference count 1, answers ID3D11Query, ID3D11Asynchronous, ID3D11DeviceChild (same pointer) and ID3D11Query1 (same pointer, except the predicate types where it is another pointer); ID3D11Predicate (same pointer) only for OCCLUSION_PREDICATE and SO_OVERFLOW_PREDICATE; never ID3D11Counter; GetDevice returns the device; two queries of one type are different objects"
  null_output: "CreateQuery with a NULL output pointer only validates: S_FALSE for EVENT, TIMESTAMP and OCCLUSION_PREDICATE with the hint, E_INVALIDARG for the hint on EVENT or kind 16 and 100; CreatePredicate with a NULL output: S_FALSE"
  predicate: "CreatePredicate accepts only OCCLUSION_PREDICATE (5; the hint flag too) and SO_OVERFLOW_PREDICATE (7; the stream variants 9 and 15 are refused): types 0 to 4, 6, 8, 9, 15, 16 are E_INVALIDARG; the object answers ID3D11Query (same pointer) and its GetDesc and GetDataSize are those of the type"
  counter: "CreateCounter fails for every value tried (D3D11_COUNTER_DEVICE_DEPENDENT_0 0x40000000, 0x40000001, 0, 1, 0x3FFFFFFF, 0xFFFFFFFF, the first with MiscFlags 1) with E_INVALIDARG: WARP has no counters; ID3D11Device::CheckCounterInfo reports LastDeviceDependentCounter 0, NumSimultaneousCounters 0 and NumDetectableParallelUnits 1; CheckCounter(0x40000000) is E_INVALIDARG"
  event_before_end: "GetData of an EVENT query that never had End: DXGI_ERROR_INVALID_CALL (0x887A0001), no data written"
  event_fence: "End then GetData(flags 0) polled up to 2000 times 1 ms apart ended with S_OK and the BOOL TRUE (bytes 01 00 00 00); the same with flags DONOTFLUSH (1), and after End + Flush; a later GetData of the same query is S_OK with TRUE again; End twice then GetData: S_OK; Begin on an EVENT query is ignored (no state change, GetData still S_OK); Begin then End: S_OK, TRUE"
  fence_orders_work: "after CopyResource(default <- staging), CopyResource(staging2 <- default), End on an EVENT query and a poll to S_OK, Map(READ, DO_NOT_WAIT) of the second staging texture is S_OK and the pixels are the copied data: the fence orders earlier work"
  getdata_size: "GetData needs the exact data size: for EVENT 4 succeeds, 0 succeeds with 0 bytes written (and NULL data with size 0 is S_OK), 1, 2, 3, 5, 8, 16, 128 and NULL data with size 4 are E_INVALIDARG; for TIMESTAMP_DISJOINT exactly 16 is S_OK and writes 12 bytes (Frequency and Disjoint; the 4 padding bytes are untouched) and 8, 15, 24 are E_INVALIDARG; OCCLUSION: 7 and 12 are E_INVALIDARG; the same pattern (size - 1 and size + 4 refused) for OCCLUSION_PREDICATE, PIPELINE_STATISTICS (87 and 92), SO_STATISTICS (15 and 20) and the stream variants; GetData flags 2, 0x10, 0xFFFFFFFF are E_INVALIDARG"
  timestamps: "Begin(TIMESTAMP_DISJOINT), End(TIMESTAMP) twice, End(TIMESTAMP_DISJOINT), Flush, poll: S_OK with Frequency != 0 and Disjoint FALSE (0); the first timestamp is non-zero and the second is >= the first; a TIMESTAMP ended outside a disjoint query: GetData S_OK; Begin before End on a TIMESTAMP: S_OK; End of a disjoint query without Begin: S_OK; Begin without End then GetData: DXGI_ERROR_INVALID_CALL, after End: S_OK"
  occlusion_family: "OCCLUSION, OCCLUSION_PREDICATE, PIPELINE_STATISTICS, SO_STATISTICS, SO_OVERFLOW_PREDICATE and the stream variants with nothing drawn: GetData before Begin and between Begin and End: DXGI_ERROR_INVALID_CALL; after End: S_OK and all data zero (occlusion count 0, predicate FALSE, the 11 statistics words 0, the 2 stream statistics words 0); a second End without Begin: still S_OK; Begin, Begin, End then GetData: S_OK, 0; End without any Begin: S_OK"
  predicate_hint: "an OCCLUSION_PREDICATE created with PREDICATEHINT refuses GetData: size 4 and NULL data with size 0 are both E_INVALIDARG"
  set_predication: "SetPredication(predicate, FALSE) then GetPredication returns the same predicate pointer (new reference) and 0; SetPredication(predicate, TRUE) gives value 1; SetPredication(NULL, FALSE) gives a NULL predicate and 0"
  no_removal: "none of these calls removes the device"
errors:
  argument: "E_INVALIDARG (0x80070057)"
  not_ended: "DXGI_ERROR_INVALID_CALL (0x887A0001)"
side_effects: "creates queries; End inserts a fence in the immediate context"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 4
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  queries on a drawn pipeline (occlusion counts above 0, statistics of real draws: no shader can be built here), deferred contexts, the number of GetData calls an EVENT query needs (machine dependent), timestamps across a disjoint reset, S_FALSE results of GetData (the WARP device always finished before the first call in the observed runs).
