# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/D3D11CreateDeviceAndSwapChain.yaml
id: windows/api/d3d11.dll/D3D11CreateDeviceAndSwapChain
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "D3D11CreateDeviceAndSwapChain function (d3d11.h)", "DXGI_SWAP_CHAIN_DESC", "D3D11CreateDevice function (d3d11.h)", "D3D_DRIVER_TYPE enumeration", "D3D_FEATURE_LEVEL enumeration"; d3d11.h, dxgi.h, dxgi1_2.h, d3dcommon.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Creates a device, its immediate context and a swap chain in one call, taking the older DXGI_SWAP_CHAIN_DESC (72 bytes). Chrome does not call it (ANGLE uses D3D11CreateDevice and the factory); it is part of the d3d11.dll surface. Observed with D3D_DRIVER_TYPE_WARP, a NULL adapter and a plain window: S_OK, level 0xB000 for a NULL level list, device reference count 3 (caller, immediate context and swap chain), swap chain count 1. The swap chain is created through the device's own adapter factory (GetParent(IDXGIFactory2) is the device's factory) and the swap chain's GetDesc1 reports AlphaMode IGNORE (3), unlike CreateSwapChainForHwnd with an unspecified alpha mode. Every output pointer is optional.
interface:
  signature: "HRESULT D3D11CreateDeviceAndSwapChain(IDXGIAdapter* pAdapter, D3D_DRIVER_TYPE DriverType, HMODULE Software, UINT Flags, const D3D_FEATURE_LEVEL* pFeatureLevels, UINT FeatureLevels, UINT SDKVersion, const DXGI_SWAP_CHAIN_DESC* pSwapChainDesc, IDXGISwapChain** ppSwapChain, ID3D11Device** ppDevice, D3D_FEATURE_LEVEL* pFeatureLevel, ID3D11DeviceContext** ppImmediateContext)"
  constants: "DXGI_SWAP_CHAIN_DESC (72 bytes): BufferDesc{Width, Height, RefreshRate{Numerator, Denominator}, Format, ScanlineOrdering, Scaling} (28 bytes), SampleDesc{Count, Quality} at 28, BufferUsage 36, BufferCount 40, OutputWindow HWND 48, Windowed BOOL 56, SwapEffect 60, Flags 64 (dxgi.h). The driver type and level values are those of D3D11CreateDevice"
rules:
  basic: "WARP, NULL adapter, level list empty, desc {window, 0x0, B8G8R8A8_UNORM, 1 buffer, DISCARD, Windowed TRUE}: S_OK, swap chain, device and context set, level 0xB000; reference counts: swap chain 1, device 3, context 1"
  swap_chain: "GetDevice(ID3D11Device) of the swap chain is the device (same pointer); GetDesc1: size = the window's client area, format 87, 1 buffer, effect 0, AlphaMode 3 (IGNORE), usage 0x20 (RENDER_TARGET_OUTPUT), samples 1/0, flags 0; the legacy GetDesc shows the format, BufferCount, Windowed TRUE, effect and the window; the swap chain answers IDXGISwapChain1 .. IDXGISwapChain4; GetParent(IDXGIFactory2) is the factory of the device's adapter; GetBuffer(0) and Present work; a second DISCARD swap chain for the same window from the device's factory is S_OK"
  optional_outputs: "only ppSwapChain: S_OK and a swap chain; only ppDevice (with the desc): S_OK, a device, no swap chain is made visible; swap chain and device: S_OK; swap chain and context only: S_OK; swap chain and level only: S_OK and level 0xB000; no outputs at all: S_FALSE (1), nothing created; a NULL desc with ppSwapChain set: S_OK, the swap chain output is NULL and device, context and level are produced; NULL desc without ppSwapChain: S_OK, a device and context"
  driver_types: "WARP with a NULL adapter: S_OK; UNKNOWN with the WARP adapter from EnumWarpAdapter: S_OK, level 0xB000; WARP with a non-NULL adapter, UNKNOWN with a NULL adapter, SOFTWARE (4) without a module, an undefined type 6: E_INVALIDARG with all outputs NULL and level 0; NULL (3): S_OK; REFERENCE (2): DXGI_ERROR_UNSUPPORTED (0x887A0004); HARDWARE (1) with a NULL adapter: S_OK on a machine with a GPU and the device's adapter is the first enumerated adapter (machine dependent)"
  levels_flags: "level lists behave as in D3D11CreateDevice: [11_1] gives 0xB100, [10_0] 0xA000, [9_1, 11_0] 0x9100, an unknown level 0x1234: E_INVALIDARG; flags 0 and SINGLETHREADED: S_OK; flags 0xFFFFFFFF: E_INVALIDARG"
  effects: "DISCARD (1 buffer), SEQUENTIAL (2), FLIP_SEQUENTIAL (2), FLIP_DISCARD (2): S_OK (the read-back effect equals the request, 3 and 4 included); effect 2 and 5: DXGI_ERROR_INVALID_CALL with NULL outputs"
  buffers: "BufferCount 0 and 17: DXGI_ERROR_INVALID_CALL; DISCARD: 1, 2, 3, 16 S_OK; FLIP_DISCARD: 1 gives DXGI_ERROR_INVALID_CALL, 2, 3 and 16 are S_OK"
  formats: "R8G8B8A8_UNORM, R16G16B16A16_FLOAT, R10G10B10A2_UNORM, B8G8R8A8_UNORM_SRGB and B8G8R8A8_UNORM (DISCARD): S_OK; UNKNOWN, B8G8R8X8_UNORM, NV12, R8_UNORM: E_INVALIDARG"
  size: "Width and Height 0, or either 0 (0x10): the window's client size; 64x32 and 1x1: as passed"
  window: "a destroyed window and a NULL OutputWindow: DXGI_ERROR_INVALID_CALL; the desktop window: S_OK (unlike CreateSwapChainForHwnd, which gives E_ACCESSDENIED)"
  samples: "SampleDesc 1/0, 2/0, 4/0 (DISCARD): S_OK and read back; 4/1, 0/0 and 3/0: E_INVALIDARG"
  other_fields: "BufferUsage 0 and 0x30, flags GDI_COMPATIBLE and ALLOW_MODE_SWITCH: S_OK and read back; flags 0xFFFFFFFF: DXGI_ERROR_INVALID_CALL; Scaling 1, 2, 9, ScanlineOrdering 9 and RefreshRate 60/1 are accepted and ignored (GetDesc1 reports Scaling 0); the two padding words of the structure are ignored"
  not_tried: "Windowed = FALSE (a real fullscreen switch) was not tried"
errors:
  invalid_call: "DXGI_ERROR_INVALID_CALL (0x887A0001)"
  not_found: "DXGI_ERROR_NOT_FOUND (0x887A0002)"
  no_interface: "E_NOINTERFACE (0x80004002)"
  invalid_arg: "E_INVALIDARG (0x80070057)"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
