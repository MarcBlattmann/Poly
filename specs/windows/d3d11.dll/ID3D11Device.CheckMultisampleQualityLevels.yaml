# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.CheckMultisampleQualityLevels.yaml
id: windows/api/d3d11.dll/ID3D11Device.CheckMultisampleQualityLevels
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::CheckMultisampleQualityLevels"; d3d11.h, d3d11_1.h, d3dcommon.h, dxgiformat.h, dxgi.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Number of quality levels for a format and a sample count. Observed on WARP (11_0): for the render-target and depth formats listed, counts 1, 2, 4, 8 and 16 give 1 level, 3 and 32 give 0; count 0 and count 64 are E_FAIL (0x80004005); formats that cannot be multisampled (NV12 103, BC1 71) give 0 for 2 to 16; format 0 (UNKNOWN) gives 0 for 2 to 16 and 1 for count 1; an unknown format (200) is E_INVALIDARG for every count.
interface:
  signature: "HRESULT ID3D11Device::CheckMultisampleQualityLevels(DXGI_FORMAT format, UINT sampleCount, UINT* numQualityLevels)"
chrome:
  calls: "ANGLE asks for the sample counts it offers for MSAA renderbuffers (assumed)"
rules:
  counts: "formats 28, 87, 88, 10, 2, 45, 40, 61, 24, 85: count 1 -> 1, 2 -> 1, 3 -> 0, 4 -> 1, 8 -> 1, 16 -> 1, 32 -> 0, 0 and 64 -> E_FAIL"
  no_msaa: "formats 103 (NV12) and 71 (BC1_UNORM): count 1 -> 1, 2, 3, 4, 8, 16, 32 -> 0, 0 and 64 -> E_FAIL; format 0: count 1 -> 1, 2 to 32 -> 0, 0 and 64 -> E_FAIL"
  bad_format: "format 200: E_INVALIDARG for every count"
errors:
  argument: "E_INVALIDARG"
  count: "E_FAIL (0x80004005) for counts 0 and 64"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  other levels, D3D11_1 variants, a hardware adapter's numbers.
