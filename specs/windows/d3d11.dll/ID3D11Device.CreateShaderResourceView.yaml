# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.CreateShaderResourceView.yaml
id: windows/api/d3d11.dll/ID3D11Device.CreateShaderResourceView
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::CreateShaderResourceView", "D3D11_SHADER_RESOURCE_VIEW_DESC", "D3D11_SRV_DIMENSION", "D3D11_BUFFEREX_SRV", "ID3D11ShaderResourceView::GetDesc", "ID3D11View::GetResource"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Makes a shader-resource view of a texture or a buffer. Chrome (ANGLE) makes SRVs of every texture it samples, with a NULL description or an explicit format / mip range (sRGB reinterpretation of typeless textures, depth textures read as R24_UNORM_X8_TYPELESS), and buffer SRVs for shader storage. A NULL description gives the texture's whole mip chain with the texture's format (TEXTURE2D, TEXTURE2DARRAY, TEXTURE2DMS, TEXTURECUBE, TEXTURECUBEARRAY chosen from the texture); GetDesc returns the completed description (MipLevels -1 and ArraySize -1 replaced by real counts, Format UNKNOWN replaced by the texture's). Views do not change the public reference count of the resource.
interface:
  signature: "HRESULT ID3D11Device::CreateShaderResourceView(ID3D11Resource* resource, const D3D11_SHADER_RESOURCE_VIEW_DESC* desc, ID3D11ShaderResourceView** view)"
  layout: "D3D11_SHADER_RESOURCE_VIEW_DESC (24 bytes, 6 words): Format, ViewDimension, then a union of up to 4 words: TEXTURE2D {MostDetailedMip, MipLevels}, TEXTURE2DARRAY {MostDetailedMip, MipLevels, FirstArraySlice, ArraySize}, TEXTURE2DMS {unused}, TEXTURE2DMSARRAY {FirstArraySlice, ArraySize}, TEXTURECUBE {MostDetailedMip, MipLevels}, TEXTURECUBEARRAY {MostDetailedMip, MipLevels, First2DArrayFace, NumCubes}, BUFFER {FirstElement, NumElements}, BUFFEREX {FirstElement, NumElements, Flags (RAW = 1)} (d3d11.h)"
  constants: "D3D11_SRV_DIMENSION: UNKNOWN 0, BUFFER 1, TEXTURE1D 2, TEXTURE1DARRAY 3, TEXTURE2D 4, TEXTURE2DARRAY 5, TEXTURE2DMS 6, TEXTURE2DMSARRAY 7, TEXTURE3D 8, TEXTURECUBE 9, TEXTURECUBEARRAY 10, BUFFEREX 11"
chrome:
  calls: "ANGLE creates SRVs for every texture it samples and for buffers used as shader storage (assumed; not visible to the tracer)"
rules:
  null_desc_defaults: "NULL description: a B8G8R8A8_UNORM texture gives Format 87, TEXTURE2D (4), MostDetailedMip 0, MipLevels 1 (4 mips: MipLevels 4); a 3-slice 2-mip non-typeless array gives TEXTURE2DARRAY (5) with mips 0/2 and slices 0/3; a multisampled texture gives TEXTURE2DMS (6); a 6-slice cube gives TEXTURECUBE (9) with MipLevels 1; 2 cubes (12 slices) with 2 mips give TEXTURECUBEARRAY (10), MipLevels 2, First2DArrayFace 0, NumCubes 2; a dynamic texture gives TEXTURE2D"
  null_desc_refused: "a NULL description is E_INVALIDARG for TYPELESS textures (including a typeless array and depth R24G8_TYPELESS / R32_TYPELESS), a render-target-only texture, a staging texture, a depth-stencil-only texture and an NV12 texture; for buffers: a structured buffer succeeds (Format UNKNOWN, BUFFER dimension 1, FirstElement 0, NumElements = ByteWidth / stride, e.g. 16), a typed buffer and a raw buffer are E_INVALIDARG"
  mip_range: "MipLevels must fit: 2 levels of a 1-mip texture, 0 levels, MostDetailedMip 1 of 1 mip, 4 of 4 mips, 2..+3 of 4 mips are E_INVALIDARG; 0..4 of 4 and 2..+2 succeed; MipLevels 0xFFFFFFFF means 'all remaining' and GetDesc returns the real count (1 mip: 1; 4 mips from 3: 1; from 1: 3; a cube of 1 mip: 1; arrays: from 1 of 3 mips: 2)"
  format: "a typed texture accepts only its own format (or UNKNOWN): B8G8R8A8_UNORM as UNORM_SRGB, RGBA8, BGRX8, R32_FLOAT, 0xFFFF is E_INVALIDARG; a TYPELESS R8G8B8A8 texture takes UNORM (28), UNORM_SRGB (29), SNORM (31), UINT (30) and refuses TYPELESS, UNKNOWN, R32_FLOAT; R24G8_TYPELESS depth takes R24_UNORM_X8_TYPELESS (46) and X24_TYPELESS_G8_UINT (47) and refuses D24_UNORM_S8_UINT, R32_FLOAT, UNKNOWN; R32_TYPELESS depth takes R32_FLOAT (41) and R32_UINT (42) and refuses D32_FLOAT"
  dimension: "dimension UNKNOWN, 12, BUFFER, TEXTURE1D, TEXTURE3D and CUBE on a non-cube texture are E_INVALIDARG; TEXTURE2DARRAY on a non-array texture works with ArraySize 1 and not 2; TEXTURE2DMS also succeeds on a single-sample texture; a multisampled texture takes TEXTURE2DMS and TEXTURE2DMSARRAY (slice 0 size 1) and refuses TEXTURE2D; a typeless array of 3 slices as TEXTURE2D (UNORM_SRGB, mips 1..2) succeeds and as TEXTURECUBE is E_INVALIDARG; a cube texture takes TEXTURECUBE, TEXTURECUBEARRAY (one cube), TEXTURE2DARRAY (6 slices, or 3 from slice 2) and TEXTURE2D; two cubes: CUBEARRAY with NumCubes 2 (First2DArrayFace 0), one cube from face 6 or from face 3 succeed, NumCubes 3 is E_INVALIDARG and a one-cube texture with NumCubes 2 is E_INVALIDARG"
  array_range: "typeless 3-slice 3-mip array as UNORM 2DARRAY: slices 0..3, 1..2 (size 2), mip 1 levels 2 succeed; first 2 size 2, size 0, mip 3, levels 4 are E_INVALIDARG; size -1 from slice 1 gives ArraySize 2"
  buffer: "typed buffer (SHADER_RESOURCE bind, 256 bytes): R32_FLOAT elements 0..64 and 8..16, R8G8B8A8_UNORM 0..64, R32G32B32A32_FLOAT 0..16 succeed; 0..65, 64..1, NumElements 0, 0..17 of 16-byte elements, Format UNKNOWN are E_INVALIDARG; BUFFEREX with a typed format and no flag succeeds (GetDesc dimension 11); structured buffer (stride 16): UNKNOWN with 0..16 and 4..8 succeed, 17 elements and R32_FLOAT are E_INVALIDARG, BUFFEREX UNKNOWN succeeds; raw buffer: BUFFEREX with R32_TYPELESS (39), Flags RAW, 0..64 succeeds and is read back with Flags 1 in the third union word; RAW with 65 elements, without the flag, with R32_FLOAT or UNKNOWN are E_INVALIDARG; a BUFFER view with R32_FLOAT of a raw buffer succeeds; the RAW flag on a non-raw typed buffer is E_INVALIDARG; a buffer without the shader-resource bind and a TEXTURE2D view of a buffer are E_INVALIDARG"
  null_output: "a NULL output pointer only validates: S_FALSE for a valid NULL or explicit description (also for a typed buffer view), E_INVALIDARG for an out-of-range MipLevels, a texture without the bind, a typeless NULL description"
  references: "the public reference count of the resource is the same with or without a view alive (1 -> 1); GetResource adds one reference and returns the resource's own pointer; the view keeps the resource alive after the creator released it (GetResource still gives a texture, GetType 3)"
  interfaces: "an SRV answers ID3D11ShaderResourceView, ID3D11View, ID3D11ShaderResourceView1 and ID3D11DeviceChild with the same pointer; ID3D11RenderTargetView gives E_NOINTERFACE; two views with the same NULL description are two objects"
errors:
  argument: "E_INVALIDARG (0x80070057)"
side_effects: "creates a view; the view keeps the resource alive"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  TEXTURE1D, TEXTURE3D and texture-array dimensions of 1D/3D resources, video-plane formats of NV12, depth-stencil views read through SRVs in a draw, SRVs of buffers larger than 128 MB.
