# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.CreateBuffer.yaml
id: windows/api/d3d11.dll/ID3D11Device.CreateBuffer
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::CreateBuffer", "D3D11_BUFFER_DESC", "D3D11_SUBRESOURCE_DATA", "D3D11_USAGE", "D3D11_BIND_FLAG", "D3D11_CPU_ACCESS_FLAG", "D3D11_RESOURCE_MISC_FLAG", "ID3D11Buffer::GetDesc", "ID3D11Resource::GetType", "ID3D11Resource::SetEvictionPriority"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Makes a buffer on a WARP device. Chrome (ANGLE) makes vertex, index and constant buffers (usage DEFAULT or DYNAMIC), staging buffers for read-back and uploads, structured / raw buffers for shader storage and transform feedback, and DRAWINDIRECT_ARGS buffers (assumed from ANGLE's documented design; the buffer calls go through the device pointer and are invisible to the API tracer). The description is checked in full: anything invalid gives E_INVALIDARG and a NULL buffer. A buffer without initial data is zero filled. GetDesc returns the description with the fields that do not apply cleared (the stride of a buffer without the structured flag reads 0).
interface:
  signature: "HRESULT ID3D11Device::CreateBuffer(const D3D11_BUFFER_DESC* desc, const D3D11_SUBRESOURCE_DATA* init, ID3D11Buffer** buffer)"
  layout: "D3D11_BUFFER_DESC (24 bytes, 6 words): ByteWidth, Usage, BindFlags, CPUAccessFlags, MiscFlags, StructureByteStride. D3D11_SUBRESOURCE_DATA: pSysMem, SysMemPitch, SysMemSlicePitch (d3d11.h)"
  constants: "usage DEFAULT 0 IMMUTABLE 1 DYNAMIC 2 STAGING 3; bind VERTEX_BUFFER 1 INDEX_BUFFER 2 CONSTANT_BUFFER 4 SHADER_RESOURCE 8 STREAM_OUTPUT 0x10 RENDER_TARGET 0x20 DEPTH_STENCIL 0x40 UNORDERED_ACCESS 0x80; cpu WRITE 0x10000 READ 0x20000; misc SHARED 2 DRAWINDIRECT_ARGS 0x10 BUFFER_ALLOW_RAW_VIEWS 0x20 BUFFER_STRUCTURED 0x40 SHARED_KEYEDMUTEX 0x100 SHARED_NTHANDLE 0x800 (d3d11.h)"
chrome:
  calls: "ANGLE creates its vertex, index and constant buffers and the staging buffers of its readback path through the device pointer (assumed from its documented design; not visible to the tracer)"
rules:
  byte_width: "ByteWidth 0 is E_INVALIDARG; every size from 1 (also 3, 17: no alignment is needed) up to 0x80000000 succeeds on a fresh WARP device and GetDesc returns the width unchanged (1, 3, 4, 16, 17, 64, 65536, 65537, 1 MB, 16 MB, 64 MB, 128 MB, 128 MB + 1, 256 MB, 512 MB, 1 GB, 0x7FFFFFFF, 0x80000000 tested, each on its own device; a DEFAULT buffer reads back zeros); 0xFFFFFFF0 and 0xFFFFFFFF: E_OUTOFMEMORY (0x8007000E). The large sizes depend on the memory of the machine: in a first draft of the test several buffers of 256 MB to 2 GB on ONE device ended with the device removed (0x887A0005) on the author's PC, so tests give each huge buffer a device of its own"
  constant_buffer: "a constant buffer needs a ByteWidth that is a multiple of 16: 1, 15, 17 are E_INVALIDARG; 16, 32, 64, 4096, 65536, 65552 and 1 MB succeed (there is no 64 KB limit); CONSTANT_BUFFER may not be combined with any other bind flag: with VERTEX_BUFFER, INDEX_BUFFER, SHADER_RESOURCE or UNORDERED_ACCESS it is E_INVALIDARG"
  bind_flags: "default usage: bind 0, VERTEX, INDEX, CONSTANT, SHADER_RESOURCE, STREAM_OUTPUT, RENDER_TARGET, UNORDERED_ACCESS succeed alone; DEPTH_STENCIL is E_INVALIDARG; the combinations VERTEX|INDEX (3), VERTEX|SRV (9), SRV|UAV (0x88), VERTEX|STREAM_OUTPUT (0x11), SRV|STREAM_OUTPUT (0x18), RENDER_TARGET|SRV (0x28), VERTEX|RENDER_TARGET (0x21) succeed; 0xFF is E_INVALIDARG; the undefined bits 0x100 and 0x400 are accepted and stored as given (GetDesc returns 0x100 / 0x400)"
  usage_default: "bind 0, VERTEX, INDEX, CONSTANT, STREAM_OUTPUT or RENDER_TARGET with CPU access 0 succeed and with CPU WRITE, READ or both are E_INVALIDARG; SHADER_RESOURCE or UNORDERED_ACCESS accept CPU access 0, WRITE, READ and both (a DEFAULT buffer with an SRV bind and CPU_WRITE succeeds); with or without initial data"
  usage_immutable: "IMMUTABLE needs initial data and bind VERTEX, CONSTANT, SHADER_RESOURCE or INDEX with CPU access 0: without data (a NULL init pointer), with bind 0, UNORDERED_ACCESS, STREAM_OUTPUT or RENDER_TARGET, or with any CPU access flag it is E_INVALIDARG; GetDesc returns usage 1"
  usage_dynamic: "DYNAMIC needs bind VERTEX, INDEX, CONSTANT or SHADER_RESOURCE and CPU_WRITE (0x10000) exactly; with or without initial data it succeeds; CPU access 0, READ or READ|WRITE, bind 0, UNORDERED_ACCESS, STREAM_OUTPUT, RENDER_TARGET are E_INVALIDARG"
  usage_staging: "STAGING needs bind 0 and CPU access WRITE, READ or both (also with initial data); CPU access 0 and any bind flag are E_INVALIDARG; a usage value of 4 (any bind, any CPU flags) is E_INVALIDARG"
  initial_data: "a D3D11_SUBRESOURCE_DATA with pSysMem NULL is E_INVALIDARG (tried for DEFAULT and IMMUTABLE); SysMemPitch and SysMemSlicePitch are ignored (7777 and 8888 succeed); the bytes arrive in the buffer (64 bytes of 0xA5 read back as 0xA5 through a staging copy); a buffer without data reads back zeros"
  structured: "MISC BUFFER_STRUCTURED (0x40) needs StructureByteStride between 1 and 2048 with ByteWidth a multiple of the stride: 64/16, 64/4, 64/64, 60/12, 2048/2048 succeed; 64/12 (not a multiple), stride 0, 3 (the 64/3 case), 128 for a 64-byte buffer, 4104/2052 and 4112/2056 (stride above 2048) are E_INVALIDARG; bind SHADER_RESOURCE, UNORDERED_ACCESS, both, or 0 succeed; VERTEX, CONSTANT, RENDER_TARGET, STREAM_OUTPUT binds are E_INVALIDARG; DYNAMIC (SRV, CPU_WRITE), STAGING, and DEFAULT with SRV and CPU_WRITE succeed; IMMUTABLE without data is E_INVALIDARG; GetDesc returns the stride"
  stride_ignored: "a non-zero StructureByteStride without the structured flag is accepted and read back as 0 (shader-resource and vertex-buffer cases)"
  raw: "MISC BUFFER_ALLOW_RAW_VIEWS (0x20) needs SHADER_RESOURCE or UNORDERED_ACCESS in the bind flags (alone, both, or with VERTEX: 0x9 succeeds): bind 0, VERTEX alone, INDEX, CONSTANT, STREAM_OUTPUT are E_INVALIDARG; any ByteWidth (4, 62, 64) is accepted; a stride of 4 is accepted and read back as 0; RAW with STRUCTURED and RAW with STAGING are E_INVALIDARG"
  draw_indirect: "MISC DRAWINDIRECT_ARGS (0x10) accepts bind 0, VERTEX, SRV, UAV and SRV|UAV with ByteWidth 20 or 64; ByteWidth 3 is E_INVALIDARG (observed only for 3); STAGING and DRAWINDIRECT_ARGS with STRUCTURED are E_INVALIDARG; with RAW_VIEWS (UAV bind) it succeeds and GetDesc returns misc 0x30"
  shared: "MISC SHARED (2) succeeds with bind SRV, VERTEX or 0; SHARED_KEYEDMUTEX (0x100) alone succeeds; SHARED|KEYEDMUTEX is E_INVALIDARG; every combination with SHARED_NTHANDLE (0x800: alone, with SHARED, with KEYEDMUTEX, with both) is E_INVALIDARG for buffers (NT handles are for textures)"
  misc_other: "with bind SRV|RENDER_TARGET: GENERATE_MIPS (1), TEXTURECUBE (4), 0x8, RESOURCE_CLAMP (0x80), GDI_COMPATIBLE (0x200), 0x400, RESTRICTED_CONTENT (0x1000), 0x10000, TILE_POOL (0x20000), HW_PROTECTED (0x80000) and 0x80000000 are E_INVALIDARG; GUARDED (0x8000), TILED (0x40000) and 0x100000 succeed and are stored as given"
  get_desc: "ID3D11Buffer::GetDesc returns ByteWidth, Usage, BindFlags, CPUAccessFlags, MiscFlags as created (see the cases above for the fields that are cleared) and the stride only with the structured flag"
  resource: "ID3D11Resource::GetType returns D3D11_RESOURCE_DIMENSION_BUFFER (1); the eviction priority of a new buffer is 0x78000000 (DXGI_RESOURCE_PRIORITY_NORMAL); SetEvictionPriority stores any value and GetEvictionPriority returns it unchanged (0x28000000, 0x50000000, 0x78000000, 0xA0000000, 0xC8000000, 12345, 0)"
  interfaces: "a buffer has reference count 1; it answers QueryInterface for ID3D11Buffer, ID3D11Resource and ID3D11DeviceChild with the same pointer, and for IDXGIResource, IDXGIResource1, IDXGIObject and IDXGIDeviceSubObject with other pointers; ID3D11Texture2D, IDXGIKeyedMutex (an unshared buffer) and ID3D11Query give E_NOINTERFACE (0x80004002); GetDevice returns the creating device"
  null_output: "a NULL output pointer only validates: S_FALSE (1) for a valid description (also with initial data for IMMUTABLE and also for ByteWidth 0xFFFFFFFF, where a real creation gives E_OUTOFMEMORY), E_INVALIDARG for an invalid one; nothing is created"
errors:
  argument: "E_INVALIDARG (0x80070057)"
  memory: "E_OUTOFMEMORY (0x8007000E) for ByteWidth 0xFFFFFFF0 and 0xFFFFFFFF"
side_effects: "creates a buffer"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  buffers above 2 GB other than the refused 0xFFFFFFF0 and 0xFFFFFFFF (memory dependent), the memory limit of the machine, deferred contexts, initial data shorter than ByteWidth (reads beyond the data), bind flags combined with the video and decoder bits, buffers on the hardware adapter.
