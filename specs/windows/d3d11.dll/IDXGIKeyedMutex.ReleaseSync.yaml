# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/IDXGIKeyedMutex.ReleaseSync.yaml
id: windows/api/d3d11.dll/IDXGIKeyedMutex.ReleaseSync
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "IDXGIKeyedMutex::ReleaseSync", "IDXGIKeyedMutex::AcquireSync", "Sharing Resources and Surfaces"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Frees a keyed mutex and sets its key. Observed: it fails with DXGI_ERROR_INVALID_CALL (0x887A0001) unless the same mutex object holds it, and it never changes the key then. Writes made to a keyed texture without holding the mutex are silently dropped and a copy from such a texture reads zeros: no error, no device removal. A texture released while acquired does no harm.
interface:
  signature: "HRESULT IDXGIKeyedMutex::ReleaseSync(UINT64 key)"
chrome:
  calls: "the GPU process releases the keyed mutex with the key the other side waits for (assumed from Chrome's shared-image design)"
rules:
  never_acquired: "ReleaseSync(0), (1), (7) on a mutex that was never acquired: DXGI_ERROR_INVALID_CALL; the key is unchanged: AcquireSync(0, 0) is then S_OK"
  twice: "Acquire(0), Release(1): S_OK; Release(1) again and Release(2): DXGI_ERROR_INVALID_CALL; then Acquire(1, 0) is S_OK; Release(0) S_OK"
  same_key: "Acquire(0) then Release(0) is S_OK and Acquire(0, 0) works again"
  other_object: "acquired through one mutex object, ReleaseSync through another object of the same resource (same device): DXGI_ERROR_INVALID_CALL; the holder's own ReleaseSync then works and the other object can AcquireSync the new key"
  unacquired_use: "on a keyed texture whose mutex the caller does not hold: UpdateSubresource and ClearRenderTargetView have no effect, and a CopyResource from it leaves the staging destination unchanged (zeros): sequence UpdateSubresource(0xFF010203) without acquire, read 0; AcquireSync(0): read still 0 (the update was dropped); UpdateSubresource(0xFF0A0A0A) under the lock reads back 0xFF0A0A0A under the lock; after ReleaseSync(0) the read is 0 again and an update is dropped; after the next AcquireSync(0, 0) the read is 0xFF0A0A0A (the data written under the lock is kept); no call fails and the device stays alive"
  released_while_acquired: "releasing the last reference of an acquired texture then creating another keyed texture works: the new mutex starts at key 0 (AcquireSync(0, 0) S_OK) and the device is alive"
errors:
  invalid: "DXGI_ERROR_INVALID_CALL (0x887A0001)"
side_effects: "frees the mutex and sets its key"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  release from another thread than the acquirer, release after the device was removed, the effect of unacquired use under the debug layer (messages).
