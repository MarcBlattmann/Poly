# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.GetCreationFlags.yaml
id: windows/api/d3d11.dll/ID3D11Device.GetCreationFlags
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::GetCreationFlags", "ID3D11Device::GetDeviceRemovedReason", "ID3D11Device::SetExceptionMode", "ID3D11Device::GetExceptionMode", "ID3D11Device::SetPrivateData", "ID3D11Device::GetPrivateData", "ID3D11Device::SetPrivateDataInterface", "ID3D11Device::GetFeatureLevel"; d3d11.h, d3d11_1.h, d3dcommon.h, dxgiformat.h, dxgi.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  The device's own state: the creation flags read back unchanged, the removed reason (0 on a live device), the exception mode (only 0 and 1 are accepted), and private data (a byte blob or an interface per GUID, with the size query and the DXGI_ERROR_MORE_DATA / DXGI_ERROR_NOT_FOUND results). Chrome names its objects with SetPrivateData(WKPDID_D3DDebugObjectName) (assumed from the debug-name convention of Learn's page).
interface:
  signature: "UINT GetCreationFlags(); HRESULT GetDeviceRemovedReason(); HRESULT SetExceptionMode(UINT); UINT GetExceptionMode(); HRESULT SetPrivateData(REFGUID, UINT, const void*); HRESULT GetPrivateData(REFGUID, UINT*, void*); HRESULT SetPrivateDataInterface(REFGUID, const IUnknown*)"
rules:
  flags_read_back: "a device created with the flags 0, SINGLETHREADED (1), BGRA_SUPPORT (0x20), 0x21 and PREVENT_INTERNAL_THREADING_OPTIMIZATIONS (8) returns the same value from GetCreationFlags; the flags 0x4 (SWITCH_TO_REFERENCE) and 0x10 are accepted by D3D11CreateDevice on a machine with the SDK layers (the owner's PC) and refused with DXGI_ERROR_SDK_COMPONENT_MISSING (0x887A002D) on one without them (homeserver2, the oracle): the oracle is the reference"
  removed_reason: "a live device: S_OK (0); after an invalid copy the reason is DXGI_ERROR_DEVICE_REMOVED (0x887A0005), see ID3D11DeviceContext.CopyResource"
  exception_mode: "GetExceptionMode is 0 after creation; SetExceptionMode(0) and (1) return S_OK and the value is read back; 2, 4, 8, 0xF, 0x10 and 0xFFFFFFFF return E_INVALIDARG and leave the mode unchanged"
  private_data: "GetPrivateData of an unknown GUID: DXGI_ERROR_NOT_FOUND (0x887A0002) and size 0; SetPrivateData of 5 bytes: S_OK; a size query (NULL buffer): S_OK and size 5; a buffer of 3 bytes: DXGI_ERROR_MORE_DATA (0x887A0003), size set to 5 and the buffer untouched; an 8-byte buffer: S_OK, size 5, the data; setting again replaces it (2 bytes -> size 2); size 0 with NULL data removes it (then NOT_FOUND); WKPDID_D3DDebugObjectName ({429b8c22-9188-4b0c-8742-acb0bf85c200}) holds 11 bytes like any other GUID; NULL data with a non-zero size: S_FALSE (1)"
  private_interface: "SetPrivateDataInterface(texture) is S_OK and adds a reference to the texture (count 2 while held); GetPrivateData of such an entry returns S_OK with size 8 (the pointer); removing it with SetPrivateData(size 0) did not change the texture's count in the observation (2 after)"
  feature_level: "GetFeatureLevel returns the level D3D11CreateDevice reported"
errors:
  argument: "E_INVALIDARG (0x80070057)"
  more_data: "DXGI_ERROR_MORE_DATA (0x887A0003)"
  not_found: "DXGI_ERROR_NOT_FOUND (0x887A0002)"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  device removal by anything but an invalid copy (hang, driver reset), exception mode effects (no debug layer), private data of a size above 64 KB.
