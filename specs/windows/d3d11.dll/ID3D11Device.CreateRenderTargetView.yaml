# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/d3d11.dll/ID3D11Device.CreateRenderTargetView.yaml
id: windows/api/d3d11.dll/ID3D11Device.CreateRenderTargetView
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "ID3D11Device::CreateRenderTargetView", "D3D11_RENDER_TARGET_VIEW_DESC", "D3D11_RTV_DIMENSION", "ID3D11RenderTargetView::GetDesc", "ID3D11View::GetResource"; d3d11.h, d3d11_1.h, d3d11_3.h, d3dcommon.h, dxgi.h, dxgi1_2.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Makes a render-target view of a texture (or a buffer). Chrome (ANGLE) makes one for each swap-chain back buffer and each render texture, almost always with a NULL description or the texture's own format. A NULL description gives the texture's format and the whole first mip (TEXTURE2D, or TEXTURE2DMS for multisampled textures, or the array dimensions for an array); GetDesc returns the completed description (format never UNKNOWN, ArraySize -1 replaced by the real count). A view does NOT change the public reference count of its resource; the resource stays alive as long as a view exists even when the creator released it.
interface:
  signature: "HRESULT ID3D11Device::CreateRenderTargetView(ID3D11Resource* resource, const D3D11_RENDER_TARGET_VIEW_DESC* desc, ID3D11RenderTargetView** view)"
  layout: "D3D11_RENDER_TARGET_VIEW_DESC (20 bytes, 5 words): Format, ViewDimension, then a union of up to 3 words: TEXTURE2D {MipSlice}, TEXTURE2DARRAY {MipSlice, FirstArraySlice, ArraySize}, TEXTURE2DMS {unused}, TEXTURE2DMSARRAY {FirstArraySlice, ArraySize}, TEXTURE1D {MipSlice}, TEXTURE1DARRAY {MipSlice, FirstArraySlice, ArraySize}, TEXTURE3D {MipSlice, FirstWSlice, WSize}, BUFFER {FirstElement, NumElements} (d3d11.h)"
  constants: "D3D11_RTV_DIMENSION: UNKNOWN 0, BUFFER 1, TEXTURE1D 2, TEXTURE1DARRAY 3, TEXTURE2D 4, TEXTURE2DARRAY 5, TEXTURE2DMS 6, TEXTURE2DMSARRAY 7, TEXTURE3D 8"
chrome:
  calls: "ANGLE and the swap-chain code create one render-target view per back buffer / render texture (assumed; not visible to the tracer)"
rules:
  null_desc_2d: "NULL description of a B8G8R8A8_UNORM render-target texture (also with 3 mips): S_OK, GetDesc Format 87 (the texture's), ViewDimension TEXTURE2D (4), MipSlice 0; an R16G16B16A16_FLOAT texture gives Format 10; a multisampled texture gives TEXTURE2DMS (6); a multisampled array of 2 gives TEXTURE2DMSARRAY (7) with FirstArraySlice 0 and ArraySize 2; a non-typeless array of 3 slices with 2 mips gives TEXTURE2DARRAY (5) MipSlice 0, FirstArraySlice 0, ArraySize 3"
  null_desc_refused: "a NULL description is E_INVALIDARG for a TYPELESS texture (R8G8B8A8_TYPELESS, plain or array), for a texture without the RENDER_TARGET bind, for a staging texture and for a buffer"
  explicit_format: "Format UNKNOWN in the description means the texture's format (GetDesc shows 87); the format must be the texture's own format for a typed texture: B8G8R8A8_UNORM as UNORM_SRGB (91), as R8G8B8A8_UNORM, as B8X8, as R32_FLOAT, as B8G8R8A8_TYPELESS, as R10G10B10A2, as 0xFFFF or 200: E_INVALIDARG (no sRGB reinterpretation of a typed texture on WARP); an R16G16B16A16_FLOAT texture as R16G16B16A16_UNORM is E_INVALIDARG; a TYPELESS texture takes UNORM (28), UNORM_SRGB (29) and UINT (30) of its family and refuses UNKNOWN, TYPELESS itself, B8G8R8A8_UNORM, R32_FLOAT, R32_UINT"
  dimension: "the dimension must fit the texture: TEXTURE2D for a plain texture; UNKNOWN, TEXTURE1D, TEXTURE1DARRAY, TEXTURE3D, BUFFER, 9 and 99 are E_INVALIDARG; TEXTURE2DARRAY on a non-array texture succeeds only for FirstArraySlice 0 with ArraySize 1 or -1 (GetDesc shows ArraySize 1); ArraySize 2 or 0 are E_INVALIDARG; TEXTURE2DMS and TEXTURE2DMSARRAY (slice 0, size 1) also succeed on a single-sample texture; for a multisampled texture TEXTURE2D is E_INVALIDARG and TEXTURE2DMS succeeds; TEXTURE2DMSARRAY on a multisampled non-array texture succeeds with slice 0 size 1 and is E_INVALIDARG for size 2 or 0"
  mip_slice: "MipSlice must be below the mip count: 1 of a 1-mip texture, 3 of 3, 4 of 4, 0xFFFFFFFF are E_INVALIDARG; 2 of 3 succeeds and is reported"
  array_range: "for a 3-slice array texture: FirstArraySlice 0 ArraySize 3, slices 1..2 (with MipSlice 3 of 4), a plain TEXTURE2D view (slice 0) succeed; ArraySize 0, FirstArraySlice + ArraySize above 3 (first 3 size 1, first 2 size 2, first 0 size 4), FirstArraySlice 0xFFFFFFFF are E_INVALIDARG; ArraySize 0xFFFFFFFF means all remaining slices and GetDesc returns the real count (first 1 -> 2, first 2 -> 1); MSARRAY: slice 0 size 2, slice 1 size 1 succeed, slice 1 size 2 is E_INVALIDARG, size 0xFFFFFFFF gives the real count 2"
  buffer: "a buffer with the RENDER_TARGET bind takes a BUFFER-dimension view with an explicit format (R32_FLOAT, elements 0..16 of a 256-byte buffer succeed, GetDesc dimension 1, FirstElement 0, NumElements 16); a NULL description, Format UNKNOWN, NumElements 65 (past the end), a buffer without the render-target bind, a TEXTURE2D view of a buffer and a stream-output|SRV buffer are E_INVALIDARG"
  null_output: "a NULL output pointer only validates: S_FALSE (1) for a valid NULL or explicit description, E_INVALIDARG for a bad MipSlice, a texture without the bind, a staging texture or a typeless NULL description"
  references: "creating a view does not change the resource's reference count (1 before, 1 with the view alive, 1 after the view is released); ID3D11View::GetResource returns a new reference to the same pointer as the resource (count + 1 until released); when the creator releases its only reference of the texture the view keeps it alive: GetResource still returns a texture (GetType 3) with count 1"
  interfaces: "a view answers ID3D11RenderTargetView, ID3D11View, ID3D11DeviceChild and ID3D11RenderTargetView1 with the same pointer; ID3D11ShaderResourceView and ID3D11Resource give E_NOINTERFACE; GetDevice returns the device; AddRef on a view returns 2 and Release back 1; two views made with the same NULL description are two objects"
  no_removal: "none of the invalid descriptions removes the device (GetDeviceRemovedReason stays S_OK)"
errors:
  argument: "E_INVALIDARG (0x80070057)"
side_effects: "creates a view; the view keeps the resource alive"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  TEXTURE1D and TEXTURE3D resources (not created by the tests), MipSlice and array ranges of 3D textures (FirstWSlice, WSize), views of video-format textures (NV12 planes), views of staging-bound shared resources.
