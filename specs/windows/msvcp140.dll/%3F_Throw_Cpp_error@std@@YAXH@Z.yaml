# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/msvcp140.dll/?_Throw_Cpp_error@std@@YAXH@Z # must match coverage.json
oracle:                                       # where the behaviour was observed
  os: "Windows 11 Home 25H2 (build 26200.9974), x64, with the Visual C++ Redistributable 14.44.35211 in System32 (vcruntime140.dll, vcruntime140_1.dll, msvcp140.dll all 14.44.35211.0)"
  machine: "homeserver2 (the owner's home PC, real hardware), session 0 over SSH; the tests are x64 programs built by Microsoft's compiler (cl 19.44.35230, Visual Studio Build Tools 14.44.35207, Windows SDK 10.0.22621.0, C:\\\\BuildTools) with /EHsc /GS- /Zl /O1, no C or C++ runtime of their own, linked with /NODEFAULTLIB against import libraries made from tests/windows/cxx/*.def and from the DLL's own export table, run by tools/pipeline/windows/poly-oracle.ps1, two runs each, identical"
  observed_by: spec-vcrt-1
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (the tests of this entry); class layouts, sizes,
  offsets and constants read from Microsoft's STL and vcruntime headers that ship with the Build Tools
  (Apache-2.0 with LLVM exception; owner decision 2026-11-15: spec agents may read them for layouts, sizes,
  offsets, vtable order and member meaning; nothing of them is copied here); the compiler's own output for our
  own probe programs (cl /FAs listings: the arguments of the calls the compiler writes, the RTTI records it
  emits). No Microsoft binary was disassembled or debugged, no vcruntime or CRT source was read.
summary: >
  std::_Throw_Cpp_error(int code) throws a std::system_error for the C threading error codes of <xthreads.h>
  (the enum _DEVICE_OR_RESOURCE_BUSY 0, _INVALID_ARGUMENT 1, _NO_SUCH_PROCESS 2, _NOT_ENOUGH_MEMORY 3,
  _OPERATION_NOT_PERMITTED 4, _RESOURCE_DEADLOCK_WOULD_OCCUR 5, _RESOURCE_UNAVAILABLE_TRY_AGAIN 6): the
  error_code is the matching std::errc value in the generic category and what() is its text twice ("<message>:
  <message>"). It never returns.
interface:
  signature: "[[noreturn]] void __cdecl std::_Throw_Cpp_error(int code)"
rules:
  codes: "0 -> errc::device_or_resource_busy (value 16, what \"device or resource busy: device or resource busy\"); 1 -> invalid_argument (22); 2 -> no_such_process (3); 3 -> not_enough_memory (12); 4 -> operation_not_permitted (1); 5 -> resource_deadlock_would_occur (36); 6 -> resource_unavailable_try_again (11); each what() is \"<text>: <text>\" with <text> = the errc name with spaces (\"resource unavailable try again\"); e.code().category() == std::generic_category()"
  type: "the exception is exactly std::system_error (a std::runtime_error, a std::exception)"
  category: "the category object inside the thrown error_code is created by the library and is a DIFFERENT object from the program's own std::generic_category(), but compares equal to it: std::error_category::operator== compares the 64-bit identity word stored at offset 8 of the object (after the virtual table pointer), not the address; the identity word of the generic category is 3 (iostream 5, system 7). The test msvcp_throw_cpp_error checks `e.code().category() == std::generic_category()`. The layout of error_category, its virtual table order, the three words and the other category functions are in the sheet of ?_Winerror_message@std@@YAKKPEADK@Z (spec-vcrt-2), and the test error_library_categories there checks this identity too."
errors:
  throws: "std::system_error"
side_effects: "none beyond the results above"
threading: "the tests are single-threaded"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "each test runs in well under a second on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  The tests are C++ with the line `// poly-cxx: compiler=msvc`: their executables were built on the oracle
  machine by Microsoft's compiler (tools/pipeline/windows/msvc-build.ps1) and are checked in beside the sources
  as `<name>.exe` (test artefacts); `cargo xtask pipeline win build` takes them as they are. They import from
  vcruntime140.dll, vcruntime140_1.dll, msvcp140.dll, ucrtbase.dll and kernel32.dll only. msvcp_throw_cpp_error
  also needs operator new (the test defines it on malloc), strlen and _invoke_watson from ucrtbase and
  generic_category from msvcp140.
