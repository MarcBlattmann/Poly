  observed_by: "spec-vcrt-2"
  date: "2026-11-16"
sources: |
  Observations of our own test programs on the machine above (the tests of this entry); class layouts, sizes, offsets,
  vtable orders and constants read from Microsoft's STL headers that ship with the Build Tools (Apache-2.0 with LLVM
  exception; owner decision 2026-11-15, CLEAN_ROOM.md: spec agents may read them for layouts, sizes, offsets, vtable
  order and member meaning; nothing of them is copied here, the facts below are in our own words and were checked by
  probe programs: sizeof and offset values printed by the tests); the compiler's own output for our own probe programs
  (cl /FAs listings: the arguments of the calls the compiler writes, the hidden constructor argument). No Microsoft
  binary was disassembled or debugged, no vcruntime, CRT or STL source (stl/src) was read.
summary: |
  std::_Syserror_map(int errno_value): returns the lower-case English text of a generic (POSIX errno) error value;
  generic_category().message(n) returns exactly this text. `extern "C++"`, __cdecl, returns a pointer to a static
  string, never null. The category objects themselves are inline in <system_error> (a program has its own copy; the
  library has its own too), so what the DLL has to provide for them is this function, std::_Winerror_map (see that
  sheet) and the identity words described below.
interface:
  category: |
    std::error_category (16 bytes, alignment 8): 0 pointer to the virtual table, 8 a 64-bit identity word `_Addr`. The
    table (read from the compiler's own listing of a class that derives from it; overloaded virtuals come in REVERSE
    declaration order): slot 0 scalar deleting destructor, 1 name() const -> const char*, 2 message(int) const ->
    std::string (hidden result pointer), 3 default_error_condition(int) const -> error_condition (16 bytes, hidden result
    pointer), 4 equivalent(const error_code&, int) const -> bool, 5 equivalent(int, const error_condition&) const -> bool.
    EQUALITY of two categories compares the identity words only (operator== is `_Addr == other._Addr`, operator< orders
    them as unsigned integers), not the object addresses. A category made by a program of its own has its own address as
    the identity word. The three standard categories carry fixed small identity words: generic_category 3,
    iostream_category 5, system_category 7 (the future category 1). That is what makes the category object that the
    library creates inside msvcp140.dll (in _Throw_Cpp_error, in ios_base::failure, in _XGetLastError, in _Throw_C_error)
    compare equal to the program's own std::generic_category() / iostream_category() / system_category(): there are
    several objects (one per module that uses them), all with these words. An error_code is 16 bytes: 0 int value, 8
    pointer to the category; error_condition is the same layout.
  signature: "const char* __cdecl std::_Syserror_map(int)"
rules:
  table: |
    The text of value n for n = -2..141 (the other values in that range, and every value outside it (-1, -2, 142, 1000,
    2147483647), give 'unknown error'): 0 'success'; 1 'operation not permitted'; 2 'no such file or directory'; 3 'no
    such process'; 4 'interrupted'; 5 'io error'; 6 'no such device or address'; 7 'argument list too long'; 8 'executable
    format error'; 9 'bad file descriptor'; 10 'no child process'; 11 'resource unavailable try again'; 12 'not enough
    memory'; 13 'permission denied'; 14 'bad address'; 16 'device or resource busy'; 17 'file exists'; 18 'cross device
    link'; 19 'no such device'; 20 'not a directory'; 21 'is a directory'; 22 'invalid argument'; 23 'too many files open
    in system'; 24 'too many files open'; 25 'inappropriate io control operation'; 27 'file too large'; 28 'no space on
    device'; 29 'invalid seek'; 30 'read only file system'; 31 'too many links'; 32 'broken pipe'; 33 'argument out of
    domain'; 34 'result out of range'; 36 'resource deadlock would occur'; 38 'filename too long'; 39 'no lock available';
    40 'function not supported'; 41 'directory not empty'; 42 'illegal byte sequence'; 100 'address in use'; 101 'address
    not available'; 102 'address family not supported'; 103 'connection already in progress'; 104 'bad message'; 105
    'operation canceled'; 106 'connection aborted'; 107 'connection refused'; 108 'connection reset'; 109 'destination
    address required'; 110 'host unreachable'; 111 'identifier removed'; 112 'operation in progress'; 113 'already
    connected'; 114 'too many symbolic link levels'; 115 'message size'; 116 'network down'; 117 'network reset'; 118
    'network unreachable'; 119 'no buffer space'; 120 'no message available'; 121 'no link'; 122 'no message'; 123 'no
    protocol option'; 124 'no stream resources'; 125 'not a stream'; 126 'not connected'; 127 'state not recoverable'; 128
    'not a socket'; 129 'not supported'; 130 'operation not supported'; 132 'value too large'; 133 'owner dead'; 134
    'protocol error'; 135 'protocol not supported'; 136 'wrong protocol type'; 137 'stream timeout'; 138 'timed out'; 139
    'text file busy'; 140 'operation would block'.
  generic_category: |
    generic_category().name() is 'generic', identity word 3; message(n) = _Syserror_map(n); default_error_condition(n) is
    error_condition(n, generic_category()); error_code(2, generic_category()) == errc::no_such_file_or_directory (the
    comparison goes through the category's equivalent()); make_error_code(errc::invalid_argument) has value 22 and the
    generic category; sizeof(error_category) 16, sizeof(error_code) 16.
