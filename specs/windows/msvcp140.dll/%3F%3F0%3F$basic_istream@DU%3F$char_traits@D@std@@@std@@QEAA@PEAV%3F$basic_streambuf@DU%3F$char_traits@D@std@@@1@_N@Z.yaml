# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: |
  windows/api/msvcp140.dll/??0?$basic_istream@DU?$char_traits@D@std@@@std@@QEAA@PEAV?$basic_streambuf@DU?$char_traits@D@std@@@1@_N@Z
oracle:
  os: |
    Windows 11 Home 25H2 (build 26200.9974), x64, with the Visual C++ Redistributable 14.44.35211 in System32
    (vcruntime140.dll, vcruntime140_1.dll, msvcp140.dll, msvcp140_1.dll all 14.44.35211.0)
  machine: |
    homeserver2 (the owner's home PC, real hardware), session 0 over SSH; the tests are x64 programs built by Microsoft's
    compiler (cl 19.44.35230, Visual Studio Build Tools 14.44.35207, Windows SDK 10.0.22621.0, C:\\BuildTools) with /EHsc
    /GS- /Zl /O1 (the stream and locale tests /Od /MD, so that the members of the library's classes are called through the
    DLL), no C or C++ runtime of their own, linked with /NODEFAULTLIB against import libraries made from
    tests/windows/cxx/*.def and from the DLLs' own export tables, run by tools/pipeline/windows/poly-oracle.ps1, two runs
    each, identical
  observed_by: "spec-vcrt-2"
  date: "2026-11-16"
sources: |
  Observations of our own test programs on the machine above (the tests of this entry); class layouts, sizes, offsets,
  vtable orders and constants read from Microsoft's STL headers that ship with the Build Tools (Apache-2.0 with LLVM
  exception; owner decision 2026-11-15, CLEAN_ROOM.md: spec agents may read them for layouts, sizes, offsets, vtable
  order and member meaning; nothing of them is copied here, the facts below are in our own words and were checked by
  probe programs: sizeof and offset values printed by the tests); the compiler's own output for our own probe programs
  (cl /FAs listings: the arguments of the calls the compiler writes, the hidden constructor argument). No Microsoft
  binary was disassembled or debugged, no vcruntime, CRT or STL source (stl/src) was read.
summary: |
  std::basic_istream<char> and std::basic_iostream<char>: the input stream and the two-way stream. Covers the
  constructors (istream from a buffer with isstd (+ a third bool in the second constructor, ??0...@_N1@Z), iostream from
  a buffer, the move forms), the destructors and 'vbase destructors', _Ipfx, ipfx, isfx, gcount, get (six forms),
  getline (two), ignore, peek, read, readsome, putback, unget, sync, tellg, seekg (two), swap, and operator>> for bool,
  short, unsigned short, int, unsigned int, long, unsigned long, long long, unsigned long long, float, double, long
  double, void*, streambuf*, and the manipulator-pointer forms. The extractors for char, char*, std::string and
  getline(std::string), ws are inline in the program.
interface:
  layout_and_abi: |
    Virtual inheritance: basic_ostream and basic_istream have basic_ios<char> as a VIRTUAL base, so a stream object is
    laid out as follows (x64). basic_ostream (112 bytes): 0 pointer to the virtual-base table (vbtable: two 32-bit
    integers {0, 16}: the first is the distance of the table pointer from the start of the subobject (0), the second the
    offset of the basic_ios part from it (16)); 8 padding (zero); the basic_ios<char> object (96 bytes, see
    ??0?$basic_ios...) at +16; its 4 bytes before it (+12) hold the 'vtordisp' (0 for a plain ostream). basic_istream (120
    bytes): 0 vbtable pointer ({0, 24}); 8 long long _Chcount (the gcount); 16 padding; the basic_ios part at +24.
    basic_iostream (128 bytes): 0 vbtable pointer of the istream part ({0, 32}); 8 _Chcount; 16 vbtable pointer of the
    ostream part ({0, 16}); 24 padding; the basic_ios part at +32. A program's class derived from them lays out the same
    way (its own members come after the base subobjects, the basic_ios part after its own members: for `struct S : ostream
    { int x; }` x is at +8, the ios part at +24, size 120; with istream x is at +16, ios at +32; with iostream x is at
    +24, ios at +40, size 136) and its constructor builds the virtual base itself.
  constructor_abi: |
    Hidden constructor argument (x64): the constructors of classes with a virtual base take one extra int argument after
    the visible ones, 'construct the virtual base': basic_ostream(streambuf* sb, bool isstd) is called as (this, sb,
    isstd, initvbase); the compiler passes initvbase = 1 when the stream is the most derived object (the constructor then
    first runs the protected basic_ios default constructor on the basic_ios part, at this + vbtable[1], sets up the
    vbtable pointers) and 0 when a derived class built the virtual base already. The name carries only the visible
    arguments: ??0?$basic_ostream@...QEAA@PEAV?$basic_streambuf@...@1@_N@Z. The destructor has two entry points: the
    ordinary one (??1, destroys the class's own part) and the 'vbase destructor' (??_D?$basic_ostream@...QEAAXXZ, takes
    this = the start of the stream object, destroys the stream part and then the basic_ios virtual base: it is the one the
    compiler calls for a most-derived local object). The class's virtual destructor (slot 0 of the basic_ios/ios_base
    vtable) adjusts `this` through the vbtable and deletes the whole object, so `delete (std::ios_base*)p` on any stream,
    and on a program's class derived from a stream, runs the derived destructor first.
  second_constructor: |
    ??0?$basic_istream@...@1@_N1@Z is the constructor (streambuf*, bool isstd, bool noinit): the third argument says the
    basic_ios part is not initialised (used by basic_iostream).
  sentry: |
    The sentry (inline): calls _Ipfx(noskip) with noskip false: it locks the buffer, flushes the tied stream
    (tie()->flush()) when the stream is good and has a tie, and if the stream is good and skipws is set and noskip is
    false skips white space (using the classic isspace of the stream's ctype<char> facet); if the buffer ends while
    skipping it sets eofbit|failbit and returns false; a stream that is not good gives false (and, if only eofbit was set,
    adds failbit). Its destructor unlocks. NOTE the argument of _Ipfx(bool noskip): _Ipfx(true) skips nothing,
    _Ipfx(false) skips white space.
rules:
  gcount: |
    _Chcount at +8 is set by every unformatted function (get, getline, ignore, read, readsome, peek (0), unget (0),
    putback (0)) and cleared at its start; the formatted extractors do not touch it. get() then gcount() is 1; a failed
    get() gives 0.
  get: |
    get() returns the next character as an unsigned value or EOF (eofbit|failbit). get(char&) stores it. get(buf, n[,
    delim='\n']) reads up to n-1 characters, stops before the delimiter (not extracted), always stores a NUL; no
    characters read sets failbit (and the buffer holds only the NUL); n <= 0 sets failbit; hitting the end after at least
    one character sets eofbit only. get(streambuf&[, delim]) copies to the other buffer until the delimiter or the end; no
    characters copied sets failbit. getline(buf, n[, delim]) is like get but extracts the delimiter (it counts in gcount);
    a line longer than n-1 sets failbit after n-1 characters. Reading the last line without a newline gives eofbit only;
    reading at the end gives eofbit|failbit and gcount 0.
  ignore_read_peek: |
    ignore(n = 1, delim = EOF) skips up to n characters; with a delimiter it stops after extracting it (gcount counts it);
    the end sets eofbit. read(p, n) reads n characters; fewer sets eofbit|failbit and gcount is the number read.
    readsome(p, n) reads min(n, available) where available is the get area or showmanyc(); 0 available returns 0 with no
    state change; showmanyc() < 0 sets eofbit. peek() returns the next character without consuming it (EOF sets eofbit
    only); it counts 0.
  putback_unget: |
    unget() and putback(c) first clear eofbit, then step the buffer back (sungetc / sputbackc); a buffer that cannot sets
    badbit; putback calls the buffer's pbackfail even when the character differs (the buffer decides). A stream at its
    first character fails with badbit.
  sync_seek: |
    sync() = rdbuf()->pubsync() (a buffer returning -1 sets badbit and sync() returns -1; no buffer: -1). tellg(): -1 if
    fail(), else rdbuf()->pubseekoff(0, cur, in). seekg(pos): clears eofbit first, then pubseekpos(pos, in); -1 sets
    failbit. seekg(off, dir): pubseekoff(off, dir, in).
  extractors: |
    operator>> of an arithmetic type uses the sentry then num_get<char>:
    use_facet<num_get<char>>(getloc()).get(istreambuf_iterator(rdbuf()), end, *this, state, value); the state bits it
    returns are set (eofbit when the end of the data is hit, failbit when no valid number or a range error). Observed (all
    verified): '42' -> 42 with eofbit; '42 ' -> 42, no bits; '  -17x' -> -17; '2147483648' to int -> 2147483647 with
    failbit (the largest value is stored); '-2147483649' -> -2147483648 + failbit; 'abc' -> 0 + failbit; unsigned accepts
    '-1' -> 4294967295; short 32768 -> 32767 + failbit; hex: 'ff', 'FF', '0xff', '0Xff' -> 255; oct '17' -> 15; basefield
    cleared: '0x1f' -> 31, '017' -> 15, '17' -> 17, '08' -> 0 (stops at 8); '0x' with hex -> 0 + failbit; bool 0/1 (2 ->
    true + failbit); boolalpha 'true'/'false'; double '3.25', '-0.5', '1e3', '1.5E-2', '.5', '5.' parse; '1e' fails; 'inf'
    and 'nan' fail (value 0); '0x10' reads 16; '1e999' stores +infinity with failbit; void* reads 16 hex digits. At the
    end of data the value is NOT modified (stays as given) when no characters were available (stream state
    eofbit|failbit). After a failure the following extractions are skipped (stream not good) and the failed character
    stays in the buffer. A tied output stream is flushed before the extraction. failbit in the exception mask throws
    ios_base::failure.
  streambuf_extractor: |
    operator>>(streambuf*) copies everything to the other buffer; the end sets eofbit.
errors:
  failure: |
    ios_base::failure when the mask asks; the extractors set failbit/eofbit as above.
side_effects: "none beyond the results above"
threading: "the tests are single-threaded"
ordering: []
timing:
  typical: "each test runs in well under a second on the oracle"
  guarantees: "none"
tests:
  visible: 6  # files in <symbol>.tests/ (a .cpp and its .exe are two)
  held_out: 2  # files kept by the diff runner
building_tests: |
  The tests are C++ with the line `// poly-cxx: compiler=msvc` (the stream, locale and error tests also `cl=/Od,/MD`, so
  that every call of a member of an imported class goes through msvcp140.dll): their executables were built on the
  oracle machine by Microsoft's compiler (tools/pipeline/windows/msvc-build.ps1) and are checked in beside the sources
  as `<name>.exe` (test artefacts); `cargo xtask pipeline win build` takes them as they are. They import from
  vcruntime140.dll, vcruntime140_1.dll, msvcp140.dll, msvcp140_1.dll, ucrtbase.dll and kernel32.dll only. A program has
  no C runtime start-up code: it calls what it needs by hand, and defines the few pieces that Microsoft's static
  libraries normally provide (operator new on malloc, std::_Facet_Register as an empty function,
  __std_system_error_allocate_message as an empty function where it is needed).
