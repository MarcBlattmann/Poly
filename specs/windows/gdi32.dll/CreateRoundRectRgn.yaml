# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/CreateRoundRectRgn
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974) and Windows 11 Enterprise 25H2 (build 26200.9711), x64: both give byte-identical rectangles for every region measured"
  machine: "homeserver2 (real hardware, Intel UHD 630) and the spec agent's PC; the visible and held-out tests were recorded on homeserver2 in the SSH session (session 0) by tools/pipeline/windows/poly-oracle.ps1, two runs each, identical. Regions need no desktop."
  observed_by: spec-win-gdi-rgn
  date: 2026-11-14
sources: >
  Observations of our own programs on the machines above: the rectangles
  (GetRegionData) of 230400 round rectangles (every width and height 1..40
  with corner widths 0..45 in steps of 3 and nine corner heights 0..45),
  3000 random ones up to 300x300 at random origins with corner sizes from
  -5 to 350, and 196 with a width or height of 0 or 1; compared with what
  GDI's documented path functions make from chosen input (PolyBezier into a
  path under a 1/16 world transform, PathToRegion), as a black box.
  Microsoft Learn reference pages of CreateRoundRectRgn, RoundRect,
  CreateEllipticRgn, GetRegionData, RGNDATA, GetRgnBox, EqualRgn,
  CombineRgn, "Regions", "Paths"; wingdi.h, windef.h and winerror.h.
  Wine's code and tests were not used.
summary: >
  Creates a region shaped like a rectangle with rounded corners
  (GetObjectType OBJ_REGION 8). It is built exactly like the elliptic
  region (see CreateEllipticRgn, whose steps this sheet uses) except that
  the four quarter arcs have the corner's size and sit in the corners, with
  straight edges between them. A corner as large as the rectangle (or
  larger) gives exactly the ellipse of the rectangle.
interface:
  signature: "HRGN CreateRoundRectRgn(int x1, int y1, int x2, int y2, int w, int h)"
  GetRegionData: "as for CreateEllipticRgn: rectangles top to bottom, one per run of consecutive rows with equal runs"
rules:
  size_only: "W = |x2 - x1|, H = |y2 - y1|; the region is that of (0,0,W,H, w, h) moved to (min(x1,x2), min(y1,y2)). Reversed corners and any origin give the moved same region."
  corner_radius: "The corner arcs use the radii RA (x) and RB (y), in sixteenths of a pixel: with A = 8*(W-1) - 4 as in CreateEllipticRgn and e = min(|w|, W) (the absolute value of the corner width, at most the width), RA = e*A/W rounded to the nearest whole number with halves upward, and 0 when that is negative or W is 0; RB the same from h, H and B = 8*(H-1) - 4. So the corner keeps the same share of the quarter-pixel-smaller box as the corner size has of the rectangle (a corner of w pixels is NOT a radius of w/2 pixels). A corner width of W or more gives RA = A (the ellipse's radius). Negative corner sizes act as their absolute value; i32::MIN acts as a very large size (gives RA = A)."
  construction: "Use the units, box (X0, Y0, X1, Y1), the rounding of the control offsets, the flattening, the rounding of points and the rows of CreateEllipticRgn steps 1-7 with these changes: KA = k*RA rounded up (ceiling), KB = k*RB rounded down (floor); the closed polygon starts at (X1, Y0+RB) and is the flattened arc from (X1, Y0+RB) through (X1, Y0+RB-KB) and (X1-RA+KA, Y0) to (X1-RA, Y0), the straight top edge to (X0+RA, Y0), the arc from (X0+RA, Y0) through (X0+RA-KA, Y0) and (X0, Y0+RB-KB) to (X0, Y0+RB), the straight left edge to (X0, Y1-RB), the arc from (X0, Y1-RB) through (X0, Y1-RB+KB) and (X0+RA-KA, Y1) to (X0+RA, Y1), the bottom edge to (X1-RA, Y1), and the arc from (X1-RA, Y1) through (X1-RA+KA, Y1) and (X1, Y1-RB+KB) to (X1, Y1-RB); the right edge closes it. The straight edges are not flattened (a straight piece is flat); each arc is flattened and its end points rounded exactly as in CreateEllipticRgn (pieces tested with 3*max|second difference| <= 32, halved with exact fractions, end points rounded to the nearest sixteenth, halves upward). With RA = A and RB = B the four arcs are the ellipse's and the region is the ellipse's (EqualRgn 1)."
  zero_corner: "A corner width or height of 0 gives RA or RB = 0: all points of the arcs fall on the box's corners and the region is the plain rectangle 0..W-2 x 0..H-2 (33x17 with corner 0x6 is one rectangle 0+16:0-32 whatever the other corner size). A corner of 1 is not always a plain rectangle (RA = A/W rounded = 8 - 12/W rounded, 7 or 8 for widths from 9 on): 60x20 corner 1x1 is one rectangle 0+19:0-59 but 80x51 corner 1x1 is 0+1:0-78 1+48:0-79 49+1:0-78."
  degenerate: "As for CreateEllipticRgn there is no special case: with W or H of 0 or 1 the same steps apply (the corner radius for a side of 0 is 0, any value gives the same region). A width or height of 1 gives the empty region; a width or height of 0 gives one row at y = -1 or one column at x = -1 as for the ellipse."
  result: "As for CreateEllipticRgn: one run per row, GetRegionData one rectangle per run of equal rows, GetRgnBox NULLREGION 1 / SIMPLEREGION 2 / COMPLEXREGION 3 and the box."
  worked_example: "26x9 with corner 7x4: A 196, B 60; RA = round(7*196/26 = 52.77) = 53, RB = round(4*60/9 = 26.67) = 27; KA = ceil(29.27) = 30, KB = floor(14.91) = 14. Polygon (sixteenths): 396,31 381,12 343,4 (first arc, two pieces), 57,4 (top edge), 19,12 4,31 (arc), 4,97 (left edge), 19,116 57,124 (arc), 343,124 (bottom edge), 381,116 396,97 (arc), then the right edge back to 396,31. Rectangles: 0+1:2-23 1+1:1-24 2+4:0-25 6+1:1-24 7+1:2-23."
  examples: "Observed rectangles (top+rows: left-right exclusive, relative to the origin). 50x30 corner 14x9 (RA 109, RB 68): 0+1:6-43 1+1:2-47 2+2:1-48 4+21:0-49 25+2:1-48 27+1:2-47 28+1:6-43. 40x20 corner 9x9 (RA 69, RB 67): 0+1:4-35 1+1:1-37 2+2:1-38 4+11:0-39 15+2:1-38 17+1:1-37 18+1:4-35; corner 10x10 (RA 77, RB 74): 0+1:4-35 1+1:2-37 2+2:1-38 4+11:0-39 15+2:1-38 17+1:2-37 18+1:4-35. 45x45 corner 16x16 (RA 124): 0+1:7-37 1+1:4-40 2+1:3-41 3+1:2-42 4+3:1-43 7+30:0-44 37+3:1-43 40+1:2-42 41+1:2-41 42+1:4-40 43+1:7-37 (row 41 is not the mirror of row 3). 20x20 corner -6x30 (RA 44, RB = B 148): 0+1:3-16 1+1:2-17 2+5:1-18 7+1:0-18 8+3:0-19 11+1:0-18 12+5:1-18 17+1:2-17 18+1:3-16. 36x36 corner 100x100 = the 36x36 ellipse: 0+1:16-19 1+1:11-24 2+1:9-26 3+1:8-27 4+1:7-28 5+2:5-30 7+1:4-31 8+2:3-32 10+1:2-33 11+5:1-34 16+3:0-35 19+5:1-34 24+1:2-33 25+2:3-32 27+1:4-31 28+2:5-30 30+1:7-28 31+1:8-27 32+1:9-26 33+1:11-24 34+1:16-19. 20x20 corner 19x19 (RA 141 < A 148) is NOT the ellipse of the box; corner 20x20, 21x21, 200x200 and -20x-20 are."
  exactness: "These rules give exactly the measured rectangles for all 230400 round rectangles of the grid, all 196 with a side of 0 or 1, and 2954 of the 3000 random ones; the 46 others are big (sides of about 200 to 300 with big corners) and differ only through the fixed-point flattening of big arcs described in CreateEllipticRgn large_sizes (GDI's own path functions given the same arcs and edges reproduce them). Every visible and held-out test is exact under these rules."
errors:
  range: "A coordinate outside -2^27 .. 2^27-1: NULL, ERROR_INVALID_PARAMETER (87) (0,0,134217728,10 with corner 5x5). The corner sizes have no limit (i32::MAX, i32::MIN and -(2^31-1) give regions)."
side_effects: "none: a new region object; the last error is left alone on success"
threading: "regions can be used from any thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond for sizes up to a few hundred pixels"
  guarantees: none
tests:
  visible: 6  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing gdi32.dll and kernel32.dll by name, each
  carrying its own declarations (Learn prototypes, wingdi.h and windef.h
  layouts). Each prints, per region, the type from GetRgnBox, the number of
  rectangles and the rectangles as top+rows:left-right relative to the
  origin, wrapped into lines of at most about 200 characters (continuation
  lines start with "  .."); one test compares round rectangles with the
  ellipse of their box (EqualRgn, CombineRgn RGN_XOR). No window, no
  desktop: recorded in session 0.
not_covered: >
  The exact fixed-point arithmetic of the flattening for big arcs (see
  CreateEllipticRgn); coordinates near the 2^27 limit; the RoundRect drawing
  function.
