# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/gdi32.dll/GetGlyphOutlineW.yaml
id: windows/api/gdi32.dll/GetGlyphOutlineW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station, 96 dpi) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output and two complete recordings agreed byte for byte, each run in a fresh scratch directory; the test programs carry no manifest (the icon tests carry the manifest that asks for comctl32 version 6). The fonts the tests use are the test's own TrueType font (added with AddFontMemResourceEx) and DejaVu Sans 2.37 (the file C:\\Windows\\Fonts\\DejaVuSans.ttf, copied there for the recording and removed afterwards, added with AddFontResourceExW and FR_PRIVATE); no Microsoft font is used"
  observed_by: spec-win-glyphs
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above (Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers). The fonts are free: a TrueType font the test writes itself (units per em 1024, every outline coordinate a multiple of 64 units, so that at 16 pixels per em every point lies on a whole pixel) and DejaVu Sans 2.37 (Bitstream Vera licence, shipped with Poly); where a number would depend on hinting, the test asks for 2048 pixels per em, the font's units per em, so that one pixel is one font unit and the outline is the file's. Microsoft Learn reference pages of the functions and structures named here and the public headers wingdi.h, winuser.h, winbase.h, shlwapi.h, dbghelp.h, commctrl.h, winerror.h and the TrueType and OpenType font file format documents for table layouts. The conformance tests of Wine, its source and ReactOS were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Returns the metrics, and optionally the outline or a bitmap, of one glyph of the TrueType font selected into a DC: GGO_METRICS (0), GGO_BITMAP (1), GGO_NATIVE (2), GGO_BEZIER (3), GGO_GRAY2/4/8_BITMAP (4, 5, 6), with GGO_GLYPH_INDEX (0x80) for a glyph index and a MAT2 transformation. Qt's GDI engine and Chrome-class text paths call it with GGO_METRICS | GGO_GLYPH_INDEX and with GGO_NATIVE. Observed with the test font 'PolyGlyph Sans': units per em 1024, hhea and OS/2 ascent 768, descent 256, line gap 128; glyphs (index: character, advance in units, ink): 0 .notdef (frame 64..576 x 0..768 with a hole), 1 space 384 (no ink), 2 'A' 768 (box 128..640 x 0..768), 3 'B' 512 (64..448 x 0..512), 4 'H' 768 (64..704 x 0..704), 5 'M' 768 (triangle 0,0 384,768 768,0), 6 'O' 640 (box with two quadratic curves on top), 7 'Q' 640 (like 'O' with two consecutive off-curve points), 8 'g' 640 (64..576 x -256..384), 9 'i' 256 (two contours), 10 'j' 256 (-128..128 x -256..768), 11 'k' 320 (ink 64..448: wider than the advance), 12 'x' 512, 13 and 14 parts of the composite, 15 U+00E9 704 (composite of 13 and 14), 16 U+20AC 896, 17 U+0301 advance 0 (ink -192..0), 18 'W' 1024, at 16 pixels per em (lfHeight -16: every point on a whole pixel), at 1024 (one pixel per font unit), 13, 32, +16; and with DejaVu Sans at 2048 pixels per em (one pixel per font unit).
interface:
  signature: "DWORD GetGlyphOutlineW(HDC hdc, UINT uChar, UINT fuFormat, LPGLYPHMETRICS lpgm, DWORD cjBuffer, LPVOID pvBuffer, const MAT2 *lpmat2)"
rules:
  glyphmetrics: "GLYPHMETRICS: gmBlackBoxX/Y is the size of the ink box in pixels; gmptGlyphOrigin is the position of its upper-left corner relative to the glyph origin on the baseline, x to the right, y UP (positive above the baseline: 'A' at -16 is box 8x12, origin (2,12)); gmCellIncX is the advance in pixels (the width GetCharWidth32W gives: 12 for 'A'), gmCellIncY is 0. A glyph with no ink (space) has box 1x1, origin (0,0), cell (advance, 0)."
  rounding: "Each edge of the box is rounded to a whole pixel (half up) and the size is the difference: at -13 'A' (ink 1.625 .. 8.125 pixels) is box 6 wide, origin x 2; 'i' (0.81 .. 2.44) is 1 wide, origin x 1. The origin of 'j' (ink starting 128 units left of the origin) is x -2 at 16 pixels: negative bearings give a negative origin x. U+0301 (advance 0, ink -192..0 units) is box 3x2, origin (-3,12), cell (0,0)."
  clipping: "GGO_METRICS and the bitmap formats clip the ink box to the ascent and descent of the text metrics (OS/2 usWinAscent and usWinDescent scaled, tmAscent/tmDescent; hhea and typographic values do not count): the composite U+00E9 has ink up to 14 pixels but with tmAscent 12 its metrics say 9x12 origin (1,12), with tmAscent 16 9x14; a font with usWinAscent 640 (tmAscent 10) gives 'A' 8x10. GGO_NATIVE and GGO_BEZIER are not clipped (U+00E9 native: 9x14, origin (1,14))."
  metrics_result: "For GGO_METRICS the result is a positive number (28 for 'A' at -16, 24 for 'B', 20 for the empty space; 16 + the padded size of a 1-bit bitmap of the box, rounded up to 4 bytes: 8x12 -> 16+12 = 28) that is not specified and not relied on; GDI_ERROR when it fails. With a buffer and cjBuffer given, GGO_METRICS writes zero bytes over the whole cjBuffer bytes of the buffer (16, 64 and 200 byte buffers all became zero). With no buffer and cjBuffer 100 it only returns the metrics."
  size_query: "With no buffer and cjBuffer 0 the result of GGO_NATIVE, GGO_BEZIER, GGO_BITMAP and GGO_GRAYn is the size in bytes the data need, and the metrics are filled in; a buffer with cjBuffer 0 gives the same and writes nothing; no buffer with cjBuffer 100 gives the size too. A glyph with no ink needs 0 bytes (result 0, a success): space gives result 0 and metrics box 1x1."
  buffer: "With a buffer of at least the needed size the result is the needed size and exactly that many bytes are written ('M' native: 36 bytes; buffers of 36, 37 and 136 bytes all return 36). A buffer smaller than needed (1, 4 and 35 bytes) fails with GDI_ERROR, the last error unchanged, and neither the metrics structure (it keeps what the caller put there) nor the buffer is written."
  bitmap: "GGO_BITMAP: one bit per pixel, most significant bit first, rows padded to a multiple of 4 bytes, rows from the top; size = rows x 4 x ceil(width/32): 'B' (6x8) is 32 bytes, 'A' (8x12) 48, 'j' (4x16) 64; the bits of a box of whole pixels are all 1 ('B' is 6 set pixels per row, byte 0xFC)."
  gray: "GGO_GRAY2_BITMAP, GGO_GRAY4_BITMAP, GGO_GRAY8_BITMAP: one byte per pixel, rows padded to a multiple of 4 bytes, values 0..4, 0..16 and 0..64 (the maximum is a fully covered pixel: 4, 16 or 64): 'B' (6x8) is 64 bytes (pitch 8), 'A' 96, 'M' (12x12) 144. Pixels covered by an edge get an intermediate value: the triangle 'M' at -16 in GRAY8 has in its top row 17 and 16, then 48 48, 16 64 64 16, 48 64 64 48 ..., and the curved 'O' in GRAY8 has 23 51 63 63 51 23 in its top row; GRAY4 and GRAY2 values for the same pixels are 5 13 16 16 13 5 and 1 3 4 4 3 1 (the tests print every row). The exact area rule is not derived."
  native: "GGO_NATIVE: the outline as TTPOLYGONHEADER records (cb, dwType 24, pfxStart) each followed by TTPOLYCURVE records (wType 1 line or 2 quadratic spline, cpfx, points); coordinates are FIXED 16.16 numbers in pixels, y up, relative to the glyph origin, scaled from the font units and not rounded (at -13 'A' starts at x 1+40960/65536 = 1.625). A contour starts at its first point and ends at its last: the line back to the start is implied and is not listed ('A' at -16: header start (2,0), one line curve with 3 points (2,12) (10,12) (10,0): 44 bytes). A contour of two or more outline points per record: the 'O' glyph (a line, two quadratic curves, a line) is header + line n 1 + spline n 2 + spline n 2 + line n 1 = 80 bytes; each quadratic record lists the control point and then the end point; consecutive off-curve points ('Q') are one record of n 3 (the implied on-curve point between them is not listed). Several contours are consecutive headers in one buffer ('i' 88 bytes = 2 x 44)."
  bezier: "GGO_BEZIER: the same records with cubic curves (wType 3, three points per segment: two control points and the end point); a quadratic segment from P0 through control C to P1 becomes the controls P0 + 2/3 (C - P0) and P1 + 2/3 (C - P1) ('O' at -16: controls (1, 10+43691/65536) and (2+21846/65536, 12), end (5,12)); 'O' is 96 bytes, 'Q' (consecutive off-curve points: one cubic record with n 6, two segments) 92; straight outlines are the same as GGO_NATIVE."
  composite_and_notdef: "A composite glyph (U+00E9: two parts) is returned flattened as separate contours (88 bytes: two 44 byte polygons). A character the font does not have ('z', U+1234, U+10000, U+1F600, 0xFFFFFFFF, 0) returns the outline and metrics of .notdef (glyph 0: two contours, 88 bytes), not an error."
  glyph_index: "With GGO_GLYPH_INDEX the character argument is a glyph index of the font: index 0 is .notdef, 1 is the space; only the low 16 bits count (65536 behaves as index 0); an index of 19 or more for the 19-glyph test font, and 0xFFFF, fail with GDI_ERROR (error unchanged, metrics untouched). Glyphs with no code point (13, 14) can be asked for. The metrics by index equal the metrics by character."
  matrix: "lpmat2 is required. MAT2 values are FIXED 16.16; x' = x*eM11 + y*eM21 and y' = x*eM12 + y*eM22. Outline, box and bitmap are transformed (the metrics are those of the transformed glyph: scale 2: 'B' 12x16 cell (16,0), scale 0.5: 4x4; mirror x: origin x -7, cell -8; mirror y: native y values negative; rotate 90 (eM12 1, eM21 -1): 'B' box 8x6 origin (-8,7) cell (0,-8) (the cell increment y is minus the transformed advance); shear 0.5: box widened to 10; 3x1: 18x8, cell (24,0); rotate 45 degrees: 10x10 and the outline points at fractional positions). The bitmap sizes follow the transformed box (GRAY2 'B' scale 2: 192 bytes). The zero matrix fails: GDI_ERROR with last error 1003 (ERROR_CAN_NOT_COMPLETE)."
  font_rotation: "A LOGFONT with escapement 900 (and orientation 900) rotates the outline the same way as the rotate-90 matrix: 'B' box 8x6, origin (-8,7), cell (0,-8), native points (0,1) (-8,1) (-8,7) (0,7)."
  sizes: "At lfHeight -1024 pixels equal font units (ink of 'A' 512x768 at origin (128,768), cell 768); at -32 everything doubles; the positive height 16 is the cell height (the test font has cell = em, so the same as -16); DejaVu Sans at -2048 returns the file's own outline (U+0041: first contour start (700,1294), second start (586,1493); native sizes 'A' 112, 'O' 256, 'g' 412, 'i' 88, U+00E9 332, U+20AC 488, U+03B1 448, '~' 312; bezier 'O' 448, 'g' 700, U+00E9 524; metrics 'A' box 1368x1493, origin (16,1493), cell 1401; 'g' 1001x1573 origin (113,1147) cell 1300; space cell 651; DejaVu glyph index of 'A' is 36, of space 3) and at -1024 the same outline halved with half-pixel fractions."
  formats: "fuFormat low nibble 0..6 are the formats above; 7, 8, 9, 0xF and 0x10 are GDI_ERROR (error unchanged); GGO_UNHINTED (0x100) is accepted with the formats 0, 1, 2 (results as without); 0x1000 is GDI_ERROR."
errors:
  failure_value: "Every failure returns GDI_ERROR (0xFFFFFFFF) and leaves the caller's GLYPHMETRICS untouched; the last error is left unchanged in every case (also for a NULL, a made-up or a deleted DC) except the zero matrix (1003)."
  null_matrix: "A NULL lpmat2 is GDI_ERROR with the last error unchanged; it does not crash."
  bitmap_fonts: "The stock bitmap fonts (OEM_FIXED_FONT, SYSTEM_FONT) have no outlines: GDI_ERROR for GGO_METRICS and GGO_NATIVE."
side_effects: "none beyond the rules above"
threading: "a DC, a font and a font resource belong to the process; fonts added with FR_PRIVATE or from memory are visible to the adding process only; the tests use one thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle (the 757 KB whole-font copies of DejaVu Sans a few milliseconds)"
  guarantees: none
tests:
  visible: 6  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations and its own TrueType writer. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md), built through polyd. Observations print results, error codes, sizes, glyph metrics, outline records and hashes of long data (the first 8 bytes of a SHA-256); no line holds a handle, an address or a machine, user or time. "err unchanged" in a line means the call left the last error as the test had set it before (a marker), "err N" the value after a failing result; the last error after a succeeding call is not printed. A test that uses DejaVu Sans reads C:\Windows\Fonts\DejaVuSans.ttf: on Poly the DejaVu fonts are in that folder (ADR 0170, `cargo xtask fonts fetch`), on the oracle the same file (757076 bytes, SHA-256 7da195a74c55bef988d0d48f9508bd5d849425c1770dba5d7bfc6ce9ed848954) was copied there for the recording.
not_covered: >
  GetGlyphOutlineA, the hinted outlines of DejaVu Sans at small sizes (the tests use 2048 and 1024 pixels per em so that hinting plays no part; at 16 pixels the glyph box may differ by a pixel), the exact area coverage rule of the gray bitmaps along edges (printed in the tests, not derived), vertical fonts (@ names), symbol fonts, mapping modes other than MM_TEXT, a printer DC, GGO_UNHINTED differences at small sizes, fonts that are not TrueType (OpenType CFF).
