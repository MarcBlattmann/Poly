# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/gdi32.dll/ExtTextOutW.yaml
id: windows/api/gdi32.dll/ExtTextOutW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; text is drawn into memory DCs with 32-bit DIB sections, so no desktop is needed), two runs each with identical output, and two complete recordings with identical output"
  observed_by: spec-win-text
  date: 2026-11-10
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of the functions named here (CreateFontIndirectW, LOGFONTW, TEXTMETRICW, GetTextExtentPoint32W, ExtTextOutW, DrawText, DrawTextEx, DRAWTEXTPARAMS, AddFontMemResourceEx, AddFontResourceEx, EnumFontFamiliesEx, SetTextAlign); wingdi.h and winuser.h for constants and layouts. Wine's conformance tests were not read for the values here.
summary: >
  Draws text at a reference point, optionally filling a rectangle with the background colour, clipping to it and placing the characters by an array of distances.
interface:
  signature: "BOOL ExtTextOutW(HDC hdc, int x, int y, UINT options, const RECT* lprect, LPCWSTR lpString, UINT c, const INT* lpDx)"
rules:
  colours_modes: "Text pixels get the text colour; in OPAQUE mode the text cell (extent by tmHeight, at the reference point after alignment) is first filled with the background colour; in TRANSPARENT mode nothing but the glyph pixels changes. An empty string without options draws nothing in either mode."
  eto_cell: "ETO_OPAQUE fills the rectangle with the background colour first (also in TRANSPARENT mode and for an empty string), then draws the text unclipped: with a rectangle smaller than the text the text sticks out. An inverted rectangle is normalised before filling ((40,30,20,12) fills 20,12,40,30). An empty rectangle fills nothing. A rectangle partly off the surface is clipped by the surface. ETO_OPAQUE or ETO_CLIPPED with a NULL rectangle just draws the text."
  eto_clipped: "ETO_CLIPPED limits the drawing to the rectangle: inside it the pixels are those of the unclipped drawing, nothing outside changes; without ETO_CLIPPED a rectangle given does not clip. An inverted rectangle clips to its normalised form; an empty one hides everything. ETO_CLIPPED|ETO_OPAQUE fills the rectangle and clips the text to it."
  dx: "lpDx[i] is the distance from the origin of character i to that of character i+1, instead of its advance: \"AAA\" with 20,14,30 at x=4 puts the glyph boxes at 6-14, 26-34, 40-48 in a row inside the text. The values may be zero or negative: the characters then lie on top of each other or run backwards, and every glyph is still drawn whole at its origin. The sum of the array takes the place of the text width: with TA_RIGHT the first origin is x - sum, with TA_CENTER it is floor(x - sum/2), and with TA_UPDATECP the current position moves by the sum (to the left when the sum is negative; by -sum with TA_RIGHT; not at all with TA_CENTER). The background of such text is in dx_cell."
  alignment: "See the SetTextAlign sheet and eto_align: the cell of \"AB\" (20x16, ascent 12) at (50,40): TA_LEFT|TA_TOP 50,40,70,56; TA_RIGHT 30,40,50,56; TA_CENTER 40,40,60,56; TA_BOTTOM 50,24,70,40; TA_BASELINE 50,28,70,44; combinations add. TextOutW draws exactly the same cells. The value is read by its bits: of the horizontal ones (mask 6) 2 alone and 4 alone both align right and 6 centres; of the vertical ones (mask 24) 8 alone is the bottom and 16 or 24 the baseline; the higher bits that were tried (0x20, 0x40, 0x80, 0x200, 0x400, 0x8000, 0x10000 and all of them together) do not move the text (eto_alignbits). TA_CENTER with an odd width puts the extra pixel on the left: the cell starts at floor(x - width/2) (the 9 wide '&' at x=70 covers 65..74, at x=71 66..75)."
  update_cp: "With TA_UPDATECP the reference point is the current position (the x and y arguments are ignored) and afterwards it is moved to the other end of the cell: x + width for TA_LEFT, x - width for TA_RIGHT, unchanged for TA_CENTER; the y does not change. Without TA_UPDATECP the current position is untouched."
  glyph_index: "ETO_GLYPH_INDEX: the string holds glyph indices of the font; indices 5 and 6 of PolyTest Sans draw 'A' and 'B' (the same pixels as the characters). An index beyond the font (999) draws .notdef."
  count: "There is no limit on the count: 8192, 8193, 9000 and 20000 characters return TRUE and are drawn as far as the surface reaches (in OPAQUE mode the cell runs to the surface's edge; with TA_RIGHT at x it runs from the surface's left edge to x). A count of 0 draws nothing and returns TRUE, also with a NULL string."
  off_surface: "A reference point left of the surface clips the glyphs ((-5,-3) inks 0,0,15,13); text entirely off the surface changes nothing."
  dx_cell: "In OPAQUE mode with lpDx the background is one rectangle of the cell's height. Horizontally it runs from the first origin to the first origin plus the sum when the sum is positive, and it is widened to hold the ink of every glyph: its left edge is the smaller of the first origin and the leftmost ink column, its right edge the larger of (first origin + sum) and the column after the rightmost ink. A sum of zero or below adds nothing to the right of the first origin. \"BiB\" in PolyTest Sans (advances 8, 4, 8; the ink of 'B' is columns 1 to 6 of its advance, that of 'i' columns 1 and 2) at x=50: no lpDx 50..70; 10,10,10 gives 50..80; 0,0,0 gives 50..57; 0,0,8 gives 50..58; 10,10,0 gives 50..77; -6,3,3 gives 45..57; -10,2,2 gives 41..57; 16,-8,4 and 16,-8,-8 give 50..69; 5,5,-20 gives 50..67; -30,40,2 gives 21..67; a single 'B' with -5, 0 or 3 gives 50..57. The same holds from the first origin that TA_RIGHT and TA_CENTER give (eto_dx_cell)."
  missing_glyphs: "A character the font has no glyph for (without ETO_GLYPH_INDEX): the call returns TRUE. Windows does not draw the font's .notdef for it but takes a glyph from another font of the system, so what appears depends on the fonts installed there (with the test font selected U+0005 drew a narrow box, U+0043 a small glyph, U+0000 and U+0009 nothing). Poly cannot ship those fonts: it returns TRUE and may draw a substitute of its own or .notdef. No test compares these pixels."
  option_bits: "wingdi.h defines ETO_OPAQUE 0x2, ETO_CLIPPED 0x4, ETO_GLYPH_INDEX 0x10, ETO_RTLREADING 0x80, ETO_NUMERICSLOCAL 0x400, ETO_NUMERICSLATIN 0x800, ETO_IGNORELANGUAGE 0x1000, ETO_PDY 0x2000 and ETO_REVERSE_INDEX_MAP 0x10000 (together 0x13C96). Any other bit (the mask 0xFFFEC369) is ignored, alone or with others (all of 0xFFFEC369 at once draws the plain text), unless ETO_GLYPH_INDEX or ETO_IGNORELANGUAGE is set too: beside one of those two, every single bit of 0xFFFEC369 makes the call fail (FALSE, nothing drawn). ETO_PDY without an lpDx array fails (FALSE, nothing drawn) whatever else is set; that is why 0xFFFFFFFF fails. ETO_RTLREADING, the two NUMERICS options, ETO_IGNORELANGUAGE and ETO_REVERSE_INDEX_MAP do not change Latin text in a private font; every defined option but ETO_PDY at once (0x11C96) draws what ETO_GLYPH_INDEX alone draws (eto_options)."
  pdy: "ETO_PDY: lpDx holds two values for every character, the distance to the next origin along the line and the distance across it; a positive second value moves the characters that follow up, a negative one down (\"gi\" with the pairs (20,6) (7,0) draws the 'i' 20 to the right of the 'g' and 6 above its normal place; with (20,0) (7,0) it is the drawing of lpDx 20,7 without the option). With TA_UPDATECP the current position moves by the sum of the first values and against the sum of the second ones. In OPAQUE mode the background is one rectangle around the cells of all the characters, each cell at its own height."
errors:
  bad_dc: "A NULL DC, or a handle that is not a DC (a font handle): FALSE, ERROR_INVALID_HANDLE (6)."
  null_string: "A NULL string with a count of 2: FALSE (last error not set); with count 0: TRUE and nothing drawn."
  options: "Options 0xFFFFFFFF: FALSE (ETO_PDY without lpDx; see option_bits for the other cases)."
  last_error: "Only the bad handle sets an error code. After SetLastError(0), GetLastError is still 0 when the call fails for a NULL string with a count, for ETO_PDY without lpDx or for a stray bit beside ETO_GLYPH_INDEX, and when it succeeds. (On Windows a successful call on a non-empty string can also set a last error the caller had left there back to 0; Poly need not copy that, and the tests start every call from 0.)"
side_effects: "none beyond the rules above"
threading: "a DC, a font and a font resource belong to the process; fonts added from memory or with FR_PRIVATE are visible to the adding process only"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, importing gdi32.dll, user32.dll and kernel32.dll by name, each file carrying its own declarations (Learn prototypes, wingdi.h / winuser.h constants) and its own TrueType writer. No test depends on the pixels or the metrics of a Microsoft font (the owner's decision of 2026-11-09: Poly cannot ship those fonts): text is drawn with fonts the test makes itself and adds with AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE), so Windows and Poly use the same font file, and tests on installed families print only relations that hold for every font. The tests make their own TrueType fonts (the same 14-glyph table in every file, units per em 1024, every coordinate a multiple of 64 units so that every glyph edge lies on a pixel boundary at lfHeight -16): 'PolyTest Sans' (OS/2 winAscent 768, winDescent 256, hhea ascender 768, descender -256, line gap 128), 'PolyTest Tall' (winAscent 896, winDescent 320, no line gap), 'PolyTest Mono' (Sans metrics, every advance 640, post isFixedPitch, panose proportion 9) and the Bold and Italic faces of the Sans family (the 'A' is 13 and 14 pixels wide instead of 12 at -16). Advances at 16 pixels per em: space 6, '&' 9, '-' 6, '.' 4, 'A' 12, 'B' 8, 'M' 12, 'W' 16, backslash 6, 'g' 10, 'i' 4, U+00E9 11, U+20AC 14, .notdef 10. A font reaches GDI through AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE); GDI refused a font whose name table had only the name IDs 1, 2, 4 and 6, so the tests' fonts carry IDs 0 to 6. Tests on installed families (Arial, Times New Roman, Courier New, Segoe UI, Tahoma, Verdana, Consolas and the stock fonts) print and check only relations that hold for every font, never their pixels or metrics. Drawing goes into a 32-bit top-down DIB section in a memory DC, bi-level (lfQuality NONANTIALIASED) where pixels are compared, white text on a dark blue background over a grey surface. Observations are numbers, pixel boxes, counts and rows of pixels as text, never handles, addresses or times.
not_covered: >
  Complex scripts; what ETO_RTLREADING, ETO_NUMERICSLOCAL, ETO_NUMERICSLATIN, ETO_IGNORELANGUAGE and ETO_REVERSE_INDEX_MAP do to text that is not Latin; ETO_PDY with rotated fonts; the pixels of characters the font lacks; ClearType output; clipping by the DC's clip region; non-MM_TEXT mapping modes.
