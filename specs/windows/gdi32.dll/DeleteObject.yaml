# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/DeleteObject
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1, two runs each, identical; the SSH session is session 0 with its non-interactive window station, whose desktop is not visible; screen 1024x768, 32 bpp, 96 DPI, no shell (explorer) running"
  observed_by: spec-win-gui-a, spec-win-gui-b2
  date: "2026-11-02; 2026-11-09 (spec-win-gui-b2, rules marked b2, interactive session)"
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Messages and Message Queues", "Window Features", "About Painting and
  Drawing", "Device Contexts"; winuser.h, wingdi.h, windef.h and winerror.h
  for constants and layouts. Wine's tests were not read.
summary: >
  Deletes a GDI object (pen, brush, bitmap, font, region, palette). Stock
  objects are not deleted (the call returns 1 and they stay usable). An
  object that is selected into a DC is not destroyed at once: the call
  returns 1, but what the DC then draws with depends on whether the DC had
  already drawn with the object (see selected_brush_pen below), and the
  object is destroyed when it is deselected. A brush or pen that the DC has
  not used yet is drawn with as the DC's default (white brush, black pen),
  NOT with its own colour. (spec-win-gui-b2 corrected the older "the DC
  keeps painting with it" and the "paints nothing" of a later round: a
  deleted, never-used brush paints white.)
interface:
  signature: "BOOL DeleteObject(HGDIOBJ obj)"
  session: "the first rules were observed in session 0 (spec-win-gui-a); the rules marked b2 below were observed in the interactive session (GDI drawing into memory DCs with 32-bit DIB sections behaves the same in both)"
rules:
  success: "brush, pen, bitmap, font, region, palette (not selected anywhere): 1"
  solid_brush_after: "a deleted solid brush still has type OBJ_BRUSH; a second DeleteObject fails"
  type_after_delete: "GetObjectType of a deleted object keeps reporting the old type (b2: a not-selected region 8, palette 5, bitmap 7, hatch and DIB pattern brushes 2, dashed pen 1) except where noted for objects deleted while selected"
  stock: "stock brush/pen/font/palette (NULL_BRUSH, DC_BRUSH, BLACK_PEN, DC_PEN, DEFAULT_PALETTE, system font, white brush ...): 1, and they stay usable and keep their type; GetStockObject returns the same handle again; a stock brush selected into a DC and then deleted keeps painting with its colour"
  selected_brush_pen: "b2: a solid brush or a pen deleted while selected into a DC: returns 1; GetObjectType still says OBJ_BRUSH or OBJ_PEN while it is selected; GetObject on it returns 0; GetCurrentObject still returns its handle; a second DeleteObject returns 0 (error 0); it cannot be selected into another DC at the same time (SelectObject returns NULL). What the DC draws with depends on use: if the DC had already drawn with the object since it was selected (PatBlt, Rectangle, LineTo, FillRgn ...) it keeps drawing with its own colour until it is deselected; if it had NOT been used yet, PatBlt and the Rectangle interior paint WHITE and lines and the Rectangle outline are BLACK (the DC's default brush and pen), and FillRgn with the deleted brush handle paints nothing. A brush selected into the DC when SaveDC was called (or at the time of RestoreDC) stays alive for the saved state: after RestoreDC the brush or pen draws with its own colour even if it was never used and was deleted before the restore. Asking about the object first (GetObjectType, GetObject, GetCurrentObject, a second DeleteObject, a failing SelectObject into another DC) changes nothing about what the DC draws."
  after_deselect: "b2: when the DC selects another object the deleted brush is gone: GetObjectType 0, DeleteObject 0, SelectObject of its handle returns NULL. A deleted PEN stays reported as OBJ_PEN (type 1) forever (also 100 ms later), but DeleteObject on it returns 0 and SelectObject of its handle returns NULL. A deleted font behaves like the pen (type 6, DeleteObject 0)."
  deleted_not_selected_brush: "b2: a solid brush deleted while not selected anywhere (type stays 2, second DeleteObject 0) can still be selected: SelectObject returns the previous brush, GetCurrentObject returns the handle, PatBlt and FillRect with it paint WHITE (FillRect returns 1, error 0)."
  selected_font: "b2: a font deleted while selected: 1; the DC keeps using it (text metrics unchanged, GetCurrentObject returns the handle, GetObjectType 6) until it is deselected"
  selected_bitmap: "a bitmap selected into a memory DC: 1, but it stays (type OBJ_BITMAP) and the DC keeps drawing into it (b2: FillRect after the delete still writes the DIB); GetObject on it still works while selected (b2: 32 bytes for a compatible bitmap, 104 for a DIB section) and SelectObject into a second DC fails with NULL; after it is deselected, or after DeleteDC, GetObject returns 0, GetObjectType STILL says 7 (also 100 ms later), a second DeleteObject returns 0 and SelectObject of it returns NULL"
  clip_region: "b2: a region used with SelectClipRgn can be deleted: 1; the DC keeps its own copy (GetClipBox and drawing are still clipped, GetClipRgn still returns 1); afterwards SelectClipRgn with the deleted handle returns 0 and FillRgn with it returns 0, last error 0 in both"
  palette: "b2: a palette selected into a DC with SelectPalette: DeleteObject returns 0 and it stays (type 5); after the DC selects another palette (back to the stock one) the delete returns 1; a palette not selected: 1"
  bitmaps_other_kinds: "b2: a bitmap that is not selected (CreateBitmap monochrome, CreateCompatibleBitmap): 1; hatch brush, DIB pattern brush, dashed pen: 1"
  not_gdi: "b2: values that are not GDI objects (1, 0x10, -1, a window handle): 0, last error 0; the window is not affected. A DC from GetDC(NULL) given to DeleteObject: returns 1 and the DC is gone (ReleaseDC then returns 0) - do not rely on it."
  dc: "DeleteObject of a memory DC returns 1 (GetObjectType then still says OBJ_DC); DeleteDC is the call for DCs; a deleted DC also still reads OBJ_DC (observed) while its bitmap is free again"
errors:
  invalid: "a second delete, NULL, a made-up handle: 0, last error 0"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; calls on a window of another thread of the process work as noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 5  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) that import user32.dll and gdi32.dll by name
  (allowed since this slice); each carries its own declarations (Learn
  prototypes, header constants) and a message log helper; window procedures
  log only documented messages (see "documented" in the tests), never
  painting messages, activation or IME traffic, handles, times or cascading
  default positions. Today Poly has no GUI user32/gdi32, so the tests do not
  start there.
not_covered: >
  Everything that needs a visible desktop: WM_PAINT, WM_ERASEBKGND and
  WM_NCPAINT generation, update regions (InvalidateRect, ValidateRect,
  GetUpdateRect, UpdateWindow, BeginPaint/EndPaint inside WM_PAINT),
  IsWindowVisible of shown windows, window DC clipping - in the oracle's
  session no window is visible (IsWindowVisible is 0 for every shown window,
  InvalidateRect leaves no update region and no WM_PAINT comes); they need
  the interactive desktop and are a later entry. Real input (SendInput),
  focus and activation, menus and the menu loop, hooks, DPI awareness.
