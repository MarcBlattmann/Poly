# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/gdi32.dll/CreateFontIndirectW.yaml
id: windows/api/gdi32.dll/CreateFontIndirectW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; text is drawn into memory DCs with 32-bit DIB sections, so no desktop is needed), two runs each with identical output, and two complete recordings with identical output"
  observed_by: spec-win-text
  date: 2026-11-09
  this_round: "spec-chrome-win-6 (2026-11-14): the tests added this round ran on Windows 11 Home 25H2 build 26200.9974 on homeserver2 over SSH (session 0), two rounds of two runs each, identical, and on the owner's PC (Windows 11 Enterprise, build 26200, desktop session) with the same output. The chrome section comes from Chrome's stage-1 runs on Poly (call traces of chrome.dll's user32, gdi32 and dwrite imports, poly.nt.exceptions) and from Chromium's and Skia's public source (BSD licence), read by the spec agent for the order of the calls only"
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of the functions named here (CreateFontIndirectW, LOGFONTW, TEXTMETRICW, GetTextExtentPoint32W, ExtTextOutW, DrawText, DrawTextEx, DRAWTEXTPARAMS, AddFontMemResourceEx, AddFontResourceEx, EnumFontFamiliesEx, SetTextAlign); wingdi.h and winuser.h for constants and layouts. Wine's conformance tests were not read for the values here.
summary: >
  Makes a logical font from a LOGFONTW. Nothing is looked up until the font is selected into a DC: then GDI maps the request (face name, weight, slant, size) onto a font that is installed.
interface:
  signature: "HFONT CreateFontIndirectW(const LOGFONTW* lplf)"
chrome:
  call_site: "chrome.dll makes the five fonts of SPI_GETNONCLIENTMETRICS with CreateFontIndirectW and reads back the face name with GetObjectW (the requested name, see GetObjectW) and the size with GetTextMetricsW; it never uses the face the font maps to (GetTextFaceW)"
  stage_1: "on Poly the call answered like Windows; what failed was the DirectWrite lookup of the face that followed (see SystemParametersInfoW)"
rules:
  object: "GetObjectW(font, 92, &lf) returns 92 and the LOGFONTW as it was given, field by field including the face name; GetObjectW(font, 0, NULL) returns 92; size 28 returns 28 (a partial copy); size 0 with a buffer returns 0. GetObjectType is OBJ_FONT. DeleteObject once succeeds and a second DeleteObject fails; GetObjectW of the deleted font returns 0 and SelectObject of it returns NULL. A new DC has the system font (GetStockObject(SYSTEM_FONT)) selected and SelectObject returns the previous font."
  height: "A negative lfHeight -N is the em: N pixels per em, so tmHeight - tmInternalLeading = N. A positive lfHeight H is the cell height: the em is chosen so that the cell (tmAscent + tmDescent) is about H. 0 is the default size of 16 pixels per em. The metrics are scaled from the font file with rounding to the nearest pixel (halves up): tmAscent = round(winAscent * em / upem), tmDescent likewise, tmHeight their sum, tmInternalLeading = tmHeight - em, tmExternalLeading from hhea lineGap (PolyTest Sans: 2 at 16, 1 at 8 and 10, 2 at 12). cfi_height lists 40 heights for three fonts, including the smallest sizes: lfHeight -1 and -2 both give a 3-pixel cell, +2 gives a 2-pixel cell for PolyTest Tall. Heights up to 1000 scale linearly."
  advances: "Every glyph advance is the file's advance scaled to the em and rounded to whole pixels (PolyTest Sans at -12: A 9, B 6, space 5, g 8, euro 11, U+00E9 8; at -10: A 8, B 5, space 4); text widths are sums of whole-pixel advances, without kerning."
  width: "lfWidth W > 0 scales the glyphs and advances horizontally so that tmAveCharWidth is W (PolyTest Sans, -16: lfWidth 4 gives 'A' 6 pixels, 6 gives 9, 8 and 0 give 12, 10 gives 15, 12 gives 18, 24 gives 36); lfWidth 0 keeps the proportions. A negative lfWidth acts as its absolute value; 1000 gives avew 1000."
  weight: "lfWeight below 600 gives tmWeight 400, 600 and above gives 700; for a family that has only a Regular face the bold request is synthesised: every advance is one pixel wider and the ink one pixel wider (PolyTest Sans: 'A' 12 to 13, 'AB gi' 40 to 45). lfWeight -1 acts as 400; 1000 and above as 700."
  italic: "lfItalic non-zero gives tmItalic 255 (0xFF); with only an upright face the slant is synthesised (the ink reaches further to the right, the top does not move, the advances do not change)."
  underline_strikeout: "lfUnderline and lfStrikeOut (any non-zero value) set tmUnderlined and tmStruckOut to 255. The line is drawn across the whole advance of the text, from the font's post table: the underline starts underlinePosition below the baseline and is underlineThickness thick (PolyTest Sans: 2 pixels below the baseline, 1 thick; PolyTest Tall: 3 below, 2 thick), the strike-out sits strikeoutPosition above the baseline with the OS/2 yStrikeoutSize (Sans: 4 above, 1 thick; Tall: 5 above, 2 thick)."
  family_faces: "A family with several faces picks the face by weight and slant: PolyTest Sans with Regular, Bold and Italic faces: weights 0 to 550 get the Regular face ('A' 12), 600 to 900 the Bold ('A' 13, tmWeight 700), lfItalic with weight 0 or 400 the Italic ('A' 14, tmItalic 255), italic with weight 700 or more the Bold face with a synthesised slant ('A' 13). A family without a bold or italic face gets the synthesised variants (PolyTest Tall)."
  names: "The face name is compared without regard to letter case, and the font reports its own spelling through GetTextFaceW. A name with a trailing or a leading blank, a doubled blank, a prefix or an extension of a name does not match: the mapper substitutes another font. The full name of a face ('PolyTest Sans Bold', 'PolyTest Sans Italic') is accepted and reported as such. An empty name and a name of 31 or 32 characters with no such family get a substitute."
  substitute: "For a name that matches nothing the substitute depends on lfPitchAndFamily: FIXED_PITCH, or FF_MODERN, gives a fixed-pitch TrueType font (all advances equal); other hints a proportional TrueType font. A font that exists keeps its own pitch whatever the hint says (PolyTest Mono asked as variable FF_ROMAN stays fixed). An empty name follows the hints too."
  installed: "Installed family and stock names are found under their own names: Arial, arial (reported as Arial), Times New Roman, Courier New, Segoe UI, Tahoma, Verdana, Consolas, Georgia, Calibri, Microsoft Sans Serif, MS Shell Dlg, MS Sans Serif, MS Serif, System, Terminal, Fixedsys, Courier, Small Fonts."
  escapement: "lfEscapement and lfOrientation rotate the text (tenths of a degree, counter-clockwise): GetTextExtentPoint32W keeps the unrotated width. With the reference point at (30,30) and TA_LEFT|TA_TOP, \"AB\" in PolyTest Sans at -16 inks the box 32,30,49,42 unrotated, 31,11,43,28 at 900, 11,18,28,30 at 1800 and 17,32,29,49 at 2700 and at -900; 3600 is the unrotated box; at 900 the text runs upwards: the 'A' becomes a 12x8 box below the 8x6 box of the 'B', both ending at the same right edge x = 43 (the rotated baseline)."
  ignored_fields: "lfCharSet DEFAULT and ANSI, lfOutPrecision, lfClipPrecision and lfQuality values (also 6, 7, 100, 255) give the same font for a TrueType family."
  absent_face: "a face no machine has ('PolyNoSuch Face', and 'Segoe UI PolyNoSuch', which starts with the name of an installed family but is not one) with heights -9 to -24 and 0, weight 400 or 700, italic, DEFAULT or ANSI charset, and pitch and family 0, FF_SWISS, FF_ROMAN | VARIABLE_PITCH or FF_MODERN | FIXED_PITCH: the font is made; GetObjectW gives the request back, the absent face included; selected into the screen DC the font maps to an installed face (GetTextFaceW non-empty, enumerated by EnumFontFamiliesExW) that is not the requested one and is exactly the face the same LOGFONT with an empty face name maps to, with the same tmHeight; for a negative height tmHeight - tmInternalLeading = -lfHeight. That face is not the message font's face on either oracle (it is the font mapper's default for the hints, not the UI font). Which face it is depends on the machine and is not recorded (test cfi_absent_face)"
  absent_face_charset: "with the charsets ANSI, EASTEUROPE, RUSSIAN, GREEK, TURKISH and BALTIC an absent face maps to an installed face whose tmCharSet is the requested charset, the face the empty name gets with that charset; the character height is kept (held-out test)"
errors:
  null: "CreateFontIndirectW(NULL) returns NULL (last error not set)."
  extreme: "Heights of +-500 and +-1000 are accepted and scale linearly (cell 500 and 1000); the extreme integers were not tried."
side_effects: "none beyond the rules above"
threading: "a DC, a font and a font resource belong to the process; fonts added from memory or with FR_PRIVATE are visible to the adding process only"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 7
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, importing gdi32.dll, user32.dll and kernel32.dll by name, each file carrying its own declarations (Learn prototypes, wingdi.h / winuser.h constants) and its own TrueType writer. No test depends on the pixels or the metrics of a Microsoft font (the owner's decision of 2026-11-09: Poly cannot ship those fonts): text is drawn with fonts the test makes itself and adds with AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE), so Windows and Poly use the same font file, and tests on installed families print only relations that hold for every font. The tests make their own TrueType fonts (the same 14-glyph table in every file, units per em 1024, every coordinate a multiple of 64 units so that every glyph edge lies on a pixel boundary at lfHeight -16): 'PolyTest Sans' (OS/2 winAscent 768, winDescent 256, hhea ascender 768, descender -256, line gap 128), 'PolyTest Tall' (winAscent 896, winDescent 320, no line gap), 'PolyTest Mono' (Sans metrics, every advance 640, post isFixedPitch, panose proportion 9) and the Bold and Italic faces of the Sans family (the 'A' is 13 and 14 pixels wide instead of 12 at -16). Advances at 16 pixels per em: space 6, '&' 9, '-' 6, '.' 4, 'A' 12, 'B' 8, 'M' 12, 'W' 16, backslash 6, 'g' 10, 'i' 4, U+00E9 11, U+20AC 14, .notdef 10. A font reaches GDI through AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE); GDI refused a font whose name table had only the name IDs 1, 2, 4 and 6, so the tests' fonts carry IDs 0 to 6. Tests on installed families (Arial, Times New Roman, Courier New, Segoe UI, Tahoma, Verdana, Consolas and the stock fonts) print and check only relations that hold for every font, never their pixels or metrics. Drawing goes into a 32-bit top-down DIB section in a memory DC, bi-level (lfQuality NONANTIALIASED) where pixels are compared, white text on a dark blue background over a grey surface. Observations are numbers, pixel boxes, counts and rows of pixels as text, never handles, addresses or times.
not_covered: >
  Charset-specific mapping (SYMBOL, EASTEUROPE, ...), vertical fonts ('@' names), raster fonts' size selection, font linking and fallback for characters a font lacks, ClearType, OUT_* precision effects, lfQuality's effect on the pixels except bi-level vs antialiased.
