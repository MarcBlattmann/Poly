# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/RoundRect
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop): memory device contexts with 32-bit DIB sections need no desktop; every test runs twice with identical output; the probes that led to the rules below were made with Python ctypes on the same machine"
  observed_by: spec-win-updater-gap
  date: 2026-11-19
sources: >
  Observations of our own test programs on the machine above (pixels read back from a 32-bit
  top-down DIB section selected into a memory device context). Microsoft Learn reference pages
  of RoundRect, CreatePen, CreateSolidBrush, SelectObject, SetWindowOrgEx, SelectClipRgn,
  CreateRoundRectRgn and "Device Contexts", "Coordinate Spaces and Transformations", "Pens",
  "Brushes"; wingdi.h, windef.h and winerror.h for constants and layouts. The rules reuse the
  region rule written in CreateRoundRectRgn.yaml (observed by spec-win-gdi-rgn). Wine's code and
  tests were not used, no Microsoft binary was decompiled or disassembled. The wide-pen rules (outline_wide, inside_frame, rect_wide, brush_pixels) were sharpened by spec-win-stack-roundrect on 2026-11-20 from GDI's own WidenPath and StrokeAndFillPath/StrokePath contours and 7920 drawings of the oracle.
summary: >
  Draws a rectangle with rounded corners into a device context: the inside is filled with the
  current brush, the outline is drawn with the current pen, and the call returns TRUE. The box is
  l..r-1 by t..b-1 (the right and bottom edges are not part of it). With the null pen the filled
  pixels are exactly the region CreateRoundRectRgn(l, t, r, b, w, h) makes (so that one rule
  gives the shape). With a 1 pixel pen the outline and the fill together cover the pixels of
  CreateRoundRectRgn(l, t, r+1, b+1, w, h), plus a few pixels where the curved parts end; the
  outline's pixels follow the rule outline_1px (a stroked, flattened path); wide pens (width 2 to 6) follow outline_wide,
  inside_frame and rect_wide.
interface:
  signature: "BOOL RoundRect(HDC hdc, int left, int top, int right, int bottom, int width, int height)"
  corner: "width and height are the diameters of the ellipse that rounds the corners, in logical units; a corner as wide as the box is a full semi-ellipse"
rules:
  box: "the corners are normalised first (reversed left/right or top/bottom give the same drawing as the ordered box). With the 1 pixel pen the outline lies on x = l..r-1 and y = t..b-1: box (5,5,25,20) puts pen pixels exactly in x 5..24, y 5..19 and brush pixels in x 6..23, y 6..18. A box with l == r or t == b draws nothing (TRUE); a 1x1 box draws nothing; a 2x2 box draws two pen pixels (5,5) and (5,6) and no brush pixel; 3x3 draws four pen pixels and one brush pixel (6,6); 4x4 draws eight pen and four brush pixels."
  fill_null_pen: "with the null pen (GetStockObject NULL_PEN) the painted pixels are exactly those of FillRgn with CreateRoundRectRgn(l, t, r, b, w, h): for a box W x H the region has the rows and columns of CreateRoundRectRgn.yaml (so a plain rectangle (w or h 0) paints (W-1) x (H-1) pixels: 10x8 corner 0 paints x 0..8, y 0..6 of the box; 33x17 corner 0x6 paints 32x16). Checked for 63 recorded shapes: 14 + 49 from 8x8 to 60x25 with corners from 0 to 90."
  fill_with_pen: "with a 1 pixel solid pen the pen pixels are those of outline_1px; the brush covers the inside: it never overlaps a pen pixel, and pen and brush together cover the region CreateRoundRectRgn(l, t, r+1, b+1, w, h) except for a few pixels at the ends of the curved parts (in 300 random shapes they covered the whole region in 285; pixels outside it numbered 0 to 28). Plain rectangles (corner 0) are exact: pen = the border of the box, brush = the inside."
  outline_1px: "the 1 pixel solid pen (the default black pen, GM_COMPATIBLE, MM_TEXT, a null brush or not) draws the stroke of one closed path, and every pen pixel of these tests follows from it. Units: sixteenths of a pixel, the centre of pixel (x, y) is (16x, 16y). (1) The path: W = r-l and H = b-t after the corners are put in order; w and h by absolute value. The box is X0 = 16l, Y0 = 16t, X1 = 16(r-1), Y1 = 16(b-1) (the right and bottom edges are one pixel inside the box of the call). The corner radii are RX = floor((16*w*(W-1) + W) / (2*W)) and RY = floor((16*h*(H-1) + H) / (2*H)), that is 8*w*(W-1)/W and 8*h*(H-1)/H rounded to the nearest whole number with halves upward, each at most half of X1-X0 or Y1-Y0. KA = ceil(0.5522847498 * RX) and KB = floor(0.5522847498 * RY). The path is four cubic Bezier arcs joined by straight edges, counter-clockwise from the right edge: arc 1 (X1, Y0+RY), (X1, Y0+RY-KB), (X1-RX+KA, Y0), (X1-RX, Y0); the top edge to (X0+RX, Y0); arc 2 (X0+RX, Y0), (X0+RX-KA, Y0), (X0, Y0+RY-KB), (X0, Y0+RY); the left edge to (X0, Y1-RY); arc 3 (X0, Y1-RY), (X0, Y1-RY+KB), (X0+RX-KA, Y1), (X0+RX, Y1); the bottom edge; arc 4 (X1-RX, Y1), (X1-RX+KA, Y1), (X1, Y1-RY+KB), (X1, Y1-RY); and the right edge closes it. The path made by GetPath under a mapping of 1/16 pixel per logical unit shows exactly these points. (2) Flattening: the same as in CreateEllipticRgn.yaml and CreateRoundRectRgn.yaml (halve a Bezier arc, with exact fractions, until 3 times the largest second difference of its control points is at most 32; round every end point to the nearest sixteenth, halves upward; drop repeated points): a closed polygon of straight edges. (3) Lines: every edge of the polygon, the one that closes it included, lights the pixels whose diamond it meets. The diamond of pixel (x, y) is the set of points with |u-16x| + |v-16y| less than 8, plus its right vertex (16x+8, 16y) and its bottom vertex (16x, 16y+8) (the edges of the diamond and its left and top vertices do not belong to it). From the pixels one edge lights the last one along the edge (the one whose diamond the edge leaves last) is left out when the edge's end point lies in its diamond; the first pixel is kept. The pen pixels are the union over all edges. Checked: all 53 recorded pen pixel sets and counts of 1 pixel outlines (9 dumps, 36 box sizes, 8 argument cases) are exact, and 791 of 800 random boxes (sides 2 to 55, corners 0 to 50) against the oracle's own drawing; the other 9 differ by 1 to 5 pixels next to the corners (five of them have corner sizes 1x1). Boxes with a side of 1 or less draw no outline; a side of 2 is not covered by this rule (a 2x2 box draws the two pixels (l, t) and (l, t+1))."
  outline_wide: "a solid pen of width n = 2 to 6 (PS_SOLID, geometric, round joins and caps by default) draws the widened outline of the path of outline_1px (1) and (2). (1) Two routes, chosen by the brush: with a brush selected (any brush that is not the null brush) RoundRect draws what StrokeAndFillPath draws: the path is flattened first (outline_1px (2)) and the flattened polygon is widened; with the null brush it draws what StrokePath draws: the curves are widened directly, and the result can differ from the first by up to about 1.4 pixels at the ends of the arcs. (2) Filling: the pen pixels are the pixels (x, y) with a non-zero winding number at the point (16x, 16y) (sixteenths of a pixel; the same centres as outline_1px) of the two contours of (4) taken together; an edge counts for a point when its y range y1 <= y < y2 (or y2 <= y < y1) contains the point and the point lies strictly to the left (up edge) or strictly to the right (down edge) of the edge line, a point on the edge line does not count. (3) The pen is a convex polygon, centrally symmetric, with vertices on the half pixel lattice, in sixteenths of a pixel, listed clockwise on screen from the right end of the top edge: n=2: (8,-16) (16,0) (8,16) (-8,16) (-16,0) (-8,-16); n=3: (8,-24) (24,-8) (24,8) (8,24) (-8,24) (-24,8) (-24,-8) (-8,-24); n=4: (8,-32) (24,-24) (32,-8) (32,8) (24,24) (8,32) (-8,32) (-24,24) (-32,8) (-32,-8) (-24,-24) (-8,-32); n=5: (8,-40) (24,-32) (32,-24) (40,-8) (40,8) (32,24) (24,32) (8,40) (-8,40) (-24,32) (-32,24) (-40,8) (-40,-8) (-32,-24) (-24,-32) (-8,-40); n=6: (8,-48) (24,-40) (40,-24) (48,-8) (48,8) (40,24) (24,40) (8,48) (-8,48) (-24,40) (-40,24) (-48,8) (-48,-8) (-40,-24) (-24,-40) (-8,-48); n = 1 is the diamond of outline_1px; from n = 7 the polygon has another shape (not given). The left pen vertex L(d) of an edge with direction d = (dx, dy) (y downwards) is the vertex v that maximises v.x*dy - v.y*dx; the right vertex is -L(d). The boundaries between the vertices are exactly the directions of the pen polygon's own edges (integer direction vectors: (-4000, 8000) and (-3999, 8000) already take different vertices). A direction exactly parallel to the pen edge from v_i to v_(i+1) (k vertices in all) takes v_(i+1) when 4i < k or 4i >= 3k and v_i otherwise (n=3: 0 degrees takes (8,-24), 45 takes (24,-8), 90 takes (24,8), 135 takes (24,8), 180 takes (8,24), 225 takes (-8,24), 270 takes (-24,8), 315 takes (-8,-24); n=2: 116.57 degrees takes (8,16), 296.57 takes (-16,0); n=5: 116.57 takes (40,8), 296.57 takes (-32,-24)). (4) The edges are the edges of the flattened closed polygon of outline_1px (2), from the right edge upwards, with edges of length 0 dropped (a straight side of length 0 where two arcs meet, the closing edge). Each edge has a selection direction d: with a brush every edge uses its own direction; with the null brush a straight side uses its own direction, and in an arc that was flattened into two or more chords the first chord uses the arc's start tangent (P1-P0 of its Bezier points; if that is zero P2-P0, then P3-P0), the last chord the end tangent (P3-P2; if zero P3-P1, then P3-P0) and every other chord its own direction; an arc flattened into one chord uses its own direction. L_i = L(d_i), R_i = -L_i. The path runs counter-clockwise on screen, so its right-hand side is the outside. At a joint F between edge i and edge i+1: the outer contour (forward) has F + R_i, then, when R_(i+1) differs from R_i, on a left turn (d_i x d_(i+1) < 0, the normal case) the pen vertices strictly between R_i and R_(i+1) in decreasing list index added to F, on a right turn (only in zig-zags of tiny flat arcs) the point F itself, then F + R_(i+1); the inner contour (backward), at the start point A of edge i, has A + L_i, then, when L_(i-1) differs from L_i, on a left turn the point A itself, on a right turn the pen vertices strictly between L_i and L_(i-1) in decreasing index added to A, then A + L_(i-1). When both coordinates of a joint are multiples of 16 (the joint lies on a pixel centre) every intermediate fan vertex v is moved by one sixteenth towards the centre: it becomes (v.x - sgn(v.x), v.y - sgn(v.y)) (for example (32,-24) becomes (31,-23)); the end points F + R_i and F + R_(i+1) of a fan are never moved. Checked: GDI's own WidenPath contours point for point for 203 random boxes (sides 2 to 82, corners 0 to 200, n = 2 to 6) on both routes (935 of 935 contours of PS_SOLID pens exact), and the pixels of 330 boxes drawn by the oracle with n = 1 to 6 on both routes (all exact for n = 2 to 6 except PS_INSIDEFRAME boxes with a side not larger than the width, see inside_frame). Plain rectangles (corner size 0 on either axis) are drawn by another route: see rect_wide."
  inside_frame: "a PS_INSIDEFRAME pen of width 1 draws like the PS_SOLID pen of width 1. A PS_INSIDEFRAME pen of width n >= 2 draws the PS_SOLID widened outline of outline_wide for a path that lies n/2 pixels inside the box of the call, so that the pen never leaves x = l..r-1, y = t..b-1: with W = r-l, H = b-t and w, h the corner sizes (absolute values) the path box is X0 = 16l + 8n, Y0 = 16t + 8n, X1 = 16r - 8n, Y1 = 16b - 8n (sixteenths of a pixel: the whole box of the call, its right and bottom edges included, shrunk by n/2 pixel on every side), and the corner radii are RX = floor((16*w*(W-n) + W) / (2*W)) and RY = floor((16*h*(H-n) + H) / (2*H)) (8*w*(W-n)/W rounded half upward), each at most half of X1-X0 respectively Y1-Y0; KA = ceil(0.5522847498 * RX), KB = floor(0.5522847498 * RY), the arcs, the flattening and the two routes are those of outline_1px and outline_wide. Example: box (10,8,40,30), corner 8x8, n = 3: the first arc is (616,207) (616,177) (591,152) (558,152). A PS_INSIDEFRAME pen with a box side that is not larger than the width (W <= n or H <= n) is drawn by another construction that is not specified (the path box then is (16l, 16t, 16r, 16b)). Corner size 0 on either axis (a plain rectangle) with a PS_INSIDEFRAME pen: see rect_wide."
  rect_wide: "a plain rectangle (corner size 0 on either axis; 1x1 is not a plain rectangle) with a pen of width n >= 2 is drawn the same way with a brush and with the null brush, and its corners are square. With X0, Y0, X1, Y1 the box of outline_1px (1): PS_SOLID pen pixels are the pixels whose centre (16x, 16y) lies in [X0-8n, X1+8n) x [Y0-8n, Y1+8n) but not in [X0+8n, X1-8n) x [Y0+8n, Y1-8n) (no hole when X1-X0 <= 16n or Y1-Y0 <= 16n): x runs from l - floor(n/2) to r - 1 + floor((n-1)/2), and the hole from l + ceil(n/2) to r - 2 - floor(n/2), the same in y. A PS_INSIDEFRAME pen draws a frame exactly n pixels wide along the inside of the box l..r-1 x t..b-1. The brush covers the rectangle X0,Y0 - X1,Y1 (centres inside) minus the pen pixels."
  brush_pixels: "with a brush the brush covers the pixels whose centre lies inside the flattened path polygon of outline_1px (2) (for a plain rectangle the rectangle X0,Y0 - X1,Y1; for a PS_INSIDEFRAME pen of width 2 or more the polygon of the path of inside_frame), by the same fill rule as outline_wide (2), and the pixels that show are those minus the pen pixels. With the null brush nothing is painted. Checked with the null pen and with 1 pixel pens and for the wide pens of the visible test rr_pen_wide: the bounding boxes and counts of its 63 lines follow from outline_1px, outline_wide, inside_frame, rect_wide and this rule."
  corner_size: "the corner sizes are used by absolute value (-6 gives the same drawing as 6). A corner size of 0 on either axis draws a plain rectangle (20x15 box: 66 pen pixels, 234 brush pixels, the same for 0x6 and 6x0; for the 20x15 box the pixels of 1x1 are the same too, but a corner size of 1 on both axes goes through the round-rect path, with radii of about 8 sixteenths of a pixel, and differs from the plain rectangle at the corners of larger boxes: box (13,11,44,32), corner 1x1, differs at the pixels (43,11) and (43,31)). Corner sizes at least as large as the box (1000, 200, 0x7FFFFFFF, -2147483648) give the full ellipse of the box (20x15: 46 pen pixels, 182 brush pixels). Corner sizes never produce an error."
  pen_width: "a solid pen of width n centred on the outline path grows the drawing outward: for box (10,8,40,30) corner 8x8 the pen pixels lie in x 9..39 and y 7..29 for width 2, 9..40 and 7..30 for width 3, 8..41 and 6..31 for width 5; the brush's box shrinks the same way: 11..37 x 9..27 (2), 12..37 x 10..27 (3), 13..36 x 11..26 (5). PS_INSIDEFRAME pens stay inside the 1 pixel box (x 10..39, y 8..29) whatever the width: brush 13..36 x 11..26 for width 3, 15..34 x 13..24 for width 5. The counts of the tests give the exact pixel numbers."
  null_objects: "the null pen draws no outline (the brush covers the region of fill_null_pen), the null brush draws only the outline, both null draw nothing; all return TRUE. A brush of the background colour draws like any other colour."
  drawing_order: "the brush is painted first, then the outline over it: a second, smaller RoundRect drawn over a first paints its own outline and fill over the earlier pixels."
  coordinates: "all coordinates are logical: the window origin and the viewport origin move the drawing (window origin (-10,-5): pen box (12,7)-(29,16), the unmoved one is (2,2)-(19,11)), mapping modes and the world transform scale the box and the corners (MM_ANISOTROPIC window 1:1, viewport 2:2: box 2..10,2..8 corner 3x3 gives pen pixels (3,3)-(19,15)); a negative viewport extent flips it. The result is clipped by the device context's clip region (clip (8,4,18,10) leaves only brush pixels, 60 of them) and by the bitmap."
  device_state: "the current position is unchanged by the call (MoveToEx(7,9) then RoundRect: position still (7,9)); the pen and brush stay selected."
  hatch_brush: "a hatch brush paints its pattern pixels only (null pen, horizontal hatch in green on white, box (2,2,20,12): the 15 green pixels are in the one row y = 3, x 3..17)"
  x86: "the same programs built for 32-bit (i686, run under WOW64 on the same machine, in the SSH session) printed exactly the lines the 64-bit ones did, line for line (verified outside the recorded tests: the pipeline's test build is 64-bit only), so the rules hold for the 32-bit DLL as they are (the whole of the tests: fills, pens, widths, arguments, device context state)."
errors:
  invalid_dc: "NULL or a made-up handle: FALSE (0), last error ERROR_INVALID_HANDLE (6)"
  success: "TRUE (1), also when nothing is drawn (empty box, null pen and brush, wholly outside the bitmap); the last error is left alone"
side_effects: "paints pixels of the DC's bitmap; the current position is not changed"
threading: "a device context belongs to one thread at a time"
ordering: []
timing:
  typical: "well under a millisecond per call"
  guarantees: none
tests:
  visible: 6  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing gdi32.dll and kernel32.dll by name, each carrying its own
  declarations (Learn prototypes, header constants). Each draws on a white 32-bit top-down DIB
  section in a memory DC and prints what was painted as rows of characters (R pen, B brush, . background),
  as bands `top+rows:left-right` relative to the box origin (right exclusive), or as bounding box
  and pixel count of one colour. The program never prints handles or addresses.
not_covered: >
  PS_INSIDEFRAME pens whose width is not smaller than a side of the box, pens wider than 6 (their polygons have
  other shapes), the brush pixels next to the pen at the curves (only their relation to the path polygon is given),
  the 1 pixel outline at the ends of some arcs (outline_1px: 5 of 305 boxes differ by 1 or 2 pixels, 3 of them with
  corner 1x1), dashed or dotted pens, geometric pens with end caps and joins other than the default, patterns
  brushes and DIB patterns, ROP2 other than R2_COPYPEN, metafile and printer device contexts, GM_COMPATIBLE arc
  directions, arbitrary world transforms (rotation, shear) and mapping modes with wide pens, and why the two
  routes differ (only what each draws is given).
