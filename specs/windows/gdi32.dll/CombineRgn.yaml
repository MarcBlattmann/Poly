# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/CombineRgn
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "Regions", "About Regions", "Clipping", the
  reference pages of the functions named.
summary: >
  Sets dst to src1 combined with src2: RGN_AND 1 (intersection), RGN_OR 2
  (union), RGN_XOR 3, RGN_DIFF 4 (src1 minus src2), RGN_COPY 5 (src1; src2
  ignored) (wingdi.h). Returns the kind of the result: NULLREGION 1,
  SIMPLEREGION 2 (one rectangle), COMPLEXREGION 3; ERROR 0 on failure. The
  old contents of dst are replaced; dst may be one of the sources.
interface:
  signature: "int CombineRgn(HRGN dst, HRGN src1, HRGN src2, int mode)"
  result_shape: "the result is stored as y-x bands: rectangles sorted by top then left, each band a horizontal strip; adjacent pieces in one band are merged, and vertically adjacent bands with the same x spans are merged (the minimal band decomposition), as GetRegionData lists them"
rules:
  overlap: "A 10,10,50,40 and B 30,20,70,60: AND 30,20,50,40 (2); OR 10,10,50,20 + 10,20,70,40 + 30,40,70,60 (3); XOR 10,10,50,20 + 10,20,30,40 + 50,20,70,40 + 30,40,70,60 (3); A DIFF B 10,10,50,20 + 10,20,30,40; B DIFF A 50,20,70,40 + 30,40,70,60; COPY gives src1; the same for A,B and B,A where symmetric"
  merging: "side by side 0,0,10,10 + 10,0,20,10: OR and XOR one rectangle 0,0,20,10 (SIMPLEREGION); top to bottom 0,0,10,10 + 0,10,10,20: one rectangle 0,0,10,20; four tiles of a 20x20 square: 0,0,20,20 (2); side by side with different heights: 0,0,10,5 + 0,5,20,10 + 10,10,20,15"
  disjoint: "OR of disjoint rectangles keeps both (3), in one band if they share it (0,0,10,10 + 20,0,30,10); AND is empty (1)"
  nested: "nested 0,0,30,30 and 10,10,20,20: OR the outer (2), AND the inner (2), DIFF and XOR the frame 0,0,30,10 + 0,10,10,20 + 20,10,30,20 + 0,20,30,30 (3)"
  identical: "AND and OR the rectangle (2), DIFF and XOR empty (1)"
  empty: "an empty source: OR and XOR give the other, AND and DIFF (empty minus rect) empty; two empties: empty for every mode"
  unions: "staircase 0,0,10,10 + 10,10,20,20 + 20,20,30,30 (3); frame 0,0,30,5 + 0,5,5,25 + 25,5,30,25 + 0,25,30,30; cross 10,0,20,10 + 0,10,30,20 + 10,20,20,30; comb 0,0,2,10 + 4,0,6,10 + 8,0,10,10 + 0,10,10,12"
  aliasing: "dst = A op dst works for every mode (A 0,0,20,20, dst 10,10,30,30: AND 10,10,20,20, OR 0,0,20,10 + 0,10,30,20 + 10,20,30,30, ...); dst op dst: AND/OR/COPY keep it, XOR/DIFF make it empty (1)"
  copy_src2: "RGN_COPY ignores src2: NULL, deleted or made-up second sources are fine (returns the kind of src1)"
  last_error: "unchanged (0) on success"
errors:
  bad_mode: "mode 0, 6, -1: ERROR (0), ERROR_INVALID_PARAMETER (87), dst unchanged"
  bad_handle: "a NULL or deleted destination, a NULL first source, a NULL or deleted second source with a mode other than RGN_COPY, a made-up first source with RGN_COPY: ERROR (0), ERROR_INVALID_HANDLE (6), dst unchanged"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Non-rectangular source regions (ellipses, polygons); very large rectangle
  counts. DPI awareness other than unaware (the tests have no manifest),
  several monitors, other keyboard layouts than German, IME, touch and pen,
  hooks, menus and the menu loop.
