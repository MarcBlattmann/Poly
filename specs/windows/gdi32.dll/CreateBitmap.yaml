# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/CreateBitmap
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Creates a device-dependent bitmap of the given size, planes and bits per pixel, optionally filled with the
  bits (rows aligned to 16 bits). Chrome's browser calls it once in a run (S3): the 1-bit mask of an icon made
  with CreateIconIndirect.
interface:
  signature: "HBITMAP CreateBitmap(int w, int h, UINT planes, UINT bpp, const void *bits)"
rules:
  sizes: "width or height 0 give a 1x1 monochrome bitmap (also with bpp 32); negative width or height: NULL with ERROR_INVALID_PARAMETER (87); bpp 64: NULL with 87"
  depth: "bpp 1, 4, 8, 16, 24, 32 are kept; bpp 0 and planes 0 give a 1-bit bitmap; bpp 2 and 3 give 4 bits; bpp 15 gives 16 bits; planes 3 or 4 with bpp 1 give a 4-bit bitmap (planes and bits are multiplied, planes then 1); planes 2 with bpp 2 gives 4 bits"
  getobject: "GetObjectType is OBJ_BITMAP (7); GetObjectW (BITMAP, 32 bytes): width, height, planes 1, bits per pixel, bmType 0, bits pointer NULL; bmWidthBytes is the row size aligned to 16 bits: 16x16 mono 2, 17x3 mono 4, 33x2 mono 6, 9x2 mono 2, 5x2 at 8 bpp 6, at 16 bpp 10, at 24 bpp 16, at 32 bpp 20; 16x16 at 32 bpp 64"
  bits: "with bits given the pixels are the bits: a 1-bit bitmap is read back with GetPixel (0 black, 1 white under the DC's colours), BitBlt from it to a colour DC uses the text and background colours (black and white by default) and from a colour source to a mono one thresholds; GetBitmapBits returns the bytes row by row (10x3 mono: 6 bytes ff c0 00 40 aa 80); SetBitmapBits writes them; a 4x2 32-bit bitmap holds the given pixels (GetPixel gives the colours)"
  delete: "DeleteObject once returns 1 and a second time 0; the GDI object count of the process is one more after the call and back after DeleteObject"
  chrome: "the mask of a 16x16 icon: a 1-bit 16x16 mask and a 32-bit 16x16 colour bitmap into CreateIconIndirect: the icon gets its own copies (GetIconInfo returns two fresh bitmaps of the same sizes, which must be deleted by the caller), our bitmaps stay valid after CreateIconIndirect and DestroyIcon, DestroyIcon returns 1 then 0; a cursor (fIcon 0, hotspot 3,4) likewise; a monochrome icon (no colour bitmap) has a double-height mask (16x32) and no colour copy; DestroyIcon(NULL) and GetIconInfo(NULL): 0"
errors:
  bad_size: "a negative size or bpp 64: NULL with ERROR_INVALID_PARAMETER (87)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, dwmapi.dll and imm32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and a message log; run with poly-oracle.ps1
  -Interactive (see docs/AGENT_PIPELINE.md) because visibility, painting, focus and input need the visible
  desktop. The tests of the Chrome scenarios record sent messages with a WH_CALLWNDPROC hook and posted ones
  with a WH_GETMESSAGE hook of the thread (as the Chrome recording did), print windows as roles (main, rwh,
  hid, ime, ctf) or tag letters, never handles, times or ids, and leave out the shell's traffic (WM_GETICON,
  WM_TIMER, the undocumented 0x60, 0x90, 0x96, 0xAE, 0x272, 0x287 and registered messages). Test windows are
  placed in the top-left 1000x500 pixels; the cursor is parked at (1500, 600) and put back; keyboard input is
  sent only while a window of the test is in the foreground and clicks only onto a window of the test.
not_covered: >
  The screen is the oracle's: one monitor 1920x1080, 32 bits per pixel, 96 DPI; values that follow from it are
  printed as equalities (HORZRES equals SM_CXSCREEN) where the tests allow. Huge sizes.
