# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/CreateRectRgn
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2
  date: "2026-11-02; 2026-11-09 (spec-win-gui-b2: GetRegionData sizes, equality, bad handles)"
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "Regions", "About Regions", "Clipping", the
  reference pages of the functions named.
summary: >
  Creates a rectangular region (GetObjectType OBJ_REGION 8, wingdi.h). The
  corners are normalised (swapped coordinates give the same region); a
  rectangle with zero width or height gives an empty region. The region
  contains the points with left <= x < right and top <= y < bottom.
  CreateRectRgnIndirect does the same from a RECT.
interface:
  signature: "HRGN CreateRectRgn(int left, int top, int right, int bottom)"
  GetRegionData: "RGNDATAHEADER (wingdi.h): dwSize 32, iType RDH_RECTANGLES 1, nCount, nRgnSize (16 per rectangle, 0 for an empty region), rcBound (0,0,0,0 when empty); then the rectangles. Size needed = 32 + 16 * nCount: 48 for one rectangle, 32 for an empty region, 64 for two rectangles, 80 for three."
rules:
  normalised: "110,20,10,70 / 10,70,110,20 / 110,70,10,20 all give 10,20,110,70 (SIMPLEREGION)"
  empty: "zero width (10,20,10,70), zero height, all zero: an empty region (NULLREGION), box 0,0,0,0, no rectangles, bound 0,0,0,0"
  negative: "negative coordinates are kept (-30,-20,-10,-5)"
  limits: "coordinates from -2^27 (-134217728) to 2^27-1 (134217727) are accepted (-134217728,-134217728,134217727,134217727 works; 1000000 and 65536 squares work)"
  set_rect_rgn: "SetRectRgn on an existing region accepts any values (2^27, i32::MIN..MAX kept as given; swapped corners normalised; empty gives an empty region), returns 1"
  region_data_buffer: "GetRegionData(rgn, size, buf): with a NULL buffer and size 0 it returns the size needed (32 + 16 * rectangles) and leaves the error alone. With a real buffer it returns the number of bytes it WROTE, which is the size needed and NOT the size of the buffer (a 1056-byte buffer for a one-rectangle region: 48, for an empty region: 32). A buffer smaller than the size needed (including size 0 with a non-NULL buffer, 1, 31, and 47 for a one-rectangle region; 48 and 49 for two rectangles; 64 for three) returns 0 with ERROR_INVALID_PARAMETER (87) and writes nothing (the buffer is untouched). Exactly the size needed, or more, succeeds with error 0 left as it was. A NULL region, a brush handle and a deleted region: 0 with ERROR_INVALID_HANDLE (6)."
  region_data_content: "two disjoint rectangles (CombineRgn RGN_OR returns COMPLEXREGION 3): nCount 2, nRgnSize 32, rcBound the union's box, the first rectangle written is the topmost; three rectangles: nCount 3, nRgnSize 48. The first rectangle written is the top-left one."
  indirect_and_set: "CreateRectRgnIndirect follows the same rules and limits (RECT with swapped corners is normalised; right/bottom 2^27 or left below -2^27 gives NULL and error 87; left -2^27 is accepted). SetRectRgn on a region changes only that region. SetRectRgn on a brush handle or NULL: 0 (error stays 0); on a region deleted just before: returns 1 (the handle is not re-checked - do not rely on it); past the limit (2^27): 1."
  equality: "EqualRgn: every empty region equals every other empty region whatever coordinates it was made with (0,0,0,0 / 50,60,50,90 / -9,-9,-9,-9: all equal); two rectangles equal when the same box in either corner order; different boxes (one pixel taller): not equal; a non-empty region is not equal to an empty one. Two calls with the same rectangle give two different handles."
  in_a_dc: "SelectObject(dc, region) returns the region kind as the 'previous object' (2 for a one-rectangle region, SIMPLEREGION); GetObject on a region returns 0 (error 6); GetObjectType 8."
  delete: "DeleteObject of a region returns 1; afterwards CombineRgn with it as a source fails with ERROR_INVALID_HANDLE and a second DeleteObject returns 0; 1000 regions made and deleted in turn all work"
errors:
  range: "a coordinate outside -2^27..2^27-1 (2^27, -2^27-1, 2^28, i32::MAX, i32::MIN): NULL, ERROR_INVALID_PARAMETER (87)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Using a deleted region other than in CombineRgn and DeleteObject;
  elliptic, polygon and round-rect regions. DPI awareness other than unaware
  (the tests have no manifest), several monitors, other keyboard layouts
  than German, IME, touch and pen, hooks, menus and the menu loop.
