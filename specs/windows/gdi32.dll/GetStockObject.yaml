# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/GetStockObject
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Returns a handle of a stock object: brushes 0-5 (WHITE, LTGRAY, GRAY, DKGRAY, BLACK, NULL), pens 6-8 (WHITE,
  BLACK, NULL), fonts 10-14 and 16-17 (OEM_FIXED, ANSI_FIXED, ANSI_VAR, SYSTEM, DEVICE_DEFAULT, SYSTEM_FIXED,
  DEFAULT_GUI), the default palette 15, DC_BRUSH 18 and DC_PEN 19. The same handle every time; it can be
  deleted without effect. Chrome's browser calls it 3 times a run (S3).
interface:
  signature: "HGDIOBJ GetStockObject(int index)"
rules:
  types: "GetObjectType: 0-5 and 18 OBJ_BRUSH (2), 6-8 and 19 OBJ_PEN (1), 10-14, 16, 17 OBJ_FONT (6), 15 OBJ_PAL (5); index 9 returns NULL; index 20 gives an object of type 14 (the default colour space) and 21 of type 7 (a bitmap, the 1x1 monochrome one); 22, 31, 32, 255, 256, 1000, INT_MAX, INT_MIN and -1 return NULL; the last error is not changed"
  stable: "the handle is the same on every call and in another thread of the process; DeleteObject of a stock object returns 1 and changes nothing (the type and the handle are the same afterwards, a second DeleteObject also 1)"
  logbrush: "GetObjectW of the brushes (size 16): WHITE style 0 colour ffffff, LTGRAY c0c0c0, GRAY 808080, DKGRAY 404040, BLACK 000000, NULL_BRUSH style 1 (BS_NULL), DC_BRUSH starts as ffffff; pens (size 16, a LOGPEN): WHITE_PEN style 0 colour ffffff, BLACK_PEN 000000, NULL_PEN style 5 (PS_NULL) width 1, DC_PEN black; the stock font DEFAULT_GUI_FONT is a LOGFONT (92 bytes); the default palette has 20 entries"
  select: "SelectObject returns the previous object: a new DC has WHITE_BRUSH, BLACK_PEN and SYSTEM_FONT selected; selecting NULL_BRUSH returns WHITE_BRUSH, BLACK_BRUSH returns NULL_BRUSH, BLACK_BRUSH again returns BLACK_BRUSH, WHITE_PEN returns BLACK_PEN, DEFAULT_GUI_FONT returns SYSTEM_FONT; SelectObject of the default palette returns NULL; of NULL and into a NULL DC: NULL (HGDI_ERROR is not returned)"
  dc_brush: "DC_BRUSH draws with the DC's brush colour: SetDCBrushColor returns the old colour (ffffff at first) and the next PatBlt draws the new colour without reselecting; the colour is per DC (a second DC starts at ffffff and does not change the first); SetDCPenColor likewise draws with the line colour; both return CLR_INVALID and fail for a NULL DC"
  chrome: "NULL_BRUSH vs WHITE_BRUSH in Rectangle: the first leaves the inside as it was and draws the border, the second fills it white; the DEFAULT_GUI_FONT's LOGFONT copy made with CreateFontIndirectW has another handle and the same height, weight, charset, quality and face name; deleting the copy while it is selected returns 1; deleting it again after it was unselected returns 0 and GetObjectType still says OBJ_FONT (6); the stock font is unaffected; a second thread sees the same handles"
errors:
  bad_index: "NULL for indexes that are not stock objects, with the last error unchanged"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, dwmapi.dll and imm32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and a message log; run with poly-oracle.ps1
  -Interactive (see docs/AGENT_PIPELINE.md) because visibility, painting, focus and input need the visible
  desktop. The tests of the Chrome scenarios record sent messages with a WH_CALLWNDPROC hook and posted ones
  with a WH_GETMESSAGE hook of the thread (as the Chrome recording did), print windows as roles (main, rwh,
  hid, ime, ctf) or tag letters, never handles, times or ids, and leave out the shell's traffic (WM_GETICON,
  WM_TIMER, the undocumented 0x60, 0x90, 0x96, 0xAE, 0x272, 0x287 and registered messages). Test windows are
  placed in the top-left 1000x500 pixels; the cursor is parked at (1500, 600) and put back; keyboard input is
  sent only while a window of the test is in the foreground and clicks only onto a window of the test.
not_covered: >
  The screen is the oracle's: one monitor 1920x1080, 32 bits per pixel, 96 DPI; values that follow from it are
  printed as equalities (HORZRES equals SM_CXSCREEN) where the tests allow.
