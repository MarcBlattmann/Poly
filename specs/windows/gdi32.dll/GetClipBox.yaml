# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/gdi32.dll/GetClipBox
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "Regions", "About Regions", "Clipping", the
  reference pages of the functions named. "GetClipBox", "GetRandomRgn",
  "BeginPaint", "Window Features" (WS_CLIPCHILDREN, WS_CLIPSIBLINGS).
summary: >
  Writes the smallest rectangle around what can be drawn on in a DC, in
  logical coordinates: the surface (bitmap or window area visible on the
  screen) intersected with the clip region and, for window DCs, the window's
  visible region; returns its kind (NULLREGION 1, SIMPLEREGION 2,
  COMPLEXREGION 3) or ERROR 0.
interface:
  signature: "int GetClipBox(HDC hdc, RECT* rect)"
rules:
  memory_dc: "a memory DC with only its default bitmap: 2, 0,0,1,1; with a 40x30 DIB: 2, 0,0,40,30"
  clip: "with a clip region: its box within the surface (IntersectClipRect 5,5,30,20 -> 2, 5,5,30,20; then ExcludeClipRect 5,5,30,10 -> 2, 5,10,30,20; ExcludeClipRect 10,12,15,15 -> 3, 5,10,30,20); an empty clip: 1 and 0,0,0,0"
  logical: "the box is in logical coordinates: window origin 10,20 gives 10,20,50,50, viewport origin 10,20 gives -10,-20,30,10"
  window: "GetDC of a visible popup 200x100: 2, 0,0,200,100; partly off the left edge of the screen (at -50,100): 2, 50,0,200,100 (the part on the screen); a hidden window: 1, 0,0,0,0; a captioned 300x200 window: GetDC 0,0,284,161 (its client area), GetWindowDC 0,0,300,200"
  clipchildren: "a parent without WS_CLIPCHILDREN: 2 and its client area; with WS_CLIPCHILDREN and a child over part of it: 3, still the whole client area as box (the system region, GetRandomRgn SYSRGN 4, excludes the child: 100,300,300,350 + 100,350,250,400 in screen coordinates); the child itself is limited to its parent"
  clipsiblings: "without WS_CLIPSIBLINGS overlapping siblings do not clip each other (2, the whole client area each); with it on both, the second-created sibling, which lies below the first (new children go below their siblings), is clipped by the first: 3, box still its client area, system region 210,330,260,370 + 160,370,260,390, while the first keeps its whole area"
  top_level_overlap: "a top-level window under another top-level window of the process is not clipped by it (2, its whole client area; system region the whole window): the desktop is composed (DWM)"
  begin_paint: "on the DC from BeginPaint: the update region's box (one invalid rectangle 10,20,40,50: 2 and that rectangle; two apart 10,10,30,20 and 100,60,150,90: 3 and 10,10,150,90, as ps.rcPaint; the whole client area: 2, 0,0,200,100); a GetDC DC taken inside WM_PAINT is not limited to the update region (2, the client area)"
errors:
  bad_dc: "NULL, a made-up handle, a deleted DC, a region handle: ERROR (0), ERROR_INVALID_HANDLE (6), the RECT not written"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Several monitors; windows partly covered by windows of other processes;
  layered windows. DPI awareness other than unaware (the tests have no
  manifest), several monitors, other keyboard layouts than German, IME,
  touch and pen, hooks, menus and the menu loop.
