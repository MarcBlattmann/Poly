# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/userenv.dll/DeleteAppContainerProfile.yaml
id: windows/api/userenv.dll/DeleteAppContainerProfile
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s2b
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: the counts and failures of specs/windows/apps/chrome/traces/s2.trace.json and s2-sandboxed.trace.json (the committed traces have counts, not arguments, for these calls) and section 4 and 4a of specs/windows/apps/chrome/gap-map.md. Microsoft Learn and the SDK headers winnt.h (SECURITY_CAPABILITIES, token classes, S-1-15-2 and S-1-15-3 constants), userenv.h, securityappcontainer.h, securitybaseapi.h, winerror.h and mdmregistration.h. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Deletes the profile of a name: its registry mapping (also one that only AppContainerRegisterSid made) and its folder. No tests of its own: the tests of CreateAppContainerProfile, AppContainerRegisterSid and GetAppContainerFolderPath call it.
same_as: "windows/api/userenv.dll/CreateAppContainerProfile"
interface:
  signature: "HRESULT DeleteAppContainerProfile(PCWSTR name)"
rules:
  results: "S_OK for an existing profile, for a name that was only registered with AppContainerRegisterSid and for a name that never existed (the header says E_INVALIDARG for the last; S_OK was observed)"
errors:
  see_sheet: "the CreateAppContainerProfile sheet"
side_effects: "removes the mapping and the folder"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 0
  held_out: 0
building_tests: >
  see the CreateAppContainerProfile sheet
not_covered: >
  Everything the CreateAppContainerProfile sheet lists as not covered; an empty or NULL name.
