# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/ShellLink.IPersistFile.yaml
id: windows/api/shell32.dll/ShellLink.IPersistFile
oracle:
  os: 'Windows 11 Home 25H2 (build 26200.9974), x64'
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account "server" (member of Administrators). Every test ran twice with identical output, each run in a fresh scratch directory. pf_chrome_std was recorded with -Token standard (a one-time task in the account''s interactive session with the administrator''s FILTERED token); all other tests with the SSH logon''s elevated token. The per-test token is in windows.json.'
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: >
  Observations of our own test programs on the oracle machine, which write shell links and read the files back byte by byte. The file format is Microsoft's public format specification [MS-SHLLINK] (header, LinkTargetIDList, LinkInfo, StringData, ExtraData block signatures and sizes); the test programs build their own .lnk files from it. Microsoft Learn: IPersistFile (Save, Load, IsDirty, GetCurFile, SaveCompleted), IShellLinkW; objidl.h; winerror.h. What Chrome's setup.exe does (SetPath, SetArguments, SetDescription, SetIconLocation, SetWorkingDirectory, a property store value, then IPersistFile::Save with fRemember TRUE to C:\Users\Public\Desktop, the all-users Start menu Programs folder and the user's Quick Launch folder) is from its own verbose log (docs/windows/chrome-installer-plan.md). Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  Saving a shell link as a .lnk file and loading one: the IPersistFile of the ShellLink object. Save writes exactly the name it is given (no .lnk is added), always as a Unicode MS-SHLLINK file, and returns S_OK or an HRESULT from Win32 (5, 3, 0x7B); fRemember TRUE also records the file name (GetCurFile) and Save(NULL) then saves to it; Save always leaves the object clean (IsDirty S_FALSE). What goes into the file depends on what was set and on whether the target exists: the target is stored as a shell ID list (always, when the path is a drive path), plus a LinkInfo with the local base path only when the target exists on a local disk, plus the relative path, the strings that were set, the icon, show command and hot key in the header, and extra-data blocks (a property store block always for an ID-list link). Load accepts only a well-formed header (E_FAIL otherwise) and is tolerant about everything after it; the reported path comes from the ID list, not from LinkInfo. The sheet ends with the rules for reading a .lnk without Windows (reading_a_link).
interface:
  slots: 'IPersistFile after IUnknown: GetClassID 3, IsDirty 4, Load 5 (LPCOLESTR path, DWORD mode), Save 6 (LPCOLESTR path or NULL, BOOL fRemember), SaveCompleted 7 (LPCOLESTR), GetCurFile 8 (LPOLESTR* CoTaskMemAlloc string)'
  flags: 'LinkFlags bits (MS-SHLLINK): 0 HasLinkTargetIDList, 1 HasLinkInfo, 2 HasName, 3 HasRelativePath, 4 HasWorkingDir, 5 HasArguments, 6 HasIconLocation, 7 IsUnicode, 9 HasExpString (0x200), 14 HasExpIcon (0x4000)'
  blocks: 'ExtraData signatures seen: 0xA0000001 EnvironmentVariableDataBlock (size 788), 0xA0000003 TrackerDataBlock (96), 0xA0000005 SpecialFolderDataBlock (16), 0xA0000007 IconEnvironmentDataBlock (788), 0xA0000009 PropertyStoreDataBlock (size depends on the user and the volume), 0xA000000B KnownFolderDataBlock (28), 0xA000000C (345, for a UNC target)'
rules:
  save_ok: 'Save(path, TRUE) after SetPath: S_OK and the file exists. IsDirty is S_OK (0, dirty) after any Set call and S_FALSE (1) after a Save, whether fRemember was TRUE or FALSE. GetCurFile after Save(path, TRUE): S_OK and the same text as path (free the string with CoTaskMemFree); after Save(path, FALSE) or on a fresh link: S_FALSE (1) with a null pointer. Save(NULL, TRUE) on a link with a current file writes to that file (S_OK; the file changes with the new values); Save(NULL, TRUE) and Save(NULL, FALSE) on a link without a current file: S_OK. SaveCompleted(path) and SaveCompleted(NULL): S_OK.'
  save_names: 'the file has exactly the name given: "c.txt" and "d" (no extension) are written as they are and no "c.txt.lnk" or "d.lnk" appears; "e.LNK" is fine. Overwriting an existing file: S_OK. An existing read-only file: 0x80070005. A name that is an existing directory: 0x80070005. A missing directory in the path: 0x80070003. An empty name: 0x80070003. A name with < > or * : 0x8007007B.'
  save_empty: 'a link with nothing set: S_OK, an 80-byte file: the 76-byte header (LinkFlags 0x00000080 = IsUnicode, FileAttributes 0, show command 1, hot key 0) and the 4-byte terminal block'
  save_rights: 'Save into C:\Users\Public\Desktop and into the all-users Start menu Programs folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs) works with the full administrator token (S_OK, the file exists) and fails with 0x80070005 and no file with the filtered (standard) token; saving under the user''s own directories works with both tokens (pf_chrome_std).'
  header: 'file starts with HeaderSize 0x0000004C and the link CLSID {00021401-0000-0000-C000-000000000046}; LinkFlags always has IsUnicode (0x80); FileAttributes, FileSize (the target''s size, non-zero) are those of the target when it exists (0x20 for a file, 0x10 for a directory), 0 when it does not; IconIndex is the index given to SetIconLocation (also negative, -5); ShowCommand is 1 unless SetShowCmd was 3 (SW_SHOWMAXIMIZED) or 7 (SW_SHOWMINNOACTIVE), which are written as they are; the hot key is written as set (0x0741); the reserved fields are 0'
  idlist: 'HasLinkTargetIDList is set when the path is a drive path (also for a missing file, a missing directory, and for a missing drive), not for a UNC path and not for a link without a path. The list is: item 0x1F (My Computer, 20 bytes), item 0x2F (the drive, 25 bytes), then one file-entry item per directory (type 0x31) and one for the file (0x32, or 0x31 for a directory target); each file-entry item holds the name as ANSI text at offset 14 and an extension block with signature 0xBEEF0004 (the long name in Unicode); examples of item sizes: C:\Windows\System32\kernel32.dll is 5 items of 20, 25, 86, 90 and 102 bytes (ID list size 325 with the terminator); C:\Program Files\Google\Chrome\Application\chrome.exe (missing) is 7 items 20, 25, 104, 84, 84, 98, 96; the System32 directory is 4 items; a missing drive Q:\PolySpecB4\app.exe is 4 items'
  linkinfo: 'HasLinkInfo is set only when the target exists on a local fixed disk: LinkInfo of 74 bytes: header size 28, flags 1 (VolumeIDAndLocalBasePath), a 17-byte VolumeID (drive type 3, a serial number), the local base path (the full path as ANSI), an empty common path suffix. No LinkInfo for a missing file, a missing directory, a missing drive or a UNC path.'
  strings: 'StringData entries are written as UTF-16 with a 16-bit character count, in the order NAME_STRING (description), RELATIVE_PATH, WORKING_DIR, COMMAND_LINE_ARGUMENTS, ICON_LOCATION, each present only if set (HasName, HasRelativePath, HasWorkingDir, HasArguments, HasIconLocation): text exactly as set (an environment variable stays unexpanded in the working directory, the arguments and the icon path), non-ASCII characters kept, a 1100-character description kept whole. A link with only a description has HasName only (a 118-byte file). RELATIVE_PATH is written whenever there is an ID list and a path: the path of the target relative to the directory of the file being saved ("..\..\Windows\System32\kernel32.dll"-style, with leading "..\" when the target is on another branch of the tree; for a link saved into C:\Windows\ after SetRelativePath("C:\Windows\x.lnk") it was ".\System32\kernel32.dll"); not written for a missing drive nor for a UNC path.'
  expansion: 'a path set with an environment variable (%SystemRoot%\...) is stored expanded in the ID list and LinkInfo, plus HasExpString (0x200) and an EnvironmentVariableDataBlock (0xA0000001) holding the text as set. A UNC target has neither ID list nor LinkInfo nor relative path: only IsUnicode | HasExpString, an extra block 0xA000000C (345 bytes) and the 0xA0000001 block with the path text. An icon path given as a plain absolute path sets HasExpIcon (0x4000) and writes an IconEnvironmentDataBlock (0xA0000007, 788 bytes) with that path in addition to the ICON_LOCATION string; an icon path with an environment variable ("%SystemRoot%\System32\shell32.dll", index -5) has the string only (no HasExpIcon, no block).'
  extra_blocks: 'order written: 0xA0000007 (when the icon rule above applies) or 0xA0000001 (environment path), then 0xA0000005 (16 bytes) and 0xA000000B (28 bytes) for every link with an ID list of a drive path except a missing drive, then 0xA0000003 (96 bytes) only when the target exists, then 0xA0000009 for the same links; a link with only strings, a missing drive and an empty link have none; the terminal block (4 zero bytes) ends the file.'
  chrome_like: 'the calls Chrome''s setup.exe makes (SetPath of chrome.exe, SetArguments "--source-shortcut-location=desktop", SetDescription "Access the Internet", SetIconLocation(chrome.exe, 0), SetWorkingDirectory(the Application directory), AppUserModel.ID "Chrome", Save to the all-users Desktop) all return S_OK. For a chrome.exe that does not exist the file has LinkFlags 0x000040FD (ID list, name, relative path, working directory, arguments, icon, unicode, HasExpIcon; no LinkInfo), FileAttributes 0, FileSize 0, blocks 0xA0000007, 0xA0000005, 0xA000000B, 0xA0000009; for an existing target 0x000040FF (also HasLinkInfo) with the 0xA0000003 block as well. Loaded with a fresh link: GetPath is the chrome.exe path (missing target too), the arguments, description, working directory and icon (path and index 0) are those set, AppUserModel.ID is "Chrome"; Resolve(NO_UI|NOUPDATE|NOSEARCH) is S_FALSE for the missing target and S_OK for an existing one, GetPath unchanged. The file can be deleted afterwards (DeleteFileW succeeds).'
  load_ok: 'Load(path, mode) of a file Save wrote: S_OK for STGM_READ (0), STGM_WRITE (1), STGM_READWRITE (2) and STGM_SHARE_DENY_NONE (0x40) (the mode is not enforced); the object then has the path, arguments, description, working directory, icon location and index (an environment variable in the icon path kept as typed), show command and hot key of the saved link; IsDirty is S_FALSE; GetCurFile is S_OK with the path. A second Load on the same object is S_OK and replaces the values (a link that had arguments and a path of its own has the loaded ones afterwards).'
  load_errors: 'a missing file: 0x80070002; a directory: 0x80070005; an empty name: 0x80070003; NULL: 0x80070057; a text file, a file of 0x4C zero bytes, a file of 0x4B bytes, a file whose CLSID is wrong, a header size of 0x4D: 0x80004005 (E_FAIL). An empty (0-byte) file: S_OK (an empty link). A good file cut inside the ID list, a good file without its terminal block, a good file with 3 extra bytes at the end: S_OK.'
  load_built: 'files built by hand (header + parts), loaded with S_OK: strings only (name, working directory, arguments, icon with index 3): GetPath S_FALSE and empty, the four strings and the icon index are reported; LinkInfo only (local base path, no ID list): GetPath S_FALSE and empty, also after Resolve, nothing else reported; ID list only (items without the 0xBEEF0004 extension): S_OK and GetPath is the path spelled by the item names; ID list naming one file and LinkInfo naming another: GetPath is the ID list''s; RELATIVE_PATH only (".\target.txt" with that file beside the link): GetPath S_FALSE and empty before and after Resolve; EnvironmentVariableDataBlock only (HasExpString): GetPath (flags 0) S_FALSE empty, GetPath(SLGP_RAWPATH) the text as in the block, and after Resolve(NO_UI|NOUPDATE|NOSEARCH) GetPath gives the expanded path; an ID list with an ICON_LOCATION string "C:\wrong\icon.dll" and an IconEnvironmentDataBlock (HasExpIcon) naming "%SystemRoot%\System32\imageres.dll": the icon is the block''s, expanded ("...\imageres.dll"), index 5 from the header; ANSI string data (IsUnicode clear): read correctly; header ShowCommand 1, 3 and 7 are reported as they are, 2, 0 and 9 are reported as 1; an unknown extra block signature (0xA0000FFF) before the terminal block is ignored.'
  reading_a_link: 'for a program that reads .lnk files itself (Poly''s launcher import): (1) the working directory, arguments, description, icon path and icon index are plain: the StringData texts and the header IconIndex, reliable in every file Save wrote, with environment variables possibly unexpanded (expand them; for the icon prefer an IconEnvironmentDataBlock when there is one). (2) The target: when HasLinkInfo, the LinkInfo local base path is the full path (reliable for existing targets); otherwise read the ID list (names of the file-entry items, from the 0x1F/0x2F root: drive letter in the 0x2F item, then each 0x31/0x32 item''s ANSI name at offset 14; the extension block 0xBEEF0004 holds the Unicode names); otherwise the EnvironmentVariableDataBlock (UNC and environment paths, TargetUnicode at offset 268 of the block, TargetAnsi at 8); the RELATIVE_PATH is relative to the link''s directory and is not enough on its own. Windows itself reports the target only from the ID list, the environment block or SetPath, never from LinkInfo alone or from RELATIVE_PATH alone. (3) The AppUserModel.ID and the ToastActivatorCLSID are in the PropertyStoreDataBlock 0xA0000009 as a serialized property storage (see ShellLink.PropertyStore). (4) ShowCommand: 1 normal, 3 maximized, 7 minimized.'
errors:
  access_denied: '0x80070005'
  file_not_found: '0x80070002'
  path_not_found: '0x80070003'
  invalid_name: '0x8007007B'
  invalid_arg: '0x80070057'
  fail: '0x80004005 (not a link file)'
side_effects: 'Save writes a file; the tests write only in their own scratch directory, except pf_chrome (C:\Users\Public\Desktop\PolySpecB4-Chrome.lnk, created and deleted by the test) and pf_chrome_std (a refused write to the all-users Desktop and Start menu)'
threading: 'apartment-threaded object: used from the thread that created it'
ordering: []
timing:
  typical: 'the 17 saves of pf_format took 2.7 s in all on the oracle (the first save in a process loads the shell's modules), the other tests about 0.1 s'
  guarantees: none
tests:
  visible: 4
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file per test: pf_save (Save/IsDirty/GetCurFile/SaveCompleted, names and errors), pf_format (17 kinds of link saved and the file read back by a small MS-SHLLINK reader that prints the header, the flags, the ID list item sizes and names, the LinkInfo, the strings and the extra block signatures and sizes), pf_load (Load of Save''s files, modes, bad files), pf_built (files built by hand), pf_chrome (Chrome''s calls, Save to C:\Users\Public\Desktop, read back, delete), pf_chrome_std (standard token). The tests use C:\Windows\System32\kernel32.dll as the existing target; nothing prints a user or machine name, a time, a serial number, a volume id or a SID (the size of the 0xA0000009 block, which holds them, is not printed).
not_covered: >
  Per-user Quick Launch and the Start menu of a user (only the all-users folders were written), links to files on network or removable drives, 8.3 names, long paths beyond 260 characters, IShellLinkDataList data blocks, TrackerDataBlock content, shortcuts to Windows Store apps, links that point to other links (SLDF_ALLOW_LINK_TO_LINK), the effect of IPersistStream, saving to a read-only share, another locale.
