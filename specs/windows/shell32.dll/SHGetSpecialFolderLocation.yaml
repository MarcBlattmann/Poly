# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/SHGetSpecialFolderLocation.yaml
id: windows/api/shell32.dll/SHGetSpecialFolderLocation
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, controls draw into memory bitmaps with WM_PRINT, nothing is shown on a screen, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-5
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (paths are shown with the user profile, ProgramData, Public, Windows and Program Files directories replaced by %USERPROFILE%, %PUBLIC%, %ProgramData%, %SystemRoot% and %ProgramFiles%, so no machine or user name is in the tests; files the tests make live in the temp directory and are removed). Microsoft Learn: "SHGetFileInfoW function", "SHGetSpecialFolderLocation function", "SHGetSpecialFolderPathW function", "SHGetFolderPathW function", "SHGetFolderPathA function", "SHGetPathFromIDListW function", "ILCreateFromPathW function", "ILFree function", "CSIDL", "SFGAO"; shlobj.h, shlobj_core.h, shellapi.h and shtypes.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Gives the item identifier list (PIDL) of a special folder named by a CSIDL value; the caller frees it with ILFree (CoTaskMemFree). 7-Zip's file manager asks for the desktop, the documents folder, the drives folder ('Computer'), the network folder and the recycle bin at start-up and stops here on Poly (a stub).
interface:
  signature: "HRESULT SHGetSpecialFolderLocation(HWND hwnd, int csidl, PIDLIST_ABSOLUTE *ppidl)"
rules:
  result: "S_OK (0) and a non-NULL list for every CSIDL value of the table below, also for the virtual folders (controls 3, printers 4, recycle bin 10, drives 17, network 18, connections 49) and CSIDL_INTERNET (1); a list is larger than 2 bytes except the desktop's, which is the empty list (2 zero bytes, size 2)"
  folders: "the path SHGetPathFromIDListW gives for each list (the file system folders; the others return FALSE and write the empty string): DESKTOP 0: %USERPROFILE%\\Desktop; PROGRAMS 2: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs; CONTROLS 3: no path (virtual folder); PRINTERS 4: no path (virtual folder); PERSONAL 5: %USERPROFILE%\\Documents; FAVORITES 6: %USERPROFILE%\\Favorites; STARTUP 7: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; RECENT 8: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Recent; SENDTO 9: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\SendTo; BITBUCKET 10: no path (virtual folder); STARTMENU 11: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu; MYMUSIC 13: %USERPROFILE%\\Music; MYVIDEO 14: %USERPROFILE%\\Videos; DESKTOPDIRECTORY 16: %USERPROFILE%\\Desktop; DRIVES 17: no path (virtual folder); NETWORK 18: no path (virtual folder); NETHOOD 19: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Network Shortcuts; FONTS 20: %SystemRoot%\\Fonts; TEMPLATES 21: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Templates; COMMON_STARTMENU 22: %ProgramData%\\Microsoft\\Windows\\Start Menu; COMMON_PROGRAMS 23: %ProgramData%\\Microsoft\\Windows\\Start Menu\\Programs; COMMON_STARTUP 24: %ProgramData%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; COMMON_DESKTOPDIRECTORY 25: %PUBLIC%\\Desktop; APPDATA 26: %USERPROFILE%\\AppData\\Roaming; PRINTHOOD 27: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Printer Shortcuts; LOCAL_APPDATA 28: %USERPROFILE%\\AppData\\Local; ALTSTARTUP 29: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; COMMON_ALTSTARTUP 30: %ProgramData%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; COMMON_FAVORITES 31: %USERPROFILE%\\Favorites; INTERNET_CACHE 32: %USERPROFILE%\\AppData\\Local\\Microsoft\\Windows\\INetCache; COOKIES 33: %USERPROFILE%\\AppData\\Local\\Microsoft\\Windows\\INetCookies; HISTORY 34: %USERPROFILE%\\AppData\\Local\\Microsoft\\Windows\\History; COMMON_APPDATA 35: %ProgramData%; WINDOWS 36: %SystemRoot%; SYSTEM 37: %SystemRoot%\\System32; PROGRAM_FILES 38: %ProgramFiles%; MYPICTURES 39: %USERPROFILE%\\Pictures; PROFILE 40: %USERPROFILE%; SYSTEMX86 41: %SystemRoot%\\SysWOW64; PROGRAM_FILESX86 42: %ProgramFiles(x86)%; PROGRAM_FILES_COMMON 43: %ProgramFiles%\\Common Files; PROGRAM_FILES_COMMONX86 44: %ProgramFiles(x86)%\\Common Files; COMMON_TEMPLATES 45: %ProgramData%\\Microsoft\\Windows\\Templates; COMMON_DOCUMENTS 46: %PUBLIC%\\Documents; COMMON_ADMINTOOLS 47: %ProgramData%\\Microsoft\\Windows\\Start Menu\\Programs\\Administrative Tools; ADMINTOOLS 48: %USERPROFILE%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Administrative Tools; CONNECTIONS 49: no path (virtual folder); COMMON_MUSIC 53: %PUBLIC%\\Music; COMMON_PICTURES 54: %PUBLIC%\\Pictures; COMMON_VIDEO 55: %PUBLIC%\\Videos; RESOURCES 56: %SystemRoot%\\Resources; CDBURN_AREA 59: %USERPROFILE%\\AppData\\Local\\Microsoft\\Windows\\Burn\\Burn"
  flags: "CSIDL_FLAG_CREATE (0x8000), CSIDL_FLAG_DONT_VERIFY (0x4000), CSIDL_FLAG_PER_USER_INIT (0x800), CSIDL_FLAG_NO_ALIAS (0x1000), CSIDL_FLAG_DONT_UNEXPAND (0x2000) and the unused bits 0x400 and 0x200 are accepted with a valid CSIDL: S_OK; the flag bits alone with the desktop's 0 work (0x4000)"
  repeat: "two calls for the same folder give two lists of equal size and bytes in different memory"
  ilfree: "ILFree(NULL) returns without a fault and ILGetSize(NULL) is 0"
  window: "a made-up window handle is not checked: S_OK"
errors:
  bad_csidl: "a value that is not a folder (0x0c, 0x0f, 0x32, 0x33, 0x3f, 0x40, 0x7f, 0xff, 0x7fff, 0xffff, -1, 0x10000, 0x100000): E_INVALIDARG (0x80070057) and *ppidl is not written"
side_effects: "allocates the list (the caller frees it)"
threading: "any thread (the shell initialises COM-free for these calls)"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes, counts, booleans and sizes that come from the test's own fonts and from system metrics at 96 dpi; no line holds a handle, a pointer or a machine, user or time. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is not printed (it is not specified).
not_covered: >
  Folders redirected to other drives or to OneDrive and domain roaming profiles (the oracle is a workgroup computer with a local profile), other languages (the type names are English), other users and tokens, network and removable drives, junctions and links, 32-bit processes (the %ProgramFiles% answers differ), the contents of virtual folders.
