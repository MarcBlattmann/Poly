# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/KnownFolders.Common.yaml
id: windows/api/shell32.dll/KnownFolders.Common
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). kfc_paths ran in the SSH logon (session 0, elevated token); kfc_write_adm with -Token elevated and kfc_write_std with -Token standard (a one-time task in the account's interactive session 1 with the administrator's full or FILTERED token, see spec-win-elevation). Every test ran twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: >
  Observations of our own test programs on the oracle machine. Microsoft Learn: "SHGetKnownFolderPath function", "KNOWNFOLDERID", "KNOWN_FOLDER_FLAG", "CSIDL" and the public header knownfolders.h (the folder ids) and shlobj_core.h. The folders are the ones Google Chrome's own setup.exe (--system-level) writes its three shortcuts into (survey-chrome-installer, docs/windows/chrome-installer-plan.md: all-users Desktop, all-users Start menu Programs, per-user Quick Launch). This sheet adds to the green entry SHGetKnownFolderPath (its flags, tokens and error codes are not repeated) and to the SHGetSpecialFolderLocation / SHGetFolderPathW sheets (the CSIDL table). Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  Where a program puts a shortcut that every user sees, and what it may do there. The known folders FOLDERID_PublicDesktop, FOLDERID_CommonPrograms, FOLDERID_CommonStartMenu, FOLDERID_CommonStartup, FOLDERID_Programs, FOLDERID_StartMenu, FOLDERID_Startup, FOLDERID_QuickLaunch and FOLDERID_UserPinned all resolve to existing directories on a clean Windows 11 with SHGetKnownFolderPath(flags 0, NULL token), and the CSIDL forms give the very same text. The all-users folders (Public Desktop, the common Start Menu, its Programs and Startup) can be written only with the elevated administrator token (a standard or filtered token gets ERROR_ACCESS_DENIED), the per-user ones (Programs, QuickLaunch) and %ProgramData% itself by every token.
interface:
  ids: "FOLDERID_PublicDesktop {C4AA340D-F20F-4863-AFEF-F87EF2E6BA25}, FOLDERID_CommonPrograms {0139D44E-6AFE-49F2-8690-3DAFCAE6FFB8}, FOLDERID_CommonStartMenu {A4115719-D62E-491D-AA7C-E74B8BE3B067}, FOLDERID_CommonStartup {82A5EA35-D9CD-47C5-9629-E15D2F714E6E}, FOLDERID_Programs {A77F5D77-2E2B-44C3-A6A2-ABA601054A51}, FOLDERID_StartMenu {625B53C3-AB48-4EC1-BA1F-A1EF4146FC19}, FOLDERID_Startup {B97D20BB-F46A-4C97-BA10-5E3608430854}, FOLDERID_QuickLaunch {52A4F021-7B75-48A9-9F6B-4B87A210BC8F}, FOLDERID_UserPinned {9E3995AB-1F9C-4F13-B827-48B24B6C7174} (knownfolders.h)"
  calls: "SHGetKnownFolderPath(id, flags, hToken, &path) as in the SHGetKnownFolderPath sheet; SHGetFolderPathW(NULL, csidl | flags, NULL, SHGFP_TYPE_CURRENT, buffer)"
rules:
  paths: "with flags 0 and a NULL token every id above returns S_OK and an existing directory, in this form (<ProgramData> = FOLDERID_ProgramData, <Public> = FOLDERID_Public, <Profile> = FOLDERID_Profile): PublicDesktop <Public>\\Desktop; CommonStartMenu <ProgramData>\\Microsoft\\Windows\\Start Menu; CommonPrograms <ProgramData>\\Microsoft\\Windows\\Start Menu\\Programs; CommonStartup <ProgramData>\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; StartMenu <Profile>\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu; Programs <Profile>\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs; Startup <Profile>\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup; QuickLaunch <Profile>\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch; UserPinned <Profile>\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned. No path has a trailing backslash. All of them exist on the oracle (a profile that has never used a taskbar pin still has Quick Launch and User Pinned)."
  nesting: "CommonPrograms lies directly in CommonStartMenu and CommonStartup directly in CommonPrograms."
  csidl_equal: "SHGetFolderPathW gives S_OK and the same text for CSIDL_COMMON_DESKTOPDIRECTORY (0x19) as PublicDesktop, CSIDL_COMMON_PROGRAMS (0x17) as CommonPrograms, CSIDL_COMMON_STARTMENU (0x16) as CommonStartMenu, CSIDL_COMMON_STARTUP (0x18) as CommonStartup, CSIDL_PROGRAMS (0x2) as Programs, CSIDL_APPDATA (0x1a) as RoamingAppData and CSIDL_PROGRAM_FILESX86 (0x2a) as ProgramFilesX86."
  flags_on_existing: "on these existing folders KF_FLAG_DEFAULT_PATH (0x400), KF_FLAG_DONT_VERIFY (0x4000) and KF_FLAG_CREATE (0x8000) return S_OK and the same text as flags 0, and CSIDL_FLAG_CREATE (0x8000) on COMMON_PROGRAMS, COMMON_DESKTOPDIRECTORY, APPDATA and PROGRAMS returns S_OK and the same text (nothing is changed on disk)."
  token_default_user: "SHGetKnownFolderPath with hToken -1 (the default user's profile, with KF_FLAG_DONT_VERIFY) returns S_OK for all of them; the all-users folders (PublicDesktop, CommonPrograms) give the same text as for the caller, the per-user ones (Programs, QuickLaunch, RoamingAppData) differ (they lie in the Default profile)."
  write_elevated: "with the elevated administrator token a file can be created (CreateFileW CREATE_NEW), written (3 bytes) and deleted in each of PublicDesktop, CommonStartMenu, CommonPrograms, CommonStartup, ProgramData, Programs and QuickLaunch; after the delete the file does not exist."
  write_standard: "with the same user's filtered (standard) token CreateFileW(CREATE_NEW) fails with ERROR_ACCESS_DENIED (5) in PublicDesktop, CommonStartMenu, CommonPrograms and CommonStartup, and succeeds (create, write, delete) in %ProgramData% itself, Programs and QuickLaunch."
errors:
  access_denied: "5 for the filtered token in the four all-users shortcut folders (create only; listing and reading are not affected)"
side_effects: "kfc_write_* create and delete one file named PolySpecB4_kfc_write.tmp in each folder"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations from Learn's prototypes. kfc_paths runs in the SSH logon; kfc_write_adm and kfc_write_std are recorded with the full and the filtered token (per-test token and session in windows.json). Paths are shown relative to <Public>, <ProgramData>, <Profile> or <ProgramFiles>, so no line holds a user or machine name; the created file is removed in every test.
not_covered: >
  A computer where the Public Desktop, the common Start Menu or the Quick Launch folder was redirected or removed, KF_FLAG_CREATE on a folder that does not exist (not made on the oracle), the other known folders, a domain or roaming profile, a non-administrator user (the filtered token of an administrator is the only standard token tried), listing and reading in the all-users folders by the filtered token, Group Policy that changes folder permissions.
