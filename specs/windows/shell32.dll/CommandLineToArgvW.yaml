errors:
  null_command_line: "a NULL command line pointer makes the call crash with an access violation (0xC0000005) in the caller's process; not covered by a test (it would end the test program)"
  num_args: "*num_args is set for every successful call; the function returns NULL only for memory failures (not tested)"
side_effects: "allocates one block with LocalAlloc semantics"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
building_tests: "Rust tests (ADR 0075); each prints one line per input with the argument count and every argument between angle brackets, non-ASCII or control characters as <xxxx>. cla_rules: quoting rules and the first argument; cla_special: empty, whitespace, the block layout (pointers inside the allocation, LocalSize, LocalFree returns NULL); cla_chrome: five real command lines of Chrome's installers (arguments longer than 200 characters are cut by the test's printer)."
not_covered: "NULL command line (crashes); the ANSI form (shcore/shell32 export only the W function); command lines over the 32767-character limit of CreateProcess; surrogate pairs and other non-ASCII text; the behaviour of the C runtime's own parser (it differs for the first argument and for the quirk above)."
tests:
  visible: 2
  held_out: 1
