# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/CommandLineToArgvW.yaml
id: windows/api/shell32.dll/CommandLineToArgvW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). Default mode: the SSH logon (session 0, no interactive desktop, the administrator's elevated token, 24 privileges). Every test ran twice with identical output."
  observed_by: "spec-win-chrome-setup"
  date: "2026-11-17"
sources: "Observations of our own test programs on the oracle machine. Microsoft Learn: CommandLineToArgvW (shellapi.h; the page states the rules for backslashes and quotes and that an empty string gives the executable's path), \"Parsing C++ command-line arguments\" (the same rules for the C runtime), LocalFree. The command lines in cla_chrome are the ones in Chrome's own installer log (survey-chrome-installer). Nothing of Windows or Google's programs was read or disassembled."
summary: "Splits a command line (UTF-16) into arguments the way Windows programs' C runtime does, and returns them as an array of pointers in one memory block that the caller frees with LocalFree. The first argument (the program name) follows its own simpler rules; the other arguments follow the backslash and quote rules below. The `examples` list is normative: it holds the input and the exact result for every case recorded. Chrome's setup.exe imports this function for its own command line."
interface:
  signature: "LPWSTR *CommandLineToArgvW(LPCWSTR command_line, int *num_args)  (shell32; the real export is forwarded to shcore)"
  result: "pointer to argc+1 pointers, the last one NULL, directly followed (in the same allocation) by the UTF-16 strings; every argv[i] points into that block, behind the pointer array; LocalFree(argv) frees everything and returns NULL"
rules:
  empty: "an empty string gives argc 1 and argv[0] = the full path of the running program's executable (equal to GetModuleFileNameW(NULL)), argv[1] = NULL"
  whitespace_only: "a string of only spaces or tabs gives argc 1 with argv[0] the empty string; a string that starts with whitespace gives an empty argv[0] first and the rest as arguments (\"   a b\" -> \"\", \"a\", \"b\")"
  separators: "spaces and tabs outside quotes separate arguments; runs of them count as one; trailing whitespace adds no argument; other whitespace is not a separator"
  argv0: "the first argument: if it starts with a quote it ends at the next quote (no escapes: a backslash before that quote does not protect it) and the characters between are the argument; otherwise it ends at the first space or tab, quotes and backslashes inside it have no special meaning. After a quoted program name the next argument starts right behind the closing quote even without a space (\"a b\"x y -> \"a b\", \"x\", \"y\"). An unterminated opening quote takes the rest of the string (\"a b -> \"a b\", one argument). The quirk `\"\"x y` -> \"\", \"x y\" (empty quoted program name followed directly by text) is in the examples."
  backslashes: "from the second argument on: 2n backslashes followed by a quote give n backslashes and the quote starts or ends a quoted part; 2n+1 backslashes followed by a quote give n backslashes and a literal quote; backslashes not followed by a quote stay as they are (a\\\\b stays a\\\\b, 3 backslashes + a stay 3 backslashes + a)"
  quotes: "a quote toggles quoted mode and is removed; inside quoted mode spaces and tabs belong to the argument; a quote in the middle of a word joins the parts (a\"b c\"d -> \"ab cd\"); an empty pair \"\" as a whole argument gives an empty argument; a pair of quotes inside quoted text and the other doubled-quote cases behave as the examples show (e.g. \"a\"\"b\" c -> one argument a\"b c); an unterminated quote takes the rest of the string as part of the argument"
  long_arguments: "arguments of 100 and more characters are returned whole; the examples show an installer command line of about 280 characters"
