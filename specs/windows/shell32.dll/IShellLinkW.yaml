# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/IShellLinkW.yaml
id: windows/api/shell32.dll/IShellLinkW
oracle:
  os: 'Windows 11 Home 25H2 (build 26200.9974), x64'
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account "server" (member of Administrators, the SSH logon''s elevated token); every test ran twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: >
  Observations of our own test programs on the oracle machine (every test ran twice with identical output). Microsoft Learn: IShellLinkW and its methods (GetPath with the SLGP_* flags, Resolve with the SLR_* flags), shobjidl_core.h for the order of the methods and the flag values (SLGP_SHORTPATH 1, SLGP_UNCPRIORITY 2, SLGP_RAWPATH 4, SLGP_RELATIVEPRIORITY 8; SLR_NO_UI 1, SLR_NOUPDATE 8, SLR_NOSEARCH 0x10), WIN32_FIND_DATAW (minwinbase.h), winerror.h. Chrome's setup.exe calls SetPath, SetArguments, SetDescription, SetIconLocation and SetWorkingDirectory on each shortcut it writes (its verbose log; docs/windows/chrome-installer-plan.md). Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  The setters and getters of a shell link (the object of the entry ShellLink) for the target, the arguments, the description, the working directory, the icon, the show command, the hot key, the ID list, the relative path, and Resolve. The data is plain: a string set is the string read back, the object does not check lengths (except the path: at most 259 characters), only SetPath changes what it is given (it expands environment variables for the normal GetPath, collapses .. and forward slashes, strips quotes, uses the file system's own letter case for an existing file). GetPath is S_FALSE when no path is set, and its buffer rule is the strict one (cch must be the length plus one, else a truncated string and 0x8007007A); the other string getters truncate silently. Resolve with SLR_NO_UI never shows anything and answers S_FALSE for a target that does not exist.
interface:
  slots: 'after IUnknown (0 to 2): GetPath 3, GetIDList 4, SetIDList 5, GetDescription 6, SetDescription 7, GetWorkingDirectory 8, SetWorkingDirectory 9, GetArguments 10, SetArguments 11, GetHotkey 12, SetHotkey 13, GetShowCmd 14, SetShowCmd 15, GetIconLocation 16, SetIconLocation 17, SetRelativePath 18, Resolve 19, SetPath 20 (IShellLinkA has the same slots with char strings)'
  signatures: 'GetPath(LPWSTR buf, int cch, WIN32_FIND_DATAW* fd or NULL, DWORD flags); Get{Description,WorkingDirectory,Arguments}(LPWSTR buf, int cch); GetIconLocation(LPWSTR buf, int cch, int* index); GetShowCmd(int*); GetHotkey(WORD*); SetIconLocation(LPCWSTR path, int index); SetRelativePath(LPCWSTR path, DWORD reserved); Resolve(HWND, DWORD flags); GetIDList(PIDLIST_ABSOLUTE*), SetIDList(PCIDLIST_ABSOLUTE)'
rules:
  path_basic: 'SetPath of "C:\Windows\System32\kernel32.dll" (an existing file) is S_OK; GetPath (flags 0) is S_OK with the same text; the find data has the file''s attributes (0x20), a non-zero size and cFileName "kernel32.dll". For a directory the attributes are 0x10. The path of a missing file, a missing directory, a missing drive or a UNC name is accepted (S_OK) and returned as given (the case of a UNC name as typed); the find data then has attributes 0 and size 0 but cFileName is the last component.'
  path_case: 'an existing file: the text returned has the file system''s letter case and an upper-case drive letter ("c:\windows\system32\KERNEL32.DLL" returns "C:\Windows\System32\kernel32.dll"); a missing file keeps the case typed'
  path_canonical: '".." components are collapsed, "/" becomes "\", surrounding double quotes are removed ("\"C:\...\x.dll\"" is stored without them); for these three the find data attributes and size are 0 (cFileName is set) even when the file exists. An unquoted text with trailing arguments ("C:\...\kernel32.dll /c exit") is stored whole as the path, with its "/" turned into "\" (nothing is parsed); a quoted path followed by arguments is refused: 0x80070057 (E_INVALIDARG) and the link has no path (GetPath S_FALSE). Empty text: S_OK and no path (GetPath then S_FALSE, empty).'
  path_env: 'a path with an environment variable ("%SystemRoot%\System32\kernel32.dll"): S_OK; GetPath with flags 0, SLGP_SHORTPATH, SLGP_UNCPRIORITY or SLGP_RELATIVEPRIORITY returns the expanded path and fills the find data of the file; GetPath with SLGP_RAWPATH returns the text exactly as set (34 units, not 32)'
  path_flags: 'for the paths tested, SLGP_SHORTPATH, SLGP_UNCPRIORITY and SLGP_RELATIVEPRIORITY return the same text as flags 0 (no 8.3 name is made)'
  path_length: 'SetPath accepts 259 characters; 260 or more fail with 0x80004005 (E_FAIL), the link keeps no path (GetPath S_FALSE). A second SetPath replaces the first; SetPath("") after a path removes it.'
  path_buffer: 'GetPath with a 32-character path (the length n): cch 0 is 0x80070057 and nothing is written; cch 1 to n are 0x8007007A (HRESULT of ERROR_INSUFFICIENT_BUFFER) with the text cut to cch-1 characters and a terminating NUL; cch n+1 and more are S_OK. Nothing is written beyond cch units. A negative cch: 0x80070057, nothing written. With no path set: S_FALSE (1) and an empty string, whatever cch (0 included).'
  other_strings: 'Description, WorkingDirectory, Arguments and the icon path: S_OK for every length tried (1, 259, 260, 261, 1023, 1024, 1025, 2047, 2048, 2049 and 4000 units) and the whole text comes back; the object enforces no limit. Spaces at both ends, double and single quotes, backslashes, tab and line feed, "%VAR%" text (not expanded), non-ASCII characters (U+00E9, U+03B1) and the empty string are kept exactly. A second Set replaces the first; the properties do not affect each other.'
  other_buffers: 'Get{Description,WorkingDirectory,Arguments,IconLocation} with a buffer smaller than the text: S_OK and the text cut to cch-1 characters (cch 0 writes nothing, cch 1 writes the NUL), never an error; nothing is written beyond cch.'
  null_strings: 'SetPath(NULL): 0x80070057. SetArguments, SetDescription, SetWorkingDirectory, SetRelativePath and SetIconLocation with a NULL string: S_OK; for SetArguments it clears the value (GetArguments then gives an empty string). GetDescription(NULL, 0): 0x80070057. GetPath(NULL, 0, NULL, 0): S_FALSE on a link without a path. GetShowCmd(NULL) and GetHotkey(NULL) crash with an access violation (never call them that way; not tested).'
  icon: 'SetIconLocation(path, index) stores the text as given (an environment variable is not expanded, "%SystemRoot%\System32\shell32.dll" comes back as typed) and any int index including negative ones (-5, 12, 3); GetIconLocation returns S_OK with the text and the index; an empty path is kept with its index (7); nothing checks that the file exists.'
  show_cmd: 'SetShowCmd stores any int and GetShowCmd returns it (0 to 12, -1 and 100 were tried), S_OK both ways; a fresh link is 1. (What a saved file keeps of it is in ShellLink.IPersistFile.)'
  hotkey: 'SetHotkey stores any WORD and GetHotkey returns it (0, 0x0141, 0x0641, 0x0741, 0x0370, 0x0001, 0xFFFF, 0x0100, 0x7F41); low byte the virtual key, high byte the modifiers (HOTKEYF_SHIFT 1, CONTROL 2, ALT 4, EXT 8).'
  id_list: 'after SetPath, GetIDList is S_OK with a non-null list for an existing file, a missing file in an existing directory, a missing directory, a directory and an environment-variable path (free it with ILFree or CoTaskMemFree). SetIDList(that list) on another link: S_OK and GetPath of that link is the same path text; SetIDList(NULL): S_OK and the link has no path again (GetPath S_FALSE).'
  relative_path: 'SetRelativePath(path, 0) is S_OK for any text (a file path, a relative path, the empty string); a non-zero reserved argument: 0x80070057.'
  resolve: 'Resolve(NULL, SLR_NO_UI | SLR_NOUPDATE | SLR_NOSEARCH) (0x19): a link with no path: S_OK; existing file, an environment-variable file, an existing directory: S_OK (and GetPath then gives the expanded path; GetPath RAWPATH still the text as set); a missing file in an existing directory, a missing directory, a missing drive: S_FALSE (1), the path unchanged; a second call gives the same result. SLR_NO_UI | SLR_NOSEARCH alone and with a timeout (500) in the high word on an existing file: S_OK. No window appears and nothing is searched.'
errors:
  invalid_arg: '0x80070057 (E_INVALIDARG): SetPath(NULL), a quoted path with arguments, GetPath cch 0 or negative, GetDescription(NULL, 0), SetRelativePath with a non-zero reserved'
  buffer: '0x8007007A: GetPath with a buffer too small for the path'
  fail: '0x80004005: SetPath with 260 or more characters'
side_effects: 'none'
threading: 'apartment-threaded object: used from the thread that created it'
ordering: []
timing:
  typical: 'well under a millisecond per call (SetPath of an existing file under a millisecond)'
  guarantees: none
tests:
  visible: 3
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file per test: sl_path (SetPath of 17 kinds of text with the five SLGP_* flags and the find data, the GetPath buffer sizes), sl_strings (string lengths, small buffers, kept characters, icon location), sl_misc (show command, hot key, ID list, relative path), sl_resolve, sl_null. They use C:\Windows\System32\kernel32.dll as the existing file, C:\Windows\System32 as the directory and names with the prefix PolySpecB4 for the missing ones. Observations are HRESULTs, lengths, booleans and short texts.
not_covered: >
  A bare file name in SetPath (it is searched on the PATH and the text follows the PATH''s spelling), a relative path (resolved against a directory the tests do not fix), 8.3 short names (the volume''s short names may be off), DFS and mapped-drive UNC priority, SLR_UPDATE and SLR_ANY_MATCH, Resolve with a window and a dialog, Resolve with a target that moved (the search of the link tracker), IShellLinkA beyond what ShellLink shows, GetShowCmd(NULL)/GetHotkey(NULL) (crash).
