# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/ShellExecuteExW.yaml
id: windows/api/shell32.dll/ShellExecuteExW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-dl
  date: 2026-11-11
sources: >
  Observations of our own test programs on the machine above and, for what Chrome does, Chrome for Testing 157.0.8103.38 downloading a file from a local web server on the same machine (its download path traced with tools/wintrace/polytrace-sync for the shell and COM calls and with the counting logger for kernel32; the file system seen from outside). Microsoft Learn and the public SDK headers for prototypes and constants. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled. Microsoft Learn: IShellItem, IFileOperation, IShellFolder, IFileDialog, ITaskbarList3, ICustomDestinationList, SHCreateItemFromParsingName, SHParseDisplayName, ShellExecuteExW, SHOpenFolderAndSelectItems; shobjidl_core.h for the order of the methods and the interface ids.
summary: >
  Starts a file the way the shell does: the program of its type for a document, the file itself for a program. Chrome's download "Open" starts the downloaded file this way, with the file as a PIDL and the download folder as the working directory, and "Show in folder" and other places use it for folders. The file's type decides the program through the registry (HKEY_CLASSES_ROOT, with HKEY_CURRENT_USER\Software\Classes over it): extension, program id, shell\open\command.
interface:
  signature: "BOOL ShellExecuteExW(SHELLEXECUTEINFOW *pExecInfo)"
  info: "SHELLEXECUTEINFOW, 112 bytes on x64: cbSize 0, fMask 4, hwnd 8, lpVerb 16, lpFile 24, lpParameters 32, lpDirectory 40, nShow 48, hInstApp 56, lpIDList 64, lpClass 72, hkeyClass 80, dwHotKey 88, hIcon or hMonitor 96, hProcess 104"
  masks: "SEE_MASK_IDLIST 4, SEE_MASK_NOCLOSEPROCESS 0x40, SEE_MASK_FLAG_DDEWAIT 0x100, SEE_MASK_FLAG_NO_UI 0x400"
chrome:
  open: "Open on a finished download: SHParseDisplayName(<path>, NULL, &pidl, SFGAO_FILESYSTEM) = S_OK, then ShellExecuteExW with cbSize 0x70, fMask 0x104 (IDLIST | FLAG_DDEWAIT), lpVerb NULL, lpFile NULL, lpIDList = the PIDL, lpDirectory = the download folder (NULL parameters) = TRUE. On the oracle that started Notepad on the downloaded `.txt` file and, a moment later, the system's smartscreen process (the check a file from the internet gets)"
rules:
  executable: "an executable by name, no verb or the verb `open`, with parameters: TRUE, last error 0, hInstApp above 32; with SEE_MASK_NOCLOSEPROCESS hProcess is a process handle: the process receives its command line as the quoted path, a space, the parameters; it runs and ends with its own exit code"
  by_pidl: "the same by PIDL (SEE_MASK_IDLIST, lpFile NULL): the same process with the same command line (with parameters), a directory given only changes the folder it runs in; the PIDL form without parameters gives the process no parameters"
  document: "a document whose extension is registered (HKCU\\Software\\Classes\\.ext -> a program id -> `shell\\open\\command` = `\"<program>\" <args> \"%1\"`): TRUE, last error 0, the program starts with %1 replaced by the document's full path, in quotes as the command wrote it; the verb NULL and the verb `open` do the same; by name and by PIDL give the same command line; a document with a space in its name and with the extension in capitals does too"
  no_association: "an extension nothing is registered for, with SEE_MASK_FLAG_NO_UI: FALSE, last error 0x80004021 (2147500065), hInstApp 5; the same after the registration is removed; without NO_UI the shell asks the user which program to use (a window: the test never calls it that way)"
  no_verb: "a verb the type has not (`nosuchverb` on an executable, `print` on the registered type), NO_UI: FALSE, ERROR_NO_ASSOCIATION (1155), hInstApp 31"
  missing: "a file that is not there and a file in a folder that is not there (NO_UI): FALSE, ERROR_FILE_NOT_FOUND (2), hInstApp 2"
  bad_size: "cbSize 8 and cbSize 0: FALSE, ERROR_ACCESS_DENIED (5), hInstApp 5"
  directory: "a working directory that does not exist is ignored: TRUE and the program runs"
  no_file: "no file and no PIDL does not return in a non-interactive session even with NO_UI (it waits for an answer: not tested)"
errors:
  no_association: "1155"
  not_found: "2"
  access_denied: "5"
  no_assoc_ui: "2147500065"
side_effects: "starts processes; the document test writes keys under HKEY_CURRENT_USER\\Software\\Classes\\.polyse and \\PolySeFile and removes them again"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, error codes, booleans, sizes and short contents; no line holds a handle, a pointer, a drive letter, a user or machine name or a time. Files live in the test's own scratch folder. The program every case starts is the test's own image, run again with `--child`; it writes what it received to a file and exits 42 (executable) or 43 (document).
not_covered: >
  the verbs `runas`, `edit`, `print` of real types, DDE, folders and URLs, `hkeyClass` and `lpClass`, SEE_MASK_INVOKEIDLIST, SEE_MASK_NOASYNC, the windows the shell shows without NO_UI, protocol handlers, App Paths, the security prompt for files from the internet (a downloaded file's Zone.Identifier of ZoneId 3 triggers the smartscreen check and a warning for executables on a normal desktop).
