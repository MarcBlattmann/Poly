# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shell32.dll/ShellDispatch.ShellExecute.yaml
id: windows/api/shell32.dll/ShellDispatch.ShellExecute
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). sde_start ran with -Token elevated (the interactive session 1 of the account, the full token, where Explorer runs), sde_start_std with -Token standard (the same session, the administrator's FILTERED token), sde_start_ssh in the SSH logon (session 0, elevated token, no shell window). Every test ran twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: >
  Observations of our own test programs on the oracle machine. Microsoft Learn: "IShellWindows", "IShellWindows::FindWindowSW", "IShellDispatch2::ShellExecute", "IShellFolderViewDual", "IServiceProvider", "IShellBrowser", "IShellView::GetItemObject", "ShellExecuteEx", "User Account Control", and the public headers exdisp.h, shobjidl_core.h, servprov.h (interface ids, vtable order, SWC_/SWFO_ constants, SID_STopLevelBrowser). Google Chrome's own setup.exe, run elevated, ends with Explorer starting `chrome.exe --from-installer` (survey-chrome-installer, docs/windows/chrome-installer-plan.md: the process tree shows Explorer.EXE as the parent of chrome.exe): this is the documented way to start a program from an elevated process with the user's own, unelevated token. Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  A program running with the administrator's full token starts another program so that it runs like a program the user started from the desktop: asking the shell's own Shell.Application (the object behind the desktop of the interactive session: IShellWindows -> FindWindowSW for the desktop -> the browser's active view -> its background IShellFolderViewDual -> Application) to ShellExecute makes Explorer the parent of the new process, with the user's filtered (medium integrity, not elevated) token in the interactive session. Starting the same program with ShellExecuteExW, or through a Shell.Application created inside the caller, keeps the caller as parent and gives the child the caller's own token.
interface:
  chain: "CoCreateInstance(CLSID_ShellWindows {9BA05972-F6A8-11CF-A442-00A0C90A8F39}, CLSCTX_LOCAL_SERVER, IID_IShellWindows {85CB6900-4D95-11CF-960C-0080C7F4EE85}); IShellWindows::FindWindowSW(VT_I4 CSIDL_DESKTOP 0, VT_EMPTY, SWC_DESKTOP 8, &hwnd, SWFO_NEEDDISPATCH 1, &dispatch); QueryInterface(IServiceProvider {6D5140C1-7436-11CE-8034-00AA006009FA}).QueryService(SID_STopLevelBrowser {4C96BE40-915C-11CF-99D3-00AA004AE837}, IID_IShellBrowser {000214E2-0000-0000-C000-000000000046}); IShellBrowser::QueryActiveShellView; IShellView::GetItemObject(SVGIO_BACKGROUND 0, IID_IDispatch); QueryInterface(IShellFolderViewDual {E7A1AF80-4D96-11CF-960C-0080C7F4EE85}).get_Application; late-bound IDispatch::GetIDsOfNames(\"ShellExecute\") and Invoke(DISPATCH_METHOD) with the arguments file, args, dir, verb, show (in reverse order in DISPPARAMS; dir and verb as VT_ERROR DISP_E_PARAMNOTFOUND, show VT_I4 0)."
  other_routes: "CoCreateInstance(CLSID_Shell {13709620-C279-11CE-A49E-444553540000}, CLSCTX_INPROC_SERVER, IID_IDispatch) and the same Invoke; ShellExecuteExW with the program and \"--child ...\" as parameters (SEE_MASK_NOCLOSEPROCESS)."
rules:
  desktop_chain: "with the interactive session's Explorer running every step of the chain returns S_OK: ShellWindows is created in Explorer (out of process), FindWindowSW returns S_OK with a window handle and a dispatch, IServiceProvider, the top-level browser, the active shell view, the background object, the IShellFolderViewDual interface and its Application all return S_OK, and Invoke of ShellExecute returns S_OK (the call returns at once; the started program runs on its own). This holds for the elevated token, for the filtered token and also for a caller in the SSH logon (session 0, which has no shell window of its own: GetShellWindow is NULL there): the chain reaches the Explorer of the interactive session 1."
  child_of_the_desktop_chain: "the program started through the chain reports (a copy of the test executable writes its own token and parent into a file): TokenElevation 0, TokenElevationType 3 (limited), integrity level medium (0x2000), not in session 0, parent process image explorer.exe, parent is not the calling process. This is the same for a caller with the full elevated token (sde_start), a caller with the filtered token (sde_start_std) and a caller in the SSH logon (sde_start_ssh): the child is the user's ordinary desktop process, never the caller's token."
  child_of_shellexecuteex: "ShellExecuteExW from the caller (verb none): TRUE; the child's token is the caller's: elevated (TokenElevation 1, type 2, integrity high 0x3000) for the full token, limited (0, 3, medium) for the filtered token, elevation 1 / type 1 / high / session 0 for the SSH logon; its session is the caller's; the parent is the caller."
  child_of_inproc_shell: "Shell.Application created in the caller (CLSID_Shell in process) and Invoke(ShellExecute): the same as ShellExecuteExW (token, session and parent of the caller)."
  caller_facts: "the elevated caller of sde_start reports TokenElevation 1, type 2, integrity 0x3000, not session 0, and the desktop's shell window (GetShellWindow) belongs to explorer.exe; the filtered caller reports 0, 3, 0x2000; the SSH caller reports 1, 1, 0x3000 and session 0 with no shell window."
errors:
  none_recorded: "no failing HRESULT occurred in the recorded runs; the cases where the interactive session has no Explorer (not logged in, locked, the shell crashed) were not provoked"
side_effects: "starts three short-lived copies of the test executable per run (they write a report file in the test's scratch directory and end at once); no registry or file outside the scratch directory"
threading: "COM single-threaded apartment; ShellWindows lives in Explorer"
ordering: []
timing:
  typical: "the report of a child appeared within a second; the tests allow 12 s"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test; each is its own child (the executable starts itself with `--child <report path>|<parent process id>` and writes lines `elevation N`, `elevation type N`, `integrity 0x...`, `session is 0: bool`, `parent image <name>`, `parent is the test process: bool`). The child runs before any observation file is opened, so poly-test.out is the parent's alone. sde_start and sde_start_std need the interactive session (-Token elevated / -Token standard, long timeout: -TestTimeouts name=120); sde_start_ssh runs in the SSH logon. Observations print only booleans, small numbers and image names (the three tests are named differently, so the image name of a parent that is the test itself differs between them; that line appears only for routes A and B).
not_covered: >
  Explorer not running or the user not logged on, a locked desktop, a different user logged on, Explorer started elevated, the verbs (runas, edit, print) and the show command through the chain, IShellDispatch2's other methods (ShellExecute with a document, Open, Explore), the arguments and working directory of the started program beyond the "--child" line, a timeout or hang of FindWindowSW, 32-bit callers, and what Poly's launcher does (B5: Poly starts a program with the user's token from its own session manager).
