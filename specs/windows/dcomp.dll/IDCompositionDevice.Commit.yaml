# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/dcomp.dll/IDCompositionDevice.Commit.yaml
id: windows/api/dcomp.dll/IDCompositionDevice.Commit
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "DCompositionCreateDevice function (dcomp.h)", "DCompositionCreateDevice2 function (dcomp.h)", "DCompositionCreateDevice3 function (dcomp.h)", "IDCompositionDevice interface", "IDCompositionDevice2 interface", "IDCompositionDesktopDevice interface", "IDCompositionVisual interface", "IDCompositionTarget interface", "IDXGIFactory2::CreateSwapChainForComposition", "IDCompositionDevice::Commit", "IDCompositionDevice::WaitForCommitCompletion", "IDCompositionDevice::GetFrameStatistics", "IDCompositionDevice::CheckDeviceState", "IDCompositionDevice::CreateSurface", "IDCompositionDevice::CreateVirtualSurface"; dcomp.h, dcomptypes.h, dxgi1_2.h, dxgi1_3.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Commits the batched changes of all objects of the device so the composition engine picks them up; with WaitForCommitCompletion, GetFrameStatistics and CheckDeviceState it is the frame-pacing part of DirectComposition. Observed in session 0 / headless conditions: everything is S_OK without any window shown; the statistics are plausible relations; the surface creation methods (CreateSurface, CreateVirtualSurface) are in the same entry (tests dccommit_surfaces and dccommit_huge). Rules below are grouped by method.
interface:
  signature: "HRESULT IDCompositionDevice::Commit(); WaitForCommitCompletion(); GetFrameStatistics(DCOMPOSITION_FRAME_STATISTICS*); CheckDeviceState(BOOL*) (slot 26 of the v1 interface); CreateSurface(UINT w, UINT h, DXGI_FORMAT, DXGI_ALPHA_MODE, IDCompositionSurface**)"
  constants: "slots: Commit 3, WaitForCommitCompletion 4, GetFrameStatistics 5; DCOMPOSITION_FRAME_STATISTICS = 5 x 8 bytes (dcomptypes.h)"
chrome:
  calls: "Chrome's GPU process (DirectComposition path, assumed from its documented design; the tracer only sees the exports) makes a D3D11 device, takes its IDXGIDevice, calls DCompositionCreateDevice3 (or 2) and asks for IDCompositionDesktopDevice, creates a target for the browser window's HWND with topmost TRUE, a root visual and one visual per overlay layer, sets a flip swap chain made by CreateSwapChainForComposition as the content of a visual, calls Commit after each change and uses WaitForCommitCompletion / GetFrameStatistics for frame pacing."
rules:
  commit: "Commit (slot 3) is S_OK on a device with no objects (twice), on the v1 device and on the IDCompositionDevice3 interface, after CreateVisual, 300 times in a row after 300 changes and 300 times in a row without any change; a change without Commit is no error; the devices are independent (Commit of one does not need the other)"
  wait: "WaitForCommitCompletion (slot 4) is S_OK after Commit, twice in a row, on a device that never committed and on a device with no changes (it does not block when there is nothing to wait for); it also follows 300 commits"
  frame_statistics: "GetFrameStatistics (slot 5) fills a 40-byte DCOMPOSITION_FRAME_STATISTICS (lastFrameTime, currentCompositionRate num/den, currentTime, timeFrequency, nextEstimatedFrameTime; all written) and returns S_OK on the desktop device, the v1 device and the version 3 interface; relations seen: the rate numerator and denominator are non-zero and the rate is between 24 and 1000 Hz; timeFrequency equals QueryPerformanceFrequency (and is the same on every device and before/after a target is committed); currentTime is within 10 seconds of QueryPerformanceCounter and does not decrease between two calls; a NULL pointer gives E_INVALIDARG (values depend on the session and the display: the test prints relations only)"
  check_device_state: "CheckDeviceState(&valid) (IDCompositionDevice slot 26, v1 interface; also on the v1 interface of a desktop-device object and of a v2 device): S_OK with valid = 1 (TRUE) for a healthy rendering device, repeatedly; a NULL pointer gives E_INVALIDARG"
  null_arguments: "NULL for GetFrameStatistics' pointer and CheckDeviceState's pointer: E_INVALIDARG (no crash)"
  create_surface: "CreateSurface(width, height, format, alpha, &surface) (v1 slot 8 and desktop slot 8) and CreateVirtualSurface (slot 9): B8G8R8A8_UNORM with alpha PREMULTIPLIED, IGNORE or UNSPECIFIED S_OK; alpha STRAIGHT E_INVALIDARG; R8G8B8A8_UNORM and R16G16B16A16_FLOAT S_OK; R10G10B10A2_UNORM, R8_UNORM and DXGI_FORMAT_UNKNOWN E_INVALIDARG; 1x1 S_OK; 0x0: the desktop device S_OK, the v1 device E_INVALIDARG; width 0 with height 64: CreateSurface E_INVALIDARG on both, CreateVirtualSurface S_OK on the desktop device and E_INVALIDARG on the v1 device; 100000x100000: CreateSurface E_OUTOFMEMORY (0x8007000E) on both devices (machine dependent), CreateVirtualSurface S_OK; a NULL output pointer E_INVALIDARG"
  huge_sizes: "per fresh device: surfaces 4096x4096, 16384x1, 16385x1 and 1x16385, 0x0 S_OK (the 16384 limit of D3D11 is not applied); 100000x100000 E_OUTOFMEMORY; virtual surfaces 4096x4096, 16384x16384, 16385x16385, 32768x32768, 100000x100000 and 0x0 S_OK; Commit, SetContent and Commit afterwards S_OK and the D3D11 device stays healthy"
  huge_removes_device: "SURPRISE: after a 100000x100000 virtual surface was created on a device (and released), drawing in an ordinary 64x64 surface (BeginDraw(NULL), EndDraw S_OK) and then Commit gives DXGI_ERROR_DEVICE_REMOVED (0x887A0005) and the D3D11 device itself reports removed (GetDeviceRemovedReason 0x887A0005); without the huge surface the same drawing and Commit are S_OK. Creating the surfaces, Commit and creating ordinary surfaces before the drawing are all S_OK"
  surface_interfaces: "a surface answers IDCompositionSurface and IUnknown (same pointer as the object); not IDCompositionVirtualSurface, IDXGISurface, ID3D11Texture2D, IDCompositionVisual; a virtual surface answers IDCompositionSurface and IDCompositionVirtualSurface (same pointer)"
  begin_draw: "BeginDraw(NULL rect, iid, &object, &offset) (IDCompositionSurface slot 3): S_OK for ID3D11Texture2D (a 1-mip, 1-slice BGRA texture at least as large as the surface: it is a part of a larger shared texture; the offset says where to draw), IDXGISurface and IUnknown; a made-up iid E_NOINTERFACE with NULL object and offset (0,0); a NULL object pointer or a NULL offset pointer E_INVALIDARG; EndDraw (slot 4) S_OK after a successful BeginDraw; EndDraw without BeginDraw DCOMPOSITION_ERROR_SURFACE_NOT_BEING_RENDERED (0x88980802); a rectangle (4,4,20,20) on a surface that was never drawn in E_INVALIDARG (and then EndDraw 0x88980802), but S_OK after a full-surface draw; rectangles outside the surface (0,0,33,33), (-1,0,8,8), empty (8,8,8,8) and inverted: E_INVALIDARG; after a full draw and a rectangle draw, Commit S_OK"
  virtual_surface: "IDCompositionVirtualSurface::Resize(64, 64), Resize(0, 0) and Trim(NULL, 0): S_OK"
  surface_factory: "CreateSurfaceFactory(ID3D11Device) S_OK, its CreateSurface(16,16,B8G8R8A8,PREMULTIPLIED) S_OK; IDXGIDevice as renderingDevice S_OK; NULL E_INVALIDARG"
errors:
  argument: "E_INVALIDARG (0x80070057)"
  not_drawing: "DCOMPOSITION_ERROR_SURFACE_NOT_BEING_RENDERED (0x88980802)"
  device_removed: "DXGI_ERROR_DEVICE_REMOVED (0x887A0005)"
  memory: "E_OUTOFMEMORY (0x8007000E)"
side_effects: "Commit publishes the pending changes of the device"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  timing (the test prints no durations); what WaitForCommitCompletion does with a visible target; GetFrameStatistics values (machine and session dependent); CheckDeviceState with a removed rendering device (a WARP device cannot be removed on demand); IDCompositionSurface::SuspendDraw, ResumeDraw and Scroll.
