# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/dcomp.dll/IDCompositionVisual.AddVisual.yaml
id: windows/api/dcomp.dll/IDCompositionVisual.AddVisual
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "DCompositionCreateDevice function (dcomp.h)", "DCompositionCreateDevice2 function (dcomp.h)", "DCompositionCreateDevice3 function (dcomp.h)", "IDCompositionDevice interface", "IDCompositionDevice2 interface", "IDCompositionDesktopDevice interface", "IDCompositionVisual interface", "IDCompositionTarget interface", "IDXGIFactory2::CreateSwapChainForComposition", "IDCompositionVisual::AddVisual", "IDCompositionVisual::RemoveVisual", "IDCompositionVisual::RemoveAllVisuals"; dcomp.h, dcomptypes.h, dxgi1_2.h, dxgi1_3.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Adds a child to a visual (above or below a reference child) and the related RemoveVisual/RemoveAllVisuals, with the property setters of visuals covered by the pointer sheets of this entry. Observed: the parent rule (one parent only), the reference-visual rule, that other-device children and cycles are accepted, that visuals have no getters, and the reversed vtable order of overloaded methods. Observed by the tests dcvis_props (values and enums), dcvis_tree (children) and dcvis_dead (after the device is gone) of the entry IDCompositionVisual.AddVisual. There is no getter for any of these properties: only HRESULTs are observable.
interface:
  signature: "HRESULT IDCompositionVisual::AddVisual(IDCompositionVisual* visual, BOOL insertAbove, IDCompositionVisual* referenceVisual) (slot 16); RemoveVisual(IDCompositionVisual*) slot 17; RemoveAllVisuals() slot 18"
  constants: "see rule vtable_order for the slots of the overloaded methods; DCOMPOSITION_* enums are in dcomptypes.h"
chrome:
  calls: "Chrome's GPU process (DirectComposition path, assumed from its documented design; the tracer only sees the exports) makes a D3D11 device, takes its IDXGIDevice, calls DCompositionCreateDevice3 (or 2) and asks for IDCompositionDesktopDevice, creates a target for the browser window's HWND with topmost TRUE, a root visual and one visual per overlay layer, sets a flip swap chain made by CreateSwapChainForComposition as the content of a visual, calls Commit after each change and uses WaitForCommitCompletion / GetFrameStatistics for frame pacing."
rules:
  add_visual: "AddVisual(child, insertAbove, referenceVisual) (slot 16): S_OK for a child without a parent, with insertAbove TRUE (1), FALSE (0) or 2 (any non-zero is TRUE) and a NULL reference; the child's reference count does not change; a NULL child: E_INVALIDARG"
  add_twice: "a child that already has a parent gives E_INVALIDARG: the same visual again on the same parent (above or below), on a second parent; after RemoveVisual from the first parent (S_OK) it can be added to a second one; a child can be the child of one parent only"
  reference_visual: "referenceVisual must be a child of the parent: a child of the parent S_OK (insertAbove TRUE and FALSE); the child being added itself, a visual that is not a child, the parent itself, a child of another parent and a visual of another device: E_INVALIDARG"
  other_device: "AddVisual accepts a child, and a parent, that belong to another DirectComposition device (S_OK for both), and mixing a v1 device's visual with a desktop device's visual (S_OK both ways); only the reference visual is checked against the parent's children"
  cycles: "cycles are NOT checked: adding a visual to itself S_OK; closing a loop x-y-z-x with a visual that has no parent S_OK; Commit with such a cycle S_OK, WaitForCommitCompletion S_OK. What is checked is the parent: a visual that already has a parent (also in a cycle) cannot be added again (E_INVALIDARG); RemoveVisual(itself) of the self-cycle S_OK, after which the visual can be added elsewhere"
  remove_visual: "RemoveVisual(child) (slot 17): S_OK for a child; E_INVALIDARG for a visual that is not a child of this parent (a grandchild, the visual itself, a visual removed before, one removed from the first parent again) and for NULL"
  remove_all: "RemoveAllVisuals (slot 18): S_OK on a parent with children, on a visual without children and on a fresh visual; the children are free afterwards (they can be added to another parent)"
  long_chain: "a chain of 64 visuals, each the child of the previous one: 63 of 63 AddVisual S_OK, Commit S_OK; closing the chain into a loop S_OK; releasing the parent's last test reference does not stop the child being added elsewhere (S_OK)"
  vtable_order: "The methods that dcomp.h declares twice (a value overload and an IDCompositionAnimation overload; a matrix and an object overload; a rectangle and an object overload) occupy TWO consecutive vtable slots in this order: the overload declared SECOND in the header (the animation or the object one) comes FIRST, the one declared first (the plain float, the matrix, the rectangle) comes second. So IDCompositionVisual: slot 3 SetOffsetX(animation), 4 SetOffsetX(float), 5 SetOffsetY(animation), 6 SetOffsetY(float), 7 SetTransform(IDCompositionTransform*), 8 SetTransform(const D2D_MATRIX_3X2_F&), 9 SetTransformParent, 10 SetEffect, 11 SetBitmapInterpolationMode, 12 SetBorderMode, 13 SetClip(IDCompositionClip*), 14 SetClip(const D2D_RECT_F&), 15 SetContent, 16 AddVisual, 17 RemoveVisual, 18 RemoveAllVisuals, 19 SetCompositeMode; IDCompositionVisual2 adds 20 SetOpacityMode and 21 SetBackFaceVisibility; IDCompositionVisual3 (through IDCompositionVisualDebug 22..25: EnableHeatMap, DisableHeatMap, EnableRedrawRegions, DisableRedrawRegions) adds 26 SetDepthMode, 27 SetOffsetZ(animation), 28 SetOffsetZ(float), 29 SetOpacity(animation), 30 SetOpacity(float), 31 SetTransform(IDCompositionTransform3D*), 32 SetTransform(const D2D_MATRIX_4X4_F&), 33 SetVisible. The same reversed order holds in IDCompositionRectangleClip, the transforms and IDCompositionMatrixTransform (3 SetMatrix, 4 SetMatrixElement(row, column, animation), 5 SetMatrixElement(row, column, float)). Observed by calling every slot with a float in xmm1 and a NULL pointer in rdx and reading the HRESULT: the animation slot gives E_INVALIDARG for NULL, the float slot S_OK (test dcvis_slots). An implementer who lays the vtable out in header order breaks every caller."
  props_see_pointer_sheets: "the setters are described in the sheets IDCompositionVisual.SetOffsetX, SetOffsetY, SetTransform, SetClip, SetOpacity, SetBitmapInterpolationMode, SetBorderMode, SetCompositeMode, SetEffect and SetOpacityMode"
errors:
  argument: "E_INVALIDARG (0x80070057)"
side_effects: "changes the tree at the next Commit"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  the order of siblings (no getter; the order only shows in rendering), real animations, IDCompositionVisualDebug, the effect of any property on pixels (the tests never show a window).
