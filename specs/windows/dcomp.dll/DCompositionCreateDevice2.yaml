# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/dcomp.dll/DCompositionCreateDevice2.yaml
id: windows/api/dcomp.dll/DCompositionCreateDevice2
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "DCompositionCreateDevice function (dcomp.h)", "DCompositionCreateDevice2 function (dcomp.h)", "DCompositionCreateDevice3 function (dcomp.h)", "IDCompositionDevice interface", "IDCompositionDevice2 interface", "IDCompositionDesktopDevice interface", "IDCompositionVisual interface", "IDCompositionTarget interface", "IDXGIFactory2::CreateSwapChainForComposition"; dcomp.h, dcomptypes.h, dxgi1_2.h, dxgi1_3.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  The second-generation export (windows 8.1). Tests: the file dcdev_ifaces and dcdev_args of DCompositionCreateDevice. Creates a DirectComposition device on top of a Direct3D 11 device. Observed with WARP devices: see the rules for the interface ids each export accepts, the interfaces and pointer identities of the created object, the NULL and wrong rendering-device cases and the reference counts. Chrome needs the version 3 / desktop device to put its window content (a flip swap chain) into a visual tree bound to the browser window.
interface:
  signature: "HRESULT DCompositionCreateDevice2(IUnknown* renderingDevice, REFIID iid, void** dcompositionDevice)"
  constants: "IDs: IDCompositionDevice C37EA93A-E7AA-450D-B16F-9746CB0407F3, IDCompositionDevice2 75F6468D-1B8E-447C-9BC6-75FEA80B5B25, IDCompositionDesktopDevice 5F4633FE-1E08-4CB8-8C75-CE24333F5602, IDCompositionDevice3 0987CB06-F916-48BF-8D35-CE7641781BD9 (dcomp.h). The functions are exported by dcomp.dll."
chrome:
  calls: "Chrome's GPU process (DirectComposition path, assumed from its documented design; the tracer only sees the exports) makes a D3D11 device, takes its IDXGIDevice, calls DCompositionCreateDevice3 (or 2) and asks for IDCompositionDesktopDevice, creates a target for the browser window's HWND with topmost TRUE, a root visual and one visual per overlay layer, sets a flip swap chain made by CreateSwapChainForComposition as the content of a visual, calls Commit after each change and uses WaitForCommitCompletion / GetFrameStatistics for frame pacing."
rules:
  outputs: "the object comes back through the third argument; a NULL output pointer gives E_INVALIDARG (0x80070057) in all three exports, with a device or with NULL (test dcnull_outputs of IDCompositionDevice.CreateVisual). On failure the output is NULL."
  object_v1: "the object of DCompositionCreateDevice answers QueryInterface for IDCompositionDevice (same pointer) and IUnknown (same pointer as the IDCompositionDevice one); E_NOINTERFACE for IDCompositionDevice2, 3, 4, 5, DesktopDevice, DeviceDebug, IDCompositionVisual, IDXGIDevice, ID3D11Device and made-up ids"
  object_v2: "the object made with IDCompositionDesktopDevice answers IDCompositionDevice2 and IDCompositionDesktopDevice with the SAME pointer (the pointer returned), IDCompositionDevice, IDCompositionDeviceDebug and IUnknown with three DIFFERENT pointers; not IDCompositionDevice3/4/5, IDXGIDevice, ID3D11Device, IDCompositionVisual. A v2 object made with IDCompositionDevice answers the same set (Device2, DesktopDevice, DeviceDebug: S_OK; Device3/4/5: E_NOINTERFACE) and IDCompositionDevice and IUnknown are its own pointer"
  object_v3: "the object of DCompositionCreateDevice3 answers IDCompositionDevice, IDCompositionDeviceDebug, IUnknown (each its own pointer), IDCompositionDevice2 and IDCompositionDesktopDevice (one shared pointer: the one returned when DesktopDevice is asked for) and IDCompositionDevice3, IDCompositionDevice4, IDCompositionDevice5 (one shared pointer, different from the desktop one: the one returned when Device4 is asked for); never IDXGIDevice, ID3D11Device, IDCompositionVisual or made-up ids"
  identity: "QueryInterface for the same interface twice gives the same pointer; IUnknown twice gives the same pointer; two devices made from one IDXGIDevice are two different objects with different IUnknown pointers"
  refcount: "a fresh device has reference count 1; every QueryInterface result adds 1 to ONE count shared by all interfaces of the object (4 queries: 5, releasing them: 1)"
  null_device: "the rendering-device argument may be NULL in all three exports: S_OK (for the ids above); such a device works: Commit S_OK, CreateVisual S_OK (an object that was made without a rendering device is a software-only composition device)"
  device_argument: "the device argument is asked for IDXGIDevice (QueryInterface): the IDXGIDevice pointer, the ID3D11Device pointer, its IUnknown pointer and its ID3D11Multithread pointer are all accepted by all three exports (S_OK, also by the v1 export); the immediate context, an IDXGIAdapter, an IDXGIFactory2 and a 2D texture give E_NOINTERFACE (0x80004002) from all three"
  rendering_device_lifetime: "creation adds references to the rendering device (the IDXGIDevice and the ID3D11Device share one count here: the count grows, a second device adds the same amount again, releasing a device removes exactly its amount: back to the count before). The DirectComposition device keeps working after the test released every reference it had to the D3D11 device, the IDXGIDevice and the immediate context (Commit S_OK, CreateVisual S_OK)"
  d3d_flags: "the D3D11 device's flags do not matter: a WARP device made with no flags, with D3D11_CREATE_DEVICE_SINGLETHREADED or with BGRA_SUPPORT gives S_OK (a WARP device with VIDEO_SUPPORT cannot be made: DXGI_ERROR_UNSUPPORTED from D3D11CreateDevice)"
  threads: "creation and Commit in a thread of its own without a message loop: S_OK and S_OK; a device made on one thread can be used (Commit S_OK) on another"
  ids_v2: "DCompositionCreateDevice2: IID_IDCompositionDevice and IID_IDCompositionDesktopDevice work (S_OK). IDCompositionDevice2 (the base of the desktop device), IDCompositionDevice3, IDCompositionDevice4, IDCompositionDevice5, IDCompositionDeviceDebug, IUnknown, IDXGIDevice and a made-up IID give E_NOINTERFACE"
  ids_all: "DCompositionCreateDevice (v1): only IID_IDCompositionDevice works (S_OK). IDCompositionDevice2, IDCompositionDevice3, IDCompositionDesktopDevice, IDCompositionDevice4, IDCompositionDevice5, IDCompositionDeviceDebug, IUnknown, IDXGIDevice and a made-up IID all give E_NOINTERFACE (0x80004002) with a NULL output | DCompositionCreateDevice2: IID_IDCompositionDevice and IID_IDCompositionDesktopDevice work (S_OK). IDCompositionDevice2 (the base of the desktop device), IDCompositionDevice3, IDCompositionDevice4, IDCompositionDevice5, IDCompositionDeviceDebug, IUnknown, IDXGIDevice and a made-up IID give E_NOINTERFACE | DCompositionCreateDevice3: IID_IDCompositionDevice, IID_IDCompositionDesktopDevice and IID_IDCompositionDevice4 work (S_OK). IDCompositionDevice2, IDCompositionDevice3, IDCompositionDevice5, IDCompositionDeviceDebug, IUnknown, IDXGIDevice and a made-up IID give E_NOINTERFACE. (So the creation functions accept only these ids even though the objects answer more through QueryInterface.)"
errors:
  argument: "E_INVALIDARG (0x80070057) for bad arguments and NULL output pointers"
  no_interface: "E_NOINTERFACE (0x80004002)"
side_effects: "creates a composition device object that keeps references to the rendering device"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 0
  held_out: 0
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  hardware adapters (the tests use WARP devices so the results do not depend on the GPU), ID2D1Device as the rendering device (no Direct2D in the kit), devices that are removed (device-removed handling), DCompositionCreateDevice from an MTA/STA specific COM apartment, creation under memory pressure.
