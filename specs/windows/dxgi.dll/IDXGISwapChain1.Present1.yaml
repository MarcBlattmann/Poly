id: windows/api/dxgi.dll/IDXGISwapChain1.Present1
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "IDXGISwapChain1::Present1 method (dxgi1_2.h)", "DXGI_PRESENT_PARAMETERS"; dxgi.h, dxgi1_2.h, dxgi1_3.h, dxgi1_4.h, dxgi1_5.h, dxgi1_6.h, dxgitype.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Present with dirty rectangles and a scroll rectangle; Chrome uses it for partial updates. Present1 counts like Present and shares its interval and flag rules. (Observed by the test file(s) present_present1 (entry IDXGISwapChain.Present).)
interface:
  signature: "HRESULT IDXGISwapChain1::Present1(UINT SyncInterval, UINT PresentFlags, const DXGI_PRESENT_PARAMETERS* pPresentParameters)"
  constants: "DXGI_PRESENT_PARAMETERS (32 bytes on x64): DirtyRectsCount UINT, pDirtyRects RECT*, pScrollRect RECT*, pScrollOffset POINT*"
rules:
  same_as_present: "empty parameters (count 0, all pointers NULL): S_OK on every effect; interval 5: DXGI_ERROR_INVALID_CALL; TEST: S_OK; ALLOW_TEARING without the swap chain flag: DXGI_ERROR_INVALID_CALL; a Present after Present1 is S_OK"
  dirty_discard: "DISCARD and FLIP_DISCARD: any non-empty dirty rectangle list (whole buffer, inside, 1x1, two rectangles, 40 rectangles) gives DXGI_ERROR_INVALID_CALL; SEQUENTIAL and FLIP_SEQUENTIAL: S_OK"
  dirty_rects: "SEQUENTIAL and FLIP_SEQUENTIAL: rectangles that are empty (left == right), outside the buffer (right edge, negative left/top, far outside) or reversed (left > right): DXGI_ERROR_INVALID_CALL; a list of 2 rectangles with the TEST flag: INVALID_CALL (TEST is not allowed with dirty rectangles); 40 rectangles: S_OK"
  count_zero: "DirtyRectsCount 0 with a non-NULL pDirtyRects: S_OK on every effect; a scroll offset without a scroll rectangle: S_OK on every effect"
  scroll: "DISCARD, SEQUENTIAL, FLIP_DISCARD: every scroll rectangle tried (with offset (4,4), without offset, with offset (0,0), larger than the buffer, with an offset beyond the buffer, together with a dirty rectangle) gives DXGI_ERROR_INVALID_CALL; FLIP_SEQUENTIAL: a scroll rectangle with a NULL offset and with offset (0,0) give S_OK, with offset (4,4), larger than the buffer, with offset beyond the buffer or together with dirty rectangles: INVALID_CALL"
errors:
  invalid_call: "DXGI_ERROR_INVALID_CALL (0x887A0001)"
  not_found: "DXGI_ERROR_NOT_FOUND (0x887A0002)"
  no_interface: "E_NOINTERFACE (0x80004002)"
  invalid_arg: "E_INVALIDARG (0x80070057)"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 0
  held_out: 0
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  NULL pPresentParameters and a non-zero DirtyRectsCount with a NULL array crash the process on the oracle's Windows (an access violation); do not rely on any result for them.
