# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/dxgi.dll/IDXGIFactory2.CreateSwapChainForHwnd.yaml
id: windows/api/dxgi.dll/IDXGIFactory2.CreateSwapChainForHwnd
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware with an Intel UHD Graphics 630, driver 31.0.101.2135, as its hardware display adapter; a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive in the desktop session of the local account \"server\" (session 1, 1920x1080 at 96 DPI, unlocked; member of Administrators, elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s5
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed on the owner's PC and homeserver2 with Chrome for Testing 157.0.8103.38 (stage S5, default GPU flags) through the API tracer's counts (specs/windows/apps/chrome/traces/s5*.trace.json: D3D11CreateDevice, CreateDXGIFactory1, DCompositionCreateDevice are called through exports; the interfaces' methods are not seen by the tracer) and through DevTools' SystemInfo.getInfo (which adapters Chrome sees, which features are enabled). Microsoft Learn: "IDXGIFactory2::CreateSwapChainForHwnd method (dxgi1_2.h)", "DXGI_SWAP_CHAIN_DESC1", "DXGI_SWAP_CHAIN_FULLSCREEN_DESC", "DXGI_SWAP_EFFECT", "DXGI_SWAP_CHAIN_FLAG", "DXGI_SCALING", "DXGI_ALPHA_MODE", "DXGI_USAGE", "IDXGISwapChain1::GetDesc1", "IDXGISwapChain1::GetFullscreenDesc", "DXGI model of presentation (flip model)"; dxgi.h, dxgi1_2.h, dxgi1_3.h, dxgi1_4.h, dxgi1_5.h, dxgi1_6.h, dxgitype.h, dxgiformat.h and winerror.h for constants, layouts and the order of the methods in the vtables. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Creates a swap chain that presents into a window. Chrome (through ANGLE, when DirectComposition is not used for the surface) creates the swap chain of a window with B8G8R8A8_UNORM, FLIP_DISCARD or FLIP_SEQUENTIAL (or DISCARD when flip is unavailable), 2 or 3 buffers and often the FRAME_LATENCY_WAITABLE_OBJECT flag (assumed from ANGLE's documented behaviour). Tested on a WARP D3D11 device with a plain overlapped window that is never shown. Observed: the result is S_OK with reference count 1, one more reference on the device (released with the swap chain); GetDesc1 returns the description as passed, except that Width and Height are replaced by the window's client size whenever EITHER of them is 0 (width 0 with height 100 gives the client size, not 100). The effect, format, buffer count, scaling, alpha, samples, stereo, usage and flag rules are in the rules below; invalid combinations give DXGI_ERROR_INVALID_CALL (0x887A0001) or E_INVALIDARG (0x80070057) as listed. Only one flip-model swap chain can exist on a window at a time (E_ACCESSDENIED).
interface:
  signature: "HRESULT IDXGIFactory2::CreateSwapChainForHwnd(IUnknown* pDevice, HWND hWnd, const DXGI_SWAP_CHAIN_DESC1* pDesc, const DXGI_SWAP_CHAIN_FULLSCREEN_DESC* pFullscreenDesc, IDXGIOutput* pRestrictToOutput, IDXGISwapChain1** ppSwapChain)"
  constants: "DXGI_SWAP_CHAIN_DESC1 (48 bytes): Width, Height, Format, Stereo BOOL, SampleDesc{Count, Quality}, BufferUsage, BufferCount, Scaling, SwapEffect, AlphaMode, Flags. DXGI_SWAP_EFFECT DISCARD 0, SEQUENTIAL 1, FLIP_SEQUENTIAL 3, FLIP_DISCARD 4. DXGI_SCALING STRETCH 0, NONE 1, ASPECT_RATIO_STRETCH 2. DXGI_ALPHA_MODE UNSPECIFIED 0, PREMULTIPLIED 1, STRAIGHT 2, IGNORE 3. DXGI_USAGE SHADER_INPUT 0x10, RENDER_TARGET_OUTPUT 0x20, BACK_BUFFER 0x40, SHARED 0x80, READ_ONLY 0x100, UNORDERED_ACCESS 0x200. DXGI_SWAP_CHAIN_FLAG NONPREROTATED 1, ALLOW_MODE_SWITCH 2, GDI_COMPATIBLE 4, RESTRICTED_CONTENT 8, RESTRICT_SHARED_RESOURCE_DRIVER 0x10, DISPLAY_ONLY 0x20, FRAME_LATENCY_WAITABLE_OBJECT 0x40, FOREGROUND_LAYER 0x80, FULLSCREEN_VIDEO 0x100, YUV_VIDEO 0x200, HW_PROTECTED 0x400, ALLOW_TEARING 0x800, RESTRICTED_TO_ALL_HOLOGRAPHIC_DISPLAYS 0x1000 (dxgi.h, dxgi1_2.h, dxgi1_5.h)"
chrome:
  calls: "ANGLE (libGLESv2.dll) creates the window swap chain on the D3D11 device through IDXGIFactory2::CreateSwapChainForHwnd when DirectComposition is not used (assumed from ANGLE's documented behaviour; the tracer does not see calls through COM pointers)"
rules:
  result: "valid arguments (ID3D11Device of a WARP device, a plain window, B8G8R8A8_UNORM, 2 buffers, FLIP_DISCARD): S_OK, *ppSwapChain set, reference count 1, the device's reference count rises by 1 and falls again when the swap chain is released"
  size: "Width and Height both 0: the client size of the window; either 0 (0x100, 100x0): both are taken from the window (the non-zero one is ignored); 1x1, 64x32, 640x480, 4096x4096, 16384x1, 1x16384 and also 16385x1 and 1x16385: S_OK with the requested size; 0xFFFFFFFF x 1 and 1 x 0xFFFFFFFF: E_INVALIDARG (0x80070057) for DISCARD and FLIP_DISCARD"
  format_discard: "DISCARD (1 buffer): S_OK for R16G16B16A16_FLOAT (10), R10G10B10A2_UNORM (24), R8G8B8A8_UNORM (28), R8G8B8A8_UNORM_SRGB (29), B8G8R8A8_UNORM (87), R10G10B10_XR_BIAS_A2_UNORM (89), B8G8R8A8_UNORM_SRGB (91); E_INVALIDARG for UNKNOWN (0), R32G32B32A32_FLOAT (2), R16G16B16A16_UNORM (11), R8G8B8A8_TYPELESS (27), R16G16_UNORM (35), D32_FLOAT (40), R32_FLOAT (41), R8G8_UNORM (49), R8_UNORM (61), A8_UNORM (65), BC1_UNORM (71), B5G6R5_UNORM (85), B5G5R5A1_UNORM (86), B8G8R8X8_UNORM (88), B8G8R8X8_UNORM_SRGB (93), NV12 (103), P010 (104), YUY2 (107)"
  format_flip: "FLIP_DISCARD (2 buffers): S_OK only for R16G16B16A16_FLOAT, R10G10B10A2_UNORM, R8G8B8A8_UNORM and B8G8R8A8_UNORM; every other format in the list above, including the SRGB formats, R10G10B10_XR_BIAS_A2_UNORM, B8G8R8X8_UNORM, NV12, P010, YUY2: DXGI_ERROR_INVALID_CALL. SEQUENTIAL and FLIP_SEQUENTIAL (2 buffers) accept B8G8R8A8_UNORM, R8G8B8A8_UNORM and R16G16B16A16_FLOAT (others were not tried)"
  format_readback: "GetDesc1 returns the Format that was passed"
  effects: "SwapEffect 0 (DISCARD), 1 (SEQUENTIAL), 3 (FLIP_SEQUENTIAL), 4 (FLIP_DISCARD): S_OK with buffers 2; 2, 5, 6, 0xFFFFFFFF: DXGI_ERROR_INVALID_CALL; GetDesc1 returns the effect as passed"
  buffer_count: "DISCARD and SEQUENTIAL: 1 .. 16 give S_OK, 0, 17, 100 and 0xFFFFFFFF give DXGI_ERROR_INVALID_CALL; FLIP_SEQUENTIAL and FLIP_DISCARD: 2 .. 16 give S_OK, 0, 1, 17, 100, 0xFFFFFFFF give DXGI_ERROR_INVALID_CALL; GetDesc1 returns the count as passed"
  scaling: "DISCARD: STRETCH (0) S_OK, NONE (1), ASPECT_RATIO_STRETCH (2), 3 and 0xFFFFFFFF: DXGI_ERROR_INVALID_CALL; FLIP_DISCARD: STRETCH and NONE S_OK, 2, 3 and 0xFFFFFFFF INVALID_CALL; read back as passed"
  alpha: "UNSPECIFIED (0) and IGNORE (3): S_OK; PREMULTIPLIED (1), STRAIGHT (2), 4 and 0xFFFFFFFF: DXGI_ERROR_INVALID_CALL (a window swap chain does not support transparency); read back as passed"
  samples: "DISCARD: Count 1 Quality 0 S_OK and also Count 2, 4, 8, 16 Quality 0 (read back as passed); Count 0, Count 3, Quality 1: E_INVALIDARG; FLIP_DISCARD: only 1/0 works, every other value (also 0/0) gives DXGI_ERROR_INVALID_CALL"
  stereo: "Stereo TRUE: FLIP_DISCARD S_OK (read back Stereo 1, the buffer texture has ArraySize 2); DISCARD: DXGI_ERROR_INVALID_CALL"
  usage: "DISCARD accepts 0, RENDER_TARGET_OUTPUT (0x20), SHADER_INPUT (0x10), 0x30, 0x60, 0xA0 (SHARED), 0x120 (READ_ONLY), 0x220 (UNORDERED_ACCESS), 0x2020 (DISCARD_ON_PRESENT) and returns them unchanged; 0xFFFFFFFF: E_INVALIDARG; FLIP_DISCARD accepts 0, 0x10, 0x20, 0x30, 0x60; 0xA0, 0x120, 0x220, 0x2020 and 0xFFFFFFFF give DXGI_ERROR_INVALID_CALL"
  flags_discard: "DISCARD (1 buffer): S_OK (flags read back unchanged) for ALLOW_MODE_SWITCH (2), GDI_COMPATIBLE (4), RESTRICTED_CONTENT (8), RESTRICT_SHARED_RESOURCE_DRIVER (0x10), DISPLAY_ONLY (0x20), RESTRICTED_TO_ALL_HOLOGRAPHIC_DISPLAYS (0x1000) and the undefined bit 0x2000; DXGI_ERROR_INVALID_CALL for NONPREROTATED (1), FRAME_LATENCY_WAITABLE_OBJECT (0x40), FOREGROUND_LAYER (0x80), FULLSCREEN_VIDEO (0x100), YUV_VIDEO (0x200), HW_PROTECTED (0x400), ALLOW_TEARING (0x800), 0x80000000 and the combinations with 0x40 or 0x800"
  flags_flip: "FLIP_DISCARD and FLIP_SEQUENTIAL (2 buffers): the same as DISCARD except that FRAME_LATENCY_WAITABLE_OBJECT (0x40), ALLOW_TEARING (0x800) and their combinations, also with ALLOW_MODE_SWITCH, are S_OK, and RESTRICT_SHARED_RESOURCE_DRIVER (0x10) gives E_INVALIDARG; SEQUENTIAL (2 buffers) behaves like DISCARD for flags (0x40 and 0x800 give DXGI_ERROR_INVALID_CALL, 0x10 is S_OK)"
  legacy_get_desc: "GetDesc1 of a swap chain made here keeps AlphaMode as passed (UNSPECIFIED stays 0); GetFullscreenDesc with a NULL fullscreen description: S_OK, Windowed TRUE, RefreshRate 0/1, ScanlineOrdering 0, Scaling 0"
  device_argument: "pDevice = the ID3D11Device (S_OK) or its IDXGIDevice (S_OK); an ID3D11DeviceContext, an IDXGIAdapter, an IDXGIFactory: DXGI_ERROR_INVALID_CALL; NULL: DXGI_ERROR_INVALID_CALL (no crash). A factory from CreateDXGIFactory1 (a different factory than the device's adapter's) with the WARP device: S_OK"
  device_back: "IDXGIDeviceSubObject::GetDevice(IID_ID3D11Device) returns the device that was passed (same pointer, one more reference); GetDevice(IID_IDXGIDevice) returns the device's IDXGIDevice (same pointer); GetDevice(IID_ID3D11DeviceContext): E_NOINTERFACE; GetParent(IID_IDXGIFactory2) returns the factory that created it (same pointer); GetParent(IID_IDXGIAdapter): E_NOINTERFACE"
  interfaces: "the swap chain answers QueryInterface for IUnknown, IDXGIObject, IDXGIDeviceSubObject, IDXGISwapChain, IDXGISwapChain1, IDXGISwapChain2, IDXGISwapChain3, IDXGISwapChain4 with the same pointer (IUnknown is stable) and IDXGISwapChainMedia with a different pointer; IDXGIDecodeSwapChain, IDXGIFactory, IDXGISurface, IDXGIResource, ID3D11Device and made-up ids: E_NOINTERFACE"
  second_swap_chain: "while a flip-model swap chain (FLIP_DISCARD, 2 buffers) exists on a window, a second flip-model swap chain on the same window, from the same device or another WARP device, gives E_ACCESSDENIED (0x80070005); a DISCARD swap chain on the same window while the flip chain lives gives S_OK; after the only reference of the first swap chain is released (the release returns 0) a new swap chain on the window is S_OK"
  windows: "a destroyed window, a NULL window and a made-up handle: DXGI_ERROR_INVALID_CALL; the desktop window: E_ACCESSDENIED (0x80070005); a popup, a WS_EX_NOREDIRECTIONBITMAP, a layered and a child window all give S_OK with the size of their client area"
  fullscreen_desc: "pFullscreenDesc with Windowed TRUE: S_OK for refresh 0/0 and 60/1, also with an invalid ScanlineOrdering 9 or Scaling 9; GetFullscreenDesc returns it unchanged (Windowed 1, refresh, ordering, scaling as passed); with Windowed FALSE on a window that was never shown: S_OK-class result 0x087A0001 (DXGI_STATUS_OCCLUDED) with a swap chain, and GetFullscreenDesc then reports Windowed 1"
  required_arguments: "NULL pDesc: DXGI_ERROR_INVALID_CALL (no crash); pRestrictToOutput was left NULL in all tests"
errors:
  invalid_call: "DXGI_ERROR_INVALID_CALL (0x887A0001)"
  not_found: "DXGI_ERROR_NOT_FOUND (0x887A0002)"
  no_interface: "E_NOINTERFACE (0x80004002)"
  invalid_arg: "E_INVALIDARG (0x80070057)"
side_effects: "creates a swap chain bound to the window; a flip-model swap chain redirects the window's content (not visible in the tests: windows are never shown)"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 3
building_tests: >
  Rust tests (ADR 0075), one file per test, each assembled from the kit's shared declarations (Learn prototypes, SDK header constants and vtable orders; the COM objects are called through their vtables). Every test makes the same calls in three files that each write every third observation (SAY_PART), so the visible and held-out tests of an entry are different views of one run. Observations are HRESULTs, flags, counts, sizes, pixel values of the test's own rendering read back through staging textures and Map, and booleans; never pointers, handles, LUIDs, times, or the machine's own adapter names and driver versions (machine-dependent values are described as rules and printed only as relations). Devices are made with D3D_DRIVER_TYPE_WARP (Microsoft Basic Render Driver, a software device that every Windows 10 and 11 machine has), so the results do not depend on the oracle's GPU, except in the tests of the default hardware adapter, which print relations only. Tests run in the interactive desktop session of the oracle (DirectComposition and window swap chains need one: in the SSH session 0 DCompositionCreateDevice fails with E_ACCESSDENIED); windows are created but never shown or pumped. No Microsoft font is used and no pixel is compared that the test did not draw itself.
not_covered: >
  a pixel format value outside the list (999 with DISCARD crashes the process on the oracle's Windows: do not rely on it), NULL ppSwapChain, a non-NULL pRestrictToOutput, a real fullscreen switch, a window of another thread or process, multi-adapter setups.
