# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/winmm.dll/waveOutReset.yaml
id: windows/api/winmm.dll/waveOutReset
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer) with one real sound card, tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; the audio service runs and winmm reaches the card from there), only silence is played; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-waveout
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, which has one real sound card (played with buffers of silence only). Microsoft Learn: "waveOutOpen function", "waveOutClose", "waveOutPrepareHeader", "waveOutUnprepareHeader", "waveOutWrite", "waveOutPause", "waveOutRestart", "waveOutReset", "waveOutBreakLoop", "waveOutGetPosition", "waveOutGetVolume", "waveOutSetVolume", "waveOutGetDevCaps", "waveOutGetNumDevs", "waveOutGetID", "waveOutGetErrorText", "waveOutMessage", "WAVEHDR", "WAVEFORMATEX", "WAVEFORMATEXTENSIBLE", "WAVEOUTCAPS", "MMTIME", "waveOutProc callback function", "Multimedia Error Codes"; constants and layouts from mmsystem.h, mmeapi.h, mmreg.h and ksmedia.h. The import names of Chrome's chrome.dll come from the survey in docs/windows/audio-plan.md. No Wine, ReactOS or Chromium source was read and no Microsoft binary was disassembled.
summary: >
  Stops playing, gives every queued buffer back and sets the position to 0. The handle stays open and usable (and not paused).
interface:
  signature: "MMRESULT waveOutReset(HWAVEOUT handle)"
chrome: "Chrome for Windows (157) imports it statically from winmm.dll (survey, docs/windows/audio-plan.md): Chrome falls back to the waveOut API when WASAPI is not available."
rules:
  buffers: "before it returns every queued buffer is done: WHDR_DONE set, WHDR_INQUEUE cleared (flags DONE|PREPARED), and its WOM_DONE has been notified (three buffers: three WOM_DONE, in the order written, already counted when the call returns; nothing more arrives later). They can be unprepared at once, or written again"
  position: "the position is 0 afterwards (also after a normal play: reset after 4800 bytes played sets it back to 0)"
  idle: "on an idle handle it succeeds, also repeatedly; it does not change a header that was finished earlier"
  paused: "also ends a pause: after a reset, with no restart, a new buffer plays to its end; buffers held while paused are given back (DONE|PREPARED)"
  reuse: "after a reset the same header (still prepared) can be written again; the position counts from 0 (19200 after a full 19200 byte play)"
  event: "a CALLBACK_EVENT event is set by the reset"
errors:
  invalid_handle: "MMSYSERR_INVALHANDLE (5) for 0, a made-up value and a closed handle"
side_effects: "WOM_DONE is notified for every queued buffer; the position restarts at 0"
threading: "may be called from any thread"
ordering: ["the WOM_DONE callbacks are made before waveOutReset returns, in the order the buffers were written"]
timing:
  typical: "returns within a few milliseconds"
  guarantees: none
tests:
  visible: 3
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file each, importing winmm.dll, kernel32.dll (and user32.dll for the window and thread callback tests) by name, built with the pipeline's usual flags. Every test needs a wave output device: it first checks that waveOutGetNumDevs is at least 1 and fails if not. Audio data is always silence (zero samples; never 8-bit data, whose silence is not zero), so nothing is audible. Observations are return codes, header flags, booleans, counts, orders of callbacks and positions that follow from the bytes written; never handles, thread ids, addresses or times. Waiting is bounded: a buffer of 50 or 100 ms is waited for up to 5 s, and "nothing happens" checks look for 100 to 400 ms. The tests that change the volume restore it; the volume is per process, so a test that fails does not leave it changed. A few tests are the exception: they say "NO SOUND DEVICE" in their first line and must be run with no sound device present; their recording was made with the oracle's sound card disabled (the HD audio function turned off in Device Manager terms, and turned on again after the run); where such a test runs with a device it fails.
not_covered: >
  Machines with no sound device, except for the no-device rules named above; devices other than device 0 and the mapper; how long a buffer takes to start or the latency of any call; capture (waveIn) and MIDI. Calling it from a callback.
