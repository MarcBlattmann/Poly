# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/DrawTextW.yaml
id: windows/api/user32.dll/DrawTextW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64; the tests dt_pf_internal, dt_pf_leading, dt_pf_ellipsis_mix and dt_pf_calc_low of 2026-11-14 on build 26200.9974"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station; text is drawn into memory DCs with 32-bit DIB sections, so no desktop is needed), two runs each with identical output, and two complete recordings with identical output"
  observed_by: spec-win-text, spec-win-misc-2
  date: 2026-11-10
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of the functions named here (CreateFontIndirectW, LOGFONTW, TEXTMETRICW, GetTextExtentPoint32W, ExtTextOutW, DrawText, DrawTextEx, DRAWTEXTPARAMS, AddFontMemResourceEx, AddFontResourceEx, EnumFontFamiliesEx, SetTextAlign); wingdi.h and winuser.h for constants and layouts. Wine's conformance tests were not read for the values here.
summary: >
  Draws or measures formatted text in a rectangle with the DC's font and colours. Returns the height of the text (for DT_VCENTER/DT_BOTTOM single lines the offset from the rectangle's top to the text's bottom).
interface:
  signature: "int DrawTextW(HDC hdc, LPWSTR lpchText, int cchText, LPRECT lprc, UINT format)"
rules:
  calcrect: "DT_CALCRECT draws nothing and sets right/bottom (left and top stay). With PolyTest Tall at -16 (line height 19, average character width 10; dt_calcrect): \"MiBg\" is 34x19, returns 19; a count of 3 gives 24 wide; \"&MiB\" is 24 wide, with DT_NOPREFIX 33, \"A&&B\" 29; a \"\\n\" makes two lines (38) unless DT_SINGLELINE (one line, the line break measured without width); DT_WORDBREAK at width 60 wraps \"AB MiB gi WAM Bg\" into 3 lines (57 high, 60 wide), at 40 into 5 (95), at 1000 not at all; a word longer than the width stays on one line and sets the width (110 from a rectangle 20 wide); a tab without DT_EXPANDTABS has no width, with it the text goes on at the next multiple of 8 average character widths (80); \"\" returns 19 with DT_SINGLELINE and 1 (height 0) without. With PolyTest Sans at -16 (dt_pf_layout): \"AB\" 20x16, returns 16; \"AB\\nAB\" 20x32 (a \\r\\n or a lone \\r also breaks the line); a trailing \\n adds an empty line (\"AB\\n\" 20x32, \"\\n\" 0x32, \"\\n\\n\" 0x48); DT_SINGLELINE measures a line break as zero width (\"AB\\nAB\" 40x16); trailing and leading blanks count (\"AB \" 38 wide); \"&A\" is 12 wide, with DT_NOPREFIX 21; DT_EXPANDTABS: \"A\\tB\" is 72 wide (tabs to multiples of 8 average widths: 64); DT_EXTERNALLEADING adds the external leading (2) to every line (\"AB\" returns 18); word break: \"AAAA BBBB AAAA\" in 60 is 54x48, in 200 is 140x16, a word wider than the rectangle sets the width (48); width 0 returns 1 and leaves the rectangle alone; count 0 returns 1. In a rectangle too low for all the lines DT_CALCRECT still measures every line: \"AB\\nAB\\nAB\" and \"AABBAABBAB\\nAB\\nBBAABBAABA\" in a rectangle 60 wide at 10,10 return 48 and set bottom to 58 for heights of 0, 10, 16, 20, 31, 32, 33 and 50 alike, with no flag and with DT_END_ELLIPSIS, DT_WORD_ELLIPSIS, both, DT_EDITCONTROL and DT_NOCLIP; the width is the widest line (100 for the first line of the second text; 60 with DT_WORD_ELLIPSIS, which cuts it). No line takes over the rest because of the height there: DT_MODIFYSTRING leaves \"AABBAABBAB|AB|BBAAB...\" with DT_END_ELLIPSIS (the text's last line cut) and \"AABB...\" with DT_WORD_ELLIPSIS or both (dt_pf_calc_low)."
  alignment: "PolyTest Sans, \"AB\" (20x16) in the rectangle 10,10,110,50: cells 10,10 / 50,10 / 90,10 for left / centre / right; DT_VCENTER and DT_BOTTOM only act with DT_SINGLELINE (then 10,22 and 10,34, and the return value is the distance from the rectangle's top to the bottom of the text: 28 and 40); every line of multi-line text is aligned on its own; the ink of 'A' is 2 pixels right of the cell's left edge (dt_pf_draw). When the room left over is odd, the offset is rounded down (the text sits half a pixel towards the left or the top)."
  opaque: "in OPAQUE mode the whole text cell gets the background colour"
  clip: "clipped to the rectangle unless DT_NOCLIP (\"AB\" in 10x5: only the part inside is drawn; with DT_NOCLIP the whole 20x16 cell). A rectangle with the same left and right draws nothing without DT_NOCLIP."
  rect: "without DT_CALCRECT the rectangle is not changed; the return value is the text height (32 for two lines); for DT_VCENTER|DT_SINGLELINE 28 and for DT_BOTTOM|DT_SINGLELINE 40 in a 40 high rectangle; an empty string returns 1 (28 with DT_SINGLELINE|DT_VCENTER, the offset of the empty line)."
  wordbreak: "DT_WORDBREAK breaks at blanks; \"AB AB AB\" in 30 wide is three lines; DT_CENTER and DT_RIGHT then align each line; without DT_WORDBREAK the line is clipped at the rectangle; DT_SINGLELINE text wider than the rectangle is centred or right-aligned about the rectangle (the left part is clipped)."
  prefix: "'&' marks the next character: it is removed from the text and that character is underlined; '&&' is one '&'; a trailing '&' is dropped; \"&&&A\" is '&' and an underlined 'A'. The underline is one pixel row at baseline + 1 (the same at -12, -16 and -24 and in the Tall and Mono fonts, whatever the font's own underline metrics say) as wide as the advance of the marked character, drawn by default; DT_NOPREFIX measures and draws the '&' as a character; DT_HIDEPREFIX removes the '&' without the underline; DT_PREFIXONLY draws only the underline (nothing for \"A&&B\"). The measured width ignores the '&' (\"A&B\" is 20 wide). dt_pf_prefix has the rows for PolyTest Sans at -12, -16 and -24, Tall and Mono."
  ellipsis: "DT_END_ELLIPSIS cuts a too-wide line and ends it with \"...\", keeping as many leading characters as fit together with the dots (\"AABBAABBAB\" in 60 becomes \"AABB...\" (52 wide), in 50 \"AAB...\", in 40 \"AA...\", in 30 and below \"A...\" even where that is wider than the rectangle); a line that fits stays as it is; the rectangle is not changed. DT_PATH_ELLIPSIS replaces the middle of a path and keeps the part after the last backslash (\"AAAA\\BBBB\\AAAA\\BBB.AB\" in 100 becomes \"AA...\\BBB.AB\", in 60 and below \"...\\BBB.AB\"; text without a backslash is left alone). DT_WORD_ELLIPSIS cuts a line that is too wide between characters, like DT_END_ELLIPSIS (\"AAAAAAAA BBBB AAAAAAAA\" in 80 becomes \"AAAAA...\"). On text of several lines DT_END_ELLIPSIS and DT_PATH_ELLIPSIS act on the last line only; lines before it that are too wide are just clipped. The last line is the one that holds the end of the text (a line break at the very end does not make a new last line: the line before it is cut), or, sooner, the first line whose bottom edge lies below the rectangle's bottom (top + line height > bottom; with DT_EDITCONTROL the last line that still fits whole). When the height decides, that line takes all the text that is left, its line breaks counting as characters without width, is cut to the width with dots, and nothing is laid out after it: \"AABBAABBAB\\nAB\\nBBAABBAABA\" in 60 wide ends with \"BBAAB...\" on its third line for heights of 32 and more, has the second line \"AB\" + \"BBA...\" for heights of 31 and 16, and is the one line \"AABB...\" in 15; with DT_NOCLIP the height plays no part. The same with DT_WORDBREAK (\"AAAA BBBB AAAA BBBB\" in 60x32: the lines \"AAAA\", \"BBBB\" and, below the visible part, \"AAAA...\"; in 60x31: \"AAAA\" and \"BBBB ...\"; with room for all four lines nothing is cut). DT_WORD_ELLIPSIS cuts every line that is too wide, wherever it stands, and never takes over the text that follows; with DT_WORDBREAK only a word wider than the rectangle makes such a line. DT_WORD_ELLIPSIS together with DT_PATH_ELLIPSIS gives every too-wide line the path form. DT_END_ELLIPSIS together with DT_WORD_ELLIPSIS does both: every too-wide line is cut, as with DT_WORD_ELLIPSIS, and the line that the height makes the last one still takes the text that is left, as with DT_END_ELLIPSIS: \"AABBAABBAB\\nAB\\nBBAABBAABA\" in 60 wide at 10,10 shows in 31 high \"AABB...\" (ink 12 to 61) and \"AB\" + \"BBA...\" (12 to 69), in 32 high \"AABB...\" and \"AB\" with nothing below, from 33 high on all three lines (the third cut to \"BBAAB...\", ink 11 to 69), in 15 and 16 high \"AABB...\" alone (DT_END_ELLIPSIS alone leaves the first line uncut in 16 and 31 high, ink 12 to 70 clipped; DT_WORD_ELLIPSIS alone cuts it and takes nothing over); the call returns 32, 48, 48 and 16, 32. DT_MODIFYSTRING then leaves the text DT_WORD_ELLIPSIS leaves, up to the end of the first cut line (\"AABB...\"). A last line that takes the rest and fits shows the joined lines, the line breaks without width: \"AB\\nAB\\nAB\" in 31 high with DT_END_ELLIPSIS, alone or with DT_WORD_ELLIPSIS, shows \"AB\" and then \"ABAB\" (ink 12 to 49), cuts nothing (DT_MODIFYSTRING leaves the text as it was) and returns 32; with DT_WORD_ELLIPSIS alone it shows \"AB\" and \"AB\"; in 32 high all flags show two lines and return 48, in 33 high three lines. \"AB\\nAB\\n\" in 31 high with DT_END_ELLIPSIS shows \"AB\" and \"AB\" and returns 48 (the empty line after the final break is counted). DT_CALCRECT with an ellipsis flag measures the cut text (44 wide for the 50 case, whose result is 'AAB...') and with DT_MODIFYSTRING also writes it back (dt_pf_ellipsis, dt_pf_ellipsis_lines)."
  modifystring: "DT_MODIFYSTRING writes the shortened text (NUL-terminated) back to the caller's buffer when an ellipsis flag changed it; without it the buffer stays as it was and only the drawing shows the cut text. The buffer must have room for the original length plus four. On several lines the buffer gets the text up to the end of the first line that was shortened, with the NUL after its dots: with DT_END_ELLIPSIS that is the whole text with its last line cut; with DT_WORD_ELLIPSIS the lines after the first cut one are still drawn but not written back."
  misc: "DT_RTLREADING (also with DT_RIGHT and DT_CENTER) and DT_NOFULLWIDTHCHARBREAK do not change the layout of Latin text. DT_INTERNAL does change the line height (see internal)."
  internal: "DT_INTERNAL: the line height is that of the stock system font (GetStockObject(SYSTEM_FONT)), whatever font is selected, and that font has no external leading; the width is still the selected font's. The return value and the height of a DT_CALCRECT rectangle are therefore the plain return value of the same call with the stock system font selected: for \"AB\" in PolyTest Sans at -8, -16 and -32, PolyTest Tall at -16 and -32 and PolyTest Mono at -16 (plain: 8, 16, 32, 19, 38 and 16 high, 10, 20, 40, 20, 40 and 20 wide) the call with DT_INTERNAL returns one and the same value, which is the system font's line height (16 on the oracle), and the width is the plain width; two lines return twice that value; DT_EXTERNALLEADING and DT_EDITCONTROL added to DT_INTERNAL change nothing. The cell that is drawn keeps the selected font's own height (32 high for Sans at -32), the second line starts one system line height below the first, so the cell of two lines is that height plus the font's height. With any other stock font selected (DEFAULT_GUI_FONT, ANSI_VAR_FONT, ANSI_FIXED_FONT, SYSTEM_FIXED_FONT, OEM_FIXED_FONT) DT_INTERNAL gives the same system line height and that font's own width. dt_pf_internal prints these as comparisons, so no Microsoft font metric is a test value; Poly's stock System face must stand in the same relation (its height is Poly's own)."
  relations: "For any font (stock fonts and installed families): a single line's DT_CALCRECT width is the GetTextExtentPoint32W width (within one pixel), its height the text height; two lines are twice that; DT_WORDBREAK lines are never wider than the rectangle (unless a word is) and the height grows as the rectangle narrows; the ellipsis result fits the width and ends in dots; DT_NOPREFIX measures the '&'; drawing stays inside the rectangle (dt_sys_relations)."
  lines: "Lines are laid out from the top, one below the other, as long as the top of the line is not below the rectangle's bottom edge (top <= bottom); the last of them can lie outside the visible part altogether. The return value counts the lines laid out, not the lines of the text: three lines of 16 in a rectangle 31 high return 32, in a rectangle 32 or 33 high 48 (dt_pf_ellipsis_lines). With DT_NOCLIP every line is laid out."
  line_breaks: "A carriage return followed by a line feed, and a line feed followed by a carriage return, are one line break; a carriage return or a line feed on its own is one as well. Pairs are taken from the left: CR LF CR, LF CR LF, CR CR LF, LF LF CR, CR LF LF and LF CR CR are two breaks, CR LF CR LF and LF CR LF CR are two. A break at the very end of the text adds an empty line to the height (also LF CR). With DT_SINGLELINE none of them breaks the line and none has a width (dt_pf_breaks)."
  tabstop: "DT_TABSTOP makes bits 8 to 15 of the format the tab length in average character widths, and nothing else: with DT_TABSTOP those bits are not read as DT_NOCLIP, DT_EXTERNALLEADING, DT_CALCRECT, DT_NOPREFIX, DT_INTERNAL, DT_EDITCONTROL, DT_PATH_ELLIPSIS or DT_END_ELLIPSIS (a length of 4 draws and leaves the rectangle alone, 1 still clips, 2 returns the plain height, 8 still takes the '&' as a prefix, 32 does not hold back a partial line, 64 and 128 add no dots). Flags above bit 15 keep their meaning. DT_TABSTOP alone does not expand tabs: DT_EXPANDTABS is needed as well, and without it a tab is treated as without DT_TABSTOP. With both, a tab moves on to the next multiple of (length x average character width) from the start of the line, always forward (text that ends on a stop goes to the next stop); a length of 0 means 8. PolyTest Sans (average width 8): \"A\\tB\" with the lengths 1, 2, 3, 5, 8, 10, 16 and 20 has the 'B' at 16, 16, 24, 40, 64, 80, 128 and 160; \"AAA\\tB\" (36 wide before the tab) and \"AA\\tB\" (24, on a stop) with 3 have it at 48; \"\\tA\" at 24, \"\\t\\tA\" at 48; every line has its own stops; DT_RIGHT aligns the expanded line (dt_pf_tabstop). DrawTextExW's iTabLength is the other way to give the length."
  editcontrol: "DT_EDITCONTROL (without DT_NOCLIP): after the first line, a line is only laid out if it fits whole into the rectangle's height (top + line height <= bottom), and the return value counts only the lines laid out (two lines of 16 in 31 high: one line, returns 16; in 32 high: both); the first line is always laid out, also in a rectangle lower than a line. With DT_WORDBREAK a word wider than the rectangle is broken between characters, as many to a line as fit and at least one (\"WWWWW\", 16 each, in 40 wide: WW / WW / W; in 48: WWW / WW; in 16 and in 10: one to a line). Such a word first goes to a line of its own (\"B WWWWW\" is B / WW / WW / W), and what follows its last piece goes on behind that piece if it fits (\"WWWWW B\": WW / WW / W B). Without DT_WORDBREAK, and without DT_EDITCONTROL, a word is never broken. DT_CALCRECT measures the broken lines (32x48 for the first case). Its other documented effect, an edit control's average character width, is not covered (dt_pf_editctl)."
  pairs: "Flags given together although they exclude each other: DT_CENTER with DT_RIGHT centres; DT_VCENTER with DT_BOTTOM puts the text at the top, as if neither were given; DT_SINGLELINE with DT_WORDBREAK is a single line; DT_HIDEPREFIX with DT_PREFIXONLY draws the text without the underline; DT_NOPREFIX with either of them draws the '&'. DT_CALCRECT with DT_SINGLELINE and DT_VCENTER or DT_BOTTOM returns what the drawing call returns and sets bottom to top + that value. DT_EXTERNALLEADING puts the leading below each line: one line returns 18, two 36; with DT_SINGLELINE|DT_VCENTER a line of 18 is centred (in a rectangle 32 high the cell starts 7 below its top and the call returns 25), with DT_SINGLELINE|DT_BOTTOM the cell ends 2 above the bottom. Two things take the leading away again: DT_INTERNAL (its line height is the system font's, which has none: with DT_EXTERNALLEADING a line is exactly as high as with DT_INTERNAL alone, in every font), and DT_TABSTOP, whose bits 8 to 15 are the tab length, so that bit 9 (0x200, DT_EXTERNALLEADING's value) is the length 2 and not a flag: DT_EXTERNALLEADING|DT_TABSTOP returns the plain 16 for one line and 32 for two. Every other flag bit together with DT_EXTERNALLEADING keeps the leading (one line 18, two lines 36; with DT_EDITCONTROL only the first line is laid out in 32 high, because the second no longer fits with the leading: 18; with DT_CALCRECT bottom is top + 18). So with every flag but DT_MODIFYSTRING and DT_TABSTOP set (0xFFFEFF7F) the return is 16 because DT_INTERNAL is among them, and it is 18 (22 high with DT_CALCRECT) with DT_INTERNAL taken out as well (0xFFFEEF7F); with DT_TABSTOP set (0xFFFEFFFF) it is 16 because of the tab length (dt_pf_leading). Bits 22 to 31 have no meaning and are ignored (dt_pf_pairs)."
  missing_glyphs: "Characters the font has no glyph for: on Windows their width and pixels come from another font of the system (a NUL inside an explicit count was 6 wide beside PolyTest glyphs), so no test fixes them. Of the control characters, a tab without DT_EXPANDTABS and CR and LF with DT_SINGLELINE had no width and drew nothing. Poly gives tab, CR and LF no width when the font has no glyph for them and may use any substitute for the others."
errors:
  bad_dc: "A NULL DC: 0 and no error code, except with a count of 0 on a text that does not start with a NUL, which returns 1 before the DC is looked at."
  count: "A NULL string: 0. A count below -1: 0, the rectangle untouched. A count of 0 on a text whose first character is not NUL: 1, nothing drawn and the rectangle untouched, also with DT_CALCRECT and whatever the other flags are. A count of 0 on a text that starts with NUL, and a count of -1 on an empty string, are the empty string: 1 without DT_SINGLELINE and the line height with it (with DT_VCENTER or DT_BOTTOM the offset is added: 24 and 32 in a rectangle 32 high), and DT_CALCRECT sets right = left and bottom = top (+ the line height with DT_SINGLELINE). Count -1 stops at the first NUL; an explicit count is taken as given and a NUL inside it is a character (see missing_glyphs). A lone line break measures 0 wide and two lines high (dt_pf_count)."
  odd_input: "A text of 1000 'A' characters measures 12000 wide; unknown flag bits (0x400000) are ignored; a rectangle of -100000..100000 with DT_CENTER|DT_VCENTER|DT_SINGLELINE returns 100008."
  last_error: "None of these cases sets an error code: after SetLastError(0), GetLastError is 0."
side_effects: "none beyond the rules above"
threading: "a DC, a font and a font resource belong to the process; fonts added from memory or with FR_PRIVATE are visible to the adding process only"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 15
  held_out: 6
building_tests: >
  Rust tests (ADR 0075), one file per test, importing gdi32.dll, user32.dll and kernel32.dll by name, each file carrying its own declarations (Learn prototypes, wingdi.h / winuser.h constants) and its own TrueType writer. No test depends on the pixels or the metrics of a Microsoft font (the owner's decision of 2026-11-09: Poly cannot ship those fonts): text is drawn with fonts the test makes itself and adds with AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE), so Windows and Poly use the same font file, and tests on installed families print only relations that hold for every font. The tests make their own TrueType fonts (the same 14-glyph table in every file, units per em 1024, every coordinate a multiple of 64 units so that every glyph edge lies on a pixel boundary at lfHeight -16): 'PolyTest Sans' (OS/2 winAscent 768, winDescent 256, hhea ascender 768, descender -256, line gap 128), 'PolyTest Tall' (winAscent 896, winDescent 320, no line gap), 'PolyTest Mono' (Sans metrics, every advance 640, post isFixedPitch, panose proportion 9) and the Bold and Italic faces of the Sans family (the 'A' is 13 and 14 pixels wide instead of 12 at -16). Advances at 16 pixels per em: space 6, '&' 9, '-' 6, '.' 4, 'A' 12, 'B' 8, 'M' 12, 'W' 16, backslash 6, 'g' 10, 'i' 4, U+00E9 11, U+20AC 14, .notdef 10. A font reaches GDI through AddFontMemResourceEx or AddFontResourceExW(FR_PRIVATE); GDI refused a font whose name table had only the name IDs 1, 2, 4 and 6, so the tests' fonts carry IDs 0 to 6. Tests on installed families (Arial, Times New Roman, Courier New, Segoe UI, Tahoma, Verdana, Consolas and the stock fonts) print and check only relations that hold for every font, never their pixels or metrics. Drawing goes into a 32-bit top-down DIB section in a memory DC, bi-level (lfQuality NONANTIALIASED) where pixels are compared, white text on a dark blue background over a grey surface. Observations are numbers, pixel boxes, counts and rows of pixels as text, never handles, addresses or times.
not_covered: >
  Right-to-left and bidirectional text, DT_INTERNAL's effect on the layout of non-Latin text, DT_NOFULLWIDTHCHARBREAK with East Asian text, the edit-control average character width of DT_EDITCONTROL, the widths and pixels of characters the font lacks, a handle that is not a DC.
