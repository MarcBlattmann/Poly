# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/RegisterDeviceNotificationW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3b
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Registers a window (DEVICE_NOTIFY_WINDOW_HANDLE, 0) to receive WM_DEVICECHANGE messages for device interface
  arrivals and removals of the class named in a DEV_BROADCAST_DEVICEINTERFACE_W filter. Chrome's browser calls
  it twice in a run (S3) at start-up and unregisters both with UnregisterDeviceNotification at the end.
interface:
  signature: "HDEVNOTIFY RegisterDeviceNotificationW(HANDLE hRecipient, LPVOID NotificationFilter, DWORD Flags)"
rules:
  success: "returns a non-NULL handle and sets the last error to 0; every call gives its own handle, also for the same class and window; filters for the USB device, HID device and monitor interface classes work; any number of registrations (sixteen more of one window succeed); a window of another thread of the process can be registered from this thread; a message-only window works"
  filter: "a filter of type DBT_DEVTYP_DEVICEINTERFACE (5) and size 32 works; sizes 12 and 31 are accepted too; the type OEM (0), PORT (3) and unknown types (99) return NULL with ERROR_INVALID_DATA 13; a NULL filter returns NULL with 87 (also with DEVICE_NOTIFY_ALL_INTERFACE_CLASSES)"
  flags: "DEVICE_NOTIFY_ALL_INTERFACE_CLASSES (4) and an unknown flag 0x80 are accepted with a type 5 filter; DEVICE_NOTIFY_SERVICE_HANDLE (1) with a window handle returns NULL with ERROR_INVALID_HANDLE 6"
  recipient: "a NULL recipient or a window handle that does not exist is accepted (a handle is returned): the recipient is not checked when it is registered"
  messages: "no WM_DEVICECHANGE reaches the window by itself (no device comes or goes during the test); the registration does not change the messages the pump sees; WM_DEVICECHANGE (DBT_DEVNODES_CHANGED 7) sent by hand reaches the window procedure as any message"
  lifetime: "the registration is not tied to the window: it can be released with UnregisterDeviceNotification after the window was destroyed (returns 1)"
errors:
  invalid_data: "13: filter type OEM, PORT or unknown"
  invalid_parameter: "87: NULL filter"
  invalid_handle: "6: service flag with a window handle"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, ole32.dll and oleaut32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and printing booleans, counts and error codes, never
  handles, addresses, times or machine ids; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md), twice per run, with identical output. Test windows are placed in the top-left
  1000x500 pixels and the cursor is parked at (1500, 600). The COM tests run each sequence on a thread of its
  own (every thread starts without COM state). Where a call crashes on the oracle (a NULL path count in
  QueryDisplayConfig, a garbage handle in UnregisterPowerSettingNotification, CoRegisterMessageFilter on a
  thread without COM) the case is left out.
not_covered: >
  Real device arrival and removal messages (DBT_DEVICEARRIVAL, DBT_DEVICEREMOVECOMPLETE), DBT_DEVTYP_HANDLE
  filters and service recipients.
