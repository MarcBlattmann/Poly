# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/CreateCaret.yaml
id: windows/api/user32.dll/CreateCaret
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, nothing is visible or painted, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-3
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (the programs carry their own resources: string tables, menus, dialog templates, accelerator tables, bitmaps and icons are compiled into each test executable). Microsoft Learn reference pages of the functions and messages named here, "About Menus", "Using Menus", "About Dialog Boxes", "Using Dialog Boxes", "About Resource Files", "Resource Definition Statements", "About Keyboard Accelerators", "Common Dialog Box Library", "Common Controls"; winuser.h, commctrl.h, commdlg.h, winbase.h and winerror.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Creates a caret for the calling thread, owned by a window of that thread, and destroys the thread's earlier caret. The new caret is hidden (ShowCaret has to be called); it starts at the position the thread's caret last had ((0,0) in a new thread). GetGUIThreadInfo then reports the window and the caret rectangle.
interface:
  signature: "BOOL CreateCaret(HWND hWnd, HBITMAP hBitmap, int nWidth, int nHeight)"
rules:
  owner: "the window handle becomes hwndCaret of GetGUIThreadInfo (also a child window); rcCaret is (x, y, x + width, y + height) with the position in the client coordinates of that window"
  position: "a new caret starts at the position of the previous caret of the thread, not at (0,0): after SetCaretPos(20, 30) and DestroyCaret a new CreateCaret has position (20, 30); a thread that never had a caret starts at (0,0)"
  size: "the width and height as given are the rectangle's size, also negative values (-1 x 10 gives right = -1), 3000 x 3000, 0x7FFFFFFF; a width of 0 gives SM_CXBORDER (1 on the oracle) and a height of 0 gives SM_CYBORDER (1), each on its own (0 x 12 is 1 x 12, 5 x 0 is 5 x 1, 0 x 0 is 1 x 1)"
  bitmap: "a bitmap handle of the caller (monochrome or colour) gives the caret that bitmap's size and the width and height arguments are ignored (a 11 x 13 bitmap with 3 x 3 gives 11 x 13); the bitmap is not copied away or freed: it is still a bitmap (GetObjectType OBJ_BITMAP) after DestroyCaret and can be deleted by the caller, also while the caret still shows it (the rectangle stays)"
  gray_and_special_handles: "the value 1 as bitmap handle is the gray caret and uses the width and height given (4 x 6 gives 4 x 6); the value 2 gives a caret whose rectangle is (0,0,0,0); a made-up bitmap handle (0x0bad0bad) is accepted (TRUE) and gives a caret with an empty rectangle (0,0,0,0)"
  one_per_thread: "a second call replaces the caret even for another window of the same thread: GetGUIThreadInfo then shows the second window and the new shape; ShowCaret / HideCaret for the first window now fail; the new caret is hidden even if the old one was shown"
  other_threads: "a window that belongs to another thread cannot be given a caret: FALSE and the last error is not changed; a caret created by a second thread in its own window is that thread's caret (rcCaret (0,0,4,10) there) and the first thread's caret is gone once the second thread has created and destroyed its own caret and window (hwndCaret of the first thread is NULL afterwards)"
  focus: "the caret is created whether or not the window has the focus"
errors:
  bad_window: "a NULL window and a made-up handle: FALSE with ERROR_INVALID_WINDOW_HANDLE (1400)"
  not_allowed: "the desktop window and a window of another thread: FALSE, the last error is not changed"
side_effects: "none beyond the rules above"
threading: "a caret belongs to the input queue of the thread that created it; every call but GetCaretPos acts on the calling thread's own caret; the tests make a second thread and call the caret functions there"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle (a dialog or message box that is ended at once: a few tens of milliseconds)"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations (Learn prototypes, header constants) and, where the entry needs them, its own resources (a resource directory written as data in the executable; formats from Learn: DLGTEMPLATE, DLGTEMPLATEEX, menu templates, ACCEL, string tables, BITMAPINFOHEADER, icon groups). Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes and booleans; no line holds a handle, a pointer, a window position or a font-dependent size. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is never printed (it is not specified).
not_covered: >
  Blinking itself (the caret is inverted every GetCaretBlinkTime milliseconds) and the caret's pixels: the session of the tests has no visible desktop; what a caret is observed by here is GetGUIThreadInfo (hwndCaret, rcCaret and the GUI_CARETBLINKING flag, which is set while the caret is shown). The behaviour of the caret in the interactive session (which window shows it when focus moves between processes), SetCaretBlinkTime (see its sheet).
