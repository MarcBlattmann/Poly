# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetActiveWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2, spec-win-gui-b3
  date: 2026-11-02, 2026-11-09, 2026-11-10
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "Window Features" (active window, owned
  windows), "Dialog Boxes" (owner disabled while a modal dialog box is
  shown).
summary: >
  Returns the active top-level window of the calling thread's input queue,
  or NULL (also when another thread is in the foreground and the input is
  not attached).
interface:
  signature: "HWND GetActiveWindow(void)"
rules:
  hide_active: "ShowWindow(A, SW_HIDE) of the active window, with another of the thread's visible topmost popups B (shown with SW_SHOWNA, never active): A WM_SHOWWINDOW(0), WINDOWPOSCHANGING(0x83), CHANGED(0x20001883), WM_NCACTIVATE(0, l=0), WM_ACTIVATE(0, other=NULL), WM_ACTIVATEAPP(0) to A and to B, A WM_KILLFOCUS(other=NULL); GetActiveWindow NULL; the activation goes to another process's window, not to B, which was never active (see next_active)"
  hide_flags: "hiding the active window: WM_WINDOWPOSCHANGING is always 0x83 (SWP_HIDEWINDOW|SWP_NOMOVE|SWP_NOSIZE: no SWP_NOACTIVATE and no SWP_NOZORDER, the call raises the window while it hands the activation on); WM_WINDOWPOSCHANGED is 0x20001887 or 0x20001883 (0x20000000 is set for every hide and destroy on this desktop, 0x1800 = no client move/size, 0x80|3 the hide). The 4 (SWP_NOZORDER) is set exactly when the window was already the topmost in its group in the z order: hidden windows count, a window created later lies above an earlier one even when it is not shown, and the groups are the topmost (WS_EX_TOPMOST) and the other windows. Examples (A the active overlapped window): 0x20001883 when another window of the thread above A in the same group exists, visible (shown with SW_SHOWNA, which puts it on top) or hidden (created after A, never shown); 0x20001887 when A is alone, when the other window is below A (it was active before A took over, or was shown minimized with SW_SHOWMINNOACTIVE, which puts it below the active window) and when the other window is topmost and A is not (or the reverse); the same rule gives 0x20001887 for a topmost A alone. The thread's hidden default IME window, which the active window owns and which lies directly above it, does not count here (GetFocus ime_window); the general rule is z_order_moves. One observation does not follow the rule and is not explained: after a thread that had lost the foreground to another process's plain window took it back with SetForegroundWindow, hiding the window that SetForegroundWindow made active reported 0x20001883 although no window of the test lay above it (the window it had been activated over took the activation normally); no test relies on it."
  destroy_active: "DestroyWindow(A) of the active window: no WM_SHOWWINDOW; WM_WINDOWPOSCHANGING(0x97 = SWP_HIDEWINDOW|NOACTIVATE|NOZORDER|NOMOVE|NOSIZE), WM_WINDOWPOSCHANGED(0x20001897, whatever the z order), then the same activation messages as for a hide (WM_NCACTIVATE(0), WM_ACTIVATE(0), WM_ACTIVATEAPP(0) ..., WM_KILLFOCUS) and WM_DESTROY, WM_NCDESTROY of A; B is activated only when it lies below A (see next_active); the 0x97 / 0x20001897 pair is also what the destroy of an inactive visible window sends, and of a minimized one (WM_WINDOWPOSCHANGED carries its minimized rect), and SW_HIDE of an inactive window sends WM_SHOWWINDOW(0) with 0x97 / 0x20001897 too"
  next_active: "who takes the activation when the active window A is hidden (SW_HIDE), destroyed or minimized (SW_MINIMIZE). (1) The window of the thread that was the active window before A, if it can still be activated (visible, enabled, not minimized), wherever it lies in the z order and whether it is topmost or not (raising another window above A with SetWindowPos changes nothing); when that one goes too, the one that was active before it, and so on. (2) If the thread has no such window: for a HIDE or a DESTROY nobody of the thread takes it, also when the thread has visible windows that were never active (shown with SW_SHOWNA, above or below A, topmost or not): the thread has no active window and the foreground returns to the window of another process that had it before the thread took it (K at first; after the thread took the foreground from another window with SetForegroundWindow, that window). For SW_MINIMIZE the TOP window in the z order that is not WS_EX_TOPMOST takes it, of any process, if it is visible, enabled, not minimized, not WS_EX_NOACTIVATE and not WS_EX_TOOLWINDOW: a window of the thread that was never active is taken this way, also one that lies above A, and of two the upper one; a topmost window is never taken this way (only by rule 1); when no window of the thread qualifies, the top such window of another process gets the foreground (on the oracle a console window; never K, which is topmost) and the thread has no active window. Messages when a window B of the thread takes over (after A's own messages, see hide_flags, destroy_active, minimize_active): A WM_NCACTIVATE(0, l=B) (wParam 0x200000 for the minimize), WM_ACTIVATE(WA_INACTIVE, other=B; HIWORD 32 for the minimize), B WM_WINDOWPOSCHANGING(0x3), B WM_WINDOWPOSCHANGED(0x1803) only when B moved up in the z order, B WM_NCACTIVATE(1, l=A), WM_ACTIVATE(WA_ACTIVE, other=A), A WM_KILLFOCUS(other=B), B WM_SETFOCUS(other=A) (at a minimize A lost the focus first, so only B WM_SETFOCUS(other=NULL)); B gets the focus itself (never one of its children), B is the foreground window and no WM_ACTIVATEAPP is sent. When nobody of the thread takes over: A WM_NCACTIVATE(0, l=0) (wParam 0 also for the minimize: the 0x200000 bit comes only with a successor), WM_ACTIVATE(WA_INACTIVE, other=NULL; HIWORD 32 for the minimize), WM_ACTIVATEAPP(0) to every top-level window of the thread in z order from the top down as the order is at that moment (z_order_moves: a hidden A was put on top and is first, a destroyed A keeps its place, a minimized A is the last of its band), then A WM_KILLFOCUS(other=NULL) for the hide and the destroy; active NULL, focus NULL"
  z_order_moves: "what the calls do to the z order of top-level windows. The WS_EX_TOPMOST windows form a band above the others and a window moves inside its band only. A new window, hidden or not, is put on top of its band. An activation (creation of a visible window, a show that activates, SetForegroundWindow, SetActiveWindow, the hand-over of next_active) puts the window on top; so does SW_SHOWNA (WM_WINDOWPOSCHANGING 0x53: no SWP_NOZORDER), while SW_SHOWNOACTIVATE (0x57) leaves the window where it is. SW_HIDE of the ACTIVE window (0x83) puts it on top before the activation is handed on: it then lies above windows that were above it and is the first to get WM_ACTIVATEAPP(0). SW_HIDE of an inactive window (0x97) and DestroyWindow do not move anything. SW_MINIMIZE, also of an inactive window, puts the window at the BOTTOM of its band (a minimized topmost window still lies above every window that is not topmost); SW_SHOWMINIMIZED and SW_SHOWMINNOACTIVE leave it where it is. A window of another process that takes the foreground comes to the top of its band: K, which is topmost, then lies above the test's topmost windows, and a topmost window of the test shown with SW_SHOWNA afterwards lies above K again. WM_WINDOWPOSCHANGED has SWP_NOZORDER (4) exactly when the call did not move the window. For the minimize: 0x8170 / 0x8130 when the window was not the bottom one of its band, which is the usual case, also for an inactive window and for a window of a thread that has no active window (a lone topmost window that lies above K); 0x8174 / 0x8134 (the 4 already in WM_WINDOWPOSCHANGING) when it already was the bottom window (after SetWindowPos(HWND_BOTTOM)). The thread's hidden default IME window takes part in the order too: GetFocus ime_window"
  show_again: "ShowWindow(A, SW_SHOW): WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x43), (0x3), WM_ACTIVATEAPP(1) to A and B, A WM_NCACTIVATE(1), WM_ACTIVATE(1, other=NULL), WM_SETFOCUS(other=NULL), WM_WINDOWPOSCHANGED(0x10001843, without SWP_NOZORDER since a window of another process (the runner keeper) was activated and raised above A meanwhile): active A"
  show_activates: "ShowWindow(B, cmd) of a hidden or visible B while A is active (A foreground; messages in this order): SW_SHOWNORMAL, SW_SHOW, SW_RESTORE of a hidden B: B WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x43), A WM_NCACTIVATE(0, l=B), WM_ACTIVATE(0, other=B), B WM_WINDOWPOSCHANGING(0x3), B WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), A WM_KILLFOCUS(other=B), B WM_SETFOCUS(other=A), B WM_WINDOWPOSCHANGED(0x10001847, or 0x10001843 when B was raised by the activation (B lay below another window, or below the thread's default IME window because the focus had changed since B was created: GetFocus ime_window); 0x1847 / 0x1843 for a window with WS_EX_NOACTIVATE or WS_EX_TOOLWINDOW, which activate all the same; no 0x10000000 for them); active, focus and foreground B. SW_SHOWNOACTIVATE (0x57 / 0x10001857) and SW_SHOWNA (0x53 / 0x10001857, or 0x10001853 when the show moved B up because it lay below A) show B without any activation message. On a visible B SW_SHOWNORMAL, SW_SHOW, SW_RESTORE, SW_SHOWNOACTIVATE do nothing (B stays inactive, no message at all) and SW_SHOWNA sends WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x53) only. SW_SHOWMAXIMIZED of B (hidden or visible) and SW_SHOWMINIMIZED activate it the same way, the activation messages between WM_NCCALCSIZE and WM_WINDOWPOSCHANGED. A minimized B restored by SW_SHOWNORMAL, SW_RESTORE or SW_SHOWMAXIMIZED is activated the same way, with an extra WM_ACTIVATE(1, other=NULL) to B after its WM_SIZE; SW_SHOWNOACTIVATE restores it without activation (0x8130 / 0x9930 / 0x8130) and SW_SHOWNA of a minimized B does not restore it (0x53, CHANGED 0x1813 when it moved)"
  minimize_active: "SW_MINIMIZE of the active window A: A WM_KILLFOCUS(other=NULL) first, WM_WINDOWPOSCHANGING(-32000,-32000 160x28, 0x8170), WM_GETMINMAXINFO, WM_NCCALCSIZE(TRUE, 0x9930), WM_WINDOWPOSCHANGED(0x8130), WM_MOVE(-32000,-32000), WM_SIZE(SIZE_MINIMIZED, 0,0), then the activation passes on as in next_active with WM_NCACTIVATE(wParam 0x200000, l=B) when a window B of the thread takes over and WM_NCACTIVATE(wParam 0, l=0) when none does, and WM_ACTIVATE(WA_INACTIVE, HIWORD 32 = minimized, other=B or NULL), and, when B is the next window, B WM_WINDOWPOSCHANGING(0x3), WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), WM_SETFOCUS(other=NULL) (A's focus was already taken away). SW_SHOWMINIMIZED of the active window keeps it active: WM_KILLFOCUS(other=NULL), 0x8160, 0x9920, 0x8120, WM_MOVE, WM_SIZE(SIZE_MINIMIZED), no activation message, afterwards GetActiveWindow A, GetFocus NULL, foreground A (0x8124 / 0x9924 when A was not moved in the z order). SW_SHOWMINIMIZED of an inactive B (hidden or visible) activates B (WM_NCACTIVATE(wParam 0x200001, l=A), WM_ACTIVATE(1, HIWORD 32, other=A), A WM_KILLFOCUS(other=NULL)): active B, focus NULL"
  minimize_inactive: "SW_MINIMIZE of a window X that is NOT the active window: X is moved to its minimized place (-32000,-32000 160x28, flags 0x8170 / 0x8130) and the activation is handed on as if X had been the active window (next_active with X as the window that goes), seen from the thread's active window A. If a window E was active before A and E is not X, E is activated although A did not change: A WM_NCACTIVATE(0, l=E), WM_ACTIVATE(0, other=E), E WM_WINDOWPOSCHANGING(0x3), E WM_WINDOWPOSCHANGED(0x1803) when it moved up, E WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), A WM_KILLFOCUS(other=E), E WM_SETFOCUS(other=A). If X itself was the window active before A, or no window was, the top eligible window that is not topmost is looked for (rule 2 of next_active): that is A itself when A is not topmost, and then nothing happens at all (no activation message; active, focus and foreground stay A). When A is topmost and the thread has no plain window that qualifies, A loses the activation: A WM_NCACTIVATE(0, l=0), WM_ACTIVATE(0, other=NULL), WM_ACTIVATEAPP(0) to the thread's windows, A WM_KILLFOCUS(other=NULL), and the foreground goes to the other process's plain window. The same search runs when the thread has no active window (a lone inactive topmost window minimized while K is the foreground window: no message but the position ones, and the foreground moves from K to the other process's plain window). When the window found already is the foreground window nothing changes: a thread that is not in the foreground and minimizes its active window keeps that window as its active window (GetFocus NULL)"
  minimized_position: "the rectangle of a minimized window on this desktop (160x28): -32000,-32000 for a window that has a taskbar button (a top-level window that is not owned, not WS_EX_TOOLWINDOW and not WS_EX_NOACTIVATE; WS_EX_APPWINDOW makes it one anyway); the bottom-left slot 0,1052,160,1080 for the others: an owned window (also a visible popup owned by the active window), a WS_EX_TOOLWINDOW window, a WS_EX_NOACTIVATE window without WS_EX_APPWINDOW. WM_WINDOWPOSCHANGING for the SW_SHOWMINNOACTIVE of a hidden B: 0x8170, NCCALCSIZE 0x9970, CHANGED 0x10008170 (0x8170 for a WS_EX_TOOLWINDOW or WS_EX_NOACTIVATE window without WS_EX_APPWINDOW), WM_MOVE, WM_SIZE(SIZE_MINIMIZED), no activation (the 0x10000000 bit is set for every show of a hidden top-level window that is not WS_EX_TOOLWINDOW / WS_EX_NOACTIVATE, also for the owned one that sits at the bottom left); a hidden B shown with SW_SHOWMINNOACTIVE lies below the active window, one shown with SW_SHOWNA above it"
  owned_shown: "ShowWindow(O, SW_SHOW) of a popup owned by the active A: O activated (A WM_WINDOWPOSCHANGING 0x13 twice: the owner follows its owned window in the z order)"
  owned_destroyed: "destroying or hiding the active owned popup activates its owner A again (A WM_NCACTIVATE(1), WM_ACTIVATE(1, other=O), WM_SETFOCUS(other=O))"
  owner_disabled: "EnableWindow(A, FALSE) of the active window: A stays active (focus NULL); an owned popup shown then is activated and gets the focus; destroying it while A is disabled leaves the thread with no active window (WM_ACTIVATEAPP(0) to it and A): the activation goes to another process; enabling A again does not activate it"
  other_thread: "a thread whose window is not in the foreground: NULL (see GetFocus)"
errors:
  none: "GetActiveWindow has no error case"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering:
  - "Activation from window X to window Y of the same thread, both ours: X WM_NCACTIVATE(0), X WM_ACTIVATE(WA_INACTIVE, other=Y), Y WM_WINDOWPOSCHANGING(SWP_NOMOVE|SWP_NOSIZE = 0x3; brought to the top), Y WM_WINDOWPOSCHANGED (only when the z order changed), Y WM_NCACTIVATE(1), Y WM_ACTIVATE(WA_ACTIVE, other=X), X's focus window WM_KILLFOCUS(other=Y), Y WM_SETFOCUS(other=that window). WM_NCACTIVATE's lParam is nonzero between two windows of the thread and 0 when the other window is in another thread or process. When the thread gains or loses the foreground, WM_ACTIVATEAPP (1 or 0) goes to every top-level window of the thread, between WM_WINDOWPOSCHANGING and WM_NCACTIVATE when gaining, after WM_ACTIVATE(0) when losing."
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 11  # count in <symbol>.tests/
  held_out: 5  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Every
  test first makes its window A the foreground window with
  SetForegroundWindow (the test program may: the previous test passed the
  right on with AllowSetForegroundWindow(ASFW_ANY), or it is the first
  program the runner starts). "other" below is a window of another process
  (on the oracle a console window); "ours" a window of the test without a
  tag. Two windows of other processes matter on the oracle"s desktop and the tests of 2026-11-10 tell them apart: K, the runner"s keeper (WS_EX_TOPMOST, the foreground window when a test starts), and the top visible window that is not topmost, a console window of another process, printed as "other" (it is what a minimize hands the foreground to, see GetActiveWindow next_active). A z order line lists the test"s top-level windows and K from the top down.
not_covered: >
  DPI awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
