# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetForegroundWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2
  date: 2026-11-02, 2026-11-09 (rules after the held-out feedback)
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. GetForegroundWindow, ShowWindow (the SW_*
  commands), "Extended Window Styles" (WS_EX_NOACTIVATE).
summary: >
  Returns the window the user is currently working with (the foreground
  window), the same for every thread of every process; NULL is possible, a
  window of another process is returned as is.
interface:
  signature: "HWND GetForegroundWindow(void)"
rules:
  show_na: "ShowWindow(B, SW_SHOWNA) and ShowWindow(C, SW_SHOWNOACTIVATE) of hidden popups: no activation (WM_SHOWWINDOW, WM_WINDOWPOSCHANGING 0x53 / 0x57, WM_WINDOWPOSCHANGED 0x10001857); return 0; the foreground stays A"
  create_visible_noactivate: "creating a visible WS_EX_NOACTIVATE popup D activates it (D foreground, active, focus): WS_EX_NOACTIVATE does not stop activation at creation"
  create_visible: "creating a visible popup E activates it"
  show_visible: "SW_SHOWNORMAL or SW_SHOW on an already visible inactive window: returns 24 (nonzero: was visible), no messages, no activation"
  showminnoactive: "SW_SHOWMINNOACTIVE: minimized at -32000,-32000 160x28 (flags 0x8170, 0x10008170), no activation"
  showminimized: "SW_SHOWMINIMIZED: minimized and activated (foreground G, focus NULL); G WM_NCACTIVATE wParam 0x200001, WM_ACTIVATE minimized HIWORD 0x20"
  threads: "thread T of the process (its own popup, not attached) gets the same foreground window as the main thread (A) while its GetActiveWindow and GetFocus are NULL"
  destroy_foreground: "DestroyWindow(A) or ShowWindow(A, SW_HIDE) of the foreground window A (A topmost, no earlier active window of its thread: see handover_same_thread), with a visible, enabled plain popup T of a second thread of the process whose thread has no active window at that moment (T sees active NULL and focus NULL just before: T's window was created after A took the foreground, or A took the foreground away from it): the foreground goes to T; both threads then see T (T sees active T and focus T), the main thread sees active NULL and focus NULL. T topmost or not, created before or after A, makes no difference"
  other_thread_not_taken: "the foreground does NOT go to the other thread's window T when T's thread still reports an active window while A is the foreground (T sees active T and focus T although the foreground is A: seen for a T created before A in a later run of the same program, and always for a WS_EX_NOACTIVATE window T, which is active from its creation), nor when T is hidden or disabled (T sees active NULL, a disabled or hidden window is never given the foreground): it goes to a window of another process (on the oracle the runner's keeper window that was in front before; the tests print it as 'other'), the main thread sees active NULL and focus NULL, and T keeps its own active and focus window (T sees active T, focus T, fg other). A second window B of the main thread under A does not change which of the two happens"
  handover_same_thread: "when the foreground window A is destroyed or hidden (SW_HIDE), the activation goes to the window of the SAME thread that was the active window before A, if that window is still visible and enabled (and not minimized): it becomes the active and focus window and the foreground window. Windows of the thread that were never active are not chosen, whatever their z-order (B shown with SW_SHOWNA below or above A, topmost or not, is skipped). By last activation: E, A, C activated in this order, destroy C -> A, then destroy A -> E; E activated again after A, destroy E -> A. If the thread had an earlier active window but it is hidden or disabled when A goes, the TOPMOST eligible window of the thread in the z-order takes the activation instead, even one that was never active (E disabled, A topmost and never active, B plain: A); if the earlier active window is gone, hidden or disabled and no other window is eligible, or if A was the first window of the thread to be active (it took the foreground from a window of another process), nobody takes it (see nobody_takes_over): never-active B and C are then left alone. Messages when a window takes over: A: WM_SHOWWINDOW(0, only for SW_HIDE), WM_WINDOWPOSCHANGING (pos/size 0, flags 0x83 for the hide, 0x97 for the destroy), WM_WINDOWPOSCHANGED (0x20001887 for the hide, 0x20001897 for the destroy; without the 0x20000000 bit, 0x1887 / 0x1897, for a window with WS_EX_NOACTIVATE); then A WM_NCACTIVATE(0, lParam = the window taking over) and WM_ACTIVATE(WA_INACTIVE, other = it); the successor WM_WINDOWPOSCHANGING (pos/size 0, flags 0x3: it is brought to the top of its band) and, only if it really moved in the z-order (it was under A or another window), WM_WINDOWPOSCHANGED (own position and size, flags 0x1803); successor WM_NCACTIVATE(1, lParam = A), WM_ACTIVATE(WA_ACTIVE 1, other = A); A WM_KILLFOCUS(other = successor); successor WM_SETFOCUS(other = A)"
  nobody_takes_over: "when no window of the thread can take the activation from the destroyed or hidden foreground window A (no earlier active window, or it is hidden, disabled, minimized, or WS_EX_NOACTIVATE-only candidates), A is only deactivated: A WM_NCACTIVATE(0, lParam 0), WM_ACTIVATE(WA_INACTIVE, other NULL), then WM_ACTIVATEAPP(0) to every top-level window of the thread (A first, then the others from the top of the z-order down, hidden and disabled ones too), then A WM_KILLFOCUS(other NULL); the thread has active NULL and focus NULL and the foreground is another thread's window or a window of another process. Visible enabled windows of the thread that were never active (B, C) are left alone. If A holds the mouse capture the capture window first gets WM_CANCELMODE and WM_CAPTURECHANGED(NULL), right after A's WM_WINDOWPOSCHANGED (see SetCapture)"
  minimize_foreground: "ShowWindow(A, SW_MINIMIZE) of the foreground window A: A WM_KILLFOCUS(other NULL), WM_WINDOWPOSCHANGING (-32000,-32000, 160x28, flags 0x8170), WM_WINDOWPOSCHANGED (0x8130, without the 0x20000000 bit), WM_NCACTIVATE(wParam 0x200000 = FALSE with the minimized bit, lParam = the successor or 0), WM_ACTIVATE(WA_INACTIVE, HIWORD 0x20 minimized, other = successor or NULL). The successor is the previously active window of the thread when it is eligible (visible, enabled, not minimized, not WS_EX_NOACTIVATE), otherwise the first eligible window BELOW A in the z-order, even one that was never active; windows above A are never chosen (a plain B below A and a topmost C above A: B; only C above A: nobody; below A a disabled B and an enabled plain D: D). With a successor: WM_WINDOWPOSCHANGING (0x3), WM_NCACTIVATE(1), WM_ACTIVATE(1, other = A), WM_SETFOCUS(other NULL), foreground = successor. With none: WM_ACTIVATEAPP(0) to the thread's windows, active NULL, foreground another process"
errors:
  none: "GetForegroundWindow has no error case"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Every
  test first makes its window A the foreground window with
  SetForegroundWindow (the test program may: the previous test passed the
  right on with AllowSetForegroundWindow(ASFW_ANY), or it is the first
  program the runner starts). "other" below is a window of another process
  (on the oracle a console window); "ours" a window of the test without a
  tag.
not_covered: >
  DPI awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
