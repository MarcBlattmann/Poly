# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetClientRect
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1, two runs each, identical; the SSH session is session 0 with its non-interactive window station, whose desktop is not visible; screen 1024x768, 32 bpp, 96 DPI, no shell (explorer) running"
  observed_by: spec-win-gui-a
  date: 2026-11-02
oracle_200: "homeserver2 (real hardware, Intel UHD Graphics 630, one monitor without EDID) with its display temporarily set to 2560x1600 at a scale of 200 percent: the mode changed dynamically (ChangeDisplaySettingsEx, no registry write), the scale set to the 200 percent step through the display configuration API, and checked before the recording (a per-monitor aware process read GetDpiForSystem 192 and a 2560x1600 screen, an unaware one a 1280x800 screen); both put back to 1920x1080 and 100 percent afterwards and read back. Windows 11 Home 25H2 (build 26200.9974), the logged-on account in the interactive desktop session (session 1) through tools/pipeline/windows/poly-oracle.ps1 -Interactive, two runs of each test, identical; the taskbar is at the bottom and 96 physical pixels high (48 at 100 percent); the monitor has no EDID, so physical sizes assume 96 DPI (HORZSIZE 677 mm for 2560 pixels). Every test of this slice carries the session 'interactive-bottom/2560x1600/200' in its windows.json."
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Messages and Message Queues", "Window Features", "About Painting and
  Drawing", "Device Contexts"; winuser.h, wingdi.h, windef.h and winerror.h
  for constants and layouts. Wine's tests were not read.
summary: >
  Returns the client area as (0,0)-(width,height). The client area is what
  WM_NCCALCSIZE left: for the default procedure the window minus borders,
  caption, edges and scroll bars.
interface:
  signature: "BOOL GetClientRect(HWND hwnd, RECT* rect)"
rules:
  sizes: "for a 200x100 window: WS_POPUP 200x100, +WS_BORDER 198x98, +WS_CAPTION 184x61 (frame 8,31,8,8), +WS_THICKFRAME 186x86, WS_EX_CLIENTEDGE 196x96, +WS_VSCROLL 183x100, +WS_HSCROLL too 183x83; children the same"
  too_small: "a window smaller than its frame has an empty client area 0,0,0,0"
  nccalcsize: "a procedure that answers WM_NCCALCSIZE itself decides: returning the rectangle unchanged makes the whole window the client area (also with a caption); insetting by 3,5,7,11 gives that; an inset larger than the window gives a negative width/height (-20x-20 observed)"
  during_creation: "0,0,0,0 until WM_CREATE"
  minimized: "0,0,0,0"
  at_200_units: "see GetWindowRect: client sizes are those of the window's awareness (unaware 384x261 and aware 374x229 for a 400x300 overlapped window), also for a window of another process; the desktop's client rectangle is the screen in the caller's units"

errors:
  bad_handle: "0, ERROR_INVALID_WINDOW_HANDLE (1400); the RECT is left as it was"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; calls on a window of another thread of the process work as noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) that import user32.dll and gdi32.dll by name
  (allowed since this slice); each carries its own declarations (Learn
  prototypes, header constants) and a message log helper; window procedures
  log only documented messages (see "documented" in the tests), never
  painting messages, activation or IME traffic, handles, times or cascading
  default positions. Today Poly has no GUI user32/gdi32, so the tests do not
  start there.
not_covered: >
  Everything that needs a visible desktop: WM_PAINT, WM_ERASEBKGND and
  WM_NCPAINT generation, update regions (InvalidateRect, ValidateRect,
  GetUpdateRect, UpdateWindow, BeginPaint/EndPaint inside WM_PAINT),
  IsWindowVisible of shown windows, window DC clipping - in the oracle's
  session no window is visible (IsWindowVisible is 0 for every shown window,
  InvalidateRect leaves no update region and no WM_PAINT comes); they need
  the interactive desktop and are a later entry. Real input (SendInput),
  focus and activation, menus and the menu loop, hooks, DPI awareness.
