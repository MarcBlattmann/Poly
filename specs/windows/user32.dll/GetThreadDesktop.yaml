# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/GetThreadDesktop.yaml
id: windows/api/user32.dll/GetThreadDesktop
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s2
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: the counts and failures of specs/windows/apps/chrome/traces/s2.trace.json and s2-sandboxed.trace.json (the committed traces have counts, not arguments, for these calls) and section 4 and 4a of specs/windows/apps/chrome/gap-map.md. Microsoft Learn: "CreateWindowStationW", "CloseWindowStation", "OpenWindowStationW", "SetProcessWindowStation", "GetProcessWindowStation", "CreateDesktopW", "OpenDesktopW", "CloseDesktop", "GetThreadDesktop", "SetThreadDesktop", "GetUserObjectInformationW", "Window Station Security and Access Rights", "Desktop Security and Access Rights", "Mandatory Integrity Control"; winuser.h, winbase.h and winerror.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Returns the handle of the desktop a thread belongs to: the same handle value on every call, a handle that reads as a Desktop. A thread id that does not name a thread gives NULL (and leaves the last error as it was). The calling thread's own desktop handle cannot be closed (error 170) and cannot be left in use. SetThreadDesktop can move the calling thread to a desktop of another station and back; the broker asks for its own thread's desktop twice.
interface:
  signature: "HDESK GetThreadDesktop(DWORD thread_id); BOOL SetThreadDesktop(HDESK h)"
chrome:
  flow: "the broker makes an alternate window station and an alternate desktop for its targets in the browser process (CreateWindowStationW 2 calls, one of them fails with ERROR_ACCESS_DENIED; GetProcessWindowStation 2, SetProcessWindowStation 2 (switch to the new station to create the desktop there, then back), CreateDesktopW 1, GetThreadDesktop 2, GetUserObjectInformationW 44, CloseDesktop 1, CloseWindowStation 1) and starts every confined child with CreateProcessAsUserW (creation flags 0x8040C: CREATE_SUSPENDED|DETACHED_PROCESS|CREATE_UNICODE_ENVIRONMENT|EXTENDED_STARTUPINFO_PRESENT); by the sandbox's published design STARTUPINFO.lpDesktop names the alternate \"station\\desktop\". The arguments of the window station and desktop calls are not in the committed traces"
rules:
  own_thread: "GetThreadDesktop(GetCurrentThreadId()) returns a handle; a second call returns the same handle value; UOI_TYPE reads \"Desktop\" and UOI_NAME can be asked"
  bad_ids: "thread id 0, an id no thread has, and 4: NULL, last error untouched"
  close_in_use: "CloseDesktop(the thread's own desktop): FALSE, error 170 (ERROR_BUSY)"
  set_thread_desktop: "SetThreadDesktop(a desktop of another window station) = TRUE for a thread without windows; GetThreadDesktop then returns that handle (name = the desktop's); CloseDesktop of it while it is in use: FALSE, error 170; SetThreadDesktop(the original handle) = TRUE; then CloseDesktop of the other desktop = TRUE; SetThreadDesktop(NULL): FALSE, error 6"
errors:
  in_use: "ERROR_BUSY (170)"
  null_handle: "ERROR_INVALID_HANDLE (6) from SetThreadDesktop"
side_effects: "SetThreadDesktop changes the thread's desktop"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are statuses, error codes, counts and booleans, never handles, process ids, times or names of the machine. A test that needs a second process starts its own image again with CreateProcessW or CreateProcessAsUserW and the arguments --child <args>; the child reports through an inherited anonymous pipe or through its exit code and is ended by the test (it also ends by itself after about 10 s). Every wait is bounded. The tests run in the SSH logon session of the oracle (session 0, a service window station): objects they create have names of their own (polyws_*, polydesk_*), the process's own station name is never printed.
not_covered: >
  Threads of other processes, threads with windows or hooks (SetThreadDesktop refuses them), threads in the interactive session.
