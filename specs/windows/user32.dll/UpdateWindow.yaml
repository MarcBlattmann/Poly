# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/UpdateWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read.
summary: >
  Paints a window now: if its update region is not empty it sends WM_PAINT
  to the procedure (so a WM_PAINT waiting in the queue goes away) and
  returns after it; with nothing invalid it sends nothing. It also paints
  the window's invalid child windows, after the window itself.
interface:
  signature: "BOOL UpdateWindow(HWND hwnd)"
  return: "1 for a window (visible or hidden, invalid or not); 0 for NULL or a bad handle"
rules:
  sent: "WM_PAINT arrives before UpdateWindow returns; afterwards no WM_PAINT is waiting"
  nothing: "nothing invalid: nothing is sent"
  once: "a procedure that does not validate gets exactly one WM_PAINT per UpdateWindow; the window stays invalid and a WM_PAINT stays available in the queue"
  children: "UpdateWindow(parent) with the parent and a child invalid: the parent's WM_PAINT, then the child's; with only the child invalid: only the child's; UpdateWindow(child) paints only the child (the parent's WM_PAINT stays waiting)"
  hidden: "a hidden window (and a hidden child of a visible parent) has no update region; nothing is sent"
  show: "ShowWindow(SW_SHOWNOACTIVATE) of a hidden popup sends WM_SHOWWINDOW, WM_NCPAINT (wParam 1), WM_ERASEBKGND during the call; afterwards the whole client area is the update region and UpdateWindow sends WM_PAINT (no second WM_ERASEBKGND)"
  creation: "CreateWindowEx of a visible popup sends WM_NCPAINT and WM_ERASEBKGND (twice observed for a popup that gets a child created right after it); the first UpdateWindow sends WM_PAINT"
  resize_plain: "a class without CS_HREDRAW/CS_VREDRAW: SetWindowPos growing 100x80 to 140x80 sends WM_NCPAINT (a region, not 1), WM_ERASEBKGND, WM_SIZE; the update region is the new strip 100,0,140,80 (then 0,80,140,120 when growing to 140x120); shrinking sends only WM_SIZE and invalidates nothing"
  resize_redraw: "CS_HREDRAW | CS_VREDRAW: every size change (growing or shrinking) sends WM_NCPAINT (1), WM_ERASEBKGND, WM_SIZE and invalidates the whole client area"
  uncover: "moving a topmost popup that covered part of another one away invalidates nothing (the desktop is composed)"
errors:
  bad_window: "NULL or a made-up handle: 0, ERROR_INVALID_WINDOW_HANDLE (1400)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  All windows in these tests are WS_EX_TOPMOST | WS_EX_NOACTIVATE |
  WS_EX_TOOLWINDOW popups (or their children), so no activation messages
  interleave and nothing covers them. DPI awareness other than unaware (the
  tests have no manifest), several monitors, other keyboard layouts than
  German, IME, touch and pen, hooks, menus and the menu loop.
