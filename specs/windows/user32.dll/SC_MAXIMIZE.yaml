# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SC_MAXIMIZE
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom (work area 0,0,1920,1032); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); the user's keyboard layouts: German (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID (HKL 0x04072000), and under English (United Kingdom) Swiss German (HKL 0x08070809) and German (HKL 0x04070809); Caps Lock and Num Lock off; other layouts are loaded for a test with LoadKeyboardLayoutW(KLF_NOTELLSHELL) and unloaded again, the user's list is back as it was"
  observed_by: spec-win-input
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of the functions
  and messages named here, "Keyboard Input Overview", "About Keyboard Input", "About Mouse Input", "Using Mouse
  Input", "Virtual-Key Codes", "Window Features", "Window Styles", "Keyboard identifiers and input method
  editors", "NONCLIENTMETRICSW"; winuser.h, windef.h and winerror.h for constants and layouts. Wine's tests were
  not read.
summary: >
  Maximizing and restoring a window from outside its own code: ShowWindow from the same or another thread, a
  posted WM_SYSCOMMAND, the shell's Win+Up and Win+Down, the caption's double click and buttons: the messages
  the window receives in order and its state afterwards.
interface:
  signature: "WM_SYSCOMMAND(SC_MAXIMIZE 0xF030 / SC_RESTORE 0xF120, lParam point); ShowWindow(hwnd, SW_MAXIMIZE / SW_RESTORE)"
rules:
  what: "a normal window (WS_OVERLAPPEDWINDOW, 420x300 at 200,200) is maximized and restored in five ways in the interactive session; the messages it gets are recorded for each; numbers close to the work area are printed relative to it (L-8 = left of the work area minus 8, W+16 = its width plus 16, T+23 the work area's top plus 23)"
  showwindow_same_thread: "ShowWindow(SW_MAXIMIZE) from the window's thread: WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, WM_NCHITTEST screen=1500,600, WM_SETCURSOR hit=HTCLIENT 1 msg=0x0200, WM_MOUSEMOVE keys=0x0 client=1500,577, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500] || SW_RESTORE: WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500]"
  other_thread: "the same calls from another thread, and WM_SYSCOMMAND posted: WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, WM_NCHITTEST screen=1500,600, WM_SETCURSOR hit=HTCLIENT 1 msg=0x0200, WM_MOUSEMOVE keys=0x0 client=1500,577, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500] || restore: WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500] || PostMessage SC_MAXIMIZE: WM_SYSCOMMAND cmd=0xf030 low=0x0 at=0,0, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, WM_NCHITTEST screen=1500,600, WM_SETCURSOR hit=HTCLIENT 1 msg=0x0200, WM_MOUSEMOVE keys=0x0 client=1500,577, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500] || PostMessage SC_RESTORE: WM_SYSCOMMAND cmd=0xf120 low=0x0 at=0,0, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500]"
  win_up: "Win+Up with the window in the foreground (the shell's hotkey): WM_KEYDOWN vk=0x5b, WM_SYSCOMMAND cmd=0xf030 low=0x0 at=-1,-1, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, WM_NCHITTEST screen=1500,600, WM_SETCURSOR hit=HTCLIENT 1 msg=0x0200, WM_MOUSEMOVE keys=0x0 client=1500,577, WM_KEYUP vk=0x26, WM_KEYUP vk=0x5b, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500] || Win+Down: WM_KEYDOWN vk=0x5b, WM_SYSCOMMAND cmd=0xf120 low=0x0 at=0,0, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, WM_KEYUP vk=0x28, WM_KEYUP vk=0x5b, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500]"
  caption_actions: "a double click on the caption: WM_NCLBUTTONDOWN hit=HTCAPTION screen=350,220, WM_SYSCOMMAND cmd=0xf010 low=0x2 at=350,220, WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING x=0 y=0 cx=0 cy=0 flags=0x0003 after=7, WM_NCLBUTTONDBLCLK hit=HTCAPTION screen=350,220, WM_SYSCOMMAND cmd=0xf030 low=0x2 at=350,220, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500], WM_NCLBUTTONDOWN hit=HTCAPTION screen=142,6, WM_SYSCOMMAND cmd=0xf010 low=0x2 at=142,6, WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING x=0 y=0 cx=0 cy=0 flags=0x0003 after=7, WM_NCLBUTTONDBLCLK hit=HTCAPTION screen=142,6, WM_SYSCOMMAND cmd=0xf120 low=0x2 at=142,6, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500] || the maximize button: WM_NCLBUTTONDOWN hit=HTMAXBUTTON screen=549,214, WM_CAPTURECHANGED, WM_SYSCOMMAND cmd=0xf030 low=0x0 at=549,214, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGING x=L-8 y=T-8 cx=W+16 cy=1096 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=L-8,T-8,R+8,B+8, WM_WINDOWPOSCHANGED x=L-8 y=T-8 cx=W+16 cy=H+16 flags=0x8024 after=7, WM_MOVE x=0 y=T+23, WM_SIZE type=2 w=W+0 h=H-23, [state: zoomed=1 iconic=0 showCmd=3 WS_MAXIMIZE=1 rect-minus-workarea=-8,-8,8,8 client=W+0,H-23 normal=200,200,620,500] || the restore button: WM_NCLBUTTONDOWN hit=HTMAXBUTTON screen=1857,6, WM_CAPTURECHANGED, WM_SYSCOMMAND cmd=0xf120 low=0x0 at=1857,6, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x8020 after=7, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x8024 after=7, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, [state: zoomed=0 iconic=0 showCmd=1 WS_MAXIMIZE=0 rect=200,200,620,500 client=404x261 normal=200,200,620,500]"
  result_state: "after maximizing: IsZoomed 1, WS_MAXIMIZE set, GetWindowPlacement showCmd SW_SHOWMAXIMIZED (3) with the normal rectangle kept (200,200,620,500); the window rectangle is the work area grown by 8 on every side (L-8, T-8, R+8, B+8), the client area the work area's width and its height less the caption (client 1920 x work height - 23); after the restore the old rectangle and showCmd SW_SHOWNORMAL (1)"
  minmaxinfo: "WM_GETMINMAXINFO during the maximize: ptMaxSize (monitor width + 16, monitor height + 16), ptMaxPosition (-8, -8) relative to the monitor's origin, ptMinTrack SM_CXMINTRACK x SM_CYMINTRACK, ptMaxTrack the virtual screen plus 20; the window is then placed at the work area minus 8 (the work area clips the monitor-sized request: the taskbar is not covered)"
  who_tells: "a window that is maximized from outside (another thread, the shell's Win+Up, a posted WM_SYSCOMMAND) is told the same way by ShowWindow and by the shell: for Win+Up the window first gets WM_KEYDOWN (the Win key; the Up key is consumed by the shell), then WM_SYSCOMMAND SC_MAXIMIZE with lParam -1,-1 (Win+Down's SC_RESTORE has lParam 0, as a posted command; the caption actions give the screen point of the click), and the keys' WM_KEYUP afterwards; ShowWindow from another thread gives no WM_SYSCOMMAND, only the WM_GETMINMAXINFO/WM_WINDOWPOSCHANGING sequence"
errors:
  none: "no error cases observed"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture, key state and the keyboard layout are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each carrying its own declarations (Learn
  prototypes, header constants) and a message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because input, focus and sizing need the visible desktop. Window procedures log
  documented messages only and the traces leave out painting, timers, WM_GETICON, IME messages and registered
  messages; handles are printed as tag letters, never as values; numbers close to the monitor's work area are
  printed relative to it (L-8, W+16) so the taskbar's place does not matter. Test windows are placed in the
  top-left 1000x500 pixels (except where a test says otherwise), closed within seconds; the cursor is parked at
  (1500, 600) and put back; keyboard input is sent only while a window of the test is in the foreground and
  clicks only onto a window of the test. Keyboard layout tests load the layouts they use with
  LoadKeyboardLayoutW(KLF_NOTELLSHELL) and unload them again; the user's own layouts are never unloaded or
  reordered.
not_covered: >
  Win+Left/Right snapping, Win+Shift+arrows (other monitors), minimizing (Win+Down on a normal window,
  SC_MINIMIZE: left out because the oracle's foreground changed afterwards), maximizing windows with
  WS_EX_TOOLWINDOW or without WS_MAXIMIZEBOX, several monitors, a window that handles WM_GETMINMAXINFO itself.
