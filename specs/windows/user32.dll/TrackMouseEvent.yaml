# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/TrackMouseEvent
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. Learn: TrackMouseEvent, TRACKMOUSEEVENT,
  WM_MOUSELEAVE, WM_MOUSEHOVER, WM_NCMOUSELEAVE.
summary: >
  Asks for WM_MOUSELEAVE when the cursor leaves a window and/or
  WM_MOUSEHOVER when it rests over it for the hover time; TME_QUERY reports
  the current tracking, TME_CANCEL removes it. Each request yields at most
  one message.
interface:
  signature: "BOOL TrackMouseEvent(TRACKMOUSEEVENT* tme)"
  TRACKMOUSEEVENT: "winuser.h: cbSize u32, dwFlags u32, hwndTrack HWND (offset 8), dwHoverTime u32; 24 bytes on x64; cbSize must be 24"
  flags: "TME_HOVER 1, TME_LEAVE 2, TME_NONCLIENT 0x10, TME_QUERY 0x40000000, TME_CANCEL 0x80000000; HOVER_DEFAULT 0xFFFFFFFF (winuser.h)"
rules:
  query: "TME_QUERY returns 1 and fills flags, window and hover time: nothing tracked gives 0, NULL, 0; tracking leave on A gives 2, A, 0; hover with 100 ms gives 1, A, 100; HOVER_DEFAULT is reported as 400"
  leave: "TME_LEAVE with the cursor over A returns 1; nothing comes while the cursor stays; moving it onto B: B's move messages, then A gets WM_MOUSELEAVE; the tracking is then over (query 0)"
  leave_not_over: "TME_LEAVE for A while the cursor is over B returns 1 and A gets WM_MOUSELEAVE at once (posted: seen at the next queue read); the tracking is then over"
  repeat: "two TME_LEAVE requests in a row give one WM_MOUSELEAVE"
  child: "moving from A onto A's child C counts as leaving A (A gets WM_MOUSELEAVE after C's move messages); C tracked and the cursor moved back onto A: C gets WM_MOUSELEAVE after A's move messages; untracked windows get none"
  hover: "TME_HOVER with 100 ms and the cursor still: nothing after 30 ms, WM_MOUSEHOVER (keys, client coordinates of the cursor) within 330 ms; the hover tracking then ends (query 0)"
  hover_leave: "TME_HOVER | TME_LEAVE: WM_MOUSEHOVER first, after which the query shows only TME_LEAVE (2), then WM_MOUSELEAVE when the cursor leaves"
  cancel: "TME_CANCEL | TME_HOVER (or | TME_LEAVE) returns 1 and removes that tracking: no message comes (600 ms for hover; none on leaving); TME_CANCEL alone returns 1"
  flags_zero: "flags 0 returns 1"
  other_thread: "TME_LEAVE for a window of another thread of the process returned 1, error 0"
  nonclient: "TME_NONCLIENT | TME_LEAVE with the cursor in the client area returns 1 and the window gets WM_NCMOUSELEAVE at once; DefWindowProc tracks the non-client area by itself: a framed window whose caption the cursor enters gets WM_SETCURSOR (hit 2), WM_NCMOUSEMOVE (hit 2) and, if a client TME_LEAVE was pending, WM_MOUSELEAVE; moving from the caption into the client area sends WM_NCHITTEST, WM_SETCURSOR, WM_MOUSEMOVE, then WM_NCMOUSELEAVE"
errors:
  cbsize: "cbSize 0, 16 or 32: 0, ERROR_INVALID_PARAMETER (87)"
  window: "hwndTrack NULL or a made-up handle: 0, ERROR_INVALID_WINDOW_HANDLE (1400)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "WM_MOUSEHOVER arrives after the hover time (100 ms requested: between 30 and 330 ms after the call)"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Mouse
  input in these tests is SendInput button events at the cursor, and cursor
  moves by SetCursorPos; a window is printed as its tag letter (A, B, ...),
  "ours" (of the test, no tag), "other" (another process) or "null".
not_covered: >
  TME_NONCLIENT | TME_HOVER (WM_NCMOUSEHOVER); hover time changes by small
  cursor moves. DPI awareness other than unaware (the tests have no
  manifest), several monitors, other keyboard layouts than German, IME,
  touch and pen, hooks, menus and the menu loop.
