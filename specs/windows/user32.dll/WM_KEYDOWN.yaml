# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/WM_KEYDOWN.yaml
id: windows/api/user32.dll/WM_KEYDOWN
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, one monitor 1920x1080 at 100 %, 96 dpi), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner's \"keeper\" window in the foreground; keyboard events are injected with SendInput (virtual key and the scan code of the keyboard layout, press and release) while a window of the test is the foreground window; the pointer is parked at (1500, 600); no mouse is attached; every test ran twice with identical output; the test programs carry no manifest (common controls 5.82, no visual styles)"
  observed_by: spec-win-focus-keys
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above (Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers). Microsoft Learn: SetFocus, GetFocus, GetGUIThreadInfo, GUITHREADINFO, AttachThreadInput, GetInputState, GetKeyState, GetAsyncKeyState, GetQueueStatus, SendInput, PeekMessage, TranslateMessage, PostMessage, SetForegroundWindow, WM_KEYDOWN, WM_KEYUP, WM_CHAR, WM_SETFOCUS, WM_KILLFOCUS, "About Keyboard Input", "Keyboard Input Overview", "Message Queue"; winuser.h for constants and layouts. The conformance tests of Wine, its source and ReactOS were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Chrome for Windows types a URL right after Ctrl+L. On Windows no key is lost on the way: keyboard messages are routed to the window that has the focus when the thread reads them, not to the window that had it when the key was sent. Observed with window P holding three edit controls E, F, G (focus on E) and keys injected with SendInput, also while a handler moves the focus. In every case below no key was lost, none went to the window that no longer had the focus, and the order of the keys was kept.
interface:
  signature: "WM_KEYDOWN (0x0100), wParam the virtual key, lParam repeat count, scan code and flags: delivered to the window that has the keyboard focus at the moment the thread reads the key"
rules:
  routed_when_read: "A key waiting in the queue goes to the window that has the focus when the thread reads it. Ctrl+L, a, b, c (Ctrl down, L down, L up, Ctrl up, then a, b, c each pressed and released) sent in ONE SendInput call and left unread for 120 ms, with the key-down handler of E calling SetFocus(F) when it sees L with Ctrl down: E gets WM_KEYDOWN vk=0x11 (lParam 0x001d0001) and WM_KEYDOWN vk=0x4c (0x00260001), then E WM_KILLFOCUS(other=F) and F WM_SETFOCUS(other=E) while the handler runs, then E WM_CHAR 0x0c (see WM_CHAR); the key-ups of L (0xc0260001) and Ctrl (0xc01d0001) go to F, and F gets WM_KEYDOWN, WM_CHAR and WM_KEYUP for a (0x61), b (0x62) and c (0x63). The text of F is \"abc\", the text of E is empty, the focus is F."
  same_for_every_timing: "The same sequence (the same messages, the same texts) when: the loop takes the accelerator itself (it removes the key-down of L, calls SetFocus(F) and does not dispatch it; then E got only the Ctrl key-down, F gets the key-ups of L and Ctrl and a, b, c); Ctrl+L is sent alone, read, and then a, b and c follow each in its own SendInput call with a read after each; Ctrl+L, a, b, c are four SendInput calls back to back with nothing read until 120 ms later. Typing right after the focus change loses nothing."
  handler_lets_key_go_on: "A key-down handler that calls SetFocus(F) for the key x and lets the key go on (calls the original procedure): E gets the key-down of x (in the handler GetFocus is E, GetKeyState(x) is down), then E WM_KILLFOCUS(other=F), F WM_SETFOCUS(other=E); the original procedure then handles the key for E and E gets the WM_CHAR of x (the text of E is \"x\"); the key-up of x goes to F. A following y goes to F whole (key-down with GetFocus F, WM_CHAR, key-up): the text of F is \"y\". Sent one call at a time with a read between, or x and y in one call left unread for 120 ms, the result is the same. With the focus moved to G instead of F the texts are E \"x\", G \"y\"."
  key_state_in_handlers: "GetKeyState follows the messages the thread has read so far, not the keys that were sent: with Ctrl+L and a all sent in one call and left unread, the key-down handler of Ctrl sees Ctrl down; the one of L sees Ctrl down and L down; the key-down of a (read after the key-ups of L and Ctrl) sees Ctrl up and a down."
  posted_before_input: "A message posted with PostMessage to a window of the thread is read before keyboard messages that were inserted earlier: a typed (inserted), WM_USER+1 posted to E, 100 ms later WM_USER+2 posted, b typed, nothing read meanwhile: E gets WM_USER+1, WM_USER+2, then the key-down, WM_CHAR and key-up of a, then those of b; likewise a message posted to F after a was typed with the focus on E reaches F first, then E gets a. The input queue keeps the keys in order among themselves but a posted message does not wait for them."
  no_loss: "No scene lost a key: the number of key-downs delivered equals the number sent, with the exception of the foreground change in GetGUIThreadInfo (the keys that were waiting for the old foreground window when another thread's window became the foreground were not delivered to any window)."
errors:
  none: "The message has no error result."
side_effects: "none beyond the rules above"
threading: "the keyboard focus, the active window and the key state belong to the input queue of a thread (threads whose input is attached share them); a window belongs to the thread that created it; tests with a second thread use one extra thread"
ordering: []
timing:
  typical: "the messages after a change arrive within about 100 ms"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations and a message log; run with poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because injected keys need the visible desktop. Window P (520x260 at 100,100, WS_EX_NOACTIVATE) is made the foreground window and has three EDIT children E, F, G (200x26 at x 10, y 10/50/90; the edit procedure is replaced by a logging one that calls the original); the focus starts on E; tests that need a second thread start one with its own window Q (WS_EX_NOACTIVATE, 320x120 at 700,100), its EDIT child H, and a message loop of GetMessage, TranslateMessage, DispatchMessage. Every scene prints the key and focus messages of every window of the test in the order they arrived under the window's tag letter (P, E, F, G, Q, H; handles are never printed), repeated identical lines once, then the texts of the three edits, the focus and whether a window of the test is in the foreground; scenes with a handler that moves the focus say so in the log. Keys sent in one SendInput call are left in the queue for 120 ms (no message read) where a scene says so; otherwise the loop reads them as they come. A scene takes about 300 to 600 ms and ends with the window destroyed.
not_covered: >
  Auto-repeat of a held key (lParam repeat counts above 1), dead keys and IME composition, other keyboard layouts, system keys (WM_SYSKEYDOWN with Alt), a window of another process, keys from a real keyboard (the oracle injects them with SendInput), accelerator tables (TranslateAccelerator).
