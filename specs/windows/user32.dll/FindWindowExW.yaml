# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/FindWindowExW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3b
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Finds a child (or top-level) window by class and title, walking the children of a parent in z order from the
  window after hwndChildAfter. Chrome's browser calls it twice in a run (S3), for the window of an earlier
  instance under HWND_MESSAGE (class and title of the profile), and does not find it.
interface:
  signature: "HWND FindWindowExW(HWND hwndParent, HWND hwndChildAfter, LPCWSTR lpszClass, LPCWSTR lpszWindow)"
rules:
  parent: "a NULL parent searches the children of the desktop (top-level windows and message-only windows); the desktop window as the parent gives the same as NULL; HWND_MESSAGE (-3) searches the message-only windows only, so a top-level window is not found below it; a child window is not found from the desktop"
  order: "the search goes down the z order from the top: the newest top-level window first, topmost windows before the others; with hwndChildAfter it goes on below that window (a window that is the last gives NULL); a walk that passes the found window as the next hwndChildAfter lists all matches in z order"
  match_class: "the class name is compared without case; a class by atom (a pointer with the atom in the low word) works; a name that is no class returns NULL and leaves the last error as it was; a class of 256 or more characters or an empty class pointer string finds nothing"
  match_title: "the title is compared whole and without case: no prefix and no wildcard; the title follows SetWindowTextW; NULL means any title; with a title and a class both have to match"
  what_is_found: "hidden, disabled, minimized and message-only windows and windows of other threads are found; a window of a thread that ended is not; a destroyed window is not; system classes (Button) work with their text"
  after_check: "hwndChildAfter that is not a child of the parent returns NULL (last error left alone); an invalid parent or after handle returns NULL with the last error 1400"
  message_only: "a message-only window (created with HWND_MESSAGE as the parent) is found with the parent HWND_MESSAGE by title, by class, by both, and also with a NULL parent by title; found from another thread too; Chrome's lookup of a window that does not exist (a class and a title) gives NULL with the last error unchanged"
errors:
  invalid_window_handle: "1400: invalid parent or after handle"
  not_found: "the last error is left as it was"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, ole32.dll and oleaut32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and printing booleans, counts and error codes, never
  handles, addresses, times or machine ids; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md), twice per run, with identical output. Test windows are placed in the top-left
  1000x500 pixels and the cursor is parked at (1500, 600). The COM tests run each sequence on a thread of its
  own (every thread starts without COM state). Where a call crashes on the oracle (a NULL path count in
  QueryDisplayConfig, a garbage handle in UnregisterPowerSettingNotification, CoRegisterMessageFilter on a
  thread without COM) the case is left out.
not_covered: >
  Windows of other processes (the tests find only their own), more than a few hundred windows.
