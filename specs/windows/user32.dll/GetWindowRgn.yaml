# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetWindowRgn
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64; the tests added by spec-win-gui-b4 were run on build 26200.9974"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c, spec-win-gui-b4
  date: 2026-11-09, 2026-11-14
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above). Learn pages "Layered Windows" (Window Features),
  "Using Cursors", "About Icons", "SetLayeredWindowAttributes",
  "UpdateLayeredWindow", "BLENDFUNCTION", "SetWindowRgn", "LoadImage",
  "CreateIconIndirect", "ICONINFO", "CURSORINFO"; the pixel values were read
  back from the screen with GetPixel on the screen DC after DwmFlush (BitBlt
  with and without CAPTUREBLT gives the same).
summary: >
  Copies the window's region (window coordinates) into hRgn and returns its
  type: SIMPLEREGION (2) for a rectangle, COMPLEXREGION (3) for a union of
  rectangles or an ellipse, NULLREGION (1) for an empty one; ERROR (0) for a
  window without a region, which leaves hRgn as it was.
interface:
  signature: "int GetWindowRgn(HWND hWnd, HRGN hRgn)"
rules:
  types: "Rectangle (10,10,50,40): 2 and the copy is that rectangle. Two rectangles (0,0,20,20)+(40,30,60,50): 3, box (0,0,60,50), two rectangles. Ellipse (0,0,60,40): 3, box (0,0,59,39). Empty region: 1, box (0,0,0,0). A region larger than the window (-50,-50,500,500): 2, returned as it is (not clipped)."
  no_region: "A window with no region (or after SetWindowRgn(NULL)): 0, no last error, the supplied region is left as it was."
  copy: "The result is a copy: offsetting it does not change the window's region. A copy taken earlier is not changed by a later SetWindowRgn. The region type of the copy is OBJ_REGION (8)."
  shape: "PtInRegion on the copy of a rectangle (10,10,50,40): (9,9) out, (10,10) in, (49,39) in, (50,39) and (49,40) out. On the ellipse: (30,20) in, (0,0), (59,0), (0,39), (59,39), (30,39) out, (30,0), (29,1), (2,12), (1,20), (58,20), (0,20) in, (59,20) out. Two rectangles: (30,10) out, (50,40) in, (20,20) out, (19,19) in."
  window_moves: "Moving or resizing the window (400,300, 150x90) or hiding it does not change the returned region."
  ellipse_rows: "the rectangles of an elliptic region (CreateEllipticRgn(l,t,r,b); the window's copy is the same as the region as made, also for CreateRoundRectRgn with the corner of the whole rectangle; every statement below was checked on all widths and heights 1..14 and on many larger ones up to 130): (1) the region lies in the box (l, t, r-1, b-1), one pixel less than the rectangle in both directions (31x21 gives the box 0,0,30,20); for widths and heights from about 8 on it touches all four sides of that box, small and flat sizes do not always (10x7 and 12x7 stay one pixel away from the left and right side, 6x5 three pixels wide at 1..3 in a box 5 wide). (2) Degenerate sizes: a width or height of 1 gives the empty region (type 1; GetWindowRgnBox gives -(the window origin) four times); 2 high gives one rectangle 0:0-(w-1) (type 2); 2 wide gives one column of width 1 and h-1 rows (type 2); 3x3 is empty; the other narrow sizes (3 wide or high, 4 high) are type 2 or 3 shapes that are smaller than the box (3 wide: one rectangle 2 pixels wide that misses the first and last row, two rows of them from heights of 13); the visible tests print every size from 1 to 9 and the boxes of 14 heights. (3) One rectangle per row (the rows are 0..h-2) and equal neighbouring rows are ONE rectangle of several rows (GetRegionData, GetRgnBox); the region is almost always the same in the upper and lower half (row y equals row h-2-y; not so for 7x8, 12x8 and 17x17, where the lower half has a row that differs by a pixel, and for a 45x45 round rectangle with a 16x16 corner) and the half widths never decrease towards the middle; a few middle rows have the full width w-1. Each row has a width m (any whole number) and is centred: left = (w-1-m)/2. When m has the other parity than w-1 the centre is not on a pixel and the row is one pixel off: to the left (left = (w-1-m-1)/2) for w-1 of 9 and more (101x101 and 10x10 and 12x12 and 11x13 and 17x17 and 101x61 have such rows), to the right for w-1 of 3 and 5 (4x7, 4x11, 4x14, 6x13); in 1812 rows of the data a row is off-centre exactly when its width has the other parity than w-1. The transposed ellipse (h x w) is the transpose of the region. The position does not matter: (5,7,65,47) is the 60x40 ellipse shifted by (5,7), also with negative coordinates; a reversed rectangle (60,40,0,0) is the same as (0,0,60,40). (4) THE ROWS ARE NOT THE PIXELS WHOSE CENTRES LIE INSIDE THE ELLIPSE, and no midpoint or Bresenham arc matches them: the rows near the poles are much narrower, the rows near the middle sit between that and the full width. For 31x21 (left,right exclusive, rows from the top): 0:13,17 1:8,22 2:6,24 3:4,26 4:3,27 5:2,28 6..8:1,29 9..10:0,30 11..13:1,29 14:2,28 15:3,27 16:4,26 17:6,24 18:8,22 19:13,17; a pixel-centre test would give a top row of about 9 pixels (11..19) and no full-width rows. The half width of a row is close to that of the exact ellipse with the semi-axes (w-1)/2 and (h-1)/2 taken at the OUTER edge of the row (the edge nearest its pole), rounded to a whole pixel with an error of up to about 0.65 pixel in either direction; the pole row is 1 to 3 pixels wider than that formula says (it would be one point). No formula tried gives the rows exactly (a rounded outer-edge sample gets about 85 percent of the rows right and all rows of 76 of the 196 sizes of 1..14): an implementer needs the data, which the visible tests give for all sizes up to 9x9 and for ten larger ones. Top two rows (left,right exclusive) of other sizes: 20x10: 8,11 3,16; 30x20: 13,16 8,21; 24x24: 10,13 7,16; 40x40: 18,21 13,26; 64x64: 29,34 23,40; 100x60: 46,53 36,63; 120x30: 50,69 35,84."
  roundrect_rows: "CreateRoundRectRgn(l,t,r,b,cw,ch) (the window's copy as for an ellipse): the box is (l,t,r-1,b-1) as for an ellipse; a corner width or height of 0 gives the plain rectangle (type 2: 60x20 gives one rectangle 0..19:0-59); a corner of 1 gives the plain rectangle in 60x20 and a rectangle whose first and last row lack the last pixel in 80x50 (0:0-78 1..48:0-79 48:0-78), so it depends on the size; a corner of 3x3 in 60x20: 0:1-58 1..17:0-59 18:1-58; a corner larger than the rectangle is the ellipse of the whole rectangle (36x36 with 100x100 corners equals the 36x36 ellipse: 0:16,19 1:11,24 2:9,26 ...). The corner rows are those of an ellipse of the corner's size (cw x ch) but not always row for row, the straight part between the corners is full width. Examples (rows: left,right exclusive, rows counted from the top, the lower corners mirror the upper ones apart from a pixel in odd cases such as 45x45 with 16x16, whose rows 40 and 41 are 2,42 and 2,41): 30x24 corner 10x10: 0:4,25 1:2,27 2..3:1,28 4..18:0,29; 50x30 corner 14x9: 0:6,43 1:2,47 2..3:1,48 4..24:0,49; 26x26 corner 8x8: 0:3,22 1..2:1,24 3..21:0,25; 50x50 corner 5x5: 0:2,47 1:1,48 2..46:0,49; 64x36 corner 18x18: 0:8,55 1:5,58 2:3,60 3..4:2,61 5..7:1,62 8..26:0,63; 90x30 corner 9x21: 0:4,85 1:3,86 2:2,87 3..6:1,88 7..21:0,89; 70x50 corner 25x30: 0:11,58 1:8,61 2:6,63 3:5,64 4:4,65 5..6:3,66 7..8:2,67 9..12:1,68 13..35:0,69."
errors:
  no_region: "0, last error not set"
  bad_supplied_region: "NULL: 0 without an error; a made-up handle or a brush handle: 0 with ERROR_INVALID_HANDLE (6)"
  bad_window: "NULL, made-up or destroyed window: 0, ERROR_INVALID_WINDOW_HANDLE (1400)"
