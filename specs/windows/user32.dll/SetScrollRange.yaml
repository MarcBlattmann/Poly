# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/SetScrollRange.yaml
id: windows/api/user32.dll/SetScrollRange
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, controls draw into memory bitmaps with WM_PRINT, nothing is shown on a screen, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-5
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (the programs are Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers; the test fonts are TrueType files the test writes itself, so no Microsoft font is involved). Microsoft Learn reference pages of the functions, messages and notifications named here (Winsock, "Scroll Bars", "Dialog Boxes", "Common Controls", "Shell Functions"); winsock2.h, winuser.h, wingdi.h, commctrl.h, shlobj.h, shellapi.h and winerror.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  The older form of SetScrollInfo(SIF_RANGE): sets the range of a window's scroll bar or of a control; returns TRUE; the position and page are kept (the position is moved into the new range).
interface:
  signature: "BOOL SetScrollRange(HWND hWnd, int nBar, int nMinPos, int nMaxPos, BOOL bRedraw)"
rules:
  result: "TRUE (1) for a window with the bar or without the style, for SB_CTL, and (observed) also for an undefined bar value; the range is stored and GetScrollRange / GetScrollInfo return it"
  position_and_page: "the position is moved into the new range (position 80, range 0..50: the position becomes 50); a page that was set is kept (range 0..200 with page 10 and position 41: page 10, position 41)"
  hiding: "a range with min == max (7..7) removes the bar of a window (style bit cleared, client area restored, as for SetScrollInfo); a larger range shows it again; a scroll bar control with 9..9 stays but is not visible afterwards in the test (IsWindowVisible 0 there for all child windows in session 0)"
  limits: "negative bounds work (-100..-50, -32767..32767); 0..0x8000 and 0..0x7FFFFFFF are accepted; a range whose difference does not fit in a signed 32-bit number (-1..0x7FFFFFFF, i32::MIN..0, i32::MIN..i32::MAX) fails and the old range stays; min above max (50..10) fails with ERROR_INVALID_SCROLLBAR_RANGE (1448) and the range stays"
  sb_both: "SB_BOTH returns TRUE; in the test only the vertical bar changed (0..30) and the horizontal bar kept 0..100"
  window_without_style: "SetScrollRange(SB_VERT) on a window made without WS_VSCROLL returns TRUE, creates the bar (the style bit is set and the client width shrinks) and GetScrollRange reads 0..100 back; the same for SB_HORZ (0..40); SB_CTL on an ordinary window and the undefined bars 4 and -1 return TRUE too (GetScrollRange of SB_CTL there returns TRUE and leaves the caller's numbers untouched; GetScrollRange of bar 4 fails with 87)"
  controls: "on a scroll bar control the range is the control's (5..25 reads back); 9..9 on a control returns TRUE"
  redraw: "the redraw flag does not change what is stored"
errors:
  bad_window: "a NULL window, a made-up handle and a destroyed window: FALSE with ERROR_INVALID_WINDOW_HANDLE (1400)"
  bad_range: "min above max or a difference that does not fit: FALSE with ERROR_INVALID_SCROLLBAR_RANGE (1448)"
side_effects: "none beyond the rules above"
threading: "the window's own thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes, counts, booleans and sizes that come from the test's own fonts and from system metrics at 96 dpi; no line holds a handle, a pointer or a machine, user or time. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is not printed (it is not specified).
not_covered: >
  Dragging the thumb and clicking the arrows (WM_HSCROLL / WM_VSCROLL generation, SIF_TRACKPOS during a drag) and the drawn bar: they need real mouse input; GetScrollBarInfo; scroll bars of a window made right to left; DPI scaling of the bar sizes.
