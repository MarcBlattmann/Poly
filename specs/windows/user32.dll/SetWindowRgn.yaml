# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetWindowRgn
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above). Learn pages "Layered Windows" (Window Features),
  "Using Cursors", "About Icons", "SetLayeredWindowAttributes",
  "UpdateLayeredWindow", "BLENDFUNCTION", "SetWindowRgn", "LoadImage",
  "CreateIconIndirect", "ICONINFO", "CURSORINFO"; the pixel values were read
  back from the screen with GetPixel on the screen DC after DwmFlush (BitBlt
  with and without CAPTUREBLT gives the same). Region rectangles: left and
  top edges inside, right and bottom outside.
summary: >
  Gives a window a shape: its region, in window coordinates. On success
  (return 1) the system owns the region handle, which stops being a region
  for the caller. Only the part of the window inside the region is drawn and
  hit-tested; the window rectangle and client rectangle do not change. A
  NULL region removes it.
interface:
  signature: "int SetWindowRgn(HWND hWnd, HRGN hRgn, BOOL bRedraw)"
rules:
  return: "1 on success, 0 on failure. A made-up region handle returns 0 without setting a last error and changes nothing."
  ownership: "After a successful call the handle is no longer a region: GetRgnBox returns 0, GetObjectType 0, DeleteObject FALSE (no last error set). Replacing a region frees the old one (its handle is dead the same way). Passing the same handle a second time returns 0 and leaves the window's region as it was."
  messages: "With bRedraw TRUE and a region the call sends WM_WINDOWPOSCHANGING, WM_NCCALCSIZE (wParam 1) and WM_WINDOWPOSCHANGED (flags 0x1001837), no painting message. With bRedraw TRUE and a NULL region: WM_WINDOWPOSCHANGING, WM_NCCALCSIZE, WM_NCPAINT, WM_ERASEBKGND, WM_WINDOWPOSCHANGED and WM_PAINT (flags 0x1001837). With bRedraw FALSE: only the three position messages (flags 0x100183F)."
  shape_hit_test: "Region (10,10,50,40) on a window at (250,250) covers the screen points x 260..299, y 260..289: WindowFromPoint finds the window at (260,260), (265,265) and (299,265) and the window below at (255,265), (265,290), (300,265), (340,300) and everywhere else in the window rectangle. WM_NCHITTEST is sent only to the window that is found. The screen shows the window inside the region only."
  window_coordinates: "The region moves with the window (moved to 300,300: (315,315) hits, (305,305) does not) and does not change when the window is resized (200x120: the same part)."
  shapes: "An empty region hides the whole window from hit testing and from the screen. A region larger than the window (-50,-50,500,500) does not enlarge it (hits only inside the window rectangle). A union of two rectangles and an ellipse (0,0,60,40) cut the window accordingly (ellipse centre in, corner out)."
  removal: "SetWindowRgn(NULL) removes the region: hit testing covers the whole window again; calling it again returns 1."
  child_windows: "A child window can have a region (1)."
  window_rect: "GetWindowRect and GetClientRect are unchanged by every case."
errors:
  bad_window: "NULL, made-up or destroyed window: 0, ERROR_INVALID_WINDOW_HANDLE (1400)"
  bad_region: "made-up region handle: 0, last error not set"
  same_handle: "the same region handle twice: 0, last error not set"
side_effects: "Takes ownership of hRgn; changes hit testing and drawing of the window."
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows).
not_covered: >
  SetWindowRgn on windows of other threads or processes, regions with a
  transform, DPI-scaled windows, regions on layered windows beyond the basic
  hit test. Several monitors, other system DPIs (the oracle is one 1920x1080
  monitor at 96 DPI, scale 100%), a manifest (the tests have none: awareness
  is set with the API), other keyboard layouts than German, installed input
  methods (the oracle has none active), touch and pen, hooks, menus and
  dialogs, comctl32 controls, themed (visual style) painting, clipboard
  contents put there by other programs or by the cloud clipboard and
  clipboard history.
