# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetCapture
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. Learn: SetCapture, ReleaseCapture, GetCapture,
  WM_CAPTURECHANGED, WM_CANCELMODE, "About Mouse Input".
summary: >
  Makes a window of the calling thread the mouse capture window: from then
  on the mouse messages of the thread's input go to it wherever the cursor
  is, with client coordinates relative to it (negative or past its edges),
  until ReleaseCapture, another SetCapture, or the window is disabled or
  destroyed. Returns the previous capture window of the thread's input (NULL
  if none).
interface:
  signature: "HWND SetCapture(HWND hwnd)"
  return: "the previous capture window (NULL when there was none); SetCapture(A) twice returns A the second time"
rules:
  captured_messages: "with A capturing and no button down, moving the cursor over B (same thread) and over C (a window of another thread of the process) sends A WM_MOUSEMOVE with client coordinates relative to A (330,40 and 630,40 for a 200x150 A at 100,100); no WM_NCHITTEST and no WM_SETCURSOR while captured; B and C get nothing"
  captured_buttons: "a left button pressed inside A while A captures: WM_NCHITTEST, then WM_LBUTTONDOWN to A (no WM_SETCURSOR); dragged over B and C: WM_MOUSEMOVE keys=MK_LBUTTON to A; released over C: WM_LBUTTONUP to A with client 630,40; the capture stays after the button-up"
  changed_on_set: "SetCapture(A) with no capture before, then SetCapture(A) again: A got one WM_CAPTURECHANGED with lParam A itself; SetCapture(B) while A captures returns A and sends A WM_CAPTURECHANGED lParam = B, synchronously, before SetCapture returns"
  odd_windows: "a hidden window, a disabled window and a child window can be given the capture (returns NULL, GetCapture is that window); a window of another thread: returns NULL, error 0, GetCapture stays NULL (no capture set)"
  null: "SetCapture(NULL) with no capture: returns NULL, error 0; SetCapture(NULL) while A captures: returns A, releases the capture (GetCapture NULL) and A gets WM_CAPTURECHANGED lParam NULL"
  hide: "hiding the capture window (ShowWindow SW_HIDE) keeps the capture (GetCapture still that window); only the hide and activation messages come"
  disable: "EnableWindow(capture window, FALSE) releases the capture: it gets WM_CANCELMODE, WM_CAPTURECHANGED lParam NULL, then WM_ENABLE 0; GetCapture NULL"
  destroy: "destroying the capture window ends the capture (GetCapture NULL) without WM_CAPTURECHANGED to it (only WM_WINDOWPOSCHANGING/CHANGED, WM_DESTROY, WM_NCDESTROY were seen); destroying the parent of a capturing child sends the child WM_CANCELMODE and WM_CAPTURECHANGED lParam NULL after the parent's WM_WINDOWPOSCHANGED (hide) and before the deactivation messages"
errors:
  bad_handle: "a made-up handle: NULL, ERROR_INVALID_WINDOW_HANDLE (1400), GetCapture unchanged (NULL)"
side_effects: "none beyond the rules above"
threading: "capture belongs to the thread's input queue: see GetCapture"
ordering:
  - "ReleaseCapture after a capture: the old window gets WM_CAPTURECHANGED (lParam NULL) during the call, then the window under the cursor gets WM_NCHITTEST, WM_SETCURSOR, WM_MOUSEMOVE (a synthesized move) when the queue is read"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Mouse
  input in these tests is SendInput button events at the cursor, and cursor
  moves by SetCursorPos; a window is printed as its tag letter (A, B, ...),
  "ours" (of the test, no tag), "other" (another process) or "null".
not_covered: >
  Capture during a move/size loop or a menu, the title-bar drag; a capture
  window of another process. Learn says moves over another thread's window
  reach the capture window only with a button down; with C a
  WS_EX_NOACTIVATE popup of another thread of the same process they reached
  A without one. DPI awareness other than unaware (the tests have no
  manifest), several monitors, other keyboard layouts than German, IME,
  touch and pen, hooks, menus and the menu loop.
