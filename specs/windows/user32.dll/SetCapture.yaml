# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetCapture
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2, spec-win-gui-b3
  date: 2026-11-02, 2026-11-09 (hide/destroy/thread rules after the held-out feedback), 2026-11-10
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. Learn: SetCapture, ReleaseCapture, GetCapture,
  WM_CAPTURECHANGED, WM_CANCELMODE, "About Mouse Input".
summary: >
  Makes a window of the calling thread the mouse capture window: from then
  on the mouse messages of the thread's input go to it wherever the cursor
  is, with client coordinates relative to it (negative or past its edges),
  until ReleaseCapture, another SetCapture, or the window is disabled or
  destroyed. Returns the previous capture window of the thread's input (NULL
  if none).
interface:
  signature: "HWND SetCapture(HWND hwnd)"
  return: "the previous capture window (NULL when there was none); SetCapture(A) twice returns A the second time"
rules:
  captured_messages: "with A capturing and no button down, moving the cursor over B (same thread) and over C (a window of another thread of the process) sends A WM_MOUSEMOVE with client coordinates relative to A (330,40 and 630,40 for a 200x150 A at 100,100); no WM_NCHITTEST and no WM_SETCURSOR while captured; B and C get nothing"
  captured_buttons: "a left button pressed inside A while A captures: WM_NCHITTEST, then WM_LBUTTONDOWN to A (no WM_SETCURSOR); dragged over B and C: WM_MOUSEMOVE keys=MK_LBUTTON to A; released over C: WM_LBUTTONUP to A with client 630,40; the capture stays after the button-up"
  changed_on_set: "SetCapture(A) with no capture before, then SetCapture(A) again: A got one WM_CAPTURECHANGED with lParam A itself; SetCapture(B) while A captures returns A and sends A WM_CAPTURECHANGED lParam = B, synchronously, before SetCapture returns"
  odd_windows: "a hidden window, a disabled window and a child window can be given the capture (returns NULL, GetCapture is that window); a window of another thread: returns NULL, error 0, GetCapture stays NULL (no capture set)"
  null: "SetCapture(NULL) with no capture: returns NULL, error 0; SetCapture(NULL) while A captures: returns A, releases the capture (GetCapture NULL) and A gets WM_CAPTURECHANGED lParam NULL"
  hide: "hiding the capture window (ShowWindow SW_HIDE, or SetWindowPos with SWP_HIDEWINDOW) keeps the capture: GetCapture still returns it (a hidden window can hold the capture), no WM_CANCELMODE, no WM_CAPTURECHANGED, when the window is not active or when another window takes over the activation. An INACTIVE capture window X (A or E active) gets only WM_SHOWWINDOW(0) (not with SetWindowPos), WM_WINDOWPOSCHANGING (pos/size 0, flags 0x97) and WM_WINDOWPOSCHANGED (flags 0x20001897; 0x1897 when X has WS_EX_NOACTIVATE; a hidden child 0x1897); the active window stays. An ACTIVE capture window X hidden with SW_HIDE (or X's active parent hidden while the child X captures) hands the activation to the thread's earlier active window A: X WM_SHOWWINDOW(0), WM_WINDOWPOSCHANGING (flags 0x83), WM_WINDOWPOSCHANGED (0x20001887; 0x1887 with WS_EX_NOACTIVATE), X WM_NCACTIVATE(0, lParam = A), WM_ACTIVATE(WA_INACTIVE, other = A), A WM_WINDOWPOSCHANGING (flags 0x3), WM_WINDOWPOSCHANGED (0x1803, only if it moved in the z-order), WM_NCACTIVATE(1), WM_ACTIVATE(WA_ACTIVE 1, other = X), X WM_KILLFOCUS(other = A), A WM_SETFOCUS(other = X); GetCapture stays X. With SetWindowPos(SWP_HIDEWINDOW | SWP_NOACTIVATE) the active X stays the active and foreground window (hidden), only WM_WINDOWPOSCHANGING (0x97) and CHANGED (0x20001897) come. Which window takes the activation: see GetForegroundWindow (handover_same_thread; if the earlier active window is disabled the topmost eligible window of the thread takes it). Minimizing the capture window (SW_MINIMIZE) also keeps the capture; the minimize and activation messages are those of GetForegroundWindow minimize_foreground. A minimized capture window with WS_EX_NOACTIVATE is placed at (0, 1052), 160x28 (the bottom-left corner of the 1080-high screen; WM_WINDOWPOSCHANGED flags 0x8130), where a minimized window without that style goes to (-32000, -32000). Minimizing an INACTIVE capture window X while A is active and E was active before A (all three visible): X gets only the position messages (WM_WINDOWPOSCHANGING 0x8170, CHANGED 0x8130), but the activation moves from A to E all the same: A WM_NCACTIVATE(0, lParam = E), WM_ACTIVATE(WA_INACTIVE, other = E), E WM_WINDOWPOSCHANGING (0x3), WM_WINDOWPOSCHANGED (0x1803), WM_NCACTIVATE(1), WM_ACTIVATE(1, other = A), A WM_KILLFOCUS(other = E), E WM_SETFOCUS(other = A); GetCapture stays X (the rule is GetActiveWindow minimize_inactive: SW_MINIMIZE of any window hands the activation on as if that window had been the active one, here to the window that was active before A)"
  hide_nobody_takes_over: "when the hidden or destroyed ACTIVE capture window has no window to hand the activation to (its thread has no earlier active window it can use: nothing else eligible), the capture is cancelled by the deactivation: right after the window's WM_WINDOWPOSCHANGED comes WM_CANCELMODE and WM_CAPTURECHANGED(lParam NULL) to the capture window, then WM_NCACTIVATE(0, lParam 0), WM_ACTIVATE(0, other NULL), WM_ACTIVATEAPP(0) to every top-level window of the thread, WM_KILLFOCUS(other NULL); GetCapture NULL, the thread has active NULL and focus NULL, the foreground is a window of another process. Seen for DestroyWindow (flags 0x97 / 0x20001897) and for SW_HIDE of the active window when no window of the thread had been active before"
  disable: "EnableWindow(capture window, FALSE) releases the capture: it gets WM_CANCELMODE, WM_CAPTURECHANGED lParam NULL, then WM_ENABLE 0; GetCapture NULL"
  destroy: "destroying the capture window ends the capture (GetCapture NULL) without WM_CAPTURECHANGED to it when it is inactive or another window takes over the activation: X WM_WINDOWPOSCHANGING (flags 0x97), WM_WINDOWPOSCHANGED (0x20001897; 0x1897 with WS_EX_NOACTIVATE), and for an active X also X WM_NCACTIVATE(0, lParam = A), WM_ACTIVATE(0, other = A), A WM_WINDOWPOSCHANGING (0x3), WM_WINDOWPOSCHANGED (0x1803), WM_NCACTIVATE(1), WM_ACTIVATE(1, other = X), X WM_KILLFOCUS(other = A), A WM_SETFOCUS(other = X), then WM_DESTROY, WM_NCDESTROY. Destroying an INACTIVE parent or grandparent of the capturing child or grandchild sends only the parent's WM_WINDOWPOSCHANGING (0x97) / CHANGED (0x20001897): the child gets no WM_CANCELMODE and no WM_CAPTURECHANGED, the capture is gone (GetCapture NULL); destroying the capturing child itself sends it WM_SHOWWINDOW(0), WM_WINDOWPOSCHANGING (0x97), WM_WINDOWPOSCHANGED (0x1897) and nothing about the capture. When the destroyed window is the ACTIVE window and nobody takes over (hide_nobody_takes_over), the capture window (the destroyed window itself, or the capturing child of the destroyed parent, after the parent's WM_WINDOWPOSCHANGED) gets WM_CANCELMODE and WM_CAPTURECHANGED(NULL) before the deactivation messages"
  disable_parent: "EnableWindow(parent, FALSE) of the parent of the capturing child does not end the capture: GetCapture is still the child (still enabled); only the parent gets WM_CANCELMODE and WM_ENABLE(0)"
  switch_capture: "SetCapture(Z) while a CHILD C captures: returns C, C gets WM_CAPTURECHANGED(lParam Z), GetCapture is Z; EnableWindow(Z, FALSE) then releases it (WM_CANCELMODE, WM_CAPTURECHANGED NULL, WM_ENABLE 0); SetCapture(Q) twice returns Q the second time and Q gets WM_CAPTURECHANGED(lParam Q); SetCapture(child of Q) while Q captures returns Q and Q gets WM_CAPTURECHANGED(lParam = the child)"
  threads: "every thread has its own capture: with T's window capturing in thread T, the main thread's GetCapture is NULL, SetCapture(A) in the main thread returns NULL and does not touch T's capture (T's GetCapture stays its window), ReleaseCapture in the main thread does not release T's, and SetCapture(T's window) from the main thread returns NULL with error 0 and sets nothing (GetCapture NULL)"
  failed_calls: "a failed SetCapture returns NULL (not the previous capture window), changes nothing and sends no message: a made-up handle (error 1400) or the handle of a destroyed window (NULL, 1400) or a window of another thread (error 0) while A captures leaves GetCapture = A; the desktop window and a window of another process (the window in front when the test starts, the runner's) return NULL with error 0 and set no capture. A minimized window and a message-only window can be given the capture (NULL, GetCapture is that window)"
errors:
  bad_handle: "a made-up handle: NULL, ERROR_INVALID_WINDOW_HANDLE (1400), GetCapture unchanged (NULL)"
side_effects: "none beyond the rules above"
threading: "capture belongs to the thread's input queue: see GetCapture"
ordering:
  - "ReleaseCapture after a capture: the old window gets WM_CAPTURECHANGED (lParam NULL) during the call, then the window under the cursor gets WM_NCHITTEST, WM_SETCURSOR, WM_MOUSEMOVE (a synthesized move) when the queue is read"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Mouse
  input in these tests is SendInput button events at the cursor, and cursor
  moves by SetCursorPos; a window is printed as its tag letter (A, B, ...),
  "ours" (of the test, no tag), "other" (another process) or "null".
not_covered: >
  Capture during a move/size loop or a menu, the title-bar drag; a capture
  window of another process. Learn says moves over another thread's window
  reach the capture window only with a button down; with C a
  WS_EX_NOACTIVATE popup of another thread of the same process they reached
  A without one. DPI awareness other than unaware (the tests have no
  manifest), several monitors, other keyboard layouts than German, IME,
  touch and pen, hooks, menus and the menu loop.
