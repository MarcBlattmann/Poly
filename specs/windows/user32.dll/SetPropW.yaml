# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetPropW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Attaches a pointer-sized value to the window under a name (a string, compared without regard to case, or an
  atom passed as MAKEINTATOM). Setting an existing name replaces the value. Chrome's browser calls it 5 times
  a run (S3), GetPropW once and RemovePropW 7 times.
interface:
  signature: "BOOL SetPropW(HWND hwnd, LPCWSTR name, HANDLE data)"
rules:
  value: "the value is kept as given: 0, 1, the largest 64-bit value and a value with only the high bit set read back equal; a stored 0 cannot be told from a missing property; SetPropW returns 1 (also when it replaces)"
  names: "names compare case-insensitively: a property set as 'Chrome_Prop' is read as 'chrome_prop' and 'NAME' finds 'Name'; a second SetPropW with another case replaces the value; a trailing space or a longer or shorter name is another property; the same name on another window is another property"
  atoms: "an atom from GlobalAddAtomW and its string name are the same property (set with the string, read with the atom and the other way round; RemovePropW with either removes it); an integer atom 0x0001..0xBFFF is a valid name too and keeps its value"
  length: "a name of 255 characters works; 256 or 300 characters: FALSE with ERROR_INVALID_PARAMETER (87)"
  many: "40 properties on one window keep all their values"
  lifetime: "a property of a window can be read inside the window's own WM_CREATE successors (WM_SIZE, WM_MOVE) when it was set in WM_CREATE; the properties of a child are not those of its parent; the properties are per window, not per thread: another thread reads the same value"
  destroy: "a property still set is readable in the window's WM_DESTROY; after WM_NCDESTROY of the window it is gone; the child's property is still readable while the parent's WM_DESTROY runs (the children are destroyed after it)"
  chrome: "properties of the holder, the top-level window and the child under one name are three separate properties; RemovePropW in the top-level window's WM_DESTROY removes the child's (returns its value) and in its WM_NCDESTROY its own (returns its value); the holder's survives until it is removed"
errors:
  bad_window: "NULL and a made-up handle: FALSE with ERROR_INVALID_WINDOW_HANDLE (1400); a destroyed window the same"
  bad_name: "a NULL name: FALSE with ERROR_INVALID_PARAMETER (87); the empty name: FALSE with ERROR_INVALID_NAME (123); GetPropW of it: 0 with 123"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, dwmapi.dll and imm32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and a message log; run with poly-oracle.ps1
  -Interactive (see docs/AGENT_PIPELINE.md) because visibility, painting, focus and input need the visible
  desktop. The tests of the Chrome scenarios record sent messages with a WH_CALLWNDPROC hook and posted ones
  with a WH_GETMESSAGE hook of the thread (as the Chrome recording did), print windows as roles (main, rwh,
  hid, ime, ctf) or tag letters, never handles, times or ids, and leave out the shell's traffic (WM_GETICON,
  WM_TIMER, the undocumented 0x60, 0x90, 0x96, 0xAE, 0x272, 0x287 and registered messages). Test windows are
  placed in the top-left 1000x500 pixels; the cursor is parked at (1500, 600) and put back; keyboard input is
  sent only while a window of the test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Several monitors, DPI awareness other than unaware (the tests have no manifest), other keyboard layouts, IME
  composition, touch and pen.
