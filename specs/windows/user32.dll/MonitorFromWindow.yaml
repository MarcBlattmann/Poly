# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/MonitorFromWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2
  date: "2026-11-02; 2026-11-09 (spec-win-gui-b2: minimized windows, shapes, placements)"
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "MonitorFromWindow", "MonitorFromRect",
  "Multiple Display Monitors".
summary: >
  Returns the monitor a window's rectangle (GetWindowRect) intersects most,
  or for a window off every monitor what the flag asks:
  MONITOR_DEFAULTTONULL (0) NULL, MONITOR_DEFAULTTOPRIMARY (1) the primary
  monitor, MONITOR_DEFAULTTONEAREST (2) the nearest (winuser.h). On the
  oracle's single monitor every non-NULL result is the primary monitor's
  handle, the same value on every call.
interface:
  signature: "HMONITOR MonitorFromWindow(HWND hwnd, DWORD flags)"
  same_as_rect: "the result equals MonitorFromRect of the window rectangle with the same flag, at every position tried"
rules:
  on_screen: "a window that overlaps the screen by at least one pixel (e.g. -199,100,1,200 or 100,1050,300,1150) is on the primary monitor with every flag"
  off_screen: "a window wholly outside (including just touching an edge from outside, -200,100,0,200): NULL with MONITOR_DEFAULTTONULL, the primary monitor with the other two flags"
  state: "hidden and maximized windows are judged by their CURRENT rectangle (GetWindowRect): a hidden window moved to 5000,5000 gives NULL with MONITOR_DEFAULTTONULL, a window maximized from a restored position far off the screen gives the primary monitor with every flag. A MINIMIZED window is judged by its RESTORED rectangle (the normal position of its window placement, in screen coordinates), NOT by the small rectangle it has while minimized: that rectangle is 0,1052,160,1080 at the bottom left for every style (overlapped window, WS_POPUP, caption-only, tool window), always on the screen. So a window minimized from 80,90,340,230 gives the primary monitor with every flag, but a window minimized while its restored position is at -4000,80 (or created with WS_MINIMIZE at -3000,200, or with a placement whose normal position is -200,100,0,200, touching the left edge from outside) gives NULL with MONITOR_DEFAULTTONULL (and the primary monitor with the other two flags) although GetWindowRect says 0,1052,160,1080; and a window minimized from an on-screen position and then moved (SetWindowPos) to -4000,500, where GetWindowRect says -4000,500,-3840,528, still gives the primary monitor with every flag because its restored rectangle (100,100,340,220) is unchanged. The restored position of a hidden minimized window counts the same way."
  state_rects: "rectangles the states have, for the tests above (work area 0,24,1920,1080, a window 260x140 at 80,90): minimized 0,1052,160,1080 (every style); maximized: WS_OVERLAPPEDWINDOW -8,16,1928,1088, WS_POPUP 0,0,1920,1080 (the whole screen, over the taskbar area), WS_CAPTION alone and a tool window with caption and sysmenu -8,-8,1928,1088. A normal-position rectangle given to SetWindowPlacement is in workspace coordinates (relative to the work area's top-left, 0,24): GetWindowPlacement of a window at 100,100,340,220 reports the normal position 100,76,340,196; positions wholly off the screen by a wide margin (-3000, 4000 ...) are moved onto the screen by SetWindowPlacement."
  shapes: "a window wider or taller than the screen that overlaps it (-500,100,2500,200; 100,-500,200,2500) and one exactly the screen's size: the primary monitor with every flag; a window one pixel past the right edge (1920,100,1970,150) or the bottom edge (100,1080,150,1130): NULL with MONITOR_DEFAULTTONULL, one whose first column/row is the last of the screen (1919,..; ..,1079): the primary monitor. A window of ZERO size is judged as the point (left, top) (same as MonitorFromRect of an empty rectangle): inside the screen, at the origin, or at 1919: primary; at 1920 or far off: NULL with MONITOR_DEFAULTTONULL; a zero-width window with height inside the screen, primary; a zero-height window left of the screen (-100,300,-50,300): NULL. A window of another thread: judged the same way (primary). The taskbar window (class Shell_TrayWnd) and the desktop window: the primary monitor with every flag."
  kinds: "a child is judged by its own screen rectangle (a child of a parent moved far off the screen: NULL with MONITOR_DEFAULTTONULL); an owned popup by its own rectangle; a message-only window, the desktop window and a never-shown window: the primary monitor with every flag"
  null_window: "NULL: NULL with MONITOR_DEFAULTTONULL, the primary monitor with the others; last error unchanged"
errors:
  bad_window: "a made-up or destroyed handle: NULL with every defined flag, ERROR_INVALID_WINDOW_HANDLE (1400)"
  bad_flags: "every flags value except 0, 1 and 2 (3, 4, 5, 6, 8, 0x10, 0x100, 0x80000000, 0xFFFFFFFE, 0xFFFFFFFF): NULL, ERROR_INVALID_FLAGS (1004), for every window (bad flags are reported before a bad window); 0, 1 and 2 leave the last error as it was"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 4  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Several monitors (which monitor is nearest, ties), DPI-aware processes.
  DPI awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
