# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/QueryDisplayConfig
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3b
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Fills the arrays with the display paths (a path joins a source on an adapter to a target, the monitor) and
  their modes. The return value is the error code (0 ERROR_SUCCESS), the last error is not set. Sizes are 72
  bytes per DISPLAYCONFIG_PATH_INFO and 64 per DISPLAYCONFIG_MODE_INFO on 64-bit Windows. Chrome's browser
  calls it 7 times in a run (S3) with QDC_ONLY_ACTIVE_PATHS after GetDisplayConfigBufferSizes and reads the
  path, source mode and target mode.
interface:
  signature: "LONG QueryDisplayConfig(UINT32 flags, UINT32 *numPathArrayElements, DISPLAYCONFIG_PATH_INFO *pathArray, UINT32 *numModeInfoArrayElements, DISPLAYCONFIG_MODE_INFO *modeInfoArray, DISPLAYCONFIG_TOPOLOGY_ID *currentTopologyId)"
rules:
  active_shape: "QDC_ONLY_ACTIVE_PATHS: one path for the monitor, two modes: index 0 is the target mode (DISPLAYCONFIG_MODE_INFO_TYPE_TARGET 2), index 1 the source mode (type 1); with QDC_VIRTUAL_MODE_AWARE a third mode (type 3, desktop image) at index 2; the path's flags are DISPLAYCONFIG_PATH_ACTIVE (1), with the virtual flag also DISPLAYCONFIG_PATH_SUPPORT_VIRTUAL_MODE (8: 0x9)"
  path_fields: "source status flags DISPLAYCONFIG_SOURCE_IN_USE (1); target status flags DISPLAYCONFIG_TARGET_IN_USE (1) and targetAvailable TRUE; rotation 1 (IDENTITY), scaling 1 (IDENTITY), scan line ordering 1 (PROGRESSIVE); the adapter id of the source and of the target are the same; the source id is 0 for the first source; the target id is a machine value (200803 on the oracle) that is the same in the path, in the target mode and in the desktop image mode"
  mode_index: "without the virtual flag the path's source index is the index of the source mode and the target index the index of the target mode; with it the index words are packed: the source word has the clone group id in the low 16 bits (0xFFFF, DISPLAYCONFIG_PATH_CLONE_GROUP_INVALID) and the source mode index in the high 16 bits; the target word has the desktop image mode index in the low 16 bits and the target mode index in the high 16 bits"
  source_mode: "type 1, id equal to the source id, the adapter of the path; width and height are those of the monitor (the same as GetSystemMetrics SM_CXSCREEN and SM_CYSCREEN for the primary one), pixel format 4 (DISPLAYCONFIG_PIXELFORMAT_32BPP), position 0,0 for the primary monitor"
  target_mode: "type 2, id equal to the target id, the adapter of the path; the video signal info: active size equal to the source size, total size at least the active size, video standard 255 (D3DKMDT_VSS_OTHER), scan line ordering 1; the vertical sync (numerator, denominator) equals the path's refresh rate exactly and is between 24 and 500 Hz; the pixel rate is not 0; a database query (DATABASE_CURRENT) can have total size 0"
  desktop_image_mode: "type 3, id equal to the target id; path source size equals the source mode's width and height; desktop image region 0,0,width,height; clip 0,0,width,height"
  counts_shrink: "when the arrays are larger than needed the counts are set to what was filled and the entries behind them are not touched; with arrays of exactly the sizes of GetDisplayConfigBufferSizes the counts stay"
  too_small: "a mode count too small returns ERROR_INSUFFICIENT_BUFFER 122, the counts are left as passed and the path array is written but not the mode array beyond the first entries; a path count of 0 or a mode count of 0 returns 87 for paths 0 and 122 for modes 0 on the oracle with counts as passed"
  invalid_flags: "flags 0, 3, 5, 6, 7, 8, VIRTUAL_MODE_AWARE alone and an unknown bit (0x80) with a valid one return 87"
  topology: "only QDC_DATABASE_CURRENT takes and requires the topology pointer: it returns 0 and writes DISPLAYCONFIG_TOPOLOGY_INTERNAL (1) for the single monitor; without the pointer it returns 87; with a pointer for ONLY_ACTIVE_PATHS or ALL_PATHS it returns 87 and does not write it"
  all_paths: "QDC_ALL_PATHS with large arrays returns 0; the active path is listed first and marked active, the others are inactive paths; the filled counts do not exceed those of GetDisplayConfigBufferSizes; with 16 paths and 32 modes it returns 122 on the oracle (it has more than 16)"
  last_error: "never set (except that a NULL topology pointer on DATABASE_CURRENT leaves 998 after the 87)"
errors:
  invalid_parameter: "87: invalid flags, zero path count, a topology pointer with the wrong flag or missing with DATABASE_CURRENT"
  insufficient_buffer: "122: mode array too small"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, ole32.dll and oleaut32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and printing booleans, counts and error codes, never
  handles, addresses, times or machine ids; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md), twice per run, with identical output. Test windows are placed in the top-left
  1000x500 pixels and the cursor is parked at (1500, 600). The COM tests run each sequence on a thread of its
  own (every thread starts without COM state). Where a call crashes on the oracle (a NULL path count in
  QueryDisplayConfig, a garbage handle in UnregisterPowerSettingNotification, CoRegisterMessageFilter on a
  thread without COM) the case is left out.
not_covered: >
  Several monitors, topology values other than internal, inactive-path contents, HDR and refresh-rate-aware
  differences.
