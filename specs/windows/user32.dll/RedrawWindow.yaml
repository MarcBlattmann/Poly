# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/RedrawWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read.
summary: >
  Invalidates or validates part of a window (a rectangle, a region, or all
  of it) and optionally its frame and children, and optionally paints it
  now, depending on RDW_* flags (winuser.h: RDW_INVALIDATE 0x1,
  RDW_INTERNALPAINT 0x2, RDW_ERASE 0x4, RDW_VALIDATE 0x8,
  RDW_NOINTERNALPAINT 0x10, RDW_NOERASE 0x20, RDW_NOCHILDREN 0x40,
  RDW_ALLCHILDREN 0x80, RDW_UPDATENOW 0x100, RDW_ERASENOW 0x200, RDW_FRAME
  0x400, RDW_NOFRAME 0x800).
interface:
  signature: "BOOL RedrawWindow(HWND hwnd, const RECT* rect, HRGN rgn, UINT flags)"
  return: "1 for any window (visible, hidden, another thread's) and any flags including 0; 0 for a bad handle"
rules:
  invalidate: "RDW_INVALIDATE: the client area (or the rectangle, or the region) is invalid; nothing is sent; pumping gives WM_PAINT"
  erase: "RDW_INVALIDATE | RDW_ERASE: the WM_PAINT's BeginPaint sends WM_ERASEBKGND"
  frame: "RDW_FRAME: the WM_PAINT's BeginPaint sends WM_NCPAINT (wParam 1) first; the client update region is the same"
  erasenow: "RDW_ERASENOW: WM_NCPAINT (with RDW_FRAME) and WM_ERASEBKGND are sent during the call; the update region stays and WM_PAINT comes later, without another erase"
  updatenow: "RDW_UPDATENOW: WM_NCPAINT, WM_ERASEBKGND (as pending) and WM_PAINT during the call; the region is empty afterwards"
  rect_and_region: "with both a rectangle and a region, the region is used"
  validate: "RDW_VALIDATE (without a rectangle) empties the update region, the erase included; with a rectangle it removes that rectangle and the erase stays pending"
  noerase_alone: "RDW_NOERASE alone after InvalidateRect(NULL, TRUE): the erase still happens"
  internalpaint: "RDW_INTERNALPAINT: no update region, but a WM_PAINT comes (rcPaint 0,0,0,0); RDW_NOINTERNALPAINT cancels it"
  invalidate_and_validate: "RDW_INVALIDATE | RDW_VALIDATE: invalidates"
  children_default: "RDW_INVALIDATE on a parent without WS_CLIPCHILDREN invalidates its children too; with WS_CLIPCHILDREN only with RDW_ALLCHILDREN; RDW_NOCHILDREN never"
  updatenow_children: "RDW_UPDATENOW paints the parent, then its invalid children, unless RDW_NOCHILDREN"
  validate_children: "RDW_VALIDATE on a parent without WS_CLIPCHILDREN validates the children too; with WS_CLIPCHILDREN only with RDW_ALLCHILDREN"
  hidden: "a hidden window, or a hidden child of a visible parent: returns 1, nothing invalid, nothing sent"
  other_thread: "RDW_INVALIDATE | RDW_UPDATENOW on another thread's window: the WM_PAINT is handled by that thread (here while it waits with MsgWaitForMultipleObjects and peeks sent messages) before RedrawWindow returns; the region is empty afterwards"
errors:
  bad_window: "a made-up handle: 0, ERROR_INVALID_WINDOW_HANDLE (1400)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  RedrawWindow(NULL, ...) (the desktop) is deliberately not called. All
  windows in these tests are WS_EX_TOPMOST | WS_EX_NOACTIVATE |
  WS_EX_TOOLWINDOW popups (or their children), so no activation messages
  interleave and nothing covers them. DPI awareness other than unaware (the
  tests have no manifest), several monitors, other keyboard layouts than
  German, IME, touch and pen, hooks, menus and the menu loop.
