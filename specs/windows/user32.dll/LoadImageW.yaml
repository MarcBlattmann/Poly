# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/LoadImageW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above). Learn pages "Layered Windows" (Window Features),
  "Using Cursors", "About Icons", "SetLayeredWindowAttributes",
  "UpdateLayeredWindow", "BLENDFUNCTION", "SetWindowRgn", "LoadImage",
  "CreateIconIndirect", "ICONINFO", "CURSORINFO"; the pixel values were read
  back from the screen with GetPixel on the screen DC after DwmFlush (BitBlt
  with and without CAPTUREBLT gives the same). Bitmaps of the system are
  tested for sizes at 96 DPI.
summary: >
  Loads an icon, cursor or bitmap: a system image by id from a NULL module
  (OIC_*/IDI_*, OCR_*/IDC_*, OBM_*), a resource of a module, or a file
  (LR_LOADFROMFILE). System icons and cursors need LR_SHARED, are 32x32
  whatever size is asked for and are shared handles; files are scaled to the
  size asked for.
interface:
  signature: "HANDLE LoadImageW(HINSTANCE hInst, LPCWSTR name, UINT type, int cx, int cy, UINT fuLoad)"
  constants: "IMAGE_BITMAP 0, IMAGE_ICON 1, IMAGE_CURSOR 2; LR_MONOCHROME 1, LR_COPYRETURNORG 4, LR_LOADFROMFILE 0x10, LR_DEFAULTSIZE 0x40, LR_CREATEDIBSECTION 0x2000, LR_SHARED 0x8000 (winuser.h); system icon ids 32512..32518, cursor ids 32512..32651 as the IDC_* values"
  metrics here: "SM_CXICON/SM_CYICON 32, SM_CXSMICON/SM_CYSMICON 16, SM_CXCURSOR/SM_CYCURSOR 32"
rules:
  system_icons: "LoadImageW(NULL, IDI_*, IMAGE_ICON, ..., LR_SHARED) returns the shared icon: fIcon 1, hotspot 16,16, mask 32x32 (1 bit), colour 32x32 (32 bit), whatever cx and cy (0, 16, 24, 20x30, 32, 48, 64, or LR_DEFAULTSIZE/LR_MONOCHROME) are given; it is the same handle every time and the same as LoadIconW's. DestroyIcon on it returns TRUE and the next load returns the same handle."
  no_shared_flag: "Without LR_SHARED the system icon ids do not load: NULL, ERROR_RESOURCE_TYPE_NOT_FOUND (1813), also with LR_DEFAULTSIZE or LR_MONOCHROME. System cursor ids without LR_SHARED: NULL, ERROR_RESOURCE_NAME_NOT_FOUND (1814)."
  system_cursors: "LoadImageW(NULL, OCR_*, IMAGE_CURSOR, 0, 0, LR_SHARED) is the same handle as LoadCursorW for the id (also with LR_DEFAULTSIZE). fIcon 0, hotspots: arrow 0,0; ibeam 8,9; wait 16,16; cross 16,16; up arrow 4,0; size-all 11,11; no 8,8; hand 6,0. Colour cursors: mask 32x32 and colour 32x32 (32 bit); ibeam and cross: one 32x64 1-bit mask, no colour bitmap. A different cx, cy (16, 48, 64, 10x40) does not change the shared 32x32 cursor. DestroyCursor on a shared cursor returns TRUE and leaves it usable. Id 32512 as a cursor is OCR_NORMAL, as an icon IDI_APPLICATION."
  copy_image: "CopyImage(icon, IMAGE_ICON, 16, 16) gives a new handle of 16x16 with hotspot 8,8; 48x48 gives hotspot 24,24; 0x0 gives the source size (32x32). CopyImage(cursor, 16x16) gives hotspot 3,0 for the hand (scaled from 6,0). CopyIcon gives a new handle of the same shape."
  system_bitmaps: "OBM_* ids with IMAGE_BITMAP load without LR_SHARED as GDI bitmaps (object type 7): OBM_CLOSE 42x23, UPARROW/DNARROW/RGARROW/LFARROW 17x17, REDUCE 17x19, ZOOM 20x18, RESTORE 17x19, CHECK 15x15 (1 bit; the others 32 bit, 1 plane), SIZE 17x17, BTNCORNERS 13x13. The size asked for (20x20) does not change them."
  files: "With LR_LOADFROMFILE: a 16x16 32-bit .ico with cx=cy=0 loads at 16x16 (fIcon 1, hotspot 8,8); LR_DEFAULTSIZE, or an explicit 32x32, scales it to 32x32 (hotspot 16,16); 8x8 gives 8x8 (hotspot 4,4); 16x16 stays. As IMAGE_CURSOR the .ico's directory fields planes/bit count become the hotspot (1,32 here). A .cur with hotspot 3,4 loads as a cursor at 16x16 with hotspot 3,4 and scales with the size (32x32: 6,8, also with LR_DEFAULTSIZE). A .cur loaded as IMAGE_ICON is an icon (hotspot 8,8). A 2x2 32-bit .bmp loads at 2x2, 4x4 when asked, 32 bits per pixel also with LR_CREATEDIBSECTION; LR_MONOCHROME gives a 1-bit 2x2 bitmap. At native size the icon draws as the file: the opaque half red (128 pixels of 256), the transparent half leaves the background. LR_LOADFROMFILE | LR_SHARED and repeated loads return new handles each time."
  wrong_kind: "A .bmp loaded as IMAGE_ICON and an .ico as IMAGE_BITMAP give NULL with the last error 0."
  resources: "Resource lookups in the (resource-less) executable: icon, bitmap and string name give NULL with ERROR_RESOURCE_DATA_NOT_FOUND (1812). A NULL module with an unknown numeric id: icon 1813, cursor and bitmap 1814. A NULL name: 1813."
  bad_type: "An unknown type (7, 0xFFFFFFFF) returns NULL and leaves the last error unchanged."
errors:
  1812: "ERROR_RESOURCE_DATA_NOT_FOUND: id or name not found in a module that has no resources"
  1813: "ERROR_RESOURCE_TYPE_NOT_FOUND: unknown id as icon from a NULL module; system icon ids without LR_SHARED; NULL name"
  1814: "ERROR_RESOURCE_NAME_NOT_FOUND: unknown id as cursor or bitmap from a NULL module; system cursor ids without LR_SHARED"
  2: "ERROR_FILE_NOT_FOUND: LR_LOADFROMFILE with a missing file, an empty name or a NULL name"
side_effects: "Creates GDI/USER objects (non-shared loads); shared images are cached."
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows).
not_covered: >
  Resources of other modules, LR_VGACOLOR, LR_LOADTRANSPARENT,
  LR_LOADMAP3DCOLORS, scaling quality (only sizes and hotspots are
  specified), animated cursors, icons with several sizes in one file,
  PNG-compressed icons. Several monitors, other system DPIs (the oracle is
  one 1920x1080 monitor at 96 DPI, scale 100%), a manifest (the tests have
  none: awareness is set with the API), other keyboard layouts than German,
  installed input methods (the oracle has none active), touch and pen,
  hooks, menus and dialogs, comctl32 controls, themed (visual style)
  painting, clipboard contents put there by other programs or by the cloud
  clipboard and clipboard history.
