# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/WM_MOUSELEAVE.yaml
id: windows/api/user32.dll/WM_MOUSELEAVE
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, one monitor 1920x1080 at 100 %, 96 dpi), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner's \"keeper\" window in the foreground; the pointer is parked at (1500, 600) and moved only by SetCursorPos, SendInput button events never reach a window of another process; no mouse is attached; every test ran three times with identical output; the test programs carry no manifest (common controls 5.82, no visual styles)"
  observed_by: spec-win-mouseleave
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above (Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers). Microsoft Learn: TrackMouseEvent, TRACKMOUSEEVENT, WM_MOUSELEAVE, WM_NCMOUSELEAVE, WM_MOUSEHOVER, WM_MOUSEMOVE, WM_CAPTURECHANGED, WM_SETCURSOR, WM_NCHITTEST, SetCapture, ReleaseCapture, GetCapture, WindowFromPoint, SetCursorPos, GetMessagePos, "About Mouse Input", "Tooltip Controls", the tooltip messages TTM_*; winuser.h and commctrl.h for constants and layouts. The conformance tests of Wine, its source and ReactOS were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Chrome's hover and tooltip logic waits for it. Windows posts it not only when the pointer moves out of a window but whenever the pointer stops being over the tracked window while the pointer stays where it is: a window appears over it, the window goes away or moves, the pointer is captured elsewhere. Observed in the interactive session with a tracked window A and the pointer parked in its client area.
interface:
  signature: "WM_MOUSELEAVE (0x02A3), wParam 0, lParam 0: posted to a window that asked with TrackMouseEvent(TME_LEAVE) when the pointer is no longer over it"
rules:
  windows_that_cover: "Order: the window now under the pointer gets WM_SETCURSOR (hit 1, msg WM_MOUSEMOVE) and WM_MOUSEMOVE first; the window that lost the pointer gets WM_MOUSELEAVE after them (it was posted, so it arrives at the next read of that thread's queue). This happens when a popup B is shown over the pointer in any way: ShowWindow SW_SHOWNA, SW_SHOW (activates), SetWindowPos SWP_SHOWWINDOW | SWP_NOACTIVATE as a topmost tool window with WS_EX_NOACTIVATE, owned by A, a WS_EX_TRANSPARENT popup that is not layered (the style alone changes nothing), a WS_EX_LAYERED popup with alpha 128 (translucent windows take the pointer), a child window of A shown over the pointer (the child gets WM_SETCURSOR, WM_MOUSEMOVE; A also gets a WM_SETCURSOR with window = the child; then A gets WM_MOUSELEAVE: moving onto a child counts as leaving the parent), a window of another thread of the process (A gets WM_MOUSELEAVE; when that window is destroyed again A gets WM_SETCURSOR and WM_MOUSEMOVE), an existing window raised over A with SetWindowPos HWND_TOP, and a tooltips_class32 tracking tooltip (TTF_TRACK | TTF_ABSOLUTE, TTM_TRACKACTIVATE) shown over the pointer: A gets WM_MOUSELEAVE and WindowFromPoint reports the tooltip window."
  windows_that_do_not_cover: "No WM_MOUSELEAVE, and A is told about the pointer again: A gets WM_SETCURSOR and a WM_MOUSEMOVE (client 100,60 here) as if the pointer had moved, when a popup with WS_EX_LAYERED | WS_EX_TRANSPARENT (also with WS_EX_NOACTIVATE | WS_EX_TOOLWINDOW | WS_EX_TOPMOST shown with SWP_NOACTIVATE) is shown over the pointer (WindowFromPoint stays A); the same when a popup of the same thread answers WM_NCHITTEST with HTTRANSPARENT (-1); when another window is shown behind A. A tooltip of tooltips_class32 does not behave like these: it takes the pointer (above)."
  tracked_window_changes: "A hidden (SW_HIDE): WM_MOUSELEAVE (no synthesized move: nothing of the thread is under the pointer). A minimized: WM_MOUSELEAVE. A moved away so the pointer is outside, A resized so the pointer is outside: WM_MOUSELEAVE. A moved by 10 pixels with the pointer still inside: no leave, A gets WM_SETCURSOR and a WM_MOUSEMOVE with the new client coordinates (90,50). A disabled (EnableWindow FALSE): no message at all (A stays under the pointer). A destroyed: no WM_MOUSELEAVE, only WM_DESTROY, and the tracking is gone."
  covering_window_tracked: "When B, the popup over the pointer, is itself tracked and is hidden: A gets WM_SETCURSOR and WM_MOUSEMOVE (the pointer is on A again) and then B gets WM_MOUSELEAVE. When B is destroyed instead: A gets WM_SETCURSOR and WM_MOUSEMOVE and B gets no WM_MOUSELEAVE."
  capture: "The window that has the capture gets mouse messages wherever the pointer is. SetCapture(B) with B a window the pointer is not over: B gets WM_MOUSEMOVE with the pointer position in B's client coordinates (here -400,60), and A (tracked, under the pointer) gets WM_MOUSELEAVE; ReleaseCapture: B gets WM_CAPTURECHANGED (new window NULL), then A gets WM_SETCURSOR and WM_MOUSEMOVE. SetCapture(A) and ReleaseCapture with the pointer unmoved: A gets WM_CAPTURECHANGED, then WM_SETCURSOR and WM_MOUSEMOVE, no leave. SetCapture(A) and the pointer moved out by SetCursorPos: A gets WM_MOUSEMOVE (client 592,269) and at once WM_MOUSELEAVE even though it keeps the capture, WM_CAPTURECHANGED comes at ReleaseCapture; moved out and back: WM_MOUSEMOVE, WM_MOUSELEAVE, WM_MOUSEMOVE (client 100,60), the capture changes at the release, then WM_SETCURSOR; no second leave."
  tracking_after: "After WM_MOUSELEAVE was posted the tracking is over: TME_QUERY gives flags 0, window NULL, hover time 0. A new TrackMouseEvent(TME_LEAVE) for A with the pointer over A returns 1 and the query says flags 2, window A again; nothing is posted until the pointer leaves. TrackMouseEvent(TME_LEAVE) for A while the pointer is over B returns 1 and WM_MOUSELEAVE is posted at once."
  one_per_request: "One WM_MOUSELEAVE per TrackMouseEvent request; repeated lines in the logs of the tests are removed."
errors:
  none: "The message has no error result; a request for a window that does not exist fails in TrackMouseEvent (see its sheet)."
side_effects: "none beyond the rules above"
threading: "mouse tracking and mouse capture belong to the thread that asked; a window belongs to the thread that created it; the cover tests with a window of another thread use one extra thread"
ordering: []
timing:
  typical: "the messages after a change arrive within about 60 ms"
  guarantees: none
tests:
  visible: 5  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations and a message log; run with poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because pointer, hit testing and showing windows need the visible desktop. Window A (300x200 at 100,100, WS_EX_NOACTIVATE, never activated) has the pointer in its client area at screen (208,191) (or in its caption at (200,115)); it asks for TME_LEAVE where the rule says so. Every scene prints the mouse messages of every window of the test in the order they arrived, under the window's tag letter (A, B; handles are never printed), repeated identical lines once, then the pointer position and what WindowFromPoint reports; the scenes start with the pointer settled and the log empty, and wait 350 ms at the end. Times are checked against envelopes, never printed. The pointer is parked at (1500, 600) between scenes and put back at the end.
not_covered: >
  A mouse attached (no mouse is present on the oracle), several monitors, DPI awareness other than unaware, a tracked window of another process, windows covered by an always-on-top window of another process (the shell), touch and pen input, the exact delay between the change and the messages (about 20 to 60 ms), WM_MOUSELEAVE for TME_NONCLIENT (see WM_NCMOUSELEAVE).
