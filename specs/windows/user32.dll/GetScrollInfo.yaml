# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/GetScrollInfo.yaml
id: windows/api/user32.dll/GetScrollInfo
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station: windows and messages work, controls draw into memory bitmaps with WM_PRINT, nothing is shown on a screen, no input) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output, each run in a fresh scratch directory; the test programs have no manifest, so they get the common controls of version 5.82 and no visual styles"
  observed_by: spec-win-apps-5
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above (the programs are Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers; the test fonts are TrueType files the test writes itself, so no Microsoft font is involved). Microsoft Learn reference pages of the functions, messages and notifications named here (Winsock, "Scroll Bars", "Dialog Boxes", "Common Controls", "Shell Functions"); winsock2.h, winuser.h, wingdi.h, commctrl.h, shlobj.h, shellapi.h and winerror.h for constants and layouts. The conformance tests of Wine were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Reads the range, page size, position and track position of a window's scroll bar or of a scroll bar control. Only the fields named in fMask are written; the others keep what the caller had.
interface:
  signature: "BOOL GetScrollInfo(HWND hwnd, int nBar, LPSCROLLINFO lpsi)"
rules:
  masks: "SIF_RANGE writes nMin and nMax, SIF_PAGE nPage, SIF_POS nPos, SIF_TRACKPOS nTrackPos (the position when no drag is going on); SIF_ALL (0x17) all of them; a mask with SIF_DISABLENOSCROLL (0x8) added behaves like the rest; undefined bits are ignored; the other fields stay as the caller had them"
  defaults: "a window with WS_VSCROLL / WS_HSCROLL: min 0, max 100, page 0, pos 0 and track position 0; a scroll bar control: 0, 0, 0, 0 for SB_CTL"
  hidden_bar: "a bar hidden because its page covers the range still returns its range, page (limited to the range) and position (for range 10..90 page 200: page 81, position 10)"
  zero_mask: "a mask of 0 and SIF_DISABLENOSCROLL alone return FALSE and change nothing (the last error stays unchanged on a window that has the bar; on a window without the bar it is 1447 as for every mask); a mask with only undefined bits (0xFFFFFFE0) on a window without the bar returns FALSE with the last error unchanged"
  cbsize: "cbSize is checked: 0, 4, 27, 29 and 40 (anything but 28) return FALSE (last error not set)"
  control_bars: "SB_CTL on an ordinary window returns TRUE and writes nothing (the caller's numbers stay); SB_VERT and SB_HORZ on a scroll bar control fail like a window without bars"
errors:
  no_bar: "a window without the scroll bar (made without the style and never given a range): FALSE with ERROR_NO_SCROLLBARS (1447), the structure is not written"
  bad_bar: "SB_BOTH (3), 4 and -1: FALSE with ERROR_INVALID_PARAMETER (87), the structure is not written"
  bad_window: "a NULL window and a made-up handle: FALSE with ERROR_INVALID_WINDOW_HANDLE (1400)"
side_effects: "none beyond the rules above"
threading: "the window's own thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1 (see docs/AGENT_PIPELINE.md). Observations print results, error codes, counts, booleans and sizes that come from the test's own fonts and from system metrics at 96 dpi; no line holds a handle, a pointer or a machine, user or time. "err=-1" in a line means the call left the last error as the test had set it before (a marker), "err=N" the value after a failing result; the last error after a succeeding call is not printed (it is not specified).
not_covered: >
  Dragging the thumb and clicking the arrows (WM_HSCROLL / WM_VSCROLL generation, SIF_TRACKPOS during a drag) and the drawn bar: they need real mouse input; GetScrollBarInfo; scroll bars of a window made right to left; DPI scaling of the bar sizes. A NULL SCROLLINFO pointer crashes the call (access violation) and is not tested.
