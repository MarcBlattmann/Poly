# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetClipboardData
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above). Learn pages "Clipboard Operations", "Clipboard
  Formats", "Clipboard Notifications" (WM_CLIPBOARDUPDATE), "Synthesized
  Clipboard Formats". Wine's tests were not read for this entry.
summary: >
  Puts a data handle on the open clipboard under a format. The handle (a
  movable global memory block, or a bitmap for CF_BITMAP) belongs to the
  system from then on and is returned as it is; a NULL handle promises the
  data (delayed rendering by the owner). Formats are listed in the order of
  their first Set; a Set of a format already there replaces its data in
  place.
interface:
  signature: "HANDLE SetClipboardData(UINT uFormat, HANDLE hMem)"
  constants: "winuser.h formats: CF_TEXT 1, CF_BITMAP 2, CF_OEMTEXT 7, CF_DIB 8, CF_UNICODETEXT 13, CF_HDROP 15, CF_LOCALE 16, CF_DIBV5 17, CF_PRIVATEFIRST 0x200..CF_PRIVATELAST 0x2FF, CF_GDIOBJFIRST 0x300..0x3FF; registered formats 0xC000..0xFFFF"
  return: "the handle given on success (the same value); NULL on failure; with a NULL handle always NULL and the last error untouched"
  wm_renderformat: "WM_RENDERFORMAT 0x0305 (wParam = format) and WM_RENDERALLFORMATS 0x0306 are sent to the owner of delayed data; WM_DESTROYCLIPBOARD 0x0307"
rules:
  last_error: "a successful Set with a handle sets the last error to 0; a delayed Set (NULL handle) leaves it"
  same_handle: "the returned handle equals the one given, GetClipboardData returns it and the block stays usable (GlobalSize, GlobalLock) while it is on the clipboard"
  order: "listing order is the order of first Set; registered, private and standard formats mix; setting a format again replaces the data and keeps the place, returns the new handle; each Set counts one in the sequence number (also replacement and a delayed Set)"
  no_empty_needed: "a window that opened without EmptyClipboard can Set: the earlier formats stay and the owner does not change; an opener for NULL can Set too"
  other_thread: "a thread that has not opened the clipboard can Set while another thread has it open (the handle is accepted and listed, TRUE-like: returns the handle, error 0); with nobody holding it open: NULL, ERROR_CLIPBOARD_NOT_OPEN"
  formats: "any number is accepted except 0 and registered-range numbers that are no registered atom; 0x1234, 0x8000, 0x400, CF_PRIVATELAST and CF_GDIOBJFIRST with an ordinary memory block are listed as they are"
  empty_block: "a block of size 0 is refused: NULL with the last error untouched; nothing listed, the sequence number does not move"
  text_synthesis: "See CloseClipboard for which text formats appear and in which order after the close. Conversion on the oracle (ANSI code page 1252, OEM 850): ASCII text is the same text in every format; é (U+00E9) is 0xE9 in CF_TEXT and 0x82 in CF_OEMTEXT; the euro sign is 0x80 in CF_TEXT and \"?\" in CF_OEMTEXT; from CF_TEXT 0xE9, 0x80 to U+00E9, U+20AC; from CF_OEMTEXT 0x82 to U+00E9 and 0xE9 in CF_TEXT; line feeds and carriage returns are not changed; the converted size includes the terminating NUL"
  locale: "the synthesized CF_LOCALE is 4 bytes: the user default LCID; a CF_LOCALE that was set is kept"
  text_priority: "a text format that was set explicitly is never overwritten by the synthesis: with CF_TEXT \"ansi\" and CF_UNICODETEXT \"uni\" set, CF_OEMTEXT is made from the unicode text"
  images: "CF_BITMAP (a bitmap handle, returned and read back unchanged) gives CF_DIB (BITMAPINFOHEADER, 40 bytes, BI_BITFIELDS for a 32-bit bitmap with 12 bytes of masks: size 100 for 4x3) and CF_DIBV5 (124 bytes: 184 for 4x3) after the close; a 24-bit 2x2 CF_DIB gives CF_BITMAP (a 32-bit 2x2 bitmap object on the oracle's display) and CF_DIBV5 (140 bytes); CF_HDROP is stored and returned byte for byte"
  delayed: "a NULL handle lists the format and makes it available at once; the sequence number moves by one; WM_RENDERFORMAT(format) reaches the owner when a reader first gets the data (see GetClipboardData); a delayed text format also gives its synthesized siblings at the close; with no owner (opened for NULL) the format is listed and available but Get returns NULL with the last error 0"
errors:
  not_open: "nobody has the clipboard open: NULL, ERROR_CLIPBOARD_NOT_OPEN (1418); the block remains the caller's"
  format_0: "format 0: NULL, ERROR_CLIPBOARD_NOT_OPEN (1418) even with the clipboard open (observed)"
  unregistered: "a number in 0xC000..0xFFFF that is no registered name: NULL, ERROR_INVALID_HANDLE (6)"
side_effects: "the clipboard's list, the sequence number (+1), the format listeners at the close. Not tested because they crash the process: the same block under two formats, a freed handle, a made-up handle, a GDI object handle under a 0x300 format (the system frees what it holds; these corrupt the heap)"
threading: "the clipboard is one object per desktop; the open state belongs to the thread that opened it (see the rules for what other threads may do); windows belong to the thread that created them and their procedures run in it; messages to the owner are sent synchronously and need that thread to dispatch"
ordering:
  - "delayed: Set(NULL) -> (reader) GetClipboardData -> WM_RENDERFORMAT inside the Get -> data returned"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 5  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows). Every test starts
  and ends with an emptied clipboard (open for NULL, EmptyClipboard, close)
  and never prints what was on it before; the windows are hidden popup
  windows of the test whose procedure logs the clipboard messages
  (WM_RENDERFORMAT, WM_RENDERALLFORMATS, WM_DESTROYCLIPBOARD,
  WM_CLIPBOARDUPDATE) under the window's tag letter; sequence numbers are
  printed as differences, registered format numbers never. Tests use
  GlobalAlloc blocks and a bitmap from CreateBitmap as data.
not_covered: >
  CF_METAFILEPICT, CF_ENHMETAFILE, CF_PALETTE, CF_OWNERDISPLAY and the DSP
  formats; GMEM_FIXED blocks (accepted, not documented); invalid handles
  Several monitors, other system DPIs (the oracle is one 1920x1080 monitor
  at 96 DPI, scale 100%), a manifest (the tests have none: awareness is set
  with the API), other keyboard layouts than German, installed input methods
  (the oracle has none active), touch and pen, hooks, menus and dialogs,
  comctl32 controls, themed (visual style) painting, clipboard contents put
  there by other programs or by the cloud clipboard and clipboard history.
