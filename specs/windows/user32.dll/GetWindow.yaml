# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Walks the window tree: GW_HWNDFIRST / GW_HWNDLAST / GW_HWNDNEXT / GW_HWNDPREV among the siblings in z order
  (for a top-level window: all top-level windows of the desktop, of every process), GW_CHILD the topmost
  child, GW_OWNER the owner of a top-level window, GW_ENABLEDPOPUP an enabled popup owned by the window. NULL
  at the end of a list. Chrome's browser calls it 146 times a run (S3).
interface:
  signature: "HWND GetWindow(HWND hwnd, UINT cmd)"
rules:
  siblings: "for children E (created first) and F of B: GetWindow(B, GW_CHILD) is E and E is above F: GW_HWNDFIRST of either is E, GW_HWNDLAST F, E next F, F prev E, E prev NULL, F next NULL; a lone child G: first = last = G, next = prev = NULL"
  top_level: "the top-level windows are listed with GetTopWindow(NULL) and GW_HWNDNEXT in z order from the top; a window that was created hidden after others lies above the earlier ones (the owned popup D above its owner A: H D A C B); GW_HWNDFIRST and GW_HWNDLAST of a top-level window give windows of other processes (the topmost and the bottom-most of the desktop)"
  owner: "GW_OWNER of an owned popup is its owner; of an unowned top-level window and of a child NULL (children have no owner: the call gives NULL, not the parent)"
  child: "GW_CHILD of a window with children is the topmost child; of a childless window NULL; a hidden window's children are included"
  enabled_popup: "GW_ENABLEDPOPUP of an owner with an enabled popup D gives D; of a window without one NULL; GW_ENABLEDPOPUP of the popup itself NULL"
  z_changes: "SetWindowPos(A, NULL, ..., SWP_NOMOVE | SWP_NOSIZE | SWP_NOACTIVATE) (to the top) puts A and its owned popup on top (D A ...); SetWindowPos(F, HWND_BOTTOM) on the bottom child leaves E, F as they were"
  chrome: "Chrome's windows: GW_CHILD of the top-level window is the child while it is under it, NULL while it is minimized (the child is then GW_CHILD of the holder); the thread's default IME window (class IME) is owned by the holder until the top-level window is shown, then by the top-level window (GW_OWNER), and the MSCTFIME UI window is created at the first activation and is above the IME window in the z order; the z order of the thread's windows after the show is ctf, ime, main, hid; minimized: hid, ctf, ime, main; after the top-level window is destroyed: ime, ctf, hid; GW_OWNER of the top-level window, of the child and of the holder NULL"
errors:
  bad_command: "a command of 7 or more: NULL with ERROR_INVALID_GW_COMMAND (1443)"
  bad_window: "NULL and a made-up handle: NULL with ERROR_INVALID_WINDOW_HANDLE (1400)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll, dwmapi.dll and imm32.dll by name, each carrying its
  own declarations (Learn prototypes, header constants) and a message log; run with poly-oracle.ps1
  -Interactive (see docs/AGENT_PIPELINE.md) because visibility, painting, focus and input need the visible
  desktop. The tests of the Chrome scenarios record sent messages with a WH_CALLWNDPROC hook and posted ones
  with a WH_GETMESSAGE hook of the thread (as the Chrome recording did), print windows as roles (main, rwh,
  hid, ime, ctf) or tag letters, never handles, times or ids, and leave out the shell's traffic (WM_GETICON,
  WM_TIMER, the undocumented 0x60, 0x90, 0x96, 0xAE, 0x272, 0x287 and registered messages). Test windows are
  placed in the top-left 1000x500 pixels; the cursor is parked at (1500, 600) and put back; keyboard input is
  sent only while a window of the test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Several monitors, DPI awareness other than unaware (the tests have no manifest), other keyboard layouts, IME
  composition, touch and pen.
