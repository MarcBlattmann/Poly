# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/InvalidateRect
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read.
summary: >
  Adds a rectangle (client coordinates) of a visible window to its update
  region; NULL adds the whole client area. Nothing is sent: the window gets
  one WM_PAINT later, when its thread reads the queue and nothing else is
  waiting, however many rectangles were added. The erase flag, once TRUE for
  any part, makes the next BeginPaint send WM_ERASEBKGND.
interface:
  signature: "BOOL InvalidateRect(HWND hwnd, const RECT* rect, BOOL erase)"
  return: "1 for a visible window, for a hidden one, for an empty or inverted rectangle; for a bad handle see errors"
  coordinates: "client coordinates; the part outside the client area is dropped (-20,-20,5,5 adds 0,0,5,5; 90,70,200,300 on a 100x80 client adds 90,70,100,80)"
rules:
  region: "the update region is the union of the rectangles, kept as y-x banded rectangles: 10,20,30,40 then 50,5,60,15 gives the region \"50,5,60,15 + 10,20,30,40\" (COMPLEXREGION) and the update rectangle (GetUpdateRect) their bounding box 10,5,60,40"
  empty_rect: "an empty rectangle (5,5,5,9) adds nothing (GetUpdateRect 0)"
  inverted_rect: "an inverted rectangle 30,30,20,20 is normalised: it adds 20,20,30,30"
  null_rect: "NULL: the whole client area"
  qs_paint: "GetQueueStatus(QS_PAINT): the high word (in the queue now) has QS_PAINT while the update region of any window of the thread is not empty; the low word (new since the last call) only at the first call after the region became non-empty"
  one_wm_paint: "three InvalidateRect calls send nothing; the queue then yields exactly one WM_PAINT"
  priority: "with the window invalid, two posted messages and a due timer (SetTimer 1 ms, 30 ms slept), PeekMessage(PM_REMOVE) returns the two posted messages, then WM_PAINT, then WM_TIMER"
  filtered_peek: "PeekMessage with the filter WM_PAINT..WM_PAINT returns WM_PAINT at once even with a posted message waiting; PM_REMOVE of it leaves the window invalid (GetUpdateRect still 1) and WM_PAINT is available again right after"
  not_validated: "a procedure that returns 0 from WM_PAINT without BeginPaint/EndPaint, ValidateRect or DefWindowProc gets WM_PAINT again each time the queue is read (3 of 3 messages read)"
  erase: "InvalidateRect(rect, TRUE) then InvalidateRect(other, FALSE): the WM_PAINT's BeginPaint sends WM_ERASEBKGND (logged by the procedure after WM_PAINT's entry, before BeginPaint returns); with only FALSE no WM_ERASEBKGND"
  hidden: "a hidden window: returns 1 but keeps no update region (GetUpdateRect 0); when it is shown its whole client area is invalid (ShowWindow does that)"
  children: "a parent without WS_CLIPCHILDREN: invalidating it invalidates the visible children under the rectangle too (parent 0,0,20,20 over a child at 10,10 size 30x30 gives the child 0,0,10,10; NULL gives the child all of it); a parent with WS_CLIPCHILDREN: the children are not invalidated (the parent's own region is still the full rectangle, child area included)"
  child_alone: "invalidating a child leaves the parent's update region as it was"
  siblings: "invalidating a child does not invalidate an overlapping sibling, with or without WS_CLIPSIBLINGS"
  other_thread: "InvalidateRect on a window of another thread of the process works from the calling thread (GetUpdateRect/GetUpdateRgn there show it); the WM_PAINT goes to the window's thread"
errors:
  bad_window: "a made-up handle: returns 1 (observed), last error ERROR_INVALID_WINDOW_HANDLE (1400); the process's windows do not become invalid"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering:
  - "reading the queue after invalidating a parent (no WS_CLIPCHILDREN) and its child with erase: WM_PAINT to the parent (whose BeginPaint sends WM_ERASEBKGND), then WM_PAINT to the child (its BeginPaint sends WM_NCPAINT, then WM_ERASEBKGND); of two invalid top-level windows the one created later is painted first"
  - "children invalid in two parents: the later-created parent's child is painted first"
  - "overlapping invalid siblings: the later-created (lower in z order) one first"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  InvalidateRect(NULL, ...) (every window of the desktop) is deliberately
  not called. All windows in these tests are WS_EX_TOPMOST |
  WS_EX_NOACTIVATE | WS_EX_TOOLWINDOW popups (or their children), so no
  activation messages interleave and nothing covers them. DPI awareness
  other than unaware (the tests have no manifest), several monitors, other
  keyboard layouts than German, IME, touch and pen, hooks, menus and the
  menu loop.
