# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/BeginPaint
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2, spec-win-gui-b3
  date: 2026-11-02, 2026-11-09, 2026-11-10
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read.
summary: >
  Prepares a window for painting: returns a DC for the client area (also
  stored in ps->hdc) clipped to the update region, fills the PAINTSTRUCT and
  validates the update region. With an erase pending it first sends
  WM_ERASEBKGND (and WM_NCPAINT when the frame is pending) to the window.
interface:
  signature: "HDC BeginPaint(HWND hwnd, PAINTSTRUCT* ps)"
  PAINTSTRUCT: "winuser.h: hdc, fErase, rcPaint (RECT), fRestore, fIncUpdate, rgbReserved[32]; 72 bytes on x64"
  return: "the DC (GetObjectType OBJ_DC, 3), equal to ps->hdc; NULL for a bad handle"
rules:
  rcpaint: "rcPaint is the update region's bounding box (client coordinates): 10,20,30,40 for one rectangle; 0,0,120,90 for 0,0,10,10 + 100,80,120,90; clipped to the client area"
  clip: "the DC's clip box is rcPaint, GetClipBox kind SIMPLEREGION (2) for one rectangle and COMPLEXREGION (3) for two; the DC has no application clip region (GetClipRgn 0)"
  state: "default DC state: text 0x000000, background 0xffffff, OPAQUE (2), the stock SYSTEM_FONT, WHITE_BRUSH, BLACK_PEN; changes made in one paint are gone at the next"
  validates: "after BeginPaint the update region is empty (GetUpdateRect 0) and QS_PAINT is not in the queue; fRestore and fIncUpdate are 0"
  erase_sent: "erase pending: WM_ERASEBKGND is sent from inside BeginPaint; its wParam is the DC BeginPaint then returns (WindowFromDC of it is the window)"
  ferase: "fErase is a per-window state. When WM_ERASEBKGND is sent from this BeginPaint, fErase is 0 if the procedure returned nonzero and 1 if it returned 0. When no erase is sent (none pending) fErase keeps the result of the last erase of that window: after a paint whose erase returned 0 it stays 1 in the following paints with no erase pending (InvalidateRect with bErase FALSE, a WM_PAINT sent with nothing invalid, BeginPaint outside WM_PAINT, also over a ValidateRect or a GetUpdateRect(bErase TRUE) whose erase returned 0) until a later erase returns nonzero, which makes it 0 again. Hiding and showing do not reset it; the erase the show sends decides. Another window of the same class has its own state. A new window starts with the result of its creation erase: with a class background brush DefWindowProc returns 1 (fErase 0); with no class brush it returns 0, so that window reports fErase 1 from the first paint on, also for paints with no erase pending, until an erase returns nonzero. A window with a brush whose erases all succeeded reports 0 for paints with no erase pending (it is not 1 just because no erase is pending). Exception: an erase that is pending but not sent because nothing of the window is visible (see invisible) gives fErase 0"
  erase_any: "one rectangle with erase TRUE among others with FALSE: the whole paint erases (one WM_ERASEBKGND)"
  class_brush: "DefWindowProc's WM_ERASEBKGND fills the update area with the class brush and returns 1: a solid brush (0x563412 read back), GRAY_BRUSH (0x808080), COLOR_WINDOW + 1 (the system colour, 0xffffff); outside the update area the pixels stay; with no class brush it returns 0 and paints nothing (fErase 1)"
  frame: "a captioned window after RedrawWindow(RDW_INVALIDATE | RDW_ERASE | RDW_FRAME): BeginPaint sends WM_NCPAINT (wParam 1) then WM_ERASEBKGND"
  nothing_invalid: "WM_PAINT sent by SendMessage with nothing invalid: rcPaint 0,0,0,0, clip box NULLREGION (1) 0,0,0,0"
  outside_wm_paint: "BeginPaint outside WM_PAINT works the same: on an invalid window it sends what is pending, returns the DC and validates; no WM_PAINT comes afterwards; with nothing invalid rcPaint is empty and fErase 1"
  nested: "a second BeginPaint before EndPaint, after invalidating 50,40,60,50: rcPaint 50,40,60,50"
  hidden: "a hidden window: a DC, rcPaint 0,0,0,0, clip box NULLREGION, no message sent; nothing is pending, so fErase keeps the window's state (0 for a window whose last erase succeeded, 1 after one that returned 0)"
  invisible: "when an erase is pending but nothing of the window can be seen, BeginPaint sends no WM_ERASEBKGND (and no WM_NCPAINT for the invalidation), returns a DC whose clip box is NULLREGION (1) 0,0,0,0, rcPaint 0,0,0,0 and fErase 0, and the pending erase is dropped. This holds for a minimized window (its client area is empty; also with a class icon: WM_ICONERASEBKGND is not sent either) and for a top-level window wholly off the screen (InvalidateRect still invalidates it and the WM_PAINT is delivered). The WM_PAINT of such a window is delivered, also when the procedure passes it to DefWindowProc, and validates it"
  minimized: "a minimized window after InvalidateRect (erase TRUE or FALSE, whole or partial rectangle): WM_PAINT comes, BeginPaint (in the procedure or outside WM_PAINT) returns a DC (type 3), rcPaint 0,0,0,0, clip box NULLREGION, fErase 0; no WM_ERASEBKGND, WM_NCPAINT or WM_ICONERASEBKGND is sent; afterwards GetUpdateRect says nothing is invalid and QS_PAINT is gone. UpdateWindow on it sends that WM_PAINT. After ShowWindow(SW_RESTORE) the whole client area is invalid (rcPaint 0,0,184,81 for a 200x120 window with caption, clip box SIMPLEREGION), and WM_NCPAINT (wParam 1) and WM_ERASEBKGND have been sent inside the ShowWindow call"
  offscreen: "a window partly off the screen: rcPaint and the DC's clip box are cut to the part on the screen (client coordinates), though the update region itself is not (GetUpdateRect after InvalidateRect(NULL) still reads the whole client area). Examples (100x80 popup, 1920x1080 screen): at x=-30 rcPaint 30,0,100,80; at x=1870 0,0,50,80; at y=1050 0,0,100,30; at y=-50 0,50,100,80; at x=-30,y=1050 30,0,100,30. A captioned window (client 144x71, 8 px frame) at x=-50 gives 42,0,144,71, since its client starts 8 px right of the window. The clip box is SIMPLEREGION for one rectangle (COMPLEXREGION when a WS_CLIPCHILDREN child lies in it) and the erase is sent once, as usual. The taskbar and other windows do not clip it. Wholly off the screen: see invisible"
  clip_children: "the DC is also clipped by windows that cover the painted area. A WS_CLIPCHILDREN parent's DC excludes the areas of its visible child windows (clip box = rcPaint, kind COMPLEXREGION 3, PtVisible false inside the child); without WS_CLIPCHILDREN the parent DC includes the children's areas (SIMPLEREGION), and when the parent is updated the invalid children are painted after it (UpdateWindow). A WS_CLIPSIBLINGS child excludes the sibling children above it: of two overlapping children created in the order A, B the later-created B is BELOW A in the z order (GetWindow(A, GW_HWNDNEXT) is B), so A's DC is unclipped (SIMPLEREGION) and B's DC excludes the overlap (COMPLEXREGION, rcPaint still the whole child 0,0,50,40); without WS_CLIPSIBLINGS B's DC is not clipped by A (SIMPLEREGION)"
  visible_points: "how the tests ask what a paint DC can draw on: PtVisible(dc, x, y) (gdi32) is 1 exactly for the points that are inside the update region and not cut away by clip_children (client coordinates of the window that paints), RectVisible(dc, rect) is 1 when any part of the rectangle is such a point and 0 when none is. With them: a WS_CLIPCHILDREN parent cannot draw on its visible children (also a disabled child, also a child without WS_CLIPSIBLINGS) but can where a child is hidden; a parent without the style can draw everywhere in its update region; of two overlapping WS_CLIPSIBLINGS children the upper one (created first) can draw on the overlap, the lower one cannot, and when the upper one is hidden the lower one can; a point outside the invalidated rectangle is not visible even when nothing covers it (a child whose invalid part lies wholly under its sibling paints with nothing visible: the clip box is still rcPaint, kind COMPLEXREGION); another top-level window lying over the window does not take anything away (the covered points stay visible to the DC)"
  minimized_child: "a child of a minimized window: when a window is minimized while it and its child are invalid, the child's update region becomes empty (GetUpdateRect 0) but a frame paint stays pending for it. The child gets that WM_NCPAINT(1) from inside the minimized parent's BeginPaint: the parent's WM_PAINT calls BeginPaint, the child receives WM_NCPAINT(wParam 1) before BeginPaint returns (rcPaint 0,0,0,0, fErase 0), and the child gets no WM_ERASEBKGND and no WM_PAINT. A parent that only validates its update region in WM_PAINT (ValidateRect, no BeginPaint) leaves the child without any message while minimized; DefWindowProc's WM_PAINT handling behaves like BeginPaint and EndPaint. After the parent is restored both are invalid again and paint in the usual order: the parent (WM_NCPAINT and WM_ERASEBKGND during the ShowWindow call, then WM_PAINT), then the child's WM_PAINT, whose BeginPaint sends the child WM_NCPAINT(1) and WM_ERASEBKGND"
  nc_flags: "WM_NCPAINT is sent from BeginPaint (before WM_ERASEBKGND) only when the frame is pending, i.e. after RedrawWindow with RDW_FRAME (with RDW_INVALIDATE), with wParam 1 (the whole frame). InvalidateRect, RDW_INVALIDATE | RDW_ERASE and RDW_INVALIDATE | RDW_NOFRAME send no WM_NCPAINT; RDW_INVALIDATE | RDW_FRAME without RDW_ERASE sends WM_NCPAINT but no WM_ERASEBKGND; RDW_FRAME alone or RDW_ERASE alone (nothing invalidated) make no WM_PAINT: UpdateWindow sends nothing and QS_PAINT stays empty. RDW_NOERASE together with RDW_ERASE in one call is ignored (RDW_INVALIDATE | RDW_ERASE | RDW_FRAME | RDW_NOERASE sent WM_NCPAINT and WM_ERASEBKGND). BeginPaint outside WM_PAINT sends the same pending messages in the same order inside the call, and no WM_PAINT follows. SetWindowPos with SWP_FRAMECHANGED sends WM_NCPAINT with a region (wParam not 1) and then WM_ERASEBKGND at once, inside the call, and no WM_PAINT follows. A WS_BORDER child after RDW_INVALIDATE | RDW_FRAME [| RDW_ERASE] gets WM_NCPAINT (1) [and WM_ERASEBKGND] in its own BeginPaint; the parent's UpdateWindow after RDW_ALLCHILDREN paints the parent, then the child, each with its own messages; without RDW_ALLCHILDREN only the parent is painted (here the parent has WS_CLIPCHILDREN, so the children are not invalidated with it)"
  paintstruct_fields: "BeginPaint writes every field of the PAINTSTRUCT: a block pre-filled with 0x55 comes back with hdc, fErase and rcPaint set, fRestore 0, fIncUpdate 0 and the 32 reserved bytes all zero"
  dc_value: "the value is not a fresh handle per paint: consecutive paints of one window (no paint of another window in between) see the same HDC value, and the WM_ERASEBKGND wParam of a paint is the value that window's previous paint got (the cache hands the window its entry again). A CS_OWNDC window's own DC is returned every time (the same value as GetDC, also twice in a row), and a CS_CLASSDC class shares one DC among its windows (same value for all, also for a nested BeginPaint of a second window of the class). What several windows of the plain class get when they paint in turn is not specified: two such windows did not share a value, a later paint of the first could get the value of the other again, a window created while another is alive (its creation paint counts as a paint) changed the first window's value, and a window created after another was destroyed did not always get the destroyed window's value; do not depend on more than the rule above"
  dc_state: "a plain window's DC state is the default one at every paint (what the previous paint set is gone); a CS_OWNDC window keeps what was set (a text colour set in one paint is seen at the next paint and through GetDC; each window has its own); a CS_CLASSDC class keeps it across paints and across the windows of the class"
errors:
  bad_window: "a made-up handle: NULL, ERROR_INVALID_WINDOW_HANDLE (1400); the PAINTSTRUCT is zeroed"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 9  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  The caret (BeginPaint hides it). All windows in these tests are
  WS_EX_TOPMOST | WS_EX_NOACTIVATE | WS_EX_TOOLWINDOW popups (or their
  children), so no activation messages interleave and nothing covers them.
  DPI awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
