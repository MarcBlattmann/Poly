# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/CloseWindowStation.yaml
id: windows/api/user32.dll/CloseWindowStation
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s2
  date: 2026-11-14
sources: >
  The same observations as the SetProcessWindowStation entry of this DLL; the calls are made by the tests of that entry and of CreateWindowStationW, CreateDesktopW and GetThreadDesktop.
summary: >
  Closes a window station handle; the handle of the process's current station and of the station the process is switched to cannot be closed (ERROR_BUSY). No tests of its own: the tests of SetProcessWindowStation and CreateWindowStationW call it.
same_as: "windows/api/user32.dll/SetProcessWindowStation"
interface:
  signature: "BOOL CloseWindowStation(HWINSTA h)"
rules:
  closing: "TRUE for a handle that is not the process's station; FALSE with error 170 for the process's own (or the switched-to) station handle; a closed or NULL handle or a desktop handle: FALSE, error 6; the station is destroyed with its last handle (OpenWindowStationW of its name then gives error 2)"
errors:
  see_sheet: "the errors of the SetProcessWindowStation sheet"
side_effects: "none beyond the object's life"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 0
  held_out: 0
not_covered: >
  Everything the SetProcessWindowStation sheet lists as not covered.
