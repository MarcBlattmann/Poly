# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SystemParametersInfoW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64; the tests added by spec-win-gui-b4 were run on build 26200.9974"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c, spec-chrome-win-6, spec-win-gui-b4
  date: 2026-11-09, 2026-11-14
  this_round: "spec-chrome-win-6 (2026-11-14): the tests added this round ran on Windows 11 Home 25H2 build 26200.9974 on homeserver2 over SSH (session 0), two rounds of two runs each, identical, and on the owner's PC (Windows 11 Enterprise, build 26200, desktop session) with the same output. The chrome section comes from Chrome's stage-1 runs on Poly (call traces of chrome.dll's user32, gdi32 and dwrite imports, poly.nt.exceptions) and from Chromium's and Skia's public source (BSD licence), read by the spec agent for the order of the calls only"
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above).
summary: >
  Only the read-only SPI_GET* actions a browser reads were observed (nothing
  was set). The values are the user's settings on the oracle and are
  recorded as such; the structures (NONCLIENTMETRICSW, ICONMETRICSW,
  ANIMATIONINFO, HIGHCONTRASTW) are filled for their cbSize.
interface:
  signature: "BOOL SystemParametersInfoW(UINT uiAction, UINT uiParam, PVOID pvParam, UINT fWinIni)"
  machine_specific: "the values of the simple getters, the fonts and the colours depend on the oracle's personalisation (English (Switzerland), light theme, no accessibility features); the work area depends on the taskbar position"
chrome:
  call_site: "chrome.dll sets its UI fonts up once per process: SystemParametersInfoW(SPI_GETNONCLIENTMETRICS 0x29, 504, &ncm, 0); GetDC(NULL), GetDeviceCaps(LOGPIXELSY), ReleaseDC; then for the caption, small caption, menu, message and status fonts in turn: CreateFontIndirectW, GetDC(NULL), SelectObject, GetObjectW(font, 92) for the face name, GetTextMetricsW for the size (tmHeight - tmInternalLeading), and a request to its own DirectWrite font manager for a font of that face. The set-up is marked done only after the fifth font."
  stage_1: "On Poly every one of these calls answered like Windows (traced in stage 1: SPI TRUE with the Segoe UI -12 fonts of ADR 0155, LOGPIXELSY 96, GetObjectW 92, GetTextMetricsW TRUE). On Poly the stage-1 disk of `cargo xtask chrome-win run` had no fonts under C:/Windows/Fonts, so DirectWrite's system collection had no family, and IDWriteFactory::CreateNumberSubstitution is a stub (E_NOTIMPL): the font manager found the face neither as a family nor through the system fallback, nor its second choice 'sans'; a failed lookup makes Chrome take the default UI font instead, whose set-up starts this sequence again before the first one is marked done. 5,226 rounds of the same calls until the 8 MB stack was full. With the fonts on the disk the recursion is gone (observed). Windows never gets there: the face SPI reports is always a family of the system collection (rule message_font_installed), and a face that is not is still mapped by the system fallback."
rules:
  work_area: "SPI_GETWORKAREA (0x30): 0,24,1920,1080 (taskbar of 24 pixels at the top); TRUE"
  nonclientmetrics: "SPI_GETNONCLIENTMETRICS (0x29, cbSize 504): border 1, scroll 17x17, caption buttons 36x22, small caption 22x22, menu 19x19, padded border 4, all equal to GetSystemMetrics (SM_CXBORDER, SM_CXVSCROLL, SM_CYSIZE, SM_CYSMSIZE, SM_CYMENUSIZE, SM_CXPADDEDBORDER); caption, small caption, menu, status and message fonts: Segoe UI, height -12, width 0, weight 400, not italic, charset 1 (DEFAULT_CHARSET), quality 0, pitch/family 0"
  nonclientmetrics_sizes: "cbSize 504 with uiParam 504, 0 or 500: TRUE; cbSize 500 with uiParam 500: TRUE (the older structure without the padded border); cbSize 0 with uiParam 0 or 504: FALSE; cbSize 4 or 508: FALSE; the structure is left alone on failure. The last error after these failures is not promised"
  iconmetrics: "SPI_GETICONMETRICS (0x2D, cbSize 108): horizontal/vertical spacing 75, title wrap 1, font height -12"
  animation: "SPI_GETANIMATION (0x48, cbSize 8): iMinAnimate 1"
  highcontrast: "SPI_GETHIGHCONTRAST (0x42, cbSize 16): flags 0x7E; the default-scheme pointer is not stable and was not recorded"
  getters: "values of simple getters (pointer to an int): GETBEEP 1, GETMOUSE 6/10/1, GETBORDER 1, GETKEYBOARDSPEED 31, GETSCREENSAVEACTIVE 0, GETKEYBOARDDELAY 1, GETICONTITLEWRAP 1, GETMENUDROPALIGNMENT 0, GETDRAGFULLWINDOWS 1, GETSNAPTODEFBUTTON 0, GETMOUSEHOVERWIDTH/HEIGHT 4, GETMOUSEHOVERTIME 400, GETWHEELSCROLLLINES 3, GETMENUSHOWDELAY 400, GETWHEELSCROLLCHARS 3, GETSHOWIMEUI 1, GETMOUSESPEED 10, GETSCREENREADER 0, GETFONTSMOOTHING 1, GETKEYBOARDPREF 0, GETFONTSMOOTHINGTYPE 2, GETFONTSMOOTHINGCONTRAST 1200, GETFOCUSBORDERWIDTH/HEIGHT 1, GETCARETWIDTH 1, GETFOREGROUNDLOCKTIMEOUT 0x7FFFFFFF, GETFOREGROUNDFLASHCOUNT 7, GETMOUSECLICKLOCKTIME 1200, GETMESSAGEDURATION 5, and the others printed by the test; on success the last error is unchanged (first_call: except at the first call of the process)"
  errors: "an action that is not defined (0x7777, 0x1FFF, 0x2FFF): FALSE, ERROR_INVALID_PARAMETER (87); SPI_GETGRIDGRANULARITY (0x12) and action 0: FALSE, ERROR_INVALID_SPI_VALUE (1439)"
  last_error: "the tests print the last error after a successful call as \"-1\" when the call left it as it was or cleared it (both happen, depending on earlier calls in the process): a success does not promise either unless the first_call rule decides it"
  message_font_installed: "the faces of the five fonts (one face on both oracles) are installed faces: EnumFontFamiliesExW on the screen DC calls back at least once, every callback with that face; DirectWrite's system collection has a family of that name (FindFamilyName S_OK, exists TRUE); two calls give the same five LOGFONTs; every lfHeight is negative (a character height). The faces' names are the machine's and are printed only as classes (test spi_ui_fonts, held out)"
  message_font_gdi: "each of the five LOGFONTs made with CreateFontIndirectW and selected into GetDC(NULL), as Chrome does: GetObjectW returns 92 and the LOGFONT as given; GetTextMetricsW TRUE with tmHeight - tmInternalLeading = -lfHeight (> 0); GetTextFaceW returns the length + 1 of the requested face's name and reports that face; LOGPIXELSY of the screen DC 96; ReleaseDC 1 (test spi_font_chrome)"
  session: "the two tests of these rules give the same output in session 0 (homeserver2 over SSH) and in a desktop session (the owner's PC); the older tests of this entry were recorded in homeserver2's desktop session and keep that recording"
  first_call: "the last error of a SUCCESSFUL call is left alone, with one exception: the FIRST call of the process to one of GetSystemMetrics, GetSystemMetricsForDpi, SystemParametersInfoW (any action) AdjustWindowRect and CreateWindowExW sets it to 0 before it returns; this happens once per process, not once per thread (the first call of a second thread leaves the last error alone), and after one of these calls has run none of the others does it any more (GetSystemMetrics first: SystemParametersInfoW later leaves 0x1234 alone). A failing first SystemParametersInfoW (undefined action 0x7777) sets 87 and counts as the first call (the next one leaves the last error alone). Observed NOT to clear it: GetCursorPos, GetDesktopWindow, GetForegroundWindow, GetSysColor, GetKeyboardLayout, LoadCursorW, GetDpiForSystem, PeekMessageW, IsWindow, GetWindowRect, GetAsyncKeyState, GetDC with GetDeviceCaps, RegisterClassExW, DestroyWindow; they leave it as it was before and do not use up the clearing. So SPI_GETBEEP (or any other action) as the first call of a program that set the last error to 0x1234 beforehand leaves 0, the same call after another SystemParametersInfoW leaves 0x1234."
errors:
  undefined_action: "FALSE, 87"
  unsupported_value: "FALSE, 1439 (ERROR_INVALID_SPI_VALUE)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows).
not_covered: >
  every set action (SPI_SET*, fWinIni broadcasts), registry persistence,
  actions not in the lists above Several monitors, other system DPIs (the
  oracle is one 1920x1080 monitor at 96 DPI, scale 100%), a manifest (the
  tests have none: awareness is set with the API), other keyboard layouts
  than German, installed input methods (the oracle has none active), touch
  and pen, hooks, menus and dialogs, comctl32 controls, themed (visual
  style) painting, clipboard contents put there by other programs or by the
  cloud clipboard and clipboard history.
