# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/SetProcessDpiAwarenessContext
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above).
summary: >
  Sets the DPI awareness of the process. It works once: the first call with
  a valid context returns TRUE and makes the process unaware, system aware,
  per-monitor aware (v1 or v2) or unaware-GDI-scaled; every later call fails
  with ERROR_ACCESS_DENIED, also with the same value, and also the call of
  the legacy shcore function SetProcessDpiAwareness. A process without
  manifest is unaware before the first call.
interface:
  signature: "BOOL SetProcessDpiAwarenessContext(DPI_AWARENESS_CONTEXT value)"
  contexts: "DPI_AWARENESS_CONTEXT_UNAWARE -1, SYSTEM_AWARE -2, PER_MONITOR_AWARE -3, PER_MONITOR_AWARE_V2 -4, UNAWARE_GDISCALED -5 (windef.h). The real handles GetThreadDpiAwarenessContext returns are accepted as well (0x6011 as SYSTEM_AWARE; 0x6012 and 0x6013 are refused)."
  awareness_values: "afterwards GetProcessDpiAwareness (shcore) gives 0, 1, 2, 2, 0 for UNAWARE, SYSTEM_AWARE, PER_MONITOR_AWARE, PER_MONITOR_AWARE_V2, UNAWARE_GDISCALED; IsProcessDPIAware is FALSE for the two unaware ones and TRUE for the others"
rules:
  default: "a process without manifest starts unaware: GetThreadDpiAwarenessContext names UNAWARE, GetProcessDpiAwareness gives S_OK and 0, IsProcessDPIAware 0, GetDpiForSystem 96"
  first_call: "the first call with any of the five contexts (also UNAWARE) returns TRUE and leaves the last error as it was; then the calling thread has that context, a new window has that awareness (GetWindowDpiAwarenessContext) and GetDpiForWindow of it is 96 (one 96 DPI monitor); GetDpiForSystem stays 96, GetSystemMetrics(SM_CXSCREEN, SM_CYSCREEN) stays 1920x1080 and the monitor DPI (GetDpiForMonitor effective and angular) is 96 in every mode"
  second_call: "any later call fails: FALSE and ERROR_ACCESS_DENIED (5), for each of the five contexts, for NULL and for 1; SetProcessDpiAwareness(PROCESS_PER_MONITOR_DPI_AWARE) returns E_ACCESSDENIED (0x80070005). Setting UNAWARE first counts as the first call"
  invalid_values: "NULL, 1, -6, -7, -100, 16, 0x1234 and 0x6012: FALSE, ERROR_INVALID_PARAMETER (87); they do not count as the first call: the awareness stays unaware and a valid call afterwards still succeeds"
  thread_context_does_not_count: "SetThreadDpiAwarenessContext before it, and even a window created before it, do not count: the first process-level call still returns TRUE"
  after_the_call_for_threads: "a thread without a context of its own follows the process awareness also when it existed before the call (it saw UNAWARE before and SYSTEM_AWARE after SetProcessDpiAwarenessContext(SYSTEM_AWARE)); a thread created later starts with the process awareness, also when its creator had set its own context; the calling thread keeps a context it had set itself"
  mixed_observations: "in the process where the calling thread had set PER_MONITOR_AWARE_V2 and the process call set SYSTEM_AWARE, GetProcessDpiAwareness(NULL) returned 2 and a window created before the call (under PER_MONITOR_AWARE_V2) reported SYSTEM_AWARE afterwards; in another process whose calling thread had explicitly set UNAWARE, GetThreadDpiAwarenessContext and GetProcessDpiAwareness still gave UNAWARE / 0 after a successful SetProcessDpiAwarenessContext(PER_MONITOR_AWARE_V2) (the threads own context wins and GetProcessDpiAwareness(NULL) follows the calling thread)"
  threads: "a process-level call from another thread than the one that made the first call fails with ERROR_ACCESS_DENIED too"
errors:
  already_set: "FALSE, ERROR_ACCESS_DENIED (5)"
  invalid: "FALSE, ERROR_INVALID_PARAMETER (87)"
side_effects: "sets the process awareness for threads without a context of their own and for windows created afterwards"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows).
not_covered: >
  a manifest (the awareness comes from the API here), WM_DPICHANGED (no DPI
  change can be provoked on a one-monitor, 96 DPI machine), virtualised
  coordinates and GDI scaling effects of the unaware modes (invisible at 100
  percent scale) Several monitors, other system DPIs (the oracle is one
  1920x1080 monitor at 96 DPI, scale 100%), a manifest (the tests have none:
  awareness is set with the API), other keyboard layouts than German,
  installed input methods (the oracle has none active), touch and pen,
  hooks, menus and dialogs, comctl32 controls, themed (visual style)
  painting, clipboard contents put there by other programs or by the cloud
  clipboard and clipboard history.
