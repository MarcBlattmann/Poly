# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetFocus
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b, spec-win-gui-b2
  date: 2026-11-02, 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "Keyboard Input Overview", AttachThreadInput,
  GetGUIThreadInfo (GUITHREADINFO, winuser.h).
summary: >
  Returns the window of the calling thread's input queue that has the
  keyboard focus, or NULL. The focus is per thread: another thread of the
  process gets NULL unless its input is attached (AttachThreadInput), then
  both threads see the same focus.
interface:
  signature: "HWND GetFocus(void)"
rules:
  no_window: "NULL before any window, and with only a hidden window"
  show: "ShowWindow(A, SW_SHOW) of a hidden popup (the process allowed to take the foreground): A is activated and gets the focus: WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x43), WM_WINDOWPOSCHANGING(0x3), WM_ACTIVATEAPP(1), WM_NCACTIVATE(1, l=0), WM_ACTIVATE(1, other=NULL), WM_SETFOCUS(other=NULL), WM_WINDOWPOSCHANGED(0x10001843: the window was raised by the activation; 0x10001847 when it was already on top); GetFocus A"
  new_child: "creating a visible child does not move the focus: the child gets WM_NCCALCSIZE(FALSE), WM_SIZE, WM_MOVE during creation, then WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x57), WM_WINDOWPOSCHANGED(0x1857)"
  set_focus: "SetFocus(C) moves the focus inside the active window without any activation message: the old focus window (the top-level window itself, a child or a grandchild) gets WM_KILLFOCUS(other=C) and then C gets WM_SETFOCUS(other=old focus window); SetFocus(NULL) returns the old focus window, sends it WM_KILLFOCUS(other=NULL) and leaves GetFocus NULL with the active window unchanged; SetFocus of a disabled window returns NULL with error 87 and changes nothing"
  disable_focused: "EnableWindow(C, FALSE) on the focused child: C WM_CANCELMODE, WM_KILLFOCUS(other=NULL), WM_ENABLE(0); GetFocus NULL (not the parent); enabling C again does not give it back"
  disable_parent: "EnableWindow(A, FALSE) of the active window with the focus on its child C: A gets WM_CANCELMODE and WM_ENABLE(0) only; the focus stays on C (no WM_KILLFOCUS) and so does the activation; EnableWindow(A, TRUE) sends WM_ENABLE(1) only"
  hide_focused_child: "hiding the focused child: C WM_SHOWWINDOW(0), WM_WINDOWPOSCHANGING(0x97), WM_WINDOWPOSCHANGED(0x1897), then the focus goes to its parent: C WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=C) (GetFocus A). Hiding a window that only has the focus in a descendant (a child C1 whose child G is focused) changes nothing about the focus: GetFocus stays G although G is no longer visible"
  destroy_child: "DestroyWindow(C) of a visible child that has the focus (or whose child G has it): C WM_SHOWWINDOW(0), WM_WINDOWPOSCHANGING(0x97), WM_WINDOWPOSCHANGED(0x1897), WM_DESTROY, then the focus moves to the parent: when G had it, G WM_KILLFOCUS(other=C), C WM_SETFOCUS(other=G), G WM_DESTROY, C WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=C), G WM_NCDESTROY, C WM_NCDESTROY; when C had it, C WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=C), WM_DESTROY, WM_NCDESTROY (the 0x97 / 0x1897 and WM_SHOWWINDOW(0) come first); GetFocus A"
  hide_parent: "ShowWindow(A, SW_HIDE) with the focus on its child C and no other window of the thread: A WM_SHOWWINDOW(0), WM_WINDOWPOSCHANGING(0x83), WM_WINDOWPOSCHANGED(0x20001887), WM_NCACTIVATE(0), WM_ACTIVATE(0, other=NULL), WM_ACTIVATEAPP(0), C WM_KILLFOCUS(other=NULL): GetFocus and GetActiveWindow NULL, the foreground goes to another process's window (the flags are explained in GetActiveWindow hide_flags: 0x...887 because A is alone in its z-order group, 0x...883 when a window of the thread above it in the same group exists)"
  show_again: "ShowWindow(A, SW_SHOW) afterwards activates A and gives the focus to A itself (not to C): the child that had the focus is forgotten"
  minimize: "SW_MINIMIZE with the focus on C: C WM_KILLFOCUS(other=NULL), A WM_WINDOWPOSCHANGING to -32000,-32000 size 160,28 flags 0x8170, WM_WINDOWPOSCHANGED 0x8130, WM_NCACTIVATE(0), WM_ACTIVATE(WA_INACTIVE, minimized: HIWORD 0x20), WM_ACTIVATEAPP(0): GetFocus NULL, active NULL, foreground another process (when no other window of the thread lies below: see GetActiveWindow next_active; WM_GETMINMAXINFO, WM_NCCALCSIZE(0x9930), WM_MOVE, WM_SIZE(SIZE_MINIMIZED) come between the WINDOWPOSCHANGED and the activation messages)"
  restore: "SW_RESTORE: A WM_WINDOWPOSCHANGING(50,50 300x200, 0x8120), WM_WINDOWPOSCHANGING(0x3), WM_ACTIVATEAPP(1), WM_NCACTIVATE(1), WM_ACTIVATE(1), WM_SETFOCUS(other=NULL), WM_WINDOWPOSCHANGED(0x8120), WM_ACTIVATE(1) again; GetFocus A"
  destroy: "DestroyWindow(A) of the active window: no WM_SHOWWINDOW; WM_WINDOWPOSCHANGING(0x97), WM_WINDOWPOSCHANGED(0x20001897), WM_NCACTIVATE(0), WM_ACTIVATE(0, other=NULL), WM_ACTIVATEAPP(0), A WM_KILLFOCUS(other=NULL) (the focus window being A or a child, whose KILLFOCUS comes at this point), then WM_DESTROY and WM_NCDESTROY (children's after A's WM_DESTROY); GetFocus NULL"
  activation_switch: "when the active window changes inside the thread the focus goes to the newly active top-level window itself, never to a child, whatever child had the focus when it was left: SetActiveWindow(B) with A active and the focus on A's child a: A WM_NCACTIVATE(0, l=B), WM_ACTIVATE(0, other=B), B WM_WINDOWPOSCHANGING(0x3), B WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), a WM_KILLFOCUS(other=B), B WM_SETFOCUS(other=a) (the earlier owner of the focus is named); going back to A later: A WM_WINDOWPOSCHANGED(0x1803) after its WM_WINDOWPOSCHANGING(0x3), then the focus child of B (if any) WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=that window), and GetFocus is A, not a"
  minimize_active_with_other: "SW_MINIMIZE of the active B while A (visible, below B) exists: B WM_KILLFOCUS(other=NULL), 0x8170, WM_GETMINMAXINFO, 0x9930, 0x8130, WM_MOVE(-32000,-32000), WM_SIZE(SIZE_MINIMIZED), B WM_NCACTIVATE(wParam 0x200000, l=A), WM_ACTIVATE(WA_INACTIVE, HIWORD 32, other=A), A WM_WINDOWPOSCHANGING(0x3), A WM_NCACTIVATE(1, l=B), WM_ACTIVATE(1, other=B), A WM_SETFOCUS(other=NULL): GetFocus A. SW_RESTORE of B then: B WM_WINDOWPOSCHANGING(old rect, 0x8120), WM_GETMINMAXINFO, WM_NCCALCSIZE(0x9920), A WM_NCACTIVATE(0, l=B), WM_ACTIVATE(0, other=B), B WM_WINDOWPOSCHANGING(0x3), B WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), A WM_KILLFOCUS(other=B), B WM_SETFOCUS(other=A), B WM_WINDOWPOSCHANGED(0x8120), WM_MOVE, WM_SIZE(SIZE_RESTORED), WM_ACTIVATE(1, other=NULL); SW_MINIMIZE of the INACTIVE A: A moves to -32000 (0x8170 / 0x9930 / 0x8130, WM_MOVE, WM_SIZE(SIZE_MINIMIZED)) and the focus and activation do not change; restoring A activates it as above with 0x8120 and takes the focus"
  hide_active_with_other: "ShowWindow(B, SW_HIDE) of the active B while A (visible, below B) exists: B WM_SHOWWINDOW(0), 0x83, CHANGED 0x20001887, B WM_NCACTIVATE(0, l=A), WM_ACTIVATE(0, other=A), A WM_WINDOWPOSCHANGING(0x3), WM_WINDOWPOSCHANGED(0x1803), A WM_NCACTIVATE(1, l=B), WM_ACTIVATE(1, other=B), the old focus window of B WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=that window): GetFocus A. Showing B again: B WM_SHOWWINDOW(1), WM_WINDOWPOSCHANGING(0x43), A WM_NCACTIVATE(0, l=B), WM_ACTIVATE(0, other=B), B 0x3, B NCACTIVATE(1, l=A), ACTIVATE(1, other=A), A WM_KILLFOCUS(other=B), B WM_SETFOCUS(other=A), B WM_WINDOWPOSCHANGED(0x10001843): GetFocus B. DestroyWindow(B) while active: 0x97 / 0x20001897 and the same activation messages to A (A 0x3, 0x1803, ...), B WM_KILLFOCUS(other=A), A WM_SETFOCUS(other=B), then B's WM_DESTROY and its children's"
  show_new_window: "a hidden window N (with a visible child) shown while A is active with the focus on its child a: SW_SHOWNORMAL, SW_SHOW and SW_SHOWMAXIMIZED activate N and give the focus to N itself: N WM_SHOWWINDOW(1) (not for SW_SHOWMAXIMIZED), 0x43 (0x8060 for the maximize), A WM_NCACTIVATE(0, l=N), WM_ACTIVATE(0, other=N), N WM_WINDOWPOSCHANGING(0x3), N WM_NCACTIVATE(1, l=A), WM_ACTIVATE(1, other=A), a WM_KILLFOCUS(other=N), N WM_SETFOCUS(other=a), N WM_WINDOWPOSCHANGED(0x10001843 / 0x10008060 for an overlapped N; 0x1843 for a WS_EX_NOACTIVATE popup); SW_SHOWNOACTIVATE (0x57 / 0x10001857) and SW_SHOWNA (0x53 / 0x10001853 or ...57) change neither focus nor activation; SW_SHOWMINIMIZED activates N but N gets no focus (NCACTIVATE wParam 0x200001, ACTIVATE(1, HIWORD 32), a WM_KILLFOCUS(other=NULL): GetFocus NULL, active N); SW_SHOWMINNOACTIVE changes nothing but the minimized rect"
  other_thread: "thread T (its own popup, not attached) sees GetFocus NULL and GetActiveWindow NULL while the main thread's A is the foreground window; after SetForegroundWindow(T) T sees T and the main thread NULL"
  attached: "after AttachThreadInput(main, T, TRUE) (returns 1) with T in the foreground, the main thread sees active T and focus T; its own A gets WM_NCACTIVATE(0), WM_ACTIVATE(0, other=NULL), WM_ACTIVATEAPP(0), WM_KILLFOCUS(other=NULL); SetFocus(T) from the main thread then returns T, error 0. After detaching (returns 1) the main thread sees NULL, T still T"
  guithreadinfo: "GetGUIThreadInfo(thread) reports the same active and focus windows as that thread's GetActiveWindow/GetFocus; GetGUIThreadInfo(0) those of the foreground thread"
errors:
  none: "GetFocus has no error case"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 5  # count in <symbol>.tests/
  held_out: 3  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Every
  test first makes its window A the foreground window with
  SetForegroundWindow (the test program may: the previous test passed the
  right on with AllowSetForegroundWindow(ASFW_ANY), or it is the first
  program the runner starts). "other" below is a window of another process
  (on the oracle a console window); "ours" a window of the test without a
  tag.
not_covered: >
  DPI awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
