# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/user32.dll/AttachThreadInput.yaml
id: windows/api/user32.dll/AttachThreadInput
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, one monitor 1920x1080 at 100 %, 96 dpi), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner's \"keeper\" window in the foreground; keyboard events are injected with SendInput (virtual key and the scan code of the keyboard layout, press and release) while a window of the test is the foreground window; the pointer is parked at (1500, 600); no mouse is attached; every test ran twice with identical output; the test programs carry no manifest (common controls 5.82, no visual styles)"
  observed_by: spec-win-focus-keys
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above (Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers). Microsoft Learn: SetFocus, GetFocus, GetGUIThreadInfo, GUITHREADINFO, AttachThreadInput, GetInputState, GetKeyState, GetAsyncKeyState, GetQueueStatus, SendInput, PeekMessage, TranslateMessage, PostMessage, SetForegroundWindow, WM_KEYDOWN, WM_KEYUP, WM_CHAR, WM_SETFOCUS, WM_KILLFOCUS, "About Keyboard Input", "Keyboard Input Overview", "Message Queue"; winuser.h for constants and layouts. The conformance tests of Wine, its source and ReactOS were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Chrome's browser UI keeps one top-level window per thread. Focus can move to a window of another thread only when the two threads' input is attached; the attached threads then share the focus, the active window and the key state, and the keys are handled by the thread that owns the focus window. Observed with the main thread (window P, edits E, F, G) and a second thread with window Q and edit H, both in the same process.
interface:
  signature: "BOOL AttachThreadInput(DWORD idAttach, DWORD idAttachTo, BOOL fAttach)"
rules:
  not_attached: "SetFocus(H) from the main thread with the threads not attached: returns NULL, GetLastError 5 (ERROR_ACCESS_DENIED), nothing changes (GetFocus E; GetGUIThreadInfo of the main thread: active P, focus E; of the other thread: active NULL, focus NULL; foreground P). A key-down handler on Ctrl+L that calls SetFocus(H) therefore fails and the keys that follow stay with E: E gets the key-downs of Ctrl and L, WM_CHAR 0x0c, the key-ups, and a, b, c; the text of E is \"abc\", the text of H is empty."
  attached: "AttachThreadInput(main, other, TRUE) returns 1; SetFocus(H) from the main thread now succeeds: it returns Q (the top-level window of the other thread, not the old focus E), GetFocus in the main thread returns H; the focus messages are E WM_KILLFOCUS(other=Q), Q WM_SETFOCUS(other=E), Q WM_KILLFOCUS(other=H), H WM_SETFOCUS(other=Q) (the other thread's window is activated first); GetGUIThreadInfo gives active Q and focus H for both threads. a, b and c sent with SendInput are delivered to H (the thread of H reads them): WM_KEYDOWN, WM_CHAR, WM_KEYUP each, text of H \"abc\"."
  detach: "AttachThreadInput(main, other, FALSE) returns 1; afterwards GetFocus in the main thread returns NULL and GetGUIThreadInfo of the main thread gives active NULL and focus NULL; the other thread keeps active Q and focus H."
  ctrl_l_across: "Attached, Ctrl+L handled in E's key-down handler by SetFocus(H) with a, b, c queued behind it (one call, read after 120 ms): E gets WM_KEYDOWN Ctrl and L (GetFocus E, Ctrl down), then E WM_KILLFOCUS(other=Q) (GetFocus Q, GetActiveWindow Q inside), Q WM_SETFOCUS(other=E), Q WM_KILLFOCUS(other=H), H WM_SETFOCUS(other=Q) (GetFocus H, active Q); E gets WM_CHAR 0x0c; H gets the key-ups of L and Ctrl and then a, b, c whole (in the key-down of a GetFocus is H and Ctrl is up); text of H \"abc\"; GetGUIThreadInfo of both threads: active Q, focus H."
  errors_in_calls: "AttachThreadInput with a thread id that does not exist, with both ids equal, and a detach of threads that are not attached all return 0 with GetLastError 87 (ERROR_INVALID_PARAMETER)."
errors:
  invalid_parameter: "a thread id that does not exist, two equal ids, detaching threads that are not attached: FALSE, ERROR_INVALID_PARAMETER (87)"
side_effects: "none beyond the rules above"
threading: "the call attaches the input of two threads of one process; the tests run the second thread with its own message loop in the same process"
ordering: []
timing:
  typical: "the messages after a change arrive within about 100 ms"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations and a message log; run with poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because injected keys need the visible desktop. Window P (520x260 at 100,100, WS_EX_NOACTIVATE) is made the foreground window and has three EDIT children E, F, G (200x26 at x 10, y 10/50/90; the edit procedure is replaced by a logging one that calls the original); the focus starts on E; tests that need a second thread start one with its own window Q (WS_EX_NOACTIVATE, 320x120 at 700,100), its EDIT child H, and a message loop of GetMessage, TranslateMessage, DispatchMessage. Every scene prints the key and focus messages of every window of the test in the order they arrived under the window's tag letter (P, E, F, G, Q, H; handles are never printed), repeated identical lines once, then the texts of the three edits, the focus and whether a window of the test is in the foreground; scenes with a handler that moves the focus say so in the log. Keys sent in one SendInput call are left in the queue for 120 ms (no message read) where a scene says so; otherwise the loop reads them as they come. A scene takes about 300 to 600 ms and ends with the window destroyed.
not_covered: >
  Threads of different processes, the effect on SetForegroundWindow and on mouse capture, attaching a thread that has no window, three or more attached threads, attach and detach while keys wait in the queue.
