# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetDpiForWindow
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
oracle_200: "homeserver2 (real hardware, Intel UHD Graphics 630, one monitor without EDID) with its display temporarily set to 2560x1600 at a scale of 200 percent: the mode changed dynamically (ChangeDisplaySettingsEx, no registry write), the scale set to the 200 percent step through the display configuration API, and checked before the recording (a per-monitor aware process read GetDpiForSystem 192 and a 2560x1600 screen, an unaware one a 1280x800 screen); both put back to 1920x1080 and 100 percent afterwards and read back. Windows 11 Home 25H2 (build 26200.9974), the logged-on account in the interactive desktop session (session 1) through tools/pipeline/windows/poly-oracle.ps1 -Interactive, two runs of each test, identical; the taskbar is at the bottom and 96 physical pixels high (48 at 100 percent); the monitor has no EDID, so physical sizes assume 96 DPI (HORZSIZE 677 mm for 2560 pixels). Every test of this slice carries the session 'interactive-bottom/2560x1600/200' in its windows.json."
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. "GetDpiForWindow", "High DPI Desktop
  Application Development on Windows".
summary: >
  Returns the DPI of a window: for the windows of a DPI-unaware process 96,
  whatever their kind or position. 0 for a handle that is not a window.
interface:
  signature: "UINT GetDpiForWindow(HWND hwnd)"
rules:
  unaware: "96 for a visible popup, a child, a grandchild, a hidden popup, a hidden overlapped window, a message-only window, a window off the screen, the desktop window and a window of another thread"
  last_error: "unchanged on success"
  at_200_kinds: "a window has the DPI of the awareness context of the thread that created it: 96 for unaware (and GDI-scaled), 192 for system, per-monitor and per-monitor-v2, for a top-level, child, popup, owned and message-only window alike (tests dpi_win_*); the desktop window is 96 with context per-monitor whatever the caller is; NULL and a destroyed window: 0 with ERROR_INVALID_PARAMETER (87)"
  at_200_scale_change: "when the display scale changes while windows are open (tests dpi_change_*, display 200 percent -> 175 percent -> 200 percent): per-monitor and per-monitor-v2 windows get the new DPI (168, then 192) at once for top-level, child and popup windows; system aware windows and their GetDpiForSystem stay at 192; unaware windows stay at 96. See the rules of DisplayConfigSetDeviceInfo for the messages"

errors:
  bad_window: "NULL, a made-up handle, HWND_MESSAGE (-3), -1, 1, a destroyed window: 0, ERROR_INVALID_PARAMETER (87) (not ERROR_INVALID_WINDOW_HANDLE)"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 4  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  DPI-aware and per-monitor-aware processes and windows (DPI awareness
  contexts), other system DPIs. DPI awareness other than unaware (the tests
  have no manifest), several monitors, other keyboard layouts than German,
  IME, touch and pen, hooks, menus and the menu loop.
