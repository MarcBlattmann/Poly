# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/ToUnicodeEx
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%); tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner 'keeper' window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom; no mouse attached (mouse input comes from SendInput)"
  observed_by: spec-chrome-win-s3, spec-win-input
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above, and the recording of Chrome for Testing
  157.0.8103.38 for Windows (specs/windows/apps/chrome: traces, gap-map.md section 7, s3-windows.md) for which
  calls it makes and how often. Microsoft Learn reference pages of the functions and messages named here;
  winuser.h, wingdi.h, windef.h, dwmapi.h and winerror.h for constants and layouts. Wine's tests and
  Chromium's source were not read.
summary: >
  Translates a virtual key with a keyboard state (256 bytes: bit 0x80 down, bit 1 toggled) in the given layout
  to up to n UTF-16 units: returns the number of characters (1, 2), 0 when the key has no translation, a
  negative value for a dead key (the character is in buf and is held for the next call unless flags bit 4 is
  set). Chrome's browser calls it 4108 times a run (S3) with its own keyboard state and flags 4.
interface:
  signature: "int ToUnicodeEx(UINT vk, UINT scan, const BYTE *state, LPWSTR buf, int n, UINT flags, HKL layout)"
rules:
  letters: "no modifier: VK_P VK_O VK_L VK_Y 'p' 'o' 'l' 'y', VK_A 'a' (ret 1); with VK_SHIFT 0x80: 'P' 'O' 'L' 'Y' 'A'; with only VK_LSHIFT 0x80: the same as no modifier (the generic VK_SHIFT is what counts); CapsLock toggled (VK_CAPITAL low bit): upper case, with Shift too: lower case"
  control: "with VK_CONTROL 0x80: control characters (p -> U+0010, o -> U+000F, l -> U+000C, y -> U+0019, A -> U+0001); with VK_MENU 0x80 as well: the plain letter"
  dead_keys: "the oracle's layout has a dead key: with flags 4 it returns -1 with '^' in the buffer for buffer sizes 1 and 2 and returns 0 for a buffer of 0; repeated calls give the same result and a following 'a' or Space is the plain 'a' or ' ' (with bit 4 the dead key is not remembered); no key of the scan gives two characters"
  stability: "20 repeated calls with the same arguments give the same result; the state passed is not changed"
  layouts_loaded: "the added tests load the layouts they use with LoadKeyboardLayoutW(klid, KLF_NOTELLSHELL), not activating them, and pass the HKL returned to ToUnicodeEx and MapVirtualKeyExW: US (KLID 00000409, HKL 0x04090409), German (00000407, 0x04070407), Swiss German (00000807, 0x08070807), French (0000040C, 0x040C040C); the tables are of the layout of that HKL, not of the thread's layout"
  table_format: "the tests tue_<layout>_table print a row per key: the digits, the letters, VK_OEM_1..8 and VK_OEM_102, Space, Back, Tab, Return, Escape, VK_NUMPAD0-9 and the other pad keys, Left, Delete, 0x7F and VK_CANCEL, with the scan code of MapVirtualKeyExW(vk, MAPVK_VK_TO_VSC) and ten columns: N none, S Shift (VK_SHIFT), C Caps Lock (toggle bit of VK_CAPITAL), SC Shift and Caps, Ct Ctrl, CtS Ctrl+Shift, AG Ctrl+Alt (AltGr), AGS AltGr+Shift, Al Alt (VK_MENU), AGC AltGr and Caps; a cell is - (returns 0), xxxx (one unit), ~xxxx (a dead key: returns -1, the spacing character) or xxxx+yyyy (two units); all with flags 4 (the pending dead key is neither used nor changed)"
  compact_format: "in the tables below a key is NAME(scan code in hex) then COLUMN=CHARACTER for the cells that return a character (BS is the backslash, SP the space, two hex digits a control character, U+xxxx a character outside ASCII, ~ before a dead key); keys not listed return nothing in any column"
