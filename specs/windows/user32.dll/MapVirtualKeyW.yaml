# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/MapVirtualKeyW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read.
summary: >
  Translates between virtual-key codes, scan codes and characters with the
  calling thread's keyboard layout (the German layout on the oracle). Map
  types (winuser.h): MAPVK_VK_TO_VSC 0, MAPVK_VSC_TO_VK 1, MAPVK_VK_TO_CHAR
  2, MAPVK_VSC_TO_VK_EX 3, MAPVK_VK_TO_VSC_EX 4. Returns 0 when there is no
  translation.
interface:
  signature: "UINT MapVirtualKeyW(UINT code, UINT map_type)"
  return: "the translated code; 0 for none or on error"
  same_as_ex: "MapVirtualKeyExW with GetKeyboardLayout(0) gives the same result for every code 0..255 and every map type 0..4"
rules:
  vk_to_vsc: "German layout: A 0x1E, B 0x30, E 0x12, M 0x32, Q 0x10, Y 0x2C, Z 0x15 (Y and Z swapped against US), 0 0x0B, 1 0x02, 2 0x03, 6 0x07, 9 0x0A; VK_OEM_1 (0xBA) 0x1A, VK_OEM_PLUS 0x1B, VK_OEM_COMMA 0x33, VK_OEM_MINUS 0x35, VK_OEM_PERIOD 0x34, VK_OEM_2 (0xBF) 0x2B, VK_OEM_3 (0xC0) 0x27, VK_OEM_4 (0xDB) 0x0C, VK_OEM_5 (0xDC) 0x29, VK_OEM_6 (0xDD) 0x0D, VK_OEM_7 (0xDE) 0x28, VK_OEM_102 0x56; numpad 0 0x52, 5 0x4C, * 0x37, + 0x4E, - 0x4A, decimal 0x53, / 0x35, Num Lock 0x45; Left 0x4B, Up 0x48, Right 0x4D, Down 0x50, Insert 0x52, Delete 0x53, Home 0x47, End 0x4F, PgUp 0x49, PgDn 0x51 (no extended prefix); VK_SHIFT and VK_LSHIFT 0x2A, VK_RSHIFT 0x36, VK_CONTROL/VK_LCONTROL/VK_RCONTROL 0x1D, VK_MENU/VK_LMENU/VK_RMENU 0x38; Enter 0x1C, Space 0x39, Back 0x0E, Tab 0x0F, Escape 0x01, F1 0x3B, F10 0x44, F12 0x58, F24 0x76, Caps Lock 0x3A, Scroll Lock 0x46, LWin 0x5B, RWin 0x5C, Apps 0x5D, Print Screen (0x2C) 0x54; VK_PACKET, 0, 0xFF, VK_PAUSE (0x13): 0; VK_CANCEL (0x03) 0x46"
  vk_to_vsc_ex: "as VK_TO_VSC but the extended keys carry 0xE0 in the high byte: VK_DIVIDE 0xE035, VK_RCONTROL 0xE01D, VK_RMENU 0xE038, LWin 0xE05B, RWin 0xE05C, Apps 0xE05D, VK_CANCEL 0xE046, VK_PAUSE 0xE11D; the arrows, Insert/Delete/Home/End/PgUp/PgDn and Print Screen have no prefix (same as VK_TO_VSC)"
  vk_to_char: "the unshifted character: letters their capital (A 0x41 .. Z 0x5A), digits themselves; VK_OEM_1 U+00FC, VK_OEM_PLUS '+', VK_OEM_COMMA ',', VK_OEM_MINUS '-', VK_OEM_PERIOD '.', VK_OEM_2 '#', VK_OEM_3 U+00F6, VK_OEM_4 U+00DF, VK_OEM_7 U+00E4, VK_OEM_102 '<'; the dead keys with bit 31 set: VK_OEM_5 0x8000005E (^), VK_OEM_6 0x800000B4 (acute); numpad keys their character (0x30, 0x35, '*', '+', '-', ',' for decimal, '/'); Enter 0x0D, Space 0x20, Back 0x08, Tab 0x09, Escape 0x1B, VK_CANCEL 0x03; 0xFF gives 0x5E; modifiers, arrows, function and lock keys, Windows keys, VK_PACKET: 0"
  vsc_to_vk: "scan 0x00..0x7F (VSC_TO_VK / VSC_TO_VK_EX equal except where noted): 01 Esc, 02..0B the digits 1..9,0, 0C VK_OEM_4, 0D VK_OEM_6, 0E Back, 0F Tab, 10..19 Q W E R T Z U I O P, 1A VK_OEM_1, 1B VK_OEM_PLUS, 1C Enter, 1D VK_CONTROL (_EX VK_LCONTROL), 1E..26 A S D F G H J K L, 27 VK_OEM_3, 28 VK_OEM_7, 29 VK_OEM_5, 2A VK_SHIFT (_EX VK_LSHIFT), 2B VK_OEM_2, 2C..32 Y X C V B N M, 33 VK_OEM_COMMA, 34 VK_OEM_PERIOD, 35 VK_OEM_MINUS, 36 VK_SHIFT (_EX VK_RSHIFT), 37 VK_MULTIPLY, 38 VK_MENU (_EX VK_LMENU), 39 Space, 3A Caps Lock, 3B..44 F1..F10, 45 Num Lock, 46 Scroll Lock, 47 Home, 48 Up, 49 PgUp, 4A VK_SUBTRACT, 4B Left, 4C VK_CLEAR (0x0C), 4D Right, 4E VK_ADD, 4F End, 50 Down, 51 PgDn, 52 Insert, 53 Delete, 54 VK_SNAPSHOT, 55 0, 56 VK_OEM_102, 57 F11, 58 F12, 59 VK_CLEAR, 5A 0xEE, 5B 0xF1, 5C 0xEA, 5D 0xF9, 5E 0xF5, 5F 0xF3, 60 0, 61 0, 62 0xFB, 63 VK_HELP (0x2F), 64..6E F13..F23, 6F 0xED, 70 0, 71 0xE9, 72 0, 73 VK_ABNT_C1 (0xC1), 74 0, 75 0, 76 F24, 77..7A 0, 7B 0xEB, 7C Tab, 7D 0, 7E 0xC2, 7F 0. The 0x47..0x53 block maps to the navigation keys, not the numpad codes"
  vsc_ex: "VSC_TO_VK_EX (and VSC_TO_VK) with the 0xE0 prefix: E01C Enter, E01D VK_CONTROL (_EX VK_RCONTROL), E035 VK_DIVIDE, E037 VK_SNAPSHOT, E038 VK_MENU (_EX VK_RMENU), E047..E053 the navigation keys as without prefix, E05B LWin, E05C RWin, E05D Apps; E11D VK_PAUSE; E046 VK_CANCEL; E02A and E0FF: 0"
  round_trip: "VK_LSHIFT -> 0x2A -> VK_SHIFT (VSC_TO_VK) / VK_LSHIFT (_EX); VK_RSHIFT -> 0x36 -> VK_SHIFT / VK_RSHIFT; VK_RCONTROL -> 0x1D -> VK_CONTROL / VK_LCONTROL, but via VK_TO_VSC_EX 0xE01D -> VK_RCONTROL; VK_RMENU likewise via 0xE038"
errors:
  map_type: "map types 5, 6, 7, 8, 0x100, 0xFFFFFFFF: 0, last error ERROR_INVALID_PARAMETER (87)"
  vk_range: "VK_TO_VSC / VK_TO_CHAR of 0x100, 0x141, 0xFFFF: 0, ERROR_INVALID_PARAMETER (87)"
  scan_range: "VSC_TO_VK of 0x100 or 0x1E1E: 0"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test.
not_covered: >
  Other layouts; MAPVK_VK_TO_CHAR of keys whose character depends on Caps
  Lock. DPI awareness other than unaware (the tests have no manifest),
  several monitors, other keyboard layouts than German, IME, touch and pen,
  hooks, menus and the menu loop.
