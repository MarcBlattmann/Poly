# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/WindowFromPoint
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-b
  date: 2026-11-02
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Painting and Drawing", "Painting and Drawing Messages", "Keyboard Input
  Overview", "About Mouse Input", "About Cursors", "Regions", "Multiple
  Display Monitors", "High DPI Desktop Application Development on Windows";
  winuser.h, wingdi.h, windef.h and winerror.h for constants and layouts.
  Wine's tests were not read. Learn: WindowFromPoint, ChildWindowFromPoint,
  WM_NCHITTEST, WM_MOUSEACTIVATE, "About Mouse Input" (double clicks, mouse
  activation, the wheel), WM_CONTEXTMENU, WM_PARENTNOTIFY.
summary: >
  Returns the window at a screen point: the deepest visible, hit-testable
  child of the topmost visible top-level window there. It sends WM_NCHITTEST
  to the candidate windows of the calling thread; a window answering
  HTTRANSPARENT (-1) is passed over in favour of the window below it. Mouse
  input is routed the same way (to the window under the cursor), which these
  tests also record: button sequences, double clicks, mouse activation and
  the wheel.
interface:
  signature: "HWND WindowFromPoint(POINT point)"
  POINT: "passed by value (windef.h: two LONGs, 8 bytes)"
rules:
  children: "a point over a grandchild G inside child C gives G (only G gets WM_NCHITTEST); beside G, C; over a hidden child, P (P gets WM_NCHITTEST); over a disabled child, P; over a visible child of a hidden child, P"
  httransparent_child: "a child answering HTTRANSPARENT: it gets WM_NCHITTEST, then its parent P, and the result is P"
  ex_transparent: "a WS_EX_TRANSPARENT child or top-level window is returned like any other (X; it gets WM_NCHITTEST)"
  siblings: "of two overlapping children the one created first is on top (S, created before U, wins in the overlap)"
  edges: "the bottom-right pixel of a 400x300 popup at 100,100 (499,399) is P; 500,400 is not (\"other\")"
  child_from_point: "ChildWindowFromPoint(P, client point) returns the direct child of P containing the point, hidden and disabled ones included (H, D, T, Q), P for P's own area, NULL outside P; it sends no WM_NCHITTEST"
  toplevel: "of overlapping top-level windows the one on top in z order (the later created; after SetWindowPos(A, HWND_TOP) A); a hidden top-level window is skipped; a disabled top-level window is returned (D) without WM_NCHITTEST; a top-level answering HTTRANSPARENT gives the window below it (Z, after WM_NCHITTEST to T and then Z); a WS_EX_LAYERED popup never given its attributes is returned (L)"
  framed: "a framed window (WS_OVERLAPPEDWINDOW at 100,250 300x200, window rect 100,250,400,450) is returned at its caption (no WM_NCHITTEST was sent for that point), its client area, its left edge pixel 100 and bottom edge pixel 449 (with WM_NCHITTEST); x 99 is outside"
  outside: "a point over no window of the process gives another process's window, never NULL on this desktop"
  routing: "a cursor move onto a window of the thread (no capture): WM_NCHITTEST (screen coordinates), WM_SETCURSOR (wParam the window under the cursor, LOWORD(lParam) the hit-test code, HIWORD the mouse message), WM_MOUSEMOVE (client coordinates, MK_* keys); a button event: WM_NCHITTEST twice, WM_SETCURSOR, the button message; the button-up: WM_NCHITTEST, WM_SETCURSOR, the button message; while the window is active, clicks bring no activation messages"
  double_click: "CS_DBLCLKS (0x0008): a second left-button-down within GetDoubleClickTime (500 ms) at the same point gives WM_LBUTTONDBLCLK in place of WM_LBUTTONDOWN (then WM_LBUTTONUP); a third quick click is a plain WM_LBUTTONDOWN again; the second click 1 px to the right is still a double click, 3 px to the right or 2 px down is not (SM_CXDOUBLECLK and SM_CYDOUBLECLK are 4); right and middle buttons likewise give WM_RBUTTONDBLCLK (0x0206) and WM_MBUTTONDBLCLK (0x0209); a class without CS_DBLCLKS gets two WM_LBUTTONDOWN"
  mk_bits: "wParam keys: MK_LBUTTON 1, MK_RBUTTON 2, MK_SHIFT 4, MK_MBUTTON 0x10 (winuser.h); the button that went down is set in its down message, cleared in its up message; right clicked while left is held: WM_RBUTTONDOWN 3, WM_RBUTTONUP 1; with Shift held: WM_LBUTTONDOWN 5, WM_LBUTTONUP 4"
  contextmenu: "DefWindowProc answers WM_RBUTTONUP with WM_CONTEXTMENU (wParam the window, lParam the screen point), sent right after the WM_RBUTTONUP"
  mouse_activate: "a click into an inactive top-level popup B: WM_NCHITTEST twice, WM_MOUSEACTIVATE (wParam B as the top-level window, hit 1, WM_LBUTTONDOWN) answered MA_ACTIVATE (1) by DefWindowProc, then A WM_NCACTIVATE 0 and WM_ACTIVATE 0 (other B), B WM_WINDOWPOSCHANGING/CHANGED (flags 0x3 / 0x1803: brought to the top), WM_NCACTIVATE 1, WM_ACTIVATE WA_CLICKACTIVE (2, other A), A WM_KILLFOCUS, B WM_SETFOCUS, then WM_SETCURSOR and WM_LBUTTONDOWN; afterwards B is active, focused and foreground"
  ma_noactivateandeat: "MA_NOACTIVATEANDEAT (4) from WM_MOUSEACTIVATE: no activation, WM_SETCURSOR comes but the WM_LBUTTONDOWN is dropped; the WM_LBUTTONUP is delivered"
  ma_noactivate: "MA_NOACTIVATE (3): no activation, the WM_LBUTTONDOWN and WM_LBUTTONUP are delivered"
  child_activate: "a click into child K of an inactive popup P: P gets WM_PARENTNOTIFY(WM_LBUTTONDOWN) first, then K WM_MOUSEACTIVATE (top P), which DefWindowProc passes to P (P WM_MOUSEACTIVATE top P, answers 1, K answers 1), then P's activation, then WM_SETCURSOR to K and to P (DefWindowProc passes it up), K WM_LBUTTONDOWN"
  wheel: "the wheel (SendInput MOUSEEVENTF_WHEEL, 120) went to the window under the cursor, not the focus window: with A active and focused and the cursor over B, B got WM_NCHITTEST and WM_MOUSEWHEEL (keys 0, delta 120, screen coordinates); over A, A got it"
errors:
  none: "none observed"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each
  carrying its own declarations (Learn prototypes, header constants) and a
  message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because painting and input need the visible
  desktop. Window procedures log documented messages only (the "documented"
  and "documented_b" sets in the tests): never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels; the cursor is parked at (1500, 600) at the start
  and put back at the end; keyboard input is sent only while a window of the
  test is in the foreground and clicks only onto a window of the test. Mouse
  input in these tests is SendInput button events at the cursor, and cursor
  moves by SetCursorPos; a window is printed as its tag letter (A, B, ...),
  "ours" (of the test, no tag), "other" (another process) or "null".
not_covered: >
  The wheel routing follows the user setting "Scroll inactive windows when I
  hover over them" (on here); with it off, the wheel goes to the focus
  window. X buttons, horizontal wheel, clicks in the non-client area. DPI
  awareness other than unaware (the tests have no manifest), several
  monitors, other keyboard layouts than German, IME, touch and pen, hooks,
  menus and the menu loop.
