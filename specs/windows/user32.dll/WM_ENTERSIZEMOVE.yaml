# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/WM_ENTERSIZEMOVE
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar 48 px high at the bottom (work area 0,0,1920,1032); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); the user's keyboard layouts: German (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID (HKL 0x04072000), and under English (United Kingdom) Swiss German (HKL 0x08070809) and German (HKL 0x04070809); Caps Lock and Num Lock off; other layouts are loaded for a test with LoadKeyboardLayoutW(KLF_NOTELLSHELL) and unloaded again, the user's list is back as it was"
  observed_by: spec-win-input
  date: 2026-11-16
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn reference pages of the functions
  and messages named here, "Keyboard Input Overview", "About Keyboard Input", "About Mouse Input", "Using Mouse
  Input", "Virtual-Key Codes", "Window Features", "Window Styles", "Keyboard identifiers and input method
  editors", "NONCLIENTMETRICSW"; winuser.h, windef.h and winerror.h for constants and layouts. Wine's tests were
  not read.
summary: >
  The modal move and size loop of the default window procedure: from the press on a border or the caption
  (WM_NCLBUTTONDOWN, WM_SYSCOMMAND SC_SIZE / SC_MOVE) to the release (WM_EXITSIZEMOVE), and the messages per
  pointer step (WM_SIZING / WM_MOVING, WM_WINDOWPOSCHANGING, WM_NCCALCSIZE, WM_WINDOWPOSCHANGED, WM_MOVE,
  WM_SIZE).
interface:
  signature: "WM_ENTERSIZEMOVE / WM_EXITSIZEMOVE (wParam 0, lParam 0), WM_SIZING (wParam: edge, lParam: RECT*), WM_MOVING (lParam: RECT*)"
rules:
  what: "the modal sizing and moving loop DefWindowProc enters when the left button goes down on a border, a corner or the caption (and when WM_NCLBUTTONDOWN with HTLEFT..HTBOTTOMRIGHT or HTCAPTION is sent to it): the exact messages the window gets per pointer step; driven in the tests with real mouse input (SendInput, absolute moves) from a helper thread while the window's thread pumps; windows of style WS_OVERLAPPEDWINDOW at 200,200 size 420x300 (client 404x261)"
  press: "a press on the left border (hit-test HTLEFT) gives: WM_NCHITTEST screen=203,350, WM_SETCURSOR hit=HTLEFT 10 msg=0x0201, WM_NCLBUTTONDOWN hit=HTLEFT screen=203,350, WM_SYSCOMMAND cmd=0xf000 low=0x1 at=203,350, WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE, WM_SIZING edge=1 rect=170,200,620,500, WM_WINDOWPOSCHANGING x=170 y=200 cx=450 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=170,200,620,500 - that is WM_NCHITTEST (answer HTLEFT), WM_SETCURSOR(HTLEFT, WM_LBUTTONDOWN), WM_NCLBUTTONDOWN(wParam = the hit code, lParam = the screen point), WM_SYSCOMMAND (wParam SC_SIZE 0xF000 | the edge in the low four bits, lParam the screen point), WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE; the edge numbers are the WMSZ_ values of Learn (1 left, 2 right, 3 top, 4 top left, 5 top right, 6 bottom, 7 bottom left, 8 bottom right) and are the low nibble of the SC_SIZE command: HTLEFT 1, HTRIGHT 2, HTTOP 3, HTTOPLEFT 4, HTTOPRIGHT 5, HTBOTTOM 6, HTBOTTOMLEFT 7, HTBOTTOMRIGHT 8"
  press_caption: "a press on the caption (HTCAPTION): WM_SETCURSOR, WM_NCLBUTTONDOWN(HTCAPTION), WM_SYSCOMMAND with 0xF010 (SC_MOVE) | 2 in the low nibble, then WM_CAPTURECHANGED (before the loop is announced), WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE; the first message may be WM_NCHITTEST when the pointer had not been over the window"
  step_sizing: "every pointer step of a size loop, one pointer position: WM_SIZING(wParam = the edge, lParam = the new window rectangle in screen coordinates: the rectangle at the press moved by the pointer's offset on the edge(s) being dragged, clamped to the minimum and maximum tracking sizes), WM_WINDOWPOSCHANGING (x y cx cy of that rectangle, flags 0x80214 = SWP_NOZORDER|SWP_NOACTIVATE|SWP_NOOWNERZORDER plus 0x80000 which winuser.h does not name; insertAfter 0), WM_GETMINMAXINFO, WM_NCCALCSIZE(wParam TRUE, the new window rectangle), WM_WINDOWPOSCHANGED (the same, flags 0x80214 when the window moved too (left and top edges) and 0x81216 when only the size changed (right, bottom: SWP_NOMOVE|SWP_FRAMECHANGED-like bits 0x1002 added)), WM_MOVE (left and top edges only, the new client origin), WM_SIZE(SIZE_RESTORED, the new client size); example, the left edge dragged by -30: WM_WINDOWPOSCHANGED x=170 y=200 cx=450 cy=300 flags=0x80214 after=0, WM_MOVE x=178 y=231, WM_SIZE type=0 w=434 h=261, WM_SIZING edge=1 rect=140,200,620,500, WM_WINDOWPOSCHANGING x=140 y=200 cx=480 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=140,200,620,500, WM_WINDOWPOSCHANGED x=140 y=200 cx=480 cy=300 flags=0x80214 after=0"
  step_moving: "every pointer step of a move loop (caption): WM_MOVING(the new rectangle), WM_WINDOWPOSCHANGING (flags 0x80214), WM_GETMINMAXINFO, WM_WINDOWPOSCHANGED (flags 0x80a15), WM_MOVE; no WM_NCCALCSIZE and no WM_SIZE since the size does not change; example: WM_WINDOWPOSCHANGING x=225 y=215 cx=420 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGED x=225 y=215 cx=420 cy=300 flags=0x80a15 after=0, WM_MOVE x=233 y=246, WM_MOVING rect=260,240,680,540"
  end: "button release: WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING with the final rectangle (flags 0x0204 = SWP_NOZORDER|SWP_NOOWNERZORDER for a size loop, 0x0205 with SWP_NOSIZE for a move loop), WM_GETMINMAXINFO, WM_EXITSIZEMOVE; then the pointer is looked at again (WM_NCHITTEST, WM_SETCURSOR, WM_NCMOUSEMOVE or WM_MOUSEMOVE at the pointer's place); the left-edge example ends: WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=220,200,620,500, WM_WINDOWPOSCHANGED x=220 y=200 cx=400 cy=300 flags=0x80214 after=0, WM_MOVE x=228 y=231, WM_SIZE type=0 w=384 h=261, WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING x=220 y=200 cx=400 cy=300 flags=0x0204 after=0, WM_GETMINMAXINFO, WM_EXITSIZEMOVE, WM_NCHITTEST screen=223,350, WM_SETCURSOR hit=HTLEFT 10 msg=0x0200, WM_NCMOUSEMOVE hit=HTLEFT screen=223,350"
  click_only: "a press and release on the border without moving: WM_NCHITTEST screen=616,350, WM_SETCURSOR hit=HTRIGHT 11 msg=0x0201, WM_NCLBUTTONDOWN hit=HTRIGHT screen=616,350, WM_SYSCOMMAND cmd=0xf000 low=0x2 at=616,350, WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE, WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x0204 after=0, WM_GETMINMAXINFO, WM_EXITSIZEMOVE, WM_NCHITTEST screen=616,350, WM_SETCURSOR hit=HTRIGHT 11 msg=0x0200, WM_NCMOUSEMOVE hit=HTRIGHT screen=616,350"
  escape: "Escape during the loop (WM_KEYDOWN is not delivered; its WM_KEYUP arrives after WM_EXITSIZEMOVE) puts the window back: the loop ends with WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING (original rectangle, flags 0x0204), WM_GETMINMAXINFO, WM_NCCALCSIZE, WM_WINDOWPOSCHANGED (0x0204), WM_MOVE, WM_SIZE, WM_EXITSIZEMOVE, and the button release afterwards does nothing: WM_WINDOWPOSCHANGED x=140 y=200 cx=480 cy=300 flags=0x80214 after=0, WM_MOVE x=148 y=231, WM_SIZE type=0 w=464 h=261, WM_WINDOWPOSCHANGING x=140 y=200 cx=480 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING x=200 y=200 cx=420 cy=300 flags=0x0204 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,620,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=420 cy=300 flags=0x0204 after=0, WM_MOVE x=208 y=231, WM_SIZE type=0 w=404 h=261, WM_EXITSIZEMOVE, WM_KEYUP vk=0x1b"
  sent_ncl: "WM_NCLBUTTONDOWN with HTRIGHT sent with SendMessage from the window's own thread (no real press) enters the same loop inside the SendMessage call (the helper thread's moves and release end it; SendMessage then returns 0): WM_NCLBUTTONDOWN hit=HTRIGHT screen=616,350, WM_SYSCOMMAND cmd=0xf000 low=0x2 at=616,350, WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE, WM_SIZING edge=2 rect=200,200,650,500 ..."
  mintrack: "the rectangle in WM_SIZING and WM_WINDOWPOSCHANGING is already clamped to the minimum tracking size (SM_CXMINTRACK x SM_CYMINTRACK, WM_GETMINMAXINFO's ptMinTrackSize equals them): WM_SIZING edge=2 rect=200,200,470,500, WM_WINDOWPOSCHANGING x=200 y=200 cx=270 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,470,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=270 cy=300 flags=0x81216 after=0, WM_SIZE type=0 w=254 h=261, WM_SIZING edge=2 rect=200,200,336,500, WM_WINDOWPOSCHANGING x=200 y=200 cx=136 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,336,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=136 cy=300 flags=0x81216 after=0, WM_SIZE type=0 w=120 h=261"
  handler_changes: "a window procedure may change the rectangle in WM_SIZING / WM_MOVING and return TRUE: the next WM_WINDOWPOSCHANGING and the window use the changed rectangle (minimum width 450 and left edge at least 100 in the test): WM_WINDOWPOSCHANGING x=200 y=200 cx=470 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,670,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=470 cy=300 flags=0x81216 after=0, WM_SIZE type=0 w=454 h=261, WM_SIZING edge=2 rect=200,200,520,500, WM_WINDOWPOSCHANGING x=200 y=200 cx=450 cy=300 flags=0x80214 after=0, WM_GETMINMAXINFO, WM_NCCALCSIZE calc_valid_rects=1 rect=200,200,650,500, WM_WINDOWPOSCHANGED x=200 y=200 cx=450 cy=300 flags=0x81216 after=0, WM_SIZE type=0 w=434 h=261, WM_SIZING edge=2 rect=200,200,590,500"
  minmax: "WM_GETMINMAXINFO inside the loop leaves the values the system filled: ptMaxSize the monitor size plus 16, ptMaxPosition (-8,-8) relative to the work area's top left, ptMinTrackSize the SM_CXMINTRACK/SM_CYMINTRACK, ptMaxTrackSize the virtual screen plus 20 (1940x1100); traces print numbers close to the work area as L-8, T-8, W+16"
  poly_today: "Poly's border resize today sends none of WM_ENTERSIZEMOVE, WM_SIZING, WM_EXITSIZEMOVE, WM_CAPTURECHANGED: each pointer step is one SetWindowPos in the window's thread; the sequences above are what a Windows program expects"
errors:
  none: "no error cases observed"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture, key state and the keyboard layout are per thread (per input queue) unless noted"
ordering:
  - "press: WM_NCHITTEST, WM_SETCURSOR, WM_NCLBUTTONDOWN, WM_SYSCOMMAND(SC_SIZE|edge or SC_MOVE|2), [WM_CAPTURECHANGED for a move], WM_GETMINMAXINFO, WM_ENTERSIZEMOVE, WM_NCMOUSELEAVE"
  - "each pointer step: WM_SIZING, WM_WINDOWPOSCHANGING, WM_GETMINMAXINFO, WM_NCCALCSIZE, WM_WINDOWPOSCHANGED, [WM_MOVE], WM_SIZE; or WM_MOVING, WM_WINDOWPOSCHANGING, WM_GETMINMAXINFO, WM_WINDOWPOSCHANGED, WM_MOVE"
  - "release: WM_CAPTURECHANGED, WM_WINDOWPOSCHANGING, WM_GETMINMAXINFO, WM_EXITSIZEMOVE"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 0  # count in <symbol>.tests/
  held_out: 0  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll and gdi32.dll by name, each carrying its own declarations (Learn
  prototypes, header constants) and a message log; run with poly-oracle.ps1 -Interactive (see
  docs/AGENT_PIPELINE.md) because input, focus and sizing need the visible desktop. Window procedures log
  documented messages only and the traces leave out painting, timers, WM_GETICON, IME messages and registered
  messages; handles are printed as tag letters, never as values; numbers close to the monitor's work area are
  printed relative to it (L-8, W+16) so the taskbar's place does not matter. Test windows are placed in the
  top-left 1000x500 pixels (except where a test says otherwise), closed within seconds; the cursor is parked at
  (1500, 600) and put back; keyboard input is sent only while a window of the test is in the foreground and
  clicks only onto a window of the test. Keyboard layout tests load the layouts they use with
  LoadKeyboardLayoutW(KLF_NOTELLSHELL) and unload them again; the user's own layouts are never unloaded or
  reordered.
not_covered: >
  Keyboard sizing (Alt+Space, arrow keys), the loop of a maximized window, snapping and shake gestures, windows
  with several monitors, DPI changes while sizing, WM_SIZING with a WS_EX_LAYERED or child window, touch and
  pen.
