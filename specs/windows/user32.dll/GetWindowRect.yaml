# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetWindowRect
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1, two runs each, identical; the SSH session is session 0 with its non-interactive window station, whose desktop is not visible; screen 1024x768, 32 bpp, 96 DPI, no shell (explorer) running"
  observed_by: spec-win-gui-a
  date: 2026-11-02
oracle_200: "homeserver2 (real hardware, Intel UHD Graphics 630, one monitor without EDID) with its display temporarily set to 2560x1600 at a scale of 200 percent: the mode changed dynamically (ChangeDisplaySettingsEx, no registry write), the scale set to the 200 percent step through the display configuration API, and checked before the recording (a per-monitor aware process read GetDpiForSystem 192 and a 2560x1600 screen, an unaware one a 1280x800 screen); both put back to 1920x1080 and 100 percent afterwards and read back. Windows 11 Home 25H2 (build 26200.9974), the logged-on account in the interactive desktop session (session 1) through tools/pipeline/windows/poly-oracle.ps1 -Interactive, two runs of each test, identical; the taskbar is at the bottom and 96 physical pixels high (48 at 100 percent); the monitor has no EDID, so physical sizes assume 96 DPI (HORZSIZE 677 mm for 2560 pixels). Every test of this slice carries the session 'interactive-bottom/2560x1600/200' in its windows.json."
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About
  Messages and Message Queues", "Window Features", "About Painting and
  Drawing", "Device Contexts"; winuser.h, wingdi.h, windef.h and winerror.h
  for constants and layouts. Wine's tests were not read.
summary: >
  Returns a window's rectangle in screen coordinates, frame included, for
  top-level windows and children alike.
interface:
  signature: "BOOL GetWindowRect(HWND hwnd, RECT* rect)"
rules:
  toplevel: "as created: WS_OVERLAPPEDWINDOW 100,50 320x240 -> 100,50,420,290"
  child: "parent client origin + position: a WS_BORDER child at 5,7 of a popup at 10,20 with WS_BORDER and WS_EX_CLIENTEDGE (client origin 13,23) -> 18,30,68,70"
  negative: "top-level windows may be at negative coordinates"
  desktop: "the desktop: 0,0,1024,768"
  during_creation: "0,0,0,0 in WM_GETMINMAXINFO; the final rectangle from WM_NCCREATE on"
  mapping: "ClientToScreen, ScreenToClient and MapWindowPoints agree with it; MapWindowPoints returns MAKELONG(dx, dy) of the offset applied"
  at_200_units: "an unaware or GDI-scaled caller works in units of half a physical pixel, an aware one in physical pixels. A window made at 100,100 of size 400x300 (WS_OVERLAPPEDWINDOW) has the window rectangle 100,100,500,400 for both, and the client rectangle 384x261 (client origin on screen 108,131) for unaware, 374x229 (origin 113,158) for aware (the frame is scaled: 192 DPI); its physical size is twice as big for the unaware one (200,200,1000,800). Desktop window and its client: 0,0,1280,800 or 0,0,2560,1600. After SetWindowPos(50,60,300x200): window 50,60,350,260 and client 284x161 (unaware) or 274x129 (aware); after MoveWindow(20,30,640x480): client 624x441 or 614x409. Popup 200,150 250x120: window 200,150,450,270 and client 250x120 for both. A WS_CHILD|WS_BORDER window at 10,20 of size 100x50 in the overlapped one: window (screen) 38,81,138,131 (unaware) or 43,108,143,158 (aware), client 98x48 for both; MapWindowPoints(child -> screen) of (0,0) and (100,50): 39,82 139,132 or 44,109 144,159. A tool-window style window 200x100 has client 184x61 (unaware) or 174x29 (aware). CW_USEDEFAULT size: 960x543 (unaware) or 1920x1107 (aware)"
  at_200_other_process: "a window of a per-monitor-v2 process (created at 50,50 of size 300x200 physical, tests) as an UNAWARE caller sees it: rectangle 25,25,175,125 (half), client 150x100, client origin 25,25, GetDpiForWindow 192, context per-monitor-v2, WindowFromPoint at the middle of that rectangle is the window, MapWindowPoints(window -> screen) of (10,10) is (35,35); SetWindowPos(window, 400,300, no resize) by the unaware caller: it reads 400,300,550,400 and a per-monitor-v2 thread reads 800,600,1100,800 (size 300x200 unchanged); MoveWindow(200,150,320x240) by the unaware caller: it reads 200,150,520,390 and the aware thread 400,300,1040,780 (size 640x480). As any AWARE caller (system, per-monitor v1 or v2 parent; the child of any aware kind) it reads 50,50,350,250, client 300x200, origin 50,50, GetDpiForWindow 192, (10,10) maps to (60,60); SetWindowPos to 400,300 gives 400,300,700,500 and MoveWindow 200,150,520,390 (the same to every awareness)"
  at_200_unaware_window_seen_by_aware: "a window of an UNAWARE process created at 50,50 of size 300x200 in its own units (physical 100,100,700,500) as a per-monitor-v2 caller sees it: rectangle 100,100,700,500, client 600x400, origin 100,100, GetDpiForWindow 96, context unaware; SetWindowPos(400,300) by the aware caller: 400,300,1000,700 (physical, size 600x400); MoveWindow(200,150,320x240): 200,150,520,390 (physical, so 320x240 physical pixels). Two unaware processes see 50,50,350,250 client 300x200; after SetWindowPos(400,300) the rectangle is 400,300,700,500 and a per-monitor-v2 thread reads 800,600,1400,1000; after MoveWindow(200,150,320x240) 200,150,520,390 and an aware thread reads 400,300,1040,780 (client 640x480)"
  at_200_thread_contexts: "the same window read from threads of every context (testsprocess unaware, one window of each context 100,100 400x300): an unaware or GDI-scaled thread sees an unaware or GDI-scaled window at 100,100,500,400 and an aware window (system, per-monitor, per-monitor-v2) at 50,50,250,200 (half; client 187x114, origin 57,79); an aware thread sees an aware window at 100,100,500,400 (client 374x229, origin 113,158) and an unaware window doubled: 200,200,1000,800 (client 768x522, origin 216,262). GetDpiForWindow does not depend on the thread (96 for unaware windows, 192 for aware ones)"

errors:
  bad_handle: "0, ERROR_INVALID_WINDOW_HANDLE (1400); the RECT is left as it was"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; calls on a window of another thread of the process work as noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 13  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) that import user32.dll and gdi32.dll by name
  (allowed since this slice); each carries its own declarations (Learn
  prototypes, header constants) and a message log helper; window procedures
  log only documented messages (see "documented" in the tests), never
  painting messages, activation or IME traffic, handles, times or cascading
  default positions. Today Poly has no GUI user32/gdi32, so the tests do not
  start there.
not_covered: >
  Everything that needs a visible desktop: WM_PAINT, WM_ERASEBKGND and
  WM_NCPAINT generation, update regions (InvalidateRect, ValidateRect,
  GetUpdateRect, UpdateWindow, BeginPaint/EndPaint inside WM_PAINT),
  IsWindowVisible of shown windows, window DC clipping - in the oracle's
  session no window is visible (IsWindowVisible is 0 for every shown window,
  InvalidateRect leaves no update region and no WM_PAINT comes); they need
  the interactive desktop and are a later entry. Real input (SendInput),
  focus and activation, menus and the menu loop, hooks, DPI awareness.
