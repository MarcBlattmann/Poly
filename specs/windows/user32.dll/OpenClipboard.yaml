# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/OpenClipboard
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above). Learn pages "Clipboard Operations", "Clipboard
  Formats", "Clipboard Notifications" (WM_CLIPBOARDUPDATE), "Synthesized
  Clipboard Formats". Wine's tests were not read for this entry.
summary: >
  Opens the clipboard for the calling thread so that it can read and change
  it. The window is the "open window" (GetOpenClipboardWindow) and, after an
  EmptyClipboard, the owner; NULL is allowed and then there is no open
  window. Only one opener at a time: a second open fails with
  ERROR_ACCESS_DENIED unless it repeats the first (same window) or both pass
  NULL.
interface:
  signature: "BOOL OpenClipboard(HWND hWndNewOwner)"
  constants: "winuser.h formats: CF_TEXT 1, CF_BITMAP 2, CF_OEMTEXT 7, CF_DIB 8, CF_UNICODETEXT 13, CF_HDROP 15, CF_LOCALE 16, CF_DIBV5 17, CF_PRIVATEFIRST 0x200..CF_PRIVATELAST 0x2FF, CF_GDIOBJFIRST 0x300..0x3FF; registered formats 0xC000..0xFFFF"
rules:
  repeat: "Opening again with the same window, or again with NULL, by the thread that holds it succeeds (TRUE, no error); the opens do not count: one CloseClipboard ends them all and a second close fails with ERROR_CLIPBOARD_NOT_OPEN"
  other_window: "While the clipboard is open for window A, OpenClipboard(B) and OpenClipboard(NULL) by the same thread fail with ERROR_ACCESS_DENIED (5); GetOpenClipboardWindow is still A. While it is open for NULL, OpenClipboard(A) by that thread fails with 5 as well"
  other_thread: "Another thread cannot open it for a window (5) or for NULL (5) while a thread holds it for a window. Exception: while a thread holds it open for NULL, another thread may open it for NULL too (TRUE, error 0); the open state is then shared: the second thread's CloseClipboard ends it for both and the first thread's later CloseClipboard fails with ERROR_CLIPBOARD_NOT_OPEN"
  other_thread_blocked: "While a thread holds it for its own window, the main thread's OpenClipboard(window) and OpenClipboard(NULL) fail with 5, and its EmptyClipboard fails with ERROR_CLIPBOARD_NOT_OPEN (1418); GetOpenClipboardWindow answers the holder's window"
  window_of_other_thread: "The window may belong to another thread: OpenClipboard succeeds, GetOpenClipboardWindow returns it, EmptyClipboard makes it the owner"
  desktop: "GetDesktopWindow() is accepted; GetOpenClipboardWindow then returns it"
  last_error: "a successful call leaves the last error as it was"
  open_window_destroyed: "Destroying the open window closes the clipboard: GetOpenClipboardWindow and GetClipboardOwner are NULL afterwards, CloseClipboard fails with 1418 and a new open (NULL) succeeds"
  owner_destroyed: "Destroying the owner (not open) clears the owner. The system sends the window WM_RENDERALLFORMATS first, even when it has nothing delayed, and no WM_DESTROYCLIPBOARD"
  ownership: "Opening alone does not change the owner, nor does an open and close for NULL; EmptyClipboard makes the open window the owner (none for NULL). Adding data (SetClipboardData) does not change it either"
  null_opener_may_change: "An opener for NULL can EmptyClipboard (TRUE, no error; the owner becomes none and the old owner gets WM_DESTROYCLIPBOARD) and can SetClipboardData (returns the handle)"
errors:
  bad_window: "a handle that is not a window (made-up value, -1, HWND_MESSAGE, a destroyed window): FALSE, ERROR_INVALID_WINDOW_HANDLE (1400)"
  held: "the clipboard is held by someone else: FALSE, ERROR_ACCESS_DENIED (5)"
side_effects: "Makes the clipboard open for the thread. Nothing else changes: no message, the sequence number does not move."
threading: "the clipboard is one object per desktop; the open state belongs to the thread that opened it (see the rules for what other threads may do); windows belong to the thread that created them and their procedures run in it; messages to the owner are sent synchronously and need that thread to dispatch"
ordering:
  - "A window destroyed while it is the owner: WM_RENDERALLFORMATS (no WM_DESTROYCLIPBOARD)"
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows). Every test starts
  and ends with an emptied clipboard (open for NULL, EmptyClipboard, close)
  and never prints what was on it before; the windows are hidden popup
  windows of the test whose procedure logs the clipboard messages
  (WM_RENDERFORMAT, WM_RENDERALLFORMATS, WM_DESTROYCLIPBOARD,
  WM_CLIPBOARDUPDATE) under the window's tag letter; sequence numbers are
  printed as differences, registered format numbers never. Tests use
  GlobalAlloc blocks and a bitmap from CreateBitmap as data.
not_covered: >
  opens from another process; the clipboard being held by another program
  (the tests retry for up to two seconds); the viewer chain
  (SetClipboardViewer) Several monitors, other system DPIs (the oracle is
  one 1920x1080 monitor at 96 DPI, scale 100%), a manifest (the tests have
  none: awareness is set with the API), other keyboard layouts than German,
  installed input methods (the oracle has none active), touch and pen,
  hooks, menus and dialogs, comctl32 controls, themed (visual style)
  painting, clipboard contents put there by other programs or by the cloud
  clipboard and clipboard history.
