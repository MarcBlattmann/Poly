# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/user32.dll/GetSystemMetricsForDpi
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, Intel UHD 630, one monitor 1920x1080 at 32 bpp, 96 DPI, scale 100%), tests run by tools/pipeline/windows/poly-oracle.ps1 -Interactive: in the interactive desktop session (session 1) of the logged-on user through a one-time scheduled task, with the runner \"keeper\" window in the foreground and the cursor at (1500, 600) at the start of each run, two runs each, identical; explorer running, its taskbar at the top (work area 0,24,1920,1080); no mouse attached (SM_MOUSEPRESENT 0; mouse input comes from SendInput); keyboard: German layout (KLID 00000407) under the input language English (Switzerland), en-CH, which has no LCID, so HKL 0x04072000; Caps Lock and Num Lock off"
  observed_by: spec-win-gui-c
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions and messages named here, "About the
  Clipboard", "Using the Clipboard", "Clipboard Formats", "Standard
  Clipboard Formats", "High DPI Desktop Application Development on Windows",
  "DPI_AWARENESS_CONTEXT", "Multiple Display Monitors", "Window Features"
  (layered windows, window regions), "About Cursors", "About Icons",
  "Desktop Window Manager" (dwmapi), "Input Method Manager" (imm32), "About
  Messages and Message Queues"; winuser.h, wingdi.h, windef.h, winbase.h,
  dwmapi.h, imm.h, shellscalingapi.h and winerror.h for constants and
  layouts. The conformance tests of Wine were consulted only where the own
  sources line of an entry says so, for ideas of what to observe; no code or
  expected value of theirs is used (every value in these sheets was observed
  on the machine above).
summary: >
  Returns a system metric as it is at a given DPI. Sizes scale with the DPI
  (scroll bars, caption and buttons, icons, cursors above 32, menu, frame,
  padded border, minimum track sizes, icon spacing); counts, flags, screen
  and work-area values, borders, edges, double-click and drag rectangles,
  focus borders and minimised sizes do not. DPI 0, 0x10000 and 0xFFFFFFFF
  fail; the results do not depend on the process's awareness.
interface:
  signature: "int GetSystemMetricsForDpi(int nIndex, UINT dpi)"
  system_dpi: "at 96 every index 0..99 equals GetSystemMetrics (100 of 100), also in a per-monitor-v2 process"
rules:
  scaling_table: "values at DPI 96/120/144/168/192/240/288/384: SM_CXVSCROLL, SM_CYHSCROLL (2, 3, 9, 10, 20, 21) 17/21/26/30/34/43/51/68; SM_CYCAPTION (4) and SM_CYSMCAPTION (51) 23/29/34/40/45/56/67/89; SM_CXICON, SM_CYICON (11, 12) 32/40/48/56/64/80/96/128; SM_CXCURSOR, SM_CYCURSOR (13, 14) 32/32/48/48/64/64/96/128; SM_CYMENU (15) 20/25/30/34/39/49/58/77; SM_CXMIN (28), SM_CXMINTRACK (34) 136/166/198/232/258/324/384/510; SM_CYMIN (29), SM_CYMINTRACK (35) 39/47/56/64/71/88/103/135; SM_CXSIZE (30) 36/46/54/64/72/91/109/145; SM_CYSIZE (31), SM_CXSMSIZE (52), SM_CYSMSIZE (53) 22/28/33/39/44/55/66/88; SM_CXFRAME, SM_CYFRAME (32, 33) 4/4/5/5/5/6/6/7; SM_CXICONSPACING, SM_CYICONSPACING (38, 39) 75/94/113/131/150/188/225/300; SM_CXSMICON, SM_CYSMICON (49, 50) 16/20/24/28/32/40/48/64; SM_CXMENUSIZE, SM_CYMENUSIZE (54, 55) 19/24/29/33/38/48/57/76; SM_CXMENUCHECK, SM_CYMENUCHECK (71, 72) 15/19/25/29/31/41/47/65; SM_CXPADDEDBORDER (92) 4/5/6/7/8/10/12/16"
  not_scaled: "unchanged at all DPIs: SM_CXSCREEN 1920, SM_CYSCREEN 1080, SM_CXFULLSCREEN 1920, SM_CYFULLSCREEN 1033, SM_CXBORDER/SM_CYBORDER 1, SM_CXDLGFRAME/SM_CYDLGFRAME 3, SM_CXEDGE/SM_CYEDGE 2, SM_CXDOUBLECLK/SM_CYDOUBLECLK 4, SM_CXDRAG/SM_CYDRAG 4, SM_CXFOCUSBORDER/SM_CYFOCUSBORDER 1, SM_ARRANGE 8, SM_CXMINSPACING 160, SM_CYMINSPACING 28, SM_CXMINIMIZED 160, SM_CYMINIMIZED 28, SM_CXMAXTRACK 1940, SM_CYMAXTRACK 1100, SM_CXMAXIMIZED 1936, SM_CYMAXIMIZED 1072, SM_NETWORK (63) 3, SM_CXVIRTUALSCREEN 1920, SM_CYVIRTUALSCREEN 1080, SM_CMONITORS 1, SM_SAMEDISPLAYFORMAT 1, SM_IMMENABLED 1, index 85 gives 4 and 93 gives 516 at every DPI (indices winuser.h does not define; same as GetSystemMetrics); all other defined flag/count indices 0"
  odd_dpis: "rounding at odd DPIs, SM_CYCAPTION: DPI 1 24, 2 24, 24 7, 48 12, 72 18, 95 23, 97 23, 100 24, 119 28, 121 29, 130 31, 1000 230, 4000 918, 0xFFFF 15019, 0x7FFFFFFF 15019; SM_CXICON: 1 0, 2 1, 24 8, 48 16, 72 24, 95 32, 100 33, 1000 333, 4000 1333, 0xFFFF 21845; SM_CXCURSOR is 32 for DPIs up to 130 and 128 from 1000; SM_CXPADDEDBORDER: 1 0, 24 1, 48 2, 72 3, 95 4, 1000 42, 4000 100 (capped), SM_CXFRAME 3 at DPIs 1, 2 and 24 and 4 from 48 on, 13 at 1000, 45 at 4000, 686 at 0xFFFF; unscaled indices (45, 7, 59) are the same at every valid DPI; the last error is unchanged for these"
errors:
  bad_dpi: "DPI 0, 0x10000 and 0xFFFFFFFF: 0 and ERROR_INVALID_PARAMETER (87)"
  bad_index: "negative indices, 100, 1000, 0xFFF, 0x1001, 0x7FFFFFFF, INT_MIN: 0 and ERROR_INVALID_PARAMETER (87); 0x1000 (SM_REMOTESESSION), 0x2000 and 0x2001: 0 with the last error unchanged"
side_effects: "none beyond the rules above"
threading: "windows belong to the thread that created them; focus, activation, capture and key state are per thread (per input queue) unless noted"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing user32.dll, gdi32.dll and, as the entry
  needs, dwmapi.dll, imm32.dll and shcore.dll by name, each carrying its own
  declarations (Learn prototypes, header constants); run with
  poly-oracle.ps1 -Interactive (see docs/AGENT_PIPELINE.md) because
  painting, input and the clipboard need the visible desktop. Window
  procedures log documented messages only: never handles (a window in a
  message is printed as its tag letter, "ours", "other" or "null"), times,
  WM_GETICON, IME or registered messages. Test windows are placed in the
  top-left 1000x500 pixels and closed within seconds; the cursor is parked
  at (1500, 600) at the start and put back at the end; the clipboard is
  emptied at the end of every test that touches it; a test changes no system
  setting (only the state of its own process and windows).
not_covered: >
  values other than at a 96 DPI primary monitor for the screen and work area
  metrics Several monitors, other system DPIs (the oracle is one 1920x1080
  monitor at 96 DPI, scale 100%), a manifest (the tests have none: awareness
  is set with the API), other keyboard layouts than German, installed input
  methods (the oracle has none active), touch and pen, hooks, menus and
  dialogs, comctl32 controls, themed (visual style) painting, clipboard
  contents put there by other programs or by the cloud clipboard and
  clipboard history.
