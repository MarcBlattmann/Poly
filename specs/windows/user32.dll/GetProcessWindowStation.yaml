sources: >
  The same observations as the SetProcessWindowStation entry of this DLL; the calls are made by the tests of that entry and of CreateWindowStationW, CreateDesktopW and GetThreadDesktop.
summary: >
  Returns the handle of the process's window station: the handle passed to the last SetProcessWindowStation, or the process's own at start. No tests of its own: the tests of SetProcessWindowStation call it.
same_as: "windows/api/user32.dll/SetProcessWindowStation"
interface:
  signature: "HWINSTA GetProcessWindowStation(void)"
rules:
  returns: "a valid handle (UOI_NAME readable with the right rights); after SetProcessWindowStation(h) exactly h; after switching back the first handle again; no last error is set"
