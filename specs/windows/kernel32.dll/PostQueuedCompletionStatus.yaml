# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/PostQueuedCompletionStatus.yaml
id: windows/api/kernel32.dll/PostQueuedCompletionStatus
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: PostQueuedCompletionStatus, I/O Completion Ports, Standard Access Rights. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Queues a packet with caller-chosen byte count, key and OVERLAPPED pointer on a completion port. The values are not interpreted. The port handle needs the right to modify the port's state.
interface:
  signature: "BOOL PostQueuedCompletionStatus(HANDLE port, DWORD bytes, ULONG_PTR key, LPOVERLAPPED overlapped)"
rules:
  values: "any values: 0xFFFFFFFF bytes, ULONG_PTR maximum key and pointer, a NULL pointer; 2000 packets queue without loss and come out in order."
  ordering: "packets posted and packets of completed I/O requests are in one queue ordered by when they were queued: a post, then a read completing, then a post come out in that order."
  rights: "a duplicate of the port handle with IO_COMPLETION_MODIFY_STATE (0x2) can post and dequeue; one with only SYNCHRONIZE fails to post with ERROR_ACCESS_DENIED (5) and its GetQueuedCompletionStatus fails with ERROR_ACCESS_DENIED without consuming the packet; a duplicate with no rights fails to post with ERROR_ACCESS_DENIED."
  lifetime: "a duplicate of the port handle keeps the port alive after the original is closed; it can still post and dequeue."
errors:
  not_a_port: "an event, NULL, INVALID_HANDLE_VALUE or a closed handle: ERROR_INVALID_HANDLE (6)"
  no_right: "ERROR_ACCESS_DENIED (5)"
side_effects: "adds a packet"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Files other than named pipes (the packets and errors are the same mechanism; pipes were used as the I/O source), remote machines, completion ports with several competing threads under load, the concurrency limit's effect on wake-up order.
