# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetVolumePathNameW.yaml
id: windows/api/kernel32.dll/GetVolumePathNameW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-6
  date: 2026-11-16
sources: >
  Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). Microsoft Learn's page for each function and the public SDK headers it names (winbase.h, synchapi.h, processthreadsapi.h, fileapi.h, appmodel.h, psapi.h, winternl.h, rpcdce.h, winevt/winbase.h); constants and error codes from winerror.h and ntstatus.h. The call lists of the apps that stop on these calls (Firefox 160, PortableGit's sh.exe) come from running them on Poly and from the call tracer on Windows; nothing of those programs, of Windows or of Wine was read or disassembled.
summary: >
  The root of the volume that holds a path. The path need not exist; relative paths resolve against the current directory's volume; prefixes are kept.
interface:
  signature: "BOOL GetVolumePathNameW(LPCWSTR lpszFileName, LPWSTR lpszVolumePathName, DWORD cchBufferLength)"
chrome:
  call: "Chrome for Testing 157.0.8103.38, browser process, once per download (spec-chrome-dl): GetVolumePathNameW(<the download folder, an existing folder>, buf, 260) = TRUE, then GetVolumeInformationW on the root it gave. The call leaves the last error at ERROR_MORE_DATA (234)."
rules:
  drive_paths: "\"C:\\Windows\\System32\\notepad.exe\", \"C:\\no\\such\\dir\\file.txt\", \"C:\", \"C:\\\", \"C:/Windows/System32\", \"C:\\Windows\\..\\Windows\", \"C:\\a b\\c\" and \"C:file\" all give \"C:\\\" (the drive letter keeps the case given: \"c:\\windows\" gives \"c:\\\")."
  prefixes: "\"\\\\?\\C:\\Windows\" gives \"\\\\?\\C:\\\"; \"\\\\.\\C:\\Windows\" gives \"\\\\.\\C:\\\"; \"NUL\" gives \"\\\\.\\NUL\\\"."
  relative: "\"relative\\path\", \".\", \"..\", \"\\\" and \"\\Windows\" give the current directory's volume (\"C:\\\")."
  failures: "\"\" and \"\\\\server\\share\\dir\\file\" (no such server), \"\\\\?\\UNC\\server\\share\\dir\" and a \\\\?\\Volume{...} name of no volume: FALSE, ERROR_INVALID_NAME (123); \"Z:\\x\" (no such drive): FALSE, ERROR_FILE_NOT_FOUND (2); a NULL name: FALSE, ERROR_INVALID_PARAMETER (87)."
  buffer: "the buffer must hold the root and its NUL: for \"C:\\Windows\\System32\": 0 units: FALSE, 87; 1 and 2 units: FALSE, ERROR_FILENAME_EXCED_RANGE (206) with the first unit set to 0; 3 units: TRUE with \"C:\" and a NUL (no backslash); 4: \"C:\\\"."
  long_path: "a 319-unit path gives \"C:\\\"."
  last_error_after_success: "a successful call leaves the last error at ERROR_MORE_DATA (234) in the cases seen (an existing folder and a path in a folder that is not there; observed by the tests of kernel32.dll/GetVolumeInformationW, gvi_calls); callers do not look at it, but a program that clears the last error before the call sees 234 afterwards."
errors:
  invalid_name: "123"
  no_such_drive: "2"
  buffer_too_small: "206"
  zero_buffer: "87"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, kept in three files that make the same calls and write every third observation line. Each file declares what it calls from Learn's prototypes (rpcrt4.dll is looked up at run time). Observations are return values, error codes, booleans and relations, never addresses, handles, process ids, times or machine-dependent text.
not_covered: >
  Volume mount points, network paths of a reachable server, subst drives.
