# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/DeleteProcThreadAttributeList.yaml
id: windows/api/kernel32.dll/DeleteProcThreadAttributeList
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: DeleteProcThreadAttributeList, InitializeProcThreadAttributeList, UpdateProcThreadAttribute. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Releases what InitializeProcThreadAttributeList set up (the caller still owns the memory). Deleting an untouched list, a list with attributes, or a list already used for several children is fine; deleting does not affect a child already created.
interface:
  signature: "void DeleteProcThreadAttributeList(LPPROC_THREAD_ATTRIBUTE_LIST list)"
rules:
  untouched: "deleting a list that had no attributes added returns normally."
  reuse_memory: "the memory can hold a new list afterwards: the same address is initialised and updated again (observed with the same buffer, 50 cycles with counts 1..5)."
  after_createprocess: "a child created with the list keeps running and keeps what it inherited when the list is deleted right after CreateProcessW returned, or while the child is still running."
  several_children: "one list can be used for several CreateProcessW calls in a row (three seen) before it is deleted."
errors:
  none: "no failing case observed (the function returns nothing)"
side_effects: "none visible"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  AppContainer (SECURITY_CAPABILITIES) and other attributes that need a profile or a token, PROC_THREAD_ATTRIBUTE_PARENT_PROCESS effects, jobs with CPU/memory/IO rate limits, job time limits and their notifications, UI restrictions.
