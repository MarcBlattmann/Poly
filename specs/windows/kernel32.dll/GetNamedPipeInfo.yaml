# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetNamedPipeInfo.yaml
id: windows/api/kernel32.dll/GetNamedPipeInfo
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: GetNamedPipeInfo, CreateNamedPipeW. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Reports a pipe handle's end (client or server), type (byte or message), buffer sizes and maximum instance count. Every out-parameter is optional. It works on either end and after the peer is gone, but needs FILE_READ_ATTRIBUTES, which the server handle of an outbound pipe does not have.
interface:
  signature: "BOOL GetNamedPipeInfo(HANDLE pipe, LPDWORD flags, LPDWORD outBufferSize, LPDWORD inBufferSize, LPDWORD maxInstances)"
rules:
  life: "A server instance is created with CreateNamedPipeW and starts listening. It becomes connected when a client opens the pipe with CreateFileW (whether or not ConnectNamedPipe was called) or when ConnectNamedPipe completes. When the client closes its handle the instance stays taken (closing) until the server calls DisconnectNamedPipe; a new client meanwhile gets ERROR_PIPE_BUSY. After DisconnectNamedPipe the instance is not yet listening: clients still get ERROR_PIPE_BUSY until the server calls ConnectNamedPipe again."
  flags: "client end 0, server end 1 (PIPE_SERVER_END), message type adds 4; PIPE_REJECT_REMOTE_CLIENTS adds 8 on the server handle."
  sizes: "buffer sizes as given to CreateNamedPipeW (300 and 700 seen) from the server handle; the client handle reports the same numbers (300 and 700 seen); with 0 the sizes are 0."
  max_instances: "the maximum given to the first instance (3, 255 seen) from both ends."
  optional_outputs: "any out-parameter may be NULL, all four at once as well."
  after_peer_closed: "still answers on the server handle after the client closed."
  access: "the server handle of an outbound pipe (write-only) fails with ERROR_ACCESS_DENIED; the write-only client handle of an inbound pipe works (flags 0), and so does the read-only server handle of an inbound pipe (flags 1)."
  non_pipe: "a regular file handle fails with ERROR_INVALID_PARAMETER (87); an event, INVALID_HANDLE_VALUE or a closed handle with ERROR_INVALID_HANDLE (6)."
errors:
  write_only_server: "ERROR_ACCESS_DENIED (5)"
  file_handle: "ERROR_INVALID_PARAMETER (87)"
  bad_handle: "ERROR_INVALID_HANDLE (6)"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Remote clients and other machines, security descriptors on the pipe, impersonation, several sessions.
