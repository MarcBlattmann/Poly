# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/FindFirstFileExW.yaml
id: windows/api/kernel32.dll/FindFirstFileExW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave the same output except where a sheet says what a 32-bit caller sees."
  observed_by: spec-win-updater-services
  date: 2026-11-20
sources: >
  Observations of our own 64-bit test programs on the machine above (each test ran at least twice with identical output). Microsoft Learn pages of the functions (kernel32 / fileapi.h, winbase.h, processthreadsapi.h, wow64apiset.h, memoryapi.h, synchapi.h, combaseapi.h, objbase.h, userenv.h) for names, parameters and the error values in winerror.h. What the documentation does not say (error codes, edge cases, the effect of access rights) is taken from the observations only. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Starts a directory listing. FindExInfoStandard (0) fills the short name, FindExInfoBasic (1) leaves it empty; FindExSearchNameMatch (0) matches the pattern; FindExSearchLimitToDirectories (1) is a hint that is not enforced. FindNextFileW goes on until ERROR_NO_MORE_FILES 18; FindClose ends the search.
interface:
  signature: "HANDLE FindFirstFileExW(LPCWSTR lpFileName, FINDEX_INFO_LEVELS fInfoLevelId, LPVOID lpFindFileData, FINDEX_SEARCH_OPS fSearchOp, LPVOID lpSearchFilter, DWORD dwAdditionalFlags)"
installer: "Google's updater 157 and 159 (32-bit) import this function; their run on Poly reaches it while they install and start their two services and register their update service and scheduled task. What they pass is not known beyond the import. Chrome's elevation service, setup.exe and notification helper import it as well."
rules:
  listing: "a pattern * lists '.' and '..' first and then the entries in alphabetical order (alpha.txt, bravo-long-file-name.txt, Charlie.dat, sub: letter case ignored); each entry has its attributes (0x10 for directories, 0x20 for files) and size; the last FindNextFileW fails with ERROR_NO_MORE_FILES 18"
  wildcards: "*.txt matches the two .txt files (not the directory); a?pha.* matches alpha.txt; an exact name matches one entry; an exact name in another letter case also matches (also with FIND_FIRST_EX_CASE_SENSITIVE (1) on a directory that is not case-sensitive)"
  short_name: "the short (8.3) name field is empty for every entry with FindExInfoBasic; with FindExInfoStandard it is set for a file whose name does not fit 8.3 on a volume that creates short names (bravo-long-file-name.txt) and empty for names that fit"
  no_match: "a name that does not exist and a wildcard without a match: INVALID_HANDLE_VALUE with ERROR_FILE_NOT_FOUND 2; a directory that does not exist: ERROR_PATH_NOT_FOUND 3; the directory path with a trailing backslash and no wildcard: ERROR_FILE_NOT_FOUND 2"
  directory_itself: "the path of a directory without a wildcard returns one entry: the directory itself with its own name"
  subdirectory: "sub\\* lists '.', '..' and the files of the directory"
  patterns: "with FindExInfoBasic over a directory with the names noext, a.b.c, .hidden-name, UPPER.TXT, 'with space.txt', hid.dat (hidden), sys.dat (system), ro.dat (read-only), ab: '*' and '*.*' and '*.*.*' and the doubled-backslash form list all nine (and '.' and '..'); hidden, system and read-only files are listed with attribute bits 0x2, 0x4 and 0x1; '*.' lists the names without an extension (ab, noext) and also .hidden-name, in an order that is not the alphabetical one; '.*' lists .hidden-name only; 'a*' lists a.b.c and ab; '*b' lists ab; 'a?' lists ab; '???' lists ab as well (a '?' matches no character at the end of a name, so '?' lists '.' and '..'); '*.dat' and '*.DAT' list the three .dat files (case ignored); '*t' lists six names; '*.txt' two; 'a.b.*' lists a.b.c; 'noext.' and 'noext ' (a trailing dot or space) list noext; '...' fails with ERROR_FILE_NOT_FOUND 2; '*\\x' (a wildcard in a directory part) fails with ERROR_INVALID_NAME 123"
  hints: "FindExSearchLimitToDirectories (1) still lists the files; FIND_FIRST_EX_LARGE_FETCH (2) lists the same entries"
  bad_arguments: "an info level 2, a search op 3 and flags 0x100 each fail with ERROR_INVALID_PARAMETER 87"
errors:
  file_not_found: "ERROR_FILE_NOT_FOUND 2"
  path_not_found: "ERROR_PATH_NOT_FOUND 3"
  no_more_files: "ERROR_NO_MORE_FILES 18"
  invalid_parameter: "ERROR_INVALID_PARAMETER 87"
side_effects: "none"
threading: "a search handle is used by one thread at a time"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, run on the oracle with the elevated token in the interactive session. Scenarios that could end the process (a NULL pointer where the function reads or writes through it) run in a child process of the same image (`--child ...`) and the parent prints the exit code. Observations are results, error codes, booleans and counts; never addresses, process or thread ids, times or the name of the machine. Files the tests make live next to the test program and are deleted by the test.
not_covered: >
  the order of entries on other file systems, reparse points, search filters, FindExSearchLimitToDevices, very long paths, and the times in the data record.
