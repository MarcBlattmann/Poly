# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/SetFileCompletionNotificationModes.yaml
id: windows/api/kernel32.dll/SetFileCompletionNotificationModes
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: SetFileCompletionNotificationModes, I/O Completion Ports. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Tunes completion notification for a handle: FILE_SKIP_COMPLETION_PORT_ON_SUCCESS (1) queues no packet when a request completes before the call returns, and FILE_SKIP_SET_EVENT_ON_HANDLE (2) does not signal the file handle for such completions. Requests that complete later behave as before.
interface:
  signature: "BOOL SetFileCompletionNotificationModes(HANDLE file, UCHAR flags)"
rules:
  default: "a read that finds its data at once returns TRUE with the bytes and also queues a packet."
  skip_port: "after FILE_SKIP_COMPLETION_PORT_ON_SUCCESS: the same read returns TRUE with the bytes and no packet is queued (a 100 ms wait finds nothing). A read that has to wait still queues its packet when data arrives, and so does a failure that arrives later (ERROR_BROKEN_PIPE)."
  skip_event: "without an event in the OVERLAPPED the file handle is signalled when a request completes at once; after FILE_SKIP_SET_EVENT_ON_HANDLE it is not (WaitForSingleObject(handle, 0) gives WAIT_TIMEOUT)."
  without_port: "the flags can be set on a handle that is not on a port (both flags together as well)."
  flags_zero: "flags 0 returns TRUE for any handle value, including INVALID_HANDLE_VALUE, an event and an already closed handle: the handle is not looked at."
  unknown_flags: "bits other than 1 and 2 (0x80, 0x04, 0x03|0x08) fail with ERROR_INVALID_PARAMETER (87)."
errors:
  unknown_bits: "ERROR_INVALID_PARAMETER (87)"
  bad_handle: "with a non-zero flags value: INVALID_HANDLE_VALUE, an event, a port handle or a closed handle: ERROR_INVALID_HANDLE (6)"
side_effects: "changes the handle's notification behaviour for later requests"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Files other than named pipes (the packets and errors are the same mechanism; pipes were used as the I/O source), remote machines, completion ports with several competing threads under load, the concurrency limit's effect on wake-up order.
