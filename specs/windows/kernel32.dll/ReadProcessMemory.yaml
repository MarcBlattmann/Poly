# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/ReadProcessMemory.yaml
id: windows/api/kernel32.dll/ReadProcessMemory
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave the same output except where a sheet says what a 32-bit caller sees."
  observed_by: spec-win-updater-services
  date: 2026-11-20
sources: >
  Observations of our own 64-bit test programs on the machine above (each test ran at least twice with identical output). Microsoft Learn pages of the functions (kernel32 / fileapi.h, winbase.h, processthreadsapi.h, wow64apiset.h, memoryapi.h, synchapi.h, combaseapi.h, objbase.h, userenv.h) for names, parameters and the error values in winerror.h. What the documentation does not say (error codes, edge cases, the effect of access rights) is taken from the observations only. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Copies bytes out of the address space of a process. The handle needs PROCESS_VM_READ (the pseudo handle of the calling process always works). A read that cannot be completely served copies nothing and returns FALSE.
interface:
  signature: "BOOL ReadProcessMemory(HANDLE hProcess, LPCVOID lpBaseAddress, LPVOID lpBuffer, SIZE_T nSize, SIZE_T *lpNumberOfBytesRead)"
installer: "Google's updater 157 and 159 (32-bit) import this function; their run on Poly reaches it while they install and start their two services and register their update service and scheduled task. What they pass is not known beyond the import. Chrome's setup.exe imports it too."
rules:
  success: "TRUE with the bytes in the buffer and *lpNumberOfBytesRead = nSize for a committed range (a static of the caller; a range ending exactly at the end of the committed page); the count pointer may be NULL; nSize 0 gives TRUE and a count of 0"
  partial: "a read that starts in a committed page and runs into an uncommitted page, a read of an uncommitted page, of a page with no access, of address 0 and of address 0x10 fails with ERROR_PARTIAL_COPY 299 and the count is 0 and no byte is written (all or nothing on this system)"
  kernel_address: "an address in the kernel half fails with ERROR_NOACCESS 998"
  handle: "the NULL handle and a handle value that is not open fail with ERROR_INVALID_HANDLE 6; a closed handle too; a handle with only SYNCHRONIZE fails with ERROR_ACCESS_DENIED 5; PROCESS_VM_READ is enough"
  other_process: "a child process of the same image: with a PROCESS_VM_READ handle the bytes of a static string of the child are read (all 24 bytes, and 5 bytes from its middle); with a handle that only has PROCESS_QUERY_LIMITED_INFORMATION: ERROR_ACCESS_DENIED 5; an address the child does not have: ERROR_PARTIAL_COPY 299; after the child ended the handle still works as a handle, and the read fails with ERROR_PARTIAL_COPY 299 (not ERROR_INVALID_HANDLE)"
errors:
  partial_copy: "ERROR_PARTIAL_COPY 299"
  access_denied: "ERROR_ACCESS_DENIED 5"
  invalid_handle: "ERROR_INVALID_HANDLE 6"
  no_access: "ERROR_NOACCESS 998"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, run on the oracle with the elevated token in the interactive session. Scenarios that could end the process (a NULL pointer where the function reads or writes through it) run in a child process of the same image (`--child ...`) and the parent prints the exit code. Observations are results, error codes, booleans and counts; never addresses, process or thread ids, times or the name of the machine. Files the tests make live next to the test program and are deleted by the test.
not_covered: >
  reads of 32-bit processes through a 64-bit caller, of shared sections and of guard pages; a read that spans two committed ranges of different protection.
