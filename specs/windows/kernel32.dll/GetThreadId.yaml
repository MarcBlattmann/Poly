# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetThreadId.yaml
id: windows/api/kernel32.dll/GetThreadId
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: GetThreadId function, OpenThread function, CreateProcessW function, Thread Security and Access Rights. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Returns the thread id a handle names, 0 with an error for a handle that is no thread or has no query right. The thread pseudo-handle names the calling thread.
interface:
  signature: "DWORD GetThreadId(HANDLE thread)"
rules:
  pseudo_handle: "GetThreadId(GetCurrentThread()) equals GetCurrentThreadId()."
  created_thread: "a handle returned by CreateThread names the thread that runs (the id it sees itself); ids are non-zero multiples of 4 and differ from the caller's."
  opened_by_id: "OpenThread(THREAD_QUERY_LIMITED_INFORMATION, ..., id) and DuplicateHandle with that right give handles that report the same id."
  rights: "a handle with only SYNCHRONIZE: 0 with ERROR_ACCESS_DENIED (5)."
  child_main_thread: "the thread handle CreateProcessW returns names the child's main thread: a non-zero id different from the process id; GetProcessId on the process handle returns the process id; it still works after the child ended as long as the handle is open."
  not_a_thread: "an event, a bad handle value or NULL: 0 and ERROR_INVALID_HANDLE (6); the current-process pseudo-handle: 0, ERROR_INVALID_HANDLE; a process handle: 0, ERROR_INVALID_HANDLE; a thread handle passed to GetProcessId: 0, ERROR_INVALID_HANDLE."
errors:
  no_right: "ERROR_ACCESS_DENIED (5)"
  not_a_thread: "ERROR_INVALID_HANDLE (6)"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Image sections (SEC_IMAGE), large pages, section offsets in the megabytes, physical memory, sections of other users' processes, security descriptors.
