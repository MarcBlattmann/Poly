# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/RegisterWaitForSingleObject.InWaitThread.yaml
id: windows/api/kernel32.dll/RegisterWaitForSingleObject.InWaitThread
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory; the loopback and the internet were available"
  observed_by: spec-win-chrome-setup
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, and the observed call trace of Chrome for Testing 157 (its network service, headless, github.com and bbc.com, specs/windows/apps/chrome/traces/net-*.trace.json: function names, counts and first-call order only). Microsoft Learn: RegisterWaitForSingleObject, UnregisterWaitEx, UnregisterWait, WAITORTIMERCALLBACK, Thread Pools. Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  RegisterWaitForSingleObject as Chrome's ObjectWatcher calls it (460 registrations and cancellations per page load in the network service): an infinite wait on an event with WT_EXECUTEINWAITTHREAD | WT_EXECUTEONLYONCE (flags 12). The callback runs on a pool wait thread (never the caller's), once only although the manual-reset event stays signalled; callbacks of waits that share a wait thread run one after the other (a blocked callback holds up the next); 200 live waits are served by one wait thread; UnregisterWaitEx's three forms behave differently while a callback runs.
interface:
  signature: "BOOL RegisterWaitForSingleObject(PHANDLE out, HANDLE obj, WAITORTIMERCALLBACK cb, PVOID ctx, ULONG ms, ULONG flags); BOOL UnregisterWaitEx(HANDLE wait, HANDLE completion); BOOL UnregisterWait(HANDLE wait)"
rules:
  once: "flags 12, INFINITE, a manual-reset event: TRUE with a wait handle; no callback before SetEvent; after SetEvent one callback with timedOut 0, on a thread that is not the caller; still one call 200 ms later although the event stays signalled."
  unregister_idle: "UnregisterWaitEx(h, NULL) after the callback ran: TRUE; UnregisterWaitEx(h, INVALID_HANDLE_VALUE) of a wait that never fired: TRUE and the callback never runs even if the event is set afterwards; UnregisterWait(h) of a wait that never fired: TRUE."
  serialised: "two waits whose callbacks would run in the same wait thread: while the first callback blocks, the second callback does not start (it started after the first was released); both ran in the end."
  unregister_running: "while a callback is running: UnregisterWaitEx(h, NULL): FALSE with ERROR_IO_PENDING (997) at once; UnregisterWaitEx(h, event): FALSE with 997, the event not signalled yet, signalled after the callback returned (the callback had finished); UnregisterWaitEx(h, INVALID_HANDLE_VALUE): blocks until the callback returned and then returns TRUE."
  many: "200 live registrations each on its own event: all returned a handle; after all 200 events were set, every callback ran exactly once, all on 1 distinct thread, none on the caller; UnregisterWaitEx(h, INVALID_HANDLE_VALUE) of all 200 returned TRUE."
errors:
  pending: "ERROR_IO_PENDING (997) from UnregisterWaitEx(h, NULL or event) while the callback runs"
side_effects: "none outside the test's own handles"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except the waits named in the rules"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), the same program three times (cnet_regwait, cnet_regwait_b, cnet_regwait_c): each makes every call and writes every third observation line (the first line is the first file's, the second the second file's, and so on), so each program is complete and the three together give the whole list. Each declares what it calls from Learn's prototypes; observations are return values, error codes, counts and relations, never handles, addresses, ports or times.
not_covered: >
  timeouts and repeating waits (RegisterWaitForSingleObject's own sheet), WT_EXECUTELONGFUNCTION, waits on the same event in several registrations, more than 200 waits (a second wait thread), registering from a thread-pool callback.
