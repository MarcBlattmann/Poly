# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/ReadFileEx.yaml
id: windows/api/kernel32.dll/ReadFileEx
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: ReadFileEx, FileIOCompletionRoutine callback function, SleepEx, Alertable I/O. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Starts an overlapped read whose completion is delivered as a user APC: the completion routine runs in the issuing thread during an alertable wait, with the error code, the byte count and the OVERLAPPED pointer. Handles that are on a completion port are refused.
interface:
  signature: "BOOL ReadFileEx(HANDLE file, LPVOID buffer, DWORD bytes, LPOVERLAPPED overlapped, LPOVERLAPPED_COMPLETION_ROUTINE routine)"
rules:
  queued: "returns TRUE when the request is accepted, also when the data is already there; the routine does not run inside the call or during a plain Sleep."
  alertable: "SleepEx(ms, TRUE) in the issuing thread then runs the routine and returns WAIT_IO_COMPLETION (192); with nothing to deliver it waits out the time and returns 0."
  arguments: "the routine gets (0, bytes, the OVERLAPPED pointer) for success; for a request that failed because the peer closed: (ERROR_BROKEN_PIPE, 0, ...). The data is in the buffer."
  order: "two reads completing at different times run their routines in completion order within one alertable wait."
  port: "a handle associated with a completion port is refused: FALSE, ERROR_INVALID_PARAMETER (87)."
  synchronous_handle: "a handle opened without FILE_FLAG_OVERLAPPED: observed TRUE with last error 0 (the read is accepted)."
errors:
  port_handle: "ERROR_INVALID_PARAMETER (87)"
side_effects: "starts a read; the routine runs later"
threading: "the routine runs in the thread that issued the request, only while it waits alertably"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Files other than named pipes (the packets and errors are the same mechanism; pipes were used as the I/O source), remote machines, completion ports with several competing threads under load, the concurrency limit's effect on wake-up order.
