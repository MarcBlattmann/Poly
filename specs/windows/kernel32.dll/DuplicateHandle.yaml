# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/DuplicateHandle.yaml
id: windows/api/kernel32.dll/DuplicateHandle
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-5
  date: 2026-11-11
sources: >
  Observations of our own test programs on the machine above, and Chrome's call as recorded in specs/windows/apps/chrome/traces/s1-crashpad-handler.monitor-self.trace.json (n=616) and s1-crashpad-handler.trace.json. Microsoft Learn: "DuplicateHandle function (handleapi.h)", "Section Objects and Views", "File Mapping Security and Access Rights", "Access Rights and Access Masks", "Generic Access Rights", "How DACLs Control Access to an Object", "Null DACLs and Empty DACLs"; winnt.h, winbase.h and winerror.h for constants. The other behaviour of the call (attributes, DUPLICATE_CLOSE_SOURCE, other processes) is in specs/windows/ntdll.dll/NtDuplicateObject.yaml (spec-win-ipc). Wine's tests were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Makes a second handle to the object of a handle. This sheet settles one question the NtDuplicateObject sheet left wrong: what happens when the duplicate is to have MORE access than the source handle has. The answer is not "always allowed": the request is checked against the object's security descriptor like an open of the object would be, an object without a security descriptor allows everything, and a file allows nothing beyond the source. Chrome's crash handler relies on the refusal: it asks for write access to a read-only section handle to find out whether the handle is really read-only, and takes ERROR_ACCESS_DENIED as the proof.
interface:
  signature: "BOOL DuplicateHandle(HANDLE hSourceProcessHandle, HANDLE hSourceHandle, HANDLE hTargetProcessHandle, LPHANDLE lpTargetHandle, DWORD dwDesiredAccess, BOOL bInheritHandle, DWORD dwOptions)"
  returns: "nonzero on success; 0 and a last error on failure"
  options: "DUPLICATE_CLOSE_SOURCE 0x1, DUPLICATE_SAME_ACCESS 0x2 (winnt.h)"
  native: "kernel32's function is NtDuplicateObject with bInheritHandle as OBJ_INHERIT; a refused request is STATUS_ACCESS_DENIED (0xC0000022) there and ERROR_ACCESS_DENIED (5) here"
chrome:
  call: "crash handler (chrome.exe --type=crashpad-handler), n=616 of the monitor-self trace: DuplicateHandle(current process, <the read-only section handle the browser passed in --user-stream-region>, current process, &h, SECTION_MAP_WRITE (2), FALSE, 0) returns FALSE with ERROR_ACCESS_DENIED (5). The handler then maps the handle with FILE_MAP_READ (n=633). In the aggregated stage-1 trace every Chrome process has such refused calls (the DuplicateHandle rows with last error 5)"
  why_it_matters: "Poly returned TRUE: the handler then took the handle for a writable one, closed the duplicate and skipped the mapping (chrome-win-b4 hand-off, step 8). Not fatal in stage 1, but every read-only shared memory region goes through this check"
  what_it_needs: "a section keeps the security descriptor it was created with, and a duplicate that asks for more than its source is checked against it. The section Chrome passes does not allow its own user SECTION_MAP_WRITE; a section created with an empty DACL behaves exactly like it in every line of the tests"
rules:
  not_more_than_the_source: "a request for the source handle's access or part of it is always granted, with no check, whatever the object's security says: from a handle with SECTION_QUERY | SECTION_MAP_READ (0x5) on a section nobody is allowed anything on, requests for 0x5, 0x1 and 0x4 succeed"
  more_than_the_source: "a request with at least one access bit the source handle lacks is checked as a whole against the object's security descriptor, for the caller, like an open: it succeeds only if the descriptor allows the caller every bit asked for, and then the new handle has exactly the bits asked for. The bits the source handle already has do not help: from the 0x5 handle of a section with an empty DACL, READ_CONTROL alone succeeds (below) but 0x5 | READ_CONTROL is refused, because the DACL does not allow 0x5"
  no_security_attributes: "for an unnamed section, event, mutex or semaphore created with NULL security attributes every request succeeds (the creator is the caller here; whether such an object has no descriptor at all or a default one that allows its creator everything was not separated): a query-only section handle duplicates with SECTION_MAP_WRITE, SECTION_ALL_ACCESS (0xF001F), WRITE_DAC, DELETE and SYNCHRONIZE; a SYNCHRONIZE-only event handle with EVENT_ALL_ACCESS (what the NtDuplicateObject sheet saw and took for the general rule)"
  null_dacl: "a descriptor with a NULL DACL (present, no list) allows everything: as without a descriptor"
  empty_dacl: "a descriptor with an empty DACL allows nobody anything, except what an owner always has: READ_CONTROL (0x20000) and WRITE_DAC (0x40000), alone or together. So from a reduced handle of such an object, READ_CONTROL, WRITE_DAC and both succeed; every type-specific right, DELETE (0x10000), SYNCHRONIZE on a section, and any mix of an owner right with another bit are refused. Seen for section, event, mutex, semaphore, thread, process (a child created with these attributes) and token (DuplicateTokenEx with these attributes)"
  partial_dacl: "a DACL that allows Everyone part: what it allows can be added, the rest cannot. Section with Everyone: 0x5, from a query-only handle: SECTION_MAP_READ and 0x20005 (the DACL's bits and the owner's READ_CONTROL) succeed, SECTION_MAP_WRITE, SECTION_MAP_EXECUTE, SECTION_EXTEND_SIZE and SECTION_ALL_ACCESS are refused. Event with Everyone: SYNCHRONIZE | EVENT_MODIFY_STATE, from a SYNCHRONIZE-only handle: EVENT_MODIFY_STATE succeeds, 0x1 and EVENT_ALL_ACCESS are refused"
  chrome_case: "section created with an empty DACL, handle reduced to 0x5 (the creator's own handle keeps all access: 0xF0007), then DuplicateHandle(.., SECTION_MAP_WRITE, FALSE, 0): FALSE, ERROR_ACCESS_DENIED. The reduced handle still maps for reading (MapViewOfFile(FILE_MAP_READ) succeeds) and not for writing (FILE_MAP_WRITE: ERROR_ACCESS_DENIED), before and after"
  full_handle: "the creator's handle with all access hands out any part of it (subset rule); from the 0xF0007 handle of an empty-DACL section a request for 0xF001F (which has 0x18 more) is refused like any other"
  files: "a file handle never yields more than it has: from a handle opened for reading (granted 0x130089 with DELETE) on a file the caller made and may write, requests for FILE_WRITE_DATA, FILE_APPEND_DATA, FILE_GENERIC_WRITE, read and write together, WRITE_DAC and 0x1F01FF are all refused with ERROR_ACCESS_DENIED; parts of what it has (FILE_GENERIC_READ, FILE_READ_DATA, READ_CONTROL) succeed"
  process_thread_token_default: "objects that always have a descriptor, with the one they get by default: from a PROCESS_QUERY_LIMITED_INFORMATION handle of the own process every request up to PROCESS_ALL_ACCESS succeeds; from a THREAD_QUERY_LIMITED_INFORMATION handle of the own thread up to THREAD_ALL_ACCESS; from a TOKEN_QUERY handle of the own process token up to TOKEN_ALL_ACCESS (the default descriptors allow the user all of it). A granted THREAD_SUSPEND_RESUME (0x2) shows as 0x1002 on the new handle: the check adds THREAD_RESUME (0x1000) to it"
  pseudo_handles: "the pseudo handles of the current process and thread as source: any request succeeds with exactly the bits asked (0 gives a handle with no access), and DUPLICATE_SAME_ACCESS gives 0x1FFFFF"
  same_access: "with DUPLICATE_SAME_ACCESS the access argument is not looked at: the new handle has the source's access and the call cannot fail for access (asking 0xF001F, GENERIC_ALL or MAXIMUM_ALLOWED from a 0x5 handle gives 0x5)"
  zero_and_unknown_bits: "access 0 without DUPLICATE_SAME_ACCESS succeeds and gives a handle with no access at all (granted 0). Type-specific bits the object type does not define are dropped without an error (0xFFE0 on a section: granted 0). MAXIMUM_ALLOWED (0x02000000) is dropped too: alone it gives granted 0, with SECTION_QUERY granted 0x1, with SECTION_MAP_WRITE the request is judged as SECTION_MAP_WRITE alone. It never gives 'all the descriptor allows'"
  generic_rights: "generic bits are mapped to the type's rights first and then judged like any request: on a section GENERIC_READ is 0x20005, GENERIC_WRITE 0x20002, GENERIC_EXECUTE 0x20008, GENERIC_ALL 0xF001F (granted so on a section without a descriptor; on the Everyone: 0x5 section GENERIC_READ succeeds with 0x20005 and the others are refused; on the empty-DACL section all four are refused)"
  on_refusal: "a refused request: FALSE, last error ERROR_ACCESS_DENIED (5), and *lpTargetHandle is set to NULL (it was a nonzero marker before the call). NtDuplicateObject: STATUS_ACCESS_DENIED (0xC0000022), handle NULL"
  close_source_on_refusal: "DUPLICATE_CLOSE_SOURCE with a refused request still closes the source handle: the call returns FALSE with error 5, and the source value is no longer a handle (CloseHandle on it fails)"
errors:
  more_access_not_allowed: "ERROR_ACCESS_DENIED (5); NtDuplicateObject: STATUS_ACCESS_DENIED (0xC0000022)"
  other_errors: "see specs/windows/ntdll.dll/NtDuplicateObject.yaml (bad handles, process handles without PROCESS_DUP_HANDLE, an exited target)"
side_effects: "adds a handle to the target process (and removes the source handle with DUPLICATE_CLOSE_SOURCE, also when the request is refused)"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants); they import kernel32.dll, advapi32.dll (security descriptors, tokens) and ntdll.dll (NtQueryObject for a handle's granted access, NtDuplicateObject). Every line is one DuplicateHandle call inside the test's own process: the access asked for, the options, the result, then either the granted access of the new handle (ObjectBasicInformation) or the last error and what the call left in the out handle. Observations are access masks, error codes and booleans, never handle values. Left out of the tests on purpose because they depend on privileges of the user the oracle runs as (an elevated administrator whose SSH token has its privileges enabled): WRITE_OWNER (0x80000) and ACCESS_SYSTEM_SECURITY (0x01000000) were granted on every object, also with an empty DACL.
not_covered: >
  The same question between two processes (source or target another process, another user's token), named objects and objects with an inherited or default descriptor from a token's default DACL, deny entries, integrity labels, directories and other file systems than NTFS, jobs, desktops, registry keys, and what holds for the privilege-dependent rights (WRITE_OWNER, ACCESS_SYSTEM_SECURITY) for a user without those privileges.
