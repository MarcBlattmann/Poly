same_as: "windows/api/kernel32.dll/SetProcessShutdownParameters"
interface:
  signature: "BOOL GetProcessShutdownParameters(LPDWORD lpdwLevel, LPDWORD lpdwFlags)"
  returns: "nonzero on success"
