# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/ReadFile.OverlappedPipe.yaml
id: windows/api/kernel32.dll/ReadFile.OverlappedPipe
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory; the loopback and the internet were available"
  observed_by: spec-win-chrome-setup
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, and the observed call trace of Chrome for Testing 157 (its network service, headless, github.com and bbc.com, specs/windows/apps/chrome/traces/net-*.trace.json: function names, counts and first-call order only). Microsoft Learn: ReadFile, GetOverlappedResult, CancelIoEx, OVERLAPPED, Synchronous and Asynchronous I/O, Named Pipe Operations. Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  ReadFile on an overlapped named pipe handle as Chrome's IPC uses it: with no data the call returns FALSE with ERROR_IO_PENDING and the OVERLAPPED's event stays non-signalled (Internal is STATUS_PENDING, GetOverlappedResult without waiting gives ERROR_IO_INCOMPLETE 996) until the peer writes; with data waiting it completes inline; a pending read is cancelled by CancelIoEx with ERROR_OPERATION_ABORTED and ended by the peer's close with ERROR_BROKEN_PIPE.
interface:
  signature: "BOOL ReadFile(HANDLE pipe, void *buf, DWORD n, LPDWORD read, LPOVERLAPPED ov)"
rules:
  pending: "no data: FALSE, ERROR_IO_PENDING (997), count in the call 0, the event not signalled, OVERLAPPED.Internal 0x103 (STATUS_PENDING); GetOverlappedResult(h, ov, &n, FALSE): FALSE with ERROR_IO_INCOMPLETE (996), count 0."
  completion: "after the peer writes 6 bytes the event is signalled and GetOverlappedResult returns TRUE with 6 and the bytes are in the buffer."
  inline: "10 bytes waiting: ReadFile of 4 into a 4-byte buffer: TRUE, count 4 in the call, the event signalled; a second ReadFile of 64 gets the other 6: TRUE, count 6."
  cancel: "a pending read, then CancelIoEx(handle, &ov): TRUE; the event is signalled and GetOverlappedResult(..., TRUE) is FALSE with ERROR_OPERATION_ABORTED (995), count 0."
  peer_close: "a pending read when the peer closes its end: the event is signalled and GetOverlappedResult is FALSE with ERROR_BROKEN_PIPE (109), count 0; a read after that is FALSE with 109 at once and its event is not signalled; a read on the client end of a pipe whose server end was closed before any data: FALSE with 109."
errors:
  pending: "ERROR_IO_PENDING (997)"
  incomplete: "ERROR_IO_INCOMPLETE (996) from GetOverlappedResult without waiting"
  cancelled: "ERROR_OPERATION_ABORTED (995)"
  broken: "ERROR_BROKEN_PIPE (109)"
side_effects: "none outside the test's own handles"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except the waits named in the rules"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), the same program three times (cnet_rf, cnet_rf_b, cnet_rf_c): each makes every call and writes every third observation line (the first line is the first file's, the second the second file's, and so on), so each program is complete and the three together give the whole list. Each declares what it calls from Learn's prototypes; observations are return values, error codes, counts and relations, never handles, addresses, ports or times.
not_covered: >
  message-mode pipes (ERROR_MORE_DATA), files and sockets as sources, ReadFileEx, a buffer smaller than the waiting message in message mode, reads with an OVERLAPPED offset.
