# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/SetProcessShutdownParameters.yaml
id: windows/api/kernel32.dll/SetProcessShutdownParameters
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-5
  date: 2026-11-11
sources: >
  Observations of our own test programs on the machine above, and Chrome's calls as recorded in specs/windows/apps/chrome/traces/s1-crashpad-handler.trace.json (n=669), ...monitor-self.trace.json (n=741) and the raw stage-1 traces of the other child processes. Microsoft Learn: "SetProcessShutdownParameters function (processthreadsapi.h)", "GetProcessShutdownParameters function"; winbase.h for SHUTDOWN_NORETRY. Wine's tests were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Stores two numbers for the calling process: the shutdown level (where the process comes in the order in which the system ends processes when the session ends: higher levels first) and the shutdown flags. Nothing else happens until the system shuts down. GetProcessShutdownParameters reads the two numbers back. Every Chrome child process calls it once at start-up; a process starts with level 0x280 and flags 0.
interface:
  signature: "BOOL SetProcessShutdownParameters(DWORD dwLevel, DWORD dwFlags); BOOL GetProcessShutdownParameters(LPDWORD lpdwLevel, LPDWORD lpdwFlags)"
  returns: "nonzero on success; 0 and a last error on failure"
  flags: "SHUTDOWN_NORETRY 0x00000001 (winbase.h): the only flag"
chrome:
  crash_handler: "chrome.exe --type=crashpad-handler: SetProcessShutdownParameters(0x100, SHUTDOWN_NORETRY) = TRUE (chrome.exe+0x45019; n=669 / n=741 of the two handler traces): the handler wants to be among the last application processes to end"
  other_children: "the GPU process, the network and storage services and every renderer: SetProcessShutdownParameters(0x27F, SHUTDOWN_NORETRY) = TRUE, once each (639 in the raw traces): just after the default level, so the browser (0x280) is asked to end first"
  browser: "the browser process does not call it in stage 1"
  on_failure: "the handler logs a failure and goes on (Poly returned FALSE with error 120 from a stub; stage 1 tolerated it: gap-map section 6a)"
rules:
  defaults: "a process starts with level 0x280 and flags 0, whatever its parent has set: a child started by a process at (0x100, 1) reads (0x280, 0)"
  set_then_get: "an accepted call stores both values; GetProcessShutdownParameters then returns exactly them, in the same process from any thread. The last accepted call wins. The values belong to the process: a child's call does not change the parent's"
  levels: "every level value is accepted with flags 0 or 1 and read back unchanged: 0, 1, 0xFF, 0x100, 0x1FF, 0x200, 0x27F, 0x280, 0x2FF, 0x300, 0x3FF, 0x400, 0x4FF, 0x500, 0x999, 0x1000, 0xFFFF, 0x10100, 0x80000100 and 0xFFFFFFFF all returned TRUE. The ranges Learn reserves for the system (0x000-0x0FF and 0x400-0x4FF) are not refused"
  flags: "flags 0 and SHUTDOWN_NORETRY (1) are accepted. Any other bit makes the call fail: 2, 3, 4, 0x100, 0x80000000 and 0xFFFFFFFF returned FALSE with last error 641 (not 87, ERROR_INVALID_PARAMETER; the number is what was observed, its winerror.h name was not looked up), and level and flags stay what they were before the call. A refused flag does not make an out-of-range level matter: (0x500, 1) is accepted"
  success_last_error: "a successful call does not change the thread's last error (set to 0xDEAD before each call, still 0xDEAD after)"
  get: "GetProcessShutdownParameters returns TRUE and does not change the last error"
errors:
  bad_flags: "any flag bit other than SHUTDOWN_NORETRY: FALSE, last error 641; nothing is stored"
side_effects: "stores the two values for the process; they matter only when the session ends"
threading: "process-wide: a value set by one thread is read by every other"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are statuses, error codes, counts and booleans, never handles, process ids or times. A test that needs a second process starts its own image again with CreateProcessW and the arguments --child <mode>; the child reports through an inherited anonymous pipe or through events and is ended by the test (it also ends by itself after about 9 s). Every wait is bounded.
not_covered: >
  What the level and the flag do at shutdown (the order in which processes get the end-session request, the retry dialog), processes that are not connected to the Windows subsystem (native processes), services, and NULL pointers to GetProcessShutdownParameters.
