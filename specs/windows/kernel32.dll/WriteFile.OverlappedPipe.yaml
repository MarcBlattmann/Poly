# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/WriteFile.OverlappedPipe.yaml
id: windows/api/kernel32.dll/WriteFile.OverlappedPipe
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory; the loopback and the internet were available"
  observed_by: spec-win-chrome-setup
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, and the observed call trace of Chrome for Testing 157 (its network service, headless, github.com and bbc.com, specs/windows/apps/chrome/traces/net-*.trace.json: function names, counts and first-call order only). Microsoft Learn: WriteFile, GetOverlappedResult, OVERLAPPED, Synchronous and Asynchronous I/O, Named Pipe Operations, CreateNamedPipe. Nothing of Windows, Wine or Google's programs was read or disassembled.
summary: >
  WriteFile on a named pipe handle opened FILE_FLAG_OVERLAPPED, as Chrome's IPC (Mojo) uses it (13,000 calls per page load in the network service): with room in the pipe the call completes inline (TRUE, the count in the call, the OVERLAPPED's event signalled, Internal 0, InternalHigh the count); a write that does not fit returns FALSE with ERROR_IO_PENDING and completes when the reader frees room; a zero-byte write succeeds and delivers nothing.
interface:
  signature: "BOOL WriteFile(HANDLE pipe, const void *buf, DWORD n, LPDWORD written, LPOVERLAPPED ov)"
rules:
  inline: "pair of a byte-mode duplex named pipe, both ends FILE_FLAG_OVERLAPPED, 4096-byte buffers; WriteFile of 5 bytes with an OVERLAPPED that holds a manual-reset event: TRUE, count written 5 in the call, the event signalled at once, OVERLAPPED.Internal 0 (STATUS_SUCCESS), InternalHigh 5; GetOverlappedResult(handle, ov, &n, FALSE) then returns TRUE with 5; the other end's ReadFile returns the bytes."
  zero_bytes: "WriteFile of 0 bytes: TRUE, count 0, the event signalled; nothing reaches the reader: its next overlapped ReadFile is pending (ERROR_IO_PENDING) and its event stays non-signalled."
  full_pipe: "WriteFile of 64 KiB into a pipe with 4 KiB buffers while nobody reads: FALSE with ERROR_IO_PENDING (997), the count in the call 0, the event not signalled; when the reader has read all 65536 bytes (several reads) the event is signalled and GetOverlappedResult(..., FALSE) returns TRUE with 65536."
  no_overlapped: "WriteFile on an overlapped handle with a NULL OVERLAPPED, small data and room in the pipe: TRUE with the count (1); not an error in this case."
  peer_closed: "WriteFile after the other end was closed: FALSE with ERROR_NO_DATA (232)."
errors:
  pending: "ERROR_IO_PENDING (997): the write could not complete at once"
  closed: "ERROR_NO_DATA (232): the reader's end is closed"
side_effects: "none outside the test's own handles"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except the waits named in the rules"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), the same program three times (cnet_wf, cnet_wf_b, cnet_wf_c): each makes every call and writes every third observation line (the first line is the first file's, the second the second file's, and so on), so each program is complete and the three together give the whole list. Each declares what it calls from Learn's prototypes; observations are return values, error codes, counts and relations, never handles, addresses, ports or times.
not_covered: >
  message-mode pipes, files and sockets as targets, FILE_SKIP_COMPLETION_PORT_ON_SUCCESS, WriteFileEx, several writers at once, writes larger than the pipe's quota that are split.
