# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/ReplaceFileW.yaml
id: windows/api/kernel32.dll/ReplaceFileW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave the same output except where a sheet says what a 32-bit caller sees."
  observed_by: spec-win-updater-services
  date: 2026-11-20
sources: >
  Observations of our own 64-bit test programs on the machine above (each test ran at least twice with identical output). Microsoft Learn pages of the functions (kernel32 / fileapi.h, winbase.h, processthreadsapi.h, wow64apiset.h, memoryapi.h, synchapi.h, combaseapi.h, objbase.h, userenv.h) for names, parameters and the error values in winerror.h. What the documentation does not say (error codes, edge cases, the effect of access rights) is taken from the observations only. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Replaces a file by another one: afterwards the replaced name holds the content, size and (new) data of the replacement, keeps the creation time and the attributes of the old file (the hidden bit stays), and the replacement's own name is gone. With a backup name the old file is kept under that name, replacing an older backup.
interface:
  signature: "BOOL ReplaceFileW(LPCWSTR lpReplacedFileName, LPCWSTR lpReplacementFileName, LPCWSTR lpBackupFileName, DWORD dwReplaceFlags, LPVOID lpExclude, LPVOID lpReserved)"
installer: "Google's updater 157 and 159 (32-bit) import this function; their run on Poly reaches it while they install and start their two services and register their update service and scheduled task. What they pass is not known beyond the import. Chrome's setup.exe and notification helper import it as well."
rules:
  basic: "TRUE; the replaced name now holds the replacement's bytes (a larger replacement gives the larger size, 5000 bytes in the test); the replacement name no longer exists"
  backup: "with a backup name that does not exist or that does: TRUE; the backup holds the old content of the replaced file (an older backup file is overwritten)"
  flags: "REPLACEFILE_WRITE_THROUGH (1), REPLACEFILE_IGNORE_MERGE_ERRORS (2), REPLACEFILE_IGNORE_ACL_ERRORS (4) and their sum 7 are accepted; the flags 8, 0x100 and 0x80000000 fail with ERROR_INVALID_PARAMETER 87 and change nothing"
  keeps_metadata: "a hidden replaced file stays hidden after the call; the replaced name has the creation time of the old file, not that of the replacement"
  missing_files: "the replaced file missing, the replacement missing, or both: ERROR_FILE_NOT_FOUND 2 and nothing changes; an empty name: ERROR_PATH_NOT_FOUND 3"
  same_names: "the same name for the replaced and the replacement file: ERROR_SHARING_VIOLATION 32; the backup name equal to the replaced name: error 1176 (ERROR_UNABLE_TO_MOVE_REPLACEMENT); equal to the replacement name: error 1175 (ERROR_UNABLE_TO_REMOVE_REPLACED); the files stay as they were"
  reserved: "a non-NULL lpReserved or lpExclude pointer: ERROR_INVALID_PARAMETER 87"
  not_replaceable: "a directory as the replaced name, and a read-only replaced file: ERROR_ACCESS_DENIED 5, nothing changes"
  open_handles: "the replaced file held open by another handle: ERROR_SHARING_VIOLATION 32 when the handle does not share DELETE (share mode 1), success when it shares read, write and delete (7); the replacement held open: ERROR_SHARING_VIOLATION 32 with share mode 1 and also with 7"
errors:
  file_not_found: "ERROR_FILE_NOT_FOUND 2"
  path_not_found: "ERROR_PATH_NOT_FOUND 3"
  access_denied: "ERROR_ACCESS_DENIED 5"
  sharing_violation: "ERROR_SHARING_VIOLATION 32"
  invalid_parameter: "ERROR_INVALID_PARAMETER 87"
  unable_to_move_replacement: "1176"
  unable_to_remove_replaced: "1175"
side_effects: "the files of the call; a failed call leaves both files as they were"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, run on the oracle with the elevated token in the interactive session. Scenarios that could end the process (a NULL pointer where the function reads or writes through it) run in a child process of the same image (`--child ...`) and the parent prints the exit code. Observations are results, error codes, booleans and counts; never addresses, process or thread ids, times or the name of the machine. Files the tests make live next to the test program and are deleted by the test.
not_covered: >
  alternate data streams, encrypted or compressed files, the ACL and ownership merge, hard links, files on network shares, and the exact error when the replacement can be moved but the backup cannot.
