# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/SizeofResource.yaml
id: windows/api/kernel32.dll/SizeofResource
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-1
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above. The tests write a small generated PE32+ DLL image (no code, only a .rsrc section; lib/mkpe.py of the spec agent's kit builds the 2,048 bytes, and the test source carries them as a byte array) next to themselves and load it with LoadLibraryExW three ways: as a data file (0x2), as image resources (0x20) and as a normal image (0); every lookup gives the same lines in all three ways. Microsoft Learn: "SizeofResource function (libloaderapi.h)". Wine's tests were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Returns the size in bytes of a found resource. Specified with LoadResource and LockResource: the tests of the three entries are the same program.
interface:
  signature: "DWORD SizeofResource(HMODULE hModule, HRSRC hResInfo)"
  returns: "the size in bytes, or 0 with the last error set; 0 with no error for a resource of 0 bytes"
rules:
  size: "the sizes observed: BLOB 20, #100 3, #101 0 (last error unchanged: this is the one case of 0 without an error), RT_ICON #1 8, RT_STRING #1 66, RT_STRING #2 46, RT_STRING #7 54, RT_VERSION #1 16, \"TEXTFILE\" #1 14, \"README\" 5, RT_GROUP_ICON 6, RT_RCDATA #7 en-US 12 and de-DE 15"
  null: "SizeofResource(module, NULL) and SizeofResource(NULL, NULL): 0 with ERROR_INVALID_PARAMETER (87)"
  wrong_module: "a resource handle used with another module (this program's executable, which has no resources) gives 0 with ERROR_RESOURCE_DATA_NOT_FOUND (1812)"
  modes: "The three load modes give identical answers. A module handle is the one LoadLibraryExW returned: with LOAD_LIBRARY_AS_DATAFILE its low bit is\n        set (the handle is not an address of a mapped image), with LOAD_LIBRARY_AS_IMAGE_RESOURCE bit 1 is set and bit 0 clear, and a normal\n        image's handle is 64 KiB aligned. The resource functions must accept all three"
errors:
  error_invalid_parameter: "87 for a NULL resource handle"
  error_resource_data_not_found: "1812 for a module without resources"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075); they import kernel32.dll (and user32.dll for LoadStringW). Each line is one call with its type and name written as #n for a number and "text" for a string, then -> found/NULL and the last error, or the size and the first bytes of the data (non-printable bytes as <xx>). The tests need a loader that can load a PE image that has no code and no imports with LOAD_LIBRARY_AS_DATAFILE, LOAD_LIBRARY_AS_IMAGE_RESOURCE and normally (a DLL without an entry point); a program of another kind (a console exe) is not needed for the lookups. The tests szr_basic and szr_errors are copies of lr_basic and lr_errors (LoadResource's tests).
not_covered: >
  Handles from another module that has resources.
