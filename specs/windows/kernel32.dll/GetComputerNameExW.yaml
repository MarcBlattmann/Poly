# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetComputerNameExW.yaml
id: windows/api/kernel32.dll/GetComputerNameExW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave the same output except where a sheet says what a 32-bit caller sees."
  observed_by: spec-win-updater-services
  date: 2026-11-20
sources: >
  Observations of our own 64-bit test programs on the machine above (each test ran at least twice with identical output). Microsoft Learn pages of the functions (kernel32 / fileapi.h, winbase.h, processthreadsapi.h, wow64apiset.h, memoryapi.h, synchapi.h, combaseapi.h, objbase.h, userenv.h) for names, parameters and the error values in winerror.h. What the documentation does not say (error codes, edge cases, the effect of access rights) is taken from the observations only. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Gives one of the computer's names. For a computer in a workgroup (not joined to a domain) the DNS domain names are empty strings and the other names are the NetBIOS name, in the capitalisation the type implies.
interface:
  signature: "BOOL GetComputerNameExW(COMPUTER_NAME_FORMAT NameType, LPWSTR lpBuffer, LPDWORD nSize)"
installer: "Google's updater 157 and 159 (32-bit) import this function; their run on Poly reaches it while they install and start their two services and register their update service and scheduled task. What they pass is not known beyond the import."
rules:
  types: "ComputerNameNetBIOS (0), ComputerNameDnsHostname (1), ComputerNameDnsDomain (2), ComputerNameDnsFullyQualified (3) and the physical types 4 to 7 succeed; 8, 9 and -1 fail with ERROR_INVALID_PARAMETER 87 and leave the size unchanged"
  values: "NetBIOS name equals what GetComputerNameW returns; the DNS host name equals the NetBIOS name ignoring case; the DNS domain (2 and 6) is empty on the workgroup oracle; the fully qualified name equals the host name when there is no domain; the physical types give the same strings as types 0 to 3 on a computer that is not a cluster node; all names have printable ASCII characters and no slash"
  size_success: "on success *nSize is the length without the NUL (L) and L+1 units were written"
  size_failure: "with a buffer smaller than L+1 units (also size 0, size 1, size L) and with a NULL buffer and size 0: FALSE, ERROR_MORE_DATA 234, *nSize = L+1; type 0 writes nothing; type 1 writes one unit when the buffer holds at least one unit"
  null_size: "a NULL size pointer returns FALSE with ERROR_INVALID_PARAMETER 87; the process does not fault"
errors:
  more_data: "ERROR_MORE_DATA 234"
  invalid_parameter: "ERROR_INVALID_PARAMETER 87"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, run on the oracle with the elevated token in the interactive session. Scenarios that could end the process (a NULL pointer where the function reads or writes through it) run in a child process of the same image (`--child ...`) and the parent prints the exit code. Observations are results, error codes, booleans and counts; never addresses, process or thread ids, times or the name of the machine. Files the tests make live next to the test program and are deleted by the test.
not_covered: >
  computers joined to a domain or that are cluster nodes; names with non-ASCII characters; the output tests use lengths relative to the name (L) because the name of the machine differs.
