# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetThreadIdealProcessorEx.yaml
id: windows/api/kernel32.dll/GetThreadIdealProcessorEx
oracle:
  os: Windows 11 Home 26H2 (build 26300.9974), x64
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0) as the local account "server" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-remote-thread-2
  date: '2026-11-20'
sources: 'Observations of our own test programs on the machine above (one image in two roles: the test, and the child process that is the target of the ''another process'' cases; remote threads made with CreateRemoteThread and CreateRemoteThreadEx, sheets of this track). Microsoft Learn: GetThreadIdealProcessorEx, SetThreadIdealProcessorEx, GetThreadGroupAffinity, SetThreadGroupAffinity, PROCESSOR_NUMBER, GROUP_AFFINITY, Thread Security and Access Rights, Processor Groups, GetActiveProcessorCount, GetProcessAffinityMask, CreateRemoteThreadEx, UpdateProcThreadAttribute, winerror.h. The oracle has one processor group of 6 processors; the tests never print counts, masks or numbers of this machine, only relations to the processor count and the process affinity mask. No Microsoft binary was decompiled or disassembled; Wine''s and ReactOS''s sources were not read.'
summary: 'Returns the ideal processor of a thread (a PROCESSOR_NUMBER: group and number), for a thread of the calling process or of another process. Needs only a query right on the thread handle. The ideal processor of a thread can be given to CreateRemoteThreadEx as an attribute and changed with SetThreadIdealProcessorEx.'
interface:
  signature: BOOL GetThreadIdealProcessorEx(HANDLE hThread, PPROCESSOR_NUMBER lpIdealProcessor)
  result: TRUE, or FALSE with the last error set
rules:
  output: 'on success the PROCESSOR_NUMBER is completely overwritten: Group 0 (the machine has one group), Number the number of a processor the system has (below the active processor count of group 0), Reserved 0. A thread that was never given an ideal processor has one anyway (the system assigns one when the thread is made, round robin, so different threads usually differ).'
  which_threads: works on the pseudo handle of the current thread (-2) and on a real handle to it (same value), on a new thread that is still suspended, on a thread that has finished (the handle is still open), on a thread of ANOTHER process (made there by CreateRemoteThread, or its first thread, the handle CreateProcess returned; or opened by id with OpenThread) and on the first thread of a process that was created suspended and has not started.
  rights: the handle needs THREAD_QUERY_LIMITED_INFORMATION (0x800) or THREAD_QUERY_INFORMATION (0x40); with only no rights, THREAD_TERMINATE, THREAD_SUSPEND_RESUME, THREAD_SET_INFORMATION (0x20), THREAD_SET_LIMITED_INFORMATION (0x400), THREAD_RESUME (0x1000), SYNCHRONIZE, or SET_INFORMATION|SET_LIMITED the call fails with ERROR_ACCESS_DENIED (5). A thread opened by id with only THREAD_SET_INFORMATION is refused the same way.
  attribute_of_createremotethreadex: 'the ideal processor given to CreateRemoteThreadEx through PROC_THREAD_ATTRIBUTE_IDEAL_PROCESSOR (group 0, number 0, and number count-1) reads back exactly for the new thread in the other process; a number equal to or above the processor count (the count itself, 200), or group 1: CreateRemoteThreadEx returns NULL, ERROR_INVALID_PARAMETER (87), STATUS_INVALID_PARAMETER 0xC000000D.'
  setting_for_context: 'SetThreadIdealProcessorEx(handle, PROCESSOR_NUMBER, previous): needs THREAD_SET_INFORMATION (0x20) alone on the handle (0x400 THREAD_SET_LIMITED_INFORMATION is not enough; query rights are not needed); the previous value comes back through the third parameter (a valid processor of group 0; the value that Get reported before); the new value reads back exactly through the same handle and through another handle of the thread, for threads of this and of another process; invalid values (number equal to the processor count, 200, 255, group 1, a non-zero reserved byte) fail with ERROR_INVALID_PARAMETER (87) and change nothing; a NULL pointer for the previous value is accepted; a NULL handle gives ERROR_INVALID_HANDLE (6).'
  crash_not_a_contract: a NULL pointer for the result crashes the caller with an access violation (observed once; no recorded test); do not rely on it
errors:
  invalid_handle: 'NULL, a number that is no handle, a closed handle, an event, a process handle (a child''s, and the pseudo handle of the current process): FALSE, ERROR_INVALID_HANDLE (6)'
  access_denied: 'see rights: ERROR_ACCESS_DENIED (5)'
  invalid_parameter: 'numbers the system does not have in the attribute or in the setter: ERROR_INVALID_PARAMETER (87)'
side_effects: none
threading: may be called from any thread
ordering: []
timing:
  typical: well under a millisecond per call
  guarantees: none
building_tests: 'Rust tests (ADR 0075), one file each, one image in two roles (the test, and its child process that is the target of the remote cases; the target signals a named event when it runs). Observations are ''group 0'', ''number below the processor count'', ''mask inside the process mask'', Win32 codes and yes/no relations; the default ideal processor of a new thread is not printed (the system hands out processors round robin: it varies from thread to thread). SetThreadIdealProcessorEx and SetThreadGroupAffinity are used as the means in the tests that read a value back; their own behaviour seen there is given in this sheet because the sheets of the setters do not exist yet.'
not_covered: Systems with more than one processor group; the default ideal processor values (only that they are valid); the effect of the ideal processor on scheduling; threads of protected processes.
tests:
  visible: 4
  held_out: 2
