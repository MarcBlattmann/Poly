# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetQueuedCompletionStatusEx.yaml
id: windows/api/kernel32.dll/GetQueuedCompletionStatusEx
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: GetQueuedCompletionStatusEx, OVERLAPPED_ENTRY structure, QueueUserAPC. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Removes up to a given number of packets in one call, in queue order, filling OVERLAPPED_ENTRY records (key, OVERLAPPED pointer, byte count). It returns TRUE even for packets of failed requests (the error is then read with GetOverlappedResult). An alertable wait runs queued APCs and then fails with WAIT_IO_COMPLETION.
interface:
  signature: "BOOL GetQueuedCompletionStatusEx(HANDLE port, LPOVERLAPPED_ENTRY entries, ULONG count, PULONG removed, DWORD milliseconds, BOOL alertable)"
rules:
  batch: "five posted packets taken with a 3-entry buffer: TRUE, removed = 3, entries 1..3 in order with key, pointer and bytes as posted; then a larger buffer returns the remaining 2; a single-entry buffer takes one at a time."
  timeout: "empty port: FALSE with WAIT_TIMEOUT (258) and *removed set to 0 (also with a 50 ms timeout)."
  failed_io: "a pending read that fails (peer closed): TRUE, removed = 1, entry key = the handle's key, pointer = the request's OVERLAPPED, 0 bytes; GetOverlappedResult on it then fails with ERROR_BROKEN_PIPE (109)."
  alertable: "with an APC queued to the calling thread: a non-alertable wait leaves it queued (timeout, the APC has not run); an alertable wait runs it and returns FALSE with WAIT_IO_COMPLETION (192) and *removed 0."
  packet_before_apc: "with a packet and an APC both waiting, an alertable call returns the packet (TRUE, removed 1) without running the APC; the next alertable call runs the APC and fails with WAIT_IO_COMPLETION."
  wakeup: "an alertable waiter is woken by a packet posted from another thread (TRUE, removed 1, the posted key and bytes)."
errors:
  timeout: "WAIT_TIMEOUT (258)"
  apc_ran: "WAIT_IO_COMPLETION (192)"
  zero_count: "a count of 0: ERROR_INVALID_PARAMETER (87)"
  bad_handle: "ERROR_INVALID_HANDLE (6)"
side_effects: "removes the packets"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Files other than named pipes (the packets and errors are the same mechanism; pipes were used as the I/O source), remote machines, completion ports with several competing threads under load, the concurrency limit's effect on wake-up order.
