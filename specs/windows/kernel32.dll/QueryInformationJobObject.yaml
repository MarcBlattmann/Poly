# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/QueryInformationJobObject.yaml
id: windows/api/kernel32.dll/QueryInformationJobObject
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: QueryInformationJobObject, JOBOBJECT_BASIC_ACCOUNTING_INFORMATION, JOBOBJECT_BASIC_PROCESS_ID_LIST, JOBOBJECT_EXTENDED_LIMIT_INFORMATION. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Reads a job's accounting or limits. For most classes the buffer must be exactly the structure's size, otherwise ERROR_BAD_LENGTH. The accounting counters follow assignment, exit and termination; the process id list holds the ids of the active members.
interface:
  signature: "BOOL QueryInformationJobObject(HANDLE job, JOBOBJECTINFOCLASS class, LPVOID info, DWORD size, LPDWORD returnLength)"
rules:
  basic_accounting: "class 1, 48 bytes: TotalProcesses at offset 36, ActiveProcesses at 40, TotalTerminatedProcesses at 44 (32-bit each). An empty job is all zeros. After one assignment: 1/1/0; two assigned: 2 active; after one exits normally: total 2, active 1; after the other is terminated with TerminateProcess: active 0 (the terminated counter stayed 0 in the test)."
  returned_length: "the returned length is the structure size (48, 64, 144, 16 for the id list with one member)."
  id_list: "class 3: a header of two 32-bit values (assigned count, ids in the list) followed by 64-bit ids; with one member in a 64-byte buffer: assigned 1, in list 1, the id, length 16. A buffer of exactly the header (8 bytes), smaller, or of 12 bytes fails with ERROR_BAD_LENGTH."
  exact_sizes: "class 1 with 40 or 100 bytes, class 9 with 64 bytes: FALSE, ERROR_BAD_LENGTH (24). Class 2 (basic limit) is 64 bytes and class 9 (extended) 144 bytes; both return flags 0 for a new job."
  classes: "on a job without processes, with a 1024-byte buffer: classes 3, 5, 11 and 14 succeed (lengths 8, 1024, 0, 16) and the others fail with ERROR_BAD_LENGTH (24): the buffer length must match their structure. Class 0 and class 4096: ERROR_INVALID_PARAMETER (87)."
  null_length_pointer: "the returned-length pointer may be NULL."
errors:
  bad_length: "ERROR_BAD_LENGTH (24)"
  bad_class: "ERROR_INVALID_PARAMETER (87)"
  bad_handle: "INVALID_HANDLE_VALUE or an event handle: ERROR_INVALID_HANDLE (6)"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  AppContainer (SECURITY_CAPABILITIES) and other attributes that need a profile or a token, PROC_THREAD_ATTRIBUTE_PARENT_PROCESS effects, jobs with CPU/memory/IO rate limits, job time limits and their notifications, UI restrictions.
