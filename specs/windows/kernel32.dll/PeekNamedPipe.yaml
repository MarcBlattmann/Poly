# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/PeekNamedPipe.yaml
id: windows/api/kernel32.dll/PeekNamedPipe
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: PeekNamedPipe, Named Pipe Type, Read, and Wait Modes. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Looks at the data waiting in a pipe without removing it and without ever blocking: it can copy the first bytes, report the total number of bytes available and, for message pipes, how many bytes of the first message the copy missed. It works from either end for ends that have read access.
interface:
  signature: "BOOL PeekNamedPipe(HANDLE pipe, LPVOID buffer, DWORD size, LPDWORD bytesRead, LPDWORD totalAvail, LPDWORD bytesLeftThisMessage)"
rules:
  life: "A server instance is created with CreateNamedPipeW and starts listening. It becomes connected when a client opens the pipe with CreateFileW (whether or not ConnectNamedPipe was called) or when ConnectNamedPipe completes. When the client closes its handle the instance stays taken (closing) until the server calls DisconnectNamedPipe; a new client meanwhile gets ERROR_PIPE_BUSY. After DisconnectNamedPipe the instance is not yet listening: clients still get ERROR_PIPE_BUSY until the server calls ConnectNamedPipe again."
  empty: "an empty pipe with a live peer: TRUE, 0 bytes copied, 0 available, 0 left."
  byte_mode: "after writing 11 bytes: a peek into a 5-byte buffer copies 5 bytes, reports 11 available, and consumes nothing; a later ReadFile gets all 11. A zero-size buffer or no buffer copies nothing and still reports the available count. All out-pointers may be NULL."
  byte_mode_left: "in byte mode, when a buffer is given, the 'bytes left in this message' value is the unsigned 32-bit wrap of (0 minus bytes copied) - 4294967291 after copying 5 bytes, 4294967285 after 11 - and it is 0 when no data buffer is given. Do not rely on it for byte pipes."
  message_mode: "bytes available counts all queued messages (3 + 7 = 10 for messages 'one' and 'second!'), while the copy and the 'left' value look at the first message only: a 2-byte peek copies 'on' and reports left = 1; a 32-byte peek copies the whole first message, left = 0. After a short ReadFile (ERROR_MORE_DATA) the rest of the message is 'left' = 1 and available shrinks by the bytes read."
  zero_length_message: "a zero-length message copies 0 bytes; available counts the bytes of the messages queued behind it (1 for a following 'x')."
  after_peer_closed: "if the peer closed, data still in the pipe can be peeked; once it is drained the peek fails with ERROR_BROKEN_PIPE (109)."
  other_end: "works on the client end the same way (data the server wrote)."
  listening: "on a server instance with no client the peek fails with ERROR_BAD_PIPE (230)."
  write_only_end: "a handle without read access (the server handle of an outbound pipe, the client handle of an inbound pipe) fails with ERROR_ACCESS_DENIED (5)."
errors:
  write_only_end: "ERROR_ACCESS_DENIED (5)"
  broken_pipe: "ERROR_BROKEN_PIPE (109) when the peer is gone and nothing is left"
  listening: "ERROR_BAD_PIPE (230)"
  not_a_pipe: "an event handle, NULL, INVALID_HANDLE_VALUE or a closed handle: ERROR_INVALID_HANDLE (6); a handle of a regular file: ERROR_INVALID_FUNCTION (1)"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Remote clients and other machines, security descriptors on the pipe, impersonation, several sessions.
