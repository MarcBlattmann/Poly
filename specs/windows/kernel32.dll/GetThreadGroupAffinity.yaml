# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetThreadGroupAffinity.yaml
id: windows/api/kernel32.dll/GetThreadGroupAffinity
oracle:
  os: Windows 11 Home 26H2 (build 26300.9974), x64
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0) as the local account "server" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-remote-thread-2
  date: '2026-11-20'
sources: 'Observations of our own test programs on the machine above (one image in two roles: the test, and the child process that is the target of the ''another process'' cases; remote threads made with CreateRemoteThread and CreateRemoteThreadEx, sheets of this track). Microsoft Learn: GetThreadIdealProcessorEx, SetThreadIdealProcessorEx, GetThreadGroupAffinity, SetThreadGroupAffinity, PROCESSOR_NUMBER, GROUP_AFFINITY, Thread Security and Access Rights, Processor Groups, GetActiveProcessorCount, GetProcessAffinityMask, CreateRemoteThreadEx, UpdateProcThreadAttribute, winerror.h. The oracle has one processor group of 6 processors; the tests never print counts, masks or numbers of this machine, only relations to the processor count and the process affinity mask. No Microsoft binary was decompiled or disassembled; Wine''s and ReactOS''s sources were not read.'
summary: Returns the group and affinity mask of a thread (a GROUP_AFFINITY), for a thread of the calling process or of another process. By default a thread's mask is its process's affinity mask. The mask can be given to CreateRemoteThreadEx as an attribute and changed with SetThreadGroupAffinity. Needs only a query right on the thread handle.
interface:
  signature: BOOL GetThreadGroupAffinity(HANDLE hThread, PGROUP_AFFINITY GroupAffinity)
  result: TRUE, or FALSE with the last error set
rules:
  output: 'on success the GROUP_AFFINITY is completely overwritten: Group 0, Mask the thread''s affinity mask (not zero, a subset of the affinity mask of the thread''s process: by default it IS the process mask), Reserved[3] all zero.'
  which_threads: works on the pseudo handle of the current thread and on a real handle to it, on a new suspended thread, on a thread that has finished, and on threads of ANOTHER process (made there by CreateRemoteThread, the first thread, opened by id, the first thread of a process created suspended and not started); for those the mask is judged against the affinity mask of THEIR process.
  rights: the handle needs THREAD_QUERY_LIMITED_INFORMATION (0x800) or THREAD_QUERY_INFORMATION (0x40); every other right alone (none, TERMINATE, SUSPEND_RESUME, SET_INFORMATION 0x20, SET_LIMITED_INFORMATION 0x400, RESUME, SYNCHRONIZE) gives ERROR_ACCESS_DENIED (5).
  attribute_of_createremotethreadex: 'the group affinity given to CreateRemoteThreadEx through PROC_THREAD_ATTRIBUTE_GROUP_AFFINITY (group 0): the lowest processor of the target''s process mask, and the whole process mask, read back exactly for the new thread, and its ideal processor lies inside the mask; mask 0 is accepted and means the process mask (the thread''s mask reads back as the process mask); a mask outside the process mask (the complement of it), a mask with bit 63, and group 1: CreateRemoteThreadEx returns NULL, ERROR_INVALID_PARAMETER (87), STATUS_INVALID_PARAMETER 0xC000000D.'
  setting_for_context: 'SetThreadGroupAffinity(handle, GROUP_AFFINITY, previous): needs THREAD_SET_INFORMATION (0x20) AND a query right (THREAD_QUERY_LIMITED_INFORMATION or THREAD_QUERY_INFORMATION): 0x20 alone, 0x400, and the query rights alone give ERROR_ACCESS_DENIED (5), 0x820 and 0x60 work; the previous mask comes back through the third parameter (the process mask the first time); the new mask reads back exactly through the same handle and through another handle opened by id, for threads of this and of another process; the thread''s ideal processor is moved into the new mask; mask 0 means the process mask; a mask outside the process mask, a mask with bit 63 (no such processor), group 1, a non-zero reserved field: ERROR_INVALID_PARAMETER (87), nothing changes; a NULL pointer for the previous value is accepted.'
  crash_not_a_contract: a NULL pointer for the result crashes the caller with an access violation (observed once for the ideal-processor twin; no recorded test); do not rely on it
errors:
  invalid_handle: 'NULL, a number that is no handle, a closed handle, an event, a process handle (a child''s, and the pseudo handle of the current process): FALSE, ERROR_INVALID_HANDLE (6)'
  access_denied: 'see rights: ERROR_ACCESS_DENIED (5)'
  invalid_parameter: 'numbers the system does not have in the attribute or in the setter: ERROR_INVALID_PARAMETER (87)'
side_effects: none
threading: may be called from any thread
ordering: []
timing:
  typical: well under a millisecond per call
  guarantees: none
building_tests: 'Rust tests (ADR 0075), one file each, one image in two roles (the test, and its child process that is the target of the remote cases; the target signals a named event when it runs). Observations are ''group 0'', ''number below the processor count'', ''mask inside the process mask'', Win32 codes and yes/no relations; the default ideal processor of a new thread is not printed (the system hands out processors round robin: it varies from thread to thread). SetThreadIdealProcessorEx and SetThreadGroupAffinity are used as the means in the tests that read a value back; their own behaviour seen there is given in this sheet because the sheets of the setters do not exist yet.'
not_covered: Systems with more than one processor group; affinity of threads in a job with an affinity limit; the effect on scheduling.
tests:
  visible: 4
  held_out: 2
