# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/GetOverlappedResult.yaml
id: windows/api/kernel32.dll/GetOverlappedResult
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: GetOverlappedResult, OVERLAPPED structure, Synchronous and Overlapped Input and Output. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Reports the state of an overlapped request: TRUE and the transferred bytes when it succeeded, FALSE with ERROR_IO_INCOMPLETE while it is pending, FALSE with the request's error when it failed; with wait = TRUE it blocks until the request is done.
interface:
  signature: "BOOL GetOverlappedResult(HANDLE file, LPOVERLAPPED overlapped, LPDWORD bytes, BOOL wait)"
rules:
  incomplete: "pending: FALSE, ERROR_IO_INCOMPLETE (996), 0 bytes; the OVERLAPPED's event stays unsignalled."
  wait: "wait = TRUE blocks until the data arrives (a writer thread delivered 150 ms later; the call waited at least 100 ms) and returns TRUE with the byte count."
  repeat: "calling again after completion returns the same result; a manual-reset event stays signalled."
  completed_at_once: "a read that completed inside ReadFile (TRUE) is reported TRUE with its bytes."
  event_reset: "starting a new request with the same event resets the event (manual-reset) before the request completes."
  no_event: "with no event in the OVERLAPPED the wait is on the file handle: incomplete while pending, then TRUE with the bytes after the data arrives."
  failed: "a request that failed (peer closed): FALSE with the request's error (ERROR_BROKEN_PIPE) and 0 bytes."
  fresh_overlapped: "an OVERLAPPED that never started a request (zeroed): TRUE with 0 bytes, even with INVALID_HANDLE_VALUE as the file handle."
  pending_bad_handle: "a pending request with an invalid handle value: ERROR_IO_INCOMPLETE (996): the handle is not looked at."
errors:
  incomplete: "ERROR_IO_INCOMPLETE (996)"
  failed_request: "the request's own error"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Files other than named pipes (the packets and errors are the same mechanism; pipes were used as the I/O source), remote machines, completion ports with several competing threads under load, the concurrency limit's effect on wake-up order.
