# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/EnumResourceTypesW.yaml
id: windows/api/kernel32.dll/EnumResourceTypesW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-1
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above. The tests write a small generated PE32+ DLL image (no code, only a .rsrc section; lib/mkpe.py of the spec agent's kit builds the 2,048 bytes, and the test source carries them as a byte array) next to themselves and load it with LoadLibraryExW three ways: as a data file (0x2), as image resources (0x20) and as a normal image (0); every lookup gives the same lines in all three ways. Microsoft Learn: "EnumResourceTypesW function (libloaderapi.h), EnumResTypeProcW". Wine's tests were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Calls a callback for every resource type present in a module.
interface:
  signature: "BOOL EnumResourceTypesW(HMODULE hModule, ENUMRESTYPEPROCW lpEnumFunc, LONG_PTR lParam)"
  callback: "BOOL CALLBACK(HMODULE hModule, LPWSTR lpType, LONG_PTR lParam): lpType is an integer id or a pointer to the type's name; TRUE to go on, FALSE to stop"
  returns: "TRUE when all types were enumerated; FALSE otherwise"
rules:
  modes: "The three load modes give identical answers. A module handle is the one LoadLibraryExW returned: with LOAD_LIBRARY_AS_DATAFILE its low bit is\n        set (the handle is not an address of a mapped image), with LOAD_LIBRARY_AS_IMAGE_RESOURCE bit 1 is set and bit 0 clear, and a normal\n        image's handle is 64 KiB aligned. The resource functions must accept all three"
  fixture: "The resources of the test image: RT_ICON #1 (8 bytes 01..08); RT_STRING blocks #1 (strings 1 \"Hello\", 2 empty, 3 \"World \" U+20AC U+00E9,\n        15 \"last\"), #2 (string 16 \"sixteen\") in the neutral language and block #7 (string 100 \"nur deutsch\") in de-DE (0x0407) only; RT_RCDATA\n        named \"ALPHA\" (1 byte), \"BETA\" (3), \"BLOB\" (20 bytes \"0123456789ABCDEFGHIJ\"), \"ZETA\" (2), numbered 100 (\"abc\"), 101 (0 bytes), and 7 in two\n        languages, en-US (0x0409, \"english text\") and de-DE (\"deutscher text!\"); RT_GROUP_ICON \"MAINICON\" and #2 (6 bytes each); RT_VERSION #1 in\n        en-US (16 bytes \"@ABCDEFGHIJKLMNO\"); a custom type \"TEXTFILE\" with the names #1 (14 bytes, two lines) and \"README\" (\"hello\"); a custom type\n        \"TEXTFILE2\" with the name #5 (70 bytes). All names and type names are stored in upper case, as resource compilers do"
  order: "named types first in ascending order (\"TEXTFILE\", \"TEXTFILE2\"), then numbered types ascending: #3, #6, #10, #14, #16 (7 calls in all)"
  success: "TRUE with the last error unchanged"
  stop: "a callback that returns FALSE ends the enumeration: FALSE with ERROR_RESOURCE_ENUM_USER_STOP (15106), also when it is the last call (stopping at call 7 of 7); a stop count of 1, 2, 5, 6 gives that many callbacks"
  no_resources: "an address that is no module: FALSE and ERROR_RESOURCE_DATA_NOT_FOUND (1812), no callbacks"
errors:
  error_resource_enum_user_stop: "15106"
  error_resource_data_not_found: "1812"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 0
building_tests: >
  Rust tests (ADR 0075); they import kernel32.dll (and user32.dll for LoadStringW). Each line is one call with its type and name written as #n for a number and "text" for a string, then -> found/NULL and the last error, or the size and the first bytes of the data (non-printable bytes as <xx>). The tests need a loader that can load a PE image that has no code and no imports with LOAD_LIBRARY_AS_DATAFILE, LOAD_LIBRARY_AS_IMAGE_RESOURCE and normally (a DLL without an entry point); a program of another kind (a console exe) is not needed for the lookups.
not_covered: >
  The A function, EnumResourceTypesExW, the module of the program itself.
