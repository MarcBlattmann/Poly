# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernel32.dll/CreateThreadpool.yaml
id: windows/api/kernel32.dll/CreateThreadpool
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: Thread Pools, Using the Thread Pool Functions, CreateThreadpoolWork, SubmitThreadpoolWork, WaitForThreadpoolWorkCallbacks, CloseThreadpoolWork, CreateThreadpoolTimer, SetThreadpoolTimer, SetThreadpoolTimerEx, IsThreadpoolTimerSet, CreateThreadpoolWait, SetThreadpoolWait, SetThreadpoolWaitEx, CreateThreadpoolIo, StartThreadpoolIo, CancelThreadpoolIo, CreateThreadpool, SetThreadpoolThreadMaximum, SetThreadpoolThreadMinimum, CreateThreadpoolCleanupGroup, CloseThreadpoolCleanupGroupMembers, CallbackMayRunLong, SetEventWhenCallbackReturns and its siblings, DisassociateCurrentThreadFromCallback, TrySubmitThreadpoolCallback, RegisterWaitForSingleObject, UnregisterWaitEx, QueueUserWorkItem, Thread Pool Callback Environments (TP_CALLBACK_ENVIRON_V3 layout and the inline helpers from winbase.h / threadpoolapiset.h). Wine's tests and source were not read.
summary: >
  Creates a private thread pool; objects created with a callback environment that names it (TP_CALLBACK_ENVIRON_V3.Pool) run there. SetThreadpoolThreadMaximum limits the threads; SetThreadpoolThreadMinimum keeps at least that many (and raises the maximum when it is lower); CloseThreadpool releases the pool. An environment without a pool uses the process default pool.
interface:
  signature: "PTP_POOL CreateThreadpool(PVOID reserved); void SetThreadpoolThreadMaximum(PTP_POOL, DWORD); BOOL SetThreadpoolThreadMinimum(PTP_POOL, DWORD); void CloseThreadpool(PTP_POOL)"
rules:
  maximum: "with minimum 2 and maximum 2 six blocked callbacks ran two at a time; a pool with only a maximum of 3: three at a time; all six ran when released."
  minimum: "SetThreadpoolThreadMinimum returns TRUE (last error untouched), also for a value above the maximum: with maximum 3 and minimum 5 eight blocked callbacks ran five at a time (the maximum was raised)."
  one_thread: "in a pool with maximum 1 and minimum 1 three TrySubmitThreadpoolCallback callbacks all ran; the callback, a timer, a wait and a work object created in the same environment ran on the same thread."
  pools_are_separate: "a callback of a second pool ran on another thread than the first pool's, and neither was the caller's thread."
  default_pool: "an environment with no pool: TrySubmitThreadpoolCallback returned TRUE and the callback ran."
  environment_layout: "TP_CALLBACK_ENVIRON_V3 (x64, 72 bytes): Version 3 at 0; Pool at 8; CleanupGroup at 16; CleanupGroupCancelCallback at 24; RaceDll at 32; ActivationContext at 40; FinalizationCallback at 48; Flags at 56 (bit 0 long function, bit 1 persistent); CallbackPriority at 60 (1 = normal); Size at 64 (72). The inline helpers of the SDK headers write these fields; the tests fill them as the headers do."
errors:
  none: "none provoked"
side_effects: "creates threads on demand"
threading: "any thread"
ordering: []
timing:
  typical: "threads are created within milliseconds when work arrives"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll (and ntdll.dll / advapi32.dll where named) by name. A callback that must not have run yet is observed after 200-300 ms, a callback that must run is waited for up to 5 s, so a failing implementation fails an observation instead of hanging the run. Only the main thread writes observations; callbacks store into atomics. Pool sizes are set explicitly where concurrency is observed (a private pool). Timer periods are observed as counts with generous bounds. Each test is kept in three files that make the same calls and write every third observation line, so one test serves as visible and held-out tests.
not_covered: >
  Stack sizes (SetThreadpoolStackInformation), thread priority, closing a pool that still has work, TP_CALLBACK_PRIORITY.
