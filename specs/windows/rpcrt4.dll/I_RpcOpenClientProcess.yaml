# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/rpcrt4.dll/I_RpcOpenClientProcess.yaml
id: windows/api/rpcrt4.dll/I_RpcOpenClientProcess
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 with -Token elevated (full administrator token, high integrity) and -Token standard (filtered administrator token, medium integrity, Administrators deny-only) in the interactive desktop session of the local account \"server\" (session 1); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-sec
  date: 2026-11-19
sources: >
  Observations of our own test programs (client, local COM server, LocalSystem service, and de-elevated child client in one image) on the oracle machine above. Microsoft Learn: "CoInitializeSecurity function (combaseapi.h)", "CoSetProxyBlanket", "CoQueryProxyBlanket", "CoCopyProxy", "IClientSecurity interface (objidlbase.h)", "CoGetCallContext", "IServerSecurity interface (objidlbase.h)", "CoQueryClientBlanket", "CoImpersonateClient", "CoRevertToSelf", "EOLE_AUTHENTICATION_CAPABILITIES", "RPC_C_AUTHN_LEVEL_*", "RPC_C_IMP_LEVEL_*", "COM_RIGHTS_*", "AppID Key", "LaunchPermission", "AccessPermission", "Security in COM"; combaseapi.h, objidl.h, objidlbase.h, rpcdce.h, wtypes.h, winnt.h, winerror.h for constants and layouts. Google's updater and Chrome's elevation service: their own logs, registry changes, and PE import names from the survey (docs/windows/chrome-installer-plan.md, docs/windows/com-out-of-process-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Opens a process handle to the immediate local RPC/COM caller of the call currently being served on the calling thread, with the requested process access mask. Returns a Win32/RPC status code (0 = RPC_S_OK). For direct proxy calls the opened handle refers to the client process; for activation-time CreateInstance calls invoked during CoCreateInstance the immediate caller is the system's COM activation/RPC service process.
interface:
  signature: "RPC_STATUS I_RpcOpenClientProcess(RPC_BINDING_HANDLE ServerBinding, ULONG DesiredAccess, void **ClientProcess) (no public header: this is the shape of the calls the tests make, three arguments, the first always NULL, the second an access mask, the third receives a process handle; the first argument was not tried with anything else)"
  export: "exported by name from rpcrt4.dll"
installer: "Imported by name by Chrome's elevation_service.exe; Google's updater does not import it. Note for the implementer on the caller PID the updater logs (docs/windows/com-out-of-process-plan.md section 6): the updater's own API for it is not known; what was observed is that the PID it logs for objects created by CoCreateInstance is the process of the RPC/activation service (the same process this function opens during such a call), and for direct method calls the client's. Which API the updater uses was not determined."
rules:
  direct_calls_open_client: "called with ServerBinding = NULL inside a direct proxy call (such as IClassFactory::CreateInstance on a proxy from CoGetClassObject, at default, IDENTIFY, IMPERSONATE or DELEGATE proxy blanket), returns 0 (RPC_S_OK) and a valid process handle (caller closes with CloseHandle) whose GetProcessId equals the client process's PID (not the server's own PID), for both PROCESS_QUERY_LIMITED_INFORMATION (0x1000) and PROCESS_VM_READ (0x0010), in elevated LocalServer32 servers, standard-token LocalServer32 servers, and LocalSystem services (for both elevated and standard clients)"
  activation_calls_open_activator: "called with ServerBinding = NULL inside activation-time IClassFactory::CreateInstance (invoked by COM during CoCreateInstance), the immediate RPC caller is the system's COM activation/RPC service process, NOT the originating client process and NOT the server itself: in an elevated LocalServer32 server or a LocalSystem service, returns 0 (RPC_S_OK) and a valid process handle for both PROCESS_QUERY_LIMITED_INFORMATION (0x1000) and PROCESS_VM_READ (0x0010) whose PID differs from both the client's PID and the server's PID"
  standard_server_cannot_open_activator: "when the server runs with a standard (filtered) user token, calling I_RpcOpenClientProcess(NULL, ...) during activation-time CreateInstance fails with 5 (ERROR_ACCESS_DENIED) and writes no valid handle (for both 0x1000 and 0x0010), because a standard user process cannot open the system activation service process; direct calls from the same-user standard client still return 0 with a handle to the client process"
  other_server_thread: "called with ServerBinding = NULL on a thread of a COM server process that is not currently serving a call, returns 1725 (RPC_S_NO_CALL_ACTIVE)"
errors:
  ok: "0 (RPC_S_OK)"
  access_denied: "5 (ERROR_ACCESS_DENIED, e.g. standard-token server during activation)"
  no_call_active: "1725 (RPC_S_NO_CALL_ACTIVE, on a server thread not serving a call)"
side_effects: "opens a process handle in the calling process that the caller must close with CloseHandle"
threading: "per thread when ServerBinding is NULL: inspects the call currently being served on the calling thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each: local-server tests run under both -Token elevated and -Token standard (same-user LocalServer32 server); service tests run under -Token elevated with a LocalSystem service (CreateServiceW, AppID LocalService, CoInitializeSecurity admitting Everyone) called by both the elevated test and a de-elevated child client created with the interactive session shell's (explorer.exe) filtered token; out-of-call tests run across no-COM, STA and MTA threads. Classes and services use unique {B2A0xxxx-...} / PolyWsSecSvc* names and are cleaned up. Observations are HRESULTs, Win32 codes, blanket fields, token attributes and booleans, never raw process ids, thread ids or pointers.
not_covered: >
  non-NULL ServerBinding handles, remote (non-LRPC) callers, and calling from a plain process with no RPC/COM server runtime active (which access-violated on Windows and is not part of the contract).
