# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shlwapi.dll/PathFileExistsW.yaml
id: windows/api/shlwapi.dll/PathFileExistsW
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, a non-interactive window station, 96 dpi) as the local account \"server\" (member of Administrators); every test ran at least twice with identical output and two complete recordings agreed byte for byte, each run in a fresh scratch directory; the test programs carry no manifest (the icon tests carry the manifest that asks for comctl32 version 6). The fonts the tests use are the test's own TrueType font (added with AddFontMemResourceEx) and DejaVu Sans 2.37 (the file C:\\Windows\\Fonts\\DejaVuSans.ttf, copied there for the recording and removed afterwards, added with AddFontResourceExW and FR_PRIVATE); no Microsoft font is used"
  observed_by: spec-win-glyphs
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above (Rust executables that declare the functions they call from Microsoft Learn prototypes and the public SDK headers). The fonts are free: a TrueType font the test writes itself (units per em 1024, every outline coordinate a multiple of 64 units, so that at 16 pixels per em every point lies on a whole pixel) and DejaVu Sans 2.37 (Bitstream Vera licence, shipped with Poly); where a number would depend on hinting, the test asks for 2048 pixels per em, the font's units per em, so that one pixel is one font unit and the outline is the file's. Microsoft Learn reference pages of the functions and structures named here and the public headers wingdi.h, winuser.h, winbase.h, shlwapi.h, dbghelp.h, commctrl.h, winerror.h and the TrueType and OpenType font file format documents for table layouts. The conformance tests of Wine, its source and ReactOS were not read. No Microsoft binary was decompiled or disassembled.
summary: >
  Says whether a file or a directory with that path exists (it does not look at the file's contents or open it with sharing). Notepad++ checks its plugin paths with it. Observed in a scratch directory with files, a sub directory, and many spellings of the paths.
interface:
  signature: "BOOL PathFileExistsW(LPCWSTR pszPath)"
rules:
  exists: "TRUE for an existing file (also an empty one), a directory, a sub directory, a file in a sub directory, 'C:\\', 'C:' (the current directory of the drive), 'C:\\.', '.' and '..'; the last error is left unchanged after a TRUE result."
  case: "Names are compared without regard to case ('FILE.TXT' finds 'file.txt', 'mixed case.txt' finds 'Mixed Case.TXT')."
  separators: "A trailing backslash or slash on a directory still exists; a forward slash separator works; a doubled backslash works; dot and dot-dot segments are resolved lexically ('sub\\.\\inner.dat', 'sub\\..\\file.txt'), also through a directory that does not exist ('nodir\\..\\file.txt' is TRUE); the extended-length prefix \\\\?\\ with the full path of a file works. A trailing dot or a trailing space on a name is ignored ('file.txt.' and 'file.txt ' are TRUE)."
  file_with_slash: "A file with a trailing backslash ('file.txt\\') is FALSE with ERROR_DIRECTORY (267)."
  files_unchanged: "The probes do not change the files (attributes of file.txt stay 0x20)."
errors:
  not_found: "A missing name in an existing directory: FALSE, ERROR_FILE_NOT_FOUND (2); a missing directory in the path, a file used as a directory ('file.txt\\inner'), an empty string, a drive that does not exist ('Q:\\', 'Q:\\x\\y.txt'), a 599 character name, a path with a 300 character file name: FALSE, ERROR_PATH_NOT_FOUND (3); a relative name that is not there: FALSE, error 2; a name that no longer exists after the clean-up: 2 (directory) and 3 (a file in the removed directory)."
  wildcards_and_illegal_characters: "Wildcards ('*', '?', 'file.*') and illegal characters (a quote, '|', '<'): FALSE with ERROR_INVALID_NAME (123); a name with a colon ('file.txt:stream', a stream that is not there): FALSE, error 2."
  null_path: "A NULL path: FALSE, the last error left unchanged (no error code)."
side_effects: "none beyond the rules above"
threading: "no state of its own"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle (the 757 KB whole-font copies of DejaVu Sans a few milliseconds)"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075), one file per test, each carrying its own declarations. Run in the SSH session (session 0) by poly-oracle.ps1. The tests make a directory with files in the test's scratch directory (a file with contents, an empty file, a mixed-case name, a sub directory with a file), probe it, and remove it at the end; the observations print TRUE (1) or FALSE (0) and the last error after the call ("unchanged" when it was left as the test had set it); no path is printed, so the scratch path does not matter. No test depends on a font or on the machine.
not_covered: >
  Network paths (UNC), device names (NUL, CON), reparse points and links, paths above 32767 characters, access-denied directories, case rules of case-sensitive directories, volumes of other drive letters.
