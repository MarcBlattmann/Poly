id: windows/api/shlwapi.dll/PathAddBackslashW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-1
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above: every function was called on the same four sets of strings (relative paths, paths with a drive letter, UNC and device paths, paths with the long prefix; 36 to 40 strings each, edge cases first) and each run was repeated with identical output. Microsoft Learn: "PathAddBackslashW function (shlwapi.h)". Wine's tests were not read. No Microsoft binary was decompiled or disassembled. The rules below were read from the observed tables and are not checked line by line by a model (the visible tests and their recorded results are the complete data).
summary: >
  Adds a trailing backslash to a path in place. 1 package imports it.
interface:
  signature: "LPWSTR PathAddBackslashW(LPWSTR pszPath)"
  returns: "a pointer to the terminating NUL of the resulting string (the position after the added backslash, or the old end when none was added); NULL when the buffer limit would be exceeded"
rules:
  rule: "a backslash is appended unless the string is empty or already ends with a backslash: `a` -> `a\\`, `C:` -> `C:\\`, `C:\\a` -> `C:\\a\\`, `C:/` -> `C:/\\` (only a backslash counts), `\\\\s` -> `\\\\s\\`, `a\\` stays, `\\` stays, `\\\\` stays, `\\\\\\` stays, `C:\\\\` stays, '' stays ''. Nothing else is changed (dots, spaces, case)"
  returned: "the returned pointer is the offset of the NUL: for `C:\\a` +5 (length of the new string), for an unchanged `a\\` +2, for '' +0"
errors:
  none: "none observed; the buffer is assumed to be MAX_PATH units"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per group of strings; they import shlwapi.dll (kernelbase.dll for the PathCch functions). Each line is one call: "<input>" -> <result>. A test string is a path as UTF-16; backslashes are written as they are (so `\\s` is two backslashes and an s); a string longer than 70 units is shown by its first 12 and its length. The last error is set to a marker before each call and shown only when a call changed it. Result strings are read up to their NUL; destination buffers are prefilled with 0xAAAA.
not_covered: >
  A string of 259 units or more (the NULL return), a NULL pointer.
