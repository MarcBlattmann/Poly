# Path: specs/windows/shlwapi.dll/PathStripPathW.yaml
id: windows/api/shlwapi.dll/PathStripPathW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-1
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above: every function was called on the same four sets of strings (relative paths, paths with a drive letter, UNC and device paths, paths with the long prefix; 36 to 40 strings each, edge cases first) and each run was repeated with identical output. Microsoft Learn: "PathStripPathW function (shlwapi.h)". Wine's tests were not read. No Microsoft binary was decompiled or disassembled. The rules below were read from the observed tables and are not checked line by line by a model (the visible tests and their recorded results are the complete data).
summary: >
  Keeps only the file name of a path (the part after the last separator), in place. 4 packages import it.
interface:
  signature: "void PathStripPathW(LPWSTR pszPath)"
  returns: "nothing; the string is shortened from the front"
rules:
  rule: "the string becomes the text after the last separator, where a separator is a backslash, a forward slash or a colon, and a separator that is the LAST character of the string does not count (so a trailing backslash stays with the name): `C:\\a\\b` -> `b`; `a\\b\\c.txt` -> `c.txt`; `a\\b\\` -> `b\\`; `C:\\a\\` -> `a\\`; `a/b/c` -> `c`; `a/b\\c` -> `c`; `C:a` -> `a`; `C:a\\` -> `a\\`; `1:\\a` -> `a`; `\\\\s` -> `s`; `\\\\s\\sh\\f` -> `f`; `\\\\.\\C:` -> `C:`; `\\\\?` -> `?`; `a\\\\b` -> `b`; `a\\\\\\b\\` -> `b\\`; `C:\\a\\.` -> `.`; `C:\\a\\..` -> `..`"
  unchanged: "a string with no separator, or whose only separators are last characters stays as it is: '', `a`, `a b`, `a.b`, `.txt`, `C:`, `C:\\`, `C:/`, `C:\\\\`, `\\`, `\\\\`, `\\\\\\`, `a\\` (-> `a\\`), `.`"
errors:
  none: "no result and no error"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per group of strings; they import shlwapi.dll (kernelbase.dll for the PathCch functions). Each line is one call: "<input>" -> <result>. A test string is a path as UTF-16; backslashes are written as they are (so `\\s` is two backslashes and an s); a string longer than 70 units is shown by its first 12 and its length. The last error is set to a marker before each call and shown only when a call changed it. Result strings are read up to their NUL; destination buffers are prefilled with 0xAAAA.
not_covered: >
  A NULL pointer; the claimed sheet of PathFindFileNameW (another agent) specifies the pointer-returning twin; this one is its in-place form and the observations agree on every string the two share.
