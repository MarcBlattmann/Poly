# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shlwapi.dll/PathAppendW.yaml
id: windows/api/shlwapi.dll/PathAppendW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-1
  date: 2026-11-14
sources: >
  Observations of our own test programs on the machine above: every function was called on the same four sets of strings (relative paths, paths with a drive letter, UNC and device paths, paths with the long prefix; 36 to 40 strings each, edge cases first) and each run was repeated with identical output. Microsoft Learn: "PathAppendW function (shlwapi.h)". Wine's tests were not read. No Microsoft binary was decompiled or disassembled. The rules below were read from the observed tables and are not checked line by line by a model (the visible tests and their recorded results are the complete data).
summary: >
  Appends a relative path to a path in the same buffer. Firefox stops on it when its launcher builds the path of its main DLL; 5 packages import it (3 main executables). It differs from PathCombineW in one way: a leading backslash of the second part is dropped instead of being taken from the root. A failed call leaves an empty string in the buffer.
interface:
  signature: "BOOL PathAppendW(LPWSTR pszPath, LPCWSTR pszMore)"
  returns: "TRUE on success; FALSE on failure, and pszPath is then an empty string"
  buffer: "pszPath must hold MAX_PATH units"
rules:
  join: "the result is the canonical form (see PathCanonicalizeW) of `path`, a backslash unless `path` is empty or ends with one, and `more` with ONE leading backslash removed: `a` + `b` -> `a\\b`; `a` + `\\b` -> `a\\b`; `a\\` + `b\\c` -> `a\\b\\c`; '' + `b` -> `b`; '' + `\\b` -> `b`... no: '' + `\\b` -> `\\b`; `\\` + `\\b` -> `\\b`; `C:` + `b` -> `C:\\b`; `C:` + `\\b` -> `C:\\b`; `C:\\a` + `\\b` -> `C:\\a\\b`; `C:\\a` + `\\` -> `C:\\a`; `C:\\a\\\\` + `\\b` -> `C:\\a\\\\b`; `\\\\s` + `\\b` -> `\\\\s\\b`; `\\\\s\\sh` + `b` -> `\\\\s\\sh\\b`; `\\\\?\\C:\\a` + `b` -> `C:\\a\\b`; `\\\\?\\C:` + '' -> `C:\\`"
  empty_more: "an empty `more` (or `\\`) gives the canonical form of `path` (`C:` -> `C:\\`, '' -> `\\`, `a` -> `a`, `C:\\a\\\\` stays)"
  dots: "`.` changes nothing, `..` removes a segment of `path` (`C:\\a` + `..` -> `C:\\`, `a` + `..` -> `\\`, `\\\\s\\sh` + `..` -> `\\\\s`, `\\\\?\\C:` + `..` -> `C:\\`), `b\\..` comes back to `path`, `\\..` the same as `..`"
  absolute_more: "an absolute `more` replaces the whole path (canonicalized): `C:\\b`, `C:b` (result `C:b`), `\\\\s\\x`, a start of two backslashes `\\\\b`, `\\\\?\\C:\\x` (result `C:\\x`): `C:\\a` + `C:\\b` -> `C:\\b`; `a` + `\\\\b` -> `\\\\b`; `C:\\a` + `C:b` -> `C:b`"
  limit: "a result of 259 units or fewer works; 260 or more (260, 261, 270) fails: FALSE and `path` becomes the empty string. An empty path with a 300-unit `more` fails the same way; a 259-unit path with an empty `more` works unchanged"
  slash_and_space: "a forward slash and spaces are ordinary: `C:\\a` + `/b` -> `C:\\a\\/b`; `a b` + `b` -> `a b\\b`; `C:` + ` b` -> `C:\\ b`"
errors:
  none: "the failure is FALSE; the last error is not set"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file per group of strings; they import shlwapi.dll (kernelbase.dll for the PathCch functions). Each line is one call: "<input>" -> <result>. A test string is a path as UTF-16; backslashes are written as they are (so `\\s` is two backslashes and an s); a string longer than 70 units is shown by its first 12 and its length. The last error is set to a marker before each call and shown only when a call changed it. Result strings are read up to their NUL; destination buffers are prefilled with 0xAAAA.
not_covered: >
  NULL pointers, buffers smaller than MAX_PATH, the A function.
