timing:
  typical: "microseconds"
  guarantees: "none"
building_tests: "Rust tests (ADR 0075). ucanon_basic: 51 URLs and paths with flags 0; ucanon_flags: the flags above on suitable inputs, each line `flags <hex> <input> -> hr, cch, result`; ucanon_buffers: buffer capacities, NULL arguments, in-place, long input. Non-ASCII units print as <xxxx>."
not_covered: "URL_UNESCAPE_INPLACE, UTF-8 escaping flags (URL_ESCAPE_AS_UTF8), URLs over 2084 units, IPv6 hosts, internationalized hosts, other schemes' special handling (about:, javascript:) beyond the examples, the A form (UrlCanonicalizeA), the shlwapi 'Wrap' ordinals."
