# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/shlwapi.dll/UrlCanonicalizeW.yaml
id: windows/api/shlwapi.dll/UrlCanonicalizeW
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). Default mode: the SSH logon (session 0, no interactive desktop, the administrator's elevated token, 24 privileges). Every test ran twice with identical output."
  observed_by: "spec-win-chrome-setup"
  date: "2026-11-17"
sources: "Observations of our own test programs on the oracle machine. Microsoft Learn: UrlCanonicalizeW, \"Shell URL flags\" (URL_* values from shlwapi.h), HRESULT values (winerror.h). Nothing of Windows or Google's programs was read or disassembled."
summary: "Rewrites a URL or a file path into canonical form: it lower-cases the scheme and host of known schemes, adds the missing path slash after a host, turns backslashes into slashes, removes dot segments (in the cases the examples show), turns file paths into file: URLs, and with flags escapes or unescapes characters. The result goes into the caller's buffer; *pcchCanonicalized is the capacity on entry and the length of the result without its NUL on success (the length needed including the NUL when the buffer was too small). setup.exe of Chrome imports the function. The `examples` list is normative: it holds every input and result recorded."
interface:
  signature: "HRESULT UrlCanonicalizeW(PCWSTR url, PWSTR canonicalized, DWORD *cch_canonicalized, DWORD flags)  (shlwapi)"
  flags: "URL_UNESCAPE 0x10000000, URL_ESCAPE_UNSAFE 0x20000000, URL_PLUGGABLE_PROTOCOL 0x40000000, URL_WININET_COMPATIBILITY 0x80000000, URL_ESCAPE_SPACES_ONLY 0x04000000, URL_DONT_SIMPLIFY (=URL_NO_META) 0x08000000, URL_UNESCAPE_INPLACE 0x00100000, URL_CONVERT_IF_DOSPATH 0x00200000, URL_INTERNAL_PATH 0x00800000, URL_FILE_USE_PATHURL 0x00010000, URL_ESCAPE_PERCENT 0x00001000, URL_ESCAPE_SEGMENT_ONLY 0x00002000, URL_APPLY_DEFAULT 1, URL_APPLY_GUESSSCHEME 2, URL_APPLY_GUESSFILE 4, URL_APPLY_FORCEAPPLY 8 (shlwapi.h)"
rules:
  scheme_host: "with flags 0, http(s)/ftp and file schemes and their hosts are lower-cased (HTTP://WWW.EXAMPLE.COM/A -> http://www.example.com/A); a bare host gets the closing slash (http://www.example.com -> http://www.example.com/); unknown schemes (mailto:, javascript:, about:, res://, x-custom://) are left as they are except for dot segments; a default port is dropped (http://user:pw@host:80/p -> http://user:pw@host/p); leading and trailing spaces are removed (\"  http://a/b  \" -> http://a/b)"
  slashes: "backslashes become slashes in http-style URLs; double slashes inside the path stay"
  dot_segments: "\"/b/..\" and \"/b/../..\" sequences collapse (http://a/b/../../c -> http://a/c; http://a/b/. -> http://a/b/) but the first example http://a/./b/../c is returned UNCHANGED with flags 0 (the examples are the rule); with URL_DONT_SIMPLIFY nothing collapses; dots inside a query or fragment are never touched"
  spaces_and_percent: "flags 0 do not escape spaces and unsafe characters in http URLs (http://a/b c stays), and existing %XX escapes are untouched; file paths become file:///C:/a/b%20c.txt (the space IS escaped there); URL_ESCAPE_UNSAFE escapes space, quotes, <, >, | ^ { } and non-ASCII characters (as one byte %E9 for U+00E9); URL_UNESCAPE decodes %XX (invalid escapes stay); URL_ESCAPE_SPACES_ONLY escapes only spaces"
  file: "a DOS path (C:\\a\\b c.txt) or UNC path (\\\\server\\share\\a b) becomes file:///C:/a/b%20c.txt resp. file://server/share/a%20b; file:c:/a/b becomes file:///c:/a/b; with URL_FILE_USE_PATHURL or URL_WININET_COMPATIBILITY a file URL becomes file://C:\\a\\b c (backslash form); URL_CONVERT_IF_DOSPATH and URL_INTERNAL_PATH also turn DOS paths into file URLs"
  guess: "URL_APPLY_GUESSSCHEME alone returns www.example.com unchanged in these runs (no scheme is added); URL_APPLY_GUESSFILE turns C:\\a\\b into file:///C:/a/b"
  buffer: "capacity (*pcch on entry) counts units including the NUL: a result of n units needs n+1; with enough room the result is written, NUL-terminated, *pcch = n and the result is S_OK (0); with too little room the buffer is not written, the result is E_POINTER (0x80004003) and *pcch = n+1; capacity 0 gives E_INVALIDARG (0x80070057) and *pcch stays 0; an empty URL gives S_OK, *pcch 0, the buffer holds a NUL (capacity 1 is enough)"
  in_place: "the output buffer may be the input buffer (the examples in ucanon_buffers)"
  null_arguments: "a NULL URL, a NULL output buffer or a NULL length pointer: E_INVALIDARG (0x80070057); *pcch is left as it was"
  long: "URLs of 250 and 310 units work with a buffer of 400 units (no extra limit seen below that)"
