# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ws2_32.dll/recv.yaml
id: windows/api/ws2_32.dll/recv
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed with a trace kit that logs arguments (polytrace-sync) on stage S4 (headless, http://example.com/ and https://www.iana.org/) on the owner's PC, plus the counts and failures of specs/windows/apps/chrome/traces/s4.trace.json (the committed traces have counts, not arguments, for these calls). Microsoft Learn: "connect function (winsock2.h)", "WSAEventSelect function", "WSAEnumNetworkEvents function", "recv function", "WSASend function", "sendto function", "WSARecv function", "WSAGetOverlappedResult function", "AcceptEx function (mswsock.h)", "Winsock Error Codes", "I/O Completion Ports"; winsock2.h, ws2def.h, ws2ipdef.h, mswsock.h, mstcpip.h, winerror.h and ntstatus.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Receives data. Chrome calls it 216 times in a run (63 in one network service run): recv(s, buf, 1, MSG_PEEK) three times right after a connect (each -1/WSAEWOULDBLOCK, a liveness probe), recv(s, buf, 4096 or 17408, 0) until -1/WSAEWOULDBLOCK. The tests give: peek and zero-length reads on non-blocking sockets, EOF after the peer's shutdown, the errors after a local shutdown and a peer reset, datagram truncation, the order of the checks on sockets that are not connected.
interface:
  signature: "int recv(SOCKET s, char* buf, int len, int flags)"
  result: "bytes received, 0 for a closed connection (or an empty datagram), or SOCKET_ERROR with WSAGetLastError"
  flags: "MSG_OOB 1, MSG_PEEK 2, MSG_WAITALL 8"
chrome:
  calls: "recv 216 calls in the committed trace (63 in one network service run); in five argument-level runs: (len 1, MSG_PEEK) 81 times, always -1 (WSAEWOULDBLOCK 63 times, the rest after the first); (len 17408 or 4096, flags 0): returned data 62 times and -1/WSAEWOULDBLOCK 69 times"
rules:
  peek_no_data: "on a non-blocking connected socket with no data, recv(s, buf, 1, MSG_PEEK) three times: -1/WSAEWOULDBLOCK each time; recv(s, buf, 64, 0): -1/WSAEWOULDBLOCK; recv with length 0: -1/WSAEWOULDBLOCK"
  data: "10 bytes waiting: a zero-length recv returns 0 (nothing consumed, FIONREAD still 10); recv(1, MSG_PEEK) returns 1 and consumes nothing; recv of 4 returns 4 (FIONREAD 6); peek of the rest 6, recv 6"
  msg_waitall: "MSG_WAITALL on a non-blocking socket: -1/WSAEOPNOTSUPP (10045) and the 3 bytes stay queued; MSG_OOB with no urgent data: -1/WSAEWOULDBLOCK"
  eof: "after the peer's shutdown(SD_SEND): recv returns 0 every time, also with MSG_PEEK and with a zero-length buffer; the peer's side can still send (send returns 1)"
  local_shutdown: "after shutdown(SD_RECEIVE) with 4 bytes queued: recv gives -1/WSAECONNABORTED (10053), again the same, and after shutdown(SD_BOTH) recv and send give -1/WSAECONNABORTED (the peer's data after SD_RECEIVE resets the connection)"
  not_connected: "recv on an unconnected TCP socket and on a listener: -1/WSAENOTCONN (10057); on a non-socket: -1/WSAENOTSOCK; a NULL buffer and a length of -1 on an unconnected socket also give -1/WSAENOTCONN (the state is checked first)"
  reset: "the peer closes with SO_LINGER 0 while 6 bytes are queued: recv returns -1/WSAECONNRESET (10054) at once (queued data is lost), again the same every time, send -1/WSAECONNRESET, SO_ERROR reads 0"
  reset_send: "a send after the peer reset: -1/WSAECONNRESET, the second also WSAECONNRESET"
  udp: "recv on an unbound UDP socket: -1/WSAEINVAL (10022); on an empty non-blocking UDP socket: -1/WSAEWOULDBLOCK; FIONREAD of a 40-byte datagram gives 40; a 10-byte buffer: peek and recv both return -1/WSAEMSGSIZE (10040) with the first 10 bytes in the buffer and the datagram is consumed by the real recv (kept by the peek); an empty datagram: recv returns 0 and the next recv -1/WSAEWOULDBLOCK; recvfrom reports the sender (family 2, length 16, its port); recvfrom with an 8-byte address buffer: -1/WSAEFAULT, the length stays 8 and the datagram stays queued"
errors:
  would_block: "WSAEWOULDBLOCK 10035"
  reset: "WSAECONNRESET 10054"
  aborted: "WSAECONNABORTED 10053"
  notconn: "WSAENOTCONN 10057"
  msgsize: "WSAEMSGSIZE 10040"
  opnotsupp: "WSAEOPNOTSUPP 10045"
  inval: "WSAEINVAL 10022"
  fault: "WSAEFAULT 10014"
side_effects: "consumes the received bytes (not with MSG_PEEK); re-arms FD_READ of an event-selected socket"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 4
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, WSA error codes, counts, flags and booleans, never socket or handle values, ports, addresses other than loopback, process ids, times or names of the machine. Every test is self-contained and offline: it binds its own listener on 127.0.0.1 or ::1 with port 0 (the system chooses the port, which is never printed) and talks to it from the same process (a thread of the test) or from a child (the test's own image started again with --child). Every wait is bounded (at most about 10 s) and nothing leaves the machine. The tests run in the SSH logon session of the oracle (session 0).
not_covered: >
  MSG_OOB data, SO_RCVTIMEO and blocking recv timeouts, MSG_PARTIAL, receiving into a buffer smaller than a stream segment with SO_RCVBUF changes, recv after the socket is closed from another thread.
