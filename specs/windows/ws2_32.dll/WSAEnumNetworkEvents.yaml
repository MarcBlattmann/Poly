# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ws2_32.dll/WSAEnumNetworkEvents.yaml
id: windows/api/ws2_32.dll/WSAEnumNetworkEvents
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed with a trace kit that logs arguments (polytrace-sync) on stage S4 (headless, http://example.com/ and https://www.iana.org/) on the owner's PC, plus the counts and failures of specs/windows/apps/chrome/traces/s4.trace.json (the committed traces have counts, not arguments, for these calls). Microsoft Learn: "connect function (winsock2.h)", "WSAEventSelect function", "WSAEnumNetworkEvents function", "recv function", "WSASend function", "sendto function", "WSARecv function", "WSAGetOverlappedResult function", "AcceptEx function (mswsock.h)", "Winsock Error Codes", "I/O Completion Ports"; winsock2.h, ws2def.h, ws2ipdef.h, mswsock.h, mstcpip.h, winerror.h and ntstatus.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Reports and clears the network events recorded for a socket and resets the event. Chrome calls it every time the socket's event is signalled (395 calls, 62 in one run of the network service, always with the socket's own event and a WSANETWORKEVENTS record of 44 bytes: lNetworkEvents then ten error codes). Only the error slots of events that happened are written: the other slots keep what the caller put there.
interface:
  signature: "int WSAEnumNetworkEvents(SOCKET s, WSAEVENT hEventObject, LPWSANETWORKEVENTS lpNetworkEvents)"
  result: "0, or SOCKET_ERROR; the record: lNetworkEvents (4 bytes) and iErrorCode[10] (FD_READ_BIT 0 ... FD_CLOSE_BIT 5)"
chrome:
  calls: "395 calls, all 0; records seen in five argument-level runs: lNetworkEvents 1 (FD_READ, 126 times), 0 (40 times: the event was signalled but nothing is recorded, e.g. the earlier record was already consumed), 0x10 (FD_CONNECT, 37), 3 (FD_READ|FD_WRITE, UDP, 8)"
rules:
  reset_semantics: "with the event handle: the events are returned and cleared and the event is reset (a different, unrelated event handle that was signalled is reset too); with a NULL event handle: the record is returned and cleared (a second call gives no events) but the event STAYS signalled"
  unselected: "a socket that never had WSAEventSelect (TCP or UDP): returns 0 with lNetworkEvents 0 and every error slot untouched; the same with NULL or a real event"
  record_fields: "lNetworkEvents holds only the bits that happened; the error slot of each of those bits is written (0 or the error); every other slot keeps the value the caller stored (a sentinel survived in all of them)"
  udp: "a selected UDP socket with FD_READ|FD_WRITE: signalled at once, record FD_WRITE (error 0)"
  bad_arguments: "a socket value that is not a socket, INVALID_SOCKET, a bogus event handle (0x1234), a socket used as the event, a closed event handle: all -1/WSAENOTSOCK (10038); a NULL output pointer: -1/WSAEINVAL (10022)"
  second_call: "calling it twice in a row: the second call returns 0 and no events"
errors:
  notsock: "WSAENOTSOCK 10038"
  inval: "WSAEINVAL 10022"
side_effects: "clears the socket's recorded events; resets the event"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, WSA error codes, counts, flags and booleans, never socket or handle values, ports, addresses other than loopback, process ids, times or names of the machine. Every test is self-contained and offline: it binds its own listener on 127.0.0.1 or ::1 with port 0 (the system chooses the port, which is never printed) and talks to it from the same process (a thread of the test) or from a child (the test's own image started again with --child). Every wait is bounded (at most about 10 s) and nothing leaves the machine. The tests run in the SSH logon session of the oracle (session 0).
not_covered: >
  Event objects shared by several sockets, FD_OOB records, records after the socket was closed by another thread.
