# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/NtQueryIoCompletion.yaml
id: windows/api/ntdll.dll/NtQueryIoCompletion
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: I/O Completion Ports (the depth is the number of packets GetQueuedCompletionStatus would still return). Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Reads a port's queue depth (class 0, a 32-bit count).
interface:
  signature: "NTSTATUS NtQueryIoCompletion(HANDLE port, IO_COMPLETION_INFORMATION_CLASS class, PVOID info, ULONG length, PULONG returnLength)"
rules:
  depth: "0 for an empty port; 3 after three posts (kernel32 and NT mixed); 2 after one is taken; real I/O counts when its completion is queued, not when it is issued: three pending reads queue nothing, a completed one, two cancelled ones and a failed one count as they finish (4 in the test)."
  length: "the buffer must be exactly 4 bytes: 4 succeeds (returned length 4); 8, 2 and 0 fail with STATUS_INFO_LENGTH_MISMATCH (0xC0000004); the return-length pointer may be NULL."
  class: "classes 1 and 99: STATUS_INVALID_INFO_CLASS (0xC0000003)."
  rights: "IO_COMPLETION_QUERY_STATE (1) is needed (a MODIFY_STATE-only handle: STATUS_ACCESS_DENIED)."
  not_a_port: "an event: STATUS_OBJECT_TYPE_MISMATCH; a bad handle value: STATUS_INVALID_HANDLE."
errors:
  length: "STATUS_INFO_LENGTH_MISMATCH"
  class: "STATUS_INVALID_INFO_CLASS"
  rights: "STATUS_ACCESS_DENIED"
side_effects: "none"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Named I/O completion ports (object names), file handles associated through NtSetInformationFile(FileCompletionInformation), non-pipe files, remote pipes, security descriptors.
