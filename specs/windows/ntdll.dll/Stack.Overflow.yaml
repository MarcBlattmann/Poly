# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/Stack.Overflow.yaml
id: windows/api/ntdll.dll/Stack.Overflow
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests (64-bit, and 32-bit ones that run under WOW64) run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The 64-bit tests were also run (outside the record) on a second machine, Windows 11 build 26200, and gave the same output."
  observed_by: spec-win-stack-roundrect
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, 64-bit and 32-bit (under WOW64): the layout of a thread's stack allocation read with VirtualQuery before and after one first touch, exceptions caught with a vectored exception handler that resumes the thread at a recovery point, and child processes for the cases that end the process. Microsoft Learn: "VirtualQuery", "MEMORY_BASIC_INFORMATION", "Memory Protection Constants" (PAGE_GUARD), "CreateThread" (STACK_SIZE_PARAM_IS_A_RESERVATION), "SetThreadStackGuarantee", "GetCurrentThreadStackLimits", "AddVectoredExceptionHandler", "_resetstkoflw", "Thread Stack Size", "Creating Guard Pages"; ntstatus.h (STATUS_STACK_OVERFLOW 0xC00000FD, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_GUARD_PAGE_VIOLATION 0x80000001), winnt.h (EXCEPTION_RECORD, CONTEXT, NT_TIB). Where Microsoft documents a guard page of one page the observed region is larger (3 pages in a 64-bit process, 2 pages in a 32-bit one); the sheet gives what was observed. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  When the stack is used up the memory manager raises STATUS_STACK_OVERFLOW (0xC00000FD) instead of growing it: at the access that touches a guard page p for which the N pages p-N .. p-1 would not all lie above the lowest page of the allocation (that is p-N < 1). The exception is delivered like any other (vectored handlers, then frame handlers); the stack pointer is in the guard pages, so a handler has N pages (12 KiB in a 64-bit process, 8 KiB in a 32-bit one; ceil(guarantee/4096)+1 pages with SetThreadStackGuarantee) to run on. The guard flags are then gone: every page above the lowest page of the allocation is committed, the lowest page stays reserved, and a second overflow of the same stack cannot be reported: the process ends with 0xC0000005 or 0xC00000FD. Putting the guard flag back on the lowest committed pages (the work of _resetstkoflw) makes the next overflow a STATUS_STACK_OVERFLOW again.
interface:
  signature: "behaviour of the memory manager for a thread's stack allocation (no function): the pages of the allocation (VirtualQuery), accesses to them, the exceptions raised"
chrome: "Chrome's video decoder threads (and any code with large stack frames that skip the stack probe) touch a stack page below the guard page they are about to reach without touching the guard page first. On Windows that works when the page lies inside the thread's guard region (see rules); on Poly the first version raised an access violation (#453 covers 8 KiB). These sheets give the exact rules for 64-bit and 32-bit programs."
rules:
  exception: "the exception record has code 0xC00000FD, two parameters (ExceptionInformation[0] = 1 for a write; ExceptionInformation[1] = the touched address), and the touched address lies in page N above the start of the allocation (pages counted from 0): 64-bit process N = 3, 32-bit process N = 2; with SetThreadStackGuarantee(g) N = ceil(g / 4096) + 1 if that is more than the default (g = 12288 gives 4, 16384 gives 5, 65536 gives 17, 200000 gives 50). The same for reservations of 64 KiB, 128 KiB, 256 KiB and 1 MiB and for the primary thread"
  after: "the thread was unwound to a recovery point: the allocation is 1 reserved page at its start and all the others committed read-write with no guard flag (a 256 KiB reservation: 1 reserved, 0 guard, 63 committed; 1 MiB: 1 reserved, 255 committed; 64 KiB: 1 reserved, 15 committed): the guard pages below the touched page and the touched page are all committed, with the guard flag cleared"
  lowest_page: "the lowest page of the allocation is never committed: a write to its first byte raises STATUS_ACCESS_VIOLATION; the second page can be used: its first and last byte can be written"
  handler_room: "the handler runs on the pages of the former guard region: N pages in 64-bit (12 KiB) and 32-bit (8 KiB) processes by default; SetThreadStackGuarantee(g) raises that to ceil(g/4096)+1 pages (g = 65536 gives 17 pages: the handler can use about 64 KiB)"
  unhandled: "with no handler at all the process ends with the exception code 0xC00000FD as its exit code (primary thread of a process)"
  second_overflow: "after the first overflow was caught and the stack unwound, the same recursion runs through the committed pages again, reaches the lowest page and the process ends with an exception code as its exit code, 0xC0000005 or 0xC00000FD, that no handler can see (the exception cannot be dispatched on a stack pointer in the last usable page)"
  rearm: "VirtualProtect(PAGE_GUARD | PAGE_READWRITE) on the lowest k committed pages makes the next overflow a STATUS_STACK_OVERFLOW again that a handler can catch. 64-bit process: k = 2 gives the exception at page 2, k = 3 and k = 4 and k = 8 at page 3; 32-bit process: k = 2, 3, 4 and 8 at page 2. With k = 1 the exception is raised for page 1, but the stack pointer is then in the last usable page and the exception cannot always be delivered: the process may end instead, with 0xC00000FD or 0xC0000005 (not specified). A re-armed region of at least N+1 pages first grows (touching its highest page when that page is more than N above the start of the allocation) and overflows when the stack pointer reaches page N. After that exception the pages are committed again with no guard flag"
  frames_2kib: "the recursion of the tests uses 2 KiB frames that are touched from the top; with larger frames (up to a page) the same pages are touched; a frame larger than the guard region that is first touched at its bottom ends the process (see Stack.GrowthBelowGuard)"
errors:
  stack_overflow: "STATUS_STACK_OVERFLOW 0xC00000FD (first overflow, or after re-arming the guard flag)"
  second: "process exit code 0xC0000005 or 0xC00000FD for a second overflow without re-arming"
side_effects: "pages of the stack allocation change from reserved to committed (with or without the guard flag); no other memory is touched"
threading: "per thread; the layout is read and changed only by the memory manager and by the thread's own accesses"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 6
  held_out: 2
building_tests: >
  Rust tests (ADR 0075): every test file exists twice, as a 64-bit program and as a 32-bit program (`_x86`, `// poly-arch: x86`, ADR 0259, run under WOW64). Each probe runs on a new thread (CreateThread or RtlCreateUserThread) whose stack is described, or in a child process (`--child ...`) when the probe can end the process. Observations are exception names, parameters, counts of pages that changed between the reserved, guard and committed state, and booleans; never addresses or the absolute number of committed pages (the first stack frames of a thread are at a randomised offset). Before a probe the thread commits and gives back about 20 KiB of stack, so that the exception dispatch of the probe does not itself grow the stack.
not_covered: >
  overflows in code that has a frame-based handler (SEH try/except), C++ exceptions and __try/_resetstkoflw as the compiler's run time uses them; the first-chance versus second-chance order of several handlers; how Windows Error Reporting or a debugger sees the exception; the exact room a handler has below the stack pointer (the stack pointer at the exception is anywhere in the pages that were guard pages and varies with the instruction that touched the page).
