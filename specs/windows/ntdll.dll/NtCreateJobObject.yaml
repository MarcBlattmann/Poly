# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/ntdll.dll/NtCreateJobObject
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled. Prototype: the arguments
  of the Win32 function that wraps this call map one to one (Microsoft Learn
  documents the Zw form for some of them); where Learn has no page for the
  Nt name the signature here is worked out from the Win32 function and the
  observations, not from a document.
summary: >
  Creates a job object, unnamed or with a name in the object namespace, and
  returns a handle. The creator's handle gets the requested access without a
  check against the object's own security descriptor. CreateJobObjectW calls
  it.
interface:
  signature: "NTSTATUS NtCreateJobObject(PHANDLE JobHandle, ACCESS_MASK DesiredAccess, POBJECT_ATTRIBUTES ObjectAttributes)"
  statuses: "NTSTATUS values seen (ntstatus.h): STATUS_SUCCESS 0x00000000, STATUS_NOT_ALL_ASSIGNED 0x00000106 (a success code), STATUS_OBJECT_NAME_EXISTS 0x40000000 (success), STATUS_BUFFER_OVERFLOW 0x80000005, STATUS_INVALID_INFO_CLASS 0xC0000003, STATUS_INFO_LENGTH_MISMATCH 0xC0000004, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_INVALID_HANDLE 0xC0000008, STATUS_INVALID_PARAMETER 0xC000000D, STATUS_ACCESS_DENIED 0xC0000022, STATUS_BUFFER_TOO_SMALL 0xC0000023, STATUS_OBJECT_TYPE_MISMATCH 0xC0000024, STATUS_PRIVILEGE_NOT_HELD 0xC0000061. RtlNtStatusToDosError maps 0xC0000022 to 5, 0xC0000008 and 0xC0000024 to 6 and 0xC000000D to 87. Also STATUS_OBJECT_NAME_COLLISION 0xC0000035, STATUS_OBJECT_NAME_EXISTS 0x40000000 (a success code), STATUS_OBJECT_PATH_NOT_FOUND 0xC000003A, STATUS_OBJECT_PATH_SYNTAX_BAD 0xC000003B."
  access: "Job access rights (winnt.h): JOB_OBJECT_ASSIGN_PROCESS 0x1, JOB_OBJECT_SET_ATTRIBUTES 0x2, JOB_OBJECT_QUERY 0x4, JOB_OBJECT_TERMINATE 0x8, JOB_OBJECT_SET_SECURITY_ATTRIBUTES 0x10, JOB_OBJECT_ALL_ACCESS 0x1f003f. The tests create the children they assign as suspended copies of the test executable that are never resumed."
  attributes: "OBJECT_ATTRIBUTES is 48 bytes on x64 (Length, RootDirectory, ObjectName, Attributes, SecurityDescriptor, SecurityQualityOfService); attributes OBJ_INHERIT 0x2, OBJ_PERMANENT 0x10, OBJ_EXCLUSIVE 0x20, OBJ_CASE_INSENSITIVE 0x40, OBJ_OPENIF 0x80, OBJ_KERNEL_HANDLE 0x200, OBJ_FORCE_ACCESS_CHECK 0x400 (ntdef.h)"
rules:
  access_masks: "unnamed job, NULL attributes: desired 0 -> granted 0; QUERY -> 0x4; ASSIGN_PROCESS -> 0x1; JOB_OBJECT_ALL_ACCESS, MAXIMUM_ALLOWED and GENERIC_ALL -> 0x1f003f; GENERIC_READ -> 0x20004; GENERIC_WRITE -> 0x2000b; GENERIC_EXECUTE -> 0x120000; SYNCHRONIZE 0x100000; DELETE 0x10000; ACCESS_SYSTEM_SECURITY -> 0x1000000 (ambient: SeSecurityPrivilege enabled in the oracle token; with it disabled the call returns STATUS_PRIVILEGE_NOT_HELD); undefined bit 0x20 is granted 0x20 and 0x8000 is granted 0; all return STATUS_SUCCESS; the handle's type name is \"Job\", handle flags 0"
  attributes_unnamed: "on an unnamed job: OBJ_INHERIT -> handle flags 1; OBJ_CASE_INSENSITIVE, OBJ_KERNEL_HANDLE, OBJ_EXCLUSIVE, OBJ_OPENIF, OBJ_FORCE_ACCESS_CHECK succeed with flags 0; OBJ_PERMANENT -> STATUS_PRIVILEGE_NOT_HELD (0xC0000061); attribute value 0x80000000 -> STATUS_INVALID_PARAMETER; the OBJECT_ATTRIBUTES Length must be 48 exactly (0, 8, 40, 47, 49, 56: STATUS_INVALID_PARAMETER)"
  fresh: "a new job has 0 total and 0 active processes; two unnamed jobs are distinct objects"
  names: "creating \\BaseNamedObjects\\PolySecNtJobA: STATUS_SUCCESS; the same name again: STATUS_OBJECT_NAME_COLLISION (0xC0000035) and no handle; with OBJ_OPENIF: STATUS_OBJECT_NAME_EXISTS (0x40000000, a success code) and a handle to the same job (a limit set through the first handle reads back through it: ActiveProcessLimit 7); the same name in other case with OBJ_CASE_INSENSITIVE and OBJ_OPENIF: 0x40000000; without OBJ_CASE_INSENSITIVE the upper-case and lower-case spellings are other names and create new jobs (STATUS_SUCCESS, with or without OBJ_OPENIF); after all handles are closed the name is free again (STATUS_SUCCESS). (Session 0 of the oracle: \\BaseNamedObjects is the local namespace.)"
  name_errors: "a missing directory (\\BaseNamedObjects\\PolySecNtNoDir\\x) and a name ending in a backslash: STATUS_OBJECT_PATH_NOT_FOUND (0xC000003A); a relative name without a root directory: STATUS_OBJECT_PATH_SYNTAX_BAD (0xC000003B); the directory name \\BaseNamedObjects itself: STATUS_OBJECT_TYPE_MISMATCH (0xC0000024); an empty (length 0) name: STATUS_SUCCESS (an unnamed job); the name of an existing event (with or without OBJ_OPENIF): STATUS_OBJECT_TYPE_MISMATCH"
  root_directory: "with RootDirectory = a handle of \\BaseNamedObjects (opened with NtOpenDirectoryObject): the relative name PolySecNtJobB creates the job; opening \\BaseNamedObjects\\PolySecNtJobB with OBJ_OPENIF returns 0x40000000 (the same job); an absolute name together with a root directory: STATUS_OBJECT_PATH_SYNTAX_BAD; a garbage root directory handle with a relative name: STATUS_INVALID_HANDLE"
errors:
  see_rules: "all other statuses are listed in the rules"
side_effects: "none beyond the rules above"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
