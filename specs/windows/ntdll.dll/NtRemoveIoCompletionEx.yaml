# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/NtRemoveIoCompletionEx.yaml
id: windows/api/ntdll.dll/NtRemoveIoCompletionEx
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station), two runs each with identical output, each run in a fresh scratch directory; tests that need a second process start their own image again with CreateProcessW and a --child argument"
  observed_by: spec-win-ipc
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: GetQueuedCompletionStatusEx function, OVERLAPPED_ENTRY structure, QueueUserAPC function. Constants and layouts from winbase.h, winerror.h, fileapi.h, ioapiset.h, namedpipeapi.h, minwinbase.h and winnt.h. Wine's tests were not read for the values here.
summary: >
  Removes up to count packets in one call into FILE_IO_COMPLETION_INFORMATION records (key, APC context, IO_STATUS_BLOCK; 32 bytes each), with a timeout and an alertable option. An alertable wait with a queued user APC runs it and returns STATUS_USER_APC.
interface:
  signature: "NTSTATUS NtRemoveIoCompletionEx(HANDLE port, PFILE_IO_COMPLETION_INFORMATION info, ULONG count, PULONG removed, PLARGE_INTEGER timeout, BOOLEAN alertable)"
rules:
  records: "each record is key (8), APC context (8), the IO_STATUS_BLOCK (status 4 + 4 padding, information 8) = 32 bytes."
  batch: "five packets taken with a 3-record buffer, then 2: STATUS_SUCCESS, removed 3 then 2, records in queue order with the values as set."
  timeout: "empty port: STATUS_TIMEOUT at once with a zero timeout; about 100 ms for a relative -1,000,000."
  blocking: "with a NULL timeout the call returns when another thread sets a packet (removed 1, the key as set)."
  alertable: "non-alertable wait with a queued APC: STATUS_TIMEOUT, the APC has not run; alertable: the APC runs and the call returns STATUS_USER_APC (0xC0) with nothing removed; empty again: STATUS_TIMEOUT; with a packet and an APC both waiting, the packet is returned first (STATUS_SUCCESS, removed 1) and the APC runs in the next alertable call."
  real_io: "a read completing: key = the handle's key, APC context = the OVERLAPPED pointer, status 0, information = bytes; a failed read: status STATUS_PIPE_BROKEN."
errors:
  count_zero: "STATUS_INVALID_PARAMETER (0xC000000D)"
  not_a_port: "STATUS_OBJECT_TYPE_MISMATCH for an event; STATUS_INVALID_HANDLE for a bad value"
  user_apc: "STATUS_USER_APC (0xC0)"
side_effects: "removes the packets"
threading: "handles and objects may be used from any thread; see the rules for per-thread behaviour"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle, except where the call waits"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing kernel32.dll by name (a few import ntdll.dll). Each file carries its own declarations (Learn prototypes, winerror.h/winbase.h constants). Pipe names are \\.\pipe\poly-ipc-<test>-<process id in hex>, so runs do not collide. Observations are error codes, counts, bytes and booleans, never handles, process ids or times; timing appears only as coarse envelopes ("waited at least N ms", "woke in under N ms"). A test that needs a second process starts its own image with CreateProcessW and the arguments --child <mode>; the child reports through its exit code. Every blocking call is bounded by a helper thread, a poll or a timeout, so a failing implementation fails a check instead of hanging.
not_covered: >
  Named I/O completion ports (object names), file handles associated through NtSetInformationFile(FileCompletionInformation), non-pipe files, remote pipes, security descriptors.
