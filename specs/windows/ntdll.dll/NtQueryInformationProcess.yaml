# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/NtQueryInformationProcess.yaml
id: windows/api/ntdll.dll/NtQueryInformationProcess
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-4
  date: 2026-11-15
  peb_rules: "the basic_child and peb_0x2d8_* rules and test pbi_peb were added by spec-chrome-win-s2c on 2026-11-15 on the same machine and build; the Chrome values of peb_0x2d8_chrome were read from Chrome for Testing 157.0.8103.38's running processes on the owner's PC (Windows 11 Enterprise, build 26200, interactive session) and from Poly's call tracer"
  handle_list_rules: "the handle_list_* rules (class 0x3a) and the tests h58_lists, h58_entries, h58_child, h58_locked were added by spec-chrome-win-s2d on 2026-11-16 on the same machine and build (session 0, two identical runs); the 32-bit caller and the running Chrome for Testing 157.0.8103.38 processes were observed on the owner's PC (Windows 11 Enterprise, build 26200, interactive session) with one-off probes, as data only"
sources: >
  Observations of our own test programs on the machine above (and, for the MSYS2 calls, the API trace of PortableGit 2.56.1's sh.exe and msys-2.0.dll made with the repository's trace kit: only the calls the runtime makes into kernel32 and ntdll, with their arguments and results; no Microsoft or MSYS2 code was read). Microsoft Learn for the documented calls named in each sheet; constants and layouts from winnt.h, winbase.h, winternl.h, ntstatus.h, winerror.h, ntsecapi.h, stdio.h. The PEB rules: our own test programs, and Chrome's running processes read from outside as data (ReadProcessMemory, VirtualQueryEx; no code bytes); winternl.h lays out the PEB only up to SessionId at offset 0x2c0 on x64, so the pointer-sized field at 0x2d8 has no public name and is described by what it holds. See specs/windows/apps/chrome/s2-interception.md. Class 0x3a (58): our own test programs (self, a suspended and a running child, a child with a restricted token, a Low-integrity token, both, and an AppContainer token), a 32-bit PowerShell process as the WOW64 caller, and Chrome for Testing's running browser, crash handler, GPU and utility processes queried from outside (the count of handles and the types NtQueryObject names for them; nothing else read). No public SDK header names class 0x3a: winternl.h (Windows Kit 10.0.26100.0) ends its PROCESSINFOCLASS at 29 and Learn's NtQueryInformationProcess page documents only a few classes. Third-party documentation (Process Hacker's phnt headers, MIT; the ntdoc site) names it ProcessHandleTable ("ULONG[]", since Windows 8.1), Wine's bug 53983 and Wine's winternl.h merge request use the same name, and the published sources of Chromium's sandbox show a target-side handle closer (HandleCloserAgent::CloseHandles, which asks for the process's handles through a helper, GetCurrentProcessHandles) that lowers a child's handle table after the token is lowered; those sources were read for behaviour only, nothing was copied.
summary: >
  Queries the current process (or a handle with the right to query): the classes programs use, with their exact length rules. Class 24 (ProcessSessionInformation, 4 bytes: the session id) is what the MSYS2 runtime asks for at start-up; Poly answers STATUS_INVALID_INFO_CLASS today. Class 0x3a (58, "ProcessHandleTable" in third-party headers, no public name) lists the process's open handle values: it is what Chrome's sandboxed children ask for (with a 0x1068-byte buffer) right after they lower their token, and a child that gets STATUS_INVALID_INFO_CLASS ends itself with exit code 0x1b62.
interface:
  signature: "NTSTATUS NtQueryInformationProcess(HANDLE process, PROCESSINFOCLASS class, PVOID info, ULONG length, PULONG returnLength)"
rules:
  basic_information: "class 0 with 48 bytes: success, returned length 48; exit status 0x103 (STILL_ACTIVE), PEB pointer non-zero, UniqueProcessId equals the process id, InheritedFromUniqueProcessId non-zero, BasePriority 8; length 64 is accepted too (returned length 64); lengths 0, 8, 47 and 49 give STATUS_INFO_LENGTH_MISMATCH (0xC0000004) and the returned length is left unchanged."
  session: "class 24 with exactly 4 bytes: success, returned length 4, the value is the process's session id (equal to ProcessIdToSessionId); any other length (0, 1, 3, 5, 8): 0xC0000004 with the returned length unchanged."
  classes_that_work: "success with exact lengths: 2 IoCounters 48, 4 Times 32, 7 DebugPort 8 (value 0), 12 DefaultHardErrorMode 4, 18 PriorityClass 2, 20 HandleCount 4 (at least 4), 21 AffinityMask-sized 8, 22 4, 26 Wow64Information 8 (value 0 for a 64-bit process), 29 BreakOnTermination 4, 31 DebugFlags 4 (value 1), 33 IoPriority 4, 34 ExecuteFlags 4, 36 4, 37 ImageInformation 64; 27 ImageFileName with a 512-byte buffer: success, a UNICODE_STRING whose buffer lies inside the same buffer and ends in '.exe', returned length covers the string."
  other_statuses: "class 30 DebugObjectHandle: 0xC0000353 (STATUS_PORT_NOT_SET) with returned length 8; classes 1 (40 bytes), 3 (128 and 144 bytes): 0xC0000004; classes 5, 6, 8, 9: 0xC0000003 (STATUS_INVALID_INFO_CLASS); class 32: 0xC000000D; classes 127 and 65535: 0xC0000003. The returned length is untouched whenever the status is an error other than 0xC0000353."
  access: "a process handle with PROCESS_QUERY_LIMITED_INFORMATION (0x1000) or PROCESS_QUERY_INFORMATION (0x400): classes 0, 24 and 27 succeed; a handle with only SYNCHRONIZE: 0xC0000022 (STATUS_ACCESS_DENIED)."
  basic_child: "class 0 on a child created suspended (the handle CreateProcessW returned): success, 48, PebBaseAddress non-NULL, UniqueProcessId = the child's id, InheritedFromUniqueProcessId = the caller's id"
  peb_0x2d8_normal: "the 8 bytes at PebBaseAddress + 0x2d8 hold a pointer to a region that VirtualQuery(Ex) reports as MEM_PRIVATE, MEM_COMMIT, PAGE_READWRITE, allocation protection PAGE_READWRITE, region size 0x2000, starting at the pointer, which is also its allocation base; its first 64 bytes are zero. True for the process itself and for a child that is still suspended right after CreateProcessW (the region exists before the child runs any code)"
  peb_0x2d8_cleared: "a parent writes 8 zero bytes at the suspended child's PebBaseAddress + 0x2d8 (WriteProcessMemory succeeds, 8 bytes) and resumes it: the child reads 0 there at its start, loads version.dll with LoadLibraryW successfully, still reads 0 afterwards and exits normally with its own code; a child left alone reads a non-zero pointer there"
  peb_0x2d8_chrome: "Chrome's broker writes 8 zero bytes at PEB + 0x2d8 of its storage service and renderer targets before they run (Poly's tracer); on Windows those processes are found with 0 there, the browser, crash handler, GPU process and network service with a pointer to a private 8 KiB read-write region as in peb_0x2d8_normal. Nothing a test could see depends on the value"
  bad_arguments: "NULL handle: 0xC0000008 (STATUS_INVALID_HANDLE); the thread pseudo-handle: 0xC0000024 (STATUS_OBJECT_TYPE_MISMATCH); NULL buffer: 0xC0000005; a NULL returned-length pointer is accepted (0)."
  handle_list_name: "class 0x3a (58) has no name in the public headers (winternl.h stops at 29, Learn documents a handful of classes); third-party documentation calls it ProcessHandleTable. Describe it by its number"
  handle_list_layout: "the output is a plain array of 4-byte values (ULONG, little endian), no header or count: one value per open handle of the process, in strictly ascending order, every value a non-zero multiple of 4 (the handle values the process itself uses). The number of entries always equals ProcessHandleCount (class 20) at the same moment, for any kind of object: events, semaphores, mutexes, waitable timers, sections, files and pipe ends, registry keys, threads, processes, jobs, I/O completion ports and tokens are all listed, and every listed value answers NtQueryObject(ObjectTypeInformation) with the type name (Event, Semaphore, Mutant, Timer, Section, File, Key, Thread, Process, Job, IoCompletion, Token; a pipe end is File). Pseudo-handles are never listed"
  handle_list_lengths: "a buffer length below 4 (0, 1, 2, 3): 0xC0000004 STATUS_INFO_LENGTH_MISMATCH, the returned length is left unchanged, nothing is written. From 4 up: STATUS_SUCCESS, never STATUS_BUFFER_OVERFLOW or a length mismatch for a buffer that is too small: as many whole 4-byte entries as fit are written (the first ones: the list is cut at the end), the returned length is the number of bytes written (4 x min(entries, length / 4): length 4 -> 4, 5, 6, 7 -> 4, 8 -> 8, 9 -> 8, 13 -> 12) and bytes after them are untouched. A buffer of exactly 4 x entries, or any larger one, gets the whole list and 4 x entries as the returned length; a caller cannot learn the needed size from the returned length of a short buffer (ask ProcessHandleCount, or use a large buffer). The returned length pointer may be NULL"
  handle_list_changes: "the list is the table at the moment of the call: a new handle (any object kind, also a duplicate in the same process, an inherited one, one that is protected from close, one that is inheritable or not) adds one entry whose value is the one the creating call returned; a closed handle removes its entry and the count returns to what it was. A closed handle's value is handed out again later: making new handles until one has the closed value succeeds within a few hundred (a browser sandbox's handle closer refills the slot this way), and the value is listed again. The runtime may open a handle of its own the first time a registry key or a pipe is used in a process (the count rises by one and stays): count against a baseline taken after the first use. A real handle to the process that is used for the query is itself listed (DuplicateHandle of the pseudo-handle: one more entry than before it was made, the handle used is in the list)"
  handle_list_arguments: "the buffer must be 4-byte aligned: a buffer at an address that is not a multiple of 4 gives 0x80000002 STATUS_DATATYPE_MISALIGNMENT (offsets 1, 2, 3, 5, 6, 7 of an 8-byte block; offsets 4 and 0 work); a NULL buffer with length 0 is 0xC0000004 and with length 8 is 0xC0000005; an unmapped buffer is 0xC0000005; an unmapped returned length pointer 0xC0000005; the thread pseudo-handle and an event handle 0xC0000024 STATUS_OBJECT_TYPE_MISMATCH; a NULL handle and a closed handle value 0xC0000008 STATUS_INVALID_HANDLE. The returned length of every failing call is left unchanged"
  handle_list_access: "a handle of another process needs both PROCESS_QUERY_INFORMATION (0x400) and PROCESS_DUP_HANDLE (0x40) together: 0x440, 0x450, 0x1440, 0x100440 and PROCESS_ALL_ACCESS succeed; 0x400, 0x40, 0x1000, 0x1040 (QUERY_LIMITED_INFORMATION with DUP_HANDLE), 0x1400, 0x410, 0x20, 0x8, 0x100000 and the like give 0xC0000022 STATUS_ACCESS_DENIED with the returned length unchanged. The handle CreateProcessW returns (every right) works, also for a child that is still suspended (its list is short but non-empty and well formed, as many entries as its ProcessHandleCount). An inheritable handle of the parent that the child inherited is listed in the child's list under the same value it has in the parent. A process that has ended (the handle was opened before or comes from CreateProcessW) answers 0xC000010A STATUS_PROCESS_IS_TERMINATING and writes 0 to the returned length. The caller's own pseudo-handle -1 needs no rights"
  handle_list_lowered: "nothing changes after the token is lowered. A child started with a restricted token (restricting SIDs, DISABLE_MAX_PRIVILEGE), with a Low-integrity token, with both, and inside an AppContainer (no capabilities) gets, through the pseudo-handle -1 and through a real handle to itself, exactly the answers above: STATUS_SUCCESS for lengths from 4 up, 0xC0000004 below 4, the whole list for a large buffer with as many entries as ProcessHandleCount, strictly ascending, the inherited report handle listed, every entry valid for NtQueryObject(ObjectTypeInformation), a handle made and closed appearing and disappearing, and the same for the 0x1068-byte buffer Chrome uses. The query is a read of the caller's own table, with no access check on the pseudo-handle. A 32-bit (WOW64) caller gets the same layout (4-byte entries, same lengths and statuses) for itself and for a 64-bit process it can open with 0x440 (observed with a one-off probe from 32-bit PowerShell; no test, the pipeline builds 64-bit programs only)"
  handle_list_chrome: "Chrome's sandboxed children (GPU, network and storage services, renderers) make this call on themselves right after the token is lowered, and a process that cannot answer it ends itself with exit code 0x1b62 (7010). The sequence seen in three traced Chrome processes on Poly with a faithful answer (Poly's own call trace; the same helper also runs in the browser): NtQueryInformationProcess(-1, class 20, 4 bytes) for the number of handles; then NtQueryInformationProcess(-1, 0x3a, buffer, length) with a buffer for about 1000 more entries than that count (0x1068 = 1050 entries for children with 52 handles; 0x11dc was seen in another process): the list always arrives whole; then, for every listed value in the order of the list, NtQueryObject(handle, ObjectTypeInformation (2), 0x80-byte buffer), repeated with the returned length when the status is 0xC0000004 (a long type name such as WaitCompletionPacket needs 0x82), and for the handles whose type the policy filters by name also NtQueryObject(handle, ObjectNameInformation (1), 0x200-byte buffer). A handle whose type matches is closed (published Chromium sandbox sources: it clears HANDLE_FLAG_PROTECT_FROM_CLOSE, calls CloseHandle, and for Event and File handles refills the freed slot by duplicating a dummy event until the same value comes back; the types to close are Chrome's policy). No NtClose followed in the three traced processes (either no listed handle had a type the policy closes, or Poly's type names differ from Windows': not established); the children went on (next registry key, events, threads) and ended normally. An all-zero list (Poly's first experiment answered 16 zero bytes) is accepted by the child too, which is why that experiment stopped the exit with 0x1b62 without being right. What the list needs: every value must answer NtQueryObject(ObjectTypeInformation), with the usual type names. On Windows the running processes of Chrome for Testing 157.0.8103.38 (an instrumented copy made with the repository's trace kit, so a few handles more than the original) hold: browser about 1100-1400 handles, crash handler 170-190, network service 185, storage service 250, GPU process 280 (read from outside with access 0x440, each count equal to ProcessHandleCount), of the types ALPC Port, Directory, Event, File, IoCompletion, IRTimer, Key, Mutant, Process, Section, Semaphore, SchedulerSharedData, Thread, TpWorkerFactory and WaitCompletionPacket (the GPU process and the crash handler also Desktop and WindowStation): the sandbox leaves many handles of all those types open, and a closer acts on a handful of them"
errors:
  length: "0xC0000004 STATUS_INFO_LENGTH_MISMATCH"
  bad_class: "0xC0000003 STATUS_INVALID_INFO_CLASS"
  no_right: "0xC0000022 STATUS_ACCESS_DENIED"
  bad_handle: "0xC0000008 / 0xC0000024"
side_effects: "none"
threading: "any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: none
tests:
  visible: 13
  held_out: 5
building_tests: >
  Rust tests (ADR 0075), one file per test, importing the DLLs named by the sheet by name. Observations are statuses, error codes, counts and offsets; never addresses, handles, process or thread ids, file names or times. Tests that need a process to survive a fault run the case in a child process of the same image (--child <case>) whose exit code is the answer (0x6000_0000 | status: the call returned; otherwise the exception code). Each test is kept in three files that make the same calls and write every third observation line, so one test serves as visible and held-out tests.
not_covered: >
  Classes above 37 except where listed (class 0x3a is covered by the handle_list_* rules), other processes' handles (except class 0 of a suspended child and class 0x3a), what the region at PEB + 0x2d8 is used for, classes that need privileges, 32-bit processes (class 0x3a from a 32-bit caller was only probed, see handle_list_lowered), the contents of the handle list of processes of other users or sessions, what a handle closer does with each type besides the listing (the types Chrome closes are Chrome's policy, not this call's).
