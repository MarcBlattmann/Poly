# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/ntdll.dll/NtSetInformationToken
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled. Prototype: the arguments
  of the Win32 function that wraps this call map one to one (Microsoft Learn
  documents the Zw form for some of them); where Learn has no page for the
  Nt name the signature here is worked out from the Win32 function and the
  observations, not from a document.
summary: >
  Changes a settable token class: the owner, the primary group, the default
  DACL, virtualization, the integrity level (lowering only) and, with
  privileges, the session id, UI access, mandatory policy and origin. The
  length must match the class exactly. SetTokenInformation calls it with the
  same arguments.
interface:
  signature: "NTSTATUS NtSetInformationToken(HANDLE TokenHandle, TOKEN_INFORMATION_CLASS TokenInformationClass, PVOID TokenInformation, ULONG TokenInformationLength)"
  statuses: "NTSTATUS values seen (ntstatus.h): STATUS_SUCCESS 0x00000000, STATUS_NOT_ALL_ASSIGNED 0x00000106 (a success code), STATUS_OBJECT_NAME_EXISTS 0x40000000 (success), STATUS_BUFFER_OVERFLOW 0x80000005, STATUS_INVALID_INFO_CLASS 0xC0000003, STATUS_INFO_LENGTH_MISMATCH 0xC0000004, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_INVALID_HANDLE 0xC0000008, STATUS_INVALID_PARAMETER 0xC000000D, STATUS_ACCESS_DENIED 0xC0000022, STATUS_BUFFER_TOO_SMALL 0xC0000023, STATUS_OBJECT_TYPE_MISMATCH 0xC0000024, STATUS_PRIVILEGE_NOT_HELD 0xC0000061. RtlNtStatusToDosError maps 0xC0000022 to 5, 0xC0000008 and 0xC0000024 to 6 and 0xC000000D to 87. Also STATUS_INVALID_OWNER 0xC000005A, STATUS_INVALID_PRIMARY_GROUP 0xC000005B, STATUS_INVALID_ACL 0xC0000077, STATUS_INVALID_LABEL 0xC0000446."
rules:
  virtualization: "TokenVirtualizationEnabled (24) with 4 bytes and values 0, 1, 7 returns STATUS_SUCCESS but reads back 0 afterwards (virtualization is not allowed on the oracle token); the right TOKEN_ADJUST_DEFAULT is enough (TOKEN_QUERY, TOKEN_DUPLICATE, TOKEN_ADJUST_SESSIONID, TOKEN_ADJUST_PRIVILEGES and READ_CONTROL|WRITE_DAC alone give STATUS_ACCESS_DENIED)"
  privileged: "TokenVirtualizationAllowed (23), TokenSessionId (12), TokenUIAccess (26), TokenMandatoryPolicy (27) with values 0 or 1 and TokenOrigin (17) with 8 bytes return STATUS_PRIVILEGE_NOT_HELD (0xC0000061)"
  read_only: "TokenSandBoxInert (15), TokenType (8), TokenElevationType (18), TokenHasRestrictions (21), TokenUser (1) and classes 0 and 99 return STATUS_INVALID_INFO_CLASS (0xC0000003); TokenOrigin with 4 bytes returns STATUS_INFO_LENGTH_MISMATCH"
  lengths: "TokenVirtualizationEnabled with length 0, 1, 3, 5, 8 or 16 returns STATUS_INFO_LENGTH_MISMATCH (0xC0000004); only 4 is accepted"
  owner_primary_group: "TokenOwner accepts the user SID and groups with SE_GROUP_OWNER (here Administrators); Users, Everyone, Authenticated Users, SYSTEM, Guests (S-1-5-32-546) and an integrity SID return STATUS_INVALID_OWNER (0xC000005A) and the owner stays S-1-5-32-544. TokenPrimaryGroup accepts any group the token has (Administrators, Users, Everyone, Authenticated Users, one after the other); SYSTEM, Guests (S-1-5-32-546) and an integrity SID return STATUS_INVALID_PRIMARY_GROUP (0xC000005B). Both structures are 8 bytes: lengths 0, 4 and 7 return STATUS_INFO_LENGTH_MISMATCH, lengths 9 and 16 are accepted"
  default_dacl: "a two-ACE ACL reads back byte for byte (query length 1032 = 8 + the 1024-byte ACL given, ACE count 2); lengths 0, 4, 7 return STATUS_INFO_LENGTH_MISMATCH, 9 is accepted; a NULL ACL is accepted (reads back length 8 with a NULL pointer); an ACL with revision 9 returns STATUS_INVALID_ACL (0xC0000077)"
  integrity: "lowering to Medium (0x2000), Low (0x1000), Untrusted (0), an odd RID 5000 (0x1388) and \"lowering\" to the same High level succeed and read back; raising (System 0x4000, or back up any step) returns STATUS_PRIVILEGE_NOT_HELD; attributes 0, SE_GROUP_INTEGRITY|SE_GROUP_INTEGRITY_ENABLED and SE_GROUP_ENABLED with a valid integrity SID are all accepted; S-1-5-18 as the label returns STATUS_INVALID_LABEL (0xC0000446); the TOKEN_MANDATORY_LABEL length must be at least 16: 0, 8 and 15 return STATUS_INFO_LENGTH_MISMATCH, 16 up to 36 (SID of 12 bytes) succeed; mandatory policy stays 3; TOKEN_ADJUST_DEFAULT is needed (TOKEN_QUERY, TOKEN_ADJUST_PRIVILEGES: STATUS_ACCESS_DENIED); works on impersonation tokens too"
  check_order: "the class is judged first, then the handle's rights, then the length, then the privilege: an unknown or read-only class (99, 8) is STATUS_INVALID_INFO_CLASS through any handle; through a handle without TOKEN_ADJUST_DEFAULT (TOKEN_QUERY alone, TOKEN_ADJUST_SESSIONID alone, TOKEN_ADJUST_PRIVILEGES|TOKEN_ADJUST_GROUPS) the classes 12, 17, 23, 24, 26 and 27 return STATUS_ACCESS_DENIED at any length, never STATUS_PRIVILEGE_NOT_HELD; TokenSessionId (12) needs TOKEN_ADJUST_SESSIONID as well (TOKEN_ADJUST_DEFAULT alone: STATUS_ACCESS_DENIED); with the rights a wrong length is STATUS_INFO_LENGTH_MISMATCH and the right length STATUS_PRIVILEGE_NOT_HELD for 12, 17, 23 and 27. Observed beside this and not explained by rule \"privileged\": TokenUIAccess (26) with a 4-byte 0 returned STATUS_SUCCESS through TOKEN_ADJUST_DEFAULT on a token whose UIAccess is 0"
errors:
  handles: "NULL: STATUS_INVALID_HANDLE; the process pseudo-handle and an event: STATUS_OBJECT_TYPE_MISMATCH"
side_effects: "none beyond the rules above"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
