# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/ntdll.dll/NtOpenThreadToken
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled. Prototype: the arguments
  of the Win32 function that wraps this call map one to one (Microsoft Learn
  documents the Zw form for some of them); where Learn has no page for the
  Nt name the signature here is worked out from the Win32 function and the
  observations, not from a document.
summary: >
  Opens the impersonation token of a thread (the thread pseudo-handle -2 is
  the caller). A thread without a token gives STATUS_NO_TOKEN. OpenAsSelf
  FALSE does the access check against the thread's impersonated identity,
  TRUE against the process token.
interface:
  signature: "NTSTATUS NtOpenThreadToken(HANDLE ThreadHandle, ACCESS_MASK DesiredAccess, BOOLEAN OpenAsSelf, PHANDLE TokenHandle)"
  statuses: "NTSTATUS values seen (ntstatus.h): STATUS_SUCCESS 0x00000000, STATUS_NOT_ALL_ASSIGNED 0x00000106 (a success code), STATUS_OBJECT_NAME_EXISTS 0x40000000 (success), STATUS_BUFFER_OVERFLOW 0x80000005, STATUS_INVALID_INFO_CLASS 0xC0000003, STATUS_INFO_LENGTH_MISMATCH 0xC0000004, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_INVALID_HANDLE 0xC0000008, STATUS_INVALID_PARAMETER 0xC000000D, STATUS_ACCESS_DENIED 0xC0000022, STATUS_BUFFER_TOO_SMALL 0xC0000023, STATUS_OBJECT_TYPE_MISMATCH 0xC0000024, STATUS_PRIVILEGE_NOT_HELD 0xC0000061. RtlNtStatusToDosError maps 0xC0000022 to 5, 0xC0000008 and 0xC0000024 to 6 and 0xC000000D to 87. Also STATUS_NO_TOKEN 0xC000007C, STATUS_BAD_IMPERSONATION_LEVEL 0xC00000A5, STATUS_CANT_OPEN_ANONYMOUS_SECURITY_TOKEN 0xC00000A6."
rules:
  no_token: "a thread with no token (the caller before impersonating or after SetThreadToken(NULL, NULL), or a fresh suspended thread of this process) returns STATUS_NO_TOKEN (0xC000007C) for every mask (QUERY, 0, MAXIMUM_ALLOWED, ALL_ACCESS) with OpenAsSelf 0 and 1; a thread handle with only THREAD_QUERY_LIMITED_INFORMATION (0x800), THREAD_QUERY_INFORMATION (0x40) or THREAD_ALL_ACCESS gets the same; with only THREAD_SET_THREAD_TOKEN (0x80), SYNCHRONIZE or access 0 it gives STATUS_ACCESS_DENIED"
  impersonation_levels: "impersonating a token of level Impersonation (2) or Delegation (3): QUERY gives a handle of type 2 granted 0x8, MAXIMUM_ALLOWED and TOKEN_ALL_ACCESS 0xf01ff, mask 0 STATUS_ACCESS_DENIED, identically for OpenAsSelf 0 and 1; the level read from the opened token is 2 or 3"
  identification: "level Identification (1): OpenAsSelf FALSE returns STATUS_BAD_IMPERSONATION_LEVEL (0xC00000A5) for every mask; OpenAsSelf TRUE succeeds (QUERY granted 0x8, MAXIMUM_ALLOWED and ALL_ACCESS 0xf01ff, mask 0 STATUS_ACCESS_DENIED), the opened token has level 1"
  anonymous: "level Anonymous (0): STATUS_CANT_OPEN_ANONYMOUS_SECURITY_TOKEN (0xC00000A6) for every mask and both OpenAsSelf values"
  other_threads: "with an impersonation token set on another thread of the process (SetThreadToken with the thread handle), handles with THREAD_QUERY_LIMITED_INFORMATION, THREAD_QUERY_INFORMATION or THREAD_ALL_ACCESS open it (level 2, granted 0x8); handles with only THREAD_SET_THREAD_TOKEN, SYNCHRONIZE or access 0 give STATUS_ACCESS_DENIED"
errors:
  wrong_type: "an event handle and the process pseudo-handle: STATUS_OBJECT_TYPE_MISMATCH"
  invalid: "NULL and a closed handle: STATUS_INVALID_HANDLE"
side_effects: "none beyond the rules above"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
