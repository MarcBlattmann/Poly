summary: >
  Removes a registration made by LdrRegisterDllNotification. No tests of its own: the tests of LdrRegisterDllNotification call it.
same_as: "windows/api/ntdll.dll/LdrRegisterDllNotification"
interface:
  signature: "NTSTATUS NTAPI LdrUnregisterDllNotification(PVOID cookie)"
rules:
  results: "STATUS_SUCCESS for a live cookie, after which the callback is not called any more; 0xC0000135 (STATUS_DLL_NOT_FOUND) for a cookie that was already unregistered, NULL or a made-up value"
