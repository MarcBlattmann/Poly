# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/Stack.Reservation.yaml
id: windows/api/ntdll.dll/Stack.Reservation
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests (64-bit, and 32-bit ones that run under WOW64) run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The 64-bit tests were also run (outside the record) on a second machine, Windows 11 build 26200, and gave the same output."
  observed_by: spec-win-stack-roundrect
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, 64-bit and 32-bit (under WOW64): the layout of a thread's stack allocation read with VirtualQuery before and after one first touch, exceptions caught with a vectored exception handler that resumes the thread at a recovery point, and child processes for the cases that end the process. Microsoft Learn: "VirtualQuery", "MEMORY_BASIC_INFORMATION", "Memory Protection Constants" (PAGE_GUARD), "CreateThread" (STACK_SIZE_PARAM_IS_A_RESERVATION), "SetThreadStackGuarantee", "GetCurrentThreadStackLimits", "AddVectoredExceptionHandler", "_resetstkoflw", "Thread Stack Size", "Creating Guard Pages"; ntstatus.h (STATUS_STACK_OVERFLOW 0xC00000FD, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_GUARD_PAGE_VIOLATION 0x80000001), winnt.h (EXCEPTION_RECORD, CONTEXT, NT_TIB). Where Microsoft documents a guard page of one page the observed region is larger (3 pages in a 64-bit process, 2 pages in a 32-bit one); the sheet gives what was observed. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  The stack a new thread gets from the size passed to CreateThread (a reservation with STACK_SIZE_PARAM_IS_A_RESERVATION, or the initial commit without it) and from RtlCreateUserThread (reservation and commit together): the number of pages of the allocation, the guard pages, the committed pages, and what the thread information block and GetCurrentThreadStackLimits say about the stack. Reservations are rounded up to 64 KiB; the size 0 and the size of one page give the program file's default reservation (1 MiB in the test programs); a commit as large as the reservation raises the reservation; the guard region exists only when it fits.
interface:
  signature: "behaviour of the memory manager for a thread's stack allocation (no function): the pages of the allocation (VirtualQuery), accesses to them, the exceptions raised"
chrome: "Chrome's video decoder threads (and any code with large stack frames that skip the stack probe) touch a stack page below the guard page they are about to reach without touching the guard page first. On Windows that works when the page lies inside the thread's guard region (see rules); on Poly the first version raised an access violation (#453 covers 8 KiB). These sheets give the exact rules for 64-bit and 32-bit programs."
rules:
  rounding: "CreateThread with the reservation flag: a size of 0, 1 and 4096 gives the program file's default (256 pages = 1 MiB in these programs); 4097, 8191, 8192, 12288, 16383 and 16384 give 64 KiB (16 pages); 64 KiB - 1 and 64 KiB give 16 pages; 64 KiB + 1 and 100000 give 32 pages (128 KiB); 256 KiB gives 64 pages; 1 MiB gives 256; 1 MiB + 4096 gives 272 (1 MiB + 64 KiB); 3 MiB gives 768; 16 MiB gives 4096; 256 MiB gives 65536. So a reservation is rounded up to a multiple of 64 KiB (the allocation granularity), and values up to one page are the default"
  guard_pages: "each of these stacks has N guard pages (3 in a 64-bit process, 2 in a 32-bit one) in one region just below its committed pages, and at least one committed page; CreateThread without the flag (dwStackSize = initial commit): 4096, 4097, 20000, 64 KiB and 256 KiB give the default 256 pages with the guard region"
  commit_too_large: "a commit as large as the default reservation (1 MiB) gives 256 pages with 0 guard pages (every page committed); a commit of 2 MiB gives a reservation of 512 pages (the commit rounded up) with 0 guard pages"
  native: "RtlCreateUserThread(reserve, commit): reserve 1 MiB commit 64 KiB gives 256 pages, N guard pages and 16 committed pages without the guard; commit 4096, 1 or 0 gives a few committed pages; reserve 0 means the default (commit 64 KiB: 256 pages, 16 committed); reserve 256 KiB with commit 256 KiB or 512 KiB raises the reservation to the default 256 pages (the commit is kept: 64 and 128 committed pages); reserve 16 MiB commit 1 MiB gives 4096 pages and 256 committed; reserve 1 GiB works (262144 pages); reserve 4096 gives the default 256 pages; 8192, 12288, 16384 and 65536 give 16 pages; 65537 and 100000 give 32 pages; reserve 3 MiB gives 768"
  guard_fits: "the guard region is made only when the committed pages plus N guard pages fit into the allocation: reserve 256 KiB (64 pages): commit 244 KiB, 240 KiB and 236 KiB (61, 60, 59 pages) have 3 guard pages in a 64-bit process; commit 248 KiB (62 pages) has 0 in a 64-bit process and 2 in a 32-bit one; commit 252 KiB (63 pages) has no guard page in either (63 committed, one reserved page); for a commit of C pages the region is there iff C + N <= the pages of the allocation"
  tib: "the thread information block: StackBase (gs:[8] in a 64-bit process, fs:[4] in a 32-bit one) is the end of the allocation; StackLimit (gs:[0x10], fs:[8]) is the start of the lowest page that is committed without the guard flag (right under the guard region at the start; after a growth step into the lower guard pages it stays the start of that lowest ordinary page, which can lie below a part of the guard region); DeallocationStack (gs:[0x1478], fs:[0xE0C]) is the start of the allocation"
  limits: "GetCurrentThreadStackLimits gives the start of the allocation as the low limit and the end of the allocation as the high limit, before and after growth steps"
errors:
  invalid: "RtlCreateUserThread: no case of the tests failed (a commit larger than the reservation raises the reservation instead)"
side_effects: "pages of the stack allocation change from reserved to committed (with or without the guard flag); no other memory is touched"
threading: "per thread; the layout is read and changed only by the memory manager and by the thread's own accesses"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 4
  held_out: 2
building_tests: >
  Rust tests (ADR 0075): every test file exists twice, as a 64-bit program and as a 32-bit program (`_x86`, `// poly-arch: x86`, ADR 0259, run under WOW64). Each probe runs on a new thread (CreateThread or RtlCreateUserThread) whose stack is described, or in a child process (`--child ...`) when the probe can end the process. Observations are exception names, parameters, counts of pages that changed between the reserved, guard and committed state, and booleans; never addresses or the absolute number of committed pages (the first stack frames of a thread are at a randomised offset). Before a probe the thread commits and gives back about 20 KiB of stack, so that the exception dispatch of the probe does not itself grow the stack.
not_covered: >
  reservations of several GiB and the failure of a thread start for lack of address space or memory; the process-wide default (the program file's SizeOfStackReserve and SizeOfStackCommit, which a program can set); fibers and thread pool threads; the dwStackSize rounding of CreateThread for values above 256 MiB.
