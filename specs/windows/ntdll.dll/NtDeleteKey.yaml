# Spec sheet. Describes behaviour only: no code, no internals.
# Path: ntdll.dll/NtDeleteKey.yaml
id: windows/api/ntdll.dll/NtDeleteKey
oracle:
  os: 'Windows 11 Home 25H2 (build 26200.9974), x64'
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account "server" (member of Administrators) in the SSH logon session (session 0) with its elevated administrator token, in which SeBackupPrivilege and SeRestorePrivilege are already enabled; the *_std tests were recorded with -Token standard (the same account''s filtered token in its interactive session). Every test ran at least twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: 'Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). Microsoft Learn''s pages for ZwOpenKeyEx, ZwQueryValueKey, ZwDeleteKey, ZwCreateKey, ZwSetValueKey, RtlFormatCurrentUserKeyPath and the KEY_VALUE_*_INFORMATION structures, "Registry Key Object Routines"; constants and status codes from wdm.h, ntdef.h and ntstatus.h. Chrome''s own setup.exe imports NtOpenKeyEx, NtQueryValueKey, NtDeleteKey, NtClose and RtlFormatCurrentUserKeyPath (survey-chrome-installer) and uses them to read and delete registry keys by their native path. Nothing of Windows, Wine or Google''s programs was read or disassembled.'
summary: 'Marks the key of a handle as deleted; it needs a handle opened with DELETE access and fails for a key that still has subkeys. The key is gone for new opens at once; the handles that are open on it stay valid but every operation on them fails with STATUS_KEY_DELETED.'
interface:
  signature: 'NTSTATUS NtDeleteKey(HANDLE KeyHandle)'
rules:
  subkeys: 'A key with a child: STATUS_CANNOT_DELETE (0xC0000121) and the key stays. After the child is deleted (0), the parent deletes (0).'
  deleted_handle: 'Through the handle of a key that was deleted: NtQueryValueKey, NtCreateKey (a subkey) and NtSetValueKey return STATUS_KEY_DELETED (0xC000017C); NtDeleteKey on it again returns STATUS_SUCCESS. Opening the deleted key by name (also while the old handle is still open) gives STATUS_OBJECT_NAME_NOT_FOUND (0xC0000034).'
  recreate: 'NtCreateKey of the same path while an old handle of the deleted key is open creates a new key (disposition 1); creating a key that exists returns disposition 2 (REG_OPENED_EXISTING_KEY).'
  access: 'A handle opened without DELETE (KEY_READ | KEY_SET_VALUE | KEY_CREATE_SUB_KEY): STATUS_ACCESS_DENIED (0xC0000022).'
  bad_handles: 'NtDeleteKey(NULL): STATUS_INVALID_HANDLE (0xC0000008); the pseudo handle -1: STATUS_OBJECT_TYPE_MISMATCH (0xC0000024).'
errors:
  cannot_delete: '0xC0000121'
  key_deleted: '0xC000017C'
  access_denied: '0xC0000022'
  invalid_handle: '0xC0000008'
  type_mismatch: '0xC0000024'
side_effects: 'the key is deleted when the last handle closes'
threading: 'may be called from any thread'
ordering: []
timing:
  typical: 'well under a millisecond per call on the oracle'
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: 'Rust tests (ADR 0075), one file per test; each declares the ntdll functions it calls from Learn''s prototypes. Keys the tests create are named PolySpecB4* below the current user''s key (\Registry\User\<sid>\Software), found with RtlFormatCurrentUserKeyPath, and are deleted by the test (a leftover of a crashed run is deleted first). The system keys they open (HKLM\SOFTWARE\Microsoft) are only read. Observations are status codes, lengths and structure fields; no SID is printed.'
not_covered: 'Symbolic links in the registry, transacted keys, key notification, access checks for users other than the administrator (only the standard token run of RtlFormatCurrentUserKeyPath), the layered-key information class beyond its failure, and values with names of 32 K characters.'
