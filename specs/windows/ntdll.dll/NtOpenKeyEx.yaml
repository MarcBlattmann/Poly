# Spec sheet. Describes behaviour only: no code, no internals.
# Path: ntdll.dll/NtOpenKeyEx.yaml
id: windows/api/ntdll.dll/NtOpenKeyEx
oracle:
  os: 'Windows 11 Home 25H2 (build 26200.9974), x64'
  machine: 'homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account "server" (member of Administrators) in the SSH logon session (session 0) with its elevated administrator token, in which SeBackupPrivilege and SeRestorePrivilege are already enabled; the *_std tests were recorded with -Token standard (the same account''s filtered token in its interactive session). Every test ran at least twice with identical output, each run in a fresh scratch directory'
  observed_by: spec-win-chrome-setup
  date: 2026-11-17
sources: 'Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). Microsoft Learn''s pages for ZwOpenKeyEx, ZwQueryValueKey, ZwDeleteKey, ZwCreateKey, ZwSetValueKey, RtlFormatCurrentUserKeyPath and the KEY_VALUE_*_INFORMATION structures, "Registry Key Object Routines"; constants and status codes from wdm.h, ntdef.h and ntstatus.h. Chrome''s own setup.exe imports NtOpenKeyEx, NtQueryValueKey, NtDeleteKey, NtClose and RtlFormatCurrentUserKeyPath (survey-chrome-installer) and uses them to read and delete registry keys by their native path. Nothing of Windows, Wine or Google''s programs was read or disassembled.'
summary: 'Opens an existing registry key by its native path (\Registry\Machine\..., \Registry\User\<sid>\...) or relative to a key handle, with the given access mask and open options. Name matching in the registry is always case-insensitive, with or without OBJ_CASE_INSENSITIVE.'
interface:
  signature: 'NTSTATUS NtOpenKeyEx(PHANDLE KeyHandle, ACCESS_MASK DesiredAccess, POBJECT_ATTRIBUTES ObjectAttributes, ULONG OpenOptions)'
rules:
  paths: '\Registry\Machine\SOFTWARE\Microsoft with KEY_READ: STATUS_SUCCESS and a handle. The same path in other case works with OBJ_CASE_INSENSITIVE and also without it. \Registry and \Registry\Machine open. A trailing backslash is accepted. A missing key or a missing parent: STATUS_OBJECT_NAME_NOT_FOUND (0xC0000034). An empty name and a name without the leading backslash, and a Win32 form (HKEY_LOCAL_MACHINE\SOFTWARE): STATUS_OBJECT_PATH_SYNTAX_BAD (0xC000003B).'
  access: 'MAXIMUM_ALLOWED and KEY_ALL_ACCESS on HKLM\SOFTWARE\Microsoft succeed for the elevated administrator. An access mask of 0: STATUS_ACCESS_DENIED (0xC0000022).'
  relative: 'With ObjectAttributes.RootDirectory a key handle and the name ''Software'', the key below the user''s key opens (0).'
  options: 'OpenOptions 0, REG_OPTION_BACKUP_RESTORE (4, with the privileges enabled in the session) and REG_OPTION_OPEN_LINK (8) succeed; 0x10 is ignored (0); REG_OPTION_VOLATILE (1), REG_OPTION_CREATE_LINK (2), 0x100 and 0xFFFFFFFF: STATUS_INVALID_PARAMETER (0xC00000F2). The attributes OBJ_OPENLINK (0x100), an unknown bit (0x1000), OBJ_KERNEL_HANDLE (0x200) and OBJ_INHERIT (2) are accepted (0).'
  bad_structures: 'A NULL object name: STATUS_ACCESS_VIOLATION (0xC0000005) is returned as the status (no exception). OBJECT_ATTRIBUTES.Length 8: STATUS_INVALID_PARAMETER (0xC000000D). A name length that is odd in bytes: STATUS_OBJECT_NAME_INVALID (0xC0000033).'
  ntopenkey: 'NtOpenKey (no options) gives the same results for the same key.'
  deleted: 'A key that was created, opened with DELETE and deleted with NtDeleteKey is not found afterwards (0xC0000034).'
errors:
  not_found: '0xC0000034'
  path_syntax_bad: '0xC000003B'
  access_denied: '0xC0000022'
  invalid_parameter: '0xC00000F2 (options), 0xC000000D (structure)'
  name_invalid: '0xC0000033'
side_effects: 'a handle is returned, to be closed with NtClose'
threading: 'may be called from any thread'
ordering: []
timing:
  typical: 'well under a millisecond per call on the oracle'
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: 'Rust tests (ADR 0075), one file per test; each declares the ntdll functions it calls from Learn''s prototypes. Keys the tests create are named PolySpecB4* below the current user''s key (\Registry\User\<sid>\Software), found with RtlFormatCurrentUserKeyPath, and are deleted by the test (a leftover of a crashed run is deleted first). The system keys they open (HKLM\SOFTWARE\Microsoft) are only read. Observations are status codes, lengths and structure fields; no SID is printed.'
not_covered: 'Symbolic links in the registry, transacted keys, key notification, access checks for users other than the administrator (only the standard token run of RtlFormatCurrentUserKeyPath), the layered-key information class beyond its failure, and values with names of 32 K characters.'
