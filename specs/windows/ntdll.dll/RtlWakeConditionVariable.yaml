# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/RtlWakeConditionVariable.yaml
id: windows/api/ntdll.dll/RtlWakeConditionVariable
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Microsoft Learn: Slim Reader/Writer (SRW) Locks, Condition Variables, One-Time Initialization, Critical Section Objects, InitOnceExecuteOnce / InitOnceBeginInitialize functions, SleepConditionVariableSRW / SleepConditionVariableCS, Using One-Time Initialization. Layouts and constants from winnt.h (RTL_SRWLOCK, RTL_CONDITION_VARIABLE, RTL_RUN_ONCE, RTL_CRITICAL_SECTION), ntstatus.h and winerror.h. Wine's tests and source were not read.
summary: >
  Wakes one thread sleeping on the condition variable (the one that has waited longest); a wake with nobody sleeping is lost. kernel32's WakeConditionVariable is the same function. The woken thread returns from its sleep only after it has taken its lock again.
interface:
  signature: "void RtlWakeConditionVariable(PRTL_CONDITION_VARIABLE cv)"
rules:
  one_waiter: "with three threads asleep (each started and in its sleep before the next), one wake lets exactly one return (a second one 300 ms later is still the only one), the second wake lets a second one return, a wake all the rest."
  order: "the waiters returned in the order they went to sleep (0, 1, 2)."
  lock_held: "the woken thread holds its lock when it returns (a try on it fails in that thread); with the waker holding the lock, nobody returns until the waker releases it (woken: 0 after 300 ms, then all)."
  lost_wake: "a wake or wake-all with no waiter is not remembered: a sleep started afterwards with a 200 ms timeout returns STATUS_TIMEOUT."
  shared_waiters: "two waiters sleeping with the shared flag, woken by one wake all, hold the lock shared at the same time."
  word: "the word of a variable nobody sleeps on is 0."
  kernel32_sleep: "the kernel32 wake calls behave the same with kernel32 SleepConditionVariableSRW waiters (tests k32_cv_wake)."
errors:
  none: "no error results"
side_effects: "makes a sleeping thread runnable"
threading: "any thread, with or without holding the lock"
ordering: ["waiters wake in the order they went to sleep"]
timing:
  typical: "the woken thread runs within milliseconds"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, importing ntdll.dll and kernel32.dll by name. Every wait that must not return is observed after 300 ms of waiting, every wait that must return is bounded by 5 s or more, so a failing implementation fails an observation instead of hanging the run. Observations are statuses, counts, booleans and small words; lock words are shown only when they are zero or small (the lock value of an uncontended lock). Counts of threads and loops are fixed so the outputs are identical on every run. Tests that need a process to survive a fault run the case in a child process of the same image (--child <case>) whose exit code is the answer (0x600D: the call returned; otherwise the exception code). Each test is kept in three files that make the same calls and write every third observation line, so one test serves as visible and held-out tests.
not_covered: >
  The relative order of waiters on different locks, wake-ups racing timeouts.
