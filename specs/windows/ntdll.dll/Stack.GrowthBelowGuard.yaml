# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ntdll.dll/Stack.GrowthBelowGuard.yaml
id: windows/api/ntdll.dll/Stack.GrowthBelowGuard
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests (64-bit, and 32-bit ones that run under WOW64) run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The 64-bit tests were also run (outside the record) on a second machine, Windows 11 build 26200, and gave the same output."
  observed_by: spec-win-stack-roundrect
  date: 2026-11-20
sources: >
  Observations of our own test programs on the machine above, 64-bit and 32-bit (under WOW64): the layout of a thread's stack allocation read with VirtualQuery before and after one first touch, exceptions caught with a vectored exception handler that resumes the thread at a recovery point, and child processes for the cases that end the process. Microsoft Learn: "VirtualQuery", "MEMORY_BASIC_INFORMATION", "Memory Protection Constants" (PAGE_GUARD), "CreateThread" (STACK_SIZE_PARAM_IS_A_RESERVATION), "SetThreadStackGuarantee", "GetCurrentThreadStackLimits", "AddVectoredExceptionHandler", "_resetstkoflw", "Thread Stack Size", "Creating Guard Pages"; ntstatus.h (STATUS_STACK_OVERFLOW 0xC00000FD, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_GUARD_PAGE_VIOLATION 0x80000001), winnt.h (EXCEPTION_RECORD, CONTEXT, NT_TIB). Where Microsoft documents a guard page of one page the observed region is larger (3 pages in a 64-bit process, 2 pages in a 32-bit one); the sheet gives what was observed. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  A thread's stack is one allocation. From the lowest address up it has reserved pages that were never used (no access), the guard region (N pages that are committed with PAGE_GUARD | PAGE_READWRITE; VirtualQuery shows them as one region with the PAGE_GUARD bit set), and the committed read-write pages the thread has used. The first touch of any byte inside the guard region (read, write, or a push after the stack pointer was set into it) grows the stack: no exception reaches the program. The first touch of a byte below the guard region, even one byte below it, raises STATUS_ACCESS_VIOLATION and changes nothing. N is 3 in a 64-bit process and 2 in a 32-bit process (and grows with SetThreadStackGuarantee), so a first touch up to 12 KiB (64-bit) or 8 KiB (32-bit) below the top of the guard region grows the stack: that is 8 KiB (64-bit) or 4 KiB (32-bit) below the lowest address of the highest guard page.
interface:
  signature: "behaviour of the memory manager for a thread's stack allocation (no function): the pages of the allocation (VirtualQuery), accesses to them, the exceptions raised"
chrome: "Chrome's video decoder threads (and any code with large stack frames that skip the stack probe) touch a stack page below the guard page they are about to reach without touching the guard page first. On Windows that works when the page lies inside the thread's guard region (see rules); on Poly the first version raised an access violation (#453 covers 8 KiB). These sheets give the exact rules for 64-bit and 32-bit programs."
rules:
  layout: "a new thread, whatever its stack size (default 1 MiB from the program file, reservations from 64 KiB to 4 MiB, initial commits of 16 KiB and 64 KiB, RtlCreateUserThread with both), and the primary thread of a process have the same layout: reserved pages below, then N guard pages in one region, then the committed pages (the first stack frames); the lowest address of the allocation is the start of the reserved part. N = 3 for a 64-bit process and 2 for a 32-bit process on 64-bit Windows"
  guard_size: "N = max(default, ceil(g / 4096) + 1) for a thread whose SetThreadStackGuarantee value is g bytes (default 3 in a 64-bit process: g = 0, 1, 4096, 4097 and 8192 give 3, 12288 gives 4, 16384 gives 5, 20480 gives 6, 65536 gives 17; default 2 in a 32-bit process: 4096 gives 2, 4097 and 8192 give 3, 12288 gives 4, 16384 gives 5, 20480 gives 6, 65536 gives 17); the call takes effect at once (the missing guard pages below the existing ones are committed with the guard flag when the call returns), never makes the region smaller (a later smaller value changes nothing), and a larger value later extends it again; on a thread with a 4 MiB reservation a value of 2 MiB gives 513 pages and 3 MiB gives 769; 4 MiB, 8 MiB, 1 GiB and 0xFFFFFFFF fail with ERROR_INVALID_PARAMETER 87 (the region must fit into the allocation); the value the call returns through its argument is the guarantee in force before the call (the largest value set so far, in bytes as given, not rounded)"
  growth_step: "a touch of a byte of a guard page p (pages counted upward from the allocation's start) grows the stack in one step: page p becomes ordinary committed read-write, the guard flag is set on the N pages p-N .. p-1 (a page that was reserved becomes committed with the guard flag; one that was committed without the flag gets the flag again), and every other page keeps its state, so guard pages above p stay guard pages. The access that touched p completes (the byte is written or read) and no exception is raised"
  growth_counts: "in a 64-bit process with a fresh 3-page region: a touch of the highest guard page makes pages reserved -1, guard +0, committed +1; of the middle page reserved -2, guard +1, committed +1; of the lowest page reserved -3, guard +2, committed +1 (the touched page leaves the guard, N new pages join). In a 32-bit process with a 2-page region: highest page reserved -1, guard +0, committed +1; lowest page reserved -2, guard +1, committed +1"
  holes: "touching a guard page below the highest one leaves the pages above it as guard pages: the region is then in two parts, for example (bottom to top) guard 3, committed 1, guard 2, committed; touching one of the remaining upper guard pages commits it, moves the guard flag back onto the N pages below it (including the committed page between the parts) and leaves one single region again; a further touch of an upper guard page that is already committed changes nothing"
  distances: "distance d is how far below the highest address of the guard region (the first byte under the committed pages) the touched byte is. 64-bit process, 3 guard pages: d = 1 .. 12288 grows (d 1..4096 is the highest guard page, 4097..8192 the middle one, 8193..12288 the lowest one); d = 12289 and every larger distance up to the start of the reservation raises STATUS_ACCESS_VIOLATION (tested at 12289, 12290, 13312, 16383, 16384, 20480, 32768, 65536, 131072, 262144, 524288). 32-bit process, 2 guard pages: d = 1 .. 8192 grows, d = 8193 and larger raises STATUS_ACCESS_VIOLATION. In kilobytes below the lowest address of the highest guard page (the guard page the stack pointer is about to reach): 64-bit 0 to 8 KiB grow, 12 KiB and more fail; 32-bit 0 to 4 KiB grow, 6 KiB and more fail"
  access_violation: "the exception record has code 0xC0000005, two parameters, ExceptionInformation[0] = 1 for a write and 0 for a read, ExceptionInformation[1] = the address; no page changes state; a read below the guard region fails the same way as a write"
  read_write_push: "a read, a write, and a push with the stack pointer set to the address (a frame that skipped the stack probe) grow the stack alike inside the guard region; a push with the stack pointer below the guard region cannot be handled: the process ends with exit code 0xC0000005 (the exception cannot be dispatched on a stack pointer outside the stack)"
  frames: "a function frame of the size that makes its lowest byte the first one touched, with no probe loop: the lowest byte 2 KiB, 6 KiB and 10 KiB below the top of the guard region (64-bit; 2 KiB and 6 KiB in a 32-bit process) grows the stack and the function returns; 14 KiB below (64-bit) or 10 KiB below (32-bit) and anything further ends the process with 0xC0000005. The same frame made with a probe loop that touches one byte per page from the top down always grows the stack, whatever its size (tested down to 258 KiB), because every touch lands in the guard region of the previous step"
  primary_thread: "the primary thread of a process behaves like any thread: its stack is one allocation of the size in the program file's header (256 pages in the test programs), with the same N guard pages; the same distances give the same results"
  no_handler_needed: "no exception, not even STATUS_GUARD_PAGE_VIOLATION, is raised to a handler by a successful growth step: a vectored handler never sees it"
  limits: "after a growth step the thread's stack limit (see Stack.Reservation) is the start of the lowest committed page that has no guard flag; the deallocation stack stays the start of the allocation"
errors:
  access_violation: "STATUS_ACCESS_VIOLATION 0xC0000005 for a first touch below the guard region (ExceptionInformation[0] 1 write, 0 read)"
  process_end: "0xC0000005 as exit code for a push or frame below the guard region (not catchable)"
side_effects: "pages of the stack allocation change from reserved to committed (with or without the guard flag); no other memory is touched"
threading: "per thread; the layout is read and changed only by the memory manager and by the thread's own accesses"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 11
  held_out: 5
building_tests: >
  Rust tests (ADR 0075): every test file exists twice, as a 64-bit program and as a 32-bit program (`_x86`, `// poly-arch: x86`, ADR 0259, run under WOW64). Each probe runs on a new thread (CreateThread or RtlCreateUserThread) whose stack is described, or in a child process (`--child ...`) when the probe can end the process. Observations are exception names, parameters, counts of pages that changed between the reserved, guard and committed state, and booleans; never addresses or the absolute number of committed pages (the first stack frames of a thread are at a randomised offset). Before a probe the thread commits and gives back about 20 KiB of stack, so that the exception dispatch of the probe does not itself grow the stack.
not_covered: >
  execute access to a stack page; touches from another thread's access to this thread's stack; stacks of threads made by other means (fibers, thread pool threads: they use the same memory manager but their stack sizes come from other places); several threads growing at the same instant; the effect of Windows builds other than the one named (a 64-bit program on build 26200 gave the same results for the distance test).
