# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/ntdll.dll/NtQueryInformationToken
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token: High mandatory integrity level, the full administrator privilege set present and enabled; every test runs twice with identical output"
  observed_by: spec-win-sec
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn reference pages of the functions named here and of "Access Tokens",
  "Security Identifiers", "Well-known SIDs", "SID Strings", "Access Control
  Lists", "Security Descriptors", "Mandatory Integrity Control", "Job
  Objects", "Privilege Constants"; winnt.h, winbase.h, sddl.h, aclapi.h,
  securitybaseapi.h, processthreadsapi.h, jobapi2.h, winerror.h and
  ntstatus.h for constants and layouts. Wine's tests were not read. No
  Microsoft binary was decompiled or disassembled. Prototype: the arguments
  of the Win32 function that wraps this call map one to one (Microsoft Learn
  documents the Zw form for some of them); where Learn has no page for the
  Nt name the signature here is worked out from the Win32 function and the
  observations, not from a document.
summary: >
  Reads one class of token information (the classes of GetTokenInformation,
  winnt.h numbering). A buffer that is too small gives
  STATUS_BUFFER_TOO_SMALL with the needed size in *ReturnLength and nothing
  written; the pointer-bearing classes return the SIDs and ACLs inside the
  same buffer. TOKEN_QUERY is the right needed (TokenSource needs
  TOKEN_QUERY_SOURCE).
interface:
  signature: "NTSTATUS NtQueryInformationToken(HANDLE TokenHandle, TOKEN_INFORMATION_CLASS TokenInformationClass, PVOID TokenInformation, ULONG TokenInformationLength, PULONG ReturnLength)"
  statuses: "NTSTATUS values seen (ntstatus.h): STATUS_SUCCESS 0x00000000, STATUS_NOT_ALL_ASSIGNED 0x00000106 (a success code), STATUS_OBJECT_NAME_EXISTS 0x40000000 (success), STATUS_BUFFER_OVERFLOW 0x80000005, STATUS_INVALID_INFO_CLASS 0xC0000003, STATUS_INFO_LENGTH_MISMATCH 0xC0000004, STATUS_ACCESS_VIOLATION 0xC0000005, STATUS_INVALID_HANDLE 0xC0000008, STATUS_INVALID_PARAMETER 0xC000000D, STATUS_ACCESS_DENIED 0xC0000022, STATUS_BUFFER_TOO_SMALL 0xC0000023, STATUS_OBJECT_TYPE_MISMATCH 0xC0000024, STATUS_PRIVILEGE_NOT_HELD 0xC0000061. RtlNtStatusToDosError maps 0xC0000022 to 5, 0xC0000008 and 0xC0000024 to 6 and 0xC000000D to 87. Also STATUS_NO_SUCH_LOGON_SESSION 0xC000005F."
  fixed_sizes: "bytes the class returns: 7 TokenSource 16, 8 TokenType 4, 10 TokenStatistics 56, 12 TokenSessionId 4, 15 TokenSandBoxInert 4, 16 (audit policy) 31, 17 TokenOrigin 8, 18 TokenElevationType 4, 19 TokenLinkedToken 8, 20 TokenElevation 4, 21 TokenHasRestrictions 1, 23 TokenVirtualizationAllowed 4, 24 TokenVirtualizationEnabled 4, 26 TokenUIAccess 4, 27 TokenMandatoryPolicy 4, 29 TokenIsAppContainer 4, 32 TokenAppContainerNumber 4, 40 4, 41 8, 42 4, 43 16, 44 16, 47 4, 48 4"
  variable_sizes: "classes 1 TokenUser, 2 TokenGroups, 3 TokenPrivileges, 4 TokenOwner, 5 TokenPrimaryGroup, 6 TokenDefaultDacl, 11 TokenRestrictedSids, 13 TokenGroupsAndPrivileges, 22 TokenAccessInformation, 25 TokenIntegrityLevel, 28 TokenLogonSid, 30 TokenCapabilities, 31 TokenAppContainerSid, 33, 34, 37 TokenDeviceGroups, 39 depend on the token"
  unknown_classes: "classes 0, 14, 35, 36, 38, 45 and 46 give STATUS_INVALID_INFO_CLASS (0xC0000003) with *ReturnLength left as the caller set it; class 9 TokenImpersonationLevel does the same for a primary token"
  layouts: "TokenUser: 44 bytes = SID_AND_ATTRIBUTES (pointer, attributes 0) + the 28-byte SID at offset 16. TokenOwner: 24 bytes, SID at offset 8 (16 bytes). TokenPrimaryGroup: 36 bytes, SID (28 bytes) at offset 8. TokenIntegrityLevel: 28 bytes, SID (12 bytes) at offset 16, attributes 0x60. TokenGroups: GroupCount at 0, array of 16-byte SID_AND_ATTRIBUTES from offset 8, the SIDs after the array (12 groups: first SID at offset 200 = 8 + 16 * 12, SIDs 180 bytes, total 380). TokenRestrictedSids with none: 8 bytes, count 0. TokenLogonSid: a one-entry group list, length 44, first SID at offset 24. TokenDeviceGroups with none: count 0, length 24. TokenPrivileges: 4 + 12 * count bytes (24 privileges: 292). TokenDefaultDacl: 88 bytes, pointer at 0, 80-byte ACL at offset 8. TokenStatistics: 56 bytes, TokenType at 24, ImpersonationLevel at 28, GroupCount at 40, PrivilegeCount at 44 (12 and 24 here). TokenAccessInformation: 1972 bytes with the privileges pointer inside the buffer, TokenType at 32, level at 36, mandatory policy 3 at 40, flags 0x402000 at 44, AppContainerNumber 0 at 48. TokenSource 16, TokenOrigin 8 (ambient counts: elevated administrator token)"
rules:
  zero_length: "a zero-length query returns STATUS_BUFFER_TOO_SMALL (0xC0000023) with the exact size in *ReturnLength for all valid classes except 19 and 20, which return STATUS_INFO_LENGTH_MISMATCH (0xC0000004) with 8 and 4"
  short_exact_more: "one byte short: STATUS_BUFFER_TOO_SMALL, *ReturnLength = needed, nothing written (0 bytes changed in a 0xEE-filled buffer); exact: STATUS_SUCCESS; 8 bytes more: STATUS_SUCCESS with *ReturnLength = needed. Classes 19 and 20 require the exact length: shorter or longer gives STATUS_INFO_LENGTH_MISMATCH; at the exact length class 20 succeeds and class 19 returns STATUS_NO_SUCH_LOGON_SESSION (0xC000005F) for the oracle's token (no linked token)"
  rights: "TOKEN_QUERY alone answers every class tried (1 2 3 4 5 6 8 10 12 17 18 21 22 25 28) but class 7 (STATUS_ACCESS_DENIED); TOKEN_QUERY_SOURCE alone answers only class 7; TOKEN_QUERY | TOKEN_QUERY_SOURCE answers all; handles with only TOKEN_DUPLICATE, TOKEN_ADJUST_DEFAULT or READ_CONTROL are refused for every class (STATUS_ACCESS_DENIED)"
  long_buffer: "a claimed length of 4096 for a 4-byte class returns STATUS_SUCCESS, *ReturnLength 4, exactly 4 bytes written; TokenStatistics with length 100: *ReturnLength 56 and no byte beyond the 56th written"
  check_order: "the class is judged first (0 and 14: STATUS_INVALID_INFO_CLASS through any handle), then for TokenElevation (20) the length (STATUS_INFO_LENGTH_MISMATCH unless it is 4, through any handle), then the handle's rights (STATUS_ACCESS_DENIED without TOKEN_QUERY, also for class 9 on a primary token, for class 19 at any length and for class 20 with length 4), then the class's own answer (class 9 on a primary token STATUS_INVALID_INFO_CLASS, class 19 with a wrong length STATUS_INFO_LENGTH_MISMATCH, a short buffer STATUS_BUFFER_TOO_SMALL)"
errors:
  handles: "NULL, a closed handle and 0x7FF4: STATUS_INVALID_HANDLE; the process or thread pseudo-handle and an event: STATUS_OBJECT_TYPE_MISMATCH"
  null_pointers: "a NULL ReturnLength (with an exact buffer): STATUS_ACCESS_VIOLATION (0xC0000005); a NULL buffer with length 4: STATUS_ACCESS_VIOLATION and *ReturnLength unchanged; a NULL buffer with length 0: STATUS_BUFFER_TOO_SMALL with *ReturnLength 4 (class 8)"
side_effects: "none beyond the rules above"
threading: "no state is shared between threads unless noted; the calling thread's token and last error are per thread"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 3  # count in <symbol>.tests/
  held_out: 2  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing advapi32.dll, kernel32.dll and ntdll.dll
  by name, each carrying its own declarations (Learn prototypes, header
  constants); run with poly-oracle.ps1 (see docs/AGENT_PIPELINE.md).
  Observations are text lines of values: sizes, flags, error codes and SIDs
  as strings. Never printed: handles, addresses, LUIDs of logon sessions,
  token IDs, times, the machine's own SID or account names. Where a result
  depends on the oracle's ambient token (user, groups, privileges), the test
  says so in its name or comment ("ambient").
not_covered: >
  Domain accounts and domain-relative well-known SIDs of a real domain,
  AppContainer and capability SIDs beyond their string forms, auditing (SACL
  entries are only stored, never evaluated), remote systems (the system-name
  arguments), Kerberos or NTLM logon tokens, tokens of other users.
