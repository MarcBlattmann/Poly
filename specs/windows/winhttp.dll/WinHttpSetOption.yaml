  - "REDIRECT_POLICY 3: set 0x3 -> 0 (error 87); query -> 1 (error -2), length 4, value 2"
  - "SECURE_PROTOCOLS TLS1.2: set 0x800 -> 1 (error -2); query -> 0 (error 87), length 16, value -1"
