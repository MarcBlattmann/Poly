  incorrect_handle_type: "12018"
  option_not_settable: "12011"
  insufficient_buffer: "122"
  invalid_parameter: "87"
  invalid_handle: "6"
side_effects: "changes the handle's settings only; nothing is sent"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "microseconds"
  guarantees: "none"
building_tests: "Rust tests (ADR 0075): wh_session_opts (session options, sizes, unknown options, invalid handles, query buffers), wh_handle_opts (connection and request handles, the URL and the context value). Each line prints the set result and error and the query result and value."
not_covered: "options that need traffic or credentials (client certificates, proxy credentials, passport, WebSocket options, HTTP2 and HTTP3 options), WINHTTP_OPTION_PROXY and the WPAD options, asynchronous handles, option values beyond those listed, the A-less API (WinHttp has only the W form), timeouts of WinHttpSetTimeouts (a different function)."
tests:
