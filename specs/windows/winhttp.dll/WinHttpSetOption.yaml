# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/winhttp.dll/WinHttpSetOption.yaml
id: windows/api/winhttp.dll/WinHttpSetOption
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 as the local account \"server\" (member of Administrators). Default mode: the SSH logon (session 0, no interactive desktop, the administrator's elevated token, 24 privileges). No network traffic: handles are opened for localhost but nothing is sent. Every test ran twice with identical output."
  observed_by: "spec-win-chrome-setup"
  date: "2026-11-17"
sources: "Observations of our own test programs on the oracle machine. Microsoft Learn: WinHttpSetOption, WinHttpQueryOption, \"Option Flags\" (winhttp.h, the WINHTTP_OPTION_* values), WinHttpOpen/Connect/OpenRequest, \"WinHTTP Error Codes\" (winhttp.h: ERROR_WINHTTP_INVALID_OPTION 12009, ERROR_WINHTTP_INCORRECT_HANDLE_TYPE 12018). Nothing of Windows or Google's programs was read or disassembled."
summary: "Sets an option on a WinHTTP session, connection or request handle. Each option applies to some handle kinds, takes a buffer of a fixed size and a value range; wrong kind gives 12018, unknown option 12009, wrong size 122 (ERROR_INSUFFICIENT_BUFFER) or 87. A set value can be read back with WinHttpQueryOption for most options (others are write-only: the query then fails with 87). A request handle starts with the session's values (the CONNECT_RETRIES set on the session shows on the connection). Chrome's setup.exe imports the function."
interface:
  signature: "BOOL WinHttpSetOption(HINTERNET handle, DWORD option, LPVOID buffer, DWORD length)  (winhttp)"
rules:
  session_roundtrip: "on a session handle these set and read back exactly (set 1 / query 1, length 4): REDIRECT_POLICY 88 (0, 1, 2), CONNECT_RETRIES 4, MAX_CONNS_PER_SERVER 73, MAX_CONNS_PER_1_0_SERVER 74, AUTOLOGON_POLICY 77 (1, 3), MAX_HTTP_AUTOMATIC_REDIRECTS 89, MAX_RESPONSE_HEADER_SIZE 91, MAX_RESPONSE_DRAIN_SIZE 92, CONNECT_TIMEOUT 3, SEND_TIMEOUT 5, RECEIVE_TIMEOUT 6, RESOLVE_TIMEOUT 2, RECEIVE_RESPONSE_TIMEOUT 7"
  session_write_only: "SECURE_PROTOCOLS 84 (0, 0x800, 0x2800), DECOMPRESSION 118 (0, 1, 3) and CODEPAGE 68 (1252) are accepted on a session but cannot be read back (query: 87); ENABLE_FEATURE 79 on a session fails with 87; UNSAFE_HEADER_PARSING 110 on a session fails with 12018"
  value_ranges: "REDIRECT_POLICY 3 fails with 87 (the old value stays); DECOMPRESSION 4 fails with 87; AUTOLOGON_POLICY 3 is accepted"
  read_only: "HANDLE_TYPE 9 is read-only: set fails with 12011 (ERROR_WINHTTP_OPTION_NOT_SETTABLE), query gives 1 for a session, 2 for a connection, 3 for a request; HTTP_VERSION 59 set on a session fails with 122; its query returns 8 bytes (value 1 in the first four: major 1 minor 1 as the struct HTTP_VERSION_INFO)"
  security_flags: "SECURITY_FLAGS 31 on a session fails with 12018; on a request it sets and reads back, and once 0x3300 was set, setting 0 later reads back 0x3300 (flags can only be added)"
  connection_handle: "REDIRECT_POLICY on a connection handle fails with 12018 (set and query); CONNECT_RETRIES set fails with 12018, query returns the session's value"
  request_handle: "REDIRECT_POLICY, MAX_HTTP_AUTOMATIC_REDIRECTS, MAX_RESPONSE_HEADER_SIZE, REJECT_USERPWD_IN_URL 100, CONNECT_TIMEOUT round-trip; DECOMPRESSION, UNSAFE_HEADER_PARSING 110, ENABLE_FEATURE are accepted but cannot be read back (87); SECURE_PROTOCOLS fails with 12018; URL 34 reads back as a UTF-16 string of the request's URL (http://localhost/a/b?c=d, 48 bytes including the NUL) and CONTEXT_VALUE 45 (8 bytes) round-trips"
  sizes: "wrong buffer lengths: REDIRECT_POLICY length 0: 87; lengths 3 and 8: 122; SECURE_PROTOCOLS length 2: 122; NULL buffer with length 0: 122; NULL buffer with length 4: 87; query with a buffer of 2 or NULL buffer for a 4-byte option: FALSE with 122 and the length set to 4"
  unknown_option: "option numbers 0, 200 and 0xFFFF: 12009 (ERROR_WINHTTP_INVALID_OPTION)"
  handles: "a NULL handle: 12018; a value that is not a handle: 6"
