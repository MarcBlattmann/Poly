# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/winhttp.dll/WinHttpGetProxyForUrl.yaml
id: windows/api/winhttp.dll/WinHttpGetProxyForUrl
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed with a trace kit that logs arguments (polytrace-sync) on stage S4 (headless, http://example.com/ and https://www.iana.org/) on the owner's PC, plus the counts and failures of specs/windows/apps/chrome/traces/s4.trace.json (the committed traces have counts, not arguments, for these calls). Microsoft Learn: "WinHttpGetProxyForUrl function (winhttp.h)", "WINHTTP_AUTOPROXY_OPTIONS structure", "WinHttpOpen", "WinHttpCloseHandle"; winhttp.h and winerror.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Finds the proxy for a URL by auto-detection or a PAC script. Chrome does not call it in stage 4 (it resolves proxies itself); the tests cover only arguments that are refused before any lookup: a NULL session handle gives 6, a closed session 6; with a session from WinHttpOpen(NO_PROXY): options with no flags, AUTO_CONFIG_URL without a URL, AUTO_DETECT with no detect flags, a NULL URL, NULL options and a NULL result structure all give 87; a string that is not a URL gives 12006 (ERROR_WINHTTP_INVALID_URL). No network is used.
interface:
  signature: "BOOL WinHttpGetProxyForUrl(HINTERNET session, LPCWSTR url, WINHTTP_AUTOPROXY_OPTIONS *opts, WINHTTP_PROXY_INFO *info)"
chrome:
  calls: "not called in stage 4"
rules:
  handles: "a NULL session: FALSE, 6; a session after WinHttpCloseHandle: FALSE, 6; WinHttpCloseHandle returns TRUE once and FALSE for the closed handle"
  arguments: "(session from WinHttpOpen(agent, 1 /*NO_PROXY*/, NULL, NULL, 0)) options {dwFlags 0}, {AUTO_CONFIG_URL (2) with a NULL URL}, {AUTO_DETECT (1) with dwAutoDetectFlags 0}, a NULL URL, NULL options, NULL info: FALSE, 87"
  bad_url: "the string \"not a url\" with valid AUTO_DETECT options: FALSE, 12006"
errors:
  invalid_handle: "ERROR_INVALID_HANDLE (6)"
  invalid_parameter: "ERROR_INVALID_PARAMETER (87)"
  invalid_url: "ERROR_WINHTTP_INVALID_URL (12006)"
side_effects: "none for these arguments"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, WSA error codes, counts, flags and booleans, never socket or handle values, ports, addresses other than loopback, process ids, times or names of the machine. Every test is self-contained and offline: it binds its own listener on 127.0.0.1 or ::1 with port 0 (the system chooses the port, which is never printed) and talks to it from the same process (a thread of the test) or from a child (the test's own image started again with --child). Every wait is bounded (at most about 10 s) and nothing leaves the machine. The tests run in the SSH logon session of the oracle (session 0).
not_covered: >
  An actual auto-detection or PAC download (network dependent), proxy results, auto-logon, WinHttpGetProxyForUrlEx and its asynchronous companions.
