# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/AppID.Security.yaml
id: windows/api/ole32.dll/AppID.Security
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token; where noted, tests also start a de-elevated child process holding the session shell's filtered standard token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-sec
  date: 2026-11-19
sources: >
  Observations of our own test programs (client, local COM server, LocalSystem service, and de-elevated child client in one image) on the oracle machine above. Microsoft Learn: "CoInitializeSecurity function (combaseapi.h)", "CoSetProxyBlanket", "CoQueryProxyBlanket", "CoCopyProxy", "IClientSecurity interface (objidlbase.h)", "CoGetCallContext", "IServerSecurity interface (objidlbase.h)", "CoQueryClientBlanket", "CoImpersonateClient", "CoRevertToSelf", "EOLE_AUTHENTICATION_CAPABILITIES", "RPC_C_AUTHN_LEVEL_*", "RPC_C_IMP_LEVEL_*", "COM_RIGHTS_*", "AppID Key", "LaunchPermission", "AccessPermission", "Security in COM"; combaseapi.h, objidl.h, objidlbase.h, rpcdce.h, wtypes.h, winnt.h, winerror.h for constants and layouts. Google's updater and Chrome's elevation service: their own logs, registry changes, and PE import names from the survey (docs/windows/chrome-installer-plan.md, docs/windows/com-out-of-process-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Registry security settings under HKLM\SOFTWARE\Classes\AppID\{appid} (referenced by CLSID\{clsid}\AppID): LaunchPermission (controls who may activate/launch a local COM server), AccessPermission (controls who may call the server, applied ONLY when the server opts in via CoInitializeSecurity with EOAC_APPID), and the default access behaviour of a LocalSystem LocalService COM server.
interface:
  registry_key: "HKLM\\SOFTWARE\\Classes\\AppID\\{appid}"
  values: "LaunchPermission (REG_BINARY self-relative SECURITY_DESCRIPTOR), AccessPermission (REG_BINARY self-relative SECURITY_DESCRIPTOR)"
  rights: "COM_RIGHTS_EXECUTE (0x1), COM_RIGHTS_EXECUTE_LOCAL (0x2), COM_RIGHTS_EXECUTE_REMOTE (0x4), COM_RIGHTS_ACTIVATE_LOCAL (0x8), COM_RIGHTS_ACTIVATE_REMOTE (0x10)"
installer: "Google's updater and Chrome's elevation service register LocalService AppIDs with no LaunchPermission and no AccessPermission values. Observed here: a LocalSystem service that does not call CoInitializeSecurity refuses standard (filtered) clients even if LaunchPermission and AccessPermission grant Everyone; with a CoInitializeSecurity descriptor that admits Everyone it admits them. (What the updater passes to CoInitializeSecurity was not observed.)"
rules:
  launch_permission_access: "LaunchPermission (REG_BINARY self-relative security descriptor) is checked during activation (CoCreateInstance(CLSCTX_LOCAL_SERVER)): when absent, both elevated and standard clients succeed (S_OK, given an admitting server); with mask 0xb (EXECUTE|EXECUTE_LOCAL|ACTIVATE_LOCAL) or legacy mask 0x1 (EXECUTE alone), Allow Everyone (WD), Allow Users (BU), or Allow Interactive (IU) admits both elevated and standard clients (S_OK); Allow Administrators (BA) admits the elevated client (S_OK) and refuses the standard filtered client (E_ACCESSDENIED 0x80070005); Allow SYSTEM (SY), an empty DACL, or Deny Administrators before Allow Everyone refuses both clients (E_ACCESSDENIED 0x80070005, because BA is deny-only in the filtered token and still matches a deny ACE)"
  launch_permission_masks: "LaunchPermission ACE masks without COM_RIGHTS_EXECUTE (0x1) — specifically 0x2, 0x8, and 0xa — fail activation with REGDB_E_INVALIDVALUE 0x80040153 for both elevated and standard clients; mask 0x3 (EXECUTE|EXECUTE_LOCAL without ACTIVATE_LOCAL 0x8) refuses both clients with E_ACCESSDENIED 0x80070005; mask 0x1 alone (legacy EXECUTE) admits both clients (S_OK)"
  access_permission_requires_eoac_appid: "AccessPermission is ignored when the server does not call CoInitializeSecurity with EOAC_APPID: even with AccessPermission restricted to Administrators (BA), both elevated and standard clients succeed (S_OK) against a same-user server that does not call CoInitializeSecurity"
  access_permission_with_eoac_appid: "when the server calls CoInitializeSecurity(&appid, -1, ..., EOAC_APPID): AccessPermission absent -> CoInitializeSecurity returns S_OK and both clients succeed; Allow Everyone (WD) or Allow Users (BU) with mask 0x3 or 0x1 -> S_OK and both clients succeed; Allow Administrators (BA) with mask 0x3 -> S_OK, elevated client succeeds (S_OK), standard client gets E_ACCESSDENIED 0x80070005; Allow SYSTEM (SY), empty DACL, or Deny Administrators before Allow Everyone -> S_OK in server, both clients get E_ACCESSDENIED 0x80070005; mask 0x2 alone (without bit 0x1) -> CoInitializeSecurity returns E_INVALIDARG 0x80070057 and both clients get E_ACCESSDENIED 0x80070005"
  local_system_service_defaults: "a class hosted in a LocalSystem Windows service (AppID\\LocalService) that does not call CoInitializeSecurity: with no permission values, an elevated client succeeds (S_OK) for activation, CoGetClassObject and direct calls, while a standard (filtered) client receives E_ACCESSDENIED 0x80070005 for both activation and class-object/direct calls. Adding LaunchPermission for Everyone, AccessPermission for Everyone, or both on the AppID still refuses the standard client (0x80070005) because the service's default access security does not admit a standard token without an explicit CoInitializeSecurity call"
errors:
  access_denied: "E_ACCESSDENIED 0x80070005"
  invalid_launch_permission_mask: "REGDB_E_INVALIDVALUE 0x80040153 (LaunchPermission mask missing COM_RIGHTS_EXECUTE 0x1)"
  invalid_access_permission_mask: "E_INVALIDARG 0x80070057 returned to server's CoInitializeSecurity(..., EOAC_APPID), then E_ACCESSDENIED to clients"
side_effects: "activation and call access checks consult the AppID registry values and machine/service defaults"
threading: "evaluated by COM during activation and incoming call dispatch"
ordering: ["LaunchPermission is checked at activation before/during server launch; AccessPermission / CoInitializeSecurity DACL is checked on incoming calls"]
timing:
  typical: "server launch takes tens of milliseconds, LocalSystem service start about a second on the oracle"
  guarantees: none
tests:
  visible: 3
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file each, run with the elevated administrator token: the image acts as elevated client, local COM server or LocalSystem service (CreateServiceW, demand start, removed afterwards), and a de-elevated child client started via CreateProcessWithTokenW using a duplicated primary token from the interactive session's shell process (explorer.exe) so both elevated and standard (filtered) clients are tested against the same server or AppID. Class and AppID keys use unique {B2A0xxxx-...} GUIDs and are removed afterwards. Observations are HRESULTs, token facts and exit codes only.
not_covered: >
  AppID RunAs (Interactive User or named account), machine-wide HKLM\SOFTWARE\Microsoft\Ole DefaultLaunchPermission / DefaultAccessPermission / MachineLaunchRestriction / MachineAccessRestriction overrides, and remote DCOM activation/access rights.
