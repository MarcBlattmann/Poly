# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/CoAddRefServerProcess.yaml
id: windows/api/ole32.dll/CoAddRefServerProcess
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-oop
  date: 2026-11-17
sources: >
  Observations of our own test programs (a COM server and client in one image, a service of its own) on the machine above. Microsoft Learn: "CoRegisterClassObject function (combaseapi.h)", "CoRevokeClassObject", "CoResumeClassObjects", "CoGetClassObject", "CoCreateInstance", "CoCreateInstanceEx", "REGCLS enumeration", "CLSCTX enumeration", "MULTI_QI", "COSERVERINFO", "IClassFactory", "AppID Key", "LocalService", "ServiceParameters", "LocalServer32", "COM Class Objects and CLSIDs", "Registering COM Servers", "Creating a Windows Service" (winsvc.h); objbase.h, combaseapi.h, wtypes.h, winerror.h for constants and layouts. Google's updater and installers: their own logs and registry changes from the survey (docs/windows/chrome-installer-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Adds one to the process's server reference count and returns the new count. A COM server uses the count as its lifetime: it adds one for each object or task and releases one when it is done; when CoReleaseServerProcess brings the count to zero COM stops the process's class objects from being served and the server ends. Both Google servers keep their count with it (the updater's log shows the count of its module going up and down with every task).
interface:
  signature: "ULONG CoAddRefServerProcess(void)"
installer: "The updater's service and Chrome's elevation service call it for every object and task; the updater's log shows the counts and \"COM server is shutting down\" at 0."
rules:
  counting: "the count is one 32-bit counter per process, starting at 0 in a process that never raised it; each call returns the new count: 1, 2, 3 ... (1000 calls return 1000)"
  any_thread: "the counter is shared by all threads and apartments (MTA main thread, other MTA threads, STA threads) and by COM initialised or not; a thread that ends does not change it"
  inside_a_server: "in a server COM started, the count is already 1 while the factory's CreateInstance runs: a call made inside it returned 2 for the first object, 3 for a second object created while the first lived"
  zero_effect: "when releases bring the count to 0 every registration for the local-server context (also those made for both contexts) is hidden (0x80040154) and stays hidden: a later AddRef, CoResumeClassObjects (0x800706C6) and registrations made afterwards (also new ones) do not bring local-context classes back; in-process-only registrations are not affected (see CoReleaseServerProcess)"
  server_lifetime: "a server whose objects AddRef on creation and Release on their last Release: the count after two objects is 2 (COM's own reference during CreateInstance is gone when it returns), their last Releases return 1 and 0; at 0 the server stops being served and an activation after that starts a second server process"
errors:
side_effects: "none beyond the count"
threading: "may be called from any thread, with or without COM initialised"
ordering: []
timing:
  typical: "well under a microsecond"
  guarantees: none
tests:
  visible: 3
  held_out: 2
building_tests: >
  Rust tests (ADR 0075), one file each, see CoRegisterClassObject: the image is client and COM server (`--child srv <tag> clsid={...} <flags>`, a class factory and a plain object of its own, a log file and request files in the test's directory); class registrations are the test's own (HKLM\SOFTWARE\Classes\CLSID\{B2A0xxxx-...}, default value starting `polyws-com-oop`) and are removed again; a class id with a pending activation of an earlier run is avoided by putting the process id into the class id; calls that can wait for a long time run on a thread of their own with a bounded wait. Observations are results, booleans and counts, never process ids, thread ids, cookies or times.
not_covered: >
  overflow of the 32-bit counter by addition (the tests only add up to 1000), and surrogates.
