# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/CoCopyProxy.yaml
id: windows/api/ole32.dll/CoCopyProxy
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token; where noted, tests also start a de-elevated child process holding the session shell's filtered standard token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-sec
  date: 2026-11-19
sources: >
  Observations of our own test programs (client, local COM server, LocalSystem service, and de-elevated child client in one image) on the oracle machine above. Microsoft Learn: "CoInitializeSecurity function (combaseapi.h)", "CoSetProxyBlanket", "CoQueryProxyBlanket", "CoCopyProxy", "IClientSecurity interface (objidlbase.h)", "CoGetCallContext", "IServerSecurity interface (objidlbase.h)", "CoQueryClientBlanket", "CoImpersonateClient", "CoRevertToSelf", "EOLE_AUTHENTICATION_CAPABILITIES", "RPC_C_AUTHN_LEVEL_*", "RPC_C_IMP_LEVEL_*", "COM_RIGHTS_*", "AppID Key", "LaunchPermission", "AccessPermission", "Security in COM"; combaseapi.h, objidl.h, objidlbase.h, rpcdce.h, wtypes.h, winnt.h, winerror.h for constants and layouts. Google's updater and Chrome's elevation service: their own logs, registry changes, and PE import names from the survey (docs/windows/chrome-installer-plan.md, docs/windows/com-out-of-process-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Creates a private copy of a COM interface proxy so a caller can change its security blanket without affecting other holders of the original proxy. Delegates to the proxy manager's IClientSecurity::CopyProxy.
interface:
  signature: "HRESULT CoCopyProxy(IUnknown *pProxy, IUnknown **ppCopy)"
  forward: "ole32.dll!CoCopyProxy forwards to combase.dll!CoCopyProxy"
installer: "Standard companion to CoSetProxyBlanket and IClientSecurity when callers need isolated proxy blankets."
rules:
  distinct_proxy: "on a local cross-process proxy, returns S_OK and writes a non-NULL interface pointer distinct from pProxy pointing to the same remote object"
  default_blanket_on_copy: "the copy starts with the default local proxy blanket (authn=10, authz=0, level=6, imp=2 IDENTIFY, caps=0x1, pServerPrincName = <DOMAIN>\\<user>, pAuthInfo = NULL), even if the original proxy's blanket was previously modified with CoSetProxyBlanket; a copy made from a copy likewise starts with the default blanket"
  independent_blanket: "calling CoSetProxyBlanket on the copy does not alter the original proxy's blanket, and calling CoSetProxyBlanket on the original does not alter the copy's blanket; calls made through either pointer reach the same remote object"
  independent_lifetime: "the copy holds its own reference on the underlying proxy connection: releasing the original proxy leaves the copy usable (original Release returned 1 while the copy was alive, and a call through the copy returned S_OK)"
  dead_server: "returns S_OK with a non-NULL copy pointer even after the server process has exited; CoQueryProxyBlanket and CoSetProxyBlanket still succeed on both the original and copies taken before or after exit, while remote method calls through either fail with 0x800706BA (HRESULT_FROM_WIN32(RPC_S_SERVER_UNAVAILABLE))"
  errors: "NULL pProxy returns E_INVALIDARG 0x80070057 and leaves *ppCopy untouched; a plain in-process object (not a proxy) returns E_NOINTERFACE 0x80004002 and leaves *ppCopy untouched"
errors:
  invalid_argument: "E_INVALIDARG 0x80070057 (NULL pProxy)"
  no_interface: "E_NOINTERFACE 0x80004002 (object is not a proxy)"
  server_unavailable: "0x800706BA (HRESULT_FROM_WIN32(RPC_S_SERVER_UNAVAILABLE) on calls after server exit)"
side_effects: "allocates a new proxy interface pointer with a reference count the caller must Release"
threading: "may be called from any thread allowed to use the proxy"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, each image acting as client and COM server (and where needed a child process running scenarios in isolation). Classes are registered under HKLM\SOFTWARE\Classes\CLSID\{B2A0xxxx-...} for elevated runs and HKCU\Software\Classes\CLSID\{B2A0xxxx-...} for standard-token runs (with a process-unique CLSID per run) and removed afterwards. Observations are HRESULTs, Win32 codes, blanket integers, booleans and domain/user comparisons, never raw process ids, thread ids, pointers or times.
not_covered: >
  NULL ppCopy (access violation), copying proxies across apartments, and remote DCOM proxies.
