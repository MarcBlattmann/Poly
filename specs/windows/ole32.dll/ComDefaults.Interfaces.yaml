# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/ComDefaults.Interfaces.yaml
id: windows/api/ole32.dll/ComDefaults.Interfaces
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\" (an administrator, full token); each test is a 64-bit and a 32-bit program, and every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-wow64-defaults
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above: 64-bit programs that ask for each view in turn (the access bits KEY_WOW64_64KEY and KEY_WOW64_32KEY) and 32-bit programs (built for i686, run under WOW64) that ask for their own default view and for each explicit one; the marker keys the tests make are removed again (the programs end by checking that none is left). Every program reads names and values only. Microsoft Learn: "Registry Redirector", "Registry Keys Affected by WOW64", "Accessing an Alternate Registry View", "Registry Key Security and Access Rights", "Interface Key", "CLSID Key", "InprocServer32", "ProxyStubClsid32", "TypeLib Key", "Type Library Registration", "Windows NT CurrentVersion" (no page: names as found); oaidl.h, objidl.h, unknwn.h, oleauto.h for the interface names. The coordinator's finding for B7: the 32-bit updater creates and opens keys below Software\Classes and needs the standard COM registrations in the 32-bit view too. The oracle is a normal installed machine (it also has Google, Intel, Python, Git and other vendors' keys): only what Windows itself makes is listed as default, vendor keys are left out. The earlier sheets of this area (RegCreateKeyExW and its relatives, observed under the name spec-win-wow64-registry) say how a key made through a handle or a path lands in a view; these sheets say what is there before any program has made anything. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  The standard interface registrations of a Windows machine below HKLM\SOFTWARE\Classes\Interface (82 keys found by name): the name, the proxy/stub class and the few other values. The 32-bit view holds the same data (every value is identical in the two views), so 32-bit COM finds its marshalling classes.
interface:
  signature: "behaviour of RegOpenKeyExW and RegQueryValueExW on HKLM\\SOFTWARE\\Classes\\Interface\\{iid} in both views"
rules:
  same_in_views: "every key below holds the same names and values in the 64-bit view and the 32-bit view (physically, the 32-bit copy is at Classes\\Wow6432Node\\Interface)"
  layout: "Interface\\{iid} has the interface's name as its default value (REG_SZ) and the subkeys ProxyStubClsid32 (default value = the class that marshals it), and, for some, ProxyStubClsid, NumMethods, BaseInterface, TypeLib, AsynchronousInterface or SynchronousInterface; each subkey's default value is a REG_SZ text"
  iunknown: "IUnknown {00000000-0000-0000-C000-000000000046} has the name only, no ProxyStubClsid32"
  by_proxy: "ProxyStubClsid32 values: no ProxyStubClsid32 (the key holds the name only, or only an AsynchronousInterface or SynchronousInterface value): IUnknown, AsyncIAdviseSink, AsyncIAdviseSink2 | {00000320-0000-0000-C000-000000000046}: 67 interfaces, among them IClassFactory, ILockBytes, IStorage, IStream, IEnumSTATSTG, IBindCtx, IMoniker, IRunningObjectTable, IRootStorage, ISurrogate, IUrlMon, ISynchronize | {00020420-0000-0000-C000-000000000046}: IDispatch, ITypeLib2, ITypeInfo2 | {00020422-0000-0000-C000-000000000046}: ITypeInfo | {00020423-0000-0000-C000-000000000046}: ITypeLib | {00020425-0000-0000-C000-000000000046}: ITypeComp | {00020421-0000-0000-C000-000000000046}: IEnumVARIANT | {B196B286-BAB4-101A-B69C-00AA00341D07}: IErrorInfo, ICreateErrorInfo | {DF0B3D60-548F-101B-8E65-08002B2BD119}: ISupportErrorInfo | {10E2414A-EC59-49D2-BC51-5ADD2C36FEBC}: IDispatchEx | {A6FF50C0-56C0-71CA-5732-BED303A59628}: IServiceProvider"
  other_values: "other subkeys: IAdviseSink {0000010F-0000-0000-C000-000000000046}: AsynchronousInterface={00000150-0000-0000-C000-000000000046} | IAdviseSink2 {00000125-0000-0000-C000-000000000046}: AsynchronousInterface={00000151-0000-0000-C000-000000000046} | IRemUnknown {00000131-0000-0000-C000-000000000046}: AsynchronousInterface={000E0131-0000-0000-C000-000000000046} | IRundown {00000134-0000-0000-C000-000000000046}: AsynchronousInterface={000E0134-0000-0000-C000-000000000046} | IRemUnknownN {0000013C-0000-0000-C000-000000000046}: AsynchronousInterface={000B013C-0000-0000-C000-000000000046} | IRemUnknown2 {00000143-0000-0000-C000-000000000046}: AsynchronousInterface={000E0143-0000-0000-C000-000000000046} | AsyncIAdviseSink {00000150-0000-0000-C000-000000000046}: SynchronousInterface={0000010F-0000-0000-C000-000000000046} | AsyncIAdviseSink2 {00000151-0000-0000-C000-000000000046}: SynchronousInterface={00000125-0000-0000-C000-000000000046} | IDispatch {00020400-0000-0000-C000-000000000046}: ProxyStubClsid={00020420-0000-0000-C000-000000000046}, NumMethods=7 | ITypeInfo {00020401-0000-0000-C000-000000000046}: ProxyStubClsid={00020422-0000-0000-C000-000000000046}, NumMethods=22 | ITypeLib {00020402-0000-0000-C000-000000000046}: ProxyStubClsid={00020423-0000-0000-C000-000000000046}, NumMethods=13 | ITypeComp {00020403-0000-0000-C000-000000000046}: ProxyStubClsid={00020425-0000-0000-C000-000000000046}, NumMethods=5 | IEnumVARIANT {00020404-0000-0000-C000-000000000046}: ProxyStubClsid={00020421-0000-0000-C000-000000000046}, NumMethods=7 | ITypeLib2 {00020411-0000-0000-C000-000000000046}: NumMethods=16 | ITypeInfo2 {00020412-0000-0000-C000-000000000046}: NumMethods=32 | ICreateErrorInfo {22F03340-547D-101B-8E65-08002B2BD119}: NumMethods=8 | ISupportErrorInfo {DF0B3D60-548F-101B-8E65-08002B2BD119}: ProxyStubClsid={DF0B3D60-548F-101B-8E65-08002B2BD119} | IDispatchEx {A6EF9860-C720-11D0-9337-00A0C90DCAA9}: NumMethods=15"
