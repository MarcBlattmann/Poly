# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/IIDFromString.yaml
id: windows/api/ole32.dll/IIDFromString
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave the same output except where a sheet says what a 32-bit caller sees."
  observed_by: spec-win-updater-services
  date: 2026-11-20
sources: >
  Observations of our own 64-bit test programs on the machine above (each test ran at least twice with identical output). Microsoft Learn pages of the functions (kernel32 / fileapi.h, winbase.h, processthreadsapi.h, wow64apiset.h, memoryapi.h, synchapi.h, combaseapi.h, objbase.h, userenv.h) for names, parameters and the error values in winerror.h. What the documentation does not say (error codes, edge cases, the effect of access rights) is taken from the observations only. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Reads an interface id from its text form {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}. Unlike CLSIDFromString it does not look up a ProgID: only the braced text is accepted. It works before CoInitializeEx.
interface:
  signature: "HRESULT IIDFromString(LPCOLESTR lpsz, LPIID lpiid)"
installer: "Google's updater 157 and 159 (32-bit) import this function; their run on Poly reaches it while they install and start their two services and register their update service and scheduled task. What they pass is not known beyond the import. Chrome's elevation service imports it too."
rules:
  valid: "S_OK for the 38-character text with braces, hyphens between the groups of 8, 4, 4, 4 and 12 hexadecimal digits in either case, also mixed; GUID_NULL text and all-F text give the matching values"
  no_com_needed: "works on a thread that has not initialised COM"
  malformed: "E_INVALIDARG 0x80070057 and the output is left alone for: no braces, a missing closing brace, a missing opening brace, text after the closing brace, a space before or after, one digit too few or too many, a missing hyphen, an empty string, only braces, a ProgID text with or without a version"
  bad_character: "a non-hexadecimal character inside the braces, and a hyphen in the wrong place with the right length, give CO_E_INVALIDCLSID 0x800401F4 and the output is modified (a partial value): do not rely on it"
  null_string: "a NULL string pointer gives S_OK and writes GUID_NULL"
  vs_clsidfromstring: "for braced text both functions give the same value; for text without braces IIDFromString gives E_INVALIDARG 0x80070057 and CLSIDFromString gives CO_E_CLASSSTRING 0x800401F3 (as for an unregistered ProgID and for the empty string); for a NULL string both give S_OK and GUID_NULL"
  round_trip: "StringFromIID of a GUID followed by IIDFromString gives the same GUID"
errors:
  invalid_argument: "E_INVALIDARG 0x80070057"
  invalid_clsid: "CO_E_INVALIDCLSID 0x800401F4"
  class_string: "CO_E_CLASSSTRING 0x800401F3 (CLSIDFromString only)"
side_effects: "none"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, run on the oracle with the elevated token in the interactive session. Scenarios that could end the process (a NULL pointer where the function reads or writes through it) run in a child process of the same image (`--child ...`) and the parent prints the exit code. Observations are results, error codes, booleans and counts; never addresses, process or thread ids, times or the name of the machine. Files the tests make live next to the test program and are deleted by the test.
not_covered: >
  behaviour on other file systems than the NTFS volume of the test directory; 32-bit callers (the pipeline builds 64-bit tests only).
