# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/ComDefaults.ProxyStubClasses.yaml
id: windows/api/ole32.dll/ComDefaults.ProxyStubClasses
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\" (an administrator, full token); each test is a 64-bit and a 32-bit program, and every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-wow64-defaults
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above: 64-bit programs that ask for each view in turn (the access bits KEY_WOW64_64KEY and KEY_WOW64_32KEY) and 32-bit programs (built for i686, run under WOW64) that ask for their own default view and for each explicit one; the marker keys the tests make are removed again (the programs end by checking that none is left). Every program reads names and values only. Microsoft Learn: "Registry Redirector", "Registry Keys Affected by WOW64", "Accessing an Alternate Registry View", "Registry Key Security and Access Rights", "Interface Key", "CLSID Key", "InprocServer32", "ProxyStubClsid32", "TypeLib Key", "Type Library Registration", "Windows NT CurrentVersion" (no page: names as found); oaidl.h, objidl.h, unknwn.h, oleauto.h for the interface names. The coordinator's finding for B7: the 32-bit updater creates and opens keys below Software\Classes and needs the standard COM registrations in the 32-bit view too. The oracle is a normal installed machine (it also has Google, Intel, Python, Git and other vendors' keys): only what Windows itself makes is listed as default, vendor keys are left out. The earlier sheets of this area (RegCreateKeyExW and its relatives, observed under the name spec-win-wow64-registry) say how a key made through a handle or a path lands in a view; these sheets say what is there before any program has made anything. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  The standard proxy/stub and marshaller classes of a Windows machine below HKLM\SOFTWARE\Classes\CLSID (27 classes found by id): the name and InprocServer32. Where the server is an absolute path it names System32 in the 64-bit view and SysWOW64 in the 32-bit view; bare names (combase.dll) are the same.
interface:
  signature: "behaviour of RegOpenKeyExW and RegQueryValueExW on HKLM\\SOFTWARE\\Classes\\CLSID\\{clsid} and its InprocServer32 in both views"
rules:
  classes: "{0000002F-0000-0000-C000-000000000046} \"CLSID_RecordInfo\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00000300-0000-0000-C000-000000000046} \"StdOleLink\": (default) = combase.dll (both views) | {00000303-0000-0000-C000-000000000046} \"FileMoniker\": (default) = combase.dll (both views) | {00000304-0000-0000-C000-000000000046} \"ItemMoniker\": (default) = combase.dll (both views) | {00000305-0000-0000-C000-000000000046} \"AntiMoniker\": (default) = combase.dll (both views) | {00000306-0000-0000-C000-000000000046} \"PointerMoniker\": (default) = combase.dll (both views) | {00000308-0000-0000-C000-000000000046} \"PackagerMoniker\": (default) = combase.dll (both views) | {00000309-0000-0000-C000-000000000046} \"CompositeMoniker\": (default) = combase.dll (both views) | {0000030B-0000-0000-C000-000000000046} \"DfMarshal\": (default) = coml2.dll (both views) | {00000315-0000-0000-C000-000000000046} \"Picture (Metafile)\": (default) = combase.dll (both views) | {00000316-0000-0000-C000-000000000046} \"Picture (Device Independent Bitmap)\": (default) = combase.dll (both views) | {00000319-0000-0000-C000-000000000046} \"Picture (Enhanced Metafile)\": (default) = combase.dll (both views) | {0000031A-0000-0000-C000-000000000046} \"ClassMoniker\": (default) = combase.dll (both views) | {0000031D-0000-0000-C000-000000000046} \"DCOMAccessControl\": (default) = combase.dll (both views) | {00000320-0000-0000-C000-000000000046} \"PSFactoryBuffer\": (default) = combase.dll; ThreadingModel = Both (both views) | {00000327-0000-0000-C000-000000000046} \"objref\": (default) = combase.dll; ThreadingModel = Both (both views) | {0000032E-0000-0000-C000-000000000046} \"PipePSFactory\": (default) = combase.dll (both views) | {00000355-0000-0000-C000-000000000046} \"MetadataPSFactory\": 64-bit view (default) = C:\\Windows\\System32\\combase.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\combase.dll; ThreadingModel = Both | {00020420-0000-0000-C000-000000000046} \"PSDispatch\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00020421-0000-0000-C000-000000000046} \"PSEnumVariant\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00020422-0000-0000-C000-000000000046} \"PSTypeInfo\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00020423-0000-0000-C000-000000000046} \"PSTypeLib\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00020424-0000-0000-C000-000000000046} \"PSOAInterface\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {00020425-0000-0000-C000-000000000046} \"PSTypeComp\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {DF0B3D60-548F-101B-8E65-08002B2BD119} \"PSSupportErrorInfo\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll | {B196B286-BAB4-101A-B69C-00AA00341D07} \"PSFactoryBuffer\": 64-bit view (default) = C:\\Windows\\System32\\oleaut32.dll; ThreadingModel = Both; 32-bit view (default) = C:\\Windows\\SysWOW64\\oleaut32.dll; ThreadingModel = Both | {4590F811-1D3A-11D0-891F-00AA004B2E24} \"WBEM Locator\": ThreadingModel = Both (both views)"
  layout: "each class key has the name as its default value (REG_SZ), an InprocServer32 key with the server as its default value (REG_SZ) and, for some, ThreadingModel = \"Both\" (REG_SZ); a few have ProgID or other subkeys; the key of two of them is spelt InProcServer32 on the machine (names are not case-sensitive, enumeration shows the stored spelling)"
  paths: "the servers that are named with a full path use C:\\Windows\\System32\\ in the 64-bit view and C:\\Windows\\SysWOW64\\ in the 32-bit view (the same file name)"
errors:
  missing_key: "ERROR_FILE_NOT_FOUND (2)"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, in two builds of the same program: a 64-bit program (which asks for KEY_WOW64_64KEY and for KEY_WOW64_32KEY) and a 32-bit program (marked as such, ADR 0259; it asks for its own default view and for each explicit one). Programs read with RegOpenKeyExW, RegEnumKeyExW, RegEnumValueW, RegQueryInfoKeyW and RegQueryValueExW; the ones that make marker keys use RegCreateKeyExW and RegDeleteKeyExW and need an administrator token (the default token kind of the runner) for HKLM. Names of the markers are fixed and unique; each program removes its markers at the start and at the end. Output lines hold names, yes/no answers and text values only: no counts of a whole hive, no handle, no time, no path of the test.
not_covered: >
  Other hives (HKU, HKCC), keys below HKLM\SYSTEM, the registry on a machine that has ARM64 emulation, the values of keys that vendors' installers make, and the data (names and permissions) of the security descriptors of the keys. Counts of the children of the big keys (Interface has about twenty-four thousand children on the oracle) differ from machine to machine and are not part of the behaviour.
