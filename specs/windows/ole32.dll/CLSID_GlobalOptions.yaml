# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/CLSID_GlobalOptions.yaml
id: windows/api/ole32.dll/CLSID_GlobalOptions
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), 64-bit tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token); every test ran at least twice with identical output, each run in a fresh scratch directory. The same tests built for 32-bit x86 (outside the pipeline, run by the same runner) gave identical output."
  observed_by: spec-win-com-globaloptions
  date: 2026-11-20
sources: >
  Observations of our own test programs (64-bit and 32-bit builds, a COM server and client in one image) on the machine above. Microsoft Learn: "IGlobalOptions interface (objidl.h)", "IGlobalOptions::Set", "IGlobalOptions::Query", "GLOBALOPT_PROPERTIES enumeration (objidl.h)" (COMGLB_EXCEPTION_HANDLING 1, COMGLB_APPID 2, COMGLB_RPC_THREADPOOL_SETTING 3, COMGLB_RO_SETTINGS 4, COMGLB_UNMARSHALING_POLICY 5, COMGLB_PROPERTIES_RESERVED1..3 6..8), "CoCreateInstance", "CoGetClassObject", "CLSCTX enumeration", "IClassFactory", "RaiseException", "SetUnhandledExceptionFilter", "AddVectoredExceptionHandler"; objidl.h, combaseapi.h, winerror.h for the interface and error constants (CLSID_GlobalOptions {0000034B-0000-0000-C000-000000000046}, the interface id {0000015B-0000-0000-C000-000000000046} was confirmed by creating the object with it). The numeric values of the values of each property (the GLOBALOPT_* value enumerations) are not in Learn's text: the sheet gives the numbers the oracle accepted and refused. Google's 32-bit updater: Poly's run of it stops right after it asks for this class (coordinator's report); what it sets is not known. No Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  COM's own process-wide options object. CoCreateInstance(CLSID_GlobalOptions, NULL, CLSCTX_INPROC_SERVER, IID_IGlobalOptions) succeeds on every initialised thread of any apartment model without any registry entry (the class and its interface are built into COM). Each creation gives a new object, but all of them read and write the same options, which belong to the process: they outlive the objects and CoUninitialize, are seen from every thread and apartment and are not shared with other processes.
interface:
  signature: "HRESULT CoCreateInstance(REFCLSID {0000034B-0000-0000-C000-000000000046}, LPUNKNOWN pUnkOuter, DWORD dwClsContext, REFIID {0000015B-0000-0000-C000-000000000046}, LPVOID *ppv)"
installer: "Google's updater.exe 157 (32-bit) asks COM for CLSID_GlobalOptions during its start-up and Poly's COM does not have the class (the point where a Poly run of it breaks). The updater's calls on the object are not known; this sheet therefore gives the behaviour of every documented property. Nothing was observed of what Google's programs pass to Set."
rules:
  needs_com: "on a thread that has not initialised COM the call fails with CO_E_NOTINITIALIZED 0x800401F0 and returns no pointer"
  contexts: "in a single-threaded and in a multithreaded apartment CLSCTX_INPROC_SERVER, CLSCTX_INPROC_HANDLER and CLSCTX_ALL give S_OK; CLSCTX_LOCAL_SERVER alone and CLSCTX_REMOTE_SERVER alone give REGDB_E_CLASSNOTREG 0x80040154: the class is an in-process server only"
  no_registry: "neither HKLM\\SOFTWARE\\Classes\\CLSID\\{0000034B-...} (nor its InprocServer32 key) nor HKLM\\SOFTWARE\\Classes\\Interface\\{0000015B-...} exists on the machine; the class and the interface work without them"
  interfaces: "IGlobalOptions and IUnknown are answered (S_OK, the same pointer for both); IMarshal, IDispatch, IClassFactory (through CoCreateInstance) and an unknown interface id give E_NOINTERFACE 0x80004002 and no pointer; QueryInterface(IMarshal) on the object gives E_NOINTERFACE (the object cannot be marshalled by itself)"
  aggregation: "with a non-NULL outer unknown, asking for IUnknown fails with CLASS_E_NOAGGREGATION 0x80040110; asking for IGlobalOptions fails with E_INVALIDARG 0x80070057; IClassFactory::CreateInstance with an outer pointer gives CLASS_E_NOAGGREGATION"
  class_object: "CoGetClassObject(CLSID_GlobalOptions, CLSCTX_INPROC_SERVER, IID_IClassFactory) succeeds; its CreateInstance(NULL, IID_IGlobalOptions) succeeds"
  objects: "two creations in one apartment give two different pointers; AddRef returns one more than the Release that follows it; the pointer can be used directly from any thread (also one that never initialised COM) while the creating thread's COM is still initialised"
  process_wide: "a value set through one object is seen through every other object, from another thread, from a thread of another apartment (a single-threaded one) and in later objects; it stays after both objects are released, after CoUninitialize and a new CoInitializeEx of the thread; a value set by a child process is not seen in the parent, and a new process starts with the default values"
errors:
  not_initialised: "CO_E_NOTINITIALIZED 0x800401F0"
  class_not_registered: "REGDB_E_CLASSNOTREG 0x80040154 (local or remote context only)"
  no_interface: "E_NOINTERFACE 0x80004002"
  no_aggregation: "CLASS_E_NOAGGREGATION 0x80040110"
side_effects: "none beyond the object"
threading: "the class works in a single-threaded and in a multithreaded apartment without a proxy; an object may be used directly from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each; some scenarios run in a child process of the same image (`--child gseq ...`) and write their lines to a file the parent prints. Observations are HRESULTs, values of the options and booleans, never addresses or process ids. The 32-bit builds of the same sources give the same bytes.
not_covered: >
  remote or non-local contexts; the effects of COMGLB_RPC_THREADPOOL_SETTING, COMGLB_RO_SETTINGS (modal-loop and rundown behaviour) and COMGLB_UNMARSHALING_POLICY on marshalling (only what Set and Query report is specified); COMGLB_APPID (Set failed in every circumstance tried); Set of the reserved properties 6 and 7 (it raised an access violation in the process); custom marshalling.
