# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/CoQueryProxyBlanket.yaml
id: windows/api/ole32.dll/CoQueryProxyBlanket
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 -Token elevated in the interactive desktop session of the local account \"server\" (session 1, member of Administrators, full elevated token; where noted, tests also start a de-elevated child process holding the session shell's filtered standard token); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-sec
  date: 2026-11-19
sources: >
  Observations of our own test programs (client, local COM server, LocalSystem service, and de-elevated child client in one image) on the oracle machine above. Microsoft Learn: "CoInitializeSecurity function (combaseapi.h)", "CoSetProxyBlanket", "CoQueryProxyBlanket", "CoCopyProxy", "IClientSecurity interface (objidlbase.h)", "CoGetCallContext", "IServerSecurity interface (objidlbase.h)", "CoQueryClientBlanket", "CoImpersonateClient", "CoRevertToSelf", "EOLE_AUTHENTICATION_CAPABILITIES", "RPC_C_AUTHN_LEVEL_*", "RPC_C_IMP_LEVEL_*", "COM_RIGHTS_*", "AppID Key", "LaunchPermission", "AccessPermission", "Security in COM"; combaseapi.h, objidl.h, objidlbase.h, rpcdce.h, wtypes.h, winnt.h, winerror.h for constants and layouts. Google's updater and Chrome's elevation service: their own logs, registry changes, and PE import names from the survey (docs/windows/chrome-installer-plan.md, docs/windows/com-out-of-process-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Reads the authentication and impersonation settings (the security blanket) of a COM interface proxy. Delegates to the proxy manager's IClientSecurity::QueryBlanket. Every output parameter is optional.
interface:
  signature: "HRESULT CoQueryProxyBlanket(IUnknown *pProxy, DWORD *pwAuthnSvc, DWORD *pAuthzSvc, LPOLESTR *pServerPrincName, DWORD *pAuthnLevel, DWORD *pImpLevel, RPC_AUTH_IDENTITY_HANDLE *pAuthInfo, DWORD *pCapabilities)"
  forward: "ole32.dll!CoQueryProxyBlanket forwards to combase.dll!CoQueryProxyBlanket"
installer: "Companion to CoSetProxyBlanket and IClientSecurity for inspecting proxy security settings."
rules:
  local_proxy_defaults: "for any local cross-process proxy (class object from CoGetClassObject, its IUnknown, object from IClassFactory::CreateInstance or CoCreateInstance, before or after making calls): returns S_OK with pwAuthnSvc = 10 (RPC_C_AUTHN_WINNT), pAuthzSvc = 0 (RPC_C_AUTHZ_NONE), pAuthnLevel = 6 (RPC_C_AUTHN_LEVEL_PKT_PRIVACY), pImpLevel = 2 (RPC_C_IMP_LEVEL_IDENTIFY), pCapabilities = 0x1 (EOAC_MUTUAL_AUTH), pAuthInfo = NULL, and pServerPrincName a CoTaskMemAlloc-allocated wide string of the form <DOMAIN>\\<user> (containing a backslash and ending with the server's user name; caller frees with CoTaskMemFree)"
  optional_outputs: "every output pointer may be NULL: passing all NULL succeeds (S_OK), and passing any single output pointer succeeds (S_OK) and writes that value alone"
  after_set_blanket: "reflects changes set on that interface proxy by CoSetProxyBlanket or IClientSecurity::SetBlanket (see CoSetProxyBlanket)"
  dead_server: "continues to return S_OK and the proxy's blanket even after the server process has exited"
  non_proxy_and_null: "NULL pProxy returns E_INVALIDARG 0x80070057 and leaves all outputs untouched; a plain in-process object or an in-process COM class instance (such as CLSID_StdGlobalInterfaceTable) returns E_NOINTERFACE 0x80004002 and leaves all outputs untouched"
errors:
  invalid_argument: "E_INVALIDARG 0x80070057 (NULL pProxy)"
  no_interface: "E_NOINTERFACE 0x80004002 (object is not a proxy / lacks IClientSecurity)"
side_effects: "allocates *pServerPrincName via CoTaskMemAlloc when requested and non-NULL"
threading: "may be called from any thread allowed to use the proxy"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 1
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, each image acting as client and COM server (and where needed a child process running scenarios in isolation). Classes are registered under HKLM\SOFTWARE\Classes\CLSID\{B2A0xxxx-...} for elevated runs and HKCU\Software\Classes\CLSID\{B2A0xxxx-...} for standard-token runs (with a process-unique CLSID per run) and removed afterwards. Observations are HRESULTs, Win32 codes, blanket integers, booleans and domain/user comparisons, never raw process ids, thread ids, pointers or times.
not_covered: >
  remote (network) proxies, Kerberos/Negotiate SPNs, and non-NULL authentication identity handles.
