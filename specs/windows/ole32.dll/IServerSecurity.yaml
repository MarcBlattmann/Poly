# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/ole32.dll/IServerSecurity.yaml
id: windows/api/ole32.dll/IServerSecurity
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run by tools/pipeline/windows/poly-oracle.ps1 with -Token elevated (full administrator token, high integrity) and -Token standard (filtered administrator token, medium integrity, Administrators deny-only) in the interactive desktop session of the local account \"server\" (session 1); every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-com-sec
  date: 2026-11-19
sources: >
  Observations of our own test programs (client, local COM server, LocalSystem service, and de-elevated child client in one image) on the oracle machine above. Microsoft Learn: "CoInitializeSecurity function (combaseapi.h)", "CoSetProxyBlanket", "CoQueryProxyBlanket", "CoCopyProxy", "IClientSecurity interface (objidlbase.h)", "CoGetCallContext", "IServerSecurity interface (objidlbase.h)", "CoQueryClientBlanket", "CoImpersonateClient", "CoRevertToSelf", "EOLE_AUTHENTICATION_CAPABILITIES", "RPC_C_AUTHN_LEVEL_*", "RPC_C_IMP_LEVEL_*", "COM_RIGHTS_*", "AppID Key", "LaunchPermission", "AccessPermission", "Security in COM"; combaseapi.h, objidl.h, objidlbase.h, rpcdce.h, wtypes.h, winnt.h, winerror.h for constants and layouts. Google's updater and Chrome's elevation service: their own logs, registry changes, and PE import names from the survey (docs/windows/chrome-installer-plan.md, docs/windows/com-out-of-process-plan.md); no Microsoft or Google binary was decompiled or disassembled; Wine's and ReactOS's sources were not read.
summary: >
  Call-context interface ({0000013E-0000-0000-C000-000000000046}) returned by CoGetCallContext on a server thread serving an incoming COM call. Provides QueryBlanket (caller authentication details and DOMAIN\user name), ImpersonateClient, RevertToSelf and IsImpersonating.
interface:
  iid: "{0000013E-0000-0000-C000-000000000046}"
  vtable: "IUnknown (QueryInterface, AddRef, Release), QueryBlanket, ImpersonateClient, RevertToSelf, IsImpersonating"
installer: "Obtained via CoGetCallContext by COM servers to inspect caller identity and impersonate clients."
rules:
  query_blanket: "during a local cross-process call (activation or direct proxy call, in a LocalServer32 process or a LocalSystem service, from either an elevated or a standard filtered client, regardless of proxy blanket impersonation level): QueryBlanket returns S_OK with pAuthnSvc = 10 (RPC_C_AUTHN_WINNT), pAuthzSvc = 0 (RPC_C_AUTHZ_NONE), pServerPrincName = NULL, pAuthnLevel = 6 (RPC_C_AUTHN_LEVEL_PKT_PRIVACY), pImpLevel = 1, pCapabilities = 0x0, and pPrivs pointing to a COM-owned wide string (do not free) of the form <COMPUTERNAME>\\<client_user> (on a workgroup machine, domain equals the local computer name and user equals the client's user name). All output pointers are optional (passing all NULL or a subset returns S_OK). Does not carry a client PID"
  impersonate_and_is_impersonating: "IsImpersonating returns 0 (FALSE) before impersonation; ImpersonateClient returns S_OK, sets IsImpersonating to 1 (TRUE), and attaches an impersonation thread token (TokenType = 2) with the client's user SID, client's TokenSessionId, client's elevation/integrity (elevated client: TokenElevation = 1, TokenElevationType = 2, integrity 0x3000 High, Administrators member true; standard filtered client: TokenElevation = 0, TokenElevationType = 3, integrity 0x2000 Medium, Administrators member false), and TokenImpersonationLevel matching the call (activation: 2 SecurityImpersonation; direct call at default/IDENTIFY proxy blanket: 1 SecurityIdentification; direct call at IMPERSONATE: 2 SecurityImpersonation; direct call at DELEGATE: 3 SecurityDelegation)"
  revert_to_self: "RevertToSelf returns S_OK, sets IsImpersonating back to 0 (FALSE), and removes the thread impersonation token (OpenThreadToken then fails with ERROR_NO_TOKEN 1008). Calling RevertToSelf when not impersonating returns S_OK and leaves IsImpersonating = 0"
  no_nesting_and_interop: "calling ImpersonateClient twice returns S_OK both times (IsImpersonating = 1) and does not nest: a single RevertToSelf clears impersonation (IsImpersonating = 0), and a second RevertToSelf returns S_OK with IsImpersonating = 0. Impersonation state is shared across multiple IServerSecurity pointers for the same call (a second CoGetCallContext sees IsImpersonating = 1), and CoRevertToSelf reverts impersonation started by IServerSecurity::ImpersonateClient (IsImpersonating becomes 0)"
  identity_and_stale: "two CoGetCallContext calls in one call return the same pointer; QueryInterface answers IUnknown and IServerSecurity with the same pointer and refuses IMarshal and IClientSecurity (E_NOINTERFACE); once the call ends, calling QueryBlanket or ImpersonateClient on a retained pointer returns RPC_E_CALL_COMPLETE 0x80010117"
errors:
  call_complete: "RPC_E_CALL_COMPLETE 0x80010117 (on a stale pointer after the call has ended)"
  no_interface: "E_NOINTERFACE 0x80004002 (QueryInterface for anything other than IUnknown or IServerSecurity)"
side_effects: "ImpersonateClient attaches a thread impersonation token; RevertToSelf removes it"
threading: "per thread, valid only while the thread is serving the associated call"
ordering: ["ImpersonateClient before privileged or identity-checked work; RevertToSelf (or CoRevertToSelf) restores the thread to the process token"]
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each: local-server tests run under both -Token elevated and -Token standard (same-user LocalServer32 server); service tests run under -Token elevated with a LocalSystem service (CreateServiceW, AppID LocalService, CoInitializeSecurity admitting Everyone) called by both the elevated test and a de-elevated child client created with the interactive session shell's (explorer.exe) filtered token; out-of-call tests run across no-COM, STA and MTA threads. Classes and services use unique {B2A0xxxx-...} / PolyWsSecSvc* names and are cleaned up. Observations are HRESULTs, Win32 codes, blanket fields, token attributes and booleans, never raw process ids, thread ids or pointers.
not_covered: >
  automatic revert when a server returns without calling RevertToSelf, cloaking across chained calls, and remote DCOM callers.
