# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/crypt32.dll/CryptUnprotectMemory.yaml
id: windows/api/crypt32.dll/CryptUnprotectMemory
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed with a trace kit that logs arguments (polytrace-sync) on stage S4 (headless, http://example.com/ and https://www.iana.org/) on the owner's PC, plus the counts and failures of specs/windows/apps/chrome/traces/s4.trace.json (the committed traces have counts, not arguments, for these calls). Microsoft Learn: "CryptProtectMemory", "CryptUnprotectMemory", "CryptProtectData", "CryptUnprotectData", "Cryptographic Functions (DPAPI)"; wincrypt.h, winerror.h and winnt.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Decrypts a buffer in place. Chrome calls it 94 to 95 times with (buf, 32, 0). The cross-process rules are the point of this entry: a block protected with flag 0 (SAME_PROCESS) by the parent and given to a child process of the same user is NOT refused by the child: the call returns TRUE and the buffer is not the plaintext. Flags 1 (CROSS_PROCESS) and 2 (SAME_LOGON) restore the plaintext in the child. The parent can always undo its own protection. Other rules are in the CryptProtectMemory sheet.
interface:
  signature: "BOOL CryptUnprotectMemory(LPVOID data, DWORD length, DWORD flags)"
  result: "TRUE or FALSE"
chrome:
  calls: "95 calls in the browser, (buf, 32, 0) -> TRUE; used for each cookie / credential key read"
rules:
  same_process_flag_in_child: "protected with 0 in the parent, unprotect with 0 in a child: TRUE, last error untouched, plaintext NOT restored (the key is per process)"
  cross_process_flag_in_child: "protected with 1: unprotect with 1 in a child: TRUE, restored"
  same_logon_flag_in_child: "protected with 2: unprotect with 2 in a child: TRUE, restored"
  parent: "the parent unprotects its own blocks of all three flags: TRUE, restored"
  child_exit: "the child exits 0 after reporting through an inherited pipe"
errors:
  none: "the cross-process failure is silent (TRUE with garbage)"
side_effects: "modifies the buffer in place"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, WSA error codes, counts, flags and booleans, never socket or handle values, ports, addresses other than loopback, process ids, times or names of the machine. Every test is self-contained and offline: it binds its own listener on 127.0.0.1 or ::1 with port 0 (the system chooses the port, which is never printed) and talks to it from the same process (a thread of the test) or from a child (the test's own image started again with --child). Every wait is bounded (at most about 10 s) and nothing leaves the machine. The tests run in the SSH logon session of the oracle (session 0). The child is the test's own image started with --child; it receives the ciphertext as hexadecimal text on its command line and reports through an inherited pipe.
not_covered: >
  A child of another user or logon session, a child started before the parent protected (the key is not cached across processes).
