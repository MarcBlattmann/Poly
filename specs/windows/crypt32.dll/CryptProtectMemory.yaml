# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/crypt32.dll/CryptProtectMemory.yaml
id: windows/api/crypt32.dll/CryptProtectMemory
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s4
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: observed with a trace kit that logs arguments (polytrace-sync) on stage S4 (headless, http://example.com/ and https://www.iana.org/) on the owner's PC, plus the counts and failures of specs/windows/apps/chrome/traces/s4.trace.json (the committed traces have counts, not arguments, for these calls). Microsoft Learn: "CryptProtectMemory", "CryptUnprotectMemory", "CryptProtectData", "CryptUnprotectData", "Cryptographic Functions (DPAPI)"; wincrypt.h, winerror.h and winnt.h for constants and layouts. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed.
summary: >
  Encrypts a buffer in place for the process (flag 0, CRYPTPROTECTMEMORY_SAME_PROCESS), the logon session (2) or any process (1). Chrome's OS layer calls CryptProtectMemory once and CryptUnprotectMemory 94 times, always with a 32-byte buffer and flag 0, all TRUE. Observed: the length must be a non-zero multiple of 16 (else FALSE, 87); only those bytes change; the ciphertext differs from the plaintext and is the same for the same plaintext in the same process; the three flags give three different ciphertexts; flags 3, 0x10 and 0xFFFFFFFF are refused with 87, flag 4 is accepted by protect but cannot be undone (unprotect fails with 5); the call does not authenticate: unprotect of never-protected data or with other flags returns TRUE and garbage; a NULL buffer: 998.
interface:
  signature: "BOOL CryptProtectMemory(LPVOID data, DWORD length, DWORD flags); BOOL CryptUnprotectMemory(LPVOID data, DWORD length, DWORD flags)"
  result: "TRUE or FALSE"
chrome:
  calls: "CryptProtectMemory 9 calls (browser and network service), (buf, 32, 0) -> TRUE; CryptUnprotectMemory 95 calls in the browser, (buf, 32, 0) -> TRUE"
rules:
  chrome_form: "32 bytes, flag 0: TRUE, last error untouched, the buffer changes; unprotect restores it exactly"
  determinism: "the same plaintext protected again in the same process gives the same ciphertext"
  twice: "protecting the ciphertext again changes it again; one unprotect gives the first ciphertext back, the second the plaintext"
  lengths: "0, 1, 8, 15, 17, 31: FALSE, last error 87, buffer untouched; 16, 32, 48, 64: TRUE (and unprotect TRUE)"
  only_given_bytes: "protect with length 16 on a 64-byte buffer leaves the other 48 bytes unchanged"
  flags: "0, 1, 2: TRUE, ciphertext differs from plaintext, unprotect with the same flag restores; 3, 0x10, 0xFFFFFFFF: FALSE, 87, buffer untouched; 4: protect TRUE and changes the buffer, unprotect FALSE with last error 5 and the buffer not restored"
  three_flags: "the ciphertexts of flags 0, 1 and 2 for the same plaintext are pairwise different"
  mismatched_flags: "protect 0 / unprotect 2 and protect 1 / unprotect 0: TRUE, last error untouched, but the buffer is not restored"
  never_protected: "unprotect of data that was never protected: TRUE, last error untouched, the buffer changes"
  null_buffer: "NULL: FALSE, last error 998 (ERROR_NOACCESS)"
errors:
  bad_length_or_flags: "ERROR_INVALID_PARAMETER (87)"
  null: "ERROR_NOACCESS (998)"
  flag_4_unprotect: "ERROR_ACCESS_DENIED (5)"
side_effects: "modifies the buffer in place"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are results, WSA error codes, counts, flags and booleans, never socket or handle values, ports, addresses other than loopback, process ids, times or names of the machine. Every test is self-contained and offline: it binds its own listener on 127.0.0.1 or ::1 with port 0 (the system chooses the port, which is never printed) and talks to it from the same process (a thread of the test) or from a child (the test's own image started again with --child). Every wait is bounded (at most about 10 s) and nothing leaves the machine. The tests run in the SSH logon session of the oracle (session 0).
not_covered: >
  Keys: whether the key is per process, per boot, or derived from the logon is not observable except through the child test of CryptUnprotectMemory.
