# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/combase.dll/WindowsCreateStringReference.yaml
id: windows/api/combase.dll/WindowsCreateStringReference
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-6
  date: 2026-11-16
sources: >
  Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). The functions are looked up in combase.dll at run time with LoadLibrary and GetProcAddress. Microsoft Learn pages for each function; public SDK headers winstring.h, roapi.h, inspectable.h, activation.h, restrictederrorinfo.h, oleauto.h and windows.ui.viewmanagement.h (interface identifiers and the order of methods only). The apps that stop on these calls (Qt 6 platform plugins, Firefox) were only run on Poly to learn which calls they make; nothing of them, of Windows or of Wine was read or disassembled.
summary: >
  Makes a fast-pass HSTRING that points at the caller's characters, with the caller's HSTRING_HEADER as the handle. Nothing is copied; the characters must stay valid and must be NUL-terminated at index `length`.
interface:
  signature: "HRESULT WindowsCreateStringReference(PCWSTR sourceString, UINT32 length, HSTRING_HEADER *hstringHeader, HSTRING *string)"
rules:
  reference: "for \"abc\", 3: S_OK; the handle is the address of the header, WindowsGetStringRawBuffer returns the caller's own pointer, length 3. WindowsDeleteString on it is S_OK and does nothing (the string still reads afterwards)."
  terminator: "the character at index `length` must be NUL: \"abXc\" with length 2 gives 0x80000017 (and *string = NULL); so does a non-NULL source with length 0 whose first character is not NUL (\"abc\", 0). A source whose first unit is NUL with length 0 gives S_OK and a NULL handle."
  null_source: "NULL with length 0: S_OK, *string = NULL. NULL with length 2: E_POINTER (0x80004003)."
  bad_pointers: "a NULL header or a NULL result pointer: E_INVALIDARG (0x80070057)."
  embedded_nul: "\"a NUL b\" with length 3 (NUL-terminated at 3) is accepted and reported as having an embedded NUL."
  duplicate: "WindowsDuplicateString of a reference makes a heap copy: a different handle, a different characters pointer, the same text. A reference compares equal to a heap string with the same text."
errors:
  not_terminated: "0x80000017"
  null_source_with_length: "E_POINTER 0x80004003"
  null_header_or_out: "E_INVALIDARG 0x80070057"
side_effects: "none"
threading: "may be called from any thread; the header belongs to the caller"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test kept in three files that make the same calls and write every third observation line. combase.dll is reached through LoadLibraryW and GetProcAddress (it is not on the pipeline's import list); each file declares what it calls from Learn's prototypes. Observations are HRESULTs, booleans, lengths and text, never handles or addresses; the interface tables are used through their documented slot order.
not_covered: >
  Headers reused for a second string while the first is in use; strings of more than 64 KiB.
