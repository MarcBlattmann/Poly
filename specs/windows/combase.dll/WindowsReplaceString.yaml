# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/combase.dll/WindowsReplaceString.yaml
id: windows/api/combase.dll/WindowsReplaceString
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-apps-6
  date: 2026-11-16
sources: >
  Observations of our own test programs on the oracle machine (every test ran at least twice with identical output). The functions are looked up in combase.dll at run time with LoadLibrary and GetProcAddress. Microsoft Learn pages for each function; public SDK headers winstring.h, roapi.h, inspectable.h, activation.h, restrictederrorinfo.h, oleauto.h and windows.ui.viewmanagement.h (interface identifiers and the order of methods only). The apps that stop on these calls (Qt 6 platform plugins, Firefox) were only run on Poly to learn which calls they make; nothing of them, of Windows or of Wine was read or disassembled.
summary: >
  Replaces every occurrence of a string inside another; WindowsTrimStringStart and WindowsTrimStringEnd remove any of a set of characters from one end.
interface:
  signature: "HRESULT WindowsReplaceString(HSTRING string, HSTRING stringReplaced, HSTRING stringReplaceWith, HSTRING *newString)"
rules:
  replace: "\"hello\" with \"l\" replaced by \"LL\" gives \"heLLLLo\"; with no match the result is a new handle with the same text (not the original handle); replacing by NULL deletes the matches (\"heo\"); replacing \"hello\" by \"l\" in \"hello\" gives \"l\"."
  trim: "WindowsTrimStringStart(\"  x y  \", \" \") = \"x y  \"; WindowsTrimStringEnd = \"  x y\"; nothing to trim returns the same handle; a string made only of trim characters gives S_OK and NULL; the second argument is a set of characters (\"lh\" trims the \"h\" from the start of \"hello\", leaving \"ello\")."
  null_arguments: "a NULL match string (replace) and a NULL or empty trim set give E_INVALIDARG (0x80070057) with a NULL result; a NULL source string gives S_OK and NULL."
errors:
  null_match_or_trim_set: "E_INVALIDARG 0x80070057"
side_effects: "allocates memory the caller frees with WindowsDeleteString"
threading: "any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file per test kept in three files that make the same calls and write every third observation line. combase.dll is reached through LoadLibraryW and GetProcAddress (it is not on the pipeline's import list); each file declares what it calls from Learn's prototypes. Observations are HRESULTs, booleans, lengths and text, never handles or addresses; the interface tables are used through their documented slot order.
not_covered: >
  Overlapping matches, very long strings.
