# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/dwrite.dll/DWriteCreateFactory
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64, dwrite.dll 10.0.26100.1"
  machine: "homeserver2 (real hardware, Windows 11 \"Core\" edition with the stock font set, so only some of the common font families are installed), tests run by tools/pipeline/windows/poly-oracle.ps1 in the SSH session (no visible desktop needed), two runs each, identical"
  observed_by: spec-win-dwrite
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn: the DirectWrite reference pages of the interfaces and methods named
  here ("Programming Guide for DirectWrite", "Font Collections", "Custom
  Font Sets"); dwrite.h, dwrite_1.h, dwrite_2.h, dwrite_3.h for constants,
  structure layouts and the order of the methods in the vtables; winerror.h
  for the HRESULTs; the OpenType specification (head, hhea, hmtx, maxp,
  cmap, glyf, loca, name, OS/2, post) for the font tables the tests write.
  Wine's tests were not read.
summary: >
  Creates a DirectWrite factory of the requested interface. A shared factory
  (type 0) is one object per process; an isolated factory (type 1) is a new
  object with its own state (loader registrations, caches) every time. Every
  factory interface up to IDWriteFactory7 (and IUnknown) can be requested,
  in both types, and every factory object answers QueryInterface for the
  whole chain.
interface:
  signature: "HRESULT DWriteCreateFactory(DWRITE_FACTORY_TYPE factoryType, REFIID iid, IUnknown** factory)"
  DWRITE_FACTORY_TYPE: "DWRITE_FACTORY_TYPE_SHARED 0, DWRITE_FACTORY_TYPE_ISOLATED 1 (dwrite.h)"
  interfaces: "IDWriteFactory .. IDWriteFactory7 are version-ordered extensions of one object: IDWriteFactory (b859ee5a-d838-4b5b-a2e8-1adc7d93db48), IDWriteFactory1 .. 7 (dwrite_1.h .. dwrite_3.h)"
  hresults: "HRESULT values: S_OK 0; E_FAIL 0x80004005; E_NOINTERFACE 0x80004002; E_INVALIDARG 0x80070057; ERROR_FILE_NOT_FOUND as HRESULT 0x80070002; ERROR_INSUFFICIENT_BUFFER as HRESULT 0x8007007A; DWRITE_E_FILEFORMAT 0x88985000; DWRITE_E_NOFONT 0x88985002; DWRITE_E_FILENOTFOUND 0x88985003; DWRITE_E_FILEACCESS 0x88985004; DWRITE_E_ALREADYREGISTERED 0x88985006; DWRITE_E_CACHEFORMAT 0x88985007 (winerror.h)"
rules:
  all_iids: "each of IDWriteFactory, IDWriteFactory1, 2, 3, 4, 5, 7 and IUnknown can be asked for in either type and gives S_OK and a non-null pointer; the factory answers QueryInterface for all of them"
  same_pointer: "QueryInterface for any IDWriteFactoryN returns the same pointer as the object it was asked of (one vtable chain: the interface pointers of IDWriteFactory..7 are all equal); QueryInterface for IUnknown returns a different pointer (the IUnknown identity) which asks back for IDWriteFactory.. and gets pointers different from it"
  unrelated: "QueryInterface for IDWriteFont or IDWriteFontFace on a factory: E_NOINTERFACE (0x80004002) and a null output pointer"
  shared: "two calls with type 0 (any IDWriteFactoryN) return the same object (same pointer); the object asked for as IDWriteFactory and as IDWriteFactory3 is one pointer; it survives all references being released and a later call still works"
  isolated: "two calls with type 1 return different objects, and different from the shared one; a new isolated factory has reference count 1 (AddRef returns 2, then Release 1); QueryInterface adds a reference to the same object (AddRef returns 3, Release 2), releasing the QueryInterface reference gives 1 and the creation reference 0"
  invalid_type: "a factory type other than 0 and 1 (2, 3, 0x80000000, 0xFFFFFFFF): E_INVALIDARG (0x80070057); the output pointer is set to null"
  unknown_iid: "an interface id that is not a factory interface (IDWriteFont, IDWriteFontFace, IDWriteFontCollection, a random GUID): E_NOINTERFACE (0x80004002); the output pointer is set to null; no factory is created"
errors:
  bad_type: "E_INVALIDARG for an unknown factory type, output null"
  bad_iid: "E_NOINTERFACE for a non-factory interface id, output null"
side_effects: "none beyond the rules above"
threading: "the objects are used from one thread; the shared factory and the system collection may be used from several, which is not tested"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle, except the first use of a system collection or of a file (milliseconds)"
  guarantees: none
tests:
  visible: 2  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing dwrite.dll and kernel32.dll by name. Every
  test carries its own declarations: the COM vtable layouts (from the SDK
  headers), the enumeration constants and a writer for small TrueType fonts.
  The test fonts are written by the test itself (eight glyphs: .notdef,
  space, a square, a triangle, a rounded shape, a small box, a box below the
  baseline and a box for a code point outside the BMP) with names, weights,
  widths, styles and metrics chosen per test, and are served to DirectWrite
  from memory through loader objects the test implements
  (IDWriteFontFileLoader with its stream, IDWriteFontCollectionLoader with
  its enumerator) or, where a path is the point, from a file the test writes
  beside itself. So the results do not depend on the oracle's font list.
  Tests of the system collection print or check only what every Windows
  installation provides (Arial, Segoe UI, Times New Roman and similar
  families exist; their standard faces exist; relations between values) and
  never the metrics or file names of those fonts. The eight font slots, the
  loaders and the calls the loaders receive are in the test file.
not_covered: >
  NULL iid or NULL output pointer (the oracle would crash); several threads
  creating factories. the system collection's full font list; downloadable
  (remote) fonts; collections with font files that are TrueType collections
  or CFF fonts; variable fonts; colour fonts; several threads; failure
  injection inside the loaders; behaviour of different Windows versions (the
  oracle is one build).
