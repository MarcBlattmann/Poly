# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/<os>/<component>/<symbol>.yaml
id: windows/api/dwrite.dll/IDWriteFontFallback.MapCharacters
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9711), x64, dwrite.dll 10.0.26100.1"
  machine: "homeserver2 (real hardware, Windows 11 \"Core\" edition with the stock font set, so only some of the common font families are installed), tests run by tools/pipeline/windows/poly-oracle.ps1 in the SSH session (no visible desktop needed), two runs each, identical"
  observed_by: spec-win-dwrite
  date: 2026-11-09
sources: >
  Observations of our own test programs on the machine above. Microsoft
  Learn: the DirectWrite reference pages of the interfaces and methods named
  here ("Programming Guide for DirectWrite", "Font Collections", "Custom
  Font Sets"); dwrite.h, dwrite_1.h, dwrite_2.h, dwrite_3.h for constants,
  structure layouts and the order of the methods in the vtables; winerror.h
  for the HRESULTs; the OpenType specification (head, hhea, hmtx, maxp,
  cmap, glyf, loca, name, OS/2, post) for the font tables the tests write.
  Wine's tests were not read.
summary: >
  Chooses a font for the start of a text and says for how many UTF-16 units
  it holds. The system fallback (GetSystemFontFallback) picks, for text the
  base family does not cover, a system font that has the characters: the
  returned run is the longest prefix one font covers; a code point no font
  has gives a null font with mappedLength of the code point (1 or 2 units).
  A custom fallback (built with IDWriteFontFallbackBuilder) maps code point
  ranges to families of a collection with a scale. The analysis source
  (IDWriteTextAnalysisSource) is implemented by the application and queried
  for the text and its locale.
interface:
  signature: "HRESULT IDWriteFontFallback::MapCharacters(IDWriteTextAnalysisSource* analysisSource, UINT32 textPosition, UINT32 textLength, IDWriteFontCollection* baseFontCollection, const WCHAR* baseFamilyName, DWRITE_FONT_WEIGHT baseWeight, DWRITE_FONT_STYLE baseStyle, DWRITE_FONT_STRETCH baseStretch, UINT32* mappedLength, IDWriteFont** mappedFont, FLOAT* scale); IDWriteFactory2::GetSystemFontFallback(IDWriteFontFallback**)"
  hresults: "HRESULT values: S_OK 0; E_FAIL 0x80004005; E_NOINTERFACE 0x80004002; E_INVALIDARG 0x80070057; ERROR_FILE_NOT_FOUND as HRESULT 0x80070002; ERROR_INSUFFICIENT_BUFFER as HRESULT 0x8007007A; DWRITE_E_FILEFORMAT 0x88985000; DWRITE_E_NOFONT 0x88985002; DWRITE_E_FILENOTFOUND 0x88985003; DWRITE_E_FILEACCESS 0x88985004; DWRITE_E_ALREADYREGISTERED 0x88985006; DWRITE_E_CACHEFORMAT 0x88985007 (winerror.h)"
rules:
  system_runs: "with the system fallback and a base family \"Arial\" (base collection null): Latin text \"Hello\": one run of 5; \"A\" + two CJK characters + \"A\": runs of 1, 2, 1; CJK, Arabic, Hebrew, Greek, Cyrillic, Devanagari, Thai text: one run of the whole text, the font covers the first character; an emoji (a surrogate pair) maps with length 2 and the font covers the code point; Latin + emoji + Latin: 1, 2, 1; a math symbol U+2211: length 1. Private use U+E000 and the unassigned U+0378: S_OK, mappedLength 1, null font"
  base_family: "with the base collection null the base family is ignored: the system fallback returned a Windows UI font (Segoe UI for Latin, Greek, Cyrillic, Arabic, Hebrew and math, Yu Gothic UI for CJK, Nirmala UI for Devanagari, Leelawadee UI for Thai, Segoe UI Emoji for emoji) even with base family \"Arial\", and a non-existent or empty base family changed nothing; with the system collection given as the base collection and base family \"Arial\", Arial is returned for the text it covers (Latin, Arabic, Hebrew, Greek, Cyrillic, math symbol and the Latin parts of mixed text) and the fallback font for the rest (CJK, Devanagari, Thai, emoji)"
  scale: "the scale returned is 1.0 for every system mapping"
  custom: "a fallback with A-C and U+20AC mapped to \"PolyTest Alpha\" (scale 1) and U+00E9 to \"PolyTest Beta\" (scale 0.5) in the custom collection: \"ABC\" one run of 3 (Alpha Regular); \"ABCD\": a run of 3 then \"D\" with length 1 and a null font (S_OK); \"A e-acute euro\": three runs of 1 with scales 1.0, 0.5, 1.0; \"D\": length 1, null font; the base family given (PolyTest Alpha or Beta) does not change those results; the font returned is the Regular face (400, normal) of the target family"
  copy: "a builder that took the mappings of a fallback (AddMappings) maps \"AB\" like the original: one run of 2"
errors:
  none: "a code point without a font is a successful call with a null font"
side_effects: "none beyond the rules above"
threading: "the objects are used from one thread; the shared factory and the system collection may be used from several, which is not tested"
ordering: []
timing:                                       # envelopes, never exact values
  typical: "well under a millisecond per call on the oracle, except the first use of a system collection or of a file (milliseconds)"
  guarantees: none
tests:
  visible: 1  # count in <symbol>.tests/
  held_out: 1  # count kept by the diff runner
building_tests: >
  Rust tests (ADR 0075) importing dwrite.dll and kernel32.dll by name. Every
  test carries its own declarations: the COM vtable layouts (from the SDK
  headers), the enumeration constants and a writer for small TrueType fonts.
  The test fonts are written by the test itself (eight glyphs: .notdef,
  space, a square, a triangle, a rounded shape, a small box, a box below the
  baseline and a box for a code point outside the BMP) with names, weights,
  widths, styles and metrics chosen per test, and are served to DirectWrite
  from memory through loader objects the test implements
  (IDWriteFontFileLoader with its stream, IDWriteFontCollectionLoader with
  its enumerator) or, where a path is the point, from a file the test writes
  beside itself. So the results do not depend on the oracle's font list.
  Tests of the system collection print or check only what every Windows
  installation provides (Arial, Segoe UI, Times New Roman and similar
  families exist; their standard faces exist; relations between values) and
  never the metrics or file names of those fonts. The eight font slots, the
  loaders and the calls the loaders receive are in the test file.
not_covered: >
  base weight/style/stretch influence on the choice; locale-specific
  mappings (Han unification); number substitution; the system fallback's
  font names (Windows-specific: Segoe UI, Yu Gothic UI, Nirmala UI,
  Leelawadee UI, Segoe UI Emoji on the oracle). the system collection's full
  font list; downloadable (remote) fonts; collections with font files that
  are TrueType collections or CFF fonts; variable fonts; colour fonts;
  several threads; failure injection inside the loaders; behaviour of
  different Windows versions (the oracle is one build).
