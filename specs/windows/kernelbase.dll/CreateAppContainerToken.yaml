# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/kernelbase.dll/CreateAppContainerToken.yaml
id: windows/api/kernelbase.dll/CreateAppContainerToken
oracle:
  os: "Windows 11 Home 25H2 (build 26200.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer: not joined to a domain), tests run over SSH by tools/pipeline/windows/poly-oracle.ps1 in the SSH logon session (session 0, no interactive desktop) as the local account \"server\" (member of Administrators) with its elevated administrator token; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-chrome-win-s2b
  date: 2026-11-15
sources: >
  Observations of our own test programs on the machine above. Chrome's calls: the counts and failures of specs/windows/apps/chrome/traces/s2.trace.json and s2-sandboxed.trace.json (the committed traces have counts, not arguments, for these calls) and section 4 and 4a of specs/windows/apps/chrome/gap-map.md. Microsoft Learn and the SDK headers winnt.h (SECURITY_CAPABILITIES, token classes, S-1-15-2 and S-1-15-3 constants), userenv.h, securityappcontainer.h, securitybaseapi.h, winerror.h and mdmregistration.h. Wine's tests were not read. No Microsoft or Google binary was decompiled or disassembled; nothing of Chrome is committed. The same token as NtCreateLowBoxToken makes (an ntdll export that Chrome resolves too); only the effects of CreateAppContainerToken are specified.
summary: >
  Makes an AppContainer (lowbox) primary token from an existing token, the container's SID and capability SIDs. Chrome's browser resolves it by name before it starts its sandbox targets (S2: 1 GetProcAddress) and the S2 run on Poly stops there. The signature is inferred, not documented: kernelbase.dll exports the name, Chrome's browser process resolves it by name (GetProcAddress in the S2 trace) and the tests call it through the pointer; the argument roles were found by calling it with other argument shapes (a small integer in a pointer slot crashes it, which shows the slot is a pointer that is read). No Microsoft binary was decompiled or disassembled, only called. Shape: BOOL CreateAppContainerToken(HANDLE source, SECURITY_CAPABILITIES *caps, HANDLE *out): TRUE and a handle in *out, or FALSE with a last error. The result is a primary token with TokenIsAppContainer = 1, the container SID as TokenAppContainerSid, an AppContainerNumber the system assigns per SID, Low integrity, the source's user and groups, a reduced privilege set and the capabilities as given. Access checks against it need the container's SID or ALL APPLICATION PACKAGES in the descriptor in addition to the ordinary entries (two passes); a child started with it (CreateProcessAsUserW, the way Chrome's broker does) runs as a container.
interface:
  signature: "BOOL CreateAppContainerToken(HANDLE source_token, PSECURITY_CAPABILITIES caps, PHANDLE new_token)"
  result: "TRUE (1) with *out set; FALSE (0) with the last error set and *out left alone; the last error is not touched on success"
chrome:
  calls: "1 GetProcAddress(kernelbase.dll, \"CreateAppContainerToken\") in the browser; the S2 trace has 1 DeriveAppContainerSidFromAppContainerName for the container SID"
rules:
  source_token: "needs TOKEN_DUPLICATE and TOKEN_QUERY (a token with only one of them: FALSE, error 5); NULL means the calling process's token (works, same result); an invalid handle value or -1: error 6; a primary token or an impersonation token of impersonation level 2 or 3: works; identification or anonymous level: error 1346 (ERROR_BAD_IMPERSONATION_LEVEL); the result is always a primary token (type 1)"
  container_sid: "must be S-1-15-2 with exactly 8 sub-authorities (a package SID, as DeriveAppContainerSidFromAppContainerName makes); any other SID (Administrators, S-1-15-2-1 ALL APPLICATION PACKAGES, a capability SID S-1-15-3-x, 7, 9 or 13 sub-authorities, S-1-15-3 with 8): FALSE, error 4250 (ERROR_NOT_APPCONTAINER); 12 sub-authorities (a child container SID): FALSE, error 2 here (no parent container); a SID derived from a name works whether or not a profile or a registration exists, and after a profile is deleted; a NULL SID pointer faults (access violation, seen once by hand, not tested)"
  capabilities: "count 0 with a NULL list; or count n with a list of n entries (SID + attributes): a count with a NULL list, and a non-zero list with count 0: FALSE, error 87; every capability must be a capability SID (S-1-15-3-...): Everyone or ALL APPLICATION PACKAGES as a capability: error 87; the same capability twice: error 87; 40 distinct capabilities work; the attributes are kept as given (0x4 in the tests; 0x0, 0x10 and 0x40000000 were read back unchanged in a hand probe); the reserved field is not checked (5 works)"
  result_token: "TokenIsAppContainer 1 (source 0), TokenAppContainerSid = the given SID (48 bytes: with a buffer of 8 bytes GetTokenInformation fails with 122 and asks for 48), TokenIsSandboxed 1, TokenCapabilities = the given list (attributes as given), integrity Low (0x1000) whatever the source's (High, Low or Untrusted), TokenMandatoryPolicy 1 (source 3), elevation type as the source's, user, owner, primary group and session as the source's, the groups of the source (all of them, with the same attributes; only the integrity label differs) also with capabilities, TokenIsRestricted as the source's (a restricted source gives a restricted container token), TokenIsLessPrivilegedAppContainer: query fails with 87"
  privileges: "the token keeps SeChangeNotifyPrivilege (23, enabled, default) and SeIncreaseWorkingSetPrivilege (33) if the source has them: two privileges from an elevated administrator's token (24 privileges), one (SeChangeNotifyPrivilege) from a source made with DISABLE_MAX_PRIVILEGE"
  number: "TokenAppContainerNumber is 0 for an ordinary token and a non-zero number that the system assigns per container SID: the same SID gives the same number every time (also from an impersonation copy, from a restricted source, and after the profile is deleted); another SID gives another number; a number handed out later is larger than an earlier one (the numbers themselves are not part of the specification)"
  copies: "DuplicateTokenEx of the token (as an impersonation token) keeps TokenIsAppContainer, the SID and the number"
  access_checks: "AccessCheck(MAXIMUM_ALLOWED) with an impersonation copy: a DACL with only Everyone: denied (5) for a container token (granted 0), allowed for the ordinary token; Everyone plus ALL APPLICATION PACKAGES (AC): allowed; AC alone: denied (the ordinary entries must pass too); the container's own SID alone: denied; Everyone plus the container's own SID: allowed; Everyone plus another container's SID: denied; Everyone plus a capability: denied for a container token without it and allowed for one made with it; Everyone plus AC plus the capability: allowed for both; Everyone plus ALL RESTRICTED APPLICATION PACKAGES (S-1-15-2-2): allowed (through Everyone: the entry does not matter for a non-LPAC container); a deny entry for the container's own SID in front of Everyone and AC: allowed (the container SID is not an ordinary group of the token); a deny entry for AC: denied; Everyone full control and AC read only: granted 0x120089 (read) for the container, full for the ordinary token; Administrators plus AC: allowed (the container token keeps the groups); SYSTEM plus AC: denied for both (the ordinary entries do not match)"
  mandatory_label: "unlike a Low integrity token that is no container, the container token is not stopped by a Medium no-write-up label or by the default label of an object without one (write, delete and write-DAC requests are allowed with Everyone and AC entries); a High no-read-up label denies a read to the container token (as to the plain Low token)"
  objects: "a mutex or a file made with a descriptor and opened while a thread impersonates the container token: Everyone only: error 5 for the container (opened for the ordinary token); Everyone plus AC: opened; SYSTEM, Administrators and the container's SID: opened"
  child_process: "CreateProcessAsUserW(container primary token, image, ...) with the SID's profile absent or present starts the child; the child's own token is the container token (TokenIsAppContainer 1, number non-zero, TokenIsSandboxed 1, integrity Low, the SID, capabilities as given); the image file is opened by the creator, so a container that is not allowed to read the file still starts from it; a handle inherited through an anonymous pipe works; in the child GetAppContainerNamedObjectPath(NULL, NULL) is its object directory, a mutex Local\\x and Global\\x can be created, a file with Everyone read only (no AC entry) is refused (5) and one with an AC entry opens, HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion and HKCU\\Software open with read access (HKCU is the container's own); CreateProcessW with the PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES attribute (0x20009, a SECURITY_CAPABILITIES of 32 bytes, with or without capabilities) starts the same child but needs the profile to exist (CreateAppContainerProfile): without it CreateProcessW fails with error 2"
errors:
  invalid_parameter: "87 for capability list problems"
  access_denied: "5 for a source token without TOKEN_DUPLICATE and TOKEN_QUERY"
  invalid_handle: "6"
  bad_impersonation_level: "1346"
  not_appcontainer: "4250 for a SID that is not a package SID"
  not_found: "2 for a child container SID without a parent"
side_effects: "allocates a token; the first token of a SID makes the system assign its AppContainerNumber"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "well under a millisecond per call on the oracle"
  guarantees: none
tests:
  visible: 8
  held_out: 4
building_tests: >
  Rust tests (ADR 0075), one file per test, each with its own declarations (Learn prototypes, SDK header constants). Observations are statuses, error codes, counts and booleans, never handles, process ids, times or names of the machine. A test that needs a second process starts its own image again with CreateProcessW or CreateProcessAsUserW and the arguments --child <args>; the child reports through an inherited anonymous pipe or through its exit code and is ended by the test (it also ends by itself after about 10 s). Every wait is bounded. The tests run in the SSH logon session of the oracle (session 0, a service window station): objects they create have names of their own (polyws_*, polydesk_*), the process's own station name is never printed. AppContainer profiles and registrations the tests create (names polys2b.*) are deleted again at the end of each test; where a test needs the registry mapping it reads HKCU\Software\Classes\Local Settings\Software\Microsoft\Windows\CurrentVersion\AppContainer\Mappings\<SID text> (values Moniker and DisplayName). SIDs derived from the tests' own names are printed (they are the same on every machine); the user's, the logon and the machine's SIDs and the numbers the system hands out (AppContainerNumber) are never printed, only compared. CreateAppContainerToken is resolved with GetProcAddress on kernelbase.dll. Access checks use AccessCheck with the file generic mapping and SDDL descriptors with explicit file rights (FA, FR), owner and group SYSTEM. The child process test copies its own image into a directory it creates with a descriptor that gives the AppContainer read and execute, removes everything afterwards.
not_covered: >
  NtCreateLowBoxToken itself (arguments not probed), a NULL SECURITY_CAPABILITIES (not tried), LPAC tokens (capability lpacCom etc. as the container's capabilities were not used in access checks), child container SIDs with a parent, impersonation of the token by a thread of the process that created it (done only through AccessCheck and two object opens), tokens of non-administrators, the interactive session (object directory names differ there), network access of the container (capabilities internetClient etc. have no effect that the tests can see without a network), job and desktop interplay, TokenSecurityAttributes.
