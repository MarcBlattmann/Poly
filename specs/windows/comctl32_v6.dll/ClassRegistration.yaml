# Spec sheet. Describes behaviour only: no code, no internals.
# Path: specs/windows/comctl32_v6.dll/ClassRegistration.yaml
id: windows/api/comctl32_v6.dll/ClassRegistration
oracle:
  os: "Windows 11 Home 26H2 (build 26300.9974), x64"
  machine: "homeserver2 (real hardware, a workgroup computer), tests run by tools/pipeline/windows/poly-oracle.ps1 over SSH (session 0, the non-interactive window station: windows and messages work, nothing is visible, no input) as the local account \"server\"; every test program carries a manifest that asks for Microsoft.Windows.Common-Controls 6.0.0.0 (an RT_MANIFEST resource), so it gets the side-by-side comctl32 version 6; every test ran at least twice with identical output, each run in a fresh scratch directory"
  observed_by: spec-win-comctl6-init
  date: 2026-11-20
sources: >
  Observations of our own test programs on the oracle machine above, every one carrying a manifest (an RT_MANIFEST resource) that asks for Microsoft.Windows.Common-Controls 6.0.0.0 (publicKeyToken 6595b64144ccf1df, processorArchitecture *): the programs run with the side-by-side comctl32 version 6, the way Google's updater.exe, Chrome and most current installers do. The same programs built for 32-bit x86 (i686) and run on the same machine (WOW64) printed the same observation files line for line except for one value, named below. Microsoft Learn: "InitCommonControlsEx function (commctrl.h)", "INITCOMMONCONTROLSEX structure", "Common Control Versions", "Enabling Visual Styles", "DllGetVersion function", "DLLVERSIONINFO structure", "Progress Bar Control Reference", "Button Control Reference", "Edit Control Reference", "Subclassing Controls", "SetWindowTheme function (uxtheme.h)", "GetWindowTheme function"; commctrl.h, winuser.h, shlwapi.h, uxtheme.h, winerror.h for constants and layouts. docs/windows/updater-b7 (the coordinator's finding): the updater's UI thread calls InitCommonControlsEx({8, 0x4020}); Poly returned FALSE and the progress-bar window could not be created. No Wine or ReactOS source was read and no Microsoft binary was decompiled or disassembled.
summary: >
  Which window classes exist in a process with a version 6 manifest, and when: all the common-control classes, from the moment comctl32 is loaded, with no InitCommonControls* call at all; the library is loaded by the program's first window if the program does not import it.
interface:
  signature: "behaviour of CreateWindowExW, GetClassInfoExW and LoadLibraryW for the classes of comctl32 version 6"
rules:
  classes: "with comctl32 loaded and no call: a window can be created, GetClassInfoExW (no module) finds the class, and GetClassNameW of the window is the name asked for, for each of msctls_progress32, SysListView32, SysTreeView32, ToolbarWindow32, msctls_statusbar32, SysTabControl32, msctls_trackbar32, msctls_updown32, ReBarWindow32, SysHeader32, tooltips_class32, SysAnimate32, msctls_hotkey32, SysDateTimePick32, SysMonthCal32, ComboBoxEx32, SysIPAddress32, SysPager, NativeFontCtl and SysLink; ReaderModeCtl and a made-up name do not exist (CreateWindowExW fails with ERROR_CANNOT_FIND_WND_CLASS 1407, GetClassInfoExW finds nothing)"
  loaded_when: "a program with the manifest that does not import comctl32 does not have it loaded at the start; once it has made its first window (a system class: STATIC) comctl32 is loaded and is the side-by-side version 6 (the path contains microsoft.windows.common-controls_6595b64144ccf1df_6); the common-control classes can be created then, with no call; LoadLibraryW(\"comctl32.dll\") returns the same module, which exports DllGetVersion and InitCommonControlsEx (and InitCommonControlsEx(0x4020) through GetProcAddress is TRUE)"
  icc_changes_nothing: "InitCommonControlsEx with each single ICC_ bit and with 0x4020 changes nothing about which classes can be created (twelve of them were checked before and after: all twelve, every time)"
errors:
  no_such_class: "ERROR_CANNOT_FIND_WND_CLASS (1407) from CreateWindowExW for a class that does not exist"
side_effects: "none"
threading: "may be called from any thread"
ordering: []
timing:
  typical: "loading comctl32 at the first window takes a few milliseconds"
  guarantees: none
tests:
  visible: 2
  held_out: 1
building_tests: >
  Rust tests (ADR 0075), one file each, importing comctl32.dll (when the test uses it), user32.dll and kernel32.dll by name (the subclass tests bind comctl32's functions by the ordinals the updater uses, 410 to 413); uxtheme.dll is loaded at run time with LoadLibraryW. Each test carries the manifest resource of version 6.0.0.0 of the common controls (written as data in the test's source with global_asm!, the way the resource tests carry menus and icons), so the program runs with the side-by-side comctl32 6.x; a Poly that decides the version from the manifest of the process passes them, one that treats every process as version 5.82 does not. Windows are created in session 0 (nothing is visible); controls are children of a plain window the test makes. Observations are results, window styles, class names and relations; no line holds a handle, an address, a path or a time. The 32-bit builds (not part of the pipeline, which builds 64-bit programs) gave the same lines.
not_covered: >
  Painting (the oracle session is not interactive: no WM_PAINT, nothing is drawn, visual styles are not active: IsThemeActive is FALSE), mouse and keyboard input, the controls' look and size metrics, DPI, a program with no manifest (version 5.82: see the sheets of comctl32.dll), a manifest of another version, ComCtl32 version 6 loaded by a DLL rather than by the program, and a NULL pointer for InitCommonControlsEx (not tried).
