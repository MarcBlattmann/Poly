<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Poly's font configuration, installed as /etc/fonts/fonts.conf on the root
  disk (ADR 0105). Written to the format of the fontconfig user
  documentation, so that the real fontconfig (when GTK and Qt arrive) reads
  it as well as poly-font's matcher (crates/poly-font/src/fc).

  The font store: /usr/share/fonts/<format>/<family>/, the bundled DejaVu
  fonts in /usr/share/fonts/truetype/dejavu/. Windows programs see the same
  files in C:\Windows\Fonts.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Names programs ask for that Poly has no font of: the generic family
       they belong to. -->
  <alias>
    <family>Arial</family>
    <family>Helvetica</family>
    <family>Verdana</family>
    <family>Tahoma</family>
    <family>Segoe UI</family>
    <family>Bitstream Vera Sans</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <family>Times</family>
    <family>Georgia</family>
    <family>Bitstream Vera Serif</family>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Courier New</family>
    <family>Courier</family>
    <family>Consolas</family>
    <family>Lucida Console</family>
    <family>Bitstream Vera Sans Mono</family>
    <family>mono</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- A family no font has, and that no alias above made generic, falls
       back to sans-serif. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- The generic families. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <include ignore_missing="yes">conf.d</include>
  <include ignore_missing="yes" prefix="xdg">fontconfig/fonts.conf</include>
</fontconfig>
