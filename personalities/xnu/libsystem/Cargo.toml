# Poly's own libSystem.B.dylib and its sub-libraries (ADR 0258): real
# Mach-O dylibs built from Rust for x86_64-apple-darwin with -Zbuild-std
# and linked by rust-lld's Mach-O flavour (`cargo xtask libsystem`). Its
# own workspace, like ntdll's. One feature per dylib: each build compiles
# that library's module only; the logic lives in crates/poly-libsystem.
# No third-party crates.
[workspace]

[package]
name = "libsystem"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "libsystem"
crate-type = ["staticlib"]

[features]
system = []
kernel = []
platform = []
c = []
malloc = []
pthread = []
dyld = []
m = []
info = []
compiler_rt = []

[dependencies]
poly-libsystem = { path = "../../../crates/poly-libsystem" }
poly-libm = { path = "../../../crates/poly-libm" }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
debug = false

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
