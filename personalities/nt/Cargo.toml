[package]
name = "poly-personality-nt"
description = "NT personality: Windows NT system service ABI, object, memory and section services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
poly-abi.workspace = true
# The console host's logic (ADR 0080).
poly-console.workspace = true
# Socket types of the kernel's TCP/IP stack, and Winsock's protocol for
# `\Device\Afd` (ADR 0095).
poly-net.workspace = true
poly-winsock.workspace = true
poly-ntobj.workspace = true
poly-pe.workspace = true
poly-registry.workspace = true
poly-security.workspace = true
poly-seh.workspace = true
# NT file I/O (ADR 0067) runs on the VFS.
poly-vfs.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Test images: a stand-in for our ntdll with its three entry points.
poly-ldr.workspace = true
