[package]
name = "msvcrt"
description = "Our msvcrt.dll (ADR 0084): the classic system C runtime, sharing poly-win32-crt with ucrtbase.dll"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "msvcrt"
crate-type = ["cdylib"]

[dependencies]
poly-win32-rt = { path = "../rt" }
poly-win32-crt = { path = "../crt" }
poly-crt = { path = "../../../../crates/poly-crt" }
poly-cxxeh = { path = "../../../../crates/poly-cxxeh" }

[build-dependencies]
poly-crt = { path = "../../../../crates/poly-crt" }

[lints]
workspace = true
