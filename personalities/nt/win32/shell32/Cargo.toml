[package]
name = "shell32"
description = "Our shell32.dll (ADR 0155, 0223): command lines, known folders, shell items, IFileOperation, ShellExecuteExW; the rest of shell32 is polystub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "shell32"
crate-type = ["cdylib"]

[dependencies]
poly-win32-rt = { path = "../rt" }
poly-kernelbase = { path = "../../../../crates/poly-kernelbase" }
poly-com = { path = "../../../../crates/poly-com" }
poly-lnk = { path = "../../../../crates/poly-lnk" }
poly-win32k = { path = "../../../../crates/poly-win32k" }

[lints]
workspace = true
