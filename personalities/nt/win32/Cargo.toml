# Our Win32 DLLs above ntdll (ADR 0079): kernelbase.dll and kernel32.dll,
# real PE DLLs built from Rust for x86_64-pc-windows-msvc like ntdll (ADR
# 0071), plus k32test.exe and contest.exe (ADR 0080), the programs the
# kernel's ring-3 tests run. One workspace, so `cargo xtask` builds
# core/alloc for the Windows target once for all of them. advapi32.dll
# and a32test.exe (ADR 0083) are built here too, and the first functions of
# user32.dll and oleaut32.dll (ADR 0087). No third-party crates:
# only this repo's host-tested logic and core/alloc.
[workspace]
resolver = "3"
members = ["rt", "kernelbase", "kernel32", "k32test", "contest", "advapi32", "a32test", "crt", "ucrtbase", "msvcrt", "crttest", "crtloctest", "user32", "oleaut32"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
