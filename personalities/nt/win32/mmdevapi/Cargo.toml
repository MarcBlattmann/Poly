[dependencies]
poly-win32-rt = { path = "../rt" }
poly-com = { path = "../../../../crates/poly-com" }
poly-kernelbase = { path = "../../../../crates/poly-kernelbase" }
poly-audio = { path = "../../../../crates/poly-audio" }

[lints]
workspace = true
