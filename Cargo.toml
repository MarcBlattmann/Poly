# Host workspace: everything that builds and tests on a normal machine.
#
# The kernel lives in its own workspace under `kernel/` because it only builds
# for the bare-metal target (x86_64-unknown-none). Use `cargo xtask` to build,
# run and test both together.
[workspace]
resolver = "3"
members = [
    "crates/poly-abi",
    "crates/poly-acpi",
    "crates/poly-backtrace",
    "crates/poly-binfmt",
    "crates/poly-block",
    "crates/poly-bpf",
    "crates/poly-console",
    "crates/poly-crt",
    "crates/poly-crypto",
    "crates/poly-elf",
    "crates/poly-ext2",
    "crates/poly-cpio",
    "crates/poly-bochs-vbe",
    "crates/poly-gfx",
    "crates/poly-heap",
    "crates/poly-input",
    "crates/poly-irq",
    "crates/poly-kernelbase",
    "crates/poly-ldr",
    "crates/poly-line",
    "crates/poly-mem",
    "crates/poly-ntobj",
    "crates/poly-net",
    "crates/poly-pagecache",
    "crates/poly-paging",
    "crates/poly-pci",
    "crates/poly-pe",
    "crates/poly-procfs",
    "crates/poly-random",
    "crates/poly-registry",
    "crates/poly-rtc",
    "crates/poly-rtl",
    "crates/poly-sched",
    "crates/poly-security",
    "crates/poly-seh",
    "crates/poly-smp",
    "crates/poly-term",
    "crates/poly-tty",
    "crates/poly-unix",
    "crates/poly-virtio",
    "crates/poly-virtio-blk",
    "crates/poly-virtio-net",
    "crates/poly-vdso",
    "crates/poly-vm",
    "crates/poly-vfs",
    "crates/poly-wincrypt",
    "crates/poly-x509",
    "personalities/linux",
    "personalities/nt",
    "personalities/xnu",
    "tools/coverage",
    "tools/pipeline",
    "tools/xtask",
]
exclude = ["kernel", "personalities/nt/ntdll", "personalities/nt/win32", "tests/windows/support", "tools/wintrace"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MarcBlattmann/Poly"
rust-version = "1.97"

[workspace.dependencies]
poly-abi = { path = "crates/poly-abi" }
poly-acpi = { path = "crates/poly-acpi" }
poly-backtrace = { path = "crates/poly-backtrace" }
poly-binfmt = { path = "crates/poly-binfmt" }
poly-block = { path = "crates/poly-block" }
poly-bpf = { path = "crates/poly-bpf" }
poly-console = { path = "crates/poly-console" }
poly-crt = { path = "crates/poly-crt" }
poly-crypto = { path = "crates/poly-crypto" }
poly-elf = { path = "crates/poly-elf" }
poly-ext2 = { path = "crates/poly-ext2" }
poly-cpio = { path = "crates/poly-cpio" }
poly-bochs-vbe = { path = "crates/poly-bochs-vbe" }
poly-gfx = { path = "crates/poly-gfx" }
poly-heap = { path = "crates/poly-heap" }
poly-input = { path = "crates/poly-input" }
poly-irq = { path = "crates/poly-irq" }
poly-kernelbase = { path = "crates/poly-kernelbase" }
poly-ldr = { path = "crates/poly-ldr" }
poly-line = { path = "crates/poly-line" }
poly-mem = { path = "crates/poly-mem" }
poly-ntobj = { path = "crates/poly-ntobj" }
poly-net = { path = "crates/poly-net" }
poly-pagecache = { path = "crates/poly-pagecache" }
poly-paging = { path = "crates/poly-paging" }
poly-pci = { path = "crates/poly-pci" }
poly-pe = { path = "crates/poly-pe" }
poly-procfs = { path = "crates/poly-procfs" }
poly-random = { path = "crates/poly-random" }
poly-registry = { path = "crates/poly-registry" }
poly-rtc = { path = "crates/poly-rtc" }
poly-rtl = { path = "crates/poly-rtl" }
poly-sched = { path = "crates/poly-sched" }
poly-security = { path = "crates/poly-security" }
poly-seh = { path = "crates/poly-seh" }
poly-smp = { path = "crates/poly-smp" }
poly-term = { path = "crates/poly-term" }
poly-tty = { path = "crates/poly-tty" }
poly-unix = { path = "crates/poly-unix" }
poly-virtio = { path = "crates/poly-virtio" }
poly-virtio-blk = { path = "crates/poly-virtio-blk" }
poly-virtio-net = { path = "crates/poly-virtio-net" }
poly-vdso = { path = "crates/poly-vdso" }
poly-vm = { path = "crates/poly-vm" }
poly-vfs = { path = "crates/poly-vfs" }
poly-wincrypt = { path = "crates/poly-wincrypt" }
poly-x509 = { path = "crates/poly-x509" }
poly-personality-linux = { path = "personalities/linux" }
poly-personality-nt = { path = "personalities/nt" }
poly-personality-xnu = { path = "personalities/xnu" }
libc = "0.2.177"
rustc-demangle = "0.1.28"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
