# Host workspace: everything that builds and tests on a normal machine.
#
# The kernel lives in its own workspace under `kernel/` because it only builds
# for the bare-metal target (x86_64-unknown-none). Use `cargo xtask` to build,
# run and test both together.
[workspace]
resolver = "3"
members = [
    "crates/poly-abi",
    "crates/poly-acpi",
    "crates/poly-backtrace",
    "crates/poly-binfmt",
    "crates/poly-block",
    "crates/poly-heap",
    "crates/poly-irq",
    "crates/poly-mem",
    "crates/poly-paging",
    "crates/poly-pci",
    "crates/poly-sched",
    "crates/poly-virtio",
    "crates/poly-virtio-blk",
    "personalities/linux",
    "personalities/nt",
    "personalities/xnu",
    "tools/coverage",
    "tools/xtask",
]
exclude = ["kernel"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MarcBlattmann/Poly"
rust-version = "1.97"

[workspace.dependencies]
poly-abi = { path = "crates/poly-abi" }
poly-acpi = { path = "crates/poly-acpi" }
poly-backtrace = { path = "crates/poly-backtrace" }
poly-binfmt = { path = "crates/poly-binfmt" }
poly-block = { path = "crates/poly-block" }
poly-heap = { path = "crates/poly-heap" }
poly-irq = { path = "crates/poly-irq" }
poly-mem = { path = "crates/poly-mem" }
poly-paging = { path = "crates/poly-paging" }
poly-pci = { path = "crates/poly-pci" }
poly-sched = { path = "crates/poly-sched" }
poly-virtio = { path = "crates/poly-virtio" }
poly-virtio-blk = { path = "crates/poly-virtio-blk" }
poly-personality-linux = { path = "personalities/linux" }
poly-personality-nt = { path = "personalities/nt" }
poly-personality-xnu = { path = "personalities/xnu" }
rustc-demangle = "0.1.28"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
