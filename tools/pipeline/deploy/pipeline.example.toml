# Configuration of the agent pipeline loop (`cargo xtask pipeline loop`).
#
# Looked up in this order: --config FILE, $POLY_PIPELINE_CONFIG,
# /etc/poly-pipeline.toml, /srv/poly/runner/pipeline.toml,
# ~/.config/poly/pipeline.toml. setup.sh installs this file as
# /srv/poly/runner/pipeline.toml and the systemd unit points
# POLY_PIPELINE_CONFIG at it. Every key is optional; the values below are
# the defaults except where a comment says otherwise. Unknown keys are
# errors. See docs/AGENT_PIPELINE.md and ADR 0056.

[loop]
max_parallel = 2          # entries in flight at once (default 1; 2 suits 4 cores / 15 GB)
max_cycles = 5            # red cycles before an entry goes to the human queue
spec_attempts = 2         # spec agent sessions that fail or commit nothing before the human queue
spec_cycles = 2           # failed spec checks (CI red, incomplete spec) sent back to the spec agent
                          # with feedback before the human queue (0: straight to the human queue)
max_errors = 8            # infrastructure errors in a row before the human queue
max_open_prs = 10         # no new entries while this many pipeline PRs wait for a merge
max_refresh = 3           # merges of main into a conflicting PR before the human queue
os = "linux"              # the work queue: `pipeline next --os linux --layer syscall`
layer = "syscall"
entries = []              # only ids starting with one of these, e.g. ["linux/syscall/x86_64/"]
exclude = []              # never ids starting with one of these
idle_secs = 900           # nothing to do: look again after this long
limit_pause_secs = 1800   # a usage limit without a reset time in the message: pause this long
poll_secs = 600           # how often to look at a PR waiting for its merge (and at main, for updates)
self_update = true        # main changed tools/pipeline/, tools/xtask/, Cargo.lock or rust-toolchain.toml:
                          # build the new code, let the steps in progress end, exit 10; systemd restarts it

[paths]
repo = "/srv/poly/runner/repo"         # the runner's checkout of main (user `server`)
worktrees = "/srv/poly/runner/work"    # w0, w1, ...: where the runner checks branches out
hub = "/srv/poly/git/poly.git"         # bare repository the role checkouts fetch from
heldout = "/srv/poly/heldout"          # the held-out store (never the implementer's)
inbox = "/srv/poly/inbox"              # hand-off bundles and feedback for the implementer
spec_inbox = "/srv/poly/spec-inbox"    # feedback for the spec agent (the implementer cannot read it)
state_dir = "/srv/poly/runner/state"   # per-entry state files, locks, pauses, command logs
log_file = "/srv/poly/runner/log/pipeline.log"   # "" for stdout (journald) only
human_queue = "/srv/poly/runner/human-queue.md"
deploy_stamp = "/srv/poly/bin/deployed.sha256"   # written by setup.sh: what it installed last

[git]
remote = "origin"         # GitHub, where PRs are opened
base_branch = "main"
author = ""               # "Name <email>" for the loop's own commits; "" uses git's configuration

[tools]
cargo = "cargo"
gh = "gh"

[github]
open_prs = true           # false: push the branch to GitHub and stop there
auto_merge = true         # `gh pr merge --auto --merge`: merges once the required checks pass
push_human_branches = true   # push the branches of human-queue entries to GitHub for the owner

[spec]
agent = "spec-claude-1"
# The fixed wrapper, as the role's user; the loop appends `sync ...` or `run ...`.
command = ["sudo", "-n", "-u", "polyspec", "/srv/poly/bin/poly-role", "spec"]
model = ""                # passed as --model to `pipeline role` ("" = the preset's default)
repo = "/srv/poly/spec/repo"
ci = true                 # run `cargo xtask ci` on the spec branch before the hand-off

[implementer]
agent = "impl-claude-1"   # must differ from spec.agent
command = ["sudo", "-n", "-u", "polyimpl", "/srv/poly/bin/poly-role", "implementer"]
model = ""
repo = "/srv/poly/impl/repo"
# Paths the implementer may change (a trailing / means everything below).
allowed_paths = [
    "personalities/",
    "crates/",
    "kernel/src/",
    "Cargo.toml",
    "Cargo.lock",
    "kernel/Cargo.toml",
    "kernel/Cargo.lock",
]

[safety]
extra_forbidden = []      # more paths no agent may change, on top of the built-in list

[notify]
# Run with `sh -c` when an entry goes to the human queue or a PR is opened,
# with POLY_EVENT (human|pr), POLY_ENTRY and POLY_MESSAGE set. Examples:
#   "curl -s -d \"$POLY_EVENT $POLY_ENTRY: $POLY_MESSAGE\" https://ntfy.sh/<your-topic>"
#   "gh issue create --title \"pipeline: $POLY_ENTRY\" --body \"$POLY_MESSAGE\""
command = ""
