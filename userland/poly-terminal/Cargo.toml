[package]
name = "poly-terminal"
description = "Poly's own terminal emulator (ADR 0134), a native Poly program on poly-rt: a Wayland window in the Alpine Shell look, poly-vt's VT/xterm emulation in Geist Mono, a pseudo-terminal from the Linux personality's /dev/ptmx running the user's shell. This is its code, tested on the host; userland/native/terminal builds the program."
