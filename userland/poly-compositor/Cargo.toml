[package]
name = "poly-compositor"
description = "Poly's Wayland compositor and desktop, a native Poly program on poly-rt (ADR 0125): poly-wayland's server on a Unix socket, on the screen through DRM/KMS page flips (vsync) or /dev/fb0, with evdev input and Poly's shell (--desktop), or off-screen. This is its code, tested on the host; userland/native/compositor builds the program."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

