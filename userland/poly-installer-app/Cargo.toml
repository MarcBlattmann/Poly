[package]
name = "poly-installer-app"
description = "Poly's installer (ADR 0132, 0173), a native Poly program on poly-rt: a small Wayland window in the Alpine Shell look that says what a package file is and, at one click, has the distribution's own apt and dpkg install it with its dependencies (poly-pkg's model). This is its code, tested on the host; userland/native/installer builds the program."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
poly-app.workspace = true
poly-input.workspace = true
poly-pkg.workspace = true
poly-rt.workspace = true
poly-shell.workspace = true
poly-wayland.workspace = true

[lints]
workspace = true
